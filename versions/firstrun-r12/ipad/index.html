/* Tokens, header, rail, tan bar, buttons and cards: copied from Today v4 (C-083) / Groceries v3 (C-071).
   Setup card, story column, fields and radio cards: copied from Entry (C-090). */
:root{
  --page:#EDE5D8; --card:#FAF6EE; --panel:#F6F2E9; --panel-alt:#F1E8DA;
  --header:#6B3E14; --subbar:#E4D3B3; --hdr-text:#FAF4EB; --subbar-date:#5C3D0A; --subbar-2:#7A5030;
  --ink:#1E1E1C; --ink2:#54524A; --muted:#605E55; --line:#8A8478;
  --sage:#8FAF8A; --sage-dark:#1F3A1C; --sage-light:#E4EDE2; --sage-text:#4B6947;
  --amber:#C8943A; --amber-light:#F5ECD8; --amber-text:#7E5C22;
  --urgent-bg:#F5E4E4; --urgent-text:#5C1A1A; --urgent-border:#8E3131;
  --chip:#E4D9C6; --chip-on:#B7D0B0; --chip-warm:#EFE4CC; --chip-warm-edge:#988048;
  --row-hover:#F0EEE3; --track:#DDD5C5; --folder-line:#D2C6B0;
  --c-muted:96 94 85; --c-ink2:84 82 74;
  --m-pat:#8A5A3C; --m-sam:#55714D; --m-jo:#4F6A86;
  --bcard:rgba(0,0,0,.09); --brow:rgba(0,0,0,.06); --scrim:rgba(0,0,0,.4);
  --shadow-card:0 1px 2px rgba(45,33,22,.055),0 6px 16px rgba(45,33,22,.055);
  --shadow-pop:0 4px 14px rgba(45,33,22,.16); --shadow-float:0 16px 48px rgba(45,33,22,.2);
  --hover:inset 0 0 0 100px rgba(30,30,28,.04); --press:inset 0 0 0 100px rgba(30,30,28,.16);
  --on-dark-hover:rgba(250,244,235,.08); --on-dark-press:rgba(250,244,235,.16);
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --ease:cubic-bezier(.25,.46,.45,.94);
  --mb:40px;
}
.nobar{--mb:0px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--page)}
body{color:var(--ink);font:400 15px/1.45 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
input{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:16px;height:16px}
svg.ni{display:block;overflow:visible}
:focus-visible{outline:2px solid var(--sage-text);outline-offset:2px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes shim{to{background-position:-200% 0}}
@keyframes ringin{from{box-shadow:0 0 0 10px rgba(75,105,71,0)}to{box-shadow:0 0 0 4px rgba(75,105,71,.28)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01s!important;transition-duration:.01s!important}.btn:active{transform:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* one thin themed scroll bar (DESIGN 4.10) */
.scroll,.sheet .sb{scrollbar-width:thin;scrollbar-color:rgb(var(--c-muted) / .35) transparent}
.scroll::-webkit-scrollbar,.sheet .sb::-webkit-scrollbar{width:12px;height:12px}
.scroll::-webkit-scrollbar-thumb,.sheet .sb::-webkit-scrollbar-thumb{background:rgb(var(--c-muted) / .35);border:3px solid transparent;background-clip:padding-box;border-radius:999px}
.scroll::-webkit-scrollbar-track{background:transparent}

.top::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(0,0,0,.10));pointer-events:none}
.top>*{position:relative;z-index:1}
/* round 4: the app's own wordmark (C-083 / C-092 / C-093, DESIGN 2.5.5): Plex italic, no serif (Q14) */
.wordmark{font-style:italic;font-weight:600;font-size:22px}
.top .sp{flex:1}
.av{display:inline-grid;place-items:center;border-radius:50%;font-weight:600;color:var(--hdr-text);flex:none}
.av.hdr{width:28px;height:28px;font-size:12px;background:var(--m-pat);box-shadow:0 0 0 2px var(--hdr-text)}
/* the "?" help door (Walk 6 owns its look; drawn here only so setup can point at it) */
.hq{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--hdr-text)}
.hq:hover{background:var(--on-dark-hover)}
.hq svg{width:22px;height:22px}
.bar{background:var(--subbar);border-bottom:1px solid var(--brow);display:flex;height:46px;flex:none;position:relative}
.bar .in{display:flex;align-items:center;gap:12px;width:100%;max-width:1212px;margin:0 auto;padding:0 16px;min-width:0}
.bar .ttl{font-style:normal;font-weight:600;font-size:16px;color:var(--subbar-date);white-space:nowrap}
/* C-091: "‹ Page name › This page" (a small chevron after the back button) */
.sepc{width:14px;height:14px;color:var(--subbar-2);opacity:.6;flex:none;margin:0 -4px 0 -10px}
.bar .bb.sec{background:var(--sage);color:var(--ink)}
.bar .meta{font-size:13px;color:var(--subbar-2);padding-left:12px;border-left:1px solid var(--chip-warm-edge);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bar .sp{flex:1}
.bar .btn.icon{width:36px;height:36px;color:var(--subbar-date)}
.bar .bb{height:34px;padding:0 14px;font-size:15px}
/* C-091: back in the tan bar is "‹ Page name", one quiet text button */
.bar .back{display:inline-flex;align-items:center;gap:2px;height:36px;padding:0 8px 0 2px;border-radius:8px;color:var(--subbar-2);font-size:15px;font-weight:500;white-space:nowrap}
.bar .back:hover{box-shadow:var(--hover)}
.bar .back svg{width:18px;height:18px}

/* ---------- kit Button: 44 tall (Entry cards 52), Title Case, press = .97 + overlay ---------- */
.btn{height:44px;border-radius:8px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:500;font-size:16px;white-space:nowrap;transition:transform 50ms var(--ease),box-shadow .2s var(--ease),background-color .2s var(--ease),color .2s var(--ease);position:relative;flex:none}
.btn:active{transform:scale(.97);box-shadow:var(--press)}
.btn.pri{background:var(--sage-dark);color:var(--hdr-text)}.btn.pri:hover{box-shadow:inset 0 0 0 100px var(--on-dark-hover)}
.btn.sec{background:var(--sage);color:var(--ink)}.btn.sec:hover{box-shadow:var(--hover)}
.btn.cancel{background:transparent;border:1px solid var(--ink2);color:var(--ink)}.btn.cancel:hover{box-shadow:var(--hover)}
.btn.tan{background:var(--chip-warm);border:1px solid var(--chip-warm-edge);color:var(--ink)}.btn.tan:hover{box-shadow:var(--hover)}
.btn.icon{width:44px;padding:0;color:var(--ink2)}.btn.icon:hover{box-shadow:var(--hover)}
/* G14: every turned-off button is grey */
.btn.off{background:var(--chip)!important;color:var(--muted)!important;border-color:transparent!important;cursor:default}.btn.off:active{transform:none;box-shadow:none}
/* round 4 (DESIGN 4.2.11): a link that stands alone is a chevron link, no underline, 44 tall tap area */
.tl{display:inline-flex;align-items:center;gap:2px;min-height:44px;color:var(--sage-text);font-weight:600;border-radius:6px;padding:0;text-decoration:none}
.tl svg.i{width:16px;height:16px;stroke-width:2.4}
.tl:hover{color:var(--sage-dark)}
/* kit quiet text button (no fill, no border, no underline): Go to Today, Import a Recipe First */
.btn.ghost{background:transparent;color:var(--sage-text);font-weight:600;gap:2px}.btn.ghost svg.i{stroke-width:2.4}.btn.ghost:hover{box-shadow:var(--hover)}

/* ---------- setup: Entry's frame (C-090, decision 11) ---------- */
.setup{height:calc(100vh - var(--mb));height:calc(100dvh - var(--mb));margin-top:var(--mb);display:flex;flex-direction:column}
.setup .scroll{flex:1;min-height:0;overflow:auto}
.cols{width:100%}
.w2 .cols{display:flex;align-items:flex-start;justify-content:center;gap:64px;padding:40px 40px 64px}
.w2 .story{flex:1;max-width:430px;position:sticky;top:40px;padding-top:29px}
.story .eb[hidden]+h1{margin-top:0}
/* round 7 (panel 2 visual 5): the card starts 40 under the tan bar on every computer and iPad (phone 12), never centred */
.w2 .ccol{flex:1;max-width:470px}
.setup.w2 .bar .in{max-width:1044px;padding:0 40px}
.setup.one .bar .in{max-width:502px;padding:0 16px}
.setup.ph .bar .in{padding:0 8px 0 12px}
.one .cols{max-width:502px;margin:0 auto;padding:40px 16px 48px}
.one .story{display:none}
.ph .cols{padding:12px 12px 32px}
.eb{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);line-height:1.3}
.story h1{font-size:24px;line-height:1.2;font-weight:700;margin:8px 0 0;letter-spacing:-.005em;text-wrap:balance}
.story .spx{font-size:15px;line-height:1.45;color:var(--ink2);margin:8px 0 0;max-width:400px}
.steps{list-style:none;margin:20px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.steps li{display:flex;align-items:center;gap:12px;font-size:15px;color:var(--ink2);min-height:28px}
.steps li b{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:var(--ink2);align-self:flex-start;margin-top:4px}
/* round 10 (panel 3 fit 2): Today's Getting Started marks, same sizes: outline tick = set, ring with a dot = this step,
   empty ring = not yet; a dash in the ring only for skipped. No number discs, no strike-through. */
.steps li.done b{color:var(--sage-text)}
.steps li.done b svg{width:20px;height:20px}
.ring.sk{position:relative}.ring.sk::after{content:"";position:absolute;left:3px;right:3px;top:50%;height:1.7px;margin-top:-.85px;background:var(--ink2);border-radius:1px}
.steps li.cur{color:var(--ink);font-weight:600}
.steps li small{display:block;font-size:13px;color:var(--muted);font-weight:400}
/* round 7: one fixed foot on every step: button, 8, one reserved why-line, then 28 (phone 18), the same as the sides */
.scard{padding:28px;position:relative;transition:opacity .2s var(--ease)}
.ph .scard{padding:18px}
h2.t{font-size:30px;line-height:1.2;font-weight:700;letter-spacing:-.005em;text-wrap:balance}
.ph h2.t{font-size:26px}
.q{font-size:15px;line-height:1.45;color:var(--ink2);margin:6px 0 0;text-wrap:pretty}
.f{margin-top:20px}
.f>label,.lab2{display:block;font-size:13px;font-weight:500;color:var(--ink2);margin-bottom:6px}
.inp{width:100%;height:50px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:0 14px;font:400 16px var(--font);color:var(--ink);outline:none;transition:border-color .16s}
.inp:focus{border:2px solid var(--sage-text);padding:0 13px}
.inp::placeholder{color:#6E6A60}
.inp.zip{width:160px}
.fh{font-size:13px;color:var(--muted);margin-top:4px;min-height:19px}
.fh.why{color:var(--urgent-text)}
/* B3 stepper */
.stp{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;height:50px;background:var(--card)}
.stp button{width:48px;height:48px;display:grid;place-items:center;color:var(--ink2);border-radius:8px}
.stp button:hover{box-shadow:var(--hover)}
.stp output{min-width:44px;text-align:center;font-size:17px;font-weight:600}
.stprow{display:flex;align-items:center;gap:14px}.stprow .fh{margin:0;min-height:0}
.ph .stprow{flex-direction:column;align-items:flex-start;gap:4px}
/* B12 colour swatches (24 presets live; 12 drawn) */
.sw{display:flex;flex-wrap:wrap;gap:10px}
.sw button{width:36px;height:36px;border-radius:50%;position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.sw button.on::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--ink)}
.sw button svg{width:18px;height:18px;stroke:#fff;stroke-width:3;position:absolute;inset:9px;opacity:0}
.sw button.on svg{opacity:1}
/* plain Claude card (round 1 Q3 a): one card, full note one tap away */
.cc{margin-top:20px;border-radius:12px;background:var(--panel-alt);border:1px solid var(--bcard);padding:14px;display:flex;gap:12px}
.cc>svg{color:var(--ink2);margin-top:2px}
.cc b{display:block;font-weight:600;font-size:15px}
.cc p{font-size:14px;color:var(--ink2);margin-top:2px}
.cc .more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .2s var(--ease)}
.cc .more.open{grid-template-rows:1fr}
.cc .more>div{overflow:hidden}
.cc .more p{margin-top:8px}
.cc .tl{margin:0 0 -10px;font-size:14px}
/* radio cards (Entry's rectangles, never pills) */
.rcs{display:flex;flex-direction:column;gap:8px;margin-top:20px}
.rc{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);border-radius:10px;padding:12px 16px;background:var(--card);transition:background-color .2s var(--ease),border-color .2s var(--ease)}
.rc:hover{box-shadow:var(--hover)}
.rc .rd{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--ink2);margin-top:1px;display:grid;place-items:center}
.rc .rd::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--sage-dark);transform:scale(0);transition:transform .2s var(--ease)}
.rc.on{border-color:var(--sage-text);background:var(--sage-light)}
.rc.on .rd{border-color:var(--sage-dark)}.rc.on .rd::after{transform:none}
.rc .tx{flex:1;min-width:0}
.rc b{display:block;font-weight:600;font-size:16px}
.rc b em{font-style:normal;font-weight:500;font-size:14px;color:var(--sage-text);white-space:nowrap}
.rc b em::before{content:"";display:inline-block;width:1px;height:.95em;background:currentColor;opacity:.5;margin:0 8px;vertical-align:-2px}
.dev-ipad .rc b em{font-size:16px}
.rc b:has(em.wr){display:flex;flex-direction:column}.rc b em.wr{order:-1;font-size:13px;font-weight:600;margin:0 0 1px;line-height:1.3}.rc b em.wr::before{display:none}
.rc small{display:block;font-size:14px;color:var(--ink2);margin-top:2px}
.rc .xtra{display:block}
.rc .xtra>span{display:flex;flex-wrap:wrap;align-items:center;gap:0 12px;padding-top:6px}
.rc .xtra .tl{margin:-6px 0 -10px}
.btn.sm2{height:40px;font-size:15px;font-weight:600;padding:0 14px}
.rc .xn{font-size:13px;color:var(--muted)}
.rc .impok{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--sage-dark);font-weight:500}
/* card foot: Back left, the one dark button right; a why-line under it keeps its room (no jump) */
.cfoot{display:flex;align-items:center;gap:12px;margin-top:20px;padding-top:16px;border-top:1px solid var(--brow)}
.cfoot .sp{flex:1}
.cfoot .btn{height:52px;font-size:16px;font-weight:600;padding:0 22px}

.ld .gt{--a:16%;--b:84%;color:transparent!important;-webkit-box-decoration-break:clone;box-decoration-break:clone;
  background:radial-gradient(circle at 5px calc(var(--a) + 5px),var(--track) 4.5px,#0000 5px) no-repeat,radial-gradient(circle at calc(100% - 5px) calc(var(--a) + 5px),var(--track) 4.5px,#0000 5px) no-repeat,
  radial-gradient(circle at 5px calc(var(--b) - 5px),var(--track) 4.5px,#0000 5px) no-repeat,radial-gradient(circle at calc(100% - 5px) calc(var(--b) - 5px),var(--track) 4.5px,#0000 5px) no-repeat,
  linear-gradient(var(--track),var(--track)) 0 50%/100% calc(var(--b) - var(--a) - 10px) no-repeat,linear-gradient(var(--track),var(--track)) 50% 50%/calc(100% - 10px) calc(var(--b) - var(--a)) no-repeat}

.sheet .sb{padding:22px 24px 8px}

.sheet p{font-size:15px;color:var(--ink2);margin-top:8px}
.sheet .ft{display:flex;flex-direction:column;gap:8px;padding:16px 24px 22px}
.sheet .ft .btn{width:100%;height:48px}
.toasts{position:fixed;right:24px;bottom:24px;display:flex;flex-direction:column-reverse;gap:8px;align-items:flex-end;z-index:60;pointer-events:none;max-width:380px}
.toast{background:var(--ink);color:var(--page);border-radius:12px;padding:12px 16px;min-height:48px;font-size:15px;pointer-events:auto;animation:rise .2s var(--ease);box-shadow:var(--shadow-pop)}
.toast .tm{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.75;margin-right:6px}

/* ---------- mockup-only state bar (not part of the app) ---------- */
.mock{position:fixed;left:0;right:0;top:0;height:40px;z-index:70;background:var(--ink);color:var(--page);display:flex;gap:4px;align-items:center;font-size:13px;padding:0 8px}
.nobar .mock{display:none}
.mock .tag{font-size:11px;font-weight:700;letter-spacing:.08em;background:#E8D6B2;color:var(--ink);border-radius:4px;padding:2px 6px;flex:none}
.mock button{height:30px;padding:0 10px;border-radius:8px;color:var(--page);white-space:nowrap;flex:none}
.mock button:hover{background:rgba(250,244,235,.12)}
.mock .cur{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.mock .mm{box-shadow:inset 0 0 0 1px rgba(250,244,235,.35)}
.mpop{display:none;position:fixed;left:8px;top:44px;z-index:71;background:var(--ink);color:var(--page);border-radius:10px;padding:8px;box-shadow:var(--shadow-pop);max-height:calc(100vh - 56px);overflow:auto;width:min(720px,calc(100vw - 16px));columns:3 200px;column-gap:8px}
.mpop.open{display:block}
.mpop h4{margin:4px 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#E8D6B2;break-after:avoid}
.mpop button{display:block;width:100%;text-align:left;height:30px;padding:0 8px;border-radius:6px;color:var(--page);font-size:13px;break-inside:avoid}
.mpop button.on{background:var(--page);color:var(--ink);font-weight:600}
.mpop button:hover{background:rgba(250,244,235,.12)}
.mpop button.on:hover{background:var(--page)}
.mnote{position:fixed;left:12px;bottom:12px;z-index:69;max-width:340px;background:#FFF6B8;border:1px solid #E6D774;border-radius:6px;padding:8px 10px;font-size:12px;line-height:1.4;color:#3d3500;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.mnote:empty,.nobar .mnote{display:none}

/* ---------- narrower screens: slim rail under 1100, tab bar under 640 (as Today v4) ---------- */
.tabbar{display:none}
@media (max-width:1100px){
  .app{grid-template-columns:64px minmax(0,1fr)}
  .rail{padding:12px 0;align-items:center}
  .rail .cap,.rail .ri{font-size:0;gap:0;justify-content:center;padding:0;width:44px;height:44px}
  .rail hr{margin:4px 0;width:44px}
  .rail .ri.slimit{display:none}.rail .ri.open{display:flex}
  .wrap{grid-template-columns:minmax(0,1fr);max-width:752px;padding:20px 24px 96px}
  .bar .in,.dev-desktop .bar .in{max-width:752px;padding:0 20px 0 24px}
  .ways{grid-template-columns:1fr;max-width:520px}
}
@media (max-width:640px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:50px 1fr 56px}
  .sample .bar .meta .lg{display:none}
  .app>.rail{display:none}
  .tabbar{display:flex;grid-column:1/-1;background:var(--card);border-top:1px solid var(--bcard);align-items:center;padding:0 4px}
  .tabbar .tb{flex:1;display:flex;justify-content:center;align-items:center;height:56px}
  .tabbar .tb>span{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:500;color:var(--ink2);min-width:56px;padding:4px 8px;border-radius:8px}
  .tabbar .tb.on>span{background:var(--sage-light);color:var(--sage-text)}
  .tabbar .tb svg.ni{width:24px;height:24px}
  .tabbar .capslot{width:78px;display:flex;justify-content:center;align-self:flex-start}
  .tabbar .capc{width:60px;height:60px;border-radius:50%;background:var(--sage);display:grid;place-items:center;margin-top:-18px;box-shadow:var(--shadow-card)}
  .tabbar .capc svg.ni{width:32px;height:32px}
  .top{padding:0 12px}
  .bar .in{padding:0 8px 0 12px}
  .wrap{padding:12px 12px 32px}
  .ch{padding:14px 16px 0}
  .state-msg.emp{padding:24px 16px}.emp h2{font-size:26px}
  .emp .acts .btn{width:100%}
  .toasts{left:8px;right:8px;bottom:72px;max-width:none;align-items:stretch}
  .setup~.toasts,.toasts.low{bottom:16px}
  .scrim{place-items:end center;padding:40px 0 0}
  .sheet{width:100vw;border-radius:16px 16px 0 0}
  /* round 5: on a phone the Show Me card stays on screen above the tab bar, so the way back is never below the fold */
  .sample .wrap{padding:16px 16px 240px}
  .ck .cfoot2 .btn{max-width:none}
  .ck .scroll{padding:12px}
  .ck .ghd{padding:14px 16px 12px}.ck .ghd h2{font-size:28px}.ck .srv,.ck .ing{padding-left:16px;padding-right:16px}
  .tip{left:12px;right:12px;bottom:68px;width:auto}
  .hw{gap:12px}.hw .tile{width:40px;height:40px}
  .mock .tag{display:none}
}
/* iPad: the kit TABLET type tier (body 17, names 18, eyebrows 14) */
.dev-ipad body{font-size:17px}
.dev-ipad .q,.dev-ipad .rc small,.dev-ipad .hw small,.dev-ipad .story .spx,.dev-ipad .rr .tx b,.dev-ipad .card.q .qt,.dev-ipad .emp p,.dev-ipad .cc p{font-size:17px}
.dev-ipad .rc b,.dev-ipad .hw b{font-size:18px}
.dev-ipad .eyebrow{font-size:14px}
.dev-ipad .cc{padding:12px 14px}
.dev-ipad h2.t{font-size:32px}.dev-ipad .story h1{font-size:26px}
.dev-ipad .emp h2{font-size:32px}
/* Kitchen iPad (C-083's own frame, kawake / knoplan): no rail, "Pick Your Name" in the header, "⋯ Menu" in the tan bar,
   the same Today parts with bigger type; quiet cards stack the label over the line (never cut) */
.kx{grid-template-columns:1fr!important}
.kx>.rail,.kx>.tabbar{display:none!important}
.who-btn{height:44px;border-radius:8px;padding:0 6px 0 10px;display:inline-flex;align-items:center;gap:10px;color:var(--hdr-text);font-size:15px;font-weight:600}
.who-btn:hover{background:var(--on-dark-hover)}
.who-btn .av{width:28px;height:28px;box-shadow:0 0 0 2px var(--hdr-text);background:transparent}.who-btn .av svg{width:16px;height:16px}
.kx .bar .in{max-width:none;padding:0 20px}
.kx .bar .ttl{font-size:20px}.kx .bar .meta{font-size:17px}
.kx .bar .mbtn{width:auto;height:44px;padding:0 8px;gap:8px;font-size:18px;font-weight:500;color:var(--ink2)}
.kx .wrap{grid-template-columns:minmax(0,1fr) 420px;max-width:none;padding:24px 24px;gap:20px}
.kx .col{gap:16px}
/* C-083 knoplan: the empty meals card fills the left column to the right column's foot */
@media (min-width:1101px){.kx .wrap{align-items:stretch}.kx .wrap>.col:first-child>.card{flex:1}}
.kx .eyebrow{font-size:16px}
.kx .ch{padding:16px 24px 0}.kx .ch .cnt{font-size:18px}
.kx .emp h2{font-size:32px}.kx .emp p{font-size:22px;max-width:520px}
.kx .emp .acts .btn{height:60px;font-size:22px;padding:0 28px}
.kx .meals{display:flex;flex-direction:column}.kx .meals .emp{flex:1}
.kx .kline{display:block;padding:16px 24px 18px;border-top:1px solid var(--brow);font-size:18px;color:var(--ink2);text-align:center}
.kx .card.q{flex-direction:column;align-items:flex-start;gap:4px;min-height:0;padding:14px 20px 16px}
.kx .card.q .qt{font-size:22px;color:var(--ink)}
.kx .card.q{position:relative}.kx button.card.q{padding-right:52px}.kx .card.q .chev{position:absolute;right:20px;top:50%;margin-top:-10px}
.kx .dsq{min-height:56px;font-size:16px}
.kx .wkline{font-size:18px}
@media (max-width:1100px){.kx .wrap{grid-template-columns:minmax(0,1fr);max-width:752px}}

const OFFWHY='Offline. Reconnect, or tap Finish Later.', OFFWHY2='Offline. Your typing is kept here.', FAILWHY='That didn\'t save. Press Next to try again.';
function step2(){
  const has=!!(U.store.trim()||U.zip.trim()), off=OFFLINE();
  const btn=off?`<button class="btn off" id="nextb" aria-disabled="true">${has?'Next':'Skip for Now'}</button>`
    :`<button class="btn ${has?'pri':'cancel'}" id="nextb" data-a="next">${has?'Next':'Skip for Now'}</button>`;
  const skip=`<button class="btn ghost" id="skipb" data-a="skip" ${has&&!off?'':'style="visibility:hidden" aria-hidden="true" tabindex="-1"'}>Skip for Now</button>`;
  const why=off?(has?OFFWHY2:OFFWHY):U.id==='s2_fail'?FAILWHY:'';
  return `<h2 class="t" id="ct" tabindex="-1">Where Do You Usually Shop?</h2><p class="q">We save it for your grocery list. You can skip this.</p>
   <div class="f"><label for="sn">Store name</label><input class="inp" id="sn" data-in="store" value="${U.store}" placeholder="Like Kroger or Aldi" autocomplete="off"></div>
   <div class="f"><label for="zp">ZIP code (optional)</label><input class="inp zip" id="zp" data-in="zip" value="${U.zip}" inputmode="numeric" placeholder="Like 60614" autocomplete="off"></div>
   <p class="q" style="margin-top:14px">You can set or change it later in House Rules.</p>
   ${foot(true,btn,why,off?'off':U.id==='s2_fail'?'bad':'',skip)}`;
}
function step3(){
  const lbl={later:'Next',shelf:'Start With One Shelf',whole:'Start the Whole Kitchen'}[U.kit];
  const rc=(v,t,s,rec)=>`<button class="rc ${U.kit===v?'on':''}" role="radio" aria-checked="${U.kit===v}" data-a="pick" data-g="kit" data-v="${v}"><span class="rd"></span><span class="tx"><b>${t}${rec?'<em>Recommended</em>':''}</b><small>${s}</small></span></button>`;
  return `<h2 class="t" id="ct" tabindex="-1">Want to Set Up Your Kitchen Now?</h2><p class="q">Tell SupperCraft what food is at home, so plans use it first.</p>
   <div class="rcs" role="radiogroup" aria-label="Set up your Kitchen">${rc('later','Not Right Now','Your Kitchen fills up as you put groceries away.',1)}${rc('shelf','Just One Shelf','About 2 minutes. Pick a shelf and say what\'s on it.')}${rc('whole','The Whole Kitchen','About 5 minutes, and you can talk instead of type.')}</div>
   ${foot(true,`<button class="btn pri" id="nextb" data-a="next">${lbl}</button>`,U.kit!=='later'?'You come back here when you finish.':'')}`;
}
function step4(){
  const none=!U.starters, saving=U.id==='s4_saving', failed=U.id==='s4_fail'&&U.rec==='starter';
  const rc=(v,t,s,rec,x='')=>`<div class="rc ${U.rec===v?'on':''}" role="radio" tabindex="0" aria-checked="${U.rec===v}" data-a="pick" data-g="rec" data-v="${v}"><span class="rd"></span><span class="tx"><b>${t}${rec?'<em>Recommended</em>':''}</b><small>${s}</small>${x}</span></div>`;
  const imp=U.imp
    ?`<span class="xtra"><span><span class="impok">${ic('checkc','i sm')}Lemon Chicken is in your book.</span><button class="tl" data-a="toast" data-t="Opens Import. You come back here when it's saved.">Import Another${ic('right','i')}</button></span></span>`
    :`<span class="xtra"><span><button class="tl" data-a="imp">Import One Now (optional)${ic('right','i')}</button></span></span>`;
  const back=U.id==='s4_kback'?`<div class="note ok" role="status">${ic('checkc','i sm')}<span><b>Fridge shelf saved, 8 foods.</b> One more step.</span></div>`:'';
  const lbl=failed?'Try Again':saving?'Saving':'Finish Setup';
  const why=failed?'That didn\'t work. Try again, or pick Bring My Own.':saving?'':'';
  const btn=saving?`<button class="btn off" id="nextb" aria-disabled="true" style="min-width:150px">Saving</button>`:`<button class="btn pri" id="nextb" data-a="finish" style="min-width:150px">${lbl}</button>`;
  return `${back}<h2 class="t" id="ct" tabindex="-1">Start With Some Recipes?</h2><p class="q">These are the dinners you can pick from when you plan.${none?' There are no starter recipes yet.':''}</p>
   <div class="rcs" role="radiogroup" aria-label="Recipes to start with">${none?'':rc('starter','Start With Starter Recipes',`${U.starters} everyday dinners to plan with. You can delete any of them in Recipes.`,1)}
   ${rc('own','Bring My Own','Start with no recipes. Add yours from a website or photo. We can still suggest dinners.','',imp)}</div>
   ${foot(true,btn,why,failed?'bad':'')}`;
}

}

   Up next row above the four (not one of them). The receipt shows on arrival only. */
const STEPNAME=['','Household','Store','Kitchen','Recipes'];
function gsCard(mode,step=3){
  const later=mode==='resume', rcpt=mode==='resume'&&U.rcpt, named=U.id!=='t_later0', shelf=U.id==='t_shelf';
  const rows=later?[['Make your household',named?1:0,named?'':'s1'],['Plan your first week',0,'plan'],['Tell us what\'s in your Kitchen',4,'','Part of Finish setup'],['Invite people',0,'']]
    :[['Make your household',1],['Plan your first week',2,'plan','Up next'],['Tell us what\'s in your Kitchen',shelf?1:0,'kit'],['Invite people',0,'']];
  const n=rows.filter(r=>r[1]===1).length;
  const r=rcpt?`<p class="rcpt ${named?'':'plain'}" role="status">${named?`<b>Saved.</b> Pick up at step ${step} from here when you're ready.`:`Your household still needs a name. Pick up at step 1 from here when you're ready.`}</p>`:'';
  const fin=later?`<div class="gsfin">${r}<button class="rr cur" data-a="resume" data-s="s${step}"><span class="ri2"><i class="ring now"></i></span><span class="tx"><b>${sk('Finish setup')}</b><small>${sk(SL('Up next',`Step ${step} of 4`,STEPNAME[step]))}</small></span>${ic('right','i chev')}</button></div>`:'';
  return `<section class="card gs" aria-label="Getting Started" ${U.rcpt||U.id==='t_later_off'?'data-arrive':''}>${fin}<div class="ch"><span class="eyebrow">Getting Started</span><span class="sp"></span><span class="cnt">${n} of 4 done</span></div><div class="rows2">${rows.map(([t,d,s,sub],i)=>
    d===1?`<div class="rr dn"><span class="ri2 ok">${ic('checkc')}</span><span class="tx"><b>${sk(t)}</b></span></div>`
    :d===4?`<div class="rr"><span class="ri2"><i class="ring"></i></span><span class="tx"><b>${sk(t)}</b><small>${sk(sub)}</small></span></div>`
    :d===2?`<button class="rr cur" data-a="go" data-s="${s}"><span class="ri2"><i class="ring now"></i></span><span class="tx"><b>${sk(t)}</b><small>${sk(sub)}</small></span>${ic('right','i chev')}</button>`
    :`<button class="rr" data-a="${s?(s[0]==='s'?'resume':'go'):'toast'}" data-s="${s}" data-t="Opens House Rules, Members, to invite by email"><span class="ri2"><i class="ring"></i></span><span class="tx"><b>${sk(t)}</b></span>${ic('right','i chev')}</button>`).join('')}</div></section>`;

    line='Each day can have a dinner. You pick them when you start a plan.';
    body=`<div class="wrap narrow"><section class="card"><div class="ch"><span class="eyebrow">${WEEK}</span><span class="sp"></span><span class="cnt">3 of 7 dinners</span></div><div style="padding:8px">${days.map(([d,m])=>`<div class="sday ${d==='Tue'?'ringed':''}" ${d==='Tue'?'id="ringed"':''}><span class="d">${d}</span>${m?`<b>${m}</b>`:`<span class="pick">No dinner yet</span>`}${d==='Tue'?coach(line):''}</div>`).join('')}</div></section></div>`;
  }else if(p==='groc'){
    line='This imports what this week\'s plan needs, like the list above. Food your Kitchen already has is left off.';
    body=`<div class="wrap narrow"><section class="card" style="overflow:hidden"><div class="gh">Produce</div>${[['2 lemons','Lemon Chicken'],['1 small cabbage','Fish Tacos']].map(([a,b])=>`<div class="gl"><span class="box"></span>${a}<small>${b}</small></div>`).join('')}<div class="gh">Seafood</div><div class="gl"><span class="box"></span>1 lb cod<small>Fish Tacos</small></div></section><div class="ringed" id="ringed" style="display:inline-flex"><button class="btn sec" tabindex="-1">${ic('plus','i sm')}Import a Plan's Groceries</button>${coach(line)}</div></div>`;
  }else if(p==='cook'){
    line='Cook shows one step at a time. Timers keep going if you leave the page.';
    body=`<div class="wrap narrow"><section class="card cstep"><div class="n">${SL('Step 2 of 6','Lemon Chicken')}</div><h2>Brown the chicken skin side down, about 6 minutes.</h2><div class="ringed" id="ringed" style="display:inline-flex"><button class="btn sec" tabindex="-1">${ic('timer','i sm')}Start 6 Min Timer</button>${coach(line)}</div><div class="nx"><div class="gh" style="padding:6px 0;background:none">Next steps</div>${[['3','Squeeze both lemons over the chicken.'],['4','Roast at 425°F for 25 minutes.'],['5','Rest 5 minutes.'],['6','Slice and serve.']].map(([k,t])=>`<div class="gl"><span class="k">Step ${k}</span>${t}</div>`).join('')}</div></section></div>`;
  }else{
    line='When it\'s made, mark it. Then rate it, so the next plan fits you better.';
    body=`<div class="wrap narrow"><section class="card cstep"><div class="n">Tonight</div><h2>Lemon Chicken</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><div class="ringed" id="ringed" style="display:inline-flex"><button class="btn sec" tabindex="-1">${ic('check','i sm')}Mark It Made</button>${coach(line)}</div><button class="btn tan" tabindex="-1">Save Leftovers</button></div><div class="nx"><div class="gh" style="padding:6px 0;background:none">Coming up</div>${[['Tue','Fish Tacos'],['Wed','Lentil Soup'],['Thu','Pasta Bake'],['Fri','Leftovers night']].map(([k,t])=>`<div class="gl"><span class="k">${k}</span>${t}</div>`).join('')}</div></section></div>`;
  }
  return appView(name==='History'?'History':name==='Cook'?'Today':name,bar,body,{cls:'sample'}).replace(/<nav class="(rail|tabbar)"/g,'<nav inert class="$1"').replace('<button class="hq"','<button inert class="hq"');
}

/* ---------- render ---------- */
function view(){
  const id=U.id;
  switch(id){
    case 's_load':return setupView(step1(),1,true);
    case 's_fail':return setupView(failCard(),0);
    case 's_off':return setupView(offCard(),2);
    case 's1':case 's1_empty':case 's1_note':return setupView(step1(),1);
    case 's2':case 's2_typed':return setupView(step2(),2);
    case 's3':case 's3_shelf':return setupView(step3(),3);
    case 's2_zip':case 's2_fail':return setupView(step2(),2);
    case 's4':case 's4_own':case 's4_kback':case 's4_kskip':case 's4_imp':case 's4_none':case 's4_saving':case 's4_fail':return setupView(step4(),4);
    case 'done':case 'done_own':case 'done_seen':return setupView(doneA(),5);
    case 'showme':case 'showme_g':case 'showme_c':case 'showme_a':return sampleView();
    /* round 4: nobody has chosen recipes yet, so the hero keeps C-083's plain line (decision 3's lines come after step 4) */
    case 't_later':case 't_resume':return todayView({gs:'resume',step:3,line:LINE_PLAIN});
    case 't_later1':return todayView({gs:'resume',step:2,line:LINE_PLAIN});
    case 't_later0':return todayView({gs:'resume',step:1,line:LINE_PLAIN});
    case 't_later_off':return todayView({gs:'resume',step:2,line:LINE_PLAIN});
    case 't_shelf':return todayView({gs:'new',line:`You have ${U.starters} starter recipes to pick from.`});
    case 't_load':return todayView({gs:'new',line:`You have ${U.starters} starter recipes to pick from.`,ld:true});
    case 't_new':return todayView({gs:'new',line:`You have ${U.starters} starter recipes to pick from.`});
    case 't_own':return todayView({gs:'new',line:'No saved recipes? No problem. We can suggest some.'});
    case 't_gone':return todayView({gs:null,line:LINE_PLAIN});
    case 't_30':return todayView({gs:null,date:['Wednesday, Dec 30','Wed, Dec 30'],wk:['Dec 28 – Jan 3',2],line:'Plan Dec 28 – Jan 3 and Today shows what to cook and when to start.',
      menu:`<div class="menu" role="menu" aria-label="More for Today"><button role="menuitem" data-a="resume" data-s="s3"><span class="mi-ring" aria-hidden="true"><i class="ring now"></i></span><span>${SL('Finish Setup','Step 3 of 4')}</span></button><hr><button role="menuitem" data-a="toast" data-t="Opens Log a Meal">${ic('plus')}<span>Log a Meal</span></button><button role="menuitem" data-a="toast" data-t="Opens Prep">${NI.prep}<span>Open Prep</span></button></div>`});
    case 'plan':return planView();
    case 'groc':return grocView();
    case 'kit':return kitView();
    case 'cook_ask':case 'cook_after':case 'cook_deny':return cookView();
    case 'member':return todayView({gs:null,me:'JO',col:'--m-jo',line:LINE_PLAIN});
    case 'member_lim':return todayView({gs:null,me:'SA',col:'--m-sam',line:LIM,btn:false});
    case 'plan_lim':return planView();
    case 'kipad':return kipadView();
  }
  return '';
}
function sheet(){
  const s=$('#scrim'), open=U.id==='cook_ask'&&PHONE()&&!U.asked;
  s.classList.toggle('open',open);
  $('#sheet').innerHTML=open?`<div class="sb"><span class="eic" style="width:56px;height:56px;margin:0 0 12px;border-radius:12px">${ic('bell')}</span><h2 id="shh">Want a Nudge When a Timer Is Done?</h2><p>We'll let you know on this phone when a cooking timer ends.</p><p>You can change this any time in Settings, Reminders for Me.</p></div><div class="ft"><button class="btn pri" data-a="askyes">Turn On Reminders</button><button class="btn cancel" data-a="askno">Not Now</button></div>`:'';
}
function mockBar(){
  const ix=STATES.findIndex(s=>s[0]===U.id);
  $('#mock').innerHTML=`<span class="tag">MOCKUP</span><button class="mm" data-m="pop" aria-haspopup="true">States</button><button data-m="prev" aria-label="Previous state">${ic('left','i sm')}</button><button data-m="next" aria-label="Next state">${ic('right','i sm')}</button><span class="cur">${ix+1} of ${STATES.length}: ${SN(U.id)}</span>`;
  $('#mpop').innerHTML=GROUPS.map(([g,l])=>`<h4>${l}</h4>${STATES.filter(s=>s[1]===g).map(([id,,n])=>`<button class="${id===U.id?'on':''}" data-m="go" data-s="${id}">${n}</button>`).join('')}`).join('');
  $('#mnote').textContent=NOTES[U.id]||(U.id.startsWith('showme')?NOTES.showme:'');
}
function fitRec(){const ems=$$('.rc b em');ems.forEach(e=>e.classList.remove('wr'));const w=PHONE()||ems.some(e=>e.getBoundingClientRect().top>e.parentElement.getBoundingClientRect().top+4);ems.forEach(e=>e.classList.toggle('wr',w))}
if(document.fonts)document.fonts.ready.then(fitRec);
function render(focus){
  const sc=$('#scroll'), keep=sc&&!focus?sc.scrollTop:0;
  $('#app').innerHTML=view();
  sheet();mockBar();
  document.title='SupperCraft: '+SN(U.id)+' (mockup)';
  const s2=$('#scroll');if(s2&&keep)s2.scrollTop=keep;
  if(focus){const h=$('#ct');if(h&&!$('.ld'))h.focus({preventScroll:true})}
  $('#toasts').classList.toggle('low',!!$('.setup'));
  /* "Recommended" sits after a thin upright line on the title line; if it would wrap, it drops under the title alone */
  fitRec();
  if(PHONE()&&(U.rcpt||U.id==='t_later_off')&&focus!==false){const g=$('.gs'),sc3=$('#scroll');if(g&&sc3){const want=sc3.scrollTop+g.getBoundingClientRect().top-sc3.getBoundingClientRect().top-12,room=sc3.scrollHeight-sc3.clientHeight,wr=sc3.firstElementChild;if(want>room)wr.style.paddingBottom=(parseFloat(getComputedStyle(wr).paddingBottom)+want-room)+'px';sc3.scrollTop=want}}
  /* round 10 (visual 5): the ⋯ menu hangs 6 under its button, right edges equal (C-083 openMenu) */
  const mn=$('.bar .menu');if(mn){const mb=mn.parentElement.querySelector('.btn.icon[aria-haspopup]'),ir=mn.parentElement.getBoundingClientRect(),br=mb.getBoundingClientRect();mn.style.right=(ir.right-br.right)+'px';mn.style.top=(br.bottom-ir.top+6)+'px'}
  if(U.id==='cook_deny'&&PHONE()&&!U.dt){U.dt=1;toast('Alerts are off in your phone\'s settings. We won\'t ask again.')}
}
function go(id,focus=true){const f=fresh(id),keep=U;U={...f,name:U.name||'The Rivera Household',people:U.people,color:U.color,store:TYPED.includes(id)?'Kroger':id==='s2_zip'?'':U.store,zip:TYPED.includes(id)||id==='s2_zip'?'60614':U.zip,kit:f.kit!=='later'?f.kit:U.kit,rec:f.rec!=='starter'?f.rec:U.rec,
    seen:id.startsWith('done')&&keep.seen&&keep.seen.length&&!f.seen.length?keep.seen:f.seen,starters:f.starters,imp:f.imp||((id.startsWith('done')||id==='s4_saving')&&!!keep.imp)};
  if(id==='s1_empty')U.name='';if(id==='s2'){U.store='';U.zip=''}if(id==='s3')U.kit='later';if(id==='s4')U.rec='starter';if(id==='done')U.rec=keep.rec||'starter';
  $('#mpop').classList.remove('open');render(focus);if(!Q.get('state')||true)history.replaceState(null,'','?'+new URLSearchParams({...Object.fromEntries(Q),state:id}));}
function toast(t,tm){const el=document.createElement('div');el.className='toast';el.innerHTML=(tm?`<span class="tm">${tm}</span>`:'')+t;$('#toasts').appendChild(el);setTimeout(()=>el.remove(),4200)}

/* ---------- actions ---------- */
const ORDER=['s1','s2','s3','s4','done'];
document.addEventListener('click',e=>{
  const m=e.target.closest('[data-m]');
  if(m){const ix=STATES.findIndex(s=>s[0]===U.id);
    if(m.dataset.m==='pop')$('#mpop').classList.toggle('open');
    else if(m.dataset.m==='prev')go(STATES[(ix-1+STATES.length)%STATES.length][0]);
    else if(m.dataset.m==='next')go(STATES[(ix+1)%STATES.length][0]);
    else go(m.dataset.s);return}
  if(!e.target.closest('#mpop'))$('#mpop').classList.remove('open');
  const b=e.target.closest('[data-a]');if(!b||b.getAttribute('aria-disabled')==='true')return;
  const a=b.dataset.a, n=stepNo();
  switch(a){
    case 'next':{const k={1:'s2',2:'s3',3:'s4'}[n];
      if(n===3&&U.kit!=='later'){toast('Kitchen setup runs here (C-088). When you finish, you land back on step 4.','Mockup');go('s4_kback');break}
      go(k);break}
    case 'back':go({2:'s1',3:'s2',4:'s3'}[n]||'s1');break;
    case 'finish':{const st=U.rec==='starter',cnt=U.starters;go('s4_saving');setTimeout(()=>{go(st||U.imp?'done':'done_own');if(st)toast(cnt+' starter recipes are in your book.')},600);break}
    case 'later':go(n===1?(U.name.trim()?'t_later1':'t_later0'):OFFLINE()?'t_later_off':'t_later');break;
    case 'resume':go(b.dataset.s||'s3');break;
    case 'imp':toast('Import runs here. You come back to step 4 when the recipe is saved.','Mockup');go('s4_imp');break;
    case 'retry':U.id='s_load';render();setTimeout(()=>go('s1'),700);break;
    case 'go':if(b.dataset.s){const seen=U.seen,rec=U.rec;go(b.dataset.s);if(b.dataset.s==='done'&&seen&&seen.length){U.seen=seen;U.rec=rec;render()}}break;
    case 'nav':{const s=PAGE_STATE[b.dataset.to];if(s)go(s);else toast('Opens '+b.dataset.to);break}
    case 'showme':{const seen=[...new Set([...(U.seen||[]),b.dataset.p])],rec=U.rec;go({plan:'showme',groc:'showme_g',cook:'showme_c',after:'showme_a'}[b.dataset.p]);U.seen=seen;U.rec=rec;break}
    case 'skip':U.store='';U.zip='';go('s3');break;
    case 'pick':U[b.dataset.g]=b.dataset.v;render();break;
    case 'note':U.note=!U.note;$('#more').classList.toggle('open',U.note);b.innerHTML=noteLbl();b.setAttribute('aria-expanded',U.note);break;
    case 'ppl':U.people=Math.max(1,Math.min(20,U.people+ +b.dataset.d));b.parentElement.querySelector('output').textContent=U.people;break;
    case 'color':U.color=+b.dataset.i;$$('.sw button').forEach((x,i)=>{x.classList.toggle('on',i===U.color);x.setAttribute('aria-checked',i===U.color)});break;
    case 'askno':U.asked=true;go('cook_after');toast('We won\'t ask again. The switch is in Settings, Reminders for Me.');break;
    case 'askyes':U.asked=true;go('cook_after');toast('Timer reminders are on for this phone.');break;
    case 'toast':toast(b.dataset.t,'Mockup');break;
  }
});
document.addEventListener('keydown',e=>{const r=e.target.closest&&e.target.closest('.rc[role=radio]');if(r&&(e.key===' '||e.key==='Enter')){e.preventDefault();r.click()}});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.in;if(!k)return;U[k]=e.target.value;
  if(k==='name'){const off=!U.name.trim(),nb=$('#nextb'),w=$('#cwhy');nb.className='btn '+(off?'off':'pri');nb.dataset.a=off?'':'next';off?nb.setAttribute('aria-disabled','true'):nb.removeAttribute('aria-disabled');w.textContent=off?NAMEWHY:''}
  if((k==='store'||k==='zip')&&!OFFLINE()){const nb=$('#nextb'),has=!!(U.store.trim()||U.zip.trim());if(nb){nb.textContent=has?'Next':'Skip for Now';nb.className='btn '+(has?'pri':'cancel')}const sk2=$('#skipb');if(sk2){sk2.style.visibility=has?'':'hidden';has?sk2.removeAttribute('aria-hidden'):sk2.setAttribute('aria-hidden','true');sk2.tabIndex=has?0:-1}const w=$('#cwhy');if(w&&!w.classList.contains('bad'))w.textContent=''}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.inp')){const nb=$('#nextb');if(nb&&nb.dataset.a)nb.click()}});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>render(),120)});
render();
</script>
</body>
</html>
