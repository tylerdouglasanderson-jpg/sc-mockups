/* Tokens, frame, rail, tan bar, buttons, cards, sheets, toasts and state bar copied from Today v4 (itself from
   Groceries v3 / Plan v3 kit parts). History parts below them. */
:root{
  --page:#EDE5D8; --card:#FAF6EE; --panel:#F6F2E9; --panel-alt:#F1E8DA; --alert:#F8F0E0;
  --header:#6B3E14; --subbar:#E4D3B3; --hdr-text:#FAF4EB; --subbar-date:#5C3D0A; --subbar-2:#7A5030;
  --ink:#1E1E1C; --ink2:#54524A; --muted:#605E55;
  --sage:#8FAF8A; --sage-dark:#1F3A1C; --sage-light:#E4EDE2; --sage-text:#4B6947;
  --amber:#C8943A; --amber-light:#F5ECD8; --amber-text:#7E5C22; --amber-dark:#5C3D0A;
  --urgent-bg:#F5E4E4; --urgent-text:#5C1A1A; --urgent-border:#8E3131;
  --chip:#E4D9C6; --chip-on:#B7D0B0; --chip-warm:#EFE4CC; --chip-warm-edge:#988048;
  --row-hover:#F0EEE3; --track:#DDD5C5; --folder-line:#D2C6B0;
  --c-muted:96 94 85; --c-ink2:84 82 74;
  --m-sam:#5E7C55; --m-alex:#8A5A3C; --m-jordan:#4F6A86; --m-riley:#8A4F6E; --m-guest:#7A7466;
  --star:var(--amber-text); --star-off:var(--muted);
  --bcard:rgba(0,0,0,.09); --brow:rgba(0,0,0,.06); --scrim:rgba(0,0,0,.4);
  --shadow-card:0 1px 2px rgba(45,33,22,.055),0 6px 16px rgba(45,33,22,.055);
  --shadow-pop:0 4px 14px rgba(45,33,22,.16); --shadow-float:0 16px 48px rgba(45,33,22,.2);
  --hover:inset 0 0 0 100px rgba(30,30,28,.04); --press:inset 0 0 0 100px rgba(30,30,28,.16);
  --on-dark-hover:rgba(250,244,235,.08); --on-dark-press:rgba(250,244,235,.16);
  --wood-sheen-top:rgba(255,255,255,.04); --wood-sheen-bottom:rgba(0,0,0,.10);
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --ease:cubic-bezier(.25,.46,.45,.94);
  --vr:rgb(var(--c-muted) / .55);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--page)}
body{color:var(--ink);font:400 15px/1.45 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
input,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
mark{background:var(--chip-warm);color:inherit;border-radius:4px;padding:0 1px}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:16px;height:16px}
svg.ni{display:block;overflow:visible}
:focus-visible{outline:2px solid var(--sage-text);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes push{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes pull{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
@keyframes shim{to{background-position:-200% 0}}
@keyframes glow{from{background:var(--sage-light)}to{background:transparent}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01s!important;transition-duration:.01s!important}.btn:active,.chip:active{transform:none!important}}

/* one thin themed scroll bar (DESIGN 4.10): a 6 px rounded thumb in a 12 px gutter, a clear track, no arrow buttons.
   Only Firefox gets scrollbar-width / scrollbar-color: Chrome drops the rounded thumb and draws arrows when they are set (r10) */
.scroll::-webkit-scrollbar,.sheet .sb::-webkit-scrollbar,.pane::-webkit-scrollbar,.lcard::-webkit-scrollbar{width:12px;height:12px}
.scroll::-webkit-scrollbar-thumb,.sheet .sb::-webkit-scrollbar-thumb,.pane::-webkit-scrollbar-thumb,.lcard::-webkit-scrollbar-thumb{background:rgb(var(--c-muted) / .35);border:3px solid transparent;background-clip:padding-box;border-radius:999px}
.scroll::-webkit-scrollbar-thumb:hover,.sheet .sb::-webkit-scrollbar-thumb:hover,.pane::-webkit-scrollbar-thumb:hover,.lcard::-webkit-scrollbar-thumb:hover{background-color:rgb(var(--c-ink2) / .7)}
.scroll::-webkit-scrollbar-track,.sheet .sb::-webkit-scrollbar-track,.pane::-webkit-scrollbar-track,.lcard::-webkit-scrollbar-track,.scroll::-webkit-scrollbar-corner,.sheet .sb::-webkit-scrollbar-corner,.pane::-webkit-scrollbar-corner,.lcard::-webkit-scrollbar-corner{background:transparent}
.scroll::-webkit-scrollbar-button,.sheet .sb::-webkit-scrollbar-button,.pane::-webkit-scrollbar-button,.lcard::-webkit-scrollbar-button{display:none;width:0;height:0}
@supports not selector(::-webkit-scrollbar){.scroll,.sheet .sb,.pane,.lcard{scrollbar-width:thin;scrollbar-color:rgb(var(--c-muted) / .35) transparent}}

.top::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--wood-sheen-top),var(--wood-sheen-bottom));pointer-events:none}
.top>*{position:relative;z-index:1}
.wordmark{font-style:italic;font-weight:600;font-size:22px}
.top .sp{flex:1}
.av{display:inline-grid;place-items:center;border-radius:50%;font-weight:600;color:var(--hdr-text);flex:none}
.av.hdr{width:28px;height:28px;font-size:12px;background:var(--m-sam);box-shadow:0 0 0 2px var(--hdr-text)}
.av.g{background:transparent!important;border:1.5px dashed var(--ink2);color:var(--ink2)}
.av.g svg{width:60%;height:60%}
.who-btn{height:44px;border-radius:8px;padding:0 10px 0 6px;display:inline-flex;align-items:center;gap:10px;color:var(--hdr-text);font-weight:400;font-size:17px;opacity:.92}
.who-btn:hover{background:var(--on-dark-hover)}
.who-btn .av{width:28px;height:28px;border:1.5px dashed var(--hdr-text);color:var(--hdr-text)}
.rail{background:var(--card);border-right:1px solid var(--bcard);padding:12px 8px;display:flex;flex-direction:column;gap:4px;min-height:0;overflow:hidden}
.rail .cap{height:44px;border-radius:8px;background:var(--sage);color:var(--ink);display:flex;align-items:center;gap:8px;padding:0 12px;font-weight:500;font-size:16px;margin-bottom:8px;flex:none}
.rail .cap:hover,.rail .ri:hover{box-shadow:var(--hover)}
.rail .ri{display:flex;align-items:center;gap:12px;height:44px;border-radius:8px;padding:0 12px;color:var(--ink2);font-weight:500;font-size:16px;text-align:left;flex:none;white-space:nowrap;position:relative}
.rail .ri svg.i,.rail svg.ni{width:24px;height:24px;flex:none}
.rail .ri.on{background:var(--sage-light);color:var(--sage-text)}
.rail hr{border:0;border-top:1px solid var(--bcard);margin:4px 8px;flex:none}
.rail .grow{flex:1}
.body{display:grid;grid-template-rows:46px 1fr;min-height:0;min-width:0}
.bar{background:var(--subbar);border-bottom:1px solid var(--brow);position:relative;display:flex;z-index:3}
.bar .in{display:flex;align-items:center;gap:12px;width:100%;max-width:1212px;margin:0 auto;padding:0 16px;min-width:0}
.dev-desktop .bar .in{max-width:1224px;padding-right:28px}
.bar .ttl{font-weight:600;font-size:16px;color:var(--subbar-date);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bar .meta{font-size:13px;color:var(--subbar-2);padding-left:12px;border-left:1px solid var(--chip-warm-edge);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.bar .sp{flex:1}
.bar .btn.icon{width:36px;height:36px;color:var(--subbar-date)}
.bar .btn.icon::after{content:"";position:absolute;inset:-4px}
.bar .btn.bb{height:34px;padding:0 14px;font-size:15px}
.bar .btn.bb::after{content:"";position:absolute;left:0;right:0;top:-5px;bottom:-5px}
.bar .back{display:inline-flex;align-items:center;gap:2px;height:44px;margin-left:-8px;padding:0 6px 0 2px;border-radius:8px;color:var(--subbar-date);font-weight:600;font-size:16px;min-width:0}
.bar .back:hover{box-shadow:var(--hover)}
.bar .crumb{display:flex;align-items:center;gap:2px;min-width:0;font-size:16px;color:var(--subbar-date)}
.bar .crumb button{height:44px;padding:0 6px;border-radius:8px;color:var(--subbar-2);font-weight:500;flex:none}
.bar .crumb button:hover{box-shadow:var(--hover)}
.bar .crumb b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bar .crumb svg{color:var(--subbar-2);width:16px;height:16px}
.scroll{overflow:auto;min-height:0;scrollbar-gutter:stable;position:relative}

/* ---------- kit Button: 44 tall, four tiers, Title Case, press = .97 + overlay ---------- */
.btn{height:44px;border-radius:8px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:500;font-size:16px;white-space:nowrap;transition:transform 50ms var(--ease),box-shadow .2s var(--ease),background-color .2s var(--ease),color .2s var(--ease);position:relative;flex:none}
.btn:active{transform:scale(.97);box-shadow:var(--press)}
.btn.pri{background:var(--sage-dark);color:var(--hdr-text)}.btn.pri:hover{box-shadow:inset 0 0 0 100px var(--on-dark-hover)}
.btn.sec{background:var(--sage);color:var(--ink)}.btn.sec:hover{box-shadow:var(--hover)}
.btn.cancel{background:transparent;border:1px solid var(--ink2);color:var(--ink)}.btn.cancel:hover{box-shadow:var(--hover)}
.btn.red{background:transparent;border:1px solid var(--urgent-border);color:var(--urgent-text)}.btn.red:hover{box-shadow:var(--hover)}
.btn.redf{background:var(--urgent-border);color:var(--hdr-text)}
.btn.icon{width:44px;padding:0;color:var(--ink2)}.btn.icon:hover{box-shadow:var(--hover)}
/* switched off keeps its own tier and dims to the one disabled opacity (DESIGN 6.3: 0.45), so a waiting Save still
   reads as the green main button, never as a tan choice chip */

.btn.warm{background:var(--chip-warm);border:1px solid var(--chip-warm-edge);color:var(--ink)}.btn.warm:hover{box-shadow:var(--hover)}
.btn.sm{height:36px;padding:0 12px;font-size:15px}.btn.sm::after{content:"";position:absolute;left:0;right:0;top:-4px;bottom:-4px}
.btn.quiet{height:44px;padding:0 8px;color:var(--sage-text);font-weight:600}
.btn.quiet:hover{box-shadow:var(--hover)}

/* ---------- cards ---------- */
.card{background:var(--card);border-radius:12px;border:1px solid var(--bcard);box-shadow:var(--shadow-card);min-width:0}
.eyebrow{font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
/* the kit notice (Today v4 X11 / Groceries v3 banner): a tinted band, an amber icon, main ink words, a close X */
.note{display:flex;align-items:center;gap:12px;border-radius:12px;background:var(--alert);border:1px solid var(--bcard);box-shadow:var(--shadow-card);padding:4px 4px 4px 16px;min-height:52px;font-size:15px;color:var(--ink)}
.note>svg{color:var(--amber-text);flex:none}
.note>span{flex:1;min-width:0;padding:6px 0}
.note .nx{flex:none;color:var(--ink2)}
.note.info{background:var(--panel-alt)}.note.info>svg{color:var(--ink2)}

/* thin upright line (C-057): facts on one line; a part that wraps starts clean */
.sl{display:inline-flex;flex-wrap:wrap;align-items:baseline;overflow-x:clip;max-width:100%;--g:.55em;vertical-align:bottom}
.sl>span{position:relative;white-space:nowrap;padding:0 calc(2*var(--g) + 1px);margin-left:calc(-2*var(--g) - 1px)}
.sl>span:last-child{padding-right:0}
.sl>span::before{content:"";position:absolute;left:var(--g);top:50%;width:1px;height:1em;margin-top:-.5em;background:var(--vr)}
.ld .sl>span::before{background:transparent}

/* ---------- shaped loading (C-066) ---------- */
.ld .skx,.skel{color:transparent!important;background-color:var(--track)!important;background-image:linear-gradient(90deg,var(--track) 0%,var(--panel) 50%,var(--track) 100%)!important;background-size:200% 100%!important;animation:shim 1.4s infinite linear;border-color:transparent!important;border-radius:6px;box-shadow:none!important}
.ld .skx svg,.ld .rt svg{opacity:0}
.skx svg,.rt svg{transition:opacity .35s var(--ease)}
.skx{transition:color .35s var(--ease),background-color .35s var(--ease)}
.ld button{pointer-events:none}
.ld .body .av{background:var(--track)!important;color:transparent}
.ld .bar .btn.icon{opacity:.45}
.ld .sl>span{color:transparent}
.ld .gh{color:transparent}
.ld .pane .btn,.ld .lcol .chip,.ld .sfield{background:var(--track)!important;color:transparent!important;border-color:transparent!important}
.ld .pane .btn *,.ld .lcol .chip *,.ld .sfield *{visibility:hidden}

/* ---------- toasts, menu, sheets ---------- */
.toasts{position:fixed;right:24px;bottom:24px;display:flex;flex-direction:column-reverse;gap:8px;align-items:flex-end;z-index:60;pointer-events:none;max-width:380px}
.toast{background:var(--ink);color:var(--page);border-radius:12px;padding:6px 6px 6px 16px;min-height:48px;font-size:15px;display:flex;gap:8px;align-items:center;pointer-events:auto;animation:rise .2s var(--ease);box-shadow:var(--shadow-pop)}
.toast>span{padding:6px 0}
.toast button{color:var(--page);font-weight:500;font-size:16px;text-decoration:underline;text-underline-offset:3px;border-radius:8px;padding:0 12px;height:44px;flex:none}
.toast.out{opacity:0;transform:translateY(8px);transition:opacity .2s var(--ease),transform .2s var(--ease)}
.menu{position:fixed;background:var(--card);border:1px solid var(--bcard);border-radius:12px;box-shadow:var(--shadow-pop);z-index:58;min-width:248px;display:none;padding:8px}
.menu.open{display:block;animation:pop .2s var(--ease)}
.menu button{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;border-radius:8px;padding:6px 12px;font-size:15px;text-align:left}
.menu button:hover{background:var(--row-hover)}
.menu button>span{display:flex;flex-direction:column;line-height:1.3}
.menu button small{font-size:13px;color:var(--muted)}
.menu button.rd{color:var(--urgent-text)}.menu button.rd svg{color:var(--urgent-text)}
.menu button.off{color:var(--muted);cursor:default}.menu button.off:hover{background:none}
.menu svg.i{color:var(--ink2)}
.menu svg.ni{width:24px;height:24px}
.menu hr{border:0;border-top:1px solid var(--bcard);margin:6px 4px}
.scrim{position:fixed;inset:0;background:var(--scrim);display:none;place-items:center;z-index:55;padding:24px}
.scrim.open{display:grid;animation:fade .2s var(--ease)}
.sheet{background:var(--card);border-radius:16px;box-shadow:var(--shadow-float);width:520px;max-width:100%;max-height:calc(100dvh - 48px);display:flex;flex-direction:column;animation:rise .25s var(--ease);overflow:hidden}
.sheet.sm{width:460px}
.sheet .hd{display:flex;align-items:flex-start;gap:12px;padding:16px 12px 8px 24px}
.sheet .hd>div{flex:1;min-width:0;padding-top:8px}
.sheet .hd h2{font-size:20px;font-weight:600;line-height:1.3}
.sheet .hd small{display:block;font-size:14px;color:var(--ink2);margin-top:2px}

.sheet:focus{outline:none}
.sheet .sb{overflow:auto;padding:4px 24px 16px}
/* the footer (as Today v4): the buttons share one row, Cancel on the left and the main button on the right. The
   helper words sit on their own quiet line above the buttons, so a third button never pushes them out (r7) */




.wide{width:600px}
/* more below: a soft cream fade over the last rows and a thin scroll bar, so nothing looks cut by mistake */
.cue{position:relative}
.cue::after{content:"";position:sticky;bottom:0;display:block;height:48px;margin-top:-48px;background:linear-gradient(rgba(250,246,238,0),var(--card) 80%);pointer-events:none;opacity:0;transition:opacity .2s var(--ease);z-index:3}
.cue.mb::after{opacity:1}
/* in a sheet the fade hangs from the footer's top edge, outside the scrolling box, so it always covers the last
   line you can see, never a line above it (r7: the round 6 fade floated 16 px too high) */
.sheet .sb.cue::after{display:none}


.field{display:flex;align-items:center;gap:8px;min-height:48px;border:1px solid var(--ink2);border-radius:8px;padding:0 4px 0 14px;background:var(--card)}
.field input,.field textarea{border:0;background:none;outline:none;flex:1;font-size:16px;min-width:0}
.field textarea{resize:none;padding:12px 0;height:46px;max-height:120px;line-height:1.4;transition:height .2s var(--ease)}
.field:focus-within{border:2px solid var(--sage-text);padding:0 3px 0 13px}

.sheet.kxs .rmrow .rmd,.sheet.kxs .rmrow .rmsw .swb,.sheet.kxs .rmrow .nt .field{margin-left:52px}

/* --- Log a Meal --- */
.dupe{display:flex;align-items:center;gap:10px;background:var(--amber-light);border-radius:8px;padding:4px 4px 4px 12px;margin:0 0 12px;font-size:14px;line-height:1.3;color:var(--amber-dark)}
.dupe>svg{color:var(--amber-text);flex:none}
.dupe span{flex:1;min-width:0;padding:6px 0}
.dupe .btn{flex:none}
.lmore{display:flex;align-items:center;gap:12px;margin:0 0 4px}
.lmore .sum{flex:1;min-width:0;font-size:13px;line-height:18px;color:var(--ink2)}
.sheet .sb .lmx .flab{margin-top:12px}
.calhd{display:flex;align-items:center;gap:4px;margin:0 0 4px -12px;font-weight:600;font-size:15px}
.sheet .sb .cal.big{max-width:none;border:0;padding:0;margin:0 0 4px}
.sheet .sb .cal.big .d{height:44px}

/* --- Cook Again: the Kitchen answer is a plain row (Today's need row: icon, bold line, small line, action on the
   right), not a tinted box --- */
.check{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;border-top:1px solid var(--brow);padding:12px 0 4px;margin-top:4px;min-height:60px;animation:fade .2s var(--ease)}
.check .ri2{flex:none;width:24px;display:grid;place-items:center;align-self:flex-start;margin-top:1px;color:var(--amber-text)}
.check.ok .ri2{color:var(--sage-text)}
.check .tx{flex:1 1 200px;min-width:0;line-height:1.35}
.check .tx b{display:block;font-weight:600;font-size:16px;text-wrap:pretty}
.check .tx small{display:block;font-size:13px;color:var(--ink2);text-wrap:pretty}
.check .gadd{flex:none;display:flex;align-items:center;gap:8px;min-height:44px}
.check .gadd .ok2{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--sage-text)}
.sheet.kxs .check .tx b{font-size:20px}
.sheet.kxs .check .tx small{font-size:18px}
.days{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:6px 0 16px}
.dy{border:1px solid transparent;background:var(--chip);border-radius:8px;min-height:56px;min-width:0;padding:6px 10px;text-align:left;display:flex;flex-direction:column;justify-content:center;line-height:1.3;transition:background-color .2s var(--ease),border-color .2s var(--ease)}
.dy b{font-weight:600;font-size:14px}
.dy small{font-size:12px;color:var(--ink2)}
.dy .s{display:none}
.dy:hover{box-shadow:var(--hover)}
.dy.on{border-color:var(--sage-text);background:var(--chip-on)}
.dy.away{background:transparent;border:1px dashed var(--folder-line);color:var(--muted);cursor:default}
.dy.away small{color:var(--muted)}
.dy.away:hover{box-shadow:none}
.sheet.kxs .dy{min-height:68px}.sheet.kxs .dy b{font-size:18px}.sheet.kxs .dy small{font-size:15px}
@media (min-width:641px){
  .fmore{display:none}
  .reveal.fx{grid-template-rows:1fr}
  .reveal.fx>div{visibility:visible}
}
@media (max-width:640px){
  .check .gadd{flex:1 1 100%;padding-left:36px}
  .sheet .ctile{min-height:56px;justify-content:center}
  .sheet .ctile small{display:none}
  .sheet .ctile.dis small{display:block}
  .sheet .ctiles,.days{margin-bottom:12px}
  .dy{padding:4px 8px;min-height:52px}
  .dy .l{display:none}.dy .s{display:inline}
}

/* --- the list row: one grid. Line 1 = name + status; line 2 = the facts, full width; a button spans both lines --- */
.hr{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;column-gap:12px;row-gap:2px;align-content:center;align-items:center;min-height:68px;width:100%;padding:10px 16px;text-align:left;border-top:1px solid var(--brow);transition:background-color .2s var(--ease)}
.gh+.hr{border-top:0}
.hr:hover{background:var(--row-hover)}
.hr.on{background:var(--sage-light)}
.hr.new{animation:glow 1.6s var(--ease)}
.hr>.av,.hr>.avs{grid-column:1;grid-row:1/3}
.hr .av{width:40px;height:40px;font-size:14px}
.hr .avs{position:relative;display:block;width:40px;height:40px}
.hr .avs .av{position:absolute;left:0;top:0;width:25px;height:25px;font-size:9px;margin:0}
.hr .avs .av+.av{left:auto;top:auto;right:0;bottom:0;box-shadow:0 0 0 2px var(--card)}
.hr.on .avs .av+.av{box-shadow:0 0 0 2px var(--sage-light)}
.kx .hr .avs{width:48px;height:48px}
.kx .hr .avs .av{width:34px;height:34px;font-size:12px}
.hr .tx{display:contents}
.hr .tx b{grid-column:2;grid-row:1;min-width:0;font-weight:600;font-size:16px;line-height:1.3;text-wrap:pretty}
.hr .tx .m{grid-column:2/4;grid-row:2;min-width:0;font-size:13px;line-height:1.35;color:var(--muted)}
.hr .end{grid-column:3;grid-row:1;display:flex;align-items:center;justify-content:flex-end;min-height:21px}
.hr .end.act{grid-row:1/3}
.hr:has(.end.act) .tx .m{grid-column:2}
.hr .chev{grid-column:4;grid-row:1/3;color:var(--muted);width:18px;height:18px;margin-left:-4px}
.hr .rbtn{height:44px;padding:0 12px;font-size:15px}
.hr.rm .tx b{color:var(--muted)}
.dev-ipad .hr .tx b{font-size:18px}
.dev-ipad .hr .tx .m{font-size:15px}
.dev-ipad .hr .rbtn{font-size:17px}
.dev-ipad .app:not(.kx) .hw.two .hr .tx b{font-size:17px}
.dev-ipad .app:not(.kx) .hw.two .hr .tx .m{font-size:13px}
.kx .hr{min-height:80px}
.kx .hr .av{width:48px;height:48px;font-size:16px}
.kx .hr .tx b{font-size:20px}
.kx .hr .tx .m{font-size:17px}

/* --- the meal view: one action row (main, second, More), the offline reason right under it; dish rows with air and a
   hairline; link word and arrow 4 px apart --- */
.hacts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px}
.hacts .btn{flex:none}
.hacts .btn.hmore{gap:6px;padding:0 14px 0 10px}
.hacts .btn.hmore svg{color:var(--ink2)}
.mh .offw{grid-column:1/-1;margin-top:8px;font-size:13px;line-height:18px;color:var(--ink2)}
.dev-ipad .mh .offw{font-size:15px}.kx .mh .offw{font-size:17px}
.dish{position:relative;min-height:56px}
.dish+.dish::before{content:"";position:absolute;left:12px;right:12px;top:0;height:1px;background:var(--brow)}
.dish .chev,.lnk .chev{margin-left:-8px}
@media (max-width:640px){
  .hacts .btn,.hacts .btn.pri,.hacts .btn.sec{flex:1 1 0;min-width:0;padding:0 8px}
}

/* --- small sheet parts (their old rules were purged with the rest) --- */
.whoas{display:flex;align-items:center;gap:10px;background:var(--panel-alt);border-radius:8px;padding:4px 4px 4px 12px;font-size:14px;color:var(--ink2)}
.whoas>span:not(.av){flex:1}
.whoas b{color:var(--ink);font-weight:600}
.whoas .av{width:28px;height:28px;font-size:11px}
.sheet.kxs .whoas{font-size:18px;padding:4px 4px 4px 14px;margin-bottom:8px}
/* r23: the Kitchen iPad rating sheet fits a 1280 by 800 screen with the swap block open */
.sheet.kxs .sb>.seg{margin-bottom:10px}
.sheet.kxs .swb .seg{margin-bottom:4px}
.sheet.kxs .sb>.tlink.talk{min-height:48px;margin-top:2px}
.sheet.kxs .sb{padding-bottom:10px}
.sheet.kxs .whoas .btn{height:52px;font-size:18px}
.names{display:flex;gap:8px;flex-wrap:wrap}
.picked{display:flex;flex-wrap:wrap;gap:8px}
.onnow{font-size:14px;line-height:20px;color:var(--ink2)}
.onnow b{color:var(--ink);font-weight:500}
.sheet .sb.lm2{min-height:408px}
.sheet.kxs .sb.lm2{min-height:0}
@media (max-width:640px){
  .chips.recent .chip:nth-of-type(3){display:none}
  .sheet .chips.slots{flex-wrap:nowrap;gap:8px}
  .sheet .chips.slots .chip{flex:1 1 auto;padding:0 2px;justify-content:center;font-size:14px}
  .sheet .sb.lm2{min-height:400px}
}

/* --- day bands: the app's eyebrow type (13 / 500), still full width and sticky --- */
.gh{font-size:13px;font-weight:500}

/* --- one-recipe note on phones: the words, then the button under them --- */
@media (max-width:640px){
  .note.rec{flex-wrap:wrap;padding:8px 12px 12px 16px}
  .note.rec>span{flex:1 1 0;min-width:0;padding:4px 0}
  .note.rec .btn{flex:1 1 100%}
}

</style>
</head>
