<!doctype html>
<html lang="en"><head><script>window.SC_FULL='ipad'</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="SC Linking">
<title>Recipe Linking iPad</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,600&display=swap" rel="stylesheet">
<style>
/* Tokens: C-084 / C-071 (app DESIGN.md 2.1), plus C-058 card tokens */
:root{--page:#EDE5D8;--card:#FAF6EE;--panel:#F6F2E9;--panel-alt:#F1E8DA;--ink:#1E1E1C;--ink2:#3F3D37;--muted:#605E55;--ph:#9A968A;
--sage-dark:#1F3A1C;--sage:#8FAF8A;--sage-hover:#82A37C;--sage-mid:#3F6B38;--sage-text:#4B6947;--sage-light:#E4EDE2;--sage-line:#B9CDB4;
--tan:#E4D3B3;--tan-line:#D2BE98;--tan-ink:#5C3D0A;--border:rgba(0,0,0,.09);--brow:rgba(0,0,0,.06);
--amber:#C8943A;--amber-light:#F5ECD8;--amber-text:#7E5C22;--urgent:#8E3131;--urgent-bg:#F5E4E4;
--ired:rgba(196,72,60,.55);--iblue:rgba(80,120,170,.16);--icard:#FFFDF7;--cream:#FAF4EB;--chip:#E4D9C6;--folder-line:#D2C6B0;
--tape:#D5E4F2;--tape-edge:#A9C4DF;--wood2:#5E3D22;--wood3:#8C6240;--row-hover:#F0EEE3;--ease:cubic-bezier(.25,.46,.45,.94)}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"IBM Plex Sans",system-ui,sans-serif;background:#efece7;color:#222}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
*{scrollbar-width:thin;scrollbar-color:rgba(96,94,85,.35) transparent}
::-webkit-scrollbar{width:12px;height:12px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(96,94,85,.35);border:3px solid transparent;background-clip:padding-box;border-radius:999px}

/* ---------- state bar (mockup only, outside the device) ---------- */
#ctl{position:sticky;top:0;z-index:100;background:#f8f6f2;border-bottom:1px solid #ddd;padding:10px 16px;display:flex;flex-direction:column;gap:7px}
#ctl .r{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
#ctl h1{font-size:16px;margin:0 8px 0 0;font-weight:700}
#ctl .nag{font-size:12.5px;color:#8F2F1C;font-weight:600}
.seg{display:inline-flex;border:1px solid #cfc6b5;border-radius:9px;overflow:hidden;background:#fff;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 11px;font-size:13px;border-right:1px solid #e4ddd0}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--sage-light);color:var(--sage-text);font-weight:600}
.sts{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.sts>b{font-size:12px;color:#555;margin-right:4px;text-transform:uppercase;letter-spacing:.06em}
.sts button{border:1px solid #d8cfbf;background:#fff;border-radius:6px;padding:3px 8px;font-size:12.5px}
.sts button.on{background:var(--sage-light);border-color:var(--sage-text);color:var(--sage-text);font-weight:600}
.sts .pk{color:#B07D1A;margin-left:3px}
.sts .qn{display:inline-block;margin-left:5px;padding:0 4px;border-radius:4px;background:#EFE6D3;color:#6B5A3A;font-size:11px;font-weight:600}
.sts.qrow .qn{margin:0 5px 0 0}
.sts details{display:inline-block}.sts summary{cursor:pointer;font-size:12.5px;color:#555;padding:3px 4px}
#stage{padding:16px}
#scaler{transform-origin:0 0}
html.full,html.full body{height:100%;overflow:hidden;background:var(--page)}
html.full #ctl{display:none}
html.full #stage{padding:0}
#stfab,#stpop{display:none}
html.full:not(.shots) #stfab{display:inline-flex;position:fixed;top:10px;left:50%;translate:-50% 0;z-index:300;align-items:center;gap:4px;height:28px;padding:0 10px;border-radius:7px;border:1px solid rgba(246,233,210,.45);background:rgba(94,61,34,.6);color:#F6E9D2;font:600 12.5px "IBM Plex Sans",sans-serif}
html.full #stpop.show{display:flex;flex-direction:column;gap:8px;position:fixed;top:44px;left:50%;translate:-50% 0;z-index:301;width:min(460px,calc(100vw - 20px));max-height:calc(100vh - 60px);overflow:auto;background:#FFFDF7;border:1px solid var(--tan-line);border-radius:10px;box-shadow:0 8px 24px rgba(40,26,8,.22);padding:10px 12px}

/* ---------- the device ---------- */
#dev{position:relative;background:var(--page);overflow:hidden;display:flex;flex-direction:column;color:var(--ink);border:8px solid #22211f;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
html.full #dev{border:0;border-radius:0;box-shadow:none}
/* C-055 frame, copied from C-095 / C-071 (header 50, rail 219, slim rail 64, tan bar 46, phone tab bar 56) */
.wood{height:50px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 28px 0 12px;color:#FAF4EB;z-index:20}
.phone .wood{padding:0 16px}
.wood .wm{font-weight:600;font-style:italic;font-size:22px;position:relative}
.wood .av{width:28px;height:28px;border-radius:50%;background:#5E7C55;color:#FAF4EB;box-shadow:0 0 0 2px #FAF4EB;display:inline-grid;place-items:center;font-weight:600;font-size:12px;position:relative}
.dbody{flex:1;display:flex;min-height:0;position:relative}
.rail{flex:none;background:var(--card);border-right:1px solid var(--border);padding:12px 8px;display:flex;flex-direction:column;gap:4px;overflow:hidden;z-index:15}
.rail.wide{width:219px}
.rail.slim{width:64px;align-items:center;padding:12px 0}
.rail .cap{height:44px;border-radius:8px;background:var(--sage);color:var(--ink);display:flex;align-items:center;gap:8px;padding:0 12px;font-weight:500;font-size:16px;margin-bottom:8px;flex:none}
.rail .it{display:flex;align-items:center;gap:12px;height:44px;border-radius:8px;padding:0 12px;color:var(--ink2);font-weight:500;font-size:16px;flex:none}
.rail .it.cur{background:var(--sage-light);color:var(--sage-text)}
.rail svg.ni{width:24px;height:24px;flex:none;display:block;overflow:visible}
.rail.slim .cap,.rail.slim .it{font-size:0;gap:0;justify-content:center;padding:0;width:44px;height:44px}
.rail.slim .w{display:none}
.rdiv{border-top:1px solid var(--border);margin:4px 8px;flex:none}
.rail.slim .rdiv{width:44px;margin:4px 0}
.rail .grow{flex:1}
.rail .slimb svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.appmain{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
/* tan bar (C-095 .bar): title in dark tan ink, meta after a thin line, icon buttons at the right */
.tan{height:46px;flex:none;background:var(--tan);border-bottom:1px solid var(--brow);display:flex;align-items:center;padding:0 10px 0 16px;gap:12px;z-index:12;position:relative}
.phone .tan{padding:0 6px 0 12px}
.tl{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.tan .t{font-weight:600;font-size:16px;white-space:nowrap;color:#5C3D0A;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tan .bar{width:1px;height:18px;background:#988048;opacity:.7;flex:none}
.tan .d{font-size:13px;color:#7A5030;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tback{border:0;background:none;height:36px;display:inline-flex;align-items:center;gap:2px;padding:0 8px 0 4px;margin-left:-8px;border-radius:8px;font-size:15px;font-weight:600;color:var(--tan-ink);white-space:nowrap;min-width:0;max-width:52vw;overflow:hidden;text-overflow:ellipsis;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 14px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 14px),transparent)}
.tback .ch{font-size:22px;line-height:1;margin-top:-2px}
.tback:hover{background:rgba(0,0,0,.06)}
:not(.computer)>.dbody .tback,.touch .tback{height:44px}
.act{border:0;font-size:14px;font-weight:600;height:32px;padding:0 14px;border-radius:8px;background:var(--sage-dark);color:var(--cream);white-space:nowrap}
.act2{border:1px solid rgba(92,61,10,.22);font-size:14px;font-weight:600;height:32px;padding:0 12px;border-radius:8px;background:rgba(255,255,255,.45);color:var(--tan-ink);white-space:nowrap}
.touch .act,.touch .act2{height:40px}
.dots{border:0;background:none;width:36px;height:36px;border-radius:8px;padding:0;color:#5C3D0A;display:inline-grid;place-items:center;position:relative}
.dots svg{width:20px;height:20px}
.dots:hover{box-shadow:inset 0 0 0 100px rgba(30,30,28,.04)}
.touch .dots{width:44px;height:44px}
/* phone tab bar (C-055): Today, Plan, Capture, Groceries, More */
.pbar{height:56px;flex:none;display:flex;align-items:center;background:var(--card);border-top:1px solid var(--border);padding:0 4px;position:relative;z-index:30}
.pbar .tb{flex:1;display:flex;justify-content:center;align-items:center;height:56px;border:0;background:none;padding:0}
.pbar .tb>span{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:500;color:var(--ink2);min-width:56px;padding:4px 8px;border-radius:8px}
.pbar .tb.cur>span{background:var(--sage-light);color:var(--sage-text)}
.pbar svg.ni{width:24px;height:24px;display:block;overflow:visible}
.pbar .capslot{width:78px;display:flex;justify-content:center;align-self:flex-start}
.pbar .capc{width:60px;height:60px;border-radius:50%;background:var(--sage);border:0;display:grid;place-items:center;margin-top:-18px;box-shadow:0 1px 2px rgba(45,33,22,.055),0 6px 16px rgba(45,33,22,.055)}
.pbar .capc svg.ni{width:32px;height:32px}
.pg{flex:1;min-height:0;position:relative;overflow:hidden}
.pscroll{position:absolute;inset:0;overflow:auto}

/* ---------- the recipe link chip (C-058 .ing .sub, I-003 icon J) ---------- */
.sub{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--sage-line);background:var(--sage-light);border-radius:6px;padding:0 7px 0 6px;line-height:22px;height:24px;color:var(--sage-dark);font-weight:600;font-size:inherit;vertical-align:baseline;white-space:nowrap;position:relative;max-width:100%}
.sub svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sub .nmw{overflow:hidden;text-overflow:ellipsis}
.sub .ar{font-weight:600;margin-left:1px}
.sub:hover{background:#D5E4D1;border-color:var(--sage-mid)}
.sub.ro{cursor:default}.sub.ro:hover{background:var(--sage-light);border-color:var(--sage-line)}
.touch .sub::after{content:"";position:absolute;inset:-10px -2px}
.stp .sub,.rp-sec li .sub{height:22px;line-height:20px;vertical-align:1px}
.sw .sub{font-size:.8em;height:auto;line-height:1.3;padding:0 8px 0 7px;vertical-align:.1em}
.sw .sub svg{width:.75em;height:.75em}
.rcp{font-size:12.5px;color:var(--muted);margin-left:auto;white-space:nowrap;padding-left:8px}

/* ---------- Recipe Book (C-058) ---------- */
.book{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:24px;padding:34px 14px 14px;
 background:radial-gradient(ellipse 75% 65% at 20% 8%,rgba(255,252,245,.45),transparent 72%),linear-gradient(160deg,#DCD5C9,#CDC4B6 55%,#BFB5A6)}
.narrow .book{display:block;padding:0;background:var(--page)}
.deck{display:flex;flex-direction:column;min-height:0;padding:0 10px}
.narrow .deck{display:none}
.tools{background:var(--icard);border:1px solid var(--tan-line);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:7px;box-shadow:0 2px 5px rgba(40,26,8,.08);flex:none}
.srch{display:flex;align-items:center;gap:8px;border:1px solid var(--tan-line);border-radius:8px;background:#fff;padding:0 10px;height:36px}
.touch .srch{height:44px}
.srch input{border:0;outline:0;flex:1;font-size:15px;background:none;min-width:0}
.srch .mg{color:var(--muted);display:inline-flex}
.dlist{flex:1;min-height:0;overflow:hidden;padding:22px 6px 0}
.ic{position:relative;display:flex;flex-direction:column;justify-content:flex-start;width:96%;margin-left:2%;height:118px;padding:0 14px;text-align:left;border:0;border-radius:4px;color:var(--ink);background:repeating-linear-gradient(to bottom,transparent 0 23px,var(--iblue) 23px 24px) 0 48px/100% calc(100% - 48px) no-repeat,var(--icard);
 box-shadow:0 -3px 7px -2px rgba(40,26,8,.22),0 4px 8px -2px rgba(40,26,8,.18),0 0 0 1px rgba(60,40,10,.13)}
.ic+.ic{margin-top:-58px}
.ic .ich{display:flex;align-items:center;gap:8px;height:46px;margin:0 -14px;padding:4px 14px 0;border-bottom:1.5px solid var(--ired);font-size:15.5px;font-weight:600}
.ic .im{font-size:12.5px;color:var(--ink2);line-height:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic.open{outline:1px solid var(--sage-text);outline-offset:-1px;translate:0 -6px}
.ic:not(:last-child):not(.open) .im{visibility:hidden}
.ic.open .ich{background:rgba(228,237,226,.55)}
.ic .badge{border-radius:5px;background:var(--sage-light);color:var(--sage-dark);border:1px solid var(--sage-line);font-size:12px;font-weight:700;padding:0 8px;margin-left:auto}
.pane{position:relative;min-height:0;container-type:inline-size}
.narrow .pane{position:absolute;inset:0}
.rcard{position:absolute;inset:0;border-radius:6px;overflow:hidden;background:var(--icard);box-shadow:0 1px 2px rgba(40,26,8,.10),0 8px 26px rgba(40,26,8,.16),0 0 0 1px rgba(60,40,10,.12)}
.narrow .rcard{border-radius:0;box-shadow:none}
.rscroll{position:absolute;inset:0;overflow-y:auto;padding:0 30px 60px 26px;background:linear-gradient(var(--ired),var(--ired)) 0 var(--rl,111px)/100% 1.5px no-repeat,
 repeating-linear-gradient(to bottom,transparent 0 27px,var(--iblue) 27px 28px) 0 calc(var(--rl,111px) + 2px)/100% 100% no-repeat,var(--icard);background-attachment:local}
.phone .rscroll{padding:0 16px 60px 16px}
.rh{height:112px;display:flex;gap:16px;align-items:flex-end;padding:12px 0 12px;position:relative}
.rh .ph{width:104px;height:76px;flex:none;border-radius:2px;rotate:-2deg;margin:0 4px 2px 4px;position:relative;box-shadow:0 0 0 5px #fff,0 0 0 6px rgba(60,40,10,.14),0 4px 10px 4px rgba(40,26,8,.16);
 background:radial-gradient(circle at 50% 52%,var(--food,#7FA35A) 0 22px,rgba(0,0,0,.16) 23px,#F4EEE3 24px 32px,#CFC2AA 33px 34px,transparent 35px),repeating-linear-gradient(45deg,#C9B79A 0 6px,#BCA684 6px 12px)}
.phone .rh .ph{width:70px;height:56px;background:radial-gradient(circle at 50% 52%,var(--food,#7FA35A) 0 15px,rgba(0,0,0,.16) 16px,#F4EEE3 17px 22px,transparent 23px),repeating-linear-gradient(45deg,#C9B79A 0 6px,#BCA684 6px 12px)}
.rht{flex:1;min-width:0}
.rh h2{font-weight:600;font-size:26px;line-height:1.1;margin:0;letter-spacing:-.005em}
.phone .rh h2{font-size:21px}
.rh .by{font-size:13px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtacts{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.phone .rtacts{display:none}
.rtacts .row1{display:flex;gap:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--tan-line);background:#fff;font-size:13.5px;font-weight:600;color:var(--ink2);white-space:nowrap;position:relative}
.btn:hover{background:var(--sage-light);border-color:var(--sage-line);color:var(--sage-text)}
.btn.main{background:var(--sage-dark);border-color:var(--sage-dark);color:var(--cream)}
.btn.main:hover{box-shadow:inset 0 0 0 99px rgba(250,244,235,.08);color:var(--cream)}
.btn.sel{background:var(--sage-light);border-color:var(--sage-text);color:var(--sage-text)}
.btn.mid{border:1.5px solid var(--sage-text);color:var(--ink)}
.btn.red{color:var(--urgent);border-color:var(--urgent)}
.btn.red:hover{background:var(--urgent-bg);color:var(--urgent)}
.btn.off,.btn:disabled{background:#EEEBE4;border-color:#D9D4C8;color:#9A968A;cursor:default}
.btn svg{width:16px;height:16px;flex:none}
.touch .btn{height:40px}
.touch .btn::after{content:"";position:absolute;inset:-2px 0}
.fav{width:32px;padding:0;color:#B5482F}
.facts{display:flex;flex-wrap:wrap;gap:0 14px;font-size:14px;color:var(--ink2);line-height:28px}
.facts b{color:var(--ink);font-weight:600}
.usedin{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;font-size:14px;color:var(--ink2);min-height:28px;line-height:28px}
.usedin .lb{color:var(--muted)}
.usedin .sp{width:1px;height:14px;background:rgba(0,0,0,.25)}
.sec{padding:28px 0 0}
.sec h3{font-weight:600;font-size:18px;margin:0;line-height:28px;height:28px;display:flex;align-items:center;gap:10px}
.sec h3 small{font-size:13px;font-weight:400;color:var(--muted);margin-left:auto}
.grp{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);line-height:28px;height:28px}
.ing{display:flex;gap:8px;align-items:flex-start;font-size:14.5px;line-height:28px;min-height:28px;position:relative}
.ing>*{line-height:28px}
.ing .q{min-width:72px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;flex:none}
.phone .ing .q{min-width:62px}
.ing .n{flex:1;min-width:0;color:var(--ink2);display:flex;align-items:center;gap:6px}
.ing .n .sub{margin:2px 0}
.ing .ok{color:var(--sage-mid);font-size:13px}
.ing .need{font-size:12px;font-weight:600;color:#fff;background:#9A6A1E;border-radius:3px;padding:0 5px;line-height:18px;margin-top:5px}
.ing .gone{font-size:12.5px;color:var(--muted);margin-left:auto;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.ing .gone svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.7}
.stp ol{margin:0;padding:0;list-style:none;counter-reset:s}
.stp li{counter-increment:s;position:relative;padding:0 0 0 34px;font-size:14.5px;line-height:28px;color:var(--ink2)}
.stp li::before{content:counter(s);position:absolute;left:0;top:4px;width:19px;height:19px;border-radius:50%;background:var(--tan);color:var(--ink);font-weight:700;font-size:11px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1px rgba(60,40,10,.15)}
@container (min-width:640px){.two:not(.edtwo){display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:0 28px}}
/* binder page: the linked recipe slides in over the card (C-058 .binder) */
.binder{position:absolute;inset:0;z-index:8;transform:translateX(105%);transition:transform .28s cubic-bezier(.2,.7,.2,1)}
.binder.show{transform:none}
.binder.under{transform:translateX(-3%);filter:brightness(.97)}
.binder>.rcard{box-shadow:-10px 0 24px rgba(40,26,8,.22),0 0 0 1px rgba(60,40,10,.12)}
.bback{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:4px;height:36px;margin:0 -30px 0 -26px;padding:0 26px;border:0;width:calc(100% + 56px);background:#FDF9EE;box-shadow:0 1px 0 rgba(40,26,8,.10);color:var(--sage-mid);font-weight:600;font-size:14px;text-align:left}
.phone .bback{margin:0 -16px;padding:0 16px;width:calc(100% + 32px)}
.touch .bback{height:44px}
.bback:hover{background:var(--sage-light);color:var(--sage-dark)}
.bback .ch{font-size:20px;line-height:1;margin-top:-2px}
.bback .lv{margin-left:auto;font-weight:500;font-size:12.5px;color:var(--muted)}
.bback+.rh{height:92px;padding-top:10px}
.touch .bback+.rh{height:108px}
.bback+.rh .ph{width:72px;height:54px;background:radial-gradient(circle at 50% 52%,var(--food,#7FA35A) 0 14px,rgba(0,0,0,.16) 15px,#F4EEE3 16px 21px,transparent 22px),repeating-linear-gradient(45deg,#C9B79A 0 6px,#BCA684 6px 12px)}
.rscroll:has(>.bback){--rl:127px}
.touch .rscroll:has(>.bback){--rl:151px}
.strip{display:flex;align-items:center;gap:10px;min-height:40px;padding:6px 12px 6px 16px;background:#F6EEDC;border-bottom:1px solid var(--tan-line);font-size:13.5px;color:var(--ink2);line-height:19px}
.strip.warn{background:#FBF0DA;border-color:#E7CC97}
.strip.ok{background:var(--sage-light);border-color:var(--sage-line);color:var(--sage-dark)}
.strip b{color:var(--ink);font-weight:600}

.partbox .lk2{border:0;background:none;padding:0;color:var(--sage-mid);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--sage-line)}
.tan .tbb{height:34px;min-width:34px;border:1px solid rgba(92,61,10,.20);background:rgba(255,255,255,.35);border-radius:8px;display:inline-flex;align-items:center;justify-content:center;padding:0;color:var(--tan-ink);flex:none}
.tan .tbb svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.touch .tan .tbb{height:44px;min-width:44px}
/* Plan link line: the real amount first, a light control */
.mlink .amt{font-size:13.5px;color:var(--ink2);white-space:nowrap}
.mlink .amt small{color:var(--muted);font-size:13px}
.mk{height:28px;font-size:13.5px;padding:0 8px 0 10px;font-weight:600}
.touch .mk{height:36px}
.touch .mk::after{content:"";position:absolute;inset:-4px 0}
.phone .mlink .mk,.phone .mlink .mkro{flex-basis:auto;margin-left:0}
.phone .mlink .brk{flex-basis:100%;height:0}
.menu button.dis small{color:var(--muted)}
/* Edit on touch: one row = one 44px rule (no empty rule under each line) */
.touch .rscroll.edc{background:linear-gradient(var(--ired),var(--ired)) 0 var(--rl,111px)/100% 1.5px no-repeat,repeating-linear-gradient(to bottom,transparent 0 43px,var(--iblue) 43px 44px) 0 calc(var(--rl,111px) + 2px)/100% 100% no-repeat,var(--icard);background-attachment:local}
.touch .edc .facts{line-height:44px}
.touch .edc .sec{padding-top:44px}
.touch .edc .sec h3{height:44px;line-height:44px}
.touch .edc .ed .ing{min-height:44px}
.touch .edc .ed .ing>*{line-height:44px}
.touch .edc .ed .ing .n .sub{margin:10px 0}
.touch .edc .ed .hdl{top:0}
.touch .edc .rm,.touch .edc .lmore{margin-top:0}
.touch .edc .eadd{min-height:44px;padding-top:0}
.touch .edc .stp li{line-height:22px;padding-top:11px;padding-bottom:11px}
.touch .edc .stp li::before{top:12px}
.touch .edc .sugg{min-height:44px;padding:4px 6px 4px 10px}
.touch .edc .sugg .btn{height:36px}
/* chips inside running words: thinner, same icon (visual r3 #7) */
.stp .sub,.sw .sub{border-color:transparent;background:rgba(228,237,226,.75);padding:0 5px 0 4px}
.pick .pf .why{color:var(--muted);font-weight:400}
.ftab .nm2{white-space:nowrap}
/* ---------- round 5 polish ---------- */
.gcard .cs .partbox .tick{border-bottom:0}
.phone .ixc .task .tw .ln.mf{height:auto;padding:6px 0;row-gap:0}
.phone .ixc .task .tw .ln.mf small{flex-basis:100%;line-height:28px;padding-top:6px}
.src{flex-wrap:nowrap}.src:has(.also){flex-wrap:wrap}
.narrow .stage>.scol:first-child{flex:1 0 auto}
.narrow .scol>.card.stepc{flex:1 0 auto}
.phone .rpop{position:fixed;z-index:200}
/* ---------- round 6 ---------- */
.computer .sheet,.ipadside .sheet{bottom:auto;max-height:calc(100% - 94px)}
.computer .sh-b,.ipadside .sh-b{flex:0 1 auto}
/* ---------- round 7 ---------- */
/* one Make / Buy / Have control everywhere: the C-071 drop button (chip fill, line chevron); light green only while open */
.mk{height:32px;border:0;border-radius:8px;padding:0 8px 0 12px;background:var(--chip);color:var(--ink);font-size:13.5px;font-weight:600;gap:6px;box-shadow:none}
.mk .cv{display:inline-flex;color:inherit}.mk .cv svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mk:hover{background:#DCCFB8;border:0}.mk.on{background:var(--sage-light);box-shadow:inset 0 0 0 1px var(--sage-line)}
.mk.buy,.mk.have{border:0}
.mk .tape{font-size:12px;line-height:18px;padding:0 5px}
.touch .mk{height:40px}.touch .mk::after{inset:-2px 0}
.mkro{display:inline-flex;align-items:center;gap:6px}
.mnote{flex-basis:auto}
.phone .mnote{flex-basis:auto}
.mnote.chg{display:inline-flex;align-items:center;gap:6px;color:var(--ink2)}
.mnote.chg svg{width:15px;height:15px;color:var(--muted)}
/* the C4 sheet for Make / Buy / Have on phone (covers the tan bar and tab bar) */
.sheet.mks{height:auto;max-height:80%}
.mks .sh-h h4{font-size:17px}
.mks .sh-b{background:#FFFDF7;padding:6px 8px 14px;flex:0 1 auto}
.menu.inl{position:static;border:0;box-shadow:none;padding:0;min-width:0;background:none}
.menu.inl button{min-height:56px}
/* Cook part box: one control, no tick box */
.partbox{padding:6px 12px 10px}
.ptop .sub{margin-right:2px}
.ptop .mk{margin-left:auto}
.phone .ptop .amt{flex-basis:auto;padding-left:0;margin-top:0}
.phone .ptop .mk{margin-left:0}
.partbox .pq{padding-left:0;margin-top:2px}
.partbox .chkn{margin-left:0}
/* Edit: a small link button where C-080 had nothing; ✕ stays */
.lnk{flex:none;width:24px;height:24px;margin-top:2px;border:0;background:none;border-radius:5px;color:#A79A80;display:inline-flex;align-items:center;justify-content:center;padding:0;position:relative}
.lnk svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lnk:hover,.lnk.on{background:var(--sage-light);color:var(--sage-dark)}
.lnk.is{color:var(--sage-mid)}
.touch .lnk{width:44px;height:44px;margin-top:-8px}
.touch .edc .lnk{margin-top:0}
.tip{position:absolute;right:0;bottom:calc(100% + 6px);background:#2D2A24;color:var(--cream);font-size:13px;font-weight:500;line-height:1;padding:7px 9px;border-radius:6px;white-space:nowrap;z-index:20;pointer-events:none}
.tip::after{content:"";position:absolute;right:12px;top:100%;border:6px solid transparent;border-top-color:#2D2A24}
.touch .tip{right:6px}
/* import suggestion: never breaks mid-sentence; the buttons drop below when there's no room */
.sugg{margin-left:80px;flex-wrap:wrap}
.sugg .w{flex:1 0 auto;white-space:nowrap}
.touch .sugg{margin-left:114px}
.phone .sugg{margin-left:34px;padding:6px 8px}
.phone .sugg .w{flex-basis:100%}
.touch .edc .sugg{min-height:44px;align-content:center;padding:4px 8px 4px 10px;row-gap:6px}
.phone .edc .sugg,.ipadside .edc .sugg{min-height:88px}
/* hero picture: a linked part gets its own picture (a jar), so a page turn shows */
.ph.jar{background:radial-gradient(ellipse at 50% 120%,rgba(0,0,0,.10),transparent 60%),repeating-linear-gradient(-45deg,#B9C4C8 0 6px,#AEBABF 6px 12px)}
.ph.jar::before{content:"";position:absolute;left:32%;right:32%;top:30%;bottom:12%;border-radius:6px 6px 9px 9px;background:linear-gradient(90deg,rgba(255,255,255,0) 18%,rgba(255,255,255,.35) 24%,rgba(255,255,255,0) 32%),var(--food,#5E8C3A);box-shadow:0 0 0 2px rgba(255,255,255,.55),0 2px 4px rgba(0,0,0,.18)}
.ph.jar::after{content:"";position:absolute;left:30%;right:30%;top:16%;height:16%;border-radius:3px;background:linear-gradient(#9B7048,#7A5232);box-shadow:0 1px 2px rgba(0,0,0,.25)}
.phone .rh .ph.jar,.bback+.rh .ph.jar{background:radial-gradient(ellipse at 50% 120%,rgba(0,0,0,.10),transparent 60%),repeating-linear-gradient(-45deg,#B9C4C8 0 6px,#AEBABF 6px 12px)}
/* pop-up on phone: Back and Close share one row */
.rp-jump .rpb{display:inline-flex;align-items:center;gap:4px;height:44px;border:0;background:none;padding:0 8px 0 2px;margin-left:-6px;border-radius:8px;color:var(--sage-mid);font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rp-jump .rpb .ch{font-size:22px;line-height:1;margin-top:-2px}
.phone .rp-jump:has(.rpb){padding-left:12px}
.phone .rpop .bback{display:none}
.phone .rpop .rscroll:has(>.bback){--rl:111px}
/* dead link: plain words, the usual need mark, a quiet note after the words */
.ing .n .dn{font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.ing .n .dn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.7}
.tback.bare{-webkit-mask-image:none;mask-image:none;padding:0 10px 0 8px;min-width:36px;justify-content:center}
.touch .tback.bare{min-width:44px}
.tl>.tback.bare+.t{margin-left:-10px}
/* read-only: a turned-off tan bar button is grey */
.act2:disabled{background:#EEEBE4;border-color:#D9D4C8;color:#9A968A;cursor:default}
/* finish: one wording for the leftover save */
.lfbox .bts .btn{font-weight:600}
/* state bar: mockup-only notes (server work, stand-ins) */
.snote{font-size:12.5px;color:#444;line-height:1.45;max-width:980px}
.snote summary{cursor:pointer;color:#555;font-weight:600}
.snote ul{margin:4px 0 2px 18px;padding:0}
/* ---------- round 10 ---------- */
/* Edit: a labelled "Link" button on the picked line only (C-080 has no line ⋯); the add row is a plain band (no rules through it) */
.lkt{display:none;height:24px;margin-top:2px;padding:0 8px;gap:4px}
.lkt svg{width:15px;height:15px}
.ing.e.sel .lkt,.ing.e:focus-within .lkt{display:inline-flex}
.touch .edc .lkt{height:36px;margin:4px 4px 0 0;padding:0 12px}
.ed .ing.e.sel:not(.hl){background:rgba(255,255,255,.6);box-shadow:-8px 0 0 rgba(255,255,255,.6),8px 0 0 rgba(255,255,255,.6)}
.rscroll .eadd{background:var(--icard);position:relative}
.phone .eadd{flex-wrap:nowrap;gap:6px}
.phone .eadd .eab{padding:0 9px;gap:4px}
/* Prep: the Start Cook-Ahead row is a plain band; a done task (C-095 tick) */
.ixc .task .tw .ln.mf{background:var(--icard)}
.ixc .task .tk .bx.on{background:var(--sage-text);border-color:var(--sage-text);display:grid;place-items:center}
.ixc .task .tk .bx svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ixc .task.done .tt>span:first-child{text-decoration:line-through;text-decoration-color:rgba(0,0,0,.35);color:var(--muted)}
.ixc .task.done .tw b{font-weight:600;color:var(--ink)}
/* Cook part box: C-084's tick row back, the words under it start at the tick's text */
.partbox .tick .nm{color:var(--ink)}
.partbox .tick .nm b{font-weight:600}
.partbox .pq{padding-left:34px;margin-top:-6px;padding-bottom:2px;line-height:1.45;font-size:14px;color:var(--muted)}
.partbox .pq .amt{font-size:14px}
.partbox .prow{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;margin-top:-2px}
.partbox .prow .mk{margin:0}
.partbox .chkn{align-items:center}
.partbox .chkn .b{margin-left:auto;flex:none;background:#fff}
.partbox .pbts{margin:8px 0 2px 34px;padding-left:0}
.b.sel{background:var(--sage-light);border-color:var(--sage-text);color:var(--sage-text)}
/* r15 Q21 B: no tick; the name, then Plan's control, all starting at the box edge */
.partbox.nt{padding:10px 12px 10px}
.partbox.nt .pnm{font-size:var(--side);color:var(--ink);line-height:1.4;margin:4px 0 8px}
.partbox.nt .pnm b{font-weight:600}
.partbox.nt .pq{padding-left:0;margin-top:4px}
.partbox.nt .prow{margin-top:0}
.partbox.nt .chkn,.partbox.nt .pbts{margin-left:0}
/* Cook finish: C-084 rows */
.lrow{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;min-height:calc(var(--r) * 1.6);border-bottom:1px solid rgba(80,120,170,.14)}
.lrow .nm{font-weight:600;font-size:16.5px;min-width:150px;display:flex;flex-direction:column;line-height:1.25}
.lrow .nm small{font-weight:400;font-size:13px;color:var(--muted)}
.place{display:inline-flex;gap:8px}
.place.ghost{visibility:hidden}
.phone .place.ghost{display:none}
.phone .lrow.lm .nm{flex-basis:100%;margin-top:8px;min-width:0}
.lrow.lm{padding-bottom:8px}
#dev:not(.phone) .lrow.lm{flex-wrap:nowrap;min-height:60px;gap:10px}
#dev:not(.phone) .lrow.lm .nm{flex:1;min-width:0}
#dev:not(.phone) .lrow.lm .stp2 span{min-width:104px;padding:0 8px;text-align:center}
#dev:not(.phone) .lrow.lm .stp2 button{width:40px}
.ratenote{display:flex;gap:8px;align-items:flex-start;margin-top:14px;font-size:14px;color:var(--muted);line-height:1.45}
.ratenote svg{width:18px;height:18px;flex:none;margin-top:1px}
.cwrap .gcard.fin{flex:0 1 auto}
.gcard.fin .cs{padding-bottom:calc(var(--r) * .75)}
.hsub{text-align:center;font-size:14px;color:var(--muted);padding-top:12px}
.hold{overflow:hidden;isolation:isolate;position:relative}
.hold .hic{display:inline-flex;width:24px;height:24px;border-radius:50%;border:2px solid rgba(250,244,235,.7);align-items:center;justify-content:center}
.hold .hic::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--cream)}
/* chip inside step words sits on the text baseline (inline-block takes the text's baseline) */
.stp .sub,.sw .sub,.rp-sec li .sub{display:inline-block;height:auto;line-height:1.25;vertical-align:baseline;padding:0 5px 0 4px}
.stp .sub svg,.sw .sub svg{display:inline-block;vertical-align:-.16em;margin-right:4px}
.stp .sub .ar,.sw .sub .ar{margin-left:3px}
.stp .sub .nmw,.sw .sub .nmw{overflow:visible}
/* round 11: the step sentence sits on the rule pitch (no rule through its letters) */
.cs.step{padding-top:0}

/* ---------- round 12 ---------- */
/* Edit chip opens Change / Unlink: a small ▾, the same caret as the Make It control */
.sub .cv{display:inline-flex;color:inherit;margin-left:1px}.sub .cv svg{width:14px;height:14px;stroke-width:2.2}
/* Edit on touch: steps sit on plain card (one divider per step), so no rule crosses a wrapped step */
.touch .edc .stp{background:var(--icard);position:relative;margin-top:44px;padding-top:0}
.touch .edc .stp li{border-bottom:1px solid var(--iblue);padding-top:10px;padding-bottom:11px}
.touch .edc .stp li::before{top:11px}
/* dead link: the note sits where "recipe" sits, before the need mark */
.ing .rcp.dn{display:inline-flex;align-items:center;gap:4px;font-size:12.5px}
/* Prep: the Start Cook-Ahead band covers the whole card width (no rule stubs either side) */
.ixc .task .tw .ln.mf{box-shadow:-60px 0 0 var(--icard),12px 0 0 var(--icard)}
/* Groceries source: muted words like C-071; only the chip is a link look */
.src .lk{color:var(--ink2);font-weight:600}
/* Plan: the meal's slot on phone, first on the facts line */
.mfacts .slot{font-weight:600;color:var(--ink2)}
.phone .mlink .mnote{flex-basis:100%}
.mlink.sd{gap:6px 8px}
.mlink .also{font-size:12.5px;color:var(--muted);white-space:nowrap}
/* Cook: a calmer gap under Servings */
.srvrow{min-height:calc(var(--r) * 1.5)}
.partbox .pq .lk2{font-size:14px}
.partbox .chkn{flex-direction:column;align-items:stretch;gap:8px}
.partbox .chkn .ct{display:flex;gap:8px;align-items:flex-start}
.partbox .chkn .pbts{margin:0;padding-left:26px}
.partbox .chkn .pbts .b{margin:0;background:#fff}
.partbox .chkn .pbts .b.sel{background:var(--sage-light)}
.b:disabled{background:#EEEBE4;border-color:#D9D4C8;color:#9A968A;cursor:default}
/* Edit: "already has that line" catch in the add sheet */
.dupe{background:var(--icard);border-radius:4px;box-shadow:0 1px 3px rgba(40,26,8,.14),0 0 0 1px rgba(60,40,10,.12);padding:12px 14px 14px;font-size:14.5px;line-height:1.45;color:var(--ink2);margin-bottom:12px}
.dupe b{color:var(--ink)}
.dupe .bts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.menu.wide2{max-width:330px}
/* Cook: the toast sits above the big buttons, never over them */
#dev.cook .toast{bottom:96px}
/* Get Ready: the card's list fades at its foot, so a half-cut button never shows hard */
.gcard:not(.fin) .cs{-webkit-mask-image:linear-gradient(#000 calc(100% - 28px),transparent);mask-image:linear-gradient(#000 calc(100% - 28px),transparent)}
.partbox .lk2{position:relative}.touch .partbox .lk2::after{content:"";position:absolute;inset:-10px -4px}
#dev.cook.phone .toast{bottom:84px;white-space:normal;width:calc(100% - 24px);justify-content:space-between}

 return `<div class="cwrap"><div class="card gcard"><div class="chd"><h2>Get ready</h2><div class="sb">${esc(r.n)}<span class="sp"></span>with ${phone()&&parts.length>1?parts.length+' recipes':parts.map(p=>R[p.id].n).join(' and ')}<span class="sp"></span>${r.steps.length+nOn.reduce((s,p)=>s+R[p.id].steps.length,0)} steps</div></div><div class="cs">${body}</div></div><div class="cacts"><button class="b main big wide" data-a="startcook">Start Cooking</button></div></div>`;}
/* the whole meal in cooking order: parts it needs first, then the main, then served-with parts (Q8) */
function cookSeq(){const u=S.ui,order=[...partsFirst().filter(p=>u.part[p.id]).map(p=>p.id),u.r,...partsLast().filter(p=>u.part[p.id]).map(p=>p.id)];
 return order.flatMap(d=>R[d].steps.map((t,i)=>({d,i:i+1,n:R[d].steps.length})));}
function dishScale(d){const u=S.ui;if(d===u.r)return u.srv/R[u.r].serves;const p=cookParts().find(x=>x.id===d);return p?partMake(p):1;}
function cookSteps(){const u=S.ui,r=R[u.r],parts=cookParts().filter(p=>u.part[p.id]),seq=cookSeq();
 const tabs=[['all','All Together'],...parts.filter(p=>!p.serve).map(p=>[p.id,R[p.id].n]),[u.r,r.n],...parts.filter(p=>p.serve).map(p=>[p.id,R[p.id].n])];
 let d,i,n,pos;
 if(u.tab==='all'){const k=Math.min(u.k||0,seq.length-1),s=seq[k];d=s.d;i=s.i;n=s.n;pos=`${k+1} of ${seq.length}`;}
 else{d=u.tab;n=R[d].steps.length;i=Math.min(u.step||1,n);pos=`Step ${i} of ${n}`;}
 const rr=R[d],cols={[u.r]:'#F0D49A'};parts.forEach((p,j)=>cols[p.id]=['#CFE0E8','#E6DCEB','#E8D6B2'][j%3]);/* r12: no sage on a part's tab or label, so only the real link chip looks like a link */
 const ph=phone();
 const ft=`<div class="ftabs" role="tablist">${tabs.map(([k,l],j)=>{const on=u.tab===k;const cnt=k==='all'?`${(u.k||0)+1}/${seq.length}`:`${k===d?i:1}/${R[k].steps.length}`;
  return `<button class="ftab ${on?'on':''}" role="tab" aria-selected="${on}" data-tab="${k}" data-col="${k==='all'?'#EFE3CB':cols[k]}" style="z-index:${on?50:20-j}"><svg class="sh"></svg><span>${k!=='all'&&k!==u.r?`<svg class="ic3" viewBox="0 0 24 24"><path d="${P003}"/></svg>`:''}<span class="nm2">${esc(ph&&k==='all'?'All':l)}</span>${on?`<small>${cnt}</small>`:''}</span></button>`;}).join('')}</div>`;
 const step=`<div class="card stepc"><div class="hrow"><span class="dchip" style="background:${cols[d]}">${esc(rr.n)}</span><span class="pos">${u.tab==='all'?`Step ${i} of ${n} | ${pos} in all`:pos}</span></div><div class="cs step"><p class="sw">${stepWords(rr.steps[i-1])}</p></div></div>`;
 const m=dishScale(d);
 const side=`<div class="card side"><div class="chd" style="padding:10px 18px 8px"><h2 style="font-size:19px">${esc(rr.n)}${d!==u.r?` <span style="font-weight:500;font-size:15px;color:var(--muted)">${(p=>p?partAmt(p,u.whole&&d==='pesto'):esc(bw(m)))(cookParts().find(x=>x.id===d))}</span>`:''}</h2></div><div class="cs">${rr.groups.flatMap(g=>g[1]).map(l=>`<div class="sing"><span class="q">${l[0]==null?'':amt(l[0]*m,l[1])}</span><span>${l[3]&&l[3].link?chip(l[3].link):esc(l[2])}</span></div>`).join('')}</div></div>`;
 return `<div class="cwrap"><div class="stage"><div class="scol">${ft}${step}</div><div class="scol">${side}</div></div><div class="cacts"><button class="b out big" data-a="prev">${svg('back')}Back</button><button class="b main big" data-a="next">Next${svg('fwd')}</button></div></div>`;}
function cookFinish(){const u=S.ui;
 /* r10: C-084's finish (leftover rows with − amount + and Fridge / Freezer, then Back + Hold to Finish). The part is one
    more row. Its amount starts at None after a ½ batch (the pasta used it all), at 1 cup after a whole batch. No "made more?" ask. */
 u.lf=u.lf||{pasta:2,pesto:u.whole?1:0};u.lp=u.lp||{pasta:'fridge',pesto:'fridge'};
 const row=(d,nm,note,uw)=>{const v=u.lf[d];return `<div class="lrow lm"><span class="nm">${nm}${note?`<small>${note}</small>`:''}</span><span class="stp2"><button data-a="lf" data-d="${d}" data-v="-1" aria-label="Less">−</button><span>${v?fmt(v)+' '+uw(v):'None'}</span><button data-a="lf" data-d="${d}" data-v="1" aria-label="More">+</button></span><span class="place${v?'':' ghost'}"${v?'':' aria-hidden="true"'}>${['fridge','freezer'].map(x=>`<button class="b ${u.lp[d]===x?'sel':'out'} sm" data-a="lp" data-d="${d}" data-v="${x}"${v?'':' tabindex="-1"'}>${x==='fridge'?'Fridge':'Freezer'}</button>`).join('')}</span></div>`;};
 /* r12: the part gets a row only when more was made than the meal used (a whole batch); exactly ½ batch made = no row */
 const rows=row('pasta','Pesto Pasta','',v=>v===1?'Serving':'Servings')+(u.part.pesto&&u.whole?row('pesto','Basil Pesto','Save the rest: made 1 batch, used 1 cup',v=>v>1?'Cups':'Cup'):'');
 const ph=phone();
 return `<div class="cwrap"><div class="card gcard fin"><div class="chd"><h2>All done</h2><div class="sb">Pesto Pasta<span class="sp"></span>${u.part.pesto?'with Basil Pesto':'Tue Dinner'}${ph?'':`<span class="sp"></span>Cooked as Written`}</div></div><div class="cs">
  <div class="sech"><h4>Leftovers</h4></div>${rows}
  <div class="ratenote">${svg('info')}<span>${u.part.pesto&&!u.whole?'The ½ batch of Basil Pesto all went into the pasta. ':''}These save to Leftovers. Tomorrow, Today asks how it tasted.</span></div>
 </div></div><div class="hsub">${ph?'Press and hold to finish.':'Press and hold to finish. What you used comes out of your Kitchen.'}</div><div class="cacts"><button class="b out big" data-a="backcook" aria-label="Back to cooking">${svg('back')}Back</button><button class="b main big wide hold" data-a="finish"><span class="hic"></span>Hold to Finish</button></div></div>`;}

/* ---------------- folder tab outline (C-084 ftPath, from C-058 FolderDrawer) ---------------- */
function ftPath(W,H,open){const s=6,r=7,f=4,L=.5,R2=W-.5,top=1.5,len=Math.hypot(s,H-top),ux=s/len,uy=(H-top)/len,n=v=>+v.toFixed(2);
 const tl=`L${n(L+s-r*ux)} ${n(top+r*uy)} Q${n(L+s)} ${n(top)} ${n(L+s+r)} ${n(top)} L${n(R2-s-r)} ${n(top)} Q${n(R2-s)} ${n(top)} ${n(R2-s+r*ux)} ${n(top+r*uy)}`;
 if(!open)return{fill:`M${L-.5} ${H} ${tl} L${R2+.5} ${H} Z`,stroke:`M${L} ${H+.5} ${tl} L${R2} ${H+.5}`};
 const a=`${n(L+f*ux)} ${n(H+.5-f*uy)}`,b=`${n(R2-f*ux)} ${n(H+.5-f*uy)}`;
 return{fill:`M${L-f} ${H+2} L${L-f} ${H} Q${L} ${H} ${a} ${tl} L${b} Q${R2} ${H} ${R2+f} ${H} L${R2+f} ${H+2} Z`,stroke:`M${L-f} ${H+.5} Q${L} ${H+.5} ${a} ${tl} L${b} Q${R2} ${H+.5} ${R2+f} ${H+.5}`};}
function drawTabs(){$$('#dev .ftab').forEach(b=>{const W=b.offsetWidth,H=b.offsetHeight;if(!W)return;const on=b.classList.contains('on'),p=ftPath(W,H,on),sv=b.querySelector('svg.sh');
 sv.setAttribute('width',W);sv.setAttribute('height',H+2);sv.setAttribute('viewBox',`0 0 ${W} ${H+2}`);
 const g=b.closest('.gtabs');sv.innerHTML=`<path d="${p.fill}" fill="${on?(g?'#FAF6EE':'#FFFDF7'):b.dataset.col}"/><path d="${p.stroke}" fill="none" stroke="${g?'#D2C6B0':on?'rgba(60,40,10,.22)':'#B9A988'}" stroke-width="1"/>`;});}

/* ---------------- toast ---------------- */
const toastHTML=()=>`<div class="toast${S.ui.toast?' show':''}" role="status"><span>${esc(S.ui.toast||'')}</span>${S.ui.toast?'<button data-a="undo">Undo</button>':''}</div>`;
let tt;function toast(m){S.ui.toast=m;const t=$('#dev .toast');if(t){t.querySelector('span').textContent=m;t.classList.add('show');}clearTimeout(tt);tt=setTimeout(()=>{S.ui.toast=null;$('#dev .toast')?.classList.remove('show');},3200);}

/* ---------------- build + wire ---------------- */
function build(){const d=D(),dev=$('#dev');
 dev.className=S.d+' '+(d.narrow?'narrow':'wide')+(touch()?' touch':'')+(S.page==='cook'?' cook':'');
 dev.style.width=d.w+'px';dev.style.height=d.h+'px';
 const V={edit:viewEdit,book:viewBook,plan:viewPlan,groc:viewGroc,prep:viewPrep,cook:viewCook}[S.page];
 dev.innerHTML=V();renderCtl();fit();wire();place();drawTabs();}
function fit(){const d=D();if(FULL){$('#scaler').style.transform='none';$('#scaler').style.width=d.w+'px';$('#scaler').style.height=d.h+'px';return;}
 const avail=$('#stage').clientWidth,sc=Math.min(1,avail/(d.w+16));$('#scaler').style.transform=`scale(${sc})`;$('#scaler').style.height=(d.h+16)*sc+'px';$('#scaler').style.width=(d.w+16)+'px';}
/* place floating menus next to the control that opened them */
function anchor(menu,btn,alignRight=true){if(!menu||!btn)return;const op=menu.offsetParent||$('#dev'),dv=op.getBoundingClientRect(),b=btn.getBoundingClientRect(),sc=dv.width/op.offsetWidth||1;
 const top=(b.bottom-dv.top)/sc+4;let left=alignRight?(b.right-dv.left)/sc-menu.offsetWidth:(b.left-dv.left)/sc;left=Math.max(8,Math.min(left,op.offsetWidth-menu.offsetWidth-8));
 const h=menu.offsetHeight,maxT=op.offsetHeight-h-8;menu.style.left=left+'px';menu.style.top=Math.max(8,Math.min(top,maxT))+'px';}
function place(){const u=S.ui;
 if(S.page==='edit'&&u.menu)anchor($('#lmenu'),$(`.sub[data-lm="${u.menu}"]`),false);
 if((S.page==='plan'||S.page==='cook')&&u.menu)anchor($('#mkmenu'),$(`[data-mk="${u.menu}"]`),false);
 if(S.page==='prep'&&u.menu)anchor($('#tmenu'),$(`[data-tm="${u.menu}"]`));
 if(S.page==='book'&&u.bmenu)anchor($('#bmenu'),$('[data-a="bmenu"]'));
 if(S.page==='edit'&&(u.picker||u.sugg||u.menu)&&!u.adding){const el=$('.ing.e[data-lid="l1"]'),sc=$('#dev .pane .rscroll');if(el&&sc){const d=el.getBoundingClientRect().top-sc.getBoundingClientRect().top;if(d>sc.clientHeight*.6||d<0){sc.scrollTop+=d-sc.clientHeight*.35;}}
  if(u.menu)anchor($('#lmenu'),$(`.sub[data-lm="${u.menu}"]`),false);}}
function rerender(){const keep={};$$('#dev .rscroll,#dev .pscroll,#dev .cs').forEach((e,i)=>keep[i]=e.scrollTop);build();$$('#dev .rscroll,#dev .pscroll,#dev .cs').forEach((e,i)=>{if(keep[i]!=null)e.scrollTop=keep[i];});}
function wire(){const u=S.ui,dev=$('#dev');
 dev.onclick=e=>{const t=e.target.closest('button,[data-a]');
  /* close an open menu on any press outside it */
  if(!t){if(u.menu||u.bmenu){u.menu=null;u.bmenu=null;rerender();}return;}
  const a=t.dataset.a;
  if(t.dataset.open){const id=t.dataset.open;
   const push=st=>{const i=st.indexOf(id);if(i>=0)st.length=i+1;else st.push(id);};
   if(S.page==='book'){push(u.stack);rerender();return;}
   if(S.page==='plan'||S.page==='prep'||S.page==='cook'){if(!u.pop)u.pop=[id];else push(u.pop);rerender();return;}
   toast('Opens '+R[id].n);return;}
  if(t.dataset.pop){const st=S.page==='book'?u.stack:u.pop;if(st&&st.length>1){st.pop();rerender();}return;}
  if(t.dataset.back){if(t.dataset.back==='pop'){u.stack.pop();rerender();}else toast('Back to the Recipes list (not in this mockup)');return;}
  if(t.dataset.ll){u.tip=null;u.menu=null;u.picker=1;u.q='pesto';u.hl=t.dataset.ll;rerender();return;}
  if(t.dataset.lm){u.menu=u.menu===t.dataset.lm?null:t.dataset.lm;rerender();return;}
  if(t.dataset.pick){const id=t.dataset.pick;
   /* r12: adding a recipe that a plain line already names asks to link that line instead */
   if(u.adding&&id==='pesto'&&u.rid==='pasta'&&!u.linked){u.dupe='pesto';rerender();return;}
   u.picker=0;u.hl=null;u.menu=null;if(u.adding){u.adding=0;u.added=(u.added||[]).concat(id);toast(`Added a line: 1 batch ${R[id].n}`);}else{u.linked=true;u.linkTo=id;toast(`Linked to ${R[id].n}.`);}rerender();return;}
  if(t.dataset.mk){if(t.disabled)return;u.menu=u.menu===t.dataset.mk?null:t.dataset.mk;rerender();return;}
  if(t.dataset.rp){u.pop=[t.dataset.rp];rerender();return;}
  if(t.dataset.ch){const f=t.dataset.for||'pesto',c=t.dataset.ch;u.undo={f,prev:S.mc[f],page:S.page};S.mc[f]=c;u.menu=null;u.picked=0;u.same=0;u.justUn=0;
   if(S.page==='cook'){u.part[f]=c==='make'||(c==='have'&&isShort(f));u.pc=u.pc||{};if(c==='make')delete u.pc[f];else u.pc[f]=c;}
   const fol={plan:'Groceries, Prep and Cook follow.',cook:'Groceries and Plan will follow.',prep:'Groceries, Plan and Cook follow.'}[S.page]||'Every page follows.';
   rerender();toast(`${R[f].n}: ${CH[c]}. ${fol}`);return;}
  if(t.dataset.sh){S.mc.pesto=t.dataset.sh;u.sheet=0;rerender();return;}
  if(t.dataset.more){u.more[t.dataset.more]=!u.more[t.dataset.more];rerender();return;}
  if(t.dataset.tm){u.menu=u.menu===t.dataset.tm?null:t.dataset.tm;rerender();return;}
  /* r12 (lead #2): unticking in Cook says what it changes, with Undo; it never rewrites the plan silently */
  if(t.dataset.part){const id=t.dataset.part;u.undo={f:id,prev:S.mc[id],page:'cook'};u.part[id]=!u.part[id];u.pc=u.pc||{};u.menu=null;
   if(!u.part[id]){const c=S.kit[id]&&!isShort(id)?'have':'buy';u.pc[id]=c;S.mc[id]=c;u.justUn=S.kit[id]?1:0;u.hl=id;rerender();toast(`${R[id].n}: ${CH[c]}. Groceries and Plan will follow.`);}
   else{delete u.pc[id];S.mc[id]='make';u.justUn=0;u.hl=null;rerender();toast(`${R[id].n}: Make It. Groceries and Plan will follow.`);}return;}
  if(t.dataset.tk){u.ticks=u.ticks||{};u.ticks[t.dataset.tk]=!u.ticks[t.dataset.tk];rerender();return;}
  if(t.dataset.tab){u.tab=t.dataset.tab;u.step=1;rerender();return;}
  switch(a){
   case 'pick':u.menu=null;u.picker=1;u.q=u.linked?R[u.linkTo||'pesto'].n.toLowerCase():'pesto';u.hl='l1';rerender();break;
   case 'unlink':u.menu=null;u.linked=false;u.linkTo=null;rerender();toast('Unlinked. The line keeps its words.');break;
   case 'closepick':u.picker=0;u.hl=null;u.adding=0;rerender();break;
   case 'linkadd':u.picker=1;u.q='';u.adding=1;rerender();break;
   case 'suglink':u.sugg=0;u.linked=true;rerender();toast('Linked to Basil Pesto.');break;
   case 'sugno':u.sugg=0;rerender();toast('Kept as words. We won\'t ask again for this line.');break;
   case 'undo':{u.toast=null;const z=u.undo;u.undo=null;
    if(z){S.mc[z.f]=z.prev;if(S.page==='cook'){u.part[z.f]=z.prev==='make'||(z.prev==='have'&&isShort(z.f));u.pc=u.pc||{};if(z.prev==='make')delete u.pc[z.f];else u.pc[z.f]=z.prev;u.justUn=0;u.hl=null;}}
    rerender();break;}
   case 'dupelink':u.dupe=null;u.picker=0;u.adding=0;u.hl=null;u.linked=true;u.linkTo='pesto';rerender();toast('Linked the line "basil pesto" to Basil Pesto.');break;
   case 'dupeadd':u.dupe=null;u.picker=0;u.adding=0;u.added=(u.added||[]).concat('pesto');rerender();toast('Added a line: 1 batch Basil Pesto');break;
   case 'bmenu':u.bmenu=!u.bmenu;rerender();break;
   case 'del':u.bmenu=null;u.dlg='delete';rerender();break;
   case 'dlgno':u.dlg=null;rerender();break;
   case 'dlgyes':u.dlg=null;u.stack=['pasta'];u.dead=1;rerender();toast('Basil Pesto deleted. Its 2 lines stay as words.');break;
   case 'openrec':{const f=u.menuFor||u.menu;u.menu=null;u.pop=[f==='t1'?'pesto':f==='t3'?'tikka':'pasta'];rerender();break;}
   case 'popclose':u.pop=null;rerender();break;
   case 'closemk':u.menu=null;rerender();break;
   case 'pick2':break;
   case 'srv':u.srv=Math.max(1,u.srv+(+t.dataset.v));rerender();break;
   case 'tickall':u.ticks=u.ticks||{};$$('#dev .gcard [data-tk]').forEach(b=>u.ticks[b.dataset.tk]=true);rerender();break;
   case 'startcook':if(S.page==='cook'){u.view='steps';u.tab=partsFirst().find(p=>u.part[p.id])?.id||u.r;u.step=1;rerender();}else toast('Opens Cook (switch to the Cook page)');break;
   case 'next':{if(u.tab==='all'){const L=cookSeq().length;if((u.k||0)<L-1)u.k=(u.k||0)+1;else u.view='finish';rerender();break;}
    const rr=R[u.tab];if((u.step||1)<rr.steps.length){u.step=(u.step||1)+1;}else{const order=[...partsFirst().filter(p=>u.part[p.id]).map(p=>p.id),u.r,...partsLast().filter(p=>u.part[p.id]).map(p=>p.id)];const j=order.indexOf(u.tab);if(j>=0&&j<order.length-1){u.tab=order[j+1];u.step=1;}else{u.view='finish';}}rerender();break;}
   case 'prev':if(u.tab==='all'){if((u.k||0)>0)u.k--;else u.view='ready';rerender();break;}
    if((u.step||1)>1){u.step--;rerender();}else{u.view='ready';rerender();}break;
   case 'whole':u.whole=true;u.lf=null;rerender();toast('Basil Pesto: 1 whole batch for this cook. The rest saves at the end.');break;
   case 'half':u.whole=false;u.lf=null;rerender();toast('Basil Pesto: just the 1 cup it needs.');break;
   case 'save':u.saved=1;rerender();toast('Saved as #0013 in the Fridge.');break;
   case 'unsave':u.saved=0;rerender();break;
   case 'b3change':u.sheet=1;rerender();break;
   case 'cookahead':S.mc.pesto='have';S.kit.pesto=true;KIT.pesto.no=47;u.ahead=1;u.menu=null;rerender();toast('Basil Pesto saved as #0047. Tue Dinner now uses it.');break;
   case 'chgamt':u.amtOpen=!u.amtOpen;rerender();break;
   case 'amt':u.amt=+t.dataset.v;u.amtOpen=0;rerender();toast(`Basil Pesto: ${({0.5:'½ batch',1:'1 batch',2:'2 batches'})[u.amt]}. Groceries follow.`);break;
   case 'lf':{const d=t.dataset.d,st=d==='pesto'?0.5:1;u.lf[d]=Math.max(0,(u.lf[d]||0)+st*(+t.dataset.v));rerender();break;}
   case 'lp':u.lp[t.dataset.d]=t.dataset.v;rerender();break;
   case 'backcook':u.view='steps';u.tab=u.tab||u.r;rerender();break;
   case 'finish':toast('Hold the button to finish. (Mockup: leftovers saved.)');break;
  }};
 /* the prep ⋯ remembers which task it is for */
 $$('[data-tm]',dev).forEach(b=>b.addEventListener('click',()=>{S.ui.menuFor=b.dataset.tm;},true));
 const pq=$('#pq');if(pq){pq.oninput=()=>{u.q=pq.value;u.loading=0;$('#shb').innerHTML=new DOMParser().parseFromString(sheetHTML(),'text/html').querySelector('#shb').innerHTML;};}
 /* A2: typing in the line opens the type-ahead */
 if(S.A==='A2')$$('.ce.nn',dev).forEach(c=>c.oninput=()=>{const v=c.textContent.trim();u.hl=c.dataset.line;u.q=v.split(' ').slice(-1)[0];u.picker=v.length>=2?1:0;const ta=c.closest('.ing').querySelector('.ta');if(ta)ta.remove();if(u.picker)c.closest('.ing').insertAdjacentHTML('beforeend',typeahead());});}
/* ---------------- full-screen mode (?full=desktop|ipad|phone, or window.SC_FULL) ---------------- */
const FULL=window.SC_FULL||Q.get('full');
function fullPick(){const d=FULL==='phone'?'phone':FULL==='desktop'?'computer':(innerWidth>innerHeight?'ipadside':'ipadup');DEV[d].w=innerWidth;DEV[d].h=innerHeight;return d;}
if(FULL){document.documentElement.classList.add('full');S.d=fullPick();let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{S.d=fullPick();rerender();},250);});}
else if(Q.get('d')&&DEV[Q.get('d')])S.d=Q.get('d');
if(Q.get('shots'))document.documentElement.classList.add('shots');
$('#stfab').onclick=e=>{e.stopPropagation();$('#stpop').classList.toggle('show');};
document.addEventListener('pointerdown',e=>{const p=$('#stpop');if(p.classList.contains('show')&&!p.contains(e.target)&&e.target.id!=='stfab')p.classList.remove('show');});

preset();build();
