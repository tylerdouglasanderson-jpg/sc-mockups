*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--page)}
body{color:var(--ink);font:400 15px/1.45 var(--font);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;text-wrap:pretty}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input{font:inherit;color:inherit}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:16px;height:16px}
svg.pc{width:20px;height:20px;flex:none;display:block}
:focus-visible{outline:2px solid var(--sage-text);outline-offset:2px}
.sep{display:inline-block;width:1px;height:.95em;background:rgb(var(--c-muted) / .42);margin:0 8px;vertical-align:-.14em;flex:none}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* ONE themed scroll bar (DESIGN 4.10) */
.scroll,.sh-b,.hp .bd{scrollbar-width:thin;scrollbar-color:rgb(var(--c-muted) / .35) transparent}
.scroll::-webkit-scrollbar,.sh-b::-webkit-scrollbar{width:12px}
.scroll::-webkit-scrollbar-thumb,.sh-b::-webkit-scrollbar-thumb{background:rgb(var(--c-muted) / .35);border:3px solid transparent;background-clip:padding-box;border-radius:999px}

/* ---------- mockup-only strip (never part of the page) ---------- */
#mb{position:fixed;top:0;left:0;right:0;height:var(--mb);z-index:300;background:#1f1f1d;color:#d8d4cc;display:flex;align-items:center;gap:8px;padding:0 10px;font:500 13px system-ui;overflow-x:auto;white-space:nowrap}
#mb b{color:#fff;font-weight:600}
#mb select,#mb button{font:500 13px system-ui;background:#2e2d2a;color:#f3efe7;border:1px solid #4a4843;border-radius:6px;height:28px;padding:0 6px}
#mb button.on{background:#f3efe7;color:#1f1f1d}
#mb .tag{font:700 11px system-ui;letter-spacing:.06em;background:#FFF1A8;color:#5a4a00;border-radius:4px;padding:2px 6px}
#mb .nt{color:#a9a49a;font-weight:400}
html.shots #mb{display:none}
#app{position:fixed;top:var(--mb);left:0;right:0;bottom:0;display:flex;flex-direction:column;overflow:hidden;background:var(--page)}
html.shots #app{top:0}
#ovl{position:absolute;inset:0;pointer-events:none;z-index:50}
#ovl>*{pointer-events:auto}

.top .wm{font-family:Fraunces,Georgia,serif;font-style:italic;font-weight:600;font-size:22px;color:#FAF4EB;letter-spacing:.005em;line-height:50px}
.top .sp{flex:1}
/* the "?" (C-094 plain look, agreed 11-27 17:04) */
.hq{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--hdr-text);background:rgba(250,244,235,.16);box-shadow:inset 0 0 0 1px rgba(250,244,235,.35)}
.hq .qg{font-weight:700;font-size:17px;line-height:1}
.hq:hover{background:rgba(250,244,235,.24)}
.hq[aria-expanded=true]{background:rgba(250,244,235,.32)}
.top .av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;background:#5E7C55;color:var(--hdr-text);box-shadow:0 0 0 2px var(--hdr-text)}

/* ---------- thin tan bar (STANDARDS: ~46 px) ---------- */
.bar{height:46px;flex:none;background:var(--subbar);border-bottom:1px solid var(--brow);display:flex;position:relative;z-index:5}
.bar .in{display:flex;align-items:center;gap:10px;width:100%;max-width:1212px;margin:0 auto;padding:0 12px 0 16px;min-width:0}
.bar .ttl{font-weight:600;font-size:16px;color:var(--subbar-date);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bar .meta{font-size:13px;color:var(--subbar-2);padding-left:10px;border-left:1px solid var(--chip-warm-edge);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bar .sp{flex:1}
.bar .btn{height:36px;padding:0 14px;font-size:15px}

/* ---------- buttons (rounded rectangles, never pills) ---------- */
.btn{height:44px;border-radius:8px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:16px;white-space:nowrap;flex:none;transition:box-shadow .2s var(--ease),transform .12s var(--ease)}
.btn:active{transform:scale(.97);box-shadow:var(--press)}
.btn.pri{background:var(--sage-dark);color:#FAF4EB}.btn.pri:hover{background:var(--sage-hov)}
.btn.tan{background:var(--chip-warm);border:1px solid var(--chip-warm-edge);color:var(--ink);font-weight:500}.btn.tan:hover{box-shadow:var(--hover)}
.btn.ol{background:var(--card);border:1px solid var(--ink2);color:var(--ink)}.btn.ol:hover{background:var(--sage-light)}
.btn.sage{background:var(--sage);color:var(--ink)}.btn.sage:hover{box-shadow:var(--hover)}
.btn.off{background:#D9D5CC;color:#77736A;cursor:default}.btn.off:active{transform:none;box-shadow:none}
.btn.wide{width:100%}
.btn.sm{height:40px;padding:0 12px;font-size:15px;font-weight:500}

/* ---------- page column ---------- */
.scroll{flex:1;min-height:0;overflow:auto;position:relative}
.wrap{max-width:1212px;margin:0 auto;padding:16px 16px 40px}
.ph .wrap{padding:12px 12px 28px}
.cols{display:flex;gap:24px;align-items:flex-start;justify-content:center}
.lcol{flex:1;min-width:0;max-width:760px}
.side{display:none}
.wide .side{display:flex;flex-direction:column;gap:16px;width:320px;flex:none;position:sticky;top:16px}

/* ---------- the shopping list (C-071 Shopping mode rows) ---------- */
.card{background:var(--card);border:1px solid var(--folder-line);border-radius:12px;box-shadow:var(--shadow-card);overflow:clip}
.lhead{padding:12px 16px 10px;display:flex;flex-direction:column;gap:2px}
.lhead b{font-size:16px;font-weight:600;color:var(--ink)}
.lhead .split{font-size:13px;color:var(--ink2)}
.meter{height:8px;border-radius:4px;background:var(--track);overflow:hidden;margin:0 16px 12px}
.meter i{display:block;height:100%;background:var(--sage-text);border-radius:4px}
.saisle{display:flex;align-items:center;gap:0;min-height:44px;padding:10px 12px 8px 16px;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--card);border-top:1px solid var(--brow);border-bottom:1px solid var(--brow);position:sticky;top:0;z-index:2}
.saisle .nc{font-weight:500;letter-spacing:.04em}
.saisle .sp{flex:1}
.saisle svg.i{margin-right:8px}
.saisle.nf{color:var(--amber-text)}.saisle.cart{color:var(--sage-text)}
.saisle{flex-wrap:wrap}
.saisle .hint{white-space:nowrap;text-transform:none;letter-spacing:0;font-weight:400;font-size:13px;color:var(--ink2)}
.sj{height:36px;border-radius:8px;background:var(--chip);color:var(--ink);font-size:15px;font-weight:600;letter-spacing:0;text-transform:none;padding:0 10px 0 12px;display:inline-flex;align-items:center;gap:6px}
.sj:hover{box-shadow:var(--hover)}
/* C-071: Aisles rides only on the heading stuck at the top, so it never repeats down the list.
   r6: the hidden ones take no room (they made a blank band under a heading that wrapped at Big Text) */
.saisle{position:sticky}
.saisle .sj{visibility:hidden;position:absolute;right:12px;top:4px}.saisle.top .sj{visibility:visible;position:static}
.lpage .bar .in{max-width:1136px}
.srow{display:flex;align-items:center;gap:12px;min-height:56px;padding:4px 8px 4px 4px;border-bottom:1px solid var(--brow);position:relative;cursor:pointer;outline:none;-webkit-tap-highlight-color:transparent;transition:background .2s var(--ease)}
.grp>.srow:last-child{border-bottom:0}
.srow:hover{background:var(--card-hover)}
.srow:active{background:var(--row-hover)}
.srow:focus-visible{box-shadow:inset 0 0 0 2px var(--sage-text)}
/* the tick target is its own control; Put Back / ⋯ / Try Again sit beside it, never inside it */
.srow .hit{flex:1;min-width:0;display:flex;align-items:center;gap:12px;align-self:stretch;outline:none;border-radius:8px}
.srow .hit:focus-visible{box-shadow:inset 0 0 0 2px var(--sage-text)}
.srow.got.failed .tb2 i{background:var(--card);border-color:var(--amber-text);color:var(--amber-text)}
.srow.got.failed .nm{text-decoration:none;color:var(--ink)}.srow.got.failed .nm .q{color:var(--ink2)}
.srow .tb2{width:48px;height:44px;display:grid;place-items:center;flex:none}
.srow .tb2 i{width:22px;height:22px;border-radius:4px;border:1px solid var(--muted);background:var(--page);display:grid;place-items:center;color:#FAF4EB}
.srow .tb2 svg.i{width:16px;height:16px;stroke-width:2.5}
.srow.got .tb2 i{background:var(--sage-text);border-color:var(--sage-text)}
.srow.theirs .tb2 i{background:transparent;border-color:var(--sage-text);color:var(--sage-text)}
.srow.pend .tb2 i{background:var(--sage);border-color:var(--sage)}
.srow .main{flex:1;min-width:0;padding:6px 0}
.srow .nm{font-size:16px;font-weight:500;color:var(--ink);line-height:1.4}
.srow .nm .q{font-weight:400;color:var(--ink2)}
.srow.got .nm{color:var(--muted);text-decoration:line-through}
.srow.got .nm .q{color:var(--muted)}
.srow .src{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-top:1px}
.srow .src svg.i{width:14px;height:14px}
.srow .src.cart{color:var(--sage-text)}.srow .src.nf{color:var(--amber-text)}.srow .src.pend{color:var(--amber-text)}
.srow.off{cursor:default}.srow.off:hover,.srow.off:active{background:transparent}
.srow .kebab{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;color:var(--muted);flex:none}
.srow .kebab:hover,.srow .kebab[aria-expanded=true]{box-shadow:var(--hover);color:var(--ink)}
.srow .kebab[aria-expanded=true]{background:var(--row-hover)}
.srow.ro{cursor:default;min-height:48px}.srow.ro:hover{background:transparent}
.srow.ro .tb2{width:36px}
.emptytab{padding:20px 16px 18px;display:flex;flex-direction:column;gap:4px;color:var(--ink2);font-size:15px}
.emptytab b{color:var(--ink);font-size:16px}
.lfoot{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:2px 0;padding:14px 8px 0;font-size:13px;color:var(--muted);text-align:center}
.lfoot .tl{font-weight:600;color:var(--sage-text);text-decoration:underline;text-underline-offset:3px;min-height:44px;display:inline-flex;align-items:center;padding:0 8px;border-radius:6px}
.lfoot .l1,.lfoot .l2{display:inline-flex;align-items:center}
.ph .lfoot .l2{display:flex;width:100%;justify-content:center}.ph .lfoot .l2>.sep{display:none}
/* phone thumb reach: I'm Done again at the foot of the list, and inside "Nothing left to look for" */
.reachw{padding:14px 0 0}
.btn.reach{width:100%;height:52px;font-size:17px}
.emptytab .btn.reach{margin-top:12px}
/* notices that must stay in view sit under the tan bar, outside the scroll */
.strip{flex:none;display:flex;gap:10px;align-items:flex-start;padding:10px 16px;background:var(--amber-light);border-bottom:1px solid var(--brow);font-size:14px;line-height:1.4;color:var(--ink2);position:relative;z-index:4}
.strip>span{max-width:1104px;flex:1}
.wide .strip{padding-left:max(16px,calc((100% - 1136px)/2 + 16px))}
.strip b{color:var(--ink);font-weight:600}
.strip svg.i{margin-top:2px;color:var(--amber-text)}
.strip.end{background:var(--panel-alt)}.strip.end svg.i{color:var(--ink2)}
.hastoast .wrap{padding-bottom:96px}
.banner{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--bcard);border-radius:12px;padding:12px 14px;margin-bottom:12px;box-shadow:var(--shadow-card)}
.banner .tx{display:flex;flex-direction:column;gap:2px;font-size:14px;color:var(--ink2)}
.banner .tx b{font-size:15px;color:var(--ink)}
.banner svg.i{margin-top:1px;color:var(--ink2)}
/* side column (computer and sideways iPad) */
.scard{background:var(--card);border:1px solid var(--bcard);border-radius:12px;box-shadow:var(--shadow-card);padding:16px}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bignum{font-size:32px;font-weight:600;line-height:1.1;color:var(--ink)}
.bignum small{font-size:16px;font-weight:500;color:var(--ink2)}
.scard .meter{margin:12px 0 0}
.aisles{display:flex;flex-direction:column;margin-top:8px}
.aisles button{display:flex;justify-content:space-between;align-items:center;min-height:40px;padding:0 8px;margin:0 -8px;border-radius:8px;font-size:15px;color:var(--ink);text-align:left}
.aisles button:hover{box-shadow:var(--hover)}
.aisles button span{color:var(--muted);font-size:14px}
.kv{display:flex;flex-direction:column;gap:2px;font-size:14px;color:var(--ink2);margin-top:12px}
.kv b{color:var(--ink);font-weight:600}
.kv+.kv{border-top:1px solid var(--brow);padding-top:12px}
.kv .tl,.tl{color:var(--sage-text);font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer}

/* Look B: one plain column, I'm Done in a bottom bar */
.lkB .wrap{max-width:640px}
.lkB .bhead{padding:6px 4px 14px}
.lkB .bhead h1{margin:0;font-size:26px;line-height:1.2;font-weight:700;color:var(--ink)}
.ph.lkB .bhead h1{font-size:24px}
.lkB .bhead .by{font-size:14px;color:var(--ink2);margin-top:4px}
.lkB .bhead .meter{margin:12px 0 0}
.lkB .bhead .cnt{font-size:14px;color:var(--ink2);margin-top:8px}
.donebar{flex:none;background:var(--card);border-top:1px solid var(--bcard);padding:10px 16px 14px;display:flex;justify-content:center}
.donebar .btn{width:100%;max-width:608px;height:52px;font-size:17px}

/* ---------- loading shape (C-066): still grey bars in the words' own places ---------- */
.gb{display:inline-block;background:var(--shape);border-radius:6px;color:transparent!important;vertical-align:middle}
.card .gb{background:var(--shape-in)}
.bar .gb{background:rgba(92,61,10,.14)}
.ghost .srow .tb2 i{border-color:transparent;background:var(--shape-in)}

/* ---------- overlays: scrim, dialog / bottom sheet, menu, toast, help ---------- */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.4);animation:fin .2s var(--ease)}
@keyframes fin{from{opacity:0}}
@keyframes rise{from{transform:translateY(24px);opacity:0}}
.dlg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,calc(100% - 32px));background:var(--card);border-radius:16px;box-shadow:var(--shadow-float);padding:24px;animation:fin .2s var(--ease)}
.ph .dlg{left:0;right:0;bottom:0;top:auto;transform:none;width:auto;border-radius:16px 16px 0 0;padding:8px 18px 20px;animation:rise .24s var(--ease)}
.grab{display:none}
.ph .grab{display:block;width:40px;height:5px;border-radius:3px;background:rgba(0,0,0,.2);margin:0 auto 12px}
.dlg h3{margin:0;font-size:22px;font-weight:700;line-height:1.25;color:var(--ink);text-wrap:balance}
.dlg p{margin:8px 0 0;font-size:15px;color:var(--ink2);line-height:1.45}
.dlg .acts{display:flex;gap:10px;margin-top:20px;flex-direction:row-reverse}
.dlg .acts .btn{flex:1;height:48px}
.ph .dlg .acts{flex-direction:column}
.ph .dlg .acts .btn{flex:none;width:100%}
.dlg .x{position:absolute;right:12px;top:12px;width:44px;height:44px;border-radius:8px;display:grid;place-items:center;color:var(--ink2)}
.ph .dlg .x{top:14px;right:8px}
.dlg .x:hover{box-shadow:var(--hover)}
.f{margin-top:18px}
.f label,.lab{display:block;font-size:12px;font-weight:500;color:var(--ink2);margin-bottom:6px}
.f input{width:100%;height:50px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:0 14px;font:400 16px var(--font);color:var(--ink);outline:none}
.f input:focus{border-color:var(--sage-text);box-shadow:0 0 0 3px var(--sage-light)}
.f input::placeholder{color:var(--ph)}
.small{font-size:13px;color:var(--muted);line-height:1.45;margin:12px 0 0}
.small.c{text-align:center}
.menu{position:absolute;min-width:250px;max-width:300px;background:var(--card);border:1px solid var(--bcard);border-radius:12px;box-shadow:var(--shadow-pop);padding:6px;animation:fin .16s var(--ease)}
.menu .lab2{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 12px 6px}
.menu button{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:10px 12px;border-radius:8px;min-height:48px}
.menu button:hover{background:var(--row-hover)}
.menu .ml{display:flex;flex-direction:column}
.menu .ml span{font-size:16px;color:var(--ink)}
.menu .ml small{font-size:13px;color:var(--muted)}
.menu svg.i{margin-top:2px;color:var(--ink2)}
.toast{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;max-width:calc(100% - 24px);width:max-content;background:#2B2A27;color:#FAF4EB;border-radius:10px;padding:10px 10px 10px 16px;font-size:15px;box-shadow:var(--shadow-pop);animation:rise .24s var(--ease)}
.toast button{height:36px;padding:0 10px;border-radius:8px;color:#CFE0CA;font-weight:600}
.toast button:hover{background:rgba(250,244,235,.1)}
.lkB .toast{bottom:92px}
/* help: side sheet over everything on computer and iPad, bottom sheet on iPhone (C-094) */
.hp{position:absolute;top:50px;right:0;bottom:0;width:380px;background:var(--card);box-shadow:var(--shadow-float);display:flex;flex-direction:column;animation:hpin .24s var(--ease)}
@keyframes hpin{from{transform:translateX(24px);opacity:0}}
.ph .hp{top:auto;left:0;width:auto;border-radius:16px 16px 0 0;animation:rise .24s var(--ease)}
.hp .hd{display:flex;align-items:center;padding:16px 12px 10px 20px;border-bottom:1px solid var(--bcard)}
.ph .hp .hd{padding:6px 8px 8px 18px;flex-wrap:wrap}
.hp .hd h2{flex:1;margin:0;font-size:20px;font-weight:700}
.hp .bd{padding:6px 20px 22px;overflow:auto}
.ph .hp .bd{padding:4px 18px 24px}
.hp ol{list-style:none;margin:0;padding:0}
.hp li{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--brow);font-size:16px;line-height:1.45;color:var(--ink)}
.hp li:last-child{border-bottom:0}
.hp li i{flex:none;width:32px;height:32px;border-radius:8px;background:var(--sage-light);color:var(--sage-text);display:grid;place-items:center}
.hp .x{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;color:var(--ink2)}
.hp .x:hover{box-shadow:var(--hover)}

/* ---------- finished trip (C-071 trip-done card) ---------- */
.tripdone{max-width:560px;margin:8px auto 0;padding:28px 24px;text-align:center}
.ph .tripdone{padding:22px 16px}
.tripdone .tic{width:72px;height:72px;border-radius:16px;background:var(--sage-light);display:grid;place-items:center;margin:0 auto 14px;color:var(--sage-text)}
.tripdone .tic svg.i{width:40px;height:40px;stroke-width:1.75}
.tripdone .tic.wait{background:var(--amber-light);color:var(--amber-text)}
.tripdone p b{color:var(--ink)}
.dlg .amb{margin-top:14px}
.dlg .amb b{color:var(--ink)}
.tripdone h2{margin:0 0 6px;font-size:26px;font-weight:700;line-height:1.2}
.tripdone p{color:var(--ink2);margin:0 auto 6px;max-width:440px;font-size:15px}
.sum{display:flex;flex-direction:column;margin:18px 0 4px;text-align:left;border:1px solid var(--bcard);border-radius:12px;background:var(--panel)}
.sum div{display:flex;justify-content:space-between;align-items:center;min-height:46px;padding:0 16px;border-top:1px solid var(--brow);font-size:15px}
.sum div:first-child{border-top:0}
.sum b{font-weight:600}
.static{margin-top:16px}
.static .saisle{position:static}
.srow.ro.got .nm,.srow.ro.got .nm .q{text-decoration:none;color:var(--ink)}.srow.ro.got .nm .q{color:var(--ink2)}
.srow.ro .tb2{color:var(--sage-text)}
.fincol{max-width:560px;margin:16px auto 0}

/* ---------- entry frame (C-090 / p12 r20, read-only copy; scoped to .ent) ---------- */
.ent{flex:1;min-height:0;overflow:auto}
.ent .cols{display:block;max-width:502px;margin:0 auto;padding:40px 16px}
.ph .ent .cols{padding:12px 16px 32px}
.w2 .ent .cols{display:flex;align-items:flex-start;justify-content:center;gap:64px;padding:40px;max-width:none}
.w2.t-ipad .ent .cols{padding-top:24px}
/* C-090: one column keeps the eyebrow and headline above the card; the phone drops the line under it; steps show at 900+ only */
.ent .story .steps{display:none}.ph .ent .story .sp{display:none}
.ph .ent .story h1{font-size:34px}
.ent .ccol{margin-top:24px}.ph .ent .ccol{margin-top:12px}
.w2 .ent .ccol{margin-top:0}
.w2 .ent .story .steps{display:flex}
.w2 .ent .story{display:block;flex:1;max-width:430px}
.w2 .ent .ccol{flex:1;max-width:470px}
.ent .eb{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ent .story h1{font-size:36px;line-height:1.15;font-weight:700;margin:8px 0 0;letter-spacing:-.005em;text-wrap:balance}
.t-ipad .ent .story h1{font-size:40px}
.ent .story .sp{font-size:15px;line-height:1.45;color:var(--ink2);margin:4px 0 0}
.t-ipad .ent .story .sp{font-size:17px}
.ent .steps{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.ent .steps li{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink2)}
.ent .steps b{flex:none;width:24px;height:24px;border-radius:50%;background:var(--sage-light);color:var(--sage-text);font-size:12px;font-weight:600;display:grid;place-items:center}
.ent .steps li.done b{background:var(--sage-text);color:#fff}
.ent .ecard{background:var(--card);border-radius:12px;border:1px solid var(--bcard);box-shadow:var(--shadow-card);padding:28px;position:relative}
.ph .ent .ecard{padding:18px}
.ent h2.t{font-size:30px;line-height:1.2;font-weight:700;margin:0;letter-spacing:-.005em;overflow-wrap:anywhere;text-wrap:balance}
.t-ipad .ent h2.t{font-size:32px}
.ph .ent h2.t{font-size:26px}
.ent .q{font-size:15px;line-height:1.45;color:var(--ink2);margin:6px 0 0;text-wrap:pretty}
.t-ipad .ent .q{font-size:17px}
.ent .note{display:flex;gap:10px;align-items:flex-start;background:var(--errbg);border:1px solid var(--err);color:var(--errink);border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.4;margin-bottom:18px}
.ent .note svg.i{color:var(--err);margin-top:1px}
.ent .chip{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--bcard);border-radius:8px;padding:12px 14px;font-weight:600;font-size:15px;color:var(--ink)}
.ent .chip svg.i{color:var(--sage-text)}
.ent .ebtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:8px;background:var(--sage-dark);color:#FAF4EB;font-size:16px;font-weight:600;margin-top:20px}
.ent .ebtn:hover{background:var(--sage-hov)}
.ent .ebtn.ol{background:var(--card);color:var(--ink);border:1px solid var(--ink2)}
.ph .ent .ebtn{margin-top:14px}
.ent .foot{margin-top:20px;padding-top:4px;border-top:1px solid var(--bcard);display:flex;flex-direction:column;align-items:center;margin-bottom:-8px}
.ent .foot>div{min-height:44px;display:flex;align-items:center;justify-content:center;gap:5px;font-size:15px;color:var(--ink2);text-align:center;flex-wrap:wrap}
.ent .foot .tl{display:inline-flex;align-items:center;min-height:44px;padding:0 6px}
.ent .lock{width:64px;height:64px;border-radius:16px;background:var(--panel-alt);color:var(--ink2);display:grid;place-items:center;margin-bottom:16px}
.ent .lock svg.i{width:28px;height:28px;stroke-width:1.75}
.ent .who{display:flex;align-items:center;gap:10px;margin-top:16px;padding:12px 14px;border-radius:8px;background:var(--panel);font-size:15px;color:var(--ink2)}
.ent .who svg.pc{color:var(--ink2)}
.ent .who b{color:var(--ink)}
/* shaped loading for the entry card */
.cghost{pointer-events:none}
.cghost .gb{background:var(--shape-in)}
.story.ghost .gb{background:var(--shape)}

/* ---------- emails (p12 r20 mail view, read-only copy) ---------- */
.mail{flex:1;min-height:0;overflow:auto;background:#F4F3F1}
.mhead{background:#fff;border-bottom:1px solid #e2e0dc;padding:16px 28px}
.ph .mhead{padding:12px 16px}
.mhead .s{font-size:20px;font-weight:600;color:#202124;margin-bottom:10px}
.ph .mhead .s{font-size:17px}
.mhead .fr{display:flex;gap:10px;align-items:center;font-size:13px;color:#5f6368}
.mhead .fr i{width:36px;height:36px;border-radius:50%;background:var(--header);color:#FAF4EB;font:italic 600 16px Fraunces,serif;display:grid;place-items:center;flex:none}
.mhead .fr b{color:#202124;font-weight:600}
.mbody{padding:28px 16px 40px}
.ph .mbody{padding:16px 10px 28px}
.em{max-width:560px;margin:0 auto;background:#FAF6EE;border-radius:12px;overflow:hidden;border:1px solid rgba(0,0,0,.08)}
.em .band{height:50px;display:flex;align-items:center;padding:0 28px;background:var(--header)}
.ph .em .band{padding:0 18px}
.em .band span{font-family:Fraunces,Georgia,serif;font-style:italic;font-weight:600;font-size:22px;color:#FAF4EB}
.em .eb2{padding:28px 28px 26px}
.ph .em .eb2{padding:22px 18px 20px}
.em h2{margin:0 0 10px;font-size:24px;line-height:1.25;text-wrap:balance}
.em p{margin:0 0 14px;font-size:16px;line-height:1.5;color:var(--ink2)}
.em .ebtn2{display:inline-block;background:var(--sage-dark);color:#FAF4EB;font-weight:600;font-size:16px;text-decoration:none;border-radius:8px;padding:14px 26px;margin:6px 0 18px}
.ph .em .ebtn2{display:block;text-align:center}
.em .fine{font-size:13px;color:#605E55;line-height:1.5;margin:0 0 8px}
.em .fine a{color:#4B6947;font-weight:600;overflow-wrap:anywhere}
.em .efoot{border-top:1px solid rgba(0,0,0,.08);padding:14px 28px;font-size:12px;color:#605E55;line-height:1.5}
.ph .em .efoot{padding:12px 18px}

/* ---------- stand-ins: a texted link, the phone's share sheet ---------- */
.msgs{flex:1;min-height:0;overflow:auto;background:#fff;font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:#000}
.msgs .mtop{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 8px;background:#F7F7F7;border-bottom:1px solid #e5e5ea}
.msgs .mtop .mav{width:40px;height:40px;border-radius:50%;background:#A0A6B0;color:#fff;display:grid;place-items:center;font-weight:600}
.msgs .mtop span{font-size:12px}
.msgs .thread{max-width:520px;margin:0 auto;padding:14px 12px;display:flex;flex-direction:column;gap:6px}
.msgs .when{text-align:center;font-size:11px;color:#8a8a8e;margin:6px 0}
.msgs .bub{align-self:flex-start;max-width:76%;background:#E9E9EB;border-radius:18px;padding:8px 12px;font-size:16px;line-height:1.3}
.msgs .bub.me{align-self:flex-end;background:#0B84FF;color:#fff}

.oss .hd b{display:block;font-size:14px}.oss .hd span{font-size:13px;color:#6b6b70}
.oss .apps{display:flex;gap:18px;padding:16px 16px 12px;overflow:hidden}
.oss .app{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;width:60px}
.oss .app i{width:58px;height:58px;border-radius:14px;background:#C9CBD1;display:block}
.oss .app:first-child i{background:#5DD35E}
.oss .rows{margin:6px 16px 0;background:#fff;border-radius:10px}
.oss .rows div{display:flex;justify-content:space-between;align-items:center;height:46px;padding:0 14px;font-size:16px;border-top:1px solid #e5e5ea}
.oss .rows div:first-child{border-top:0}

/* ---------- member side: a stand-in Groceries page + the share card (C-071) ---------- */
.gpage{flex:1;min-height:0;overflow:hidden;padding:16px;max-width:1212px;width:100%;margin:0 auto}
.gpage .ln{height:56px;border-bottom:1px solid var(--brow);display:flex;align-items:center;gap:12px;padding:0 12px}
.gpage .ln .gb{height:12px}
.shsheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(480px,calc(100% - 32px));max-height:calc(100% - 40px);background:var(--card);border-radius:16px;box-shadow:var(--shadow-float);display:flex;flex-direction:column;animation:fin .2s var(--ease)}
.ph .shsheet{left:0;right:0;top:auto;bottom:0;transform:none;width:auto;max-height:calc(100% - 44px);border-radius:16px 16px 0 0;animation:rise .24s var(--ease)}
.shsheet .hd{display:flex;align-items:flex-start;gap:8px;padding:22px 16px 4px 24px}
.ph .shsheet .hd{padding:6px 8px 2px 16px;flex-wrap:wrap}
.shsheet .hd h3{flex:1;margin:0;font-size:22px;font-weight:700;line-height:1.25}
.shsheet .hd .x{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;color:var(--ink2);margin-top:-8px}
.shsheet .sh-b{padding:0 24px 16px;overflow:auto}
.ph .shsheet .sh-b{padding:0 16px 12px}
.shsheet .sub{font-size:15px;color:var(--ink2);margin:0 0 6px}
.shsheet .sl{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips.len{grid-template-columns:1fr 1fr 1fr}
.chips.one{grid-template-columns:1fr}
.chips button{min-height:48px;border-radius:8px;background:var(--chip);font-size:16px;font-weight:600;color:var(--ink);border:1px solid transparent;display:flex;align-items:center;justify-content:center;gap:8px}
.chips button .n{font-weight:500;color:var(--ink2)}
.chips button.on{background:var(--chip-on);border-color:var(--sage-text)}
.chips .full{grid-column:1/-1}
.chips button:hover{box-shadow:var(--hover)}
.linkbox{display:flex;align-items:center;gap:8px;min-height:50px;border:1px solid var(--bcard);border-radius:10px;background:#fff;padding:0 14px;font-size:15px;color:var(--ink)}
.linkbox span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linkbox svg.i{color:var(--muted)}
.lbtns{display:flex;gap:8px;margin-top:8px}
.lbtns .btn{flex:1;height:48px}
.amb{display:flex;gap:10px;align-items:flex-start;background:var(--amber-light);border-radius:8px;padding:10px 12px;font-size:14px;color:var(--ink2);line-height:1.45;margin-top:12px}

  <p class="sub">Send it to whoever is at the store. They tap things off on their phone, no account needed.</p>
  <div class="sl">Your link for the Kroger list</div><div class="linkbox">${ic('link','sm')}<span>https://suppercraft.app/shop/k7f2qa9Xm4</span></div>
  <div class="lbtns"><button class="btn pri" data-a="copy">${ic('copy','sm')}${step==='copied'?'Copied':'Copy Link'}</button><button class="btn tan" data-go="share-os">${ic('share','sm')}Share</button></div>
  <div class="amb">${ic('info','sm')}<span>You'll only see this link now. Whoever has it can tick things off this list. They don't see prices or anything else.</span></div>
  <div class="sl">Open links</div><div class="olink"><div class="t"><b>Kroger list</b><span>Works until this trip is done</span></div><button class="btn stop sm">Stop It</button></div></div>
  <div class="ft"><button class="btn ol" data-a="close">Done</button></div></div>`}
function osShare(){return `<div class="oss" role="dialog" aria-label="Share (the phone's own sheet, stand-in)"><div class="hd"><span class="th">SC</span><div><b>Groceries from ${HH}</b><span>suppercraft.app</span></div><span class="standin" style="margin-left:auto">STAND-IN</span></div>
 <div class="apps"><div class="app"><i></i>Messages</div><div class="app"><i></i>Mail</div><div class="app"><i></i>WhatsApp</div><div class="app"><i></i>More</div></div>
 <div class="rows"><div>Copy<span>${ic('copy','sm')}</span></div></div></div>`}
function remPage(s){
 const row=(icn,t,sub,go)=>`<div class="rm"><span class="ri2">${icn}</span><span class="tx"><b>${t}</b><small>${sub}</small></span><button class="kb" aria-label="More for this reminder" aria-haspopup="menu">${ic('dots')}</button><span class="acts"><button class="btn tan sm go">${go}</button></span></div>`;
 return `<header class="top"><span class="wm">SupperCraft</span><span class="sp"></span><span class="av">TS</span></header><div class="bar"><div class="in"><span class="ttl">Reminders</span><span class="meta">2 need you now</span><span class="sp"></span><span class="standin">STAND-IN: C-097 page, rows only</span></div></div>
 <div class="scroll"><div class="wrap"><div class="rlist card"><div class="gh">Now${sep}2</div>
 ${s==='rem-more'?`${row(pc('groc'),'Sam finished the grocery list',`20 in the cart: Kroger 14, Costco 6${sep}1 couldn't find${sep}5 not checked off${sep}6:10 PM`,'Put Away')}
 ${row(pc('groc'),'Sam and Jo finished the Kroger list',`17 in the cart${sep}1 not checked off${sep}6:25 PM`,'Put Away')}`
 :`${row(pc('groc'),'Sam finished the Kroger list',`14 in the cart${sep}1 couldn't find${sep}3 not checked off${sep}5:40 PM`,'Put Away')}
 ${row(ic('users'),'Sam joined the household',`From your invite${sep}Just now`,'See Members')}`}
 </div></div></div>`}
/* ======================= overlays ======================= */
function nameSheet(){const ok=!!S.typed.trim();
 return `<div class="scrim"></div><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="nmT"><div class="grab"></div><h3 id="nmT">Who's Shopping?</h3><p>${SHARER} and ${HH} will see who got what. We only ask once.</p>
  <div class="f"><label for="nm">Your First Name</label><input id="nm" value="${esc(S.typed)}" placeholder="Like Sam" autocomplete="given-name" enterkeyhint="go"></div>
  <div class="acts"><button class="btn ${ok?'pri':'off'}" data-a="namego" ${ok?'':'aria-disabled="true"'}>Start Shopping</button><button class="btn ol" data-a="nameskip">Skip</button></div>
  <p class="small c">No account needed. Only your first name is kept.</p></div>`}
function doneSheet(){const L0=left().length,P=pendN();
 const wait=P?`<div class="amb">${ic('clock','sm')}<span><b>${ticks(P)} haven't sent yet.</b> No signal here. Keep this page open after you tap I'm Done, and they send when you're back online.</span></div>`:'';
 return `<div class="scrim"></div><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dnT"><div class="grab"></div><h3 id="dnT">Done Shopping?</h3><p>${SHARER} and ${HH} will see what you got.${L0?` ${L0} ${L0>1?'things aren\'t':'thing isn\'t'} checked off. ${L0>1?'They stay':'It stays'} on ${SHARER}'s list.`:''}</p>${wait}
  <div class="acts"><button class="btn pri" data-go="${P?'sl-finwait':'sl-finished'}">I'm Done</button><button class="btn ol" data-a="closeov">Keep Shopping</button></div></div>`}
function helpPane(){return `<section class="hp" role="dialog" aria-label="How This List Works"><div class="grab" style="margin:8px auto 0"></div><div class="hd"><h2>How This List Works</h2><button class="x" data-a="help" aria-label="Close">${ic('x')}</button></div><div class="bd"><ol>
 <li><i>${ic('check','sm')}</i><span>Tap a thing when it's in your cart. Tap it again to take it out.</span></li>
 <li><i>${ic('search','sm')}</i><span>Can't find something? Tap ${ic('dots','sm')} on it, then Couldn't Find It. ${SHARER} will see.</span></li>
 <li><i>${ic('done','sm')}</i><span>Tap I'm Done when you check out. ${SHARER} sees what you got.</span></li></ol></div></section>`}
function menuHTML(id){const i=S.I.find(x=>x.id===id);return `<div class="menu" id="menu" role="menu"><div class="lab2">${esc(i.n)}</div><button role="menuitem" data-a="nf" data-id="${id}">${ic('search')}<span class="ml"><span>Couldn't Find It</span><small>${SHARER} will see it. It stays on the list.</small></span></button></div>`}
/* ======================= render ======================= */
function render(){const app=document.getElementById('app');app.className=devClasses();
 const s=S.s;let h='',ov='';
 if(s==='sl-loading')h=loadingPage();
 else if(s==='sl-dead')h=deadPage(false);
 else if(s==='sl-bad')h=deadPage(true);
 else if(s==='sl-fail')h=failPage();
 else if(s==='sl-stopped'||s==='sl-stopunsent')h=deadPage('stop');
 else if(['sl-finished','sl-finwait','sl-finfail','sl-reopen','sl-entirefin'].includes(s))h=finishedPage();
 else if(s.startsWith('sl-'))h=listPage();
 else if(s.startsWith('inv-'))h=invitePage(s);
 else if(s==='mail')h=mailPage();
 else if(s==='preview')h=previewPage();
 else if(s.startsWith('share')){h=groceriesBehind();ov=shareCard(s==='share-pick'?'pick':'show');if(s==='share-os')ov+='<div class="scrim" style="background:rgba(0,0,0,.25)"></div>'+osShare()}
 else if(s==='rem'||s==='rem-more')h=remPage(s);
 if(s==='sl-name'||(s.startsWith('sl-list')&&S.name===null))ov=nameSheet();
 if(s==='sl-doneask'||s==='sl-donepend')ov=doneSheet();
 if(S.help&&s.startsWith('sl-'))ov+=helpPane();
 if(S.toast)ov+=`<div class="toast" role="status"><span>${S.toast.t}</span>${S.toast.u?`<button data-a="undo">Undo</button>`:''}</div>`;
 app.innerHTML=h+`<div id="ovl">${ov}</div>`;
 if(s.startsWith('sl-')&&!['sl-dead','sl-bad','sl-fail','sl-stopped','sl-stopunsent'].includes(s))app.classList.add('lpage');
 if(S.toast)app.classList.add('hastoast');
 const sc=document.getElementById('scroll');
 if(sc){if(S.at){const el=document.getElementById(S.at);if(el)sc.scrollTop=Math.max(0,el.getBoundingClientRect().top-sc.getBoundingClientRect().top+sc.scrollTop-(S.atOff||0))}
  markTop();sc.addEventListener('scroll',markTop,{passive:true})}
 if(S.menu){const k=app.querySelector(`.kebab[data-id="${S.menu}"]`);if(k){const sc=document.getElementById('scroll');const r=k.getBoundingClientRect(),a=app.getBoundingClientRect();
   if(sc&&r.bottom>a.bottom-200){sc.scrollTop+=r.bottom-(a.bottom-260)}
   const r2=k.getBoundingClientRect();const m=document.createElement('div');m.innerHTML=menuHTML(S.menu);const el=m.firstChild;
   el.style.top=(r2.bottom-a.top+4)+'px';el.style.right=Math.max(8,a.right-r2.right)+'px';app.querySelector('#ovl').appendChild(el)}}
 syncDone();if(sc)sc.addEventListener('scroll',syncDone,{passive:true});
 mbar()}
/* r6: one I'm Done in view at a time on the phone. While the lower one (foot of list, or "Nothing left to look for") is on
   screen, the bar's top-right one hides but keeps its room, so the bar never jumps */
function syncDone(){const b=document.querySelector('.bar .btn[data-a="done"]'),r=document.querySelector('.btn.reach'),sc=document.getElementById('scroll');if(!b)return;
 if(!r||!sc){b.classList.remove('gone');return}
 const a=sc.getBoundingClientRect(),c=r.getBoundingClientRect();b.classList.toggle('gone',c.top<a.bottom&&c.bottom>a.top)}
/* C-071 markTop: the Aisles chip shows on the one heading stuck at the top (the first one before any scrolling) */
function markTop(){const sc=document.getElementById('scroll');if(!sc)return;const hs=[...sc.querySelectorAll('.saisle')].filter(h=>h.querySelector('.sj'));if(!hs.length)return;
 const top=sc.getBoundingClientRect().top+2;let cur=hs[0];hs.forEach(h=>{if(h.getBoundingClientRect().top<=top)cur=h});hs.forEach(h=>h.classList.toggle('top',h===cur))}
function mbar(){const g=ST.find(x=>x[1].some(y=>y[0]===S.s));
 document.getElementById('mb').innerHTML=`<span class="tag">MOCKUP ONLY</span><b>Outside pages</b><span class="nt">not agreed</span>
  <select aria-label="Page" id="mbp">${ST.map(x=>`<option ${x===g?'selected':''}>${x[0]}</option>`).join('')}</select>
  <select aria-label="State" id="mbs">${g[1].map(([k,l])=>`<option value="${k}" ${k===S.s?'selected':''}>${l}</option>`).join('')}</select>
  ${S.s.startsWith('sl-')?`<span class="nt">Look:</span><button data-look="a" class="${S.look==='a'?'on':''}">A: like Shopping mode</button><button data-look="b" class="${S.look==='b'?'on':''}">B: one column</button>`:''}`;
 document.getElementById('mbp').onchange=e=>setState(ST.find(x=>x[0]===e.target.value)[1][0][0]);
 document.getElementById('mbs').onchange=e=>setState(e.target.value);
 document.querySelectorAll('#mb [data-look]').forEach(b=>b.onclick=()=>{S.look=b.dataset.look;render()})}
/* ======================= actions ======================= */
document.addEventListener('click',e=>{const t=e.target.closest('[data-a],[data-go]');
 if(!t){if(S.menu&&!e.target.closest('#menu')){S.menu=null;render()}return}
 e.preventDefault();if(t.dataset.go){setState(t.dataset.go);return}
 const a=t.dataset.a,id=+t.dataset.id,it=S.I.find(i=>i.id===id);
 if(a==='tick'&&it){S.at=null;if(it.nf){delete it.nf;by(it,'You');S.toast=null}else if(it.by==='You'){delete it.by;delete it.pend;S.toast={t:`${it.n[0].toUpperCase()+it.n.slice(1)} is back on the list.`}}else{by(it,'You');S.toast=null}S.menu=null;render();return}
 if(a==='rowmenu'){S.menu=S.menu===id?null:id;render();return}
 if(a==='nf'&&it){it.nf=true;S.menu=null;S.toast={t:`${SHARER} will see you couldn't find the ${esc(it.n)}.`,u:1,id};render();return}
 if(a==='putback'&&it){delete it.nf;render();return}
 if(a==='retry'&&it){delete it.fail;render();return}
 if(a==='undo'&&S.toast){const x=S.I.find(i=>i.id===S.toast.id);if(x)delete x.nf;S.toast=null;render();return}
 if(a==='done'){S.s='sl-doneask';render();return}
 if(a==='closeov'){S.s='sl-list';render();return}
 if(a==='help'){S.help=!S.help;render();return}
 if(a==='namego'){if(!S.typed.trim())return;S.name=S.typed.trim();S.s='sl-list';render();return}
 if(a==='nameskip'){S.name=null;S.s='sl-list';S.name='a guest';render();return}
 if(a==='rename'){S.s='sl-name';render();return}
 if(a==='close'){setState('share-pick');return}
 if(a==='copy'){const b=t;b.innerHTML=ic('check','sm')+'Copied';return}
 if(a==='copynote'){t.innerHTML=ic('check','sm')+'Copied';return}
 if(a==='jump'||a==='jumpto'){const el=document.getElementById(t.dataset.to||'a-DairyEggs');if(el)el.scrollIntoView({block:'start'});return}
});
document.addEventListener('input',e=>{if(e.target.id==='nm'){S.typed=e.target.value;const b=document.querySelector('[data-a="namego"]');if(b){const ok=!!S.typed.trim();b.className='btn '+(ok?'pri':'off')}}});
document.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&e.target.matches('.hit[data-a="tick"]')){e.preventDefault();e.target.click()}
 if(e.key==='Escape'){if(S.menu){S.menu=null;render()}else if(S.help){S.help=false;render()}}
 if((e.key==='h'||e.key==='H')&&!e.target.matches('input')&&S.s.startsWith('sl-')){S.help=!S.help;render()}});
addEventListener('resize',()=>render());
setState(S.s);
</script>
</body>
</html>
