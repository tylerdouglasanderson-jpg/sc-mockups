/* Tokens, frame, rail, tan bar, buttons and cards copied from Groceries v3 / Plan v3 (kit parts, light.js tokens). */
:root{
  --page:#EDE5D8; --card:#FAF6EE; --panel:#F6F2E9; --panel-alt:#F1E8DA; --alert:#F8F0E0;
  --header:#6B3E14; --subbar:#E4D3B3; --hdr-text:#FAF4EB; --subbar-date:#5C3D0A; --subbar-2:#7A5030;
  --ink:#1E1E1C; --ink2:#54524A; --muted:#605E55;
  --sage:#8FAF8A; --sage-dark:#1F3A1C; --sage-light:#E4EDE2; --sage-text:#4B6947;
  --amber:#C8943A; --amber-light:#F5ECD8; --amber-text:#7E5C22; --amber-dark:#5C3D0A;
  --urgent-bg:#F5E4E4; --urgent-text:#5C1A1A; --urgent-border:#8E3131;
  --chip:#E4D9C6; --chip-on:#B7D0B0; --chip-warm:#EFE4CC; --chip-warm-edge:#988048;
  --row-hover:#F0EEE3; --track:#DDD5C5; --folder-line:#D2C6B0;
  --c-muted:96 94 85; --c-ink2:84 82 74;
  --m-sam:#5E7C55; --m-alex:#8A5A3C; --m-jordan:#4F6A86; --m-riley:#8A4F6E; --m-guest:#7A7466;
  --bcard:rgba(0,0,0,.09); --brow:rgba(0,0,0,.06); --scrim:rgba(0,0,0,.4);
  --shadow-card:0 1px 2px rgba(45,33,22,.055),0 6px 16px rgba(45,33,22,.055);
  --shadow-pop:0 4px 14px rgba(45,33,22,.16); --shadow-float:0 16px 48px rgba(45,33,22,.2);
  --hover:inset 0 0 0 100px rgba(30,30,28,.04); --press:inset 0 0 0 100px rgba(30,30,28,.16);
  --on-dark-hover:rgba(250,244,235,.08); --on-dark-press:rgba(250,244,235,.16);
  --wood-sheen-top:rgba(255,255,255,.04); --wood-sheen-bottom:rgba(0,0,0,.10);
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --ease:cubic-bezier(.25,.46,.45,.94);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--page)}
body{color:var(--ink);font:400 15px/1.45 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
input{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:16px;height:16px}
svg.ni{display:block;overflow:visible}
:focus-visible{outline:2px solid var(--sage-text);outline-offset:2px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes shim{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01s!important;transition-duration:.01s!important}.btn:active,.chip:active{transform:none!important}}

/* one thin themed scroll bar (DESIGN 4.10) */
.scroll,.sheet .sb{scrollbar-width:thin;scrollbar-color:rgb(var(--c-muted) / .35) transparent}
.scroll::-webkit-scrollbar,.sheet .sb::-webkit-scrollbar{width:12px;height:12px}
.scroll::-webkit-scrollbar-thumb,.sheet .sb::-webkit-scrollbar-thumb{background:rgb(var(--c-muted) / .35);border:3px solid transparent;background-clip:padding-box;border-radius:999px}
.scroll::-webkit-scrollbar-thumb:hover,.sheet .sb::-webkit-scrollbar-thumb:hover{background-color:rgb(var(--c-ink2) / .7)}
.scroll::-webkit-scrollbar-track,.sheet .sb::-webkit-scrollbar-track{background:transparent}

.top::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--wood-sheen-top),var(--wood-sheen-bottom));pointer-events:none}
.top>*{position:relative;z-index:1}
.wordmark{font-style:italic;font-weight:600;font-size:22px}
.top .sp{flex:1}
.av{display:inline-grid;place-items:center;border-radius:50%;font-weight:600;color:var(--hdr-text);flex:none}
.av.hdr{width:28px;height:28px;font-size:12px;background:var(--m-sam);box-shadow:0 0 0 2px var(--hdr-text)}
.av.r{background:var(--m-riley)}
/* nobody signed in: the header avatar slot shows the empty (guest) avatar + plain cream words, no box (round 4) */
.who-btn{height:44px;border-radius:8px;padding:0 10px 0 6px;display:inline-flex;align-items:center;gap:10px;color:var(--hdr-text);font-weight:400;font-size:15px;opacity:.9}
.who-btn:hover{background:var(--on-dark-hover)}.who-btn:active{background:var(--on-dark-press)}
.who-btn .av{width:28px;height:28px;box-shadow:0 0 0 2px var(--hdr-text)}.who-btn .av svg{width:16px;height:16px;stroke:var(--hdr-text)}
.rail{background:var(--card);border-right:1px solid var(--bcard);padding:12px 8px;display:flex;flex-direction:column;gap:4px;min-height:0;overflow:hidden}
.rail .cap{height:44px;border-radius:8px;background:var(--sage);color:var(--ink);display:flex;align-items:center;gap:8px;padding:0 12px;font-weight:500;font-size:16px;margin-bottom:8px;flex:none}
.rail .cap:hover,.rail .ri:hover{box-shadow:var(--hover)}
.rail .ri{display:flex;align-items:center;gap:12px;height:44px;border-radius:8px;padding:0 12px;color:var(--ink2);font-weight:500;font-size:16px;text-align:left;flex:none;white-space:nowrap}
.rail .ri svg.i,.rail svg.ni{width:24px;height:24px;flex:none}
.rail .ri.on{background:var(--sage-light);color:var(--sage-text)}
/* round 7: one filled rail item (the page you are on); a running cook shows as amber words and a dot */
.rail .ri{position:relative}
.rail .ri.cknow{color:var(--amber-text)}
.rail .ri.cknow::after{content:"";position:absolute;right:12px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:var(--amber)}
@media (max-width:1100px){.rail .ri.cknow::after{right:4px;top:8px;margin-top:0}}
.rail.slim .ri.cknow::after{right:4px;top:8px;margin-top:0}
.rail hr{border:0;border-top:1px solid var(--bcard);margin:4px 8px;flex:none}
.rail .grow{flex:1}
.body{display:grid;grid-template-rows:46px 1fr;min-height:0;min-width:0}
.bar{background:var(--subbar);border-bottom:1px solid var(--brow);position:relative;display:flex}
.bar .in{display:flex;align-items:center;gap:12px;width:100%;max-width:1212px;margin:0 auto;padding:0 16px;min-width:0}
/* the page below keeps a 12 px scroll bar gutter on a computer: the bar's edges follow the cards' edges (round 4) */
.dev-desktop .bar .in{max-width:1224px;padding-right:28px}
.bar .ttl{font-style:italic;font-weight:600;font-size:16px;color:var(--subbar-date);white-space:nowrap}
.bar .meta{font-size:13px;color:var(--subbar-2);padding-left:12px;border-left:1px solid var(--chip-warm-edge);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bar .meta .skx{display:inline-block;width:150px;height:12px;vertical-align:middle}
.bar .sp{flex:1}
.bar .btn.icon{width:36px;height:36px;color:var(--subbar-date)}
.bar .btn.icon::after{content:"";position:absolute;inset:-4px}
.scroll{overflow:auto;min-height:0;scrollbar-gutter:stable}

/* ---------- kit Button: 44 tall, four tiers, Title Case, press = .97 + overlay ---------- */
.btn{height:44px;border-radius:8px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:500;font-size:16px;white-space:nowrap;transition:transform 50ms var(--ease),box-shadow .2s var(--ease),background-color .3s var(--ease),color .3s var(--ease);position:relative;flex:none}
.btn:active{transform:scale(.97);box-shadow:var(--press)}
.btn.pri{background:var(--sage-dark);color:var(--hdr-text)}.btn.pri:hover{box-shadow:inset 0 0 0 100px var(--on-dark-hover)}.btn.pri:active{box-shadow:inset 0 0 0 100px var(--on-dark-press)}
.btn.sec{background:var(--sage);color:var(--ink)}.btn.sec:hover{box-shadow:var(--hover)}
.btn.cancel{background:transparent;border:1px solid var(--ink2);color:var(--ink)}.btn.cancel:hover{box-shadow:var(--hover)}
.btn.icon{width:44px;padding:0;color:var(--ink2)}.btn.icon:hover{box-shadow:var(--hover)}
.btn.off{background:var(--chip);color:var(--muted);cursor:default}.btn.off:active{transform:none;box-shadow:none}

/* ---------- cards ---------- */
.card{background:var(--card);border-radius:12px;border:1px solid var(--bcard);box-shadow:var(--shadow-card);min-width:0}
.eyebrow{font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ch{display:flex;align-items:baseline;gap:12px;padding:16px 20px 0}
.ch .sp{flex:1}
.ch .cnt{font-size:13px;color:var(--muted);white-space:nowrap}
/* round 4: the side column stays 340 at 1280 too, so reminder and Kitchen lines stop wrapping and the right column
   gets shorter; top padding 16 like the Groceries v3 page */
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;padding:16px 16px 96px;max-width:1212px;margin:0 auto;align-items:start}
.wrap.one{grid-template-columns:minmax(0,1fr);max-width:752px;gap:16px}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.wrap.one>.col{grid-column:1}

/* Today's Meals: the next meal big on top, the rest of today as rows (Q1) */
.next{padding:8px 20px 20px}
.lab{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--sage-text)}
.lab.am{color:var(--amber-text)}
.mn{font-size:28px;font-weight:600;line-height:1.2;margin:4px 0 8px;letter-spacing:-.01em}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px;font-size:15px;color:var(--ink2)}
.meta>span{display:inline-flex;align-items:center;gap:6px}
.meta .sby{color:var(--amber-text);font-weight:500}
.meta svg.i{width:16px;height:16px}
/* round 7: one Import door per screen (the Groceries card, Q6 A / C-072). The need line is a plain fact that says
   whether it is on the list yet, so it never changes height when you import. */
.need{display:flex;align-items:flex-start;gap:8px;margin-top:8px;font-size:15px;line-height:1.45;color:var(--ink);min-height:24px}
.need .ico{display:inline-flex;color:var(--ink2);border-radius:6px;flex:none;height:1.45em;align-items:center}
.need>span:not(.ico){flex:1 1 auto;min-width:0}
.need .nl{color:var(--ink2)}
.need.ok .ico{color:var(--sage-text)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.prep{margin-top:16px;border-top:1px solid var(--brow);padding-top:8px}
.ph{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;min-height:28px}
.ph .n{text-transform:none;letter-spacing:0;font-weight:400}
.pwait{font-size:13px;color:var(--ink2);margin:-2px 0 4px}
.tk{display:flex;align-items:center;gap:12px;min-height:48px;width:calc(100% + 16px);border-radius:8px;padding:4px 8px;margin:0 -8px;text-align:left;transition:background .2s var(--ease)}
.tk:hover{background:var(--row-hover)}
.tk .box{width:24px;height:24px;border-radius:6px;border:2px solid var(--ink2);display:grid;place-items:center;background:var(--card);flex:none;transition:background .2s var(--ease),border-color .2s var(--ease)}
.tk .box svg{width:16px;height:16px;stroke:var(--hdr-text);stroke-width:3;opacity:0;transform:scale(.6);transition:opacity .2s var(--ease),transform .2s var(--ease)}
.tk.on .box{background:var(--sage-dark);border-color:var(--sage-dark)}
.tk.on .box svg{opacity:1;transform:none}
.tk .tt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.tk .tt b{font-weight:500;font-size:16px;transition:color .2s var(--ease)}
.tk .tt small{font-size:13px;color:var(--amber-text);transition:color .2s var(--ease)}
.tk.on .tt b{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.tk.on .tt small{color:var(--sage-text)}
.tk .tt small .dn{display:none}.tk.on .tt small .dn{display:inline}.tk.on .tt small .du{display:none}
.tk.dis{cursor:default;opacity:.6}.tk.dis:hover{background:none}
.mrow{border-top:1px solid var(--brow);padding:4px 20px 8px}
.mrow .mr{display:flex;align-items:center;gap:12px;min-height:56px;width:calc(100% + 24px);margin:0 -12px;padding:4px 12px;border-radius:8px;text-align:left}
.mrow .mr:hover{background:var(--row-hover)}
.mrow .mr .tx{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.mrow .mr .tx small{font-size:13px;color:var(--muted)}
.mrow .mr .tx b{font-size:16px;font-weight:600}
.mrow .st{font-size:13px;color:var(--ink2);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.mrow .st.am{color:var(--amber-text);font-weight:500}
.mrow .st.ok{color:var(--sage-text);font-weight:500}
.mrow .chev{color:var(--muted)}
.mrow .prep{margin-top:0;border-top:0;padding:0 0 4px 0}
.done-line{display:flex;align-items:center;gap:12px;padding:16px 20px;width:100%;text-align:left;border-radius:12px}
button.done-line:hover{box-shadow:var(--hover)}
.done-line>div{flex:1;min-width:0}.done-line .chev{color:var(--muted)}
.done-line .ok{width:32px;height:32px;border-radius:8px;background:var(--sage-light);color:var(--sage-text);display:grid;place-items:center;flex:none}
.done-line b{font-size:18px;font-weight:600}
.done-line small{display:block;font-size:13px;color:var(--muted)}
.state-msg{padding:8px 20px 20px}
.state-msg h2{font-size:24px;font-weight:600;line-height:1.25;margin:4px 0 6px}
.state-msg p{color:var(--ink2);font-size:15px}
.errbox{margin:12px 20px 20px;border-radius:12px;background:var(--urgent-bg);border:1px solid var(--urgent-border);color:var(--urgent-text);padding:12px 12px 12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.errbox .tx{flex:1;min-width:200px}.errbox b{display:block;font-weight:600}.errbox span{font-size:13px}

/* Tomorrow */
.tmr .body2{padding:6px 20px 16px}
.tmr .nm2{font-size:18px;font-weight:600;line-height:1.3}
.tmr.up .nm2{font-size:24px}
.tmr .prep{margin-top:12px}

/* This Week: kit DaySquare strip */
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;padding:12px 16px 8px}
.dsq{min-height:52px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:500;transition:box-shadow .2s var(--ease)}
.dsq:hover{box-shadow:var(--hover)}
.dsq svg{width:16px;height:16px}
.dsq.cooked{background:var(--sage-light);color:var(--sage-text)}
.dsq.partly{background:var(--amber-light);color:var(--amber-text)}
.dsq.planned{background:var(--card);border:1px solid var(--bcard);color:var(--ink)}

/* round 7: today looks the same on every device (Plan v3's today tint + the sage ring), whatever its state */

/* rows inside Reminders / Kitchen / Groceries: the whole row is the button (no loose text links) */

.rr .ri2.am{color:var(--amber-text)}.rr .ri2.ur{color:var(--urgent-text)}.rr .ri2.ok{color:var(--sage-text)}
.rr .tx{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}

/* round 8: on a short screen (computer 1280x800, iPad sideways) the Kitchen card shows one Use Soon tip, as the Kitchen

/* quiet card: one line (Tyler 10-13 Q33 c) */

button.card.q{width:100%;text-align:left}

/* Getting Started (round 4: no progress bar, "1 of 4 done" in words like the rest of the app) */

/* ---------- shaped loading (C-066): the real cards' shapes, text and buttons as soft grey bars, then a fade ---------- */

.ld .skx *{color:transparent!important}
.ld .skx{width:fit-content;max-width:100%;color:transparent!important;background-color:var(--track)!important;background-image:linear-gradient(90deg,var(--track) 0%,var(--panel) 50%,var(--track) 100%)!important;background-size:200% 100%!important;animation:shim 1.4s infinite linear;border-color:transparent!important;border-radius:6px;box-shadow:none!important;text-decoration:none!important}
/* round 4: icons and tick boxes become soft grey shapes (not holes); wrapped text becomes one bar per line; counts
   get a real width; the day squares show */
.ld span.skx{-webkit-box-decoration-break:clone;box-decoration-break:clone}
.ld .card svg,.ld .dsq svg,.ld .tk .box svg{opacity:0}
.card svg,.tk .box,.rr .ri2{transition:opacity .35s var(--ease),background-color .35s var(--ease),border-color .35s var(--ease)}
.ld .tk .box{background:var(--track)!important;border-color:transparent!important}
.ld .rr .ri2{background:var(--track);border-radius:6px;height:20px}
.ld .dsq{box-shadow:none!important;background:var(--track)!important;opacity:.6;border-color:transparent!important;color:transparent!important}

/* ---------- toasts, menu, sheets ---------- */

.menu{position:fixed;background:var(--card);border:1px solid var(--bcard);border-radius:12px;box-shadow:var(--shadow-pop);z-index:50;min-width:240px;display:none;padding:12px}

.scrim{position:fixed;inset:0;background:var(--scrim);display:none;place-items:center;z-index:55;padding:24px}

@media (max-width:1100px){
  .kx:not(.person) .side .tiprow:not(.tiprow~.tiprow){display:flex!important}
  .kx:not(.person) .side:has(>:nth-child(5)) .card[aria-label^="Kitchen"]{grid-row:span 2}
  .kx:not(.person) .side:has(>:nth-child(5)) .card.q:last-child{grid-column:1}
  .kx:not(.person) .side:not(:has(>:nth-child(5))) .card.q:last-child{grid-column:auto}
}
/* a quiet card stretched by its grid row keeps its two lines together */
.card.q{align-content:center}
/* mockup-only state bar: state names slide under the group buttons with a soft edge, never a cut letter */
.mock .gl{box-shadow:-6px 0 0 var(--ink),8px 0 8px 2px var(--ink)}

/* ================= round 13 (outside panel 4) ================= */
/* The need row: a plain card row (the Lunch row's hairline, a Reminders row's parts), under the buttons and prep ticks.
   The words open the list; the chip is Groceries v3's in-row chip (.hb). No fill, no green band. */
.card>.need{display:flex;align-items:center;gap:8px;margin:0;min-height:0;border-top:1px solid var(--brow);padding:4px 20px 8px;font-size:15px;line-height:1.3;color:var(--ink)}
.need .nb{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:12px;min-height:56px;margin:0 0 0 -12px;padding:4px 12px;border-radius:8px;text-align:left}
.need .nb:hover{background:var(--row-hover)}
.need .ri2{width:20px;display:grid;place-items:center;color:var(--ink2);flex:none}
.need .ri2.ok{color:var(--sage-text)}
.need .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.need .tx b{font-size:16px;font-weight:600;color:var(--ink)}
.need .tx small{font-size:13px;color:var(--ink2)}
.need .chev{flex:none;color:var(--muted)}
.need.ok .nb{margin-right:-12px}
.hb{height:36px;border-radius:8px;padding:0 12px;font-size:15px;font-weight:600;color:var(--ink);background:var(--chip);border:1px solid var(--folder-line);display:inline-flex;align-items:center;gap:8px;white-space:nowrap;position:relative;flex:none;transition:transform 50ms var(--ease),box-shadow .2s var(--ease)}
.hb::after{content:"";position:absolute;inset:-4px}
.hb:hover{box-shadow:var(--hover)}.hb:active{transform:scale(.97)}
.hb.off{color:var(--muted);border-color:transparent;cursor:default}.hb.off:active{transform:none}
.dev-ipad .hb,.dev-phone .hb{height:44px}
.dev-ipad .hb{font-size:17px}
.dev-ipad .need .tx b{font-size:18px}.dev-ipad .need .tx small{font-size:15px}
@media (max-width:640px){
  .card>.need{padding:4px 16px 8px}
  .need .nb{gap:8px;padding:4px 8px 4px 12px}
  .need .ri2{display:none}
  .need .tx b{font-size:15px}
}
/* quiet rows read: time labels and "Cooked" in body grey at 13 / 15, names in full ink */
.mrow .mr .tx small{color:var(--ink2)}
.mrow .st{font-size:15px}
.dev-ipad .mrow .st{font-size:17px}
/* offline: ticks stay readable (no faded row); the box goes flat so it reads as "not now" */
.tk.dis{opacity:1}
.tk.dis .box{border-color:var(--folder-line);background:var(--panel)}
.tk.dis.on .box{background:var(--muted);border-color:var(--muted)}
.tk.dis .tt b{color:var(--ink2)}
/* This Week in the wide left column: the seven squares fill the card */
.col:not(.side) .days{max-width:none}
/* See All N Reminders: a normal row (icon, words, chevron) */
.rr.all{color:var(--ink)}.rr.all .tx b{font-weight:500;padding-left:0}
@media (max-width:640px){.toasts{left:8px;right:8px;align-items:stretch}}
/* mockup-only note (where a tap would go): drawn with the state bar, never a product toast */
.mnote{position:fixed;top:44px;left:50%;transform:translateX(-50%);z-index:70;display:none;align-items:center;gap:8px;max-width:calc(100vw - 16px);background:var(--ink);color:var(--page);border-radius:8px;padding:4px 10px;font-size:12px;line-height:1.35;box-shadow:var(--shadow-pop);pointer-events:none}
.mnote.on{display:flex;animation:fade .2s var(--ease)}

@media (max-width:1100px){.mnote{top:54px}}
/* sheet: three buttons (Close left, the two adds right); the offline line under a recipe */
.sheet .ft.ft3{flex-wrap:wrap}
.sheet .ft.ft3 .btn.cancel{margin-right:auto}
@media (max-width:640px){.sheet .ft.ft3 .btn.cancel{order:3;flex:1 1 100%;margin:0}}
.shp.offp{display:flex;align-items:flex-start;gap:8px;margin:12px 0 0;color:var(--ink)}
.shp.offp svg{color:var(--ink2);margin-top:1px}
/* header, nobody signed in: plain cream words + the round guest avatar in the avatar slot (no box, no "?") */
.who-btn{flex-direction:row;height:44px;padding:0 6px 0 12px;gap:10px;font-size:16px;font-weight:500;opacity:1;border:0;border-radius:8px}
.who-btn .av{width:28px;height:28px;box-shadow:0 0 0 2px var(--hdr-text);background:var(--m-guest)!important}

.who .fine{font-size:19px;color:var(--ink2);max-width:760px;text-align:center}

   sit 32 px apart */
.cook .cmain{align-items:start}
.cook .step p{margin-top:0}
.cook .step p.offnote,.kc .cook .step p.offnote{margin-top:24px;font-size:17px;line-height:1.45;font-weight:400;color:var(--ink2);max-width:620px}
.kc .cook .step p.offnote{font-size:22px}
.cook .cfoot .btn.pri{margin-left:20px}
.kc .cook .as{font-size:22px;color:var(--ink)}
@media (max-width:640px){.cook .cfoot .btn.pri{margin-left:0}}

/* rest screen: the words column is capped and sits in the middle of the right half; the prep line is plain amber
   words with the prep icon and a chevron (no band); night uses page tokens at 5:1 or better */
.rest .wd{max-width:600px;width:100%;justify-self:center}
.rest .wd .ln.pl{width:auto;margin:0;padding:6px 0;min-height:56px;align-items:center;text-align:left;border-radius:8px;background:none;color:var(--amber-text);font-size:28px;font-weight:500;cursor:pointer}

/* ---- Kitchen iPad: one label size, one row size, 20 px between cards ---- */
.kx .eyebrow,.kx .lab,.kx .ph,.kx .side .eyebrow{font-size:18px}

.kx .need .tx b{font-size:27px;line-height:1.2}.kx .need .tx small{font-size:19px}
.kx .need .chev{width:24px;height:24px}
.kx .hb{height:56px;font-size:22px;padding:0 20px;border-radius:10px}
.kx .mrow.tmrow{padding:0 24px 4px}
.kx .mrow.tmrow .mr{min-height:52px}
.kx .mrow.tmrow .mr .tx{flex-direction:row;align-items:baseline;gap:12px;flex-wrap:nowrap}
.kx .mrow.tmrow .mr .tx b,.kx .mrow.tmrow .mr .tx small{font-size:24px}
.kx .mrow.tmrow .mr .tx b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kx .tk{min-height:60px}
.kx .side .rr .tx small.rs{display:none}
@media (min-width:1101px){
  .kx:not(.person) .wrap{padding:16px 20px;gap:20px}

  .kx:not(.person) .next{padding-bottom:10px}
  .kx:not(.person) .prep{margin-top:10px}

  .kx .col:first-child>.card.meals>.mrow,.kx .col:first-child>.card.meals>.need{flex:1 1 auto}
  .kx .col:first-child>.card.meals>.mrow{display:flex;flex-direction:column;justify-content:center}
  .kx .col:first-child>.card.meals .mrow.cooked{margin-top:0}

/* round 13b: someone signed in on the Kitchen iPad (rail showing, Done button bottom right): the Kitchen card keeps
   its own height and shows the Use Soon foods; the need row's second line stays on one line */

  .kx.person .side>.card[aria-label^="Kitchen"],.kx.person .side>.card[aria-label^="Kitchen"] .rr{flex:none}

}

}

/* ================= round 14 ================= */
.card.q .qs{display:none;grid-column:1;font-size:13px;color:var(--ink2)}
.card.q .chev{grid-row:1 / span 3}

   label sits on the same line as its neighbour's (no words floating mid-card) */

  .kx .side .card.q .qt{font-weight:600;color:var(--ink)}
  .kx .side .card.q .qs{display:block;font-size:17px}
  .kx .side .card.q .chev{grid-row:2 / span 2;align-self:center}
  .kx.person .side .rr .tx small.rs{display:none}
  .kx .side .tiprow:not(.tiprow~.tiprow){display:flex!important}
  .kx .side .rr .tx small.rs{display:block}

  .kx .side .lrow{display:none}
}

}

@media (max-width:640px){.done-line .nl2{display:none}}

@media (max-width:1100px){.nobar .app,.nobar .kfull{margin-top:0;height:100vh;height:100dvh}.nobar .rest,.nobar.full .rest,.full.nobar .rest{top:0}}
/* state bar: no name is ever cut. Names that do not fit sit, whole, in a "More" list */

/* a cook's place: the kit's meter (Groceries v3 ".meter") */
.meter{height:8px;border-radius:4px;background:var(--track);overflow:hidden;max-width:420px;margin:12px 0 2px}
.meter i{display:block;height:100%;background:var(--sage-text);border-radius:4px}

.tile.cur{border-color:var(--sage-text);box-shadow:0 0 0 1px var(--sage-text),var(--shadow-card)}
.tile.cur small{color:var(--sage-text);font-weight:600}

.card>.need{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:8px}
.card>.need>.nb{grid-column:1;grid-row:1}

.wrapc .chips .chip{background:var(--chip);border-color:transparent}
.wrapc .chips .chip.on{background:var(--chip-on);border-color:var(--sage-text);font-weight:700}
/* X11: the offline note is the kit notice (Groceries v3 ".banner"): a tinted band, an icon, a close X, main column */
.note{grid-column:auto;background:var(--alert);border:1px solid var(--bcard);border-radius:12px;box-shadow:var(--shadow-card);padding:4px 4px 4px 16px;min-height:52px;gap:12px;color:var(--ink)}

/* rest screen: the meal name breaks evenly; the prep line is plain amber words on one row (clock, words, chevron);

@media (max-width:1100px){

/* ---- Kitchen iPad: gaps on the 4 / 8 / 12 / 16 / 24 scale; second lines one step over the labels ---- */

/* ================= round 18 ================= */
/* a running cook on Today reads as on the rest screen: the step on one line, the timer under it (amber, with its
   clock), then the step track. No empty band under Continue Cooking */

.app:not(.kx) .next.ck .meta>span{display:flex;align-items:center;gap:8px}

/* ================= round 19 (after outside panel 6) ================= */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* the need row: the small line is the door to the week's list (its own small chevron); Undo is a plain text button */
.need .tx small{display:inline-flex;align-items:center;gap:2px}

.next.ck .meta.tm{margin-top:10px;color:var(--amber-text);font-weight:600}

.who-btn{position:relative;flex-direction:row;height:38px;padding:0 14px 0 6px;gap:10px;font-size:17px;font-weight:600;opacity:1;border:1px solid color-mix(in srgb,var(--hdr-text) 60%,transparent);border-radius:8px;color:var(--hdr-text)}

/* rest screen (Visual 3, Ease 7, Friction 6, Fit 4) */

/* ================= round 21 ================= */
.kx .side .rr.one .ri2{align-self:center!important;margin-top:0!important}

/* ================= round 22 (after outside panel 7) ================= */

.who-btn .av{width:28px;height:28px;font-size:12px;box-shadow:0 0 0 2px var(--hdr-text)}
.who-btn:not(.in) .av{background:var(--m-guest)!important}
/* the word "Menu" only where there is no rail, and no outline (the tan bar's menu everywhere else is the bare icon) */

.kx .bar .btn.icon.mbtn::after{display:none}

.kx .tk.on .tt b{text-decoration:line-through;text-decoration-thickness:2px;color:var(--muted)}
/* Groceries card: the week's add sits under the status row */
.gadd{display:flex;align-items:center;gap:12px;min-height:52px;margin:0 20px;padding:6px 0 8px;border-top:1px solid var(--brow);font-size:15px;color:var(--ink)}

<body>
<div id="app"></div>

    case 'loading':case 'dinner':case 'kawake':case 'kwho':case 'ksettings':case 'kperson':case 'kguest':return base;
    case 'lunch':case 'klunch':return {...base,time:'11:45 AM',next:LUNCH,lunchDone:false};
    /* round 19 (Job, BRIEF item 2): lunch is 2 hours past its time and nobody started it, so dinner is next and lunch waits to be marked */
    case 'passed':return {...base,time:'2:15 PM',lunchDone:false,lunchPassed:true};
    case 'cooking':return {...base,time:'5:52 PM',stage:'cooking'};
    /* round 13: the server knows a cook is open but not its step or timer (BRIEF server item 19) */
    case 'cookbasic':return {...base,time:'5:52 PM',stage:'cooking',noStep:true};
    case 'after':case 'kafter':return {...base,time:'7:40 PM',stage:'after',dinnerDone:true,kit:KIT_AFTER};
    case 'nothing':return {...base,time:'11:20 AM',stage:'nothing',week:'nothing',rem:REM2.slice(0,1)};
    case 'noplan':case 'knoplan':return {...base,time:'9:30 AM',plan:'none',stage:'noplan',tomorrow:false,week:'none',groc:'list',rem:REM2.slice(0,1)};
    case 'draft':return {...base,time:'9:30 AM',plan:'draft',stage:'draft',tomorrow:false,week:'draft',groc:'list'};
    case 'member':return {...base,time:'9:30 AM',plan:'draft',stage:'draft',tomorrow:false,week:'draft',groc:'list',role:'member',me:'Riley',rem:[]};
    /* round 19 (Job 2, Fit 8): what a Limited member sees if the server says no to the plan and Kitchen reads (server item 31) */
    case 'memberthin':return {...base,time:'9:30 AM',plan:'draft',stage:'draft',tomorrow:false,week:'draft',groc:'list',role:'member',me:'Riley',rem:[],thin:true};
    case 'start':return {...base,time:'9:30 AM',plan:'none',stage:'noplan',tomorrow:false,week:'none',groc:'empty',rem:[],kit:null,start:true};
    case 'offline':case 'koffline':return {...base,offline:true};
    case 'error':return {...base,stage:'error',tomorrow:false,week:'wait'};
    case 'many':return {...base,rem:REM8};
    case 'stale':return {...base,rem:[STALE,...REM2]};
    case 'choose':return {...base,time:'2:15 PM',stage:'choose'};
    case 'leftovers':return {...base,time:'2:15 PM',stage:'leftovers'};
    /* the day after the week ends: last week still has two meals nobody marked, and the new week has no plan yet */
    case 'wrapup':case 'kwrapup':return {...base,time:'9:30 AM',date:['Tuesday, Dec 1','Tue, Dec 1'],wkName:'Dec 1 – 7',plan:'none',stage:'noplan',wrap:true,tomorrow:false,week:'none',groc:'list',rem:REM2.slice(1)};
  }
  return base;
}
/* sceneId: which moment of the day the awake Kitchen iPad shows. Waking the rest screen keeps the rest screen's moment
   (11:45 wakes to lunch next, 7:40 PM to after dinner), so the two screens never tell two stories (Q2). */
const fresh=(id,sceneId)=>({id,sceneId:sceneId||id,ticks:{p1:true,p2:['cooking','cookbasic','after','kafter'].includes(sceneId||id),t1:false},imported:false,
  person:id==='kperson'?'Sam':null,cook:id==='kguest'?{m:'tikka',kitchen:true,who:'Guest',back:'kawake'}:null,who:id==='ksettings'?'settings':null,toasts:0,wrap:{},closed:false,skip:null,focus:null,cookHold:null,
  /* round 16: cooking = a cook you left that is still running ({m,who}); undo = the Add All you can still take back ({prev,n}) */
  cooking:null,undo:null});
let U=fresh(Q.get('state')&&STATES.some(s=>s[0]===Q.get('state'))?Q.get('state'):'dinner');

/* ---------- small parts ---------- */
const sk=(t,cls='')=>`<span class="skx ${cls}">${t}</span>`;
const avatar=(n,cls='')=>{const p=PEOPLE.find(x=>x[0]===n);return `<span class="av ${cls}" style="background:var(${p?p[1]:'--m-guest'})">${n==='Guest'?ic('user'):n==='?'?'?':(INI[n]||n[0])}</span>`};
const OFFLINE=()=>U.id==='offline'||U.id==='koffline';
const tick=(p,on)=>`<button class="tk ${on?'on':''} ${p.nx?'nx':''} ${OFFLINE()?'dis':''} ${U.focus===p.k?'hl':''}" data-a="tick" data-k="${p.k}" aria-pressed="${on}" ${OFFLINE()?'aria-disabled="true"':''}><span class="box">${ic('check')}</span><span class="tt"><b class="skx">${p.t}</b><small class="skx"><span class="du">${p.due}</span><span class="dn">${p.dn}</span></small></span></button>`;
const prepBlock=(list,title,sc,extra='')=>{const n=list.filter(p=>U.ticks[p.k]).length;
  /* round 7: offline, the reason sits next to the faded ticks, not only in the note at the top */
  /* round 16: offline, the heading itself says why the ticks are faint */
  const right=OFFLINE()?`<span class="n skx">Ticks wait for the internet</span>`:`<span class="n skx" data-cnt="${list.map(p=>p.k).join(',')}">${n} of ${list.length} done</span>`;
  return `<div class="prep ${extra}"><div class="ph"><span class="skx">${title}</span>${right}</div>${list.map(p=>tick(p,U.ticks[p.k])).join('')}</div>`};
const startBy=m=>m.startBy?`<span class="sby skx">${ic('clock')}Start by ${m.startBy} to eat at ${m.time}</span>`:'';

/* Round 13: the need row is a plain card row (the Lunch row's hairline, a Reminders row's parts) UNDER the buttons and
   the prep ticks, so nothing sits between the meal and Start Cooking. It leads with the next meal ("Tonight needs
   2 lemons"), then says how many more this week. The words open the list; the chip (Groceries' in-row chip) adds them
   all, and says how many. The counts are the server's Import answer: plan needs minus what the Kitchen has, with meals
   already cooked (or not cooked tonight) left out. U.imported: false, 'next' (only the next meal's) or 'all'. */
const noTonight=sc=>['after','nothing','choose','leftovers'].includes(sc.stage);
const needsBase=sc=>noTonight(sc)?NEEDS.slice(1):NEEDS;
const needsLeft=sc=>U.imported==='all'?[]:U.imported==='next'?needsBase(sc).slice(1):needsBase(sc);
const cnt=l=>l.reduce((n,d)=>n+d[1].length,0);
function needFact(sc){
  if(['nothing','choose','leftovers'].includes(sc.stage))return null;
  if(sc.stage==='after')return {lead:`Tomorrow needs ${TMR.short}`,ok:TMR.needOk,what:TMR.need,when:'tomorrow',chip:TMR.chip};
  const l=sc.next===LUNCH;
  return {lead:`${l?'Dinner':'Tonight'} needs ${DINNER.need}`,ok:DINNER.needOk,what:DINNER.need,when:l?"tonight's dinner":'tonight',chip:DINNER.chip};
}
/* round 19 (Ease 1, Friction 1-3): the button does what the bold line beside it says. "Tonight needs 2 lemons" has
   "Add 2 Lemons" (never the whole week). The small line is the door to the week's list ("See all 14 for this week"),
   and the week's add lives in that list. After an add the row keeps its height: a check, what is now on the list, and
   a plain text Undo in the same row (it takes no taps for the first 0.7 s, so a double tap never takes the add back).
   No toast: the row and the Groceries card are the proof. */
const seeAll=t=>`${t}${ic('right','i sm')}`;
function needRow(sc){
  if(sc.groc!=='notin'||sc.stage==='cooking')return '';
  const f=needFact(sc);if(!f)return '';
  const all=cnt(needsBase(sc)), n=cnt(needsLeft(sc)), lg=f&&f.chip.length>10&&sc.role!=='member'?' lg':'';
  const undo=U.undo&&U.undo.where!=='groc'?`<button class="hb undo skx" data-a="undoimport" aria-label="Undo: take ${U.undo.n===1?'that':'those '+U.undo.n+' things'} back off your list">Undo</button>`:'';
  if(U.imported==='all')
    return `<div class="need ok${lg}"><button class="nb" data-a="go" data-to="Groceries"><span class="ri2 ok">${ic('checkc')}</span><span class="tx"><b class="skx">All of this week is on your list</b><small class="skx lk">${seeAll('See your list')}</small></span>${undo?'':ic('right','i chev')}</button>${undo}</div>`;
  if(U.imported==='next')
    return `<div class="need ok${lg}"><button class="nb" data-a="needs" aria-haspopup="dialog"><span class="ri2 ok">${ic('checkc')}</span><span class="tx"><b class="skx">${f.ok}</b><small class="skx lk">${seeAll(`See ${n} more ${n===1?'thing':'things'} for this week`)}</small></span>${undo?'':ic('right','i chev')}</button>${undo}</div>`;
  const member=sc.role==='member', off=sc.offline;
  const b=f?f.lead:`${n} things for this week aren't on your list`;
  const sm=off&&!member?'Adding waits for the internet':seeAll(`See all ${n} things for this week`);
  const lab=f?`Add ${f.chip}`:`Add All ${n}`;
  const chip=member?'':`<button class="hb ${off?'off':''} skx" data-a="import" data-w="${f?'next':'all'}" aria-label="${f?`Add ${f.what} to your list`:`Add all ${n} things for this week to your list`}" ${off?'aria-disabled="true"':''}>${lab}</button>`;
  return `<div class="need${lg}"><button class="nb" data-a="needs" aria-haspopup="dialog"><span class="ri2 skx">${ic('cart')}</span><span class="tx"><b class="skx">${b}</b><small class="skx ${off&&!member?'':'lk'}">${sm}</small></span>${chip?'':ic('right','i chev')}</button>${chip}</div>`;
}

/* ---------- Week Wrap-Up (live job kept, round 10): the top card once the week is over. Owner and Full Access only. ---------- */
function wrapCard(sc){

/* ---------- Today's Meals (Q1, Q3, Q5) ---------- */
function mealsCard(sc,big){

  if(sc.stage==='nothing')return `<section class="card meals" aria-label="Today's Meals">${head('')}<div class="state-msg emp"><span class="eic skx">${ic('cal')}</span><h2 class="skx">Nothing planned for today</h2><p class="skx">Your plan skips Wednesday. You have leftover Lentil Soup.</p><div class="acts stack"><button class="btn pri skx" data-a="go" data-to="Plan, at Wednesday, Nov 25">${ic('plus')}Add a Meal</button>${canMake}</div></div>${needRow(sc)}</section>`;
  /* live day stages kept (round 10): a meal still to choose, and a leftovers night */
  if(sc.stage==='choose')return `<section class="card meals" aria-label="Today's Meals">${head(`${cooked} of 2 cooked`)}<div class="state-msg"><div class="lab am skx">Dinner at 6:30 · not chosen yet</div><h2 class="skx">Dinner still needs choosing</h2><p class="skx">Your plan has two ideas for tonight: Chicken Tikka Masala or Veggie Stir-Fry.</p><div class="acts"><button class="btn pri skx" data-a="go" data-to="Plan, at Wednesday dinner (choose one)">Choose Dinner</button></div></div>${needRow(sc)}${lunchRow()}</section>`;

       <div class="meta">${startBy(n)}${big&&n.startBy?'':`<span class="skx">${n.mins} min</span>`}${big&&n.startBy?'':`<span class="skx">Serves ${n.serves}</span>`}</div>
       <div class="acts"><button class="btn pri skx" data-a="cook" data-m="${n.id}">Start Cooking</button><button class="btn sec skx" data-a="recipe" data-m="${n.id}">See Recipe</button></div>
       ${n===DINNER?prepBlock(PREP_D,'Before dinner',sc):''}</div>`;
  let rows='';
  if(n===LUNCH)rows=`<div class="mrow"><button class="mr" data-a="recipe" data-m="tikka"><span class="tx"><small class="skx">Dinner at 6:30 · <span class="am">Start by 5:40</span></small><b class="skx">${DINNER.name}</b></span><span class="st go skx">See Recipe</span>${ic('right','i chev')}</button>${prepBlock(PREP_D,'Before dinner',sc)}</div>`;
  else rows=lunchRow();
  /* Kitchen iPad, before dinner (round 13): Tomorrow is a row at the foot of the meal card, with its tonight tick, so it
     sits under the meals as it does on a computer and the right side is exactly This Week, Reminders, Kitchen, Groceries */
  /* round 16: Tomorrow and Lunch are one row shape on every device: a small label over the name (as on Today) */
  const tmrRow=big&&sc.tomorrow?`<div class="mrow tmrow"><button class="mr" data-a="go" data-to="Prep, at tomorrow's step: Move the sausage to the fridge (its tick is there)"><span class="tx"><small>Tomorrow · Dinner at ${TMR.time}<span class="tb"> · ${U.ticks.t1?'prep done':'1 step before bed'}</span></small><b>${TMR.name}</b></span>${ic('right','i chev')}</button></div>`:'';

function tomorrowCard(sc,big){

/* This Week: Plan v3's DaySquare (round 10). Each square says its short weekday; the icon and tint say
   the day's state (check = cooked, half dot = partly cooked, ring = planned, dash = nothing planned). Round 17: today
   is the bold one, with no ring (nothing is "picked" on Today). The line under the strip names the marks in words. */
function weekCard(sc,big){
  /* round 16: a week with no plan, and a draft week, show the same seven squares as any week (empty days as dashes,
     chosen draft days with the dashed draft edge), so the card is the week and not a one-line note. The week after
     Week Wrap-Up keeps the one-line card (its own date range is in the words). */
  const none=sc.week==='none';
  if(none&&sc.wkName)return quiet('This Week','Nothing planned yet','go',`Plan, ${sc.wkName}`);
  if(sc.week==='wait')return quiet('This Week','Shows once the plan loads','go','Plan, this week');
  const draft=sc.week==='draft';
  const st=([d,s])=>{if(none)return 'empty'+(d==='Wed'?' today':'');if(sc.week==='nothing'&&d==='Wed')return 'empty today';if(draft)return (['Thu','Fri','Sat'].includes(d)?'draft':'empty')+(d==='Wed'?' today':'');

  U.imported=w==='next'&&f&&!prev?'next':'all';
  /* round 19: one Undo, in the row, after either add. It takes back only what this tap added, and it waits 0.7 s
     before it takes a tap. The row cross-fades in place (same height), and a screen reader hears what was added. */
  U.undo={prev,n:U.imported==='next'?1:n,at:Date.now(),where:from||'need'};
  rerender();fadeNeed();
  say(U.imported==='next'?`Added ${f.what} to your list`:`Added ${n} things to your list`)}
function fadeNeed(){if(RM())return;$$('#app .need>*,#app .gadd>*').forEach(k=>k.animate([{opacity:0},{opacity:1}],{duration:200,easing:'ease-out'}))}
function say(t){const l=$('#live');if(l)l.textContent=t}
function pick(n){const r=U.who;
  U.who=null;
  if(r==='settings'){U.person=n;U.id='kperson';if(U.sceneId==='ksettings')U.sceneId='kawake';render();mnote(`Goes to Settings, after ${n} types a code`);return}
  if(r==='cook'){const same=!!U.cookHold&&n===(U.cookHold.who||'Guest');U.cook=U.cookHold||{m:'tikka',kitchen:true,back:'kawake'};U.cookHold=null;U.cook.who=n;if(n!=='Guest')U.person=n;render();if(!same)toast(`Cooking as ${n}`);return}
  if(n==='Guest'){U.person=null;U.id=U.sceneId==='kafter'?'kafter':'kawake';render();toast('Using the iPad as a guest');return}
  U.person=n;U.id='kperson';render();toast(`Hi, ${n}. Tap Done when you finish. After 5 quiet minutes the iPad signs you out.`)}
/* one tap only wakes (Q10), to the same moment of the day the rest screen showed (Q2). A tap on the prep line wakes
   with that prep tick marked out (round 10). */
const WAKE={/* round 22 */rsam:['kperson','kawake'],rlunch:['kawake','lunch'],rbefore:['kawake','kawake'],rcook:['kawake','cooking'],rafter:['kafter','kafter'],rnight:['kafter','kafter']};
function wake(el,focus){if(el.classList.contains('out'))return;el.classList.add('out');const w=WAKE[U.id]||['kawake','kawake'];
  setTimeout(()=>{U=fresh(w[0],w[1]);U.focus=focus||null;render()},RM()?10:200)}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAll();if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('rest')){e.preventDefault();wake(e.target)}});
$('#scrim').addEventListener('click',e=>{if(e.target.id==='scrim')closeAll()});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{const s=$('#scroll'),y=s?s.scrollTop:0;render();const s2=$('#scroll');if(s2)s2.scrollTop=y},120)});
addEventListener('scroll',()=>{if(scrollY||scrollX)scrollTo(0,0)});
render();
</script>
</body>
