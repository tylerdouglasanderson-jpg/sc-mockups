*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);background:#efece7;color:#222;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
textarea{font:inherit;color:inherit}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:16px;height:16px}
:focus-visible{outline:2px solid var(--sage-text);outline-offset:2px}

/* ---------- mockup-only state bar (never in ?full) ---------- */
#ctl{position:sticky;top:0;z-index:100;background:#f8f6f2;border-bottom:1px solid #ddd;padding:8px 14px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
#ctl h1{font-size:15px;margin:0 6px 0 0;font-weight:700}
#ctl .lbl{color:#777;margin-right:2px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid #cfc6b5;border-radius:8px;overflow:hidden;background:#fff}
.seg button{padding:6px 10px;font-size:12.5px;border-right:1px solid #e4ddd0}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--sage-dark);color:#fff;font-weight:600}
.tg{border:1px solid #cfc6b5;background:#fff;border-radius:8px;padding:6px 10px;font-size:12.5px}
.tg.on{background:#FFF1A8;border-color:#d9c25a}
#wrap{display:flex;gap:16px;padding:14px;align-items:flex-start}
#stage{flex:1;min-width:0}
#scaler{transform-origin:0 0}
#notes{flex:0 0 280px;display:flex;flex-direction:column;gap:10px;position:sticky;top:120px}
.note{background:#FFF6B8;border:1px solid #E6D774;border-radius:4px;padding:10px 12px;font-size:13px;line-height:1.45;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.note b{display:block;margin-bottom:2px}
@media (max-width:1100px){#wrap{flex-direction:column}#notes{position:static;flex:none;width:100%}}
html.full,html.full body{height:100%;overflow:hidden;background:var(--page)}
html.full #ctl,html.full #notes{display:none!important}
html.full #wrap{padding:0;display:block}
html.full #dev{border:0;border-radius:0;box-shadow:none}

/* ---------- the device ---------- */
/* r6: overflow clip, so a focus or a hidden keyboard can never scroll the frame itself */

#dev.t-ipad{--body:17px;--item:18px;--meta:14px;--label:13px}
#dev.t-phone{--pad:16px}

.top::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(0,0,0,.10));pointer-events:none}
.top>*{position:relative;z-index:1}
/* r12: the wordmark is IBM Plex Sans italic 600, as Groceries v3 and the app (panel 4 fit 1); no serif */
.wm{font-style:italic;font-weight:600;font-size:22px;letter-spacing:.005em;line-height:1.25}
.top .sp{flex:1}
.cloud{width:36px;height:36px;display:grid;place-items:center;border-radius:8px;color:var(--hdr-text);opacity:0;transition:opacity .24s var(--ease)}
.cloud.on{opacity:1}
.mockbtn{height:28px;padding:0 10px;border-radius:8px;border:1px dashed rgba(250,244,235,.55);font-size:12px;color:var(--hdr-text);opacity:.8}
html.shots .mockbtn,html:not(.full) .mockbtn{display:none}
.av{display:inline-grid;place-items:center;border-radius:50%;font-weight:600;color:var(--hdr-text);flex:none}
.av.hdr{width:28px;height:28px;font-size:12px;background:#5E7C55;box-shadow:0 0 0 2px var(--hdr-text)}
.av.hdr.m{background:#8A5A8C}
.av.xs{width:24px;height:24px;font-size:12px;background:#5E7C55}
.av.xs.m{background:#8A5A8C}.av.xs.s{background:#B0683A}
.dbody{flex:1;display:flex;min-height:0;position:relative}

/* rail: kit frame/Rail + CaptureButton (DESIGN 3.3.1, C-074, C-076) */
.rail{flex:none;width:220px;background:var(--card);border-right:1px solid var(--bcard);padding:12px 8px;display:flex;flex-direction:column;gap:4px;z-index:3}
.rail.slim{width:64px;padding:12px 0;align-items:center}
/* Capture stays the dark green kit primary pair (DESIGN.md 2.1 "sage-dark ... the Capture button on the rail, the
   slim rail and the phone tab"; 3.2.2; app CaptureButton.tsx RAIL_FILL bg-action). Groceries v3 drew it mid sage. */
.cap{height:44px;margin:0 0 8px;border-radius:8px;background:var(--sage-dark);color:var(--hdr-text);display:flex;align-items:center;gap:8px;padding:0 12px;font-weight:500;font-size:var(--item);position:relative;transition:transform 50ms var(--ease),box-shadow .2s}
.cap:hover{box-shadow:inset 0 0 0 100px var(--on-dark-hover)}
.cap:active{transform:scale(.97);box-shadow:inset 0 0 0 100px var(--on-dark-press)}
/* r9: "on" while the pop-up is open (a lit copy above the scrim) and on the Capture page: a ring in the same green */
/* r12: "on" stays inside the button: a mid-sage inner edge, not an outer ring that reads as a focus halo (panel 4 visual 1, fit 3) */
.cap.on,.capc.on{box-shadow:inset 0 0 0 2px var(--sage),inset 0 0 0 100px var(--on-dark-hover)}
.rail.slim .cap{width:44px;padding:0;justify-content:center}
.rail.slim .cap span{display:none}
.cap svg{width:24px;height:24px}
/* r9: a count when something waits on you (panel 3 friction 5) */
/* r12: a soft-square count (radius 6, no pill), solid amber with ink words: inside the wide Capture button on its right,
   a small corner tag on the slim rail and the phone + (panel 4 visual 1, fit 3) */
.badge{position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;padding:0 6px;border-radius:6px;background:var(--amber);color:var(--ink);box-shadow:0 0 0 2px var(--card);font-size:12px;font-weight:700;line-height:22px;text-align:center}
.rail:not(.slim) .cap .badge,#dev .capghost.cap:not(.slimg) .badge{position:static;margin-left:auto;box-shadow:none}
#dev .capghost.slimg{justify-content:center;padding:0}#dev .capghost.slimg span{display:none}
#dev .capghost{position:absolute;z-index:42;display:none;margin:0!important}
#dev .capghost.show{display:flex}
#dev .capghost.capc{display:none}#dev .capghost.capc.show{display:grid}
.ri{display:flex;align-items:center;gap:12px;height:44px;border-radius:8px;padding:0 12px;color:var(--ink2);font-weight:500;font-size:var(--item);text-align:left;white-space:nowrap}
.ri svg{width:24px;height:24px;flex:none}
.ri:hover{box-shadow:var(--hover)}
.ri.on{background:var(--sage-light);color:var(--sage-text)}
.rail.slim .ri{width:44px;justify-content:center;padding:0}
.rail.slim .ri span{display:none}
.rail hr{border:0;border-top:1px solid var(--bcard);margin:4px 8px}
.rail.slim hr{width:44px;margin:4px 0}
.rail .grow{flex:1}
.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
/* r6: the tan bar's words sit on Groceries v3's inner grid (.bar .in: 1212, padding 0 16), so its edges match the cards */
.tan{height:46px;flex:none;background:var(--subbar);border-bottom:1px solid var(--brow);display:flex;position:relative;z-index:2}
.tan .in{display:flex;align-items:center;gap:12px;width:100%;max-width:1212px;margin:0 auto;padding:0 16px;min-width:0}
.one .tan .in{max-width:820px}
.t-phone .tan .in{padding:0 12px;gap:8px}
.tan .ttl{font-weight:600;font-size:16px;color:var(--subbar-date);white-space:nowrap}
.t-ipad .tan .ttl{font-size:16px}
.tan .line{width:1px;height:18px;background:var(--chip-warm-edge);opacity:.5;flex:none}
.tan .det{font-size:13px;color:var(--subbar-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.t-ipad .tan .det{font-size:14px}
.tan .sp{flex:1}
/* r9: loading says so in calm words in the bar (Groceries v3 keeps text there), not a faint static shape */
.tan .ld{font-size:13px;color:var(--subbar-2)}
/* r6: Sort Now is the kit primary Button at the tan bar's 36 (Groceries v3 .bar .btn), 44 hit area */
.tan .btn{height:36px;padding:0 14px;font-size:15px}.tan .btn::after{content:"";position:absolute;inset:-4px 0}
/* r6: one themed thin scrollbar everywhere (STANDARDS; Groceries v3 lines 58-63); r9: tokens, plus the box, menus, side column */
.scroll,.pbody,#mockmenu,.menu,.box,.cpw>.col+.col{scrollbar-width:thin;scrollbar-color:var(--sb) transparent}
:is(.scroll,.pbody,#mockmenu,.menu,.box,.cpw>.col+.col)::-webkit-scrollbar{width:12px;height:12px}
:is(.scroll,.pbody,#mockmenu,.menu,.box,.cpw>.col+.col)::-webkit-scrollbar-thumb{background:var(--sb);border:3px solid transparent;background-clip:padding-box;border-radius:999px}
:is(.scroll,.pbody,#mockmenu,.menu,.box,.cpw>.col+.col)::-webkit-scrollbar-thumb:hover{background-color:var(--sb-hover)}
:is(.scroll,.pbody,#mockmenu,.menu,.box,.cpw>.col+.col)::-webkit-scrollbar-thumb:active{background-color:var(--sb-press)}
:is(.scroll,.pbody,#mockmenu,.menu,.box,.cpw>.col+.col)::-webkit-scrollbar-track{background:transparent}
.scroll{flex:1;overflow:auto;min-height:0;position:relative}
.pagefade{animation:fade .24s var(--ease) both}
/* phone tab bar (C-055): r12 Today, Plan, +, Groceries, Kitchen, as Groceries v3 and the kit TabBar (panel 4 fit 6) */
.tabs{height:56px;flex:none;background:var(--card);border-top:1px solid var(--bcard);display:flex;align-items:center;justify-content:space-around;position:relative;z-index:3}
.tb{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:64px;height:48px;justify-content:center;border-radius:8px;font-size:12px;font-weight:500;color:var(--ink2)}
.tb svg{width:24px;height:24px}
.tb.on{color:var(--sage-text);font-weight:500;background:var(--sage-light)}
.tb.on svg{filter:none}
/* r6: the + sits in a 78 slot at the bar's top and rises the kit's full 18 (Groceries v3 .capslot; DESIGN 3.3.1) */
.capslot{width:78px;display:flex;justify-content:center;align-self:flex-start}
.capc{width:60px;height:60px;border-radius:50%;background:var(--sage-dark);color:var(--hdr-text);display:grid;place-items:center;margin-top:-18px;box-shadow:var(--shadow-card);position:relative;transition:transform 50ms var(--ease)}
.capc:hover{box-shadow:var(--shadow-card),inset 0 0 0 100px var(--on-dark-hover)}
.capc:active{transform:scale(.97);box-shadow:inset 0 0 0 100px var(--on-dark-press)}
.capc .badge{top:-2px;right:-2px}

/* kit Button (44 tall, radius 8, Title Case; DESIGN 4.2) */
.btn{height:44px;border-radius:8px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:500;font-size:var(--item);white-space:nowrap;transition:transform 50ms var(--ease),box-shadow .2s var(--ease),opacity .2s;position:relative;flex:none;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.btn:active{transform:scale(.97);box-shadow:var(--press)}
/* r9: Groceries v3's two tiers (DESIGN 2.2.2): ONE dark primary per screen, every other action mid sage, back-outs
   outlined, quiet extras tan. Hover and press on dark go lighter (cream), not black. */
.btn.pri{background:var(--sage-dark);color:var(--hdr-text)}.btn.pri:hover{box-shadow:inset 0 0 0 100px var(--on-dark-hover)}.btn.pri:active{box-shadow:inset 0 0 0 100px var(--on-dark-press)}
.btn.sec{background:var(--sage);color:var(--ink)}.btn.sec:hover{box-shadow:var(--hover)}.btn.sec:active{box-shadow:var(--press)}
.btn.cancel{border:1px solid var(--ink2);color:var(--ink)}.btn.cancel:hover{box-shadow:var(--hover)}
.btn.tan{background:var(--chip-warm);border:1px solid var(--chip-warm-edge);color:var(--ink)}.btn.tan:hover{box-shadow:var(--hover)}
.btn.grow{flex:1;min-width:0}
.t-phone .btn.pri{height:48px}
/* r12: one height per row on iPhone: every button and choice in a question, notice or talk row is 48 (panel 4 fit 5) */
.t-phone .qb .btn,.t-phone .qb .chip,.t-phone .kbtns .btn,.t-phone .pwq .chip{height:48px;min-height:48px}
.t-phone .tan .btn{height:36px}
/* r12: an icon-only button (the mic in Fix Words and Say It Again) is a 44 square, 48 on iPhone */
.btn.ico{width:44px;padding:0}.t-phone .btn.ico{width:48px}
.btn.off,.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.btn>*,.chip>*,.ub>*{pointer-events:none}
.t-ipad .btn svg.i.sm{width:20px;height:20px}
/* r9: per-line Undo is a small quiet icon-button (guide root 1): Lucide undo-2 + "Undo", no fill, a folder-line edge
   so it still looks like a button (DESIGN 4.2.1); 36 drawn, 44 to touch */
.ub{height:36px;padding:0 10px 0 8px;border-radius:8px;border:1px solid var(--folder-line);background:none;color:var(--ink2);font-size:var(--meta);font-weight:500;white-space:nowrap;flex:none;position:relative;display:inline-flex;align-items:center;gap:4px;transition:transform 50ms var(--ease),box-shadow .2s var(--ease)}
.ub::after{content:"";position:absolute;inset:-4px}
.ub svg.i{width:16px;height:16px}
.ub.ico{width:36px;padding:0;justify-content:center}.ub.ico svg.i{width:18px;height:18px}
.ub:hover{box-shadow:var(--hover);color:var(--ink);border-color:var(--ink2)}.ub:active{transform:scale(.97);box-shadow:var(--press)}
/* Groceries v3 Stepper (.step): one joined control, Lucide minus / plus, a number box */
.step{display:inline-flex;align-items:stretch;outline:1px solid var(--folder-line);outline-offset:-1px;border-radius:8px;overflow:hidden;background:var(--card);height:44px;flex:none}
.step button{width:44px;height:44px;display:grid;place-items:center;color:var(--muted)}
.step button:hover{box-shadow:var(--hover);color:var(--ink)}.step button:active{box-shadow:var(--press);color:var(--ink)}
.step input{width:56px;text-align:center;font:inherit;font-weight:500;font-size:16px;border:0;border-left:1px solid var(--brow);border-right:1px solid var(--brow);background:var(--card);outline:none;color:var(--ink)}
.step:focus-within{outline:2px solid var(--sage-text);outline-offset:2px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:rot .8s linear infinite;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}
/* kit Chip: soft square, 44 tall, tan; picked = chip-on + 1px sage-text (Chip.tsx) */
.chip{min-height:44px;padding:0 16px;border-radius:8px;background:var(--chip);border:1px solid transparent;font-weight:600;font-size:var(--body);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;transition:transform 50ms var(--ease),box-shadow .2s}
.chip:hover{box-shadow:var(--hover)}.chip:active{transform:scale(.97);box-shadow:var(--press)}
.chip.on{background:var(--chip-on);border-color:var(--sage-text);font-weight:700}
.chip.cmp{padding:0 12px;font-size:13px}
.chip[aria-disabled="true"]{opacity:.45;pointer-events:none}
/* r6: the kit's 44 muted kebab (Groceries v3 .kebab), not a 32 brown one */
.dots{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;color:var(--muted);flex:none;position:relative}
.dots:hover,.dots[aria-expanded=true]{box-shadow:var(--hover);color:var(--ink)}
.dots:active{box-shadow:var(--press)}
/* r6: Groceries v3's one dropdown trigger (.sel: kit Chip at rest, 15/600, trailing chevron) */
.sel{height:44px;border-radius:8px;background:var(--chip);padding:0 10px 0 14px;display:inline-flex;align-items:center;gap:4px;font-size:var(--body);font-weight:600;color:var(--ink);border:1px solid transparent;white-space:nowrap;transition:transform 50ms var(--ease);flex:none}
.sel:hover{box-shadow:var(--hover)}.sel:active{transform:scale(.97);box-shadow:var(--press)}
.sel[aria-expanded=true]{background:var(--chip-on);border-color:var(--sage-text)}
/* r9: the amount sits in the question's words ("Add [1] oat milk ...?"); a tap on it opens the Stepper (guide root 1) */
/* r12: Groceries v3's inline amount (.samt): an outlined number, no chevron, centred on the line (panel 4 fit 4, visual 8) */
.amtb{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;padding:0 8px;margin:0 2px;border-radius:8px;background:var(--card);box-shadow:inset 0 0 0 1px var(--folder-line);font-weight:600;color:var(--ink);position:relative;vertical-align:middle;line-height:1}
.amtb.on{background:var(--sage-light);box-shadow:inset 0 0 0 1px var(--sage-text)}
.amtb::after{content:"";position:absolute;inset:-8px -6px}
.amtb:hover{box-shadow:inset 0 0 0 1px var(--ink2)}
.amtb svg.i{width:16px;height:16px;color:var(--muted)}
.amtrow{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:var(--meta);color:var(--ink2)}
/* r9: a link that stands alone gets a chevron, no underline on hover (DESIGN 4.2.11, 3.4.4) */
.link{color:var(--sage-text);font-weight:600;font-size:var(--meta);display:inline-flex;align-items:center;gap:2px;min-height:44px;padding:0 8px;border-radius:8px;margin-right:-8px}
.link:hover{box-shadow:var(--hover)}
.eyebrow{font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.t-ipad .eyebrow{font-size:14px}
.quiet{color:var(--muted);font-size:var(--meta)}


/* ====================== round 15: layers, pop-up and page, written new on the ladder ====================== */
:root{--amber-edge:rgba(126,92,34,.28);--kb:#D0D3D9;--kb-key:#FFFFFF;--kb-key2:#ABB0BC}
/* panel 5 fit 6: the brown bar's own padding; fit 5: the count is a soft square (radius 8), no cream halo on the lit copy */
.top{padding:0 28px 0 12px}.t-phone .top{padding:0 16px}
.badge{border-radius:8px}
#dev .capghost .badge{box-shadow:none}
.rail.slim .cap .badge,#dev .capghost.slimg .badge{top:-5px;right:-5px;min-width:20px;height:20px;line-height:20px;padding:0 5px;box-shadow:0 0 0 2px var(--card)}
.capc{box-shadow:var(--shadow-pop)}
.nbody,.kscroll{scrollbar-width:thin;scrollbar-color:var(--sb) transparent}
:is(.nbody,.kscroll)::-webkit-scrollbar{width:12px;height:12px}
:is(.nbody,.kscroll)::-webkit-scrollbar-thumb{background:var(--sb);border:3px solid transparent;background-clip:padding-box;border-radius:999px}
:is(.nbody,.kscroll)::-webkit-scrollbar-thumb:hover{background-color:var(--sb-hover)}
:is(.nbody,.kscroll)::-webkit-scrollbar-track{background:transparent}
.btn.sm{height:36px;padding:0 12px;font-size:var(--body)}.btn.sm::after{content:"";position:absolute;inset:-4px 0}
.t-phone .btn.sm{height:44px}.t-phone .btn.sm::after{display:none}
.said{font-style:normal}
/* ladder 6: the quiet line. Sage-text 600, no box, 44 to touch. */
.ql{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 10px;border-radius:8px;color:var(--sage-text);font-weight:600;font-size:var(--body);white-space:nowrap;transition:box-shadow .2s var(--ease),transform 50ms var(--ease);flex:none;position:relative}
.ql:hover{box-shadow:var(--hover)}.ql:active{transform:scale(.97);box-shadow:var(--press)}
.ql.sm{min-height:36px}.ql.sm::after{content:"";position:absolute;inset:-4px 0}
.ql>*{pointer-events:none}
/* ladder 7: icon only. 36 drawn, 44 to touch, no edge. */
.ib{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--ink2);position:relative;flex:none;transition:box-shadow .2s var(--ease),transform 50ms var(--ease)}
.ib::after{content:"";position:absolute;inset:-4px}
.ib:hover,.ib[aria-expanded=true]{box-shadow:var(--hover);color:var(--ink)}.ib:active{transform:scale(.97);box-shadow:var(--press)}
.ib svg.i{width:18px;height:18px;pointer-events:none}
.card{background:var(--card);border:1px solid var(--bcard);border-radius:12px;box-shadow:var(--shadow-card)}

/* ---------- layers ---------- */
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s var(--ease);z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.pop{position:absolute;z-index:45;display:none}
.pop.show{display:block;animation:popin .22s var(--ease) both}
.pop.hide{display:block;animation:popout .16s var(--ease) both;pointer-events:none}
@keyframes popin{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes popout{from{opacity:1;transform:none}to{opacity:0;transform:scale(.97)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.enter{animation:rise .24s var(--ease) both}
.leave{opacity:0!important;transform:translateY(-4px);transition:opacity .16s var(--ease),transform .16s var(--ease)}
.pin{background:var(--card);border:1px solid var(--bcard);border-radius:12px;box-shadow:var(--shadow-pop);display:flex;flex-direction:column;overflow:hidden;position:relative}
.caret{position:absolute;width:12px;height:12px;background:var(--card);transform:rotate(45deg);border-left:1px solid var(--bcard);border-bottom:1px solid var(--bcard);z-index:1}
.caret.down{border-left:0;border-right:1px solid var(--bcard)}
.ph{display:flex;align-items:flex-start;gap:8px;padding:10px 8px 6px 16px;flex:none}
.pt{flex:1;min-width:0;font-weight:600;font-size:var(--item);color:var(--ink);padding-top:7px;line-height:1.35}
.pt.q{font-weight:500;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.lis{display:inline-flex;align-items:center;gap:8px}.lis i{width:10px;height:10px;border-radius:50%;background:var(--sage-text);animation:pulse 1s var(--ease) infinite alternate}
@keyframes pulse{from{opacity:.35}to{opacity:1}}
.pbody{flex:1;min-height:0;overflow:auto;padding:0 12px 10px}
.pfoot{flex:none;border-top:1px solid var(--brow);background:var(--card);padding:8px 12px 10px}
.pfoot:empty{display:none}
.prow{display:flex;gap:8px;align-items:center}
.pfl{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px -6px -6px 4px;min-height:36px}
.pfl .quiet{min-width:0}
.dock{display:flex;align-items:center;gap:4px;margin:0 -6px -4px}
.dock .sp{flex:1}
/* the box */
.pentry{display:block}
.pop[data-ph=reply] .pentry,.pop[data-ph=kept] .pentry{display:none}
.box,.rbx{display:block;width:100%;min-height:84px;border:1px solid var(--folder-line);border-radius:8px;background:var(--panel);padding:10px 12px;font-size:16px;line-height:1.4;color:var(--ink);outline:none;resize:none;text-align:left}
.t-ipad .box,.t-ipad .rbx{font-size:var(--body)}
.box::placeholder{color:var(--muted)}
.box:focus{border-color:var(--sage-text);box-shadow:0 0 0 1px var(--sage-text)}
.pop:not([data-ph=idle]):not([data-ph=typed]) .box{display:none}
.rbx{position:relative;white-space:pre-wrap;overflow-wrap:anywhere}
.rbx .w{opacity:.3;transition:opacity .2s var(--ease)}.rbx .w.on{opacity:1}
.rbx .ph0{color:var(--muted)}
button.rbx:hover{box-shadow:var(--hover)}
.rbx.sending{padding-bottom:46px}
.rbx.sending .words{opacity:.38}
.steps{position:absolute;left:10px;right:10px;bottom:8px}
.segs{display:flex;gap:4px}.segs i{flex:1;height:4px;border-radius:2px;background:var(--track);transition:background .24s var(--ease)}.segs i.on{background:var(--sage-text)}
.stl{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:var(--meta);color:var(--ink2);font-weight:500}
.stl span:first-child{display:inline-flex;align-items:center;gap:6px}
.fixnote{font-size:var(--meta);color:var(--ink2);margin:0 2px 8px}.fixnote:empty{display:none}
.ex{margin-top:8px;display:flex;flex-direction:column}
.exl{font-size:var(--label);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:4px 4px 0}
.exb{min-height:44px;display:flex;align-items:center;padding:0 8px;margin:0 -4px;border-radius:8px;color:var(--ink2);font-size:var(--body);text-align:left;transition:box-shadow .2s var(--ease)}
.exb:hover{box-shadow:var(--hover);color:var(--ink)}
.bars{display:flex;align-items:center;justify-content:center;gap:3px;height:44px;margin-top:8px}
.bars i{width:3px;height:8px;border-radius:2px;background:var(--sage-text);animation:bar 1s ease-in-out infinite alternate}
@keyframes bar{from{height:6px}to{height:34px}}
.hintl{font-size:var(--meta);color:var(--ink2);text-align:center;margin-top:4px}
.vbar{height:4px;border-radius:2px;background:var(--track);margin-top:10px;overflow:hidden}.vbar i{display:block;height:100%;width:var(--f,0%);background:var(--sage-text);border-radius:2px;transition:width .2s linear}
.btn.held{box-shadow:0 0 0 3px var(--sage)}
/* a waiting question, one row (panel 5 ease 4) */
.wrow{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 4px 0 12px;margin-bottom:10px;border-radius:8px;background:var(--amber-light);color:var(--ink);font-size:var(--meta)}
.wrow>svg{color:var(--amber-text);width:16px;height:16px}
.wrow span{flex:1;min-width:0}.wrow b{font-weight:600}

/* the question card: the only amber card, the only dark button (ladder 8) */
.qc{background:var(--amber-light);border:1px solid var(--amber-edge);border-radius:10px;padding:12px;margin:0 0 10px}
.qk{font-size:var(--label);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--amber-text);margin-bottom:4px}
.qt{font-weight:600;font-size:var(--item);color:var(--ink);line-height:1.45;margin-bottom:10px;text-wrap:balance}
.qfrom{font-size:var(--meta);color:var(--ink2);margin:-4px 0 10px}
.qb{display:flex;gap:8px;flex-wrap:wrap}
.qb .chip{flex:1 1 auto;background:var(--card);border-color:var(--folder-line)}
.qb .chip:hover{border-color:var(--ink2)}
.qc .ql{margin:4px 0 -8px -10px}
.qerr,.lfail{color:var(--urgent-text);font-size:var(--meta);font-weight:500;margin-top:8px;display:flex;gap:6px;align-items:flex-start}
.qerr svg,.lfail svg{width:16px;height:16px;margin-top:2px}
.lfail{margin:0 0 6px 28px}
.pick{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.pick .u{font-size:var(--body);color:var(--ink2);margin-right:auto}
.ln+.pick,.lbtn+.pick{margin:4px 0 8px 28px}
/* result lines: one spacing everywhere (pop-up, To review, Recent changes) */
.lh{display:flex;align-items:center;justify-content:space-between;min-height:36px;padding:0 0 0 4px}
.lh .eyebrow{font-size:var(--label)}
.ln{display:flex;align-items:flex-start;gap:8px;min-height:36px;padding:0 0 0 4px}
.ln>svg.i{width:16px;height:16px;margin-top:10px;color:var(--sage-text)}
.ln.no>svg.i,.ln.info>svg.i,.ln.undone>svg.i,.ln.fixed>svg.i{color:var(--muted)}
.ln.cant>svg.i,.ln.miss>svg.i{color:var(--amber-text)}
.lt{flex:1;min-width:0;padding:7px 0;line-height:1.45;color:var(--ink);overflow-wrap:anywhere}
.ln.undone .lt,.ln.fixed .lt,.ln.quiet .lt{color:var(--ink2)}
.ln.undone s{color:var(--muted)}
.ln.ans .lt{font-weight:600;font-size:var(--item)}
.lbtn{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 8px 28px}
.rhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;margin:0 0 8px;border-radius:8px;background:var(--panel-alt);font-weight:500}
.rhead span{flex:1;min-width:160px}
/* the pinned foot of a reply */
.cd{display:flex;align-items:center;gap:8px;position:relative;padding:0 0 8px 4px;margin:-4px -6px 6px 0;font-size:var(--meta);color:var(--ink2)}
.cd span{flex:1}.cd b{font-weight:600;color:var(--ink)}
.cdbar{position:absolute;left:0;right:6px;bottom:0;height:3px;border-radius:2px;background:var(--track);overflow:hidden}
.cdbar i{display:block;height:100%;width:var(--f,100%);background:var(--sage-text);border-radius:2px;transition:width .25s linear}
.cl{font-size:var(--meta);color:var(--ink2);padding:0 4px 6px}
/* kept words (a send that did not go through) */
.kc{display:flex;gap:10px;border:1px solid var(--bcard);background:var(--panel-alt);border-radius:10px;padding:12px;margin-bottom:4px}
.kc>svg{color:var(--ink2);margin-top:2px}
.kc.err{background:var(--urgent-bg);border-color:var(--urgent-border)}.kc.err>svg,.kc.err .kt{color:var(--urgent-text)}
.kc.ok>svg{color:var(--sage-text)}
.kcb{flex:1;min-width:0}
.kt{font-weight:600;color:var(--ink);font-size:var(--item)}
.ks{color:var(--ink2);font-size:var(--meta);margin-top:2px}
.kbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.kbtns:empty{display:none}
.t-phone .kbtns{flex-direction:column;align-items:stretch}
/* toast, menus */
.toasts{position:absolute;left:0;right:0;bottom:24px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:60;pointer-events:none}
.t-phone .toasts{bottom:84px}.toasts.top{bottom:auto;top:104px}
.toast{background:var(--ink);color:var(--hdr-text);border-radius:12px;min-height:48px;padding:6px 8px 6px 16px;display:flex;align-items:center;gap:8px;max-width:min(520px,calc(100% - 24px));box-shadow:var(--shadow-pop);pointer-events:auto;animation:rise .22s var(--ease) both;font-size:var(--body)}
.toast span{flex:1;padding:6px 8px 6px 0}
.toast.out{opacity:0;transform:translateY(6px);transition:opacity .16s var(--ease),transform .16s var(--ease)}
.toast button{min-height:36px;padding:0 10px;border-radius:8px;color:var(--chip-on);font-weight:600;position:relative}
.toast button::after{content:"";position:absolute;inset:-6px 0}
.toast button:hover{box-shadow:inset 0 0 0 100px var(--on-dark-hover)}
.menu{position:absolute;z-index:70;display:none;background:var(--card);border:1px solid var(--bcard);border-radius:12px;box-shadow:var(--shadow-pop);padding:6px;min-width:208px;max-width:calc(100% - 16px)}
.menu.on{display:block;animation:fade .16s var(--ease) both}
.menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:0 12px;border-radius:8px;text-align:left;font-size:var(--body);font-weight:500;color:var(--ink);white-space:nowrap}
.menu button:hover{box-shadow:var(--hover)}
.menu button.on{font-weight:600}.menu button.warn{color:var(--urgent-text)}
.menu button svg.i{width:18px;height:18px;color:var(--ink2)}.menu button.warn svg.i{color:var(--urgent-text)}
.menu .ck{margin-left:auto;display:inline-flex}
.menu hr{border:0;border-top:1px solid var(--brow);margin:4px 6px}
.mcar{position:absolute;top:-6px;left:var(--cx,24px);width:12px;height:12px;background:var(--card);border-left:1px solid var(--bcard);border-top:1px solid var(--bcard);transform:rotate(45deg)}
.menu.up .mcar{top:auto;bottom:-6px;border:0;border-right:1px solid var(--bcard);border-bottom:1px solid var(--bcard)}
#mockmenu{max-height:calc(100% - 70px);overflow:auto;right:8px;top:54px;min-width:230px}
#mockmenu .mcar{display:none}
.mh{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 12px 2px}
#mockmenu button{min-height:36px}
/* the mock iPhone keyboard (mockup only; the real one comes from iOS) */
.kb{position:absolute;left:0;right:0;bottom:0;height:291px;background:var(--kb);z-index:50;display:none;flex-direction:column;gap:10px;padding:8px 3px 40px}
.kb.on{display:flex;animation:kbup .24s var(--ease) both}
@keyframes kbup{from{transform:translateY(100%)}to{transform:none}}
.kr{display:flex;justify-content:center;gap:6px;flex:1}
.kr i{flex:0 0 33px;border-radius:5px;background:var(--kb-key);display:grid;place-items:center;font-style:normal;font-size:20px;box-shadow:0 1px 0 rgba(0,0,0,.3)}
.kr i.w{flex:0 0 46px;background:var(--kb-key2);font-size:14px}.kr i.sp{flex:1;font-size:14px}

/* ---------- stand-in pages: quiet, neutral, 820 wide at most ---------- */
.standin{max-width:820px;margin:0 auto;padding:24px 16px 96px;display:grid;gap:16px}
.t-phone .standin{padding:16px 12px 96px;gap:12px}
.tc{padding:16px 20px}.tc h3{margin:4px 0 2px;font-size:20px;font-weight:600}.tc p{margin:2px 0 0;color:var(--ink2)}
.trow{display:grid;grid-template-columns:1fr 1fr;gap:16px}.t-phone .trow{grid-template-columns:1fr;gap:12px}
.strip{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:8px 12px 8px 16px;border-radius:12px;background:var(--amber-light);border:1px solid var(--bcard);box-shadow:var(--shadow-card);color:var(--ink);font-weight:600;text-align:left;transition:box-shadow .2s var(--ease)}
.strip:hover{box-shadow:var(--shadow-card),var(--hover)}
.strip>svg:first-child{color:var(--amber-text)}.strip>svg:last-child{color:var(--ink2)}
.strip .sq{flex:1;min-width:0;font-weight:400;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kit{padding:12px 0 6px}.kit .eyebrow{padding:0 20px 6px}
.krow{display:grid;grid-template-columns:minmax(0,1fr) 132px;align-items:center;gap:12px;min-height:44px;padding:4px 20px;border-top:1px solid var(--brow)}
.krow b{font-weight:500}.krow small{display:block;font-size:var(--meta);color:var(--muted)}
.krow span{color:var(--ink2)}.krow.zero span{color:var(--amber-text);font-weight:600}
.t-phone .krow{grid-template-columns:minmax(0,1fr) 104px}

/* ---------- the Capture page ---------- */
.cpw{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px 24px;max-width:1212px;margin:0 auto;padding:20px 16px 96px;align-items:start}
.narrow .cpw{grid-template-columns:minmax(0,1fr) 300px}
.cpw.onecol,.one .cpw{grid-template-columns:minmax(0,820px);justify-content:center}
.t-phone .cpw{padding:14px 12px 96px;gap:12px}
.cpw>.wide{grid-column:1/-1}
.purpose{margin:0;color:var(--ink2);font-size:var(--body)}
.col{display:grid;gap:16px;min-width:0}.t-phone .col{gap:12px}
.col.side{position:sticky;top:20px}
.banner{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 16px;border-radius:12px;border:1px solid var(--bcard);box-shadow:var(--shadow-card);background:var(--panel-alt);color:var(--ink)}
.banner>svg{color:var(--ink2)}.banner span{flex:1}
.sh{display:flex;align-items:center;gap:8px;min-height:56px;padding:6px 12px 6px 20px;border-bottom:1px solid var(--brow)}
.sh h2{margin:0;font-size:var(--item);font-weight:600;color:var(--ink);flex:1;white-space:nowrap}
.sh.amb{background:var(--amber-light);border-radius:11px 11px 0 0}.sh.amb>svg{color:var(--amber-text)}
.t-phone .sh{padding-left:16px}

function I(k){return ITEMS[k]||{n:k,pl:/[^s]s$/.test(k),free:1};}
function Cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function num(q){return String(Math.round(q*100)/100);}
function unit(k,q){var u=I(k).u;return u?(q===1?u[0]:u[1]):'';}
function amt(k,q){var u=unit(k,q);return u?num(q)+' '+u:num(q);}
function amtOf(k,q){var it=I(k),u=unit(k,q);return u?num(q)+' '+u+' of '+it.n:num(q)+' '+(q===1&&it.one?it.one:it.n);}
function be(k){return I(k).pl?'are':'is';}
function nm(k){return I(k).n;}
function left(k,q){return amt(k,q)+' left.';}
function zeroT(k,was){return T.style==='kitchen'?Cap(nm(k))+' in your kitchen '+be(k)+' now 0.':Cap(nm(k))+' set to 0 (was '+amt(k,was)+').';}
function setT(k,from,to){return to===0?zeroT(k,from):Cap(nm(k))+' set to '+amt(k,to)+' (was '+num(from)+').';}
function listT(M){return M.trip.on?'the trip':'your grocery list';}
function listQ(M){return M.trip.on?'the trip':'the grocery list';}
function onList(M,k){for(var i=0;i<M.list.length;i++)if(M.list[i].k===k)return M.list[i];return null;}
function join(a){return a.length<2?a.join(''):a.slice(0,-1).join(', ')+' and '+a[a.length-1];}
function said(s){return '“'+s+'”';}
function tidy(s){var p=String(s).split(/\s*(?:,\s*)?\b(?:so like|um+|uh+|you know)\b,?\s*/i).filter(function(x){return x.trim();});
 return p.map(function(x){x=x.trim().replace(/[.!]+$/,'').replace(/\b(monday|tuesday|wednesday|thursday|friday|saturday|sunday)(s?)\b/g,function(m){return Cap(m);});return Cap(x);}).join('. ')+'.';}

/* ---- lines ---- */
function L(R,o){o.id=R.id+'-'+(++R.n);if(R.at!=null){R.lines.splice(R.at,0,o);R.at++;}else R.lines.push(o);return o;}
function done(M,R,k,to,t){var from=M.stock[k];M.stock[k]=to;return L(R,{st:'done',k:k,t:t,undo:{y:'stock',k:k,from:from,to:to}});}
function nochg(R,k,why,btn){return L(R,{st:'no',k:k,t:Cap(nm(k))+' not changed'+(why?': '+why:'')+'.',btn:btn||null});}
function info(R,t,o){o=o||{};o.st=o.st||'info';o.t=t;return L(R,o);}
function ask(R,o){o.st='q';o.kind=o.kind||'ask';return L(R,o);}
function open(R){return R.lines.filter(function(l){return l.st==='q'&&!l.later;});}
function openAll(R){return R.lines.filter(function(l){return l.st==='q';});}

/* ---- reading the words ---- */
function amtIn(c){
 var a={q:null,u:null,vague:false,pinch:false},m;
 if(/\b(a pinch|a splash|a dash|a sprinkle)\b/.test(c)){a.pinch=c.match(/\b(a pinch|a splash|a dash|a sprinkle)\b/)[1];return a;}
 if(/\b(some|a bit|a little|a few|a couple|several|a lot)\b/.test(c)){a.vague=true;return a;}
 if(/\bhalf a dozen\b/.test(c)){a.q=6;return a;}
 if(/\ba dozen\b/.test(c)){a.q=12;return a;}
 m=c.match(new RegExp('\\b(\\d+(?:\\.\\d+)?|'+Object.keys(NUMW).join('|')+')\\b(?:\\s+('+UNITRE+')\\b)?'));
 if(m){a.q=NUMW[m[1]]!=null?NUMW[m[1]]:parseFloat(m[1]);a.u=m[2]||null;if(a.u==='dozen'){a.q*=12;a.u=null;}return a;}
 m=c.match(new RegExp('\\ban?\\s+('+UNITRE+'|egg|lemon|banana)\\b'));
 if(m){a.q=1;a.u=/egg|lemon|banana/.test(m[1])?null:m[1];}
 return a;}
function itemsOf(c){
 var out=[],k,f,m;
 for(k in ITEMS){m=c.match(ITEMS[k].re);if(m)out.push({k:k,i:m.index});}
 for(f in FAMRE){m=c.match(FAMRE[f]);if(m&&!out.some(function(o){return I(o.k).fam===f;}))out.push({fam:f,i:m.index});}
 out.sort(function(a,b){return a.i-b.i;});return out;}
function freeItem(c){
 var s=' '+c.replace(/'(re|s|ve|m|ll|d)\b/g,' ')+' ';
 s=s.replace(new RegExp('\\b(\\d+(?:\\.\\d+)?|'+Object.keys(NUMW).join('|')+')\\b(\\s+('+UNITRE+')\\b(\\s+of)?)?','g'),' ');
 s=s.replace(/\b(add|put|need|needs|buy|get|got|bought|grab|grabbed|pick|picked|up|order|take|remove|cross|off|from|we|i|you|some|more|to|on|onto|the|my|our|your|grocery|groceries|shopping|list|trip|please|also|another|a|an|of|don't|dont|do|not|restocked|have|has|out|ran|run|running|almost|nearly|low|no|more|left|all|gone|there|is|are|any)\b/g,' ');
 s=s.replace(/[^a-z' -]/g,' ').replace(/\s+/g,' ').trim();
 return s&&s.split(' ').length<=4?s:null;}
function verbOf(c,isQ){
 if(isQ||/^(do|does|did|is|are|have|has|any|what|what's|whats|how much|how many|when|where|which)\b/.test(c))return 'ask';
 if(/\b(take|remove|cross|scratch)\b.*\boff\b/.test(c)||/\b(don't|dont|do not|no longer) need\b/.test(c))return 'takeoff';
 if(/\bleftovers?\b/.test(c))return 'cant-leftovers';
 if(/\bremind\b/.test(c))return 'cant-remind';
 if(/\b(move|swap|switch|change|reschedule|plan)\b.*\b(dinner|lunch|breakfast|plan|monday|tuesday|wednesday|thursday|friday|saturday|sunday|tonight)\b/.test(c))return 'cant-plan';
 if(/\b(cooked|made|we had|we ate)\b.*\b(for dinner|for lunch|for breakfast|tonight|last night|tacos|pasta)\b/.test(c))return 'cant-cooked';
 if(/\b(low on|running low|almost out|running out|nearly out|getting low)\b/.test(c))return 'low';
 if(/\b(out of|ran out|run out|used up|use up|finished|finish|last of|all the|the rest of|the whole|no more|all gone|is gone|are gone)\b/.test(c))return 'out';
 if(/^(we have no|we've got no|we got no|there (is|are) no|there's no|no)\s+\w/.test(c)||/\bno\s+[a-z ]+\s+left\b/.test(c))return 'out';
 if(/\b(threw out|threw away|tossed|went bad|gone bad|spoiled|binned)\b/.test(c))return 'threw';
 if(/\b(\d+|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve)\b.*\bleft\b/.test(c)||/\bdown to\b/.test(c))return 'setleft';
 if(/\b(we have|there are|there is|there's|we've got|we now have|now have)\b/.test(c))return 'setask';
 if(/\b(low on|running low|almost out)\b/.test(c))return 'low';
 if(/\b(bought|got|picked up|grabbed|restocked|came home with)\b/.test(c))return 'bought';
 if(/\b(used|use|ate|eaten|drank|cooked with)\b/.test(c))return 'used';
 if(/\b(add|put|need|needs|buy|get|pick up|grab|order)\b/.test(c))return 'add';
 return null;}
var STOCK={out:1,used:1,bought:1,threw:1,setleft:1,setask:1};
function guard(c){
 if(/\b(i think|maybe|probably|i guess|might|not sure)\b/.test(c))return 'doubt';
 if(/\b(didn't|didnt|did not|never|haven't|havent|not)\b/.test(c))return 'neg';
 if(/\b(going to|gonna|will|i'll|we'll|need to|should|tomorrow|later|planning to)\b/.test(c))return 'later';
 return null;}

/* ---- actions (catalog) ---- */
function op(M,R,kind,k,a,c){
 var has=(k in M.stock),q=M.stock[k],it=I(k);
 if(kind==='out'){
  if(!has){nochg(R,k,'not in your kitchen');R.zero.push(k);return;}
  if(q===0){nochg(R,k,'already 0');R.zero.push(k);return;}
  done(M,R,k,0,zeroT(k,q));R.zero.push(k);return;}
 if(kind==='used'){
  if(!has)return nochg(R,k,'not in your kitchen');
  if(q===0)return nochg(R,k,'already 0');
  if(a.pinch)return nochg(R,k,a.pinch+' has no amount',[['Set Amount','setamt','tan']]);
  if(a.q!=null&&badUnit(it,a))return unitAsk(R,k,'used',q);
  if(a.q!=null&&!a.u&&it.u)return noUnitAsk(R,k,'used',a.q,q);
  if(a.q==null)
   return ask(R,{qt:'howmuch',k:k,snap:q,t:(it.u?'How much ':'How many ')+it.n+' '+be(k)+' left?',opts:[['None Left','none',null,'pri'],['Pick Amount','pick',null,'tan']],pick:{k:k,max:q,act:'amount',word:'left'}});
  if(a.q>q)return ask(R,{qt:'over',k:k,snap:q,t:'You said '+num(a.q)+', but you have '+amtOf(k,q)+'. Use all '+num(q)+'?',opts:[['Use All '+num(q),'all',null,'pri'],['Pick Amount','pick',null,'tan']],pick:{k:k,max:q,act:'usedamt',word:'used'}});
  done(M,R,k,q-a.q,'Used '+amtOf(k,a.q)+'. '+left(k,q-a.q));if(q-a.q===0)R.zero.push(k);return;}
 if(kind==='bought'){
  if(M.trip.on){
   var li=onList(M,k);
   if(!li)return nochg(R,k,'not on the trip',[['Add to the Trip','totrip','tan']]);
   if(li.got)return nochg(R,k,'already checked off');
   if(a.q!=null&&has)return ask(R,{qt:'tripor',k:k,q:a.q,t:'Check off '+it.n+' on the trip, or add '+(it.pl?'them':'it')+' to the kitchen?',opts:[['Check Off','check',null,'pri'],['Add '+Cap(it.n),'addk',null,'cancel']]});
   li.got=true;return L(R,{st:'done',k:k,t:'Checked off '+it.n+' on the trip.',undo:{y:'got',k:k}});}
  if(a.q!=null&&badUnit(it,a))return unitAsk(R,k,'bought',q);
  if(a.q!=null&&!a.u&&it.u)return noUnitAsk(R,k,'bought',a.q,q);
  if(a.q==null)return ask(R,{qt:'howmany',k:k,t:(it.u?'How much ':'How many ')+it.n+' did you get?',opts:[['Pick Amount','pick',null,'pri'],['Skip','skip',null,'cancel']],pick:{k:k,max:99,act:'gotamt',word:'bought'}});
  return bought(M,R,k,a.q);}
 if(kind==='threw'){
  if(!has)return nochg(R,k,'not in your kitchen');
  if(q===0)return nochg(R,k,'already 0');
  return ask(R,{qt:'threw',k:k,snap:q,t:'Is all the '+it.n+' gone?',opts:[['Yes, All Gone','all',null,'pri'],['Some Left','some',null,'cancel']]});}
 if(kind==='setleft'){
  if(a.q==null)return miss(R,c);
  if(!has)return nochg(R,k,'not in your kitchen');
  if(q===a.q)return nochg(R,k,'already '+num(q));
  done(M,R,k,a.q,setT(k,q,a.q));if(a.q===0)R.zero.push(k);return;}
 if(kind==='setask'){
  if(a.q==null)return miss(R,c);
  if(!has)return nochg(R,k,'not in your kitchen');
  if(q===a.q)return nochg(R,k,'already '+num(q));
  return ask(R,{qt:'confirm',k:k,snap:q,op:{kind:'setleft',a:a},t:'Change '+it.n+' from '+num(q)+' to '+num(a.q)+'?',opts:[['Set to '+num(a.q),'yes',null,'pri'],['No','no',null,'cancel']]});}
}
function badUnit(it,a){if(!a.u)return false;if(!it.u)return !/^(an?|one)$/.test(a.u);var u=a.u.replace(/e?s$/,'');return it.u.indexOf(a.u)<0&&it.u.map(function(x){return x.replace(/e?s$/,'');}).indexOf(u)<0;}
/* R6: a unit that does not fit this thing. LOGIC: "How many eggs?" [Pick Amount] */
function unitAsk(R,k,kind,q){var it=I(k);return ask(R,{qt:'unit',k:k,snap:q,t:it.u?'How many '+it.u[1]+' of '+it.n+'?':'How many '+it.n+'?',opts:[['Pick Amount','pick',null,'pri']],pick:{k:k,max:kind==='used'?q:99,act:kind==='used'?'usedamt':'gotamt',word:kind}});}
/* R7: a number with no unit on a thing that has one. LOGIC: "Flour: grams or cups?"; this household keeps one unit per thing */
function noUnitAsk(R,k,kind,n,q){var it=I(k);return ask(R,{qt:'unit',k:k,snap:q,n:n,t:Cap(it.n)+': '+num(n)+' '+unit(k,n)+'?',opts:[[num(n)+' '+Cap(unit(k,n)),kind==='used'?'usedamt':'gotamt',String(n),'pri'],['Pick Amount','pick',null,'tan']],pick:{k:k,max:kind==='used'?q:99,act:kind==='used'?'usedamt':'gotamt',word:kind}});}
function bought(M,R,k,n){
 var q=M.stock[k]||0;done(M,R,k,q+n,'Added '+amtOf(k,n)+'. Now '+amt(k,q+n)+'.');
 var li=onList(M,k);
 if(li&&!li.got)ask(R,{kind:'offer',qt:'takeoff',k:k,t:'Take '+nm(k)+' off your grocery list?',opts:[['Take Off List','yes',null,'pri'],['No','no',null,'cancel']],no:Cap(nm(k))+' stays on your grocery list.'});}
function addList(M,R,k,q,shown){
 var li=onList(M,k);
 if(li&&!li.got){var ab=[['Add Another','another','tan']]; /* one sentence for "already there", asked for or offered (BRIEF); LOGIC side B words in 'logic' style */
  return T.style==='kitchen'?L(R,{st:'no',k:k,t:Cap(nm(k))+' '+be(k)+' already on '+(M.trip.on?'the trip':'your list')+'.',btn:ab}):nochg(R,k,'already on '+listT(M),ab);}
 M.list.push({k:k,q:q||1,cap:R.id});R.added[k]=1;
 return L(R,{st:'done',k:k,t:'Added '+(shown&&q?amtOf(k,q):nm(k))+' to '+listT(M)+'.',undo:{y:'list',k:k}});}
function note(M,R,text,o){
 var v=String(text).trim().replace(/[.!]+$/,''),t=tidy(v),id='n'+(++M.seq);
 M.notes.unshift({id:id,t:t,v:v,by:R.by,day:R.day,time:R.time,rid:R.id,useV:false});
 return L(R,{st:'done',note:id,t:'Saved as a note: '+said(t),btn:(t.replace(/[.]/g,'').toLowerCase()!==v.toLowerCase())?[['Use My Words','mywords','tan']]:null,undo:{y:'note',id:id}});}
function miss(R,c){return L(R,{st:'miss',t:'Didn’t catch that.',words:c,btn:[['Say It Again','again','tan'],['Save as a Note','note','tan']]});}
function cant(R,what,c){return L(R,{st:'cant',t:'Capture can’t '+what+'.',words:c,btn:[['Save as a Note','note','tan']]});}
function which(M,R,kind,fam,a,c){
 var live=FAM[fam].filter(function(k){return M.stock[k]>0;});
 if(!live.length)return L(R,{st:'no',t:Cap(fam)+' not changed: already 0.'});
 if(live.length===1)return op(M,R,kind,live[0],a,c);
 var o=live.map(function(k){return [Cap(nm(k)).replace(/ (\w)/g,function(m,x){return ' '+x.toUpperCase();}),'pick',k,'chip'];});
 if(kind==='out')o.push(['All of Them','pick','all','chip']);
 var t=kind==='out'?'Which '+fam+' is out?':kind==='used'?(a.q==null?'You used some '+fam+'. Which one?':'Which '+fam+' did you use?'):kind==='bought'?'Which '+fam+' did you get?':kind==='threw'?'Which '+fam+' did you throw out?':'Which '+fam+'?';
 var snaps={};FAM[fam].forEach(function(k){snaps[k]=M.stock[k];});
  return ask(R,{qt:'which',fam:fam,snaps:snaps,op:{kind:kind,a:a,c:c},t:t,opts:o});}
function answer(M,R,c,its){
 if(/\b(for dinner|for tonight|tonight|dinner)\b/.test(c)&&/^(what|what's|whats)\b/.test(c))return info(R,'Tonight’s dinner is '+M.plan.tonight+'.');
 if(/\b(on|in) (the|my|our) (grocery |shopping )?list\b/.test(c)&&!its.length){
  var names=M.list.filter(function(x){return !x.got;}).map(function(x){return nm(x.k);});
  return info(R,names.length?'Your grocery list has '+names.length+(names.length===1?' thing: ':' things: ')+join(names)+'.':'Your grocery list is empty.');}
 if(!its.length)return L(R,{st:'cant',t:'Capture can’t answer that.',words:c});
 its.forEach(function(x){
  var ks=x.fam?FAM[x.fam]:[x.k];
  if(/\blist\b/.test(c)){ks=x.fam?ks.filter(function(k){return onList(M,k);}):ks;
   if(!ks.length)return info(R,Cap(x.fam)+' isn’t on your grocery list.');
   return ks.forEach(function(k){info(R,Cap(nm(k))+' '+be(k)+(onList(M,k)?'':'n’t')+' on your grocery list.');});}
  var have=ks.filter(function(k){return M.stock[k]>0;}),outs=ks.filter(function(k){return M.stock[k]===0;}),none=ks.filter(function(k){return !(k in M.stock);});
  if(have.length)info(R,'You have '+join(have.map(function(k){return amtOf(k,M.stock[k]);}))+'.');
  outs.forEach(function(k){info(R,'You’re out of '+nm(k)+'.');});
  none.forEach(function(k){info(R,Cap(nm(k))+' '+(I(k).pl?'aren’t':'isn’t')+' in your kitchen.');});});}

/* ---- follow-ups (LOGIC §4-5): one offer per item set to 0, never when it is on the list or this reply added it (F7) ---- */
function offers(M,R,ks){
 var need=[];
 ks.forEach(function(k){
  if(R.added[k]||R.offered[k])return;R.offered[k]=1;
  var idx=-1;R.lines.forEach(function(l,i){if(l.k===k&&((l.st==='done'&&l.undo.y==='stock')||l.st==='no'))idx=i;});
  var li=onList(M,k);
  if(li&&!li.got){R.at=idx+1;info(R,Cap(nm(k))+' '+be(k)+' already on your list.',{k:k,quiet:1});R.at=null;return;}
  need.push({k:k,idx:idx});});
 if(!need.length)return;
 var last=Math.max.apply(null,need.map(function(n){return n.idx;}));
 R.lines.forEach(function(l,i){if(i>last&&l.st==='info'&&l.quiet)last=i;});
 R.at=last+1;
 if(need.length===1){var k=need[0].k,u=I(k).u;
  ask(R,{kind:'offer',qt:'list',ks:[k],step:u?{k:k,q:1}:null,t:u?'Add [[n]] of '+nm(k)+' to '+listQ(M)+'?':'Add '+nm(k)+' to '+listQ(M)+'?',opts:[['Yes','yes',null,'pri'],['No','no',null,'cancel']]});}
 else ask(R,{kind:'offer',qt:'list',ks:need.map(function(n){return n.k;}),t:'Add '+join(need.map(function(n){return nm(n.k);}))+' to '+listQ(M)+'?',opts:[['Yes','yes',null,'pri'],['No','no',null,'cancel']]});
 R.at=null;}
function qText(l){ /* the question's words; [[n]] becomes the amount (a tap opens the Stepper) */
 return l.step?l.t.replace('[[n]]',amt(l.step.k,l.step.q)):l.t;}

/* ---- the router (LOGIC §1.4 order) ---- */
function run(M,words,ctx){
 ctx=ctx||{};
 var R={id:'c'+(++M.seq),words:String(words).trim(),by:ctx.by||'Alex',via:ctx.via||null,voice:!!ctx.voice,day:ctx.day||'Today',time:ctx.time||'9:14 am',lines:[],n:0,head:null,zero:[],added:{},offered:{},at:null};
 var raw=R.words.replace(/\s+/g,' '),low=raw.toLowerCase().replace(/[’‘]/g,"'"),m;
 function fin(){if(R.zero.length)offers(M,R,R.zero);M.log.unshift(R);M.last=R;return R;}
 function planOffer(body){var dish=body.toLowerCase().replace(/\b(for )?(next week|sometime|soon|for dinner|one night)\b/g,'').replace(/[.!]+$/,'').trim();
  if(dish&&!M.muted['plan:'+dish])ask(R,{kind:'offer',qt:'plan',dish:dish,t:'Save '+dish+' for your next plan?',opts:[['Yes','yes',null,'pri'],['No','no',null,'cancel']]});}
 /* 1. whole-saying checks */
 if(low.replace(/[^a-z]/g,'').length<3){miss(R,raw);return fin();}
 if(/^(undo|undo that|undo it|take that back|scratch that)[.!]?$/.test(low)){

/* ---- undo (LOGIC §8) ---- */

/* ---------- toasts and menus ---------- */
function toast(text,btn,fn,ms){
 const box=$('#toasts');while(box.children.length>=3)box.firstElementChild.remove();
 const t=document.createElement('div');t.className='toast';t.innerHTML=`<span>${esc(text)}</span>${btn?`<button>${esc(btn)}</button>`:''}`;
 const kill=()=>{t.classList.add('out');setTimeout(()=>t.remove(),180);};
 if(btn)t.querySelector('button').onclick=()=>{kill();fn&&fn();};
 box.appendChild(t);
 let left=ms||(coarse()?8000:5000),tid=0,t0=0;const go=()=>{if(tid)return;t0=Date.now();tid=later(kill,left);},stop=()=>{if(!tid)return;clearTimeout(tid);TM.delete(tid);tid=0;left=Math.max(1200,left-(Date.now()-t0));};
 t.addEventListener('mouseenter',stop);t.addEventListener('mouseleave',go);t.addEventListener('focusin',stop);t.addEventListener('focusout',go);go();}

 m.classList.remove('up');m.classList.add('on');

function closePop(why){
 if(!S.pop)return;
 let msg='',btn='',fn=null;const see=()=>goPage('capture');
 if(S.ph==='listen'){stopAll();}
 else if(S.ph==='vcount'||S.ph==='sending'){stopAll();finishSend(true);
  if(S.kept){msg=S.kept.fail.t;}
  else if(S.R){const n=ENG.park(M,S.R);msg=n?`Sent. ${n===1?'1 question waits':n+' questions wait'} in To review on Today.`:'Sent: '+shortLine(S.R);btn='See It';fn=see;}}
 else if(S.ph==='reply'&&S.R){const t=parkTell(S.R);msg=t.msg;btn=t.btn;fn=t.fn;}
 else if((S.fix||S.again)&&S.words.trim()){ENG.keep(M,S.words,'cancelled',ctxNow());S.words='';msg='Your words are saved in To review.';btn='See It';fn=see;}
 S.pop=false;S.kb=false;const keepWords=(S.ph==='idle'||S.ph==='typed')&&!S.fix&&!S.again?S.words:'';
 resetPop();S.words=keepWords;S.ph='idle';
 const p=$('#pop');p.classList.remove('show');p.classList.add('hide');$('#scrim').classList.remove('on');
 $('#capghost').classList.remove('show');$('#kb').classList.remove('on');
 setTimeout(()=>{if(!S.pop)p.classList.remove('hide');},SHOTS?0:170);
 renderMain(false);
 if(msg)toast(msg,btn,fn);}

 if(n)return {msg:(n===1?'1 question':n+' questions')+' sent to To review on Today.',btn:'See It',fn:()=>goPage('capture')};
 if(offs.length){const o=offs[0],nmz=ENG.Cap(ENG.join(o.ks.map(ENG.nm)));
  return {msg:nmz+' not added to the grocery list.',btn:'Add It',fn:()=>{const t=ENG.addOffer(M,R,o);renderMain(false);toast(t);}};}
 return {msg:'',btn:'',fn:null};}

const said=t=>esc(t);
const LICON={done:'check',no:'minus',info:'info',undone:'undo',fixed:'pen',cant:'alert',miss:'alert',q:'clock'};
function lineHTML(R,l,o){
 o=o||{};const can=canAct(R)&&!o.ro;
 if(l.st==='q'){if(!(l.later||(o.page&&l.parked)))return '';
  return `<div class="ln info quiet">${ic('clock')}<div class="lt">Waiting in To review: ${said(ENG.qText(l))}</div></div>`;}
 let h=`<div class="ln ${l.st}${l.quiet?' quiet':''}${o.ans?' ans':''}">${ic(LICON[l.st]||'info')}<div class="lt">${said(l.t)}</div>${l.st==='done'&&l.undo&&can?`<button class="ib" data-undo="${l.id}" aria-label="Undo: ${esc(l.t)}" title="Undo">${ic('undo')}</button>`:''}</div>`;
 const f=S.errs[l.id]||l.fail;if(f)h+=`<div class="lfail">${ic('alert')}<span>${esc(f)}</span></div>`;
 if(S.pick&&S.pick.lid===l.id)h+=pickHTML();
 else if(l.btn&&can)h+=`<div class="lbtn">${l.btn.map(b=>`<button class="btn tan" data-lb="${l.id}" data-a="${b[1]}">${esc(b[0])}</button>`).join('')}</div>`;

function replyHTML(R){
 let h='';const dn=R.lines.filter(l=>l.st==='done'),d=dn.length,answer=R.lines.length&&R.lines.every(l=>l.st==='info'&&!l.quiet);

 if(R.head)h+=`<div class="rhead"><span>${esc(R.head)}</span><button class="btn tan" data-fixw="${R.id}">Fix Words</button></div>`;
 if(S.errs.all&&S.errR===R.id)h+=`<div class="lfail all">${ic('alert')}<span>${esc(S.errs.all)}</span></div>`;
 /* r21a (Tyler 11-26): while a question is open the done lines fold into one row, "5 done"; a tap opens them.
    A done line with an error or an open amount picker keeps the fold open. */
 if(d>=2&&openQ(R).length){
  const ex=!!dx[R.id]||dn.some(l=>S.errs[l.id]||l.fail||(S.pick&&S.pick.lid===l.id));dp[R.id]=ex?'open':'closed';
  h+=`<div class="lh dsum"><button class="sel dtog" data-dtog="${R.id}" aria-expanded="${ex}" aria-controls="dg${R.id}">${d} done${ic('cd')}</button><button class="btn cancel" data-undoall="${R.id}">Undo All</button></div>`;
  h+=`<div class="dg${ex?' on':''}" id="dg${R.id}"${ex?'':' inert'}><div class="dgi">${dn.map(l=>lineHTML(R,l,{ans:answer})).join('')}</div></div>`;

 h+=R.lines.map(l=>{const x=lineHTML(R,l,{ans:answer});return grow&&l.st==='done'?x.replace('<div class="ln ','<div class="ln dgrow '):x;}).join('');

 return `<div class="kc ${f.k==='fail'?'err':f.k==='guest'||f.k==='liveoff'?'ok':''}">${ic(icn)}<div class="kcb"><div class="kt">${esc(f.t)}</div>${f.sub?`<div class="ks">${esc(f.sub)}</div>`:''}${S.keptNote?`<div class="ks">${esc(S.keptNote)}</div>`:''}
 <div class="kbtns">${f.btn.filter(b=>!(b[1]==='note'&&S.keptNote)&&b[1]!=='open').map(b=>`<button class="btn ${b[2]}" data-kb="${b[1]}">${esc(b[0])}</button>`).join('')}</div></div></div>`;}

/* ---------- sending: Send, voice send, Say It Again, Try Again all end in finishSend -> ENG.send ---------- */
function send(){
 const b=$('#pbox'),words=(b?b.value:S.words).trim();if(!words)return;
 stopAll();S.words=words;S.kb=false;S.step=0;S.fixnote='';setPh('sending');
 if(SHOTS)return;
 const n=ENG.sendCheck(W,S.who)?1:3;
 S.sI=setInterval(()=>{S.step++;if(S.step>=n){clearInterval(S.sI);S.sI=0;S.step=Math.max(S.step,n===1?1:3);renderPop();later(()=>finishSend(),n===1?200:320);}else renderPop();},430);}
function finishSend(silent){
 const ctx=ctxNow(S.retry?{kept:S.retry}:null);let r;
 if(S.again){r=ENG.again(M,S.again.R,S.again.id,S.words,W,ctx);if(r.fail&&!r.kept){S.R=S.again.R;S.ph='reply';r=null;}}
 else r=ENG.send(M,S.words,W,ctx);
 S.again=null;S.fix=false;S.fixnote='';S.retry=null;S.pick=null;S.amt=null;S.errs={};S.hold=false;S.lastQ=null;
 if(r&&r.kept){S.kept=r;S.keptNote='';S.R=null;S.ph='kept';}
 else if(r&&r.reply){S.R=r.reply;S.kept=null;S.ph='reply';}
 S.words='';S.voice=false;
 if(silent)return;
 renderPop();renderMain(false);
 if(S.ph==='reply')afterChange(S.R);else if(S.kept&&(S.kept.fail.k==='guest'||S.kept.fail.k==='liveoff'))startCd();}
function startCd(){stopCd();if(S.hold||!S.pop)return;S.cd=SHOTS?5:8;const f=$('#pfoot');if(f)f.innerHTML=footHTML();if(SHOTS)return;
 S.cdI=setInterval(()=>{S.cd-=.25;const i=$('.cdbar i');if(i)i.style.setProperty('--f',(S.cd/8*100)+'%');if(S.cd<=0){stopCd();closePop('auto');}},250);}
function stopCd(){clearInterval(S.cdI);S.cdI=0;S.cd=0;}
function holdOpen(){S.hold=true;stopCd();}
function afterChange(R){if(!S.pop||S.R!==R||S.ph!=='reply')return;if(!ENG.open(R).length&&!S.hold&&!S.pick)startCd();else{stopCd();const f=$('#pfoot');if(f)f.innerHTML=footHTML();}}
function refresh(){if(S.pop)renderPop();renderMain(false);}

/* ---------- voice (a mock: the words are a stand-in saying) ---------- */
function leaveReply(){ /* a new capture starts: open asks wait in To review (BRIEF §6 item 7) */
 if(S.ph==='reply'&&S.R){const t=parkTell(S.R);if(t.msg)toast(t.msg,t.btn==='Add It'?t.btn:'',t.btn==='Add It'?t.fn:null);renderMain(false);}
 S.R=null;S.kept=null;S.pick=null;S.amt=null;S.errs={};S.hold=false;stopCd();}
function startListen(){
 const draft=(S.ph==='typed'||S.ph==='idle')?S.words:'';
 leaveReply();stopAll();S.sayv=SAY[(S.sayI=(S.sayI||0)+1)-1]||SAY[0];if(S.sayI>=SAY.length)S.sayI=0;
 S.draft=draft;S.heard=SHOTS?3:0;S.latched=false;S.holdT=Date.now();S.kb=false;setPh('listen');
 if(SHOTS)return;const n=S.sayv.split(' ').length;
 S.lI=setInterval(()=>{if(S.heard<n){S.heard++;const h=$('#heard');if(h)h.innerHTML=wordsHTML(S.sayv,S.heard);}},260);}
function endListen(){
 if(S.ph!=='listen')return;stopAll();S.words=(S.draft?S.draft.trim()+' ':'')+S.sayv;S.voice=true;S.vc=SHOTS?5:8;setPh('vcount');
 if(SHOTS)return;
 S.vI=setInterval(()=>{S.vc-=.25;const b=$('#vbar'),n=$('#vcn');if(b)b.style.setProperty('--f',((8-S.vc)/8*100)+'%');if(n)n.textContent=Math.max(1,Math.ceil(S.vc));if(S.vc<=0){clearInterval(S.vI);S.vI=0;send();}},250);}
function focusBox(){const b=$('#pbox');if(!b)return;if(k()==='phone'&&!(FULL&&coarse())){S.kb=true;renderPop();}const c=$('#pbox');if(c&&!SHOTS){c.focus();c.setSelectionRange(c.value.length,c.value.length);}}

/* ---------- taps on a reply (pop-up and page): each goes through ENG and can fail ---------- */
function qTap(R,id,a,v){
 delete S.errs[id];const n0=ENG.open(R).length;
 const r=ENG.tap(M,R,id,a,v===''?null:v,W);
 if(r.fail)S.errs[id]=r.fail;
 else if(r.pick){const p=r.pick,cur=M.stock[p.k]||0;S.pick={rid:R.id,lid:id,k:p.k,max:p.max,act:p.act,word:p.word,min:p.act==='amount'?0:1,val:p.act==='amount'?(p.max>=99?cur:Math.max(0,p.max-1)):1};holdOpen();}
 else{S.pick=null;S.amt=null;if(ENG.open(R).length<n0||a==='later')R._ans=(R._ans||0)+1;}
 refresh();afterChange(R);}
function lineTap(R,id,a){
 const l=R.lines.find(x=>x.id===id);if(!l)return;
 if(a==='again'){S.again={R:R,id:id};S.words=l.words||'';S.fixnote='Say that part again. The rest is kept.';stopCd();if(!S.pop){S.pop=true;$('#pop').classList.add('show');$('#scrim').classList.add('on');}S.ph='typed';renderPop();focusBox();return;}
 qTap(R,id,a,'');}
function pickOk(){const p=S.pick,R=findR(p.rid);if(!R)return;delete S.errs[p.lid];
 const r=ENG.tap(M,R,p.lid,p.act,p.val,W);
 if(r.fail)S.errs[p.lid]=r.fail;else{S.pick=null;R._ans=(R._ans||0)+1;}
 refresh();afterChange(R);}
function doUndo(R,id){const r=ENG.undo(M,R,id,W);
 if(r.fail){if(!r.line)S.errs[id]=r.fail;}else{delete S.errs[id];R.head=r.t;}
 holdOpen();refresh();}
function doUndoAll(R){delete S.errs.all;const r=ENG.undoAll(M,R,W);if(r.fail){S.errs.all=r.fail;S.errR=R.id;}holdOpen();refresh();return r;}
/* Fix Words: everything in this capture is undone first, then the words come back to the box */
function fixWords(R){
 delete S.errs.all;let note='Fix your words and send again.';
 if(R.lines.some(l=>l.st==='done')){const r=ENG.undoAll(M,R,W);if(r.fail){S.errs.all=r.fail;S.errR=R.id;refresh();return;}if(!r.all){refresh();return;}}
 leaveReply();S.fix=true;S.again=null;S.words=R.words;S.fixnote=(R.head&&/^Undid all/.test(R.head)?R.head:'Undone. '+note);
 if(!S.pop){S.pop=true;$('#pop').classList.add('show');$('#scrim').classList.add('on');}
 S.ph='typed';renderPop();renderMain(false);focusBox();}
function keptTap(a){
 const v=S.kept.kept;
 if(a==='note'){const r=ENG.keepNote(M,v,W);if(r.queued){S.keptNote=r.queued;renderPop();}else{S.R=r.reply;S.kept=null;S.ph='reply';renderPop();renderMain(false);afterChange(S.R);}}
 else if(a==='retry'){S.words=v.words;S.retry=v;S.kept=null;S.step=0;setPh('sending');
  if(SHOTS)return;later(()=>{S.step=1;renderPop();later(()=>finishSend(),300);},430);}}


/* ====================== pages ====================== */
function visReview(){return M.review.filter(x=>S.who==='owner'?true:S.who==='limited'?(x.by===me()&&x.kind!=='guest'):false);}

 ['#capbadge','#ghostbadge'].forEach(s=>{const b=$(s);if(b){b.hidden=!n||S.pstate==='loading';b.textContent=n;}});
 $$('[data-nav]').forEach(b=>{const on=b.dataset.nav===S.page;b.classList.toggle('on',on);if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});

 ENG.sweep(M);S.stay=[];S.errs={};S.pick=S.pop?S.pick:null;S.amt=S.pop?S.amt:null;S.sortFail='';}

/* ---------- the Capture page (FULL_PAGE §3) ---------- */
const AV=b=>`<span class="av xs ${b==='Maria'?'m':b==='Sam'?'s':''}">${b[0]}</span>`;
function reviewRows(){ /* To review rows, with rows answered on this visit kept in place */
 const rows=visReview().map(x=>({x:x,R:x.kind==='q'?findR(x.rid):null}));
 S.stay.forEach(s=>{if(!rows.some(r=>r.x===s.x))rows.splice(Math.min(s.idx,rows.length),0,{x:s.x,R:s.R,sent:true});});
 return rows;}
function rvRow(r,loud){
 const x=r.x,by=whoName(x.by);
 if(x.kind==='q'&&r.R&&!x.resolved){const R=r.R,l=ENG.openAll(R)[0];if(!l)return '';
  const q=qInner(R,l,{sm:true,soft:!loud});
  return `<div class="rv${loud?' loud':''}" data-r="${R.id}" data-rv="${x.id}"><div class="rvm"><div class="rvq">${q.txt}</div><div class="rvs">${by} said “${esc(R.words)}” · ${x.day}&nbsp;${nb(x.time)}${l.snap!=null&&l.k?' · You had '+esc(ENG.amt(l.k,l.snap))+' then':''}</div>${q.amt}${q.err}</div><div class="rva">${q.btns}</div></div>`;}
 if(r.sent||x.resolved){const R=r.R;if(!R)return '';const o=ENG.open(R).filter(l=>!l.parked),d=R.lines.filter(l=>l.st==='done'),can=canAct(R);
  const said1=R.head||(d.length?'Done. '+d.map(l=>l.t).join(' '):(R.lines.filter(l=>l.st!=='q').map(l=>l.t).join(' ')||'Done.'));
  return `<div class="rv ansd" data-r="${R.id}" data-rv="${x.id}">${ic(d.length?'check':'info','i ansi')}<div class="rvm"><div class="rvq w">${esc(said1)}</div><div class="rvs">${R.head?'':'See it in Recent changes.'}</div>
   ${o.map(l=>{const q=qInner(R,l,{soft:true});return `<div class="rvf"><div class="rvq">${q.txt}</div>${q.amt}${q.btns}${q.err}</div>`;}).join('')}</div>${can&&d.length?`<button class="ib" data-undoall="${R.id}" aria-label="Undo: ${esc(said1)}" title="Undo">${ic('undo')}</button>`:''}</div>`;}
 const can=S.who==='owner'||x.by===me(),e=S.errs[x.id];
 return `<div class="rv" data-rv="${x.id}"><div class="rvm"><div class="rvq w">“${esc(x.words)}”</div><div class="rvs">${by} · ${x.day}&nbsp;${nb(x.time)} · ${esc(x.noteQueued?'It saves as a note once you’re back online.':x.kind==='guest'&&can&&x.by!==me()?by+' asked for this. Send Now makes the change.':ENG.REASON[x.rk]||'')}</div>${e?`<div class="qerr">${ic('alert')}<span>${esc(e)}</span></div>`:''}</div>
  <div class="rva">${can?`<button class="btn sec" data-sendnow="${x.id}">${S.busy===x.id?'<span class="spin"></span>Sending':'Send Now'}</button><button class="ib" data-rvmenu="${x.id}" aria-label="More" aria-haspopup="menu">${ic('dots')}</button>`:''}</div></div>`;}

function sendNow(id){
 const x=M.review.find(v=>v.id===id);if(!x||S.busy)return;delete S.errs[id];
 const idx=reviewRows().findIndex(r=>r.x===x);
 const fin=()=>{S.busy=null;const r=ENG.send(M,x.words,W,{who:x.kind==='guest'?'owner':S.who,kept:x,by:x.by,day:'Today',time:'9:41 am'});
  if(r.kept)S.errs[id]=r.fail.k==='liveoff'?'Saved. Sorted soon.':r.fail.t+' Your words are still here.';
  else{const R=r.reply,asks=ENG.openAll(R).filter(l=>l.kind==='ask');R.via='sent from To review';
   if(asks.length)asks.forEach(l=>{ENG.tap(M,R,l.id,'later',null,null);l.later=false;});else S.stay.push({x:x,R:R,idx:idx});}
  renderMain(false);};
 if(SHOTS){fin();return;}S.busy=id;renderMain(false);later(fin,520);}
function sortNow(){
 if(S.sorting)return;S.sortFail='';
 const fin=()=>{S.sorting=false;const W2={off:W.off,used:W.used,fail:W.fail,live:true},chk=ENG.sendCheck(W2,'owner');
  if(chk){S.sortFail=[chk.k==='offline'?'No internet. Nothing was sorted.':chk.k==='used'?'This month’s sorting is used up. Nothing was sorted.':'Couldn’t sort. Nothing changed.','Your words wait in Not sorted yet.'];renderMain(false);return;}
  const list=M.unsorted.slice().reverse();let q=0;
  list.forEach(x=>{const r=ENG.send(M,x.words,W2,{who:'owner',kept:x,by:x.by,day:x.day,time:x.time});if(r.reply){r.reply.via='sorted';ENG.openAll(r.reply).forEach(l=>{ENG.tap(M,r.reply,l.id,'later',null,null);l.later=false;q++;});}});
  renderMain(false);toast('Sorted '+list.length+'.'+(q?' '+(q===1?'1 question is':q+' questions are')+' in To review.':''));};
 if(SHOTS){fin();return;}S.sorting=true;renderMain(false);later(fin,700);}

 if(t.matches('.kr i')){kbKey(t.textContent);return;}

 if(d.ms!=null){$('#mockmenu').classList.remove('on');if(d.ms)applyState(d.ms);else toggleWorld(d.mw);return;}
 switch(t.id){

  case 'rcfilter':{const names=[...new Set(M.log.map(R=>R.by))];openMenu(t,[{label:'Everyone',on:!S.filter,fn:()=>{S.filter=null;renderMain(false);}}].concat(names.map(n=>({label:whoName(n),on:S.filter===n,fn:()=>{S.filter=n;renderMain(false);}}))));return;}
 }
 if(d.ex){S.words=d.ex;S.ph='typed';renderPop();focusBox();return;}
 if(d.pex){S.words=d.pex;openPop();focusBox();return;}
 if(d.nav){if(d.nav==='today'||d.nav==='kitchen'){if(S.pop)closePop();goPage(d.nav);}
  else if(d.nav==='slim'||d.nav==='names'){$('.rail').classList.toggle('slim');t.title=t.getAttribute('aria-label');placePop();}

 if(d.filter!=null){S.filter=d.filter||null;renderMain(false);return;}
 if(d.more){S.more[d.more]=true;renderMain(false);return;}
 if(d.yw){S.yw[d.yw]=!S.yw[d.yw];renderMain(false);return;}
 if(d.sendnow){sendNow(d.sendnow);return;}
 if(d.rvmenu){const id=d.rvmenu;openMenu(t,[{label:'Save as a Note',icon:'note',fn:()=>rvNote(id)},{label:'Delete',icon:'trash',warn:true,fn:()=>rvDelete(id)}]);return;}
 if(d.enmenu){const R=findR(d.enmenu),n=R.lines.filter(l=>l.st==='done').length;openMenu(t,(n>=2?[{label:'Undo All '+n+' Changes',icon:'undo',fn:()=>{doUndoAll(R);}}]:[]).concat([{label:'Undo All and Fix Words',icon:'pen',fn:()=>fixWords(R)}]));return;}
 if(d.kb){keptTap(d.kb);return;}
 if(d.pk){const p=S.pick;p.val=Math.max(p.min,Math.min(p.max,p.val+(+d.pk)));refresh();return;}
 if(d.pkok){pickOk();return;}
 if(d.pkx){S.pick=null;refresh();return;}
 if(d.fixw){const R=findR(d.fixw);R&&fixWords(R);return;}
 if(d.dtog){const id=d.dtog,ex=!(S.dx&&S.dx[id]),g=document.getElementById('dg'+id);(S.dx||(S.dx={}))[id]=ex;(S.dprev||(S.dprev={}))[id]=ex?'open':'closed';
  t.setAttribute('aria-expanded',String(ex));if(g){g.classList.toggle('on',ex);g.toggleAttribute('inert',!ex);}return;}
 if(d.undoall){const R=findR(d.undoall);R&&doUndoAll(R);return;}
 const R=RofEl(t);if(!R)return;
 if(d.undo){doUndo(R,d.undo);return;}
 if(d.lb){lineTap(R,d.lb,d.a);return;}
 if(d.later){ENG.tap(M,R,d.later,'later',null,null);refresh();afterChange(R);return;}
 if(d.amt){S.amt=S.amt===d.amt?null:d.amt;holdOpen();refresh();return;}
 if(d.st){const l=R.lines.find(x=>x.id===d.q);if(l&&l.step){ENG.tap(M,R,d.q,'step',l.step.q+(+d.st),null);refresh();}return;}
 if(d.qa){qTap(R,d.q,d.qa,d.qv);return;}
}
function kbKey(c){const b=$('#pbox');if(!b)return;
 if(c==='return'){S.kb=false;renderPop();return;}if(c==='⇧'||c==='123')return;
 b.value=c==='⌫'?b.value.slice(0,-1):b.value+(c==='space'?' ':c);onInput(b);}
function onInput(b){
 S.words=b.value;const was=S.ph;if(S.fix||S.again)return;
 S.ph=b.value.trim()?'typed':'idle';
 if(was!==S.ph){$('#pop').dataset.ph=S.ph;$('#pfoot').innerHTML=footHTML();const ex=$('#pex');if(ex&&S.ph==='typed')ex.remove();if(S.ph==='idle'&&!S.kb){S.voice=false;const f=document.activeElement===b;renderPop();if(f){const c=$('#pbox');c&&c.focus();}}}}
let talkDown=0;
function wire(){
 const dev=$('#dev');
 document.addEventListener('click',onClick);
 dev.addEventListener('pointerdown',e=>{const t=e.target.closest('[data-talk]');if(!t)return;e.preventDefault();talkDown=Date.now();startListen();});
 addEventListener('pointerup',()=>{if(!talkDown||S.ph!=='listen')return;const held=Date.now()-talkDown;talkDown=0;if(held>400)endListen();else{S.latched=true;renderPop();}});
 dev.addEventListener('keydown',e=>{const t=e.target.closest&&e.target.closest('[data-talk]');if(t&&(e.key==='Enter'||e.key===' ')){e.preventDefault();startListen();S.latched=true;renderPop();const d=$('#talkdone');d&&d.focus();}
  if(e.target.id==='pbox'&&e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();send();}
  if(e.target.id==='pkv'&&e.key==='Enter'){e.preventDefault();pickOk();}});
 dev.addEventListener('input',e=>{if(e.target.id==='pbox')onInput(e.target);
  if(e.target.dataset&&e.target.dataset.stin){const R=RofEl(e.target),v=parseFloat(e.target.value);if(R&&!isNaN(v)&&v>0){const l=R.lines.find(x=>x.id===e.target.dataset.stin);if(l&&l.step){l.step.q=Math.min(99,v);const b=$(`[data-amt="${l.id}"]`);if(b)b.textContent=ENG.amt(l.step.k,l.step.q);}}}
  if(e.target.id==='pkv'&&S.pick){const v=parseFloat(e.target.value);if(!isNaN(v))S.pick.val=Math.max(S.pick.min,Math.min(S.pick.max,v));}});
 dev.addEventListener('focusin',e=>{if(e.target.id==='pbox'&&k()==='phone'&&!(FULL&&coarse())&&!S.kb&&!SHOTS){S.kb=true;placePop();const ex=$('#pex');ex&&ex.remove();}});
 dev.addEventListener('pointerdown',e=>{if(S.pop&&S.cd>0&&e.target.closest('#pin')&&!e.target.closest('#keepopen')){holdOpen();const c=$('.cd');if(c){c.style.visibility='hidden';/* keep its room until the tap is over, so nothing moves under the finger */
   addEventListener('pointerup',()=>later(()=>{if(c.isConnected){const f=$('#pfoot');if(f)f.innerHTML=footHTML();}},90),{once:true});}}},true);
 addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(S.menu)closeMenu();else if($('#mockmenu').classList.contains('on'))$('#mockmenu').classList.remove('on');else if(S.pick){S.pick=null;refresh();}else if(S.pop)closePop();});
}

 stopAll();if(!RECIPE[sid])sid='closed';
 M=ENG.newModel();Object.assign(W,{off:false,live:true,used:false,fail:false});Object.assign(S,BLANK());S.sid=sid;S.sayI=0;S.after=null;S.retry=null;

 if(S.pop&&S.ph==='reply')afterChange(S.R);else if(S.pop&&S.kept&&(S.kept.fail.k==='guest'||S.kept.fail.k==='liveoff'))startCd();
 if(S.after){S.after();S.after=null;}}
