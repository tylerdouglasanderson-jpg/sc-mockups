<html lang="en">
<head><script>window.SC_FULL='phone'</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan a week r53 iPhone</title>
<script>
/* Plan a week v3 mockup (T-2132 / T-2149, App Walkthrough 3). Not agreed. One file.
   Full-screen mode for the review links: window.SC_FULL = desktop | ipad | phone, or ?full=ipad by hand.
   ?state=<id> opens one state (the shot script uses it). The dark bar at the top is mockup-only. */
window.FULL=window.SC_FULL||new URLSearchParams(location.search).get('full')||'';
if(window.FULL)document.documentElement.classList.add('full','full-'+window.FULL);
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500;1,9..144,600&display=swap" rel="stylesheet"><!-- r24: Fraunces only for the C-058 recipe card (its own fonts link) -->
<style>
/* Frame, tokens and kit parts are copied from the Groceries v3 mockup (round 17), which copies the live app and src/kit:
   header 50, rail 219, tan bar 46, Button 44 radius 8, Chip 44 radius 8, Card radius 12, Popover radius 12, Dialog 420/480,
   Toast bottom right, scrollbar 12 gutter / 6 thumb. Index cards copy the C-058 Recipes page mockup (round 15). */
:root{
  --page:#EDE5D8; --card:#FAF6EE; --panel:#F6F2E9; --panel-alt:#F1E8DA;
  --header:#6B3E14; --subbar:#E4D3B3; --hdr-text:#FAF4EB; --subbar-date:#5C3D0A; --subbar-2:#7A5030;
  --ink:#1E1E1C; --ink2:#54524A; --muted:#605E55;
  --sage:#8FAF8A; --sage-dark:#1F3A1C; --sage-light:#E4EDE2; --sage-text:#4B6947; --sage-line:#B9CDB4;
  --amber:#C8943A; --amber-light:#F5ECD8; --amber-text:#7E5C22;
  --urgent-bg:#F5E4E4; --urgent-text:#5C1A1A; --urgent-border:#8E3131;
  --chip:#E4D9C6; --chip-on:#B7D0B0; --chip-warm:#EFE4CC; --chip-warm-edge:#988048;
  --row-hover:#F0EEE3; --track:#DDD5C5; --folder-line:#D2C6B0;
  --bcard:rgba(0,0,0,.09); --brow:rgba(0,0,0,.06); --scrim:rgba(0,0,0,.4);
  --shadow-card:0 1px 2px rgba(45,33,22,.055),0 6px 16px rgba(45,33,22,.055);
  --shadow-pop:0 4px 14px rgba(45,33,22,.16); --shadow-float:0 16px 48px rgba(45,33,22,.2);
  --hover:inset 0 0 0 100px rgba(30,30,28,.04); --press:inset 0 0 0 100px rgba(30,30,28,.16);
  /* C-058 index card */
  --icard:#FFFDF7; --ired:rgba(196,72,60,.55); --iblue:rgba(80,120,170,.16); --tan-line:#D2BE98; --endpaper:#F3E9D6;
  --c-muted:96 94 85; --c-ink2:84 82 74; --member-1:#5E7C55; --member-2:#9A5B78; --ired-line:rgba(196,72,60,.72);
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --ease:cubic-bezier(.25,.46,.45,.94);
}
*{box-sizing:border-box}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
html,body{margin:0;height:100%;background:var(--page)}
body{color:var(--ink);font:400 15px/1.45 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea{font:inherit;color:inherit}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:16px;height:16px}
:focus-visible{outline:2px solid var(--sage-text);outline-offset:2px}
[tabindex="-1"]:focus{outline:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.2s!important;transition-property:opacity,background-color,border-color,color,box-shadow,width,height,max-width,grid-template-rows,grid-template-columns,visibility!important}
  /* r17 (motion F1, F2): only entrances become a single 0.2 s fade; endless loops stop; size changes keep their 0.2 s ease (not movement) */
  .arrive,.fadein,.sheet,.toast,.menu.open,.scrim.open,.sheetchat,.sheetswap,.fpop,.tpc.nw,.msg.nw,.swap.nw,.menu.assheet,.menu .svnote{animation-name:fade!important;animation-duration:.2s!important;animation-iteration-count:1!important}
  .closing,.leaving,.sheetleave,.menu.assheet.closing{animation-name:fadeout!important;animation-duration:.2s!important}
  .menu:not(.assheet) .mclose{display:none}
  .spin{animation:none!important;opacity:.6}.sk,.slot{animation:none!important}.meal.nope,.strip .dsq.pulse{animation:none!important}
  .ic:hover,.tpc.sel,.btn:active,.chip:active{transform:none!important}.daysfold:not(.open)>div{opacity:0}
  .picker,.picker.out{transform:none!important}.picker{transition:opacity .2s,visibility 0s linear 0s!important}.picker.out{opacity:0;transition:opacity .2s,visibility 0s linear .2s!important}}

/* the one themed scroll bar (DESIGN 4.10) */
.scroll,.sheet,.menu .mi,.pk-scroll,.chat .msgs,.swap .list,.tpcards,.fpop{scrollbar-width:thin;scrollbar-color:rgb(var(--c-muted) / .35) transparent}
.scroll::-webkit-scrollbar,.sheet::-webkit-scrollbar,.pk-scroll::-webkit-scrollbar,.chat .msgs::-webkit-scrollbar,.swap .list::-webkit-scrollbar,.menu .mi::-webkit-scrollbar,.tpcards::-webkit-scrollbar,.fpop::-webkit-scrollbar{width:12px;height:12px}
.scroll::-webkit-scrollbar-thumb,.sheet::-webkit-scrollbar-thumb,.pk-scroll::-webkit-scrollbar-thumb,.chat .msgs::-webkit-scrollbar-thumb,.swap .list::-webkit-scrollbar-thumb,.menu .mi::-webkit-scrollbar-thumb,.tpcards::-webkit-scrollbar-thumb,.fpop::-webkit-scrollbar-thumb{background:rgb(var(--c-muted) / .35);border:3px solid transparent;background-clip:padding-box;border-radius:999px}
.scroll::-webkit-scrollbar-thumb:hover,.sheet::-webkit-scrollbar-thumb:hover,.pk-scroll::-webkit-scrollbar-thumb:hover,.chat .msgs::-webkit-scrollbar-thumb:hover,.swap .list::-webkit-scrollbar-thumb:hover,.menu .mi::-webkit-scrollbar-thumb:hover{background-color:rgb(var(--c-ink2) / .7)}
.scroll::-webkit-scrollbar-thumb:active,.sheet::-webkit-scrollbar-thumb:active,.pk-scroll::-webkit-scrollbar-thumb:active,.chat .msgs::-webkit-scrollbar-thumb:active,.swap .list::-webkit-scrollbar-thumb:active,.menu .mi::-webkit-scrollbar-thumb:active{background-color:rgb(var(--c-ink2) / .85)}
.scroll::-webkit-scrollbar-track,.sheet::-webkit-scrollbar-track,.pk-scroll::-webkit-scrollbar-track,.chat .msgs::-webkit-scrollbar-track,.swap .list::-webkit-scrollbar-track,.menu .mi::-webkit-scrollbar-track,.tpcards::-webkit-scrollbar-track,.fpop::-webkit-scrollbar-track{background:transparent}

/* ---------- frame ---------- */
.app{height:100vh;height:100dvh;display:grid;grid-template-columns:219px 1fr;grid-template-rows:50px 1fr}
.top{grid-column:1/-1;display:flex;align-items:center;padding:0 28px 0 12px;color:var(--hdr-text);background:var(--header);position:relative}

.top::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(0,0,0,.10));pointer-events:none}
.wordmark{font-style:italic;font-weight:600;font-size:22px;position:relative;letter-spacing:.01em}
.top .sp{flex:1}
.av{display:inline-grid;place-items:center;border-radius:50%;font-weight:600;color:#fff;flex:none}
.av.hdr{width:28px;height:28px;font-size:12px;background:var(--member-1);box-shadow:0 0 0 2px var(--hdr-text);position:relative}
.av.sm{width:24px;height:24px;font-size:12px}
.rail{background:var(--card);border-right:1px solid var(--bcard);padding:12px 8px;display:flex;flex-direction:column;gap:4px}
.rail .cap{height:44px;border-radius:8px;background:var(--sage);color:var(--ink);display:flex;align-items:center;gap:8px;padding:0 12px;font-weight:500;font-size:16px;margin-bottom:8px}
.rail .ri{display:flex;align-items:center;gap:12px;height:44px;border-radius:8px;padding:0 12px;color:var(--ink2);font-weight:500;font-size:16px;text-align:left}
.rail .ri svg.i,.rail svg.ni{width:24px;height:24px;flex:none}
svg.ni{display:block;overflow:visible}
.rail .ri:hover{box-shadow:var(--hover)}.rail .cap:hover{box-shadow:var(--hover)}
.rail .ri.on{background:var(--sage-light);color:var(--sage-text)}
.rail hr{border:0;border-top:1px solid var(--bcard);margin:4px 8px}
.rail .grow{flex:1}
.body{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:46px auto 1fr;min-height:0;min-width:0;position:relative;overflow:hidden}

/* tan bar (C-057): title, one main button on the right, the ⋯ menu. Nothing else. */
.bar{background:var(--subbar);border-bottom:1px solid var(--brow);position:relative;display:flex}
.bar .in{display:flex;align-items:center;gap:12px;width:100%;padding:0 16px}
.bar .ttl{margin:0;line-height:inherit;font-style:normal;font-weight:600;font-size:16px;color:var(--subbar-date);white-space:nowrap}
.bar .ttl .crumb{font-style:normal;font-weight:500;color:var(--subbar-2)}
.bar .meta{font-size:13px;color:var(--subbar-2);padding-left:12px;border-left:1px solid var(--chip-warm-edge);display:flex;align-items:center;gap:8px;white-space:nowrap;min-width:0;overflow:hidden}
.bar .sp{flex:1}
.bar .btn{height:36px;padding:0 14px;font-size:15px}.bar .btn::after{content:"";position:absolute;inset:-4px 0}
.bar .btn.icon{width:36px;padding:0;color:var(--subbar-date);position:relative}.bar .btn.icon::after{content:"";position:absolute;inset:-4px}
.back{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--subbar-date);margin-left:-8px;position:relative}
.back:hover{box-shadow:var(--hover)}.back::after{content:"";position:absolute;inset:-4px}

/* kit Button */
.btn{height:44px;border-radius:8px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:500;font-size:16px;white-space:nowrap;transition:transform 50ms var(--ease),box-shadow .2s var(--ease),opacity .2s;position:relative;flex:none}
.btn:active{transform:scale(.97);box-shadow:var(--press)}
.btn.pri{background:var(--sage-dark);color:var(--hdr-text)}.btn.pri:hover{box-shadow:inset 0 0 0 100px rgba(250,244,235,.08)}.btn.pri:active{box-shadow:inset 0 0 0 100px rgba(250,244,235,.16)}
.btn.sec{background:var(--sage);color:var(--ink)}.btn.sec:hover{box-shadow:var(--hover)}
.btn.cancel{background:transparent;border:1px solid var(--ink2);color:var(--ink)}.btn.cancel:hover{box-shadow:var(--hover)}
.btn.danger{background:transparent;border:1px solid var(--urgent-border);color:var(--urgent-text)}.btn.danger:hover{box-shadow:var(--hover)}.btn.danger:active{background:var(--urgent-border);color:var(--hdr-text)}
.btn.tan{background:var(--chip-warm);border:1px solid var(--chip-warm-edge);color:var(--ink)}.btn.tan svg{color:var(--ink2)}.btn.tan:hover{box-shadow:var(--hover)}
.btn.icon{width:44px;padding:0;background:transparent;color:var(--ink2)}.btn.icon:hover{box-shadow:var(--hover)}
.btn.sm{height:36px;padding:0 12px;font-size:15px}.btn.sm::after{content:"";position:absolute;inset:-4px 0}
.btn.wide{width:100%}
.btn.off{opacity:.45;cursor:default}
.tag{font-size:13px;font-weight:600;color:var(--ink);background:var(--chip);border-radius:8px;padding:2px 8px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.tag.ok{background:var(--sage-light);color:var(--sage-text)}
.tag.amb{background:var(--amber-light);color:var(--amber-text)}
.tag.card{background:var(--card);border:1px solid var(--bcard)}
.eyebrow{font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--card);border-radius:12px;border:1px solid var(--bcard);box-shadow:var(--shadow-card)}
.chip{height:44px;border-radius:8px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:15px;color:var(--ink);background:var(--chip);border:1px solid transparent;font-weight:600;white-space:nowrap;transition:transform 50ms var(--ease)}
.chip:hover{box-shadow:var(--hover)}.chip:active{transform:scale(.97);box-shadow:var(--press)}
.chip.on{background:var(--chip-on);border-color:var(--sage-text);font-weight:700}
.chip.cmp{height:44px;padding:0 12px;font-size:14px}
.chip[aria-disabled="true"]{color:var(--muted);background:transparent;border-style:dashed;cursor:default;box-shadow:none} /* r37: a meal this day can't take (its reason is the chip's title and label) */
.chip{position:relative}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:rot .8s linear infinite;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fadeout{from{opacity:1}to{opacity:0}}
@keyframes slidedown{from{transform:none}to{transform:translateY(100%)}}
@keyframes bgrow{from{opacity:0;max-height:0;min-height:0;padding-top:0;padding-bottom:0;margin-bottom:0}to{opacity:1;max-height:240px}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
@keyframes growin{from{grid-template-rows:0fr;opacity:0}to{grid-template-rows:1fr;opacity:1}}
@keyframes dropin{from{opacity:0;transform:translateY(-18px) rotate(-2deg)}to{opacity:1;transform:none}}
@keyframes arrive{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
@keyframes shimmer{0%{background-position:-300px 0}100%{background-position:300px 0}}
.scroll{overflow:auto;min-height:0}

/* ---------- week row: one button per plan, under the tan bar (never in it) ---------- */
.weeks{display:flex;align-items:center;gap:8px;padding:12px 16px 0;min-width:0}
/* only the week buttons scroll sideways; the board's tools stay put at the right */
/* r16 (fit 6): no sideways scroll under a fade (it cut "Dec 8 / Appr" and "+ Plan Anot"); buttons wrap whole */
.wlist{display:flex;align-items:center;flex-wrap:wrap;gap:8px;min-width:0;flex:0 1 auto}
.wlist.nw{flex-wrap:nowrap;overflow:hidden}
.weeks.two{flex-wrap:wrap;row-gap:8px}.weeks.two .wsp{flex:1 0 100%;height:0;margin-top:-8px}.weeks.two .wsp+.btn{margin-left:auto}
.weeks .wsp{flex:1 1 0;min-width:0}
.weeks .wk.add{flex:none}
.weeks.cmp .wk .wi{display:none}.weeks.cmp .wk small .shs{display:none}.weeks.cmp .wk small .xss{display:inline} /* the short state word; the full words stay in the name and tooltip */.weeks.cmp .wk{padding-left:12px;padding-right:12px}.weeks.cmp .btn.tan{padding:0 12px}.weeks.cmp{gap:6px}.weeks.cmp .wlist{gap:6px}
/* the edge fade only shows when the row really runs past the edge */
.wlist::-webkit-scrollbar{display:none}
.weeks.slimtools .btn.tan{padding:0 14px}
/* r14 (panel 6 fit 4): one fixed word set on every screen (Draft · 1 open, Approved, Groceries added); the full words are in the label and tooltip.
   The row scrolls if it must; it never swaps words or drops icons */
.wk small .lgs{display:none}.wk small .xss{display:none}
.wk{min-height:44px;border-radius:8px;padding:0 10px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bcard);text-align:left;flex:none;transition:background .2s var(--ease),border-color .2s var(--ease)}
.wk:hover{box-shadow:var(--hover)}
.wk b{display:block;font-size:15px;font-weight:600;line-height:19px}
.wk small{display:block;font-size:13px;color:var(--ink2);line-height:17px;white-space:nowrap}
.wk .wi{width:18px;height:18px;flex:none;display:grid;place-items:center;color:var(--muted)}
.wk .wi svg{width:18px;height:18px}
.wk .wi.appr,.wk .wi.gadd{color:var(--sage-text)}.wk .wi.draft{color:var(--amber-text)}

/* "+ Plan Another Week" is an action, so it reads as a quiet text button, not as another week */
.wk.add{background:var(--chip-warm);border:1px solid var(--chip-warm-edge);color:var(--ink);font-weight:500;font-size:15px;gap:6px;padding:0 12px 0 10px}

/* ---------- work area: the board, and Claude beside it ---------- */
.work{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;padding:12px 16px 16px;min-height:0;transition:grid-template-columns .2s var(--ease)}

.board{display:flex;flex-direction:column;min-height:0;min-width:0;position:relative;transition:max-width .2s var(--ease)}
.board>.scroll{flex:1;border-radius:12px}
.days{background:var(--card);border:1px solid var(--bcard);border-radius:12px;box-shadow:var(--shadow-card)}

/* one day = one row of the journal (Q1=B): the day on the left, its meals as small index cards */
/* r10: every day has three columns: the date, its meals, and "+ Add a Meal" in a fixed column at the right.
   The button sits in the same spot on every day and never drops to a row of its own. */
.day{display:grid;grid-template-columns:44px auto minmax(0,1fr);gap:8px;padding:12px 12px 12px 12px;border-top:1px solid var(--brow);position:relative;transition:background .2s var(--ease)}

.day:last-child{border-radius:0 0 12px 12px}
/* r16 (fit 1): no stripe on the card edge (DESIGN 4.5.2); a light tint plus the bold "Today" word mark the day */
.day.today{background:color-mix(in srgb,var(--sage-light) 32%,var(--card))}

.dl{display:flex;flex-direction:column;align-items:flex-start;padding-top:2px}
.dl .wd{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.dl .dn{font-size:28px;font-weight:600;line-height:32px}
.dl .mo{font-size:12px;color:var(--muted)}
.dl .wd.tt{font-weight:700;letter-spacing:.04em;color:var(--sage-text)}
.mealgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px;align-items:start}
/* r12: every meal card on the board is one fixed width per device (--cw: computer 212, iPad 164); a day shows at most --n across,
   set from the board's width, so opening Claude never resizes a card, and the add button follows the last card */
.days{--cw:212px;--n:2}
[data-dev=ipad] .day{grid-template-columns:40px auto minmax(0,1fr);padding:12px 8px}
[data-dev=ipad] .day .addm:not(.solo){padding:0 10px 0 8px}
.day .mealgrid{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;max-width:calc(var(--n)*var(--cw) + (var(--n) - 1)*8px)}
.day .mealgrid>*{width:var(--cw);flex:none}.day .mealgrid>.addm{width:auto}
.ro .day:not(:has(.dact)){grid-template-columns:44px minmax(0,1fr)}
/* r10: with Claude closed, the week row and the board share one width, so their right edges line up (was board 920, row full width) */
@media (min-width:1101px){.body.wclosed .weeks{max-width:1152px}.work.closed .board{max-width:1120px}

  .body.wclosed .weeks{width:100%;margin-left:auto;margin-right:auto}.work.closed .board{width:100%;margin-left:auto;margin-right:auto}}
/* r9: "+ Add a Meal" always sits in the meal grid, after the cards, as one 44 px text button (no tucked copy under the date) */
/* past days of an approved week fold into one line (tap to open); their cooked / skipped marks stay in the line */
.pastrow{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:6px 12px 6px 12px;border-radius:12px 12px 0 0;text-align:left;color:var(--ink2);font-size:14px;background:var(--panel)}
.pastrow:hover{box-shadow:var(--hover)}
.pastrow b{color:var(--ink);font-weight:600;font-size:15px}
.pastrow .pr-st{display:inline-flex;align-items:center;gap:4px;color:var(--sage-text);font-weight:600}
.pastrow .pr-st svg{width:14px;height:14px}
.pastrow .sp{flex:1}
.pastrow .pr-go{display:inline-flex;align-items:center;gap:4px;color:var(--ink);font-weight:500;font-size:15px;height:36px;padding:0 10px 0 12px;border-radius:8px;border:1px solid var(--chip-warm-edge);background:var(--chip-warm)}
.pastrow .pr-go svg{transition:transform .2s var(--ease)}

.day.drop{background:var(--sage-light);box-shadow:inset 0 0 0 2px var(--sage-text)}

/* a day with an open slot: the card fills that slot, so the slot is what lights up too */

/* meal card = a small index card (C-058 look: cream face, red line under the title, faint blue rules) */
.meal{position:relative;border-radius:4px;border:0;padding:6px 12px 8px 12px;text-align:left;display:flex;flex-direction:column;
  background:var(--icard);
  box-shadow:0 1px 2px rgba(40,26,8,.14),0 0 0 1px rgba(60,40,10,.13);transition:box-shadow .2s var(--ease),transform .2s var(--ease),opacity .2s var(--ease);cursor:grab;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.meal:hover{box-shadow:0 4px 10px rgba(40,26,8,.16),0 0 0 1px rgba(60,40,10,.16)}

.meal .mt{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2);flex:none}

@keyframes nope{0%,100%{transform:none}25%{transform:translateX(-4px)}60%{transform:translateX(3px)}}
.meal .addpt{display:flex;align-items:center;gap:4px;font-size:13px;line-height:21px;color:var(--muted);border-bottom:1px solid var(--iblue);margin:0 -12px;padding:0 12px;width:calc(100% + 24px);text-align:left;background:var(--icard);cursor:pointer}
.meal .addpt svg{width:13px;height:13px}
.board.busy .meal .addpt{pointer-events:none;opacity:.45}
.meal .addpt:hover,.meal .addpt:focus-visible{color:var(--sage-text)}
.meal .pt.fx{display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--ink2)}

.meal .pt.fx .dotsep{color:var(--muted);margin:0 2px}
.meal .pt:last-child{border-bottom-color:transparent}

.meal .prep .tb{width:22px;height:22px;border-radius:4px;border:1px solid var(--muted);display:grid;place-items:center;flex:none;background:var(--page);transition:background .16s var(--ease)}
.meal .prep .tb svg{width:14px;height:14px;opacity:0;color:#fff;stroke-width:3}
.meal .prep.done .tb{background:var(--sage-text);border-color:var(--sage-text)}.meal .prep.done .tb svg{opacity:1}
.meal .prep.done span{color:var(--muted);text-decoration:line-through}
.meal .prep small{color:var(--muted);font-size:12px;margin-left:auto;white-space:nowrap}
.day .meal .prep{display:grid;grid-template-columns:22px minmax(0,1fr);column-gap:8px;row-gap:0;align-content:center;padding:4px 12px}
.day .meal .prep .tb{grid-row:1/3;align-self:center}.day .meal .prep small{grid-column:2;margin-left:0;line-height:16px}
.meal .go{margin:0 -12px;padding:8px 12px 0;background:var(--icard)}
.meal .go .btn{width:100%;font-size:15px}
.meal:has(>.prep:last-child){padding-bottom:0}.meal .prep:last-child{border-bottom-color:transparent}
.meal:has(>.go:last-child){padding-bottom:12px}
/* leftovers: the same cream card, a green line instead of the red one, and a small green "from Wed" */
.meal.left .pt{border-bottom-color:transparent;color:var(--ink2)}
.meal.left .mn{font-weight:500;border-bottom-color:var(--sage-line)}
.meal.left .lf{display:flex;align-items:center;gap:4px;color:var(--sage-text);font-weight:600}
/* r19 (fit 7): the leftovers and Not saved tags are words only on every size */
.chat .msgs{position:relative}
.wk.add.off{color:var(--muted);cursor:default}.wk.add.off svg{color:var(--muted)}.wk.add.off:hover{box-shadow:none}
.meal.open,.meal.ask{min-height:86px}
.meal.open{background:transparent;box-shadow:none;border:1.5px dashed var(--folder-line);padding:5px 11px 7px;cursor:default}
.meal.open .mn{font-weight:500;color:var(--ink2);border-bottom-color:transparent}
.meal.open .fill{margin-top:auto;display:flex;gap:6px}
/* r7: the whole open slot is the button (no second "add" link beside "+ Add a Meal") */
.meal.open{cursor:pointer;transition:background .2s var(--ease),border-color .2s var(--ease)}
.meal.open:hover{background:rgba(255,255,255,.55);border-color:var(--sage-text)}
.meal.open .slotbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:calc(100% + 22px);margin:0 -11px -7px;padding:0 11px 8px;text-align:left;min-height:52px}
.meal.open .slotbtn .sb1{font-size:15px;font-weight:500;color:var(--ink2);line-height:20px}
.meal.open .slotbtn .sb2{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:500;color:var(--ink);height:36px;padding:0 12px 0 10px;border-radius:8px;background:var(--chip-warm);border:1px solid var(--chip-warm-edge);margin-top:4px}
.meal.open .slotbtn .sb2 svg{width:16px;height:16px;color:var(--ink2)}
.meal.open:hover .slotbtn .sb2{box-shadow:var(--hover)}
.ro .meal.open{cursor:default}.ro .meal.open:hover{background:transparent;border-color:var(--folder-line)}
/* r19 (sweep): the approve pop-up's two folds are the kit tan Button (sm), not a look-alike */
.fold svg{width:16px;height:16px}
.meal.cooked .mn,.meal.skipped .mn{color:var(--ink2)}
.meal.skipped .mn{text-decoration:line-through}
.meal .st{font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:3px}
.meal.cooked .st{color:var(--sage-text)}.meal.skipped .st{color:var(--muted)}
.meal.arrive{animation:arrive .26s var(--ease) both}
.meal.pend::before{content:"";position:absolute;top:8px;right:40px;width:8px;height:8px;border-radius:50%;background:var(--amber)}
.meal.ghost{opacity:.35}
.meal.lift{box-shadow:0 14px 28px rgba(40,26,8,.28),0 0 0 1px rgba(60,40,10,.16);transform:rotate(-1.5deg) scale(1.02)}
.meal.sel{box-shadow:0 0 0 2px var(--sage-text),0 6px 14px rgba(40,26,8,.16)}
.meal.menuon{box-shadow:0 10px 22px rgba(40,26,8,.22),0 0 0 1px rgba(60,40,10,.2);position:relative;z-index:2}
.meal.swapon{box-shadow:0 0 0 2px var(--sage-text),0 4px 10px rgba(40,26,8,.16)}
/* r23 (panel 10 visual 1, fit 5): an open meal menu lifts its card (no green ring: that is the keyboard focus ring) and dims the rest of the board, so a word the menu cuts reads as background */
.days .meal,.days .addm,.days .cookb{transition:opacity .2s var(--ease)}
body.mdim .days .meal:not(.menuon),body.mdim .days .addm,body.mdim .days .cookb,body.mdim .days .pastrow,body.mdim .days .zplus,body.mdim .toplace{opacity:.38} /* r37 (form 6): the + under each date and the tray step back too */
/* remove asks first, in place, on the card itself (the live confirm landed off screen) */
.meal.ask{background:var(--urgent-bg);box-shadow:0 0 0 1.5px var(--urgent-border);cursor:default;padding:8px 12px 10px}
.meal .askq{font-size:14px;line-height:19px;color:var(--urgent-text);padding:4px 0 8px;font-weight:600}
.meal .askq small{display:block;font-weight:400;color:var(--urgent-text);font-size:13px}
.meal .askb{display:flex;gap:8px;margin-top:auto}
.meal .askb .btn{flex:1;height:36px;font-size:15px;padding:0 8px;background:var(--card);position:relative}.meal .askb .btn::after{content:"";position:absolute;inset:-4px 0}
.meal .askb .btn.danger:active{background:var(--urgent-border)}
.meal.gone{opacity:0;transform:scale(.96)}
/* "+ Add a Meal" on every day: a quiet text button at the end of the day (a dashed box only on an empty day) */
.addm{min-height:44px;border-radius:8px;border:1px solid var(--chip-warm-edge);background:var(--chip-warm);display:flex;align-items:center;justify-content:flex-start;gap:6px;color:var(--ink);font-size:15px;font-weight:500;padding:0 12px 0 10px;align-self:start;justify-self:start;height:44px;white-space:nowrap;position:relative;transition:background .2s var(--ease),border-color .2s var(--ease),box-shadow .2s var(--ease)}
.addm{background:transparent;border-style:dashed;border-color:var(--tan-line);color:var(--ink2)}.addm:hover{background:var(--chip-warm);border-style:solid;box-shadow:var(--hover)}
.addm:hover{box-shadow:var(--hover)}.addm.on{filter:brightness(.95);box-shadow:inset 0 1px 3px rgba(60,40,10,.18)} /* r28 (panel 11 fit, earlier panels 5): pressed while its pop-up is open, not a green focus-like ring */
.addm .al svg{color:var(--ink2)}
.phpick .phday .meal.open{box-shadow:0 0 0 2px var(--sage-text)} /* r29: computer and iPad place by where you point (no ring on every Add a Meal) */
.phpick .day{cursor:copy}
.addm .al{display:inline-flex;align-items:center;gap:6px;transition:opacity .16s var(--ease)}
/* r16 (fit 2): while a card is pulled over a day, Add a Meal cross-fades into plain words ("Drops in Thu Dinner"); no box, no +, so it never looks pressable */
.addm .adl{position:absolute;left:0;top:0;height:44px;width:100%;display:flex;align-items:center;padding:0 2px;white-space:nowrap;line-height:18px;text-align:left;color:var(--sage-text);font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .16s var(--ease)}
.day.drop .addm{background:transparent;border-color:transparent;box-shadow:none}
.addm svg{width:16px;height:16px;flex:none}
/* an empty day: the add is a dashed box across the meals and add columns */
.dact{display:flex;flex-direction:column;align-items:flex-start;gap:8px;align-self:start;min-width:0}
.dact .cookb{white-space:nowrap}
.day .addm.solo{grid-column:2/4;justify-self:stretch;min-height:84px;height:auto;border:1.5px dashed var(--folder-line);background:transparent;justify-content:center;color:var(--ink)}
.day .addm.solo .adl{height:calc(100% + 2px)}
.phday .mealgrid .addm:only-child{min-height:84px;border:1.5px dashed var(--folder-line);background:transparent;justify-content:center;color:var(--ink2)}
.ro .meal{cursor:default}
/* skeleton slot while Claude makes the week (reserved space, no pop-in) */
.slot{min-height:64px;border-radius:4px;background:linear-gradient(90deg,var(--track) 0,var(--panel) 120px,var(--track) 240px) 0 0/600px 100%;animation:shimmer 1.4s linear infinite;box-shadow:0 0 0 1px rgba(60,40,10,.06)}

/* To Place row: the picked cards drop in above the week */
.tpwrap{display:grid;grid-template-rows:1fr}.tpwrap.nw{animation:growin .2s var(--ease)}
.tpwrap>div{overflow:hidden;min-height:0}
.toplace{background:var(--endpaper);border:1px solid var(--tan-line);border-radius:12px;padding:10px 12px 12px;margin-bottom:12px;
  background-image:radial-gradient(rgba(63,94,59,.16) 1px,transparent 1.4px);background-size:14px 14px}
.toplace .th2{display:flex;align-items:center;gap:8px;min-height:44px;flex-wrap:wrap}
.toplace .th2 b{font-size:15px}
.toplace .th2 small{color:var(--ink2);font-size:13px}
.toplace .tphint{font-size:14px;color:var(--ink);line-height:20px;margin:-2px 0 2px}.toplace .tphint b{font-weight:600;color:var(--sage-text)}
.toplace .tphint.tw{display:grid}.toplace .tphint.tw>span{grid-area:1/1;min-width:0}.toplace .tphint .tph2{visibility:hidden} /* r51: the line is as tall as its taller wording */
.toplace .tphint .tpd{display:block;color:var(--ink2)} /* r45/r46 (drag 8 purpose 3): the date shortcut, said before the lift, on its own line */
.toplace .th2 .sp{flex:1}
.tpcards{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 4px;scrollbar-width:thin}
.tpc{width:196px;flex:none;border-radius:4px;background:var(--icard);padding:0 10px 6px;text-align:left;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:pan-x;
  box-shadow:0 2px 5px rgba(40,26,8,.16),0 0 0 1px rgba(60,40,10,.12);transition:transform .2s var(--ease),box-shadow .2s var(--ease),opacity .2s}
.tpc.nw{animation:dropin .28s var(--ease) backwards}.tpc.nw:nth-child(2){animation-delay:.06s}.tpc.nw:nth-child(3){animation-delay:.12s}.tpc.nw:nth-child(4){animation-delay:.18s}
.flycard{position:fixed;z-index:80;pointer-events:none;border-radius:4px;background:var(--icard);padding:0 10px;box-shadow:0 12px 28px rgba(45,33,22,.26),0 0 0 1px rgba(60,40,10,.14);font-size:14px;font-weight:600;line-height:34px;white-space:nowrap;overflow:hidden}
.tpc{rotate:none}
.tpc .h{font-size:14px;font-weight:600;height:34px;line-height:34px;display:block;border-bottom:1px solid var(--ired-line);margin:0 -10px;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* while Claude makes the week the board is locked: no menus, no pulling, one plain line says why */
.busy .meal{cursor:default}.busy .meal .mx,.busy .meal .fill{visibility:hidden}
.busynote{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 14px;margin-bottom:12px;border-radius:12px;background:var(--card);border:1px solid var(--bcard);font-size:14px;color:var(--ink2)}
.tpc .m{font-size:12px;color:var(--ink2);line-height:22px;border-bottom:1px solid var(--iblue);display:flex;gap:8px;margin:0 -10px;padding:0 10px}
.tpc .m>span{display:inline-flex;align-items:center;gap:3px}
.tpc .m svg{width:12px;height:12px}
.toplace .tpclear{color:var(--ink2);font-weight:500;margin:0}
.tplay .tpside .tpclear{background:var(--card);border:1px solid var(--bcard);color:var(--ink)} /* r52 (agy22b #3): an outlined button, not bare words */
.btn.quiet{background:transparent;border:0;color:var(--ink2);padding:0 8px;gap:4px}.btn.quiet:hover{box-shadow:var(--hover)}.btn.quiet svg{color:var(--ink2)} /* r23: kit QuietAction */
.toplace .btn.tan svg{color:var(--sage-text)}
.tpc .grip{font-size:12px;color:var(--muted);line-height:20px;display:flex;align-items:center;gap:4px}
.tpcards.ovf{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 32px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 32px),transparent)} /* r35 (form 7): the edge fade on every size (iPad sideways cut the 3rd card mid-word) */
.tpc .grip svg{width:12px;height:12px}
/* r24: touch To Place cards: a small Place button (44 px tap area) next to the drag hint; the card's face opens the recipe */
.tpc .tpgo{position:relative;margin-left:auto;height:24px;flex:none;padding:0 10px;border-radius:8px;border:1px solid var(--sage-text);background:var(--card);color:var(--sage-text);font-size:13px;font-weight:600;line-height:22px} /* r35 (form 7): kit tokens (card fill, sage-text words and edge, radius 4) */

/* r50: computer and iPad: the tray on the week's own lanes (tpLay sets the columns). Each card sits over its usual meal's lane, so straight down

.tplay{display:grid;grid-template-columns:minmax(0,1fr);row-gap:10px;align-items:start}

@container (max-width:145px){#app .tplay .tpc .m{padding-right:58px}.tplay .tpc .m>span:not(.tpm) svg{display:none}} /* r52 (agy22d #1): the time stays, without its clock */
@container (max-width:112px){#app .tplay .tpc .m{padding-right:0}.tplay .tpc .m>span:not(.tpm){display:none}} /* r51 (agy21a #2.3): at 1440 a 125 px lane put Place on "20 min" */
.dragcard{position:fixed;z-index:80;pointer-events:none;width:196px;border-radius:4px;background:var(--icard);padding:0 10px 6px;box-shadow:var(--shadow-pop),0 0 0 1px var(--bcard);transition:opacity .2s var(--ease)} /* r35 (form 4, 8): kit shadow; it fades out over a lane (the lane shows the dish) instead of snapping */

/* r29 (Tyler answer 3): Available to Cook is good news, not a warning: soft sage, the pot icon, three ways stacked where Add a Meal sits */
.ncrow.avail{background:var(--card)}
.ncrow.avail .ncl b{color:var(--sage-text)}
.ncrow.avail .nca .btn{width:100%;justify-content:flex-start}
.pr-nc.avail{color:var(--sage-text)}
.avlist{display:flex;flex-direction:column;border:1px solid var(--brow);border-radius:8px;overflow:hidden;max-height:320px;overflow-y:auto}
.avi{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 14px;border:0;border-top:1px solid var(--brow);background:var(--card);text-align:left;cursor:pointer;color:var(--ink)}
.avi:first-child{border-top:0}
.avi:hover,.avi:focus-visible{background:var(--sage-light)}
.avi .avd{flex:0 0 64px;font-size:13px;color:var(--ink2)}.avi .avd b{font-size:15px;color:var(--ink)}
.avi .avn{flex:1;display:flex;flex-direction:column;line-height:1.25}.avi .avn small{font-size:12.5px;color:var(--ink2)}

/* phone: one quiet row under the day strip, like "Thu dinner isn't picked yet" */
.ncph{display:flex;align-items:center;gap:8px;margin:8px 0 6px;padding:6px 6px 6px 12px;border-radius:12px;background:var(--amber-light);border:1px solid var(--chip-warm-edge);font-size:14px;line-height:19px}
.ncph>svg{color:var(--amber-text);flex:none;width:16px;height:16px}.ncph .tx{flex:1;min-width:0}.ncph .btn{flex:none}
.ncph.avail{display:block;padding:8px 8px 8px 12px;background:var(--sage-light);border-color:var(--sage-line)}
.ncph.avail .avt{display:flex;gap:8px;align-items:flex-start}.ncph.avail .avt>svg{color:var(--sage-text);flex:none;width:16px;height:16px;margin-top:2px}
.ncph.avail .avw{color:var(--ink2)}
.ncph.avail .ava{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}.ncph.avail .ava .btn{padding:0 6px;justify-content:center;gap:4px;white-space:nowrap}
.dsq.k-notck svg{color:var(--sage-text)}
.qp .chip{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;height:auto;min-height:64px;padding:9px 26px 9px 12px;gap:0;text-align:left;white-space:normal;background:var(--card);border:1px solid #C9BCA4;font-weight:400}
/* r23 (panel 10 fit 1, visual 3): the kit RadioCard look: card fill and a thin edge when off, the selected fill (sage-light) and a sage edge when on, plus the small check */
.qp .chip:hover{box-shadow:var(--hover)}

.qp .chip .qt{display:flex;flex-direction:column;min-width:0}
.qp .chip .qt b{font-size:15px;font-weight:600;line-height:20px;color:var(--ink)}

.qp .chip .qk{position:absolute;top:6px;right:6px;width:18px;height:18px;border-radius:4px;display:grid;place-items:center;background:var(--sage-text);color:#fff;opacity:0;transition:opacity .16s var(--ease)}

.startc .go{display:flex;align-items:center;gap:16px;margin-top:20px;padding-top:16px;border-top:1px solid var(--brow);flex-wrap:wrap}
.startc .go .btn{min-width:200px}
.startc .talk{display:flex;align-items:flex-start;gap:10px;font-size:14px;line-height:20px;color:var(--ink2);flex:1;min-width:220px}

.when .grp.sm .datebox b{min-width:72px;align-self:stretch;display:grid;place-items:center;border-left:1px solid var(--folder-line);border-right:1px solid var(--folder-line);background:var(--card)}

/* Claude's empty panel before anything is asked: no AI is spent until you start */
.chatempty{margin:auto 8px;text-align:center;color:var(--ink2);font-size:14px;line-height:20px;padding:16px}
.chatempty .ring{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;margin:0 auto 10px;background:var(--panel);color:var(--sage-text)}
.chatempty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
/* "What I used" box inside Claude's first reply */
.knows{margin:8px 0 6px;border-radius:8px;background:var(--card);border:1px solid var(--bcard);padding:8px 10px}
.knows .eyebrow{display:block;margin-bottom:2px}
.knows ul{margin:0;padding-left:18px;font-size:14px;line-height:20px}
.knows.kf{padding:0 10px}.kf .kfh{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:44px;margin:0;padding:0;border:0;background:none;text-align:left;color:inherit;cursor:pointer}
.kf .kfh .eyebrow{margin:0}.kf .kfn{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--ink2)}.kf .kfn svg{width:16px;height:16px;transition:rotate .2s var(--ease)}
.kf .kfb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .2s var(--ease)}.kf .kfb>div{overflow:hidden;min-height:0}.kf .kfb ul{padding-bottom:8px}

@media (prefers-reduced-motion:reduce){.kf .kfn svg{transition:none}} /* the fold keeps its 200 ms size change (a real size change, never a jump) */
.errc{max-width:520px;margin:40px auto;padding:28px 24px 24px;text-align:center}
.errc>svg{width:28px;height:28px;color:var(--urgent-text);box-sizing:content-box;padding:14px;border-radius:50%;background:var(--urgent-bg);box-shadow:0 0 0 1px var(--urgent-border)}
.errc h2{font-size:20px;margin:8px 0 4px}
.errc p{color:var(--ink2);margin:0 auto 16px;max-width:400px}

/* small index card (saved for next plan, picker, swap) */
.ic{position:relative;display:flex;flex-direction:column;width:100%;padding:0 12px 4px;text-align:left;border-radius:4px;cursor:pointer;color:var(--ink);
  background:repeating-linear-gradient(to bottom,transparent 0 23px,var(--iblue) 23px 24px) 0 72px/100% calc(100% - 80px) no-repeat,var(--icard);
  box-shadow:0 -1px 3px rgba(40,26,8,.08),0 2px 5px rgba(40,26,8,.14),0 0 0 1px rgba(60,40,10,.12);transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.ic:hover{transform:translateY(-3px);box-shadow:0 -1px 3px rgba(40,26,8,.08),0 10px 20px rgba(40,26,8,.18),0 0 0 1px rgba(60,40,10,.14)}
.ic .ich{display:flex;align-items:center;gap:8px;min-height:44px;margin:0 -12px;padding:4px 12px 0;border-bottom:1px solid var(--ired-line)}
.ic .ich b{flex:1;min-width:0;font-size:15px;font-weight:600;line-height:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* r28 (panel 11 visual 2): a picker card's long name takes a second line beside Pick Again instead of being cut ("Chicken Tikka Mas…") */
.pgrid .ic .ich b{white-space:normal;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;padding:2px 0}
.ic .fav{color:#B5482F;flex:none}
.ic .fav svg{width:14px;height:14px;fill:currentColor;stroke:none}
/* C-058 card anatomy: the facts line runs the full width under the red line; photo left, source and tags beside it */
.ic .im{display:flex;align-items:center;gap:4px 12px;height:26px;font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden}
.ic .im>span{display:inline-flex;align-items:center;gap:3px}
.ic .icb{display:flex;gap:12px;padding-top:2px}
.ic .ix{flex:1;min-width:0;font-size:13px;line-height:24px;color:var(--ink2)}
.ic .ix>div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic .ix .src{color:var(--muted);font-size:12.5px}
.ic .hv{font-weight:600;color:var(--sage-text)}.ic .hv.lo{color:var(--amber-text)}
.ic .rt{color:var(--amber-text);font-weight:600}
.th{width:64px;height:48px;border-radius:4px;flex:none;box-shadow:inset 0 0 0 1px rgba(40,26,8,.2);margin-top:2px;
  background:radial-gradient(circle 3px at 38% 38%,#5F8F4A 0 2.5px,transparent 3px),radial-gradient(circle 3px at 60% 62%,#5F8F4A 0 2.5px,transparent 3px),
  radial-gradient(circle 22px at 50% 52%,var(--food) 0 13px,rgba(0,0,0,.16) 14px,#F4EEE3 15px 19px,#CFC2AA 20px 21px,transparent 22px),repeating-linear-gradient(45deg,#C9B79A 0 6px,#BCA684 6px 12px)}
.flg{flex:none;font-size:12px;font-weight:600;color:var(--ink2);background:var(--chip);border:1px solid transparent;border-radius:4px;padding:0 6px;line-height:17px;white-space:nowrap} /* r23 (panel 10 fit 7): the kit quiet chip; red is only the card's rule line */
.badge{flex:none;border-radius:4px;background:var(--sage-light);color:var(--sage-text);border:1px solid var(--sage-text);font-size:12px;font-weight:700;padding:1px 8px;display:inline-flex;align-items:center;gap:3px;line-height:18px}
.badge svg{width:12px;height:12px;stroke-width:3}
.badge.on{background:var(--sage-light);color:var(--sage-text);border:1px solid var(--sage-line)}
.ic.picked,.ic.picked:hover{transform:none;box-shadow:0 0 0 2px var(--sage-text),0 6px 14px rgba(40,26,8,.18)}
.ic.dim{opacity:.62}

/* ---------- recipe card picker: slides over the plan like the left page of the Recipes page ---------- */
.picker{position:absolute;left:0;right:0;top:0;bottom:0;z-index:30;display:flex;flex-direction:column;
  background:radial-gradient(rgba(63,94,59,.13) 1px,transparent 1.4px) 0 0/14px 14px,var(--endpaper);
  transform:translateX(0);transition:transform .28s var(--ease);box-shadow:-12px 0 32px rgba(40,26,8,.18);border-left:1px solid var(--tan-line)}
.picker.out{transform:translateX(104%);visibility:hidden;transition:transform .28s var(--ease),visibility 0s linear .28s}
.picker>.bar{flex:none;height:46px}
.pk-scroll{flex:1;overflow:auto;min-height:0}
.pk-in{max-width:1240px;margin:0 auto;padding:12px 16px 24px}
/* the search card copies C-058 (list buttons on top, red line, search + Filters, count) */
/* r9: the search card sits in a fixed header above the scrolling cards (C-058's .head + .dscroll), so no card edges peek around it */
.pk-head{flex:none;position:relative;z-index:5}
/* r29 (Tyler 26): the search card floats at the top of the scrolling cards (sticky), so the cards slide up UNDER it and are cut only by the tan bar */
.pk-scroll>.pk-head{position:sticky;top:0;pointer-events:none}.pk-scroll>.pk-head .c58s{pointer-events:auto}
.pk-scroll>.pk-head .pk-in{padding-top:12px}
@media (max-width:640px){.pk-scroll>.pk-head{pointer-events:auto;background:var(--endpaper);border-bottom:1px solid var(--tan-line);box-shadow:0 3px 8px rgba(40,26,8,.10)}.pk-scroll>.pk-head .pk-in{padding-bottom:10px}}
.pk-head .pk-in{padding-bottom:0}
.pk-scroll .pk-in{padding-top:12px}
/* r19 (panel 8 fit 2): the list tabs are C-058's folder tabs, joined to the top of the search card (C-058 .mtabs / .mtab / .tools) */
.scard{background:var(--icard);border:1px solid var(--tan-line);border-radius:0 8px 8px 8px;padding:10px 12px;box-shadow:0 2px 5px rgba(40,26,8,.08);position:relative;margin-bottom:0}
.mtabs{display:flex;gap:2px;padding:8px 6px 0;margin-top:-8px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;position:relative;z-index:1}
.mtabs.ovf{padding-right:32px;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent)}
.mtabs::-webkit-scrollbar{display:none}
.mtab{border:1px solid var(--tan-line);border-bottom:0;background:#EFE3CB;border-radius:8px 8px 0 0;padding:0 12px;height:36px;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;color:var(--ink2);white-space:nowrap;flex:none;position:relative;top:1px}
.mtab::after{content:"";position:absolute;inset:-8px 0 0}
.mtab:hover{color:var(--ink)}
.mtab small{color:var(--muted);font-weight:500}
.mtab.on{background:var(--icard);color:var(--ink);font-weight:700;z-index:2}.mtab.on small{color:var(--ink2)}
.srow{display:flex;gap:8px;align-items:center}
/* r19 (panel 8 fit 5): computer and iPad put Done · Add in the tan bar's main-button spot; the footer keeps the quiet "3 picked" line. Phone keeps its bottom bar */
.pk-foot .pkdone{display:none}
.srch{flex:1;display:flex;align-items:center;gap:8px;border:1px solid var(--ink2);border-radius:8px;background:var(--card);padding:0 12px;height:44px;min-width:0}
.srch input{border:0;outline:0;flex:1;font-size:15px;background:none;min-width:0}
.srch:focus-within{box-shadow:0 0 0 2px var(--sage-text)}
.srch svg{color:var(--muted)}
.fbtn{height:44px;border:1px solid var(--chip-warm-edge);background:var(--chip-warm);border-radius:8px;padding:0 14px;display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:500;color:var(--ink)}
.fbtn .n{background:var(--sage-light);color:var(--sage-text);font-weight:600;border-radius:4px;font-size:12px;padding:0 5px;line-height:18px}
.cnt{font-size:13px;color:var(--muted);white-space:nowrap}
.fchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.fchip{border:1px solid var(--sage-text);background:var(--chip-on);color:var(--ink);border-radius:8px;padding:0 10px;height:36px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px 16px}
.pgrid .ic{min-height:132px}
/* r24 (Tyler 17): the search card is C-058's (a shadow root from the shared block), wider than on the Recipes page */
.pk-head .pk-in{max-width:1240px} /* r27 (panel 11 fit 5): the search card is exactly the card grid's width */
.c58s{display:block;position:relative;z-index:5}
.pk-empty{padding:40px 10px;text-align:center;color:var(--ink2);font-size:15px}.pk-empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
/* r24 (Tyler 19): clicking a picker card opens its recipe; the quick button in the title row picks it (C-058's card quick action, .iacts / .ia) */
.ic .iacts{display:none;flex:none;align-items:center;gap:5px}
.ic .ia{position:relative;display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px;border-radius:8px;border:1px solid var(--sage-text);background:var(--card);color:var(--sage-text);font-size:13px;font-weight:600;line-height:1;white-space:nowrap}
.ic .ia::after{content:"";position:absolute;left:-4px;right:-4px;top:50%;height:44px;translate:0 -50%}
.ic .ia:hover{background:var(--sage-light)}
.ic .ia.on{background:var(--sage-light);border-color:var(--sage-line);color:var(--sage-dark)}
.ic .ia svg{width:13px;height:13px;stroke-width:3}
.ic:hover .iacts,.ic:focus-visible .iacts,.ic:focus-within .iacts,.ic.picked .iacts,html.dev-ipad .ic .iacts,html.dev-phone .ic .iacts,.pgrid.one .ic .iacts{display:flex} /* r27 (panel 11 visual 4): picking one card shows Pick on every card */
.ic:hover .flg,.ic:focus-within .flg{display:none}
.ic .ia.pop{animation:pkpop .32s cubic-bezier(.2,.7,.2,1)}
@keyframes pkpop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
.ic[hidden]{display:none}
.ic:focus-visible{outline:2px solid var(--sage-text);outline-offset:2px}
/* r24 (Tyler 18, mockup switch): Scattered: the same cards tossed down by hand, a little crooked, every name and fact still clear; the card under the mouse straightens and lifts */
.pgrid.scatter{gap:30px 26px;padding:10px 8px 4px}
.pgrid.scatter .ic{rotate:calc(var(--j,0) * 1.8deg);translate:calc(var(--dx,0) * 8px) calc(var(--pk,0) * 12px - 6px);transition:transform .2s var(--ease),box-shadow .2s var(--ease),rotate .2s var(--ease)}
.pgrid.scatter .ic:hover,.pgrid.scatter .ic:focus-within{rotate:0deg;z-index:3}
@media (max-width:640px){.pgrid.scatter{padding:10px 16px 4px}.pgrid.scatter .ic{rotate:calc(var(--j,0) * 1.2deg);translate:calc(var(--dx,0) * 3px) calc(var(--pk,0) * 10px - 5px)}} /* r26: one column on phone: a smaller nudge, so no card runs off the edge */
.pkmock{display:flex;align-items:center;gap:6px;margin:0 0 12px;font-size:12px;color:#E9E4DA;background:#2A2A28;border-radius:8px;padding:4px 6px 4px 10px;width:max-content;max-width:100%}
.pkmock b{font-weight:600;color:#fff}
.pkmock button{height:28px;padding:0 10px;border-radius:6px;color:#E9E4DA;font-size:12px}.pkmock button.on{background:#5A6E54;color:#fff;font-weight:600}
/* r24 (Tyler 3): the recipe card host (the card is C-058's, in a shadow root): Plan's faded scrim and the layer it sits in */
.rbk{position:fixed;inset:0;z-index:95;pointer-events:none}
.rbk.open{pointer-events:auto}
.rbk-scrim{position:absolute;inset:0;background:rgba(24,16,8,.52);opacity:0;transition:opacity .2s var(--ease)}
.rbk.open .rbk-scrim{opacity:1}
.rbkhost{position:absolute;inset:0;pointer-events:none;display:block}
.rbk:not(.open):not(.closing) .rbkhost{visibility:hidden}
@media (prefers-reduced-motion:reduce){.pgrid.scatter .ic{transition:none}.ic .ia.pop{animation:none}}
.pk-foot{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--card);border-top:1px solid var(--tan-line);box-shadow:0 -6px 16px rgba(40,26,8,.08)}
.pk-foot .pk-in2{display:flex;align-items:center;gap:12px;max-width:1240px;width:100%;margin:0 auto}
.pk-foot .names{flex:1;min-width:0;font-size:14px;color:var(--ink2);line-height:19px}
.pk-foot .names b{color:var(--ink)}
.fpop{position:absolute;right:12px;top:calc(100% + 6px);width:420px;max-width:calc(100% - 24px);max-height:60vh;overflow-y:auto;background:var(--card);border:1px solid var(--bcard);border-radius:12px;box-shadow:var(--shadow-pop);z-index:10;animation:pop .2s var(--ease)}
.fpop .fph{display:flex;align-items:center;gap:8px;padding:10px 6px 8px 14px;border-bottom:1px solid var(--ired-line)}
.fpop .fph b{flex:1}
.fpop .fg{padding:10px 14px 4px}
.fpop .fgh{font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.fpop .fgc{display:flex;flex-wrap:wrap;gap:8px}
.fpop .fchip{background:var(--chip);color:var(--ink);border-color:transparent;height:44px;font-weight:500}
.fpop .fchip.on{background:var(--chip-on);color:var(--ink);border-color:var(--sage-text);font-weight:700}
.fchip{position:relative}.fchips .fchip::after{content:"";position:absolute;inset:-4px 0}
.fchip small{font-size:12px;opacity:.75}
.fchips .fchip svg{width:14px;height:14px}
.fpop .fpf{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--tan-line);margin-top:10px;background:var(--card);border-radius:0 0 12px 12px}
.fpop .fpf span{flex:1;font-size:13px;color:var(--muted)}

/* ---------- swap: index cards in Claude's place ---------- */
.swap{display:flex;flex-direction:column;min-height:0;background:var(--endpaper);border:1px solid var(--tan-line);border-radius:12px;overflow:hidden;
  background-image:radial-gradient(rgba(63,94,59,.13) 1px,transparent 1.4px);background-size:14px 14px}.swap.nw{animation:fade .2s var(--ease)}
.swap .sh{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 16px;min-height:56px;background:var(--card);border-bottom:1px solid var(--tan-line)}
.swap .sh b{flex:1;font-size:15px}.swap .sh small{display:block;font-weight:400;font-size:13px;color:var(--ink2)}
.swap .list{flex:1;overflow:auto;padding:12px 12px 16px;display:flex;flex-direction:column;gap:12px}
.swap .list .srch{flex:none;height:44px}
.swap .why{font-size:13px;color:var(--sage-text);line-height:18px;padding:4px 0 2px;border-bottom:1px solid var(--iblue)}
.swap .lab{font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:4px 2px -4px}

/* ---------- popover and dialog (kit) ---------- */
.menu{position:fixed;background:var(--card);border:1px solid var(--bcard);border-radius:12px;box-shadow:var(--shadow-pop);z-index:50;min-width:240px;display:none}
.menu.open{display:block;animation:pop .2s var(--ease)}
.menu.closing{display:block;animation:fadeout .16s var(--ease) forwards;pointer-events:none}
.leaving{animation:fadeout .2s var(--ease) forwards;pointer-events:none}
.menu .mi{padding:12px;overflow:auto;max-height:var(--mh,70vh);border-radius:12px;background:var(--card)}
.menu .mhd{padding:0 12px 9px;border-bottom:1px solid var(--brow);margin:0 -12px 4px}
.menu:not(.assheet) .mclose{display:none}
.menu .mhd.one{display:flex;align-items:baseline;flex-wrap:wrap;column-gap:8px}.menu .mhd.one small{display:inline}

.desk-hint{position:absolute;left:14px;top:34px;bottom:14px;width:calc(50% - 26px);display:flex;align-items:center;justify-content:center;color:var(--muted);font-style:italic;font-size:14px;z-index:1}
.narrow .desk-hint{display:none}
/* ---------- deck (left half) ---------- */
.deck{position:absolute;top:34px;bottom:14px;left:14px;width:calc(50% - 26px);z-index:6;display:flex;flex-direction:column;padding:0}
.narrow .deck{inset:0;width:auto;padding:0;background:var(--page)}
/* the search panel floats on the inside of the cover: even gaps left, right and top */
.head{margin:24px 24px 0;flex:none;position:relative;z-index:3}
.narrow .head{margin:0}
.head:has(.fpop.show){z-index:60}
.wide .head{margin-top:34px}
.narrow .srow{flex-wrap:wrap}.narrow .srow .srch{flex:1 1 100%}.narrow .srow .fbtn,.narrow .srow .addbtn{flex:1;justify-content:center}
.deck.closed{visibility:hidden}
.mtabs{display:flex;gap:2px;padding:0 6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.mtab{border:1px solid var(--tan-line);border-bottom:0;background:#EFE3CB;border-radius:8px 8px 0 0;padding:6px 12px 5px;font-size:13.5px;font-weight:500;color:var(--ink2);cursor:pointer;white-space:nowrap;position:relative;top:1px}
.mtab.on{background:var(--icard);font-weight:700;color:var(--ink);z-index:2}
.mtab small{color:var(--muted);font-weight:500;margin-left:4px}
.tools{background:var(--icard);border:1px solid var(--tan-line);border-radius:0 6px 6px 6px;padding:8px 10px;display:flex;flex-direction:column;gap:7px;box-shadow:0 2px 5px rgba(40,26,8,.08)}
.narrow .tools{border-radius:0;border-left:0;border-right:0}
.narrow .mtabs{padding:8px 10px 0;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent)}
.srch{display:flex;align-items:center;gap:8px;border:1px solid var(--tan-line);border-radius:8px;background:#fff;padding:6px 10px}
.srch input{border:0;outline:0;flex:1;font:inherit;font-size:14px;background:none;min-width:0}
.srch .x{border:0;background:none;cursor:pointer;color:var(--muted);font-size:15px;display:none}
.srch.has .x{display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--tan-line);background:#fff;border-radius:6px;padding:3px 9px;font-size:13px;cursor:pointer;color:var(--ink2)}
.chip.on{background:var(--sage-light);border-color:var(--sage-line);color:var(--sage);font-weight:600}
.chip.on i{font-style:normal;margin-left:6px;opacity:.7}
.chips:not(.has) .cnt{margin-left:0}
.narrow .chips:not(.has) .cnt{display:none}
.chips .clr{border:0;background:none;color:var(--sage-mid);font-size:12.5px;font-weight:600;cursor:pointer;text-decoration:underline;padding:0 2px}
.cnt{font-size:12.5px;color:var(--muted);margin-left:auto;align-self:center}
.dscroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:16px 36px 40px 24px}
.wide .dscroll{margin:-34px 10px 0 10px;padding:52px 26px 44px 14px;scrollbar-width:thin;
 -webkit-mask-image:linear-gradient(to bottom,transparent 0,transparent 22px,#000 64px,#000 calc(100% - 14px),transparent);
 mask-image:linear-gradient(to bottom,transparent 0,transparent 22px,#000 64px,#000 calc(100% - 14px),transparent)}
.narrow .dscroll{padding:0 0 20px}
.empty{padding:30px 10px;color:var(--muted);font-style:italic;text-align:center}
/* index cards */
.ic{--tilt:calc(var(--t0,0) * 1deg);position:relative;display:flex;flex-direction:column;justify-content:flex-start;width:100%;height:148px;padding:0 14px;text-align:left;border:0;border-radius:4px;cursor:pointer;color:var(--ink);
  background:repeating-linear-gradient(to bottom,transparent 0 21px,var(--iblue) 21px 22px) 0 58px/100% 90px no-repeat,var(--icard);
  box-shadow:0 -1px 3px rgba(40,26,8,.10),0 2px 5px rgba(40,26,8,.16),0 0 0 1px rgba(60,40,10,.12);
  rotate:var(--tilt);transition:translate calc(.22s * var(--k)) cubic-bezier(.2,.7,.2,1),box-shadow calc(.22s * var(--k))}
.ic+.ic{margin-top:-98px}
.ich{display:flex;align-items:center;gap:8px;height:46px;margin:0 -14px;padding:4px 14px 0;border-bottom:1.5px solid var(--ired)}
.ich b{flex:1;min-width:0;font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ich .fav{color:#B5482F;font-size:14px}
.badge{display:none;border-radius:5px;background:var(--sage-light);color:var(--sage);border:1px solid var(--sage-line);font-size:12px;font-weight:700;padding:1px 10px;flex:none}
.ic.open .badge{display:inline-block}
.icb{display:flex;gap:12px;padding:10px 0 0}
.th{width:84px;height:68px;border-radius:4px;flex:none;box-shadow:inset 0 0 0 1px rgba(40,26,8,.2);
  background:radial-gradient(circle 3px at 38% 38%,#5F8F4A 0 2.5px,transparent 3px),radial-gradient(circle 3px at 60% 62%,#5F8F4A 0 2.5px,transparent 3px),radial-gradient(circle 3px at 55% 36%,#F2E6C8 0 2px,transparent 2.6px),
  radial-gradient(circle 31px at 50% 52%,var(--food) 0 18px,rgba(0,0,0,.16) 19px,#F4EEE3 20px 27px,#CFC2AA 28px 29px,transparent 30px),repeating-linear-gradient(45deg,#C9B79A 0 6px,#BCA684 6px 12px)}
.ix{flex:1;min-width:0;font-size:13.5px;line-height:22px;color:var(--ink2)}
.ix .hv{font-weight:600;color:var(--sage-mid)}
.ix .hv.lo{color:var(--amber)}
.ic.open{translate:0 -6px;border-left:4px solid #1F3A1C}
.ic.lift{translate:26px 0;z-index:40!important;animation:jig calc(.25s * var(--k)) ease-out;box-shadow:0 10px 22px rgba(40,26,8,.28),0 2px 5px rgba(40,26,8,.18),0 0 0 1px rgba(60,40,10,.14)}
@keyframes jig{0%{rotate:var(--tilt)}25%{rotate:-3deg}55%{rotate:2.5deg}80%{rotate:-1deg}100%{rotate:var(--tilt)}}
/* meta line under the title */
.im{display:flex;gap:6px 14px;align-items:center;height:26px;font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden}
.im .hv{font-weight:600;color:var(--sage-mid)}.im .hv.lo{color:var(--amber)}
.ix .src{font-size:12px;color:var(--muted)}
/* ---------- card pile looks (computer and iPad sideways) ---------- */
/* every look: paper face lit from the top, a thin paper edge, and a soft shadow each card throws onto the card behind it */
.wide[class*=pile] .ic{height:150px;
  background:linear-gradient(to bottom,rgba(255,255,255,.7),rgba(255,255,255,0) 40px),
   repeating-linear-gradient(to bottom,transparent 0 23px,var(--iblue) 23px 24px) 0 48px/100% calc(100% - 48px) no-repeat,var(--icard);
  box-shadow:0 -3px 7px -2px rgba(40,26,8,.22),0 4px 8px -2px rgba(40,26,8,.18),0 1px 0 #EDE4D0,0 2px 0 rgba(90,64,24,.22),0 0 0 1px rgba(60,40,10,.13)}
.wide[class*=pile] .icb{padding-top:6px}
.wide[class*=pile] .th{width:64px;height:48px}
.wide[class*=pile] .ix{font-size:13px;line-height:24px}
.wide[class*=pile] .ic.lift{box-shadow:0 -3px 9px -2px rgba(40,26,8,.24),0 14px 26px rgba(40,26,8,.30),0 1px 0 #EDE4D0,0 2px 0 rgba(90,64,24,.22),0 0 0 1px rgba(60,40,10,.15)}
/* A. neat stack: square to the page, each card shows its name and one line of facts */
.wide.pileA .ic{--tilt:calc(var(--j) * .5deg);width:96%;margin-left:calc(2% + var(--dx) * 4px)}
.wide.pileA .ic+.ic{margin-top:-64px}
/* B. loose pile: tossed in by hand, a little crooked and off-line, still every name and fact line clear */
.wide.pileB .ic{--tilt:calc(var(--j) * 1.4deg);width:88%;margin-left:calc(6% + var(--dx) * 18px)}
.wide.pileB .ic+.ic{margin-top:calc(-60px + var(--pk) * -6px)}
.wide.pileB .ic.lift{translate:18px -4px}
/* in a stack only the top card's photo shows; covered photos never poke out at the side */
.wide.pileA .ic:not(:last-child):not(.lift) .th,.wide.pileB .ic:not(:last-child):not(.lift) .th{visibility:hidden}
/* C. two across: cards spread out two by two, the right row set a little lower, each one showing its whole face */
.wide.pileC .dscroll{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:12px;align-content:start}
.wide.pileC .addcard{grid-column:1/-1}
.wide.pileC .ic{--tilt:calc(var(--j) * 2deg);height:176px;margin:0 0 -30px!important;padding:0 12px}
.wide.pileC .ic[data-i="1"]{top:46px}
.wide.pileC .ich{height:auto;min-height:46px;margin:0 -12px;padding:6px 12px 4px}
.wide.pileC .ich b{white-space:normal;line-height:19px;font-size:15px}
.wide.pileC .im{gap:4px 10px;flex-wrap:wrap;height:auto;line-height:24px}
.wide.pileC .im .hv{display:none}
.wide.pileC .th{display:none}
.wide.pileC .ic.lift{translate:0 -10px}
.wide.pileC .ic.open{translate:0 -4px}
/* D. recipe box: cards stand square like in a file box, each with a colored tab on its top edge, set at a different spot so every tab shows */
.wide.pileD .ic{--tilt:0deg;width:94%;margin-left:3%;overflow:visible}
.wide.pileD .ic+.ic{margin-top:-62px}
.wide.pileD .dscroll{padding-top:66px}
.wide.pileD .ic::before{content:attr(data-t);position:absolute;top:-19px;height:20px;padding:0 10px;font-size:11px;font-weight:600;line-height:21px;color:#3D2A10;border-radius:6px 6px 0 0;box-shadow:0 -1px 3px rgba(40,26,8,.18),0 0 0 1px rgba(60,40,10,.12);right:4%;background:#C8D8B4}
.wide.pileD .ic[data-q="1"]::before{right:17%}
.wide.pileD .ic[data-k=chicken]::before{background:#F0D49A}.wide.pileD .ic[data-k=veg]::before{background:#C8D8B4}.wide.pileD .ic[data-k=freeze]::before{background:#B8CDE0}.wide.pileD .ic[data-k=u30]::before{background:#E8B4A4}
.wide.pileD .ic[data-q="2"]::before{right:30%}
.wide.pileD .ic[data-q="3"]::before{right:10%}
.wide.pileD .ic:not(:last-child):not(.lift) .th{visibility:hidden}
.wide.pileA .ic:not(:last-child):not(.lift) .ix,.wide.pileB .ic:not(:last-child):not(.lift) .ix,.wide.pileD .ic:not(:last-child):not(.lift) .ix{visibility:hidden}
.wide.pileD .ic.lift{translate:0 -22px}
.wide.pileA .ic.lift+.ic,.wide.pileB .ic.lift+.ic{translate:0 14px;transition:translate .2s}
.narrow .ic .im{font-size:12.5px;color:#6B5A44;height:22px}
/* narrow: a plain list */
.narrow .ic{rotate:0deg;height:auto;margin:0!important;border-radius:0;background:var(--card);box-shadow:none;border-bottom:1px solid var(--border);padding:10px 14px;display:flex;gap:12px;align-items:center;translate:none!important;animation:none}
.narrow .ic .ich{display:contents}
.narrow .ic .icb{display:contents}
.narrow .ic .th{width:56px;height:48px;order:-1}
.narrow .ic .ix{order:3;flex:none;font-size:13px;text-align:right;line-height:18px}
.narrow .ic .ix .ab{display:none}
.narrow .ic .ich b{order:2;white-space:normal}
.narrow .ic .badge,.narrow .ic .fav{display:none}
/* ---------- recipe pane (right half) ---------- */
.pane{position:absolute;top:34px;bottom:14px;right:14px;width:calc(50% - 26px);z-index:7;container-type:inline-size}
.narrow .pane{inset:0;width:auto;transform:translateX(100%);transition:transform calc(.26s * var(--k)) cubic-bezier(.2,.7,.2,1);background:var(--page);z-index:9;box-shadow:-8px 0 20px rgba(0,0,0,.12)}
.narrow .pane.show{transform:none}
.pane.closed{visibility:hidden}
.rcard{position:absolute;inset:0;border-radius:6px;overflow:hidden;background:var(--icard);
  box-shadow:0 1px 2px rgba(40,26,8,.10),0 8px 26px rgba(40,26,8,.16),0 0 0 1px rgba(60,40,10,.12)}
.narrow .rcard{border-radius:0;box-shadow:none;inset:0}
.rscroll{position:absolute;inset:0;overflow-y:auto;padding:0 34px 60px 26px;scroll-behavior:smooth;scrollbar-width:thin;background:var(--icard)}
.narrow .rscroll{padding:0 22px 60px 16px}
.rcard.swap .rscroll{animation:swap calc(.26s * var(--k)) cubic-bezier(.2,.7,.2,1) both}
@keyframes swap{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* header */
.rh{height:112px;display:flex;gap:16px;align-items:flex-end;padding:14px 0 12px}
.rh{position:relative}
.rh .ph{width:118px;height:84px;flex:none;border-radius:2px;rotate:-2deg;margin:0 6px 2px 4px;position:relative;
  box-shadow:0 0 0 5px #fff,0 0 0 6px rgba(60,40,10,.14),0 4px 10px 4px rgba(40,26,8,.16)}
.rh .ph::after{content:"";position:absolute;top:-12px;left:50%;width:46px;height:16px;translate:-50% 0;rotate:3deg;background:rgba(236,226,190,.82);box-shadow:0 1px 2px rgba(40,26,8,.12)}
.narrow .rh .ph{width:84px;height:62px}
.photoB .rh .ph{display:none}
.rh h2{font-family:Fraunces,serif;font-weight:600;font-size:26px;line-height:1.1;margin:0}
.narrow .rh h2{font-size:22px}
.rh .by{font-size:13px;color:var(--muted);margin-top:4px}
.rh .by a{color:var(--sage-mid)}
.jump{position:sticky;top:0;z-index:3;background:var(--icard);display:flex;gap:4px;flex-wrap:wrap;padding:8px 0 7px;border-bottom:1px solid var(--border);margin:0 -4px}
.jump button{border:0;background:none;padding:3px 8px;border-radius:6px;font-size:13px;color:var(--sage-mid);font-weight:600;cursor:pointer}
.jump button:hover{background:var(--sage-light)}
.facts{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;color:var(--ink2);padding:12px 0 2px}
.facts b{color:var(--ink)}
.hist{font-size:13.5px;color:var(--muted);padding:4px 0}
.hist .st{color:#B07D1A;display:inline-flex;vertical-align:baseline}
.hist .st button{border:0;background:none;padding:0 1px;color:inherit;font-size:15px;line-height:1;cursor:pointer;transition:transform .12s}
.hist .st button:hover{transform:scale(1.2)}
.ract{display:flex;gap:8px;flex-wrap:wrap;padding:8px 0}
.pill{border:1px solid var(--tan-line);background:#fff;border-radius:6px;padding:4px 12px;font-size:13px;cursor:pointer}
.pill.on{background:#FBE3DC;border-color:#E3A896;color:#8F2F1C}
.marks{display:flex;gap:6px;flex-wrap:wrap;padding:4px 0 8px}
.mk{font-size:12.5px;border-radius:4px;padding:2px 8px;background:var(--sage-light);color:var(--sage);border:1px solid var(--sage-line)}
.mk.t{background:#F1EADC;color:var(--ink2);border-color:var(--tan-line)}
.sec{padding:14px 0 6px;border-top:1px dashed rgba(0,0,0,.12);margin-top:6px}
.sec h3{font-family:Fraunces,serif;font-weight:600;font-size:18px;margin:0 0 8px;display:flex;align-items:center;gap:10px}
.sec p{margin:0 0 6px;font-size:14.5px;line-height:1.55;color:var(--ink2)}
.yn{background:#FFF8D6;border:1px solid #EBDD9A;border-radius:4px;padding:8px 10px;font-size:14px;color:var(--ink2);font-style:italic}
/* ingredients + steps */
.two{display:grid;grid-template-columns:1fr;gap:0 28px}
@container (min-width:600px){.rcard.xp .two{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr)}.rcard.xp .two .sec.stp{border-top:1px dashed rgba(0,0,0,.12)}}
.srv{display:inline-flex;align-items:center;border:1px solid var(--tan-line);border-radius:8px;overflow:hidden;margin-left:auto;font-family:"IBM Plex Sans";font-size:14px;font-weight:500}
.srv button{border:0;background:#fff;width:30px;height:28px;cursor:pointer;font-size:16px}
.srv span{padding:0 10px;background:#fff;border-left:1px solid var(--tan-line);border-right:1px solid var(--tan-line);line-height:28px}
.onhand{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;background:var(--sage-light);border:1px solid var(--sage-line);border-radius:6px;padding:7px 10px;font-size:13.5px;margin-bottom:8px}
.onhand button{border:0;background:none;color:var(--sage);font-weight:700;cursor:pointer;padding:0;text-decoration:underline}
.grp{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:10px 0 4px}
.ing{display:flex;gap:8px;align-items:baseline;font-size:14.5px;padding:4px 0;border-bottom:1px solid rgba(80,120,170,.12)}
.ing .q{min-width:62px;font-weight:600;color:var(--ink)}
.ing .n{flex:1;color:var(--ink2)}
.ing .ok{color:var(--sage-mid);font-size:13px}
.ing .short{color:var(--amber);font-size:12.5px;font-weight:600;background:var(--amber-light);border-radius:4px;padding:0 6px}
.ing .sw,.ing .sub{border:0;background:none;color:var(--sage-mid);font-size:12.5px;font-weight:600;cursor:pointer;padding:0;text-decoration:underline}
.ing .sub{font-size:14.5px}
.stphd{font-size:13px;color:var(--muted);margin:-2px 0 8px}
.stp ol{margin:0;padding:0;list-style:none;counter-reset:s}
.stp li{counter-increment:s;position:relative;padding:6px 0 10px 36px;font-size:14.5px;line-height:1.55;color:var(--ink2)}
.stp li::before{content:counter(s);position:absolute;left:0;top:6px;width:24px;height:24px;border-radius:50%;background:var(--tan);color:var(--ink);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.stp li b{color:var(--ink)}
.tmr{border:1px solid var(--sage-line);background:#fff;color:var(--sage);border-radius:999px;font-size:12.5px;font-weight:600;padding:1px 9px;cursor:pointer;margin-left:4px;white-space:nowrap}
.tmr.run{background:var(--sage);color:#fff}
/* folds */
.fold{border-top:1px dashed rgba(0,0,0,.12);margin-top:6px}
.fh{width:100%;display:flex;align-items:center;gap:10px;border:0;background:none;padding:12px 0;cursor:pointer;text-align:left}
.fh h3{font-family:Fraunces,serif;font-weight:600;font-size:17px;margin:0}
.fh .sm{font-size:13px;color:var(--muted)}
.fh .chev{margin-left:auto;transition:rotate calc(.24s * var(--k)) ease;color:var(--muted)}
.fold.open .chev{rotate:180deg}
.fb{display:grid;grid-template-rows:0fr;transition:grid-template-rows calc(.24s * var(--k)) cubic-bezier(.2,.7,.2,1)}
.fold.open .fb{grid-template-rows:1fr}
.fi{overflow:hidden;font-size:14.5px;line-height:1.55;color:var(--ink2)}
.fi>div{padding:0 0 12px}
.fi ul{margin:0;padding-left:20px}
/* scroll-bar marks */
.marksbar{display:none}
.tick{position:absolute;right:2px;width:12px;height:4px;border-radius:2px;background:var(--tan-line);cursor:pointer;transition:background .15s,width .15s}
.tick:hover{background:var(--sage-mid);width:16px}
.tick .lb{position:absolute;right:22px;top:50%;translate:6px -50%;opacity:0;pointer-events:none;white-space:nowrap;background:var(--sage);color:#fff;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:6px;transition:opacity calc(.16s * var(--k)),translate calc(.16s * var(--k))}
.tick:hover .lb{opacity:1;translate:0 -50%}
/* binder page (sub-recipe) */
.binder{position:absolute;inset:0;z-index:8;transform:translateX(105%);transition:transform calc(.28s * var(--k)) cubic-bezier(.2,.7,.2,1);pointer-events:none}
.binder.show{transform:none;pointer-events:auto}
.binder .rcard{box-shadow:-10px 0 24px rgba(40,26,8,.22),0 0 0 1px rgba(60,40,10,.12)}
.bback{border:0;background:none;color:var(--sage-mid);font-weight:600;font-size:13.5px;cursor:pointer;padding:12px 0 0}
/* menu, drawer, toast */
.menu{position:absolute;right:10px;top:96px;z-index:40;background:#FFFDF7;border:1px solid #D2BE98;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);min-width:220px;padding:6px;opacity:0;translate:0 -6px;pointer-events:none;transition:opacity calc(.16s * var(--k)),translate calc(.16s * var(--k))}
.menu.show{opacity:1;translate:0 0;pointer-events:auto}
.menu button{display:flex;width:100%;border:0;background:none;padding:9px 12px;border-radius:7px;font-size:14.5px;cursor:pointer;text-align:left;gap:8px}
.menu button:hover{background:var(--sage-light)}
/* Coming Later: a feature we know about but have not built. Shown so you know it is coming; it does nothing yet. */
.menu button.later{color:#9A9184;cursor:default;align-items:center}
.menu button.later:hover{background:none}
.cl{margin-left:auto;font-size:11px;font-weight:600;color:#6B5B40;border:1px dashed #B89F72;border-radius:6px;padding:1px 8px;line-height:16px;white-space:nowrap;background:#FBF6EC}
.menu .mh{font-size:12px;color:var(--muted);padding:6px 12px 2px;text-transform:uppercase;letter-spacing:.06em}
.menu hr{border:0;border-top:1px solid var(--border);margin:4px 6px}
.menu .only-phone{display:none}
.phone .menu .only-phone{display:flex}
.scrim{position:absolute;inset:0;z-index:35;background:rgba(30,20,10,.22);opacity:0;pointer-events:none;transition:opacity calc(.2s * var(--k))}
.scrim.show{opacity:1;pointer-events:auto}

/* ================= OPTIONS (switch them in the top bar) ================= */

.srow{display:flex;gap:8px;align-items:center}.srow .srch{flex:1;min-width:0}

/* --- Search panel --- */
.wide .head .tools{box-shadow:0 4px 14px rgba(40,26,8,.18),0 1px 3px rgba(40,26,8,.12)}
/* A: floating panel, even endpaper around it (Tyler's way) */
/* B: one header card pinned on top, tabs inside it */
.wide.srchB .head{background:var(--icard);border-radius:4px;padding:12px 12px 10px;rotate:-.5deg;
  box-shadow:0 5px 14px rgba(40,26,8,.2),0 1px 3px rgba(40,26,8,.14),0 0 0 1px rgba(60,40,10,.12)}
.wide.srchB .head::before,.wide.srchB .head::after{content:"";position:absolute;top:-9px;width:64px;height:20px;background:rgba(236,224,190,.78);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.wide.srchB .head::before{left:18px;rotate:-4deg}.wide.srchB .head::after{right:18px;rotate:3deg}
.wide.srchB .mtabs{padding:0 0 10px;border-bottom:1.5px solid var(--ired);margin-bottom:10px;gap:5px;flex-wrap:wrap}
.wide.srchB .mtab{border:0;background:none;border-radius:999px;padding:4px 11px;top:0}
.wide.srchB .mtab.on{background:var(--sage);color:#fff}.wide.srchB .mtab.on small{color:#D9E6D6}
.wide.srchB .tools{border:0;box-shadow:none;padding:0;background:none}
/* C: slim: tabs + one search line, filters tucked behind a button */
/* one row, one height: search, Filters, Add a recipe are all 34px */
.srow .srch,.srow .fbtn,.srow .addbtn{height:34px;box-sizing:border-box;border-radius:8px}
.srow .srch{padding:0 10px}
#picker .srow .srch,#picker .srow .fbtn,#dev.c58search .srow .srch,#dev.c58search .srow .fbtn{height:44px;border-radius:8px}#picker .srow .fbtn,#dev.c58search .srow .fbtn{font-size:15px}#picker .srow .srch input,#dev.c58search .srow .srch input{font-size:16px} /* r51 (agy20b #6): #picker is outside this shadow root */ /* r43 (consistency 5): kit sizes */
.fbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--tan-line);background:#fff;padding:0 12px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink2);white-space:nowrap}
.fbtn svg{width:15px;height:15px}
.fbtn .fc{display:none;min-width:18px;height:18px;border-radius:9px;background:var(--sage);color:#fff;font-size:11.5px;line-height:18px;text-align:center;padding:0 5px;box-sizing:border-box}
.fbtn.on{border-color:var(--sage-line);color:var(--sage)}.fbtn.on .fc{display:inline-block}
.fbtn.open{background:var(--sage-light);border-color:var(--sage-line);color:var(--sage)}
/* the filter popup: floats over the cards, never pushes them down */
.fpop{display:none;position:absolute;top:calc(100% + 8px);left:0;right:0;z-index:40;background:#FFFDF7;border:1px solid var(--tan-line);border-radius:10px;
  box-shadow:0 14px 34px rgba(40,26,8,.26),0 2px 6px rgba(40,26,8,.14);flex-direction:column;max-height:min(440px,52vh);overflow:auto;rotate:0deg}
.wide.srchB .fpop{left:0;right:0}
.fpop.show{display:flex;animation:fpopIn calc(.16s * var(--k)) cubic-bezier(.2,.7,.2,1)}
@keyframes fpopIn{from{opacity:0;transform:translateY(-8px) scale(.985)}to{opacity:1;transform:none}}
.fph{display:flex;align-items:center;gap:10px;padding:12px 14px 10px;border-bottom:1.5px solid var(--ired)}
.fph b{font-size:15px;flex:1}
.fph button{border:0;background:none;cursor:pointer;color:var(--sage-mid);font-weight:600;font-size:13px}
.fph .fx{color:var(--muted);font-size:16px;padding:0 2px}
.fpb{overflow-y:auto;padding:4px 14px 8px;flex:1;min-height:0}
.fg{padding:9px 0 3px}
.fgh{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.fgc{display:flex;flex-wrap:wrap;gap:6px}
.fchip{border:1px solid var(--tan-line);background:#fff;border-radius:6px;padding:5px 10px;font:inherit;font-size:13.5px;cursor:pointer;color:var(--ink2);display:inline-flex;align-items:center;gap:6px}
.fchip small{color:var(--muted);font-size:11.5px}
.fchip:hover{border-color:var(--sage-line)}
.fchip.on{background:var(--sage);border-color:var(--sage);color:#fff}.fchip.on small{color:#D9E6D6}
.fchip.none{opacity:.45}
.fpf{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--tan-line);background:#FBF6EA}
.fpf span{flex:1;font-size:12.5px;color:var(--muted)}
.fpf .fshow{border:0;background:var(--sage);color:#fff;border-radius:8px;height:34px;padding:0 16px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.narrow .fpop{left:8px;right:8px;max-height:480px;rotate:0deg}
/* the old folder tabs (FolderDrawer), standing up off the top of the left page */
.ftabs{display:none}
.wide .ftabs{display:flex;position:absolute;top:-20px;left:30px;right:24px;height:33px;z-index:4;align-items:flex-end;pointer-events:none}
.ftab{pointer-events:auto;position:relative;height:32px;border:0;background:none;padding:2px 17px 0;margin-right:-6px;font:inherit;font-size:13.5px;font-weight:500;color:var(--ink2);cursor:pointer;white-space:nowrap;display:flex;align-items:center}
.ftab svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.ftab span{position:relative}

.ftab{transition:transform calc(.12s * var(--k))}
/* Tyler 11-23: no folder tabs. The list buttons sit at the top of the pinned search card (option B), on every device */

.wide.srchB .mtab,.narrow .mtab{border:1px solid var(--tan-line);background:#fff;border-radius:6px;padding:0 11px;height:30px;top:0;display:inline-flex;align-items:center;font-size:13.5px}

.addcard{display:none}
.addC .addcard{display:flex}

  align-items:center;gap:12px;padding:0 16px;cursor:pointer;color:var(--sage);text-align:left;rotate:.4deg}

.phone.addB .menu [data-m="add"]{display:flex}

.flg{flex:none;font-size:11px;font-weight:700;color:#8F2F1C;background:#FBE3DC;border:1px solid #E3A896;border-radius:4px;padding:0 6px;line-height:17px;white-space:nowrap}
.narrow .ic .flg{display:inline-block;margin-left:6px;vertical-align:1px}
.flagline{display:flex;align-items:center;gap:8px;font-size:13.5px;color:#8F2F1C}

.flagbtn{display:none;border:1px solid var(--sage-line);background:rgba(255,255,255,.5);width:32px;height:32px;box-sizing:border-box;padding:0;border-radius:8px;cursor:pointer;font-size:15px;color:var(--sage)}

.pmenu{position:absolute;top:44px;z-index:41;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);min-width:230px;padding:6px;display:none}
