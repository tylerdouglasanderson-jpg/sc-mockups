/* --- Behind the recipe card (wide): the inside of the back cover, wood edge + the same fabric endpaper as the left --- */
.wide .pane{background-color:#8B5A2B;background-image:var(--woodbg);border-radius:4px 12px 12px 4px;box-shadow:inset 14px 0 16px -10px rgba(0,0,0,.5),inset 0 0 0 1px rgba(40,20,4,.35),inset 0 -3px 0 rgba(40,20,4,.35),inset -3px 0 0 rgba(40,20,4,.28),0 18px 30px -12px rgba(30,20,8,.45),0 4px 10px rgba(40,26,8,.2)}
.wide .pane::before{content:"";position:absolute;inset:12px;border-radius:3px;
  background:radial-gradient(circle,var(--endink) 0 1.4px,transparent 2px) 0 0/16px 16px,radial-gradient(circle,var(--endink) 0 1.4px,transparent 2px) 8px 8px/16px 16px,var(--endpaper);box-shadow:inset 22px 0 22px -14px rgba(40,20,4,.55),inset 3px 0 0 rgba(40,20,4,.12),inset 0 0 0 1px rgba(60,40,10,.28),0 0 0 1px rgba(255,230,190,.14)}
.wide .pane .rcard{inset:76px 24px 24px;transition:top calc(.4s * var(--k)) cubic-bezier(.3,.7,.2,1),left calc(.4s * var(--k)) cubic-bezier(.3,.7,.2,1),right calc(.4s * var(--k)) cubic-bezier(.3,.7,.2,1),bottom calc(.4s * var(--k)) cubic-bezier(.3,.7,.2,1),background-color calc(.4s * var(--k)),border-radius calc(.4s * var(--k)),box-shadow calc(.4s * var(--k))}
/* --- Pinned jump buttons: above the card, never on it --- */
.pnav{position:absolute;z-index:6;display:flex;gap:2px;align-items:center;flex-wrap:nowrap;overflow:hidden;transition:opacity calc(.2s * var(--k))}
.pjs{flex:1;min-width:0;height:100%;display:flex;gap:inherit;align-items:inherit;overflow-x:auto;scrollbar-width:none;scroll-behavior:smooth}

#dev.wide.srchB .mtabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}#dev.wide.srchB .mtabs>button{flex:none}
#dev.ipadside.srchB .mtabs{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 40px),transparent)}
.pjs.fr{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 48px),transparent calc(100% - 8px));mask-image:linear-gradient(90deg,#000 calc(100% - 48px),transparent calc(100% - 8px))}

/* A: a floating panel, same look and gaps as the search panel on the left */
.navA .pnav{background:var(--icard);border:1px solid var(--tan-line);border-radius:6px;padding:0 8px;box-shadow:0 4px 14px rgba(40,26,8,.18),0 1px 3px rgba(40,26,8,.12)}

function tanbar(){

  const w=W(); let meta='', main='';

// r9: a week's groceries: none (not imported yet) · later (a reminder the day before it starts) · imported · partial (meals added after import) · failed
// r14 (panel 6 fit 4, ease 2): one fixed word set on every screen; the long words go in the label and tooltip
function weekState(w,i){
  const two=(lg,sh,xs)=>`<span class="lgs">${lg}</span><span class="shs">${sh}</span><span class="xss">${xs||sh}</span>`; // r43: xs = the phone's three-week row
  if(w.state==='new')return ['',two('Not started','Not started')];
  if(w.state==='draft'){if(S.making&&i===S.wi)return ['draft',two('Claude is making it','Making it')];
    const o=openCount(w);return ['draft',two(`Draft · ${mealCount(w)} meals${o?` · ${o} empty meal${o>1?'s':''}`:''}`,o?`Draft · ${o} empty meal${o>1?'s':''}`:'Draft','Draft')]}
  if(w.groc==='imported')return ['gadd',two('Approved · Groceries imported','Groceries imported','Imported')];
  if(w.groc==='partial')return ['appr',two('Approved · Changed since import','Changed since import','Changed')];
  if(w.groc==='failed')return ['appr',two('Approved · Groceries didn\'t import','Didn\'t import')];
  return ['appr',two('Approved · Groceries not imported','Not imported')]; // r23: 'Approved · Not imported' tried; it wraps the 1280 week row to two lines (a 60 px jump), so the short label stays
}
// r14: a change on an imported week marks it "changed since import" and counts what Import Again will add and take off
// r21 (Tyler 11-25, BRIEF 15): each change is logged in plain words ("You removed Fish Tacos"); Groceries greys those rows with the same line
const grocTouched=(w,add=0,off=0,line)=>{if(w.state==='approved'&&(w.groc==='imported'||w.groc==='partial')){w.groc='partial';w.chg=w.chg||{add:0,off:0};w.chg.add+=add;w.chg.off+=off;if(line)w.chgLog=[...(w.chgLog||[]),line]}};
const gSnap=w=>({groc:w.groc,chg:{...(w.chg||{add:0,off:0})},log:[...(w.chgLog||[])]}), gRest=(w,g)=>{w.groc=g.groc;w.chg=g.chg;w.chgLog=g.log};
// the banner's line: the latest change, then what it means for the list
const chgSay=w=>{const L=w.chgLog||[],c=w.chg||{add:0,off:0};const what=L.length?L[L.length-1]+(L.length>1?` and made ${L.length-1} more ${L.length===2?'change':'changes'}`:'')+'. ':'';
  const list=c.add&&c.off?`${c.add} new items to add, ${c.off} no longer needed.`:c.off?`Its ${c.off} items stay on your grocery list, greyed out, until you import again.`:c.add?`${c.add} new items aren't on your list yet.`:'Nothing on your list changes.';
  return what+list};
const partLine=w=>{const c=w.chg||{add:0,off:0};return `${c.add?c.add+' new items to add':'Nothing new to add'}${c.off?`, ${c.off} no longer needed`:''}. Press Import Again to update your groceries.`};

// the week row: one button per plan under the tan bar (never in it). ph = the phone copy that scrolls with the day
function weekrow(ph){
  if(S.past)return '';

  if(S.st==='loading')return `<div class="weeks"><div class="sk" style="width:200px;height:44px"></div><div class="sk" style="width:150px;height:44px;opacity:.7"></div><span style="flex:1"></span>${LAY()==='phone'?'':'<div class="sk" style="width:150px;height:44px"></div>'}</div>`;
  if(!S.weeks.length||S.errLoad)return '<div></div>';
  const items=S.weeks.map((w,i)=>{
    const lab=isThis(w)?'This Week':fmt(w.start);
    const [k,st]=weekState(w,i);
    const icon=k==='gadd'?ic('checkc'):k==='appr'?ic('checkc'):k==='draft'?ic('pen'):ic('cal');
    const full=st.replace(/<span class="(shs|xss)">[\s\S]*?<\/span>/g,'').replace(/<[^>]+>/g,'');

  // r19 (panel 8 job 6): a new plan is made on the server, so offline it is off with the same reason line as Approve Plan
  const add=canEdit()?(S.offline?`<button class="wk add off" data-a="offnew" aria-disabled="true" aria-label="Plan Another Week: needs a connection" title="A new plan needs a connection">${ic('plus')}Plan Another Week</button>`:`<button class="wk add" data-a="addweek" aria-label="Plan Another Week" title="Plan Another Week">${ic('plus')}Plan Another Week</button>`):'';
  // the board's own tools sit at the right end of this row (never in the tan bar); phone keeps All Recipes by the day title

    tools=`<button class="btn tan" data-a="picker" aria-label="All Recipes: pick cards for the week">${NI.book}All Recipes</button>`; // r24 (Tyler 2): never the old book name on Plan; the rail's own recipe icon
    {const nb=hBackable(w);if((nb||S.hist)&&canEdit())tools=`<button class="btn rcb" data-a="${S.hist?'histclose':'histopen'}" data-f="back" aria-pressed="${!!S.hist}" aria-label="Recent Changes${nb?`: ${nb} ${nb===1?'meal':'meals'} you can put back`:''}" title="Meals that left the plan, to put back">${LAY()==='mid'?'':ic('undo')}Recent Changes${nb?`<small>· ${nb}</small>`:''}</button>`+tools} // r49 (panel 19 #4, agy19 #1); r53 (agy23a #4): a quiet outline (not Cancel's), stays while its pane is open, no icon on iPad upright (it pushed This Week's status out)
    if(w.state==='approved'&&!S.chat&&LAY()==='wide')tools+=`<button class="btn tan" data-a="openchat">${ic('chat')}Change with Claude</button>`;
  }
  // phone: "+ Plan Week" rides at the end of the list, so every week stays in view first

  return `<div class="weeks ${ph?'ph':S._wkFit||''}"><div class="wlist ${ph&&S.weeks.length>=3?'many':''}${ph&&S.weeks.length===3?' w3':''}" role="group" aria-label="Plans">${items}${ph?add:''}</div>${ph?'':add}${tools?`<span class="wsp"></span>${tools}`:''}</div>`;
}

function mealCard(m,w){
  const today=w.id==='w1'&&m.day===S.today&&w.state==='approved';
  const ro=!canEdit();
  if(S.ask===m.id){return `<div class="meal ask" data-m="${m.id}" role="group" aria-labelledby="askq-${m.id}" ${S.askH>86?`style="min-height:${S.askH}px"`:''}><div class="askq" id="askq-${m.id}">Remove ${esc(nm(m))}?<small>${(lo=>lo.length?`${dayWord(w,lo[0].day)}'s leftovers go too. `:'')(leftsOf(w,m))}${m.left?'The food stays in Leftovers.':w.state==='approved'?(w.groc==='imported'||w.groc==='partial'?'Its items stay on your list until you press Import Again.':'It comes off this plan.'):'It comes off this draft.'}</small></div>
    <div class="askb"><button class="btn cancel" data-a="keep">Cancel</button><button class="btn danger" data-a="doremove" data-m="${m.id}">Remove</button></div></div>`}
  if(m.open){return `<div class="meal open" data-m="${m.id}" data-day="${m.day}"><div class="mh"><span class="mt">${m.type}</span>${!ro&&!S.making&&!(isThis(w)&&w.state==='approved'&&m.day<S.today)?`<button class="mx" data-a="mmenu" data-m="${m.id}" aria-haspopup="dialog" aria-expanded="false" aria-label="Menu for ${WD[dayDate(w,m.day).getDay()]} ${m.type}, nothing picked yet">${ic('dots','i sm')}</button>`:''}</div>
    ${ro||S.making||(isThis(w)&&w.state==='approved'&&m.day<S.today)?`<div class="mn">${isThis(w)&&w.state==='approved'&&m.day<S.today?'Nothing planned':'Nothing here yet'}</div>`:S.phonePick&&R[S.phonePick]?`<button class="slotbtn zput" data-a="zput" data-m="${m.id}" aria-label="Put ${esc(R[S.phonePick].n)} in ${WDL[dayDate(w,m.day).getDay()]} ${m.type.toLowerCase()}"><span class="sb1">Nothing here yet</span><span class="sb2">Put Here</span></button>` /* r33 (purpose 5): while a card is picked, one tap puts it here */
    :`<button class="slotbtn" data-a="fill" data-m="${m.id}"><span class="sb1">Nothing here yet</span><span class="sb2">${ic('plus')}Pick ${m.type}</span></button>`}</div>`}
  const r=R[m.r], cls=['meal'];
  if(m.left)cls.push('left'); if(m.status)cls.push(m.status); if(S.arriveIds.has(m.id)&&!S.flyIds.has(m.id))cls.push('arrive'); if(m.pend)cls.push('pend');
  if(S.menuFor===m.id)cls.push('menuon');if(S.swapFor===m.id)cls.push('swapon');
  if(S.nope===m.id)cls.push('nope');
