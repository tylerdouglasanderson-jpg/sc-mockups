/* mockup switcher (not part of the app) */
.mock{position:fixed;top:0;left:0;right:0;height:40px;z-index:90;background:var(--ink);color:var(--hdr-text);display:flex;align-items:center;gap:4px;padding:0 8px;overflow-x:auto;scrollbar-width:none}
.mock::-webkit-scrollbar{display:none}
.mock b{font-size:12px;font-weight:600;opacity:.7;margin:0 4px;white-space:nowrap}
.mock button{height:30px;padding:0 10px;border-radius:6px;font-size:13px;white-space:nowrap;color:var(--hdr-text)}
.mock button.on{background:var(--hdr-text);color:var(--ink);font-weight:600}
.mock button:hover:not(.on){background:rgba(250,244,235,.12)}
.mock .gap{width:1px;height:20px;background:rgba(250,244,235,.25);margin:0 6px;flex:none}

.top::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--wood-sheen-top),var(--wood-sheen-bottom));pointer-events:none}
.M-phone .top{padding:0 12px 0 16px}
.wordmark{font-style:italic;font-weight:600;font-size:22px;position:relative}
.top .sp{flex:1}
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;font-weight:600;background:var(--member-1);color:var(--hdr-text);box-shadow:0 0 0 2px var(--hdr-text);position:relative;margin-left:8px}
.rail{background:var(--card);border-right:1px solid var(--bcard);padding:12px 8px;display:flex;flex-direction:column;gap:4px;min-height:0;overflow:hidden}
.M-ipad .rail{padding:12px 0;align-items:center}
.M-phone .rail{display:none}
.rail .cap{height:44px;border-radius:8px;background:var(--sage);color:var(--ink);display:flex;align-items:center;gap:8px;padding:0 12px;font-weight:500;font-size:16px;margin-bottom:8px;flex:none}
.M-ipad .rail .cap{font-size:0;padding:0;width:44px;justify-content:center}
.rail .ri{display:flex;align-items:center;gap:12px;height:44px;border-radius:8px;padding:0 12px;color:var(--ink2);font-weight:500;font-size:16px;text-align:left;flex:none}
.M-ipad .rail .ri{font-size:0;gap:0;justify-content:center;padding:0;width:44px}
.rail .ri svg.ni,.rail .cap svg.ni{width:24px;height:24px}
.rail .ri:hover{box-shadow:var(--hover)}
.rail .ri.on{background:var(--sage-light);color:var(--sage-text)}
.rail hr{border:0;border-top:1px solid var(--bcard);margin:4px 8px;width:calc(100% - 16px)}
.body{display:grid;grid-template-rows:46px 1fr;min-height:0;min-width:0}
.bar{background:var(--subbar);border-bottom:1px solid var(--brow);display:flex;z-index:5}
.bar .in{display:flex;align-items:center;gap:12px;width:100%;max-width:1212px;margin:0 auto;padding:0 16px;min-width:0}
.ttl{font-style:italic;font-weight:600;font-size:16px;color:var(--subbar-date);white-space:nowrap;overflow:hidden;min-width:0;flex:0 100 auto;padding-right:2px}
.sepc{width:16px;height:16px;color:var(--subbar-2);flex:none;margin:0 -4px}
.bk+.sepc{margin-left:-14px}
.bar .btn,.bar .sp,.bar .timerchip,.bar .hq{flex-shrink:0}
.meta{font-size:13px;color:var(--subbar-2);white-space:nowrap}
.vl{width:1px;height:20px;background:var(--chip-warm-edge);flex:none;margin:0 -4px}
.bar .sp{flex:1}
.btn{height:44px;border-radius:8px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:500;font-size:16px;white-space:nowrap;flex:none;transition:transform 50ms var(--ease),box-shadow .2s var(--ease)}
.btn:active{transform:scale(.97);box-shadow:var(--press)}
.btn.pri{background:var(--sage-dark);color:var(--hdr-text)}.btn.pri:hover{box-shadow:inset 0 0 0 100px var(--on-dark-hover)}
.btn.sec{background:var(--sage);color:var(--ink)}.btn.sec:hover{box-shadow:var(--hover)}
.btn.cancel{border:1px solid var(--ink2)}.btn.cancel:hover{box-shadow:var(--hover)}
.btn.icon{width:44px;padding:0;color:var(--ink2)}.btn.icon:hover{box-shadow:var(--hover)}
.bar .btn{height:32px;padding:0 14px;font-size:15px}.bar .btn.icon{width:32px;padding:0}
.bk{position:relative;display:inline-flex;align-items:center;gap:2px;height:32px;padding:0 10px 0 4px;margin-left:-8px;border-radius:8px;color:var(--subbar-2);font-weight:500;font-size:16px;white-space:nowrap;flex:none}
.bk:hover{background:rgba(75,105,71,.12);color:var(--subbar-date)}
.scroll{overflow-y:auto;min-height:0}
.col{max-width:1212px;margin:0 auto;padding:20px 16px 40px}
.card{background:var(--card);border-radius:12px;box-shadow:var(--shadow-card),0 0 0 1px var(--bcard);overflow:hidden;margin-bottom:16px}
.eyebrow{font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);padding:14px 16px 6px}
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 16px;border-top:1px solid var(--brow)}
.row .t{font-weight:500;font-size:16px}
.row .s{font-size:13px;color:var(--muted)}
.row .r{margin-left:auto;text-align:right;font-size:13px;color:var(--ink2)}
.row .r b{display:block;color:var(--ink);font-weight:500;font-size:15px}
.chips{display:flex;gap:8px;padding:12px 16px}
.chip{height:36px;border-radius:8px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;background:var(--chip);font-size:14px;font-weight:500}
.chip.on{background:var(--sage-light);color:var(--sage-text);box-shadow:inset 0 0 0 1px var(--sage-text)}
.tick{width:22px;height:22px;border-radius:5px;border:1.5px solid var(--ink2);flex:none}
.tick.on{background:var(--sage-text);border-color:var(--sage-text)}
.struck .t{text-decoration:line-through;color:var(--muted)}
.wide{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.M-ipad .wide,.M-phone .wide{grid-template-columns:1fr}
.M-phone .wide>.side{display:none}
.step{display:flex;gap:12px;padding:12px 16px;border-top:1px solid var(--brow)}
.step .n{width:26px;height:26px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:13px;font-weight:600;flex:none}
.tabbar{display:none}
.M-phone .tabbar{display:flex;grid-column:1/-1;background:var(--card);border-top:1px solid var(--bcard);align-items:center;padding:0 4px;position:relative;z-index:6}
.tabbar .tb{flex:1;display:flex;justify-content:center}
.tabbar .tb>span{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:500;color:var(--ink2);min-width:56px;padding:4px 8px;border-radius:8px}
.tabbar .tb.on>span{background:var(--sage-light);color:var(--sage-text)}
.tabbar .tb svg.ni,.tabbar .tb svg.i{width:24px;height:24px}
.tabbar .capslot{width:78px;display:flex;justify-content:center;align-self:flex-start}
.tabbar .capc{width:60px;height:60px;border-radius:50%;background:var(--sage);display:grid;place-items:center;margin-top:-18px;box-shadow:var(--shadow-card)}
.tabbar .capc svg.ni{width:32px;height:32px}

/* a page's own sheet / dialog (to show help floats above it) */
.scrim{position:fixed;inset:40px 0 0 0;background:var(--scrim);z-index:var(--z-dialog);display:grid;place-items:center;padding:16px}
.SIDE .scrim.beside{padding-right:432px}.SIDE.M-ipad .scrim.beside{padding-right:412px}
.dlg{width:min(420px,100%);background:var(--card);border-radius:16px;box-shadow:var(--shadow-float);padding:20px}
.dlg h3{margin:0 0 4px;font-size:20px;font-weight:600}
.dlg p{margin:0 0 16px;color:var(--ink2)}
.fld{height:52px;border-radius:8px;border:1px solid var(--ink2);background:#fff;display:flex;align-items:center;padding:0 14px;color:var(--muted);margin-bottom:16px}
.dlg .acts{display:flex;flex-direction:column;gap:8px}

/* ---------- folder tabs (look D, simplified for the mockup) ---------- */
.ftabs{display:flex;width:fit-content;gap:0;padding:0 0 0 8px;margin-bottom:-1px;position:relative;z-index:1}
.ftab{height:40px;padding:0 16px;margin-right:-6px;border-radius:10px 10px 0 0;background:var(--folder-2,#E2CDA4);box-shadow:inset 0 0 0 1px var(--folder-line,#D2C6B0);font-weight:600;font-size:15px;color:var(--folder-ink,#4A3A22);display:inline-flex;align-items:center;gap:6px}
.ftab .n{font-weight:500;font-size:13px;opacity:.8}
.ftab.on{background:var(--card);box-shadow:inset 1px 1px 0 var(--folder-line,#D2C6B0),inset -1px 0 0 var(--folder-line,#D2C6B0);z-index:2}
.ftab:nth-child(2){background:#E8D6B2}.ftab:nth-child(3){background:#DCC598}.ftab:nth-child(4){background:#D6BD8C}
.card.tabbed{border-top-left-radius:0}

/* ---------- header icons: timer, saving cloud, the help "?", avatar ---------- */
.hic{position:relative;z-index:1;width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--hdr-text);opacity:.9}
.hic svg.i{width:20px;height:20px}

/* ---------- THE OPENER ---------- */
.hq{position:relative;z-index:1;width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--hdr-text);background:rgba(250,244,235,.16);box-shadow:inset 0 0 0 1px rgba(250,244,235,.35);transition:transform 50ms var(--ease),box-shadow .2s var(--ease)}
.hq::after{content:"";position:absolute;inset:-4px}
.hq svg.i{width:22px;height:22px}
.hq:hover{box-shadow:inset 0 0 0 100px var(--on-dark-hover)}
.hq:active{transform:scale(.97);box-shadow:inset 0 0 0 100px var(--on-dark-press)}
.hq[aria-expanded="true"]{background:var(--hdr-text);color:var(--header)}
.hq .tip{position:absolute;top:calc(100% + 8px);right:0;background:var(--ink);color:var(--hdr-text);font-size:13px;font-weight:500;white-space:nowrap;padding:6px 10px;border-radius:6px;box-shadow:var(--shadow-pop);opacity:0;pointer-events:none;transition:opacity .2s var(--ease) .4s;z-index:3}
.hq .tip kbd{font:inherit;font-weight:600;border:1px solid rgba(250,244,235,.45);border-radius:4px;padding:0 5px;margin-left:6px}
.M-desktop .hq:hover .tip{opacity:1}
/* the same "?" on a tan bar (pages with no header) and in a dialog's head */
.hq.ontan{background:transparent;color:var(--subbar-date);width:32px;height:32px}
.hq.ontan::after{content:"";position:absolute;inset:-6px}
.hq.ontan:hover{box-shadow:var(--hover)}
.hq.ontan[aria-expanded="true"]{background:var(--sage-light);color:var(--sage-text)}
.hq.indlg{background:transparent;color:var(--ink2);width:44px;height:44px}
.hq.indlg:hover{box-shadow:var(--hover)}
.hq.indlg[aria-expanded="true"]{background:var(--sage-light);color:var(--sage-text)}

/* ---------- the page makes room (computer, iPad sideways): only the tan bar and page move ---------- */
.app{transition:grid-template-columns .2s var(--ease)}
.SIDE .app.room{grid-template-columns:219px 1fr 416px}
.SIDE.M-ipad .app.room{grid-template-columns:64px 1fr 396px}
.SIDE .app.noframe.room{grid-template-columns:1fr 416px}
.scrim.room{right:416px}.M-ipad .scrim.room{right:396px}

/* ---------- THE HELP PANE ---------- */
.hp{position:fixed;z-index:var(--z-help);background:var(--card);box-shadow:var(--shadow-float),0 0 0 1px var(--bcard);display:flex;flex-direction:column;min-height:0;visibility:hidden}
/* side card */
.SIDE .hp{top:98px;right:8px;bottom:8px;width:400px;border-radius:16px;transform:translateX(calc(100% + 24px));transition:transform .2s var(--ease),visibility 0s linear .2s}
.SIDE.M-ipad .hp{width:380px}
.SIDE .hp.nohdr{top:48px}
.SIDE .hp.open{transform:none;visibility:visible;transition:transform .2s var(--ease),visibility 0s}
/* bottom sheet (iPhone, iPad upright, narrow windows): the kit Sheet, almost full height */
.SHEET .hp{left:0;right:0;bottom:0;height:auto;max-height:calc(100% - 96px);border-radius:16px 16px 0 0;transform:translateY(100%);transition:transform .2s var(--ease),height .2s var(--ease),visibility 0s linear .2s}
.SHEET.M-ipad .hp{left:0;right:0;margin:0 auto;bottom:16px;width:min(640px,calc(100% - 32px));height:auto;max-height:calc(100% - 140px);border-radius:16px}
.SHEET.M-ipad .hp .grab{display:none}
.SHEET .hp.open{transform:none;visibility:visible;transition:transform .2s var(--ease),height .2s var(--ease),visibility 0s}
.SHEET .hp.peek{height:64px}
body.hpdlg .dlg{visibility:hidden}
.hp .ft{position:relative}
.hp .ft::before{content:"";position:absolute;left:0;right:12px;top:-25px;height:24px;background:linear-gradient(rgba(250,246,238,0),var(--card));pointer-events:none}
.hp .bd{padding-bottom:20px}
.hp .bd>.here:first-child{margin-top:16px}
.hp .lead{text-wrap:pretty}
.SHEET.M-phone .hp.peek{left:8px;right:8px;bottom:92px;border-radius:16px}
.hpscrim{position:fixed;inset:40px 0 0 0;background:var(--scrim);z-index:calc(var(--z-help) - 1);opacity:0;pointer-events:none;transition:opacity .2s var(--ease)}
.hpscrim.on{opacity:1;pointer-events:auto}
.hp .grab{display:none}
.SHEET .hp .grab{display:flex;justify-content:center;padding:8px 0 4px;cursor:grab;flex:none}
.SHEET .hp .grab i{width:40px;height:4px;border-radius:2px;background:rgb(var(--c-muted) / .35)}
.hp .hd{display:flex;align-items:center;gap:8px;padding:12px 8px 12px 20px;border-bottom:1px solid var(--brow);flex:none}
.hp .hd .ey{font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);display:flex;align-items:center;gap:6px}
.hp .hd .ey svg.ni{width:18px;height:18px}
.hp .hd h2{margin:2px 0 0;font-size:20px;font-weight:600;line-height:1.25}
.hp .hd .x{margin-left:auto;width:44px;height:44px;border-radius:8px;display:grid;place-items:center;color:var(--ink2);flex:none}
.hp .hd .x:hover{box-shadow:var(--hover)}
.hp .bd{overflow-y:auto;padding:4px 20px 8px;flex:1 1 auto;min-height:0}
.SIDE .hp .bd{flex:1}
.hp:focus{outline:none}
.hp h2:focus{outline:none}
.hp .ph{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--amber-text);background:var(--amber-light);border-radius:4px;padding:2px 8px;margin-top:14px}
.hp .lead{font-size:16px;line-height:1.5;margin:10px 0 0}
.hp .here{margin:4px 0 8px;padding:10px 12px;border-radius:8px;background:var(--alert,#F8F0E0);font-size:15px;color:var(--ink)}
.hp .here .l1,.hp .here .l2{display:block}
.hp .here .l2{margin-top:2px;font-size:14px;color:var(--ink2)}
.hp .here b{color:var(--ink)}
.hp .hs{font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:20px 0 2px}
.hp ol,.hp ul{margin:0;padding:0;list-style:none}
.hp li{padding:8px 0;border-bottom:1px solid var(--brow);font-size:15px;line-height:1.45}
.hp li:last-child{border-bottom:0}
.hp ol li{display:grid;grid-template-columns:24px 1fr;column-gap:10px}
.hp ol li .n{width:24px;height:24px;border-radius:50%;background:var(--sage-light);color:var(--sage-text);display:grid;place-items:center;font-size:13px;font-weight:600;margin-top:-1px}

.hp li b{font-weight:600}
/* Show Me: a quiet button under its line; 32 to the eye, 44 to the finger */
.hp li.sh{display:grid;grid-template-columns:1fr auto;column-gap:12px;align-items:center}
.hp ol li.sh{grid-template-columns:24px 1fr auto}
.hp .show{position:relative;display:inline-flex;align-items:center;height:32px;padding:0 8px;border-radius:8px;font-size:14px;font-weight:600;color:var(--sage-text);background:transparent;box-shadow:none;white-space:nowrap;align-self:center}
.hp .show::after{content:"";position:absolute;inset:-6px 0}
.hp .show svg.i{width:18px;height:18px}
.hp .show:hover,.hp li.act .show{background:var(--sage-light);box-shadow:inset 0 0 0 1px var(--sage-text)}
.hp li.act{background:var(--sage-light);margin:0 -12px;padding-left:12px;padding-right:12px;border-radius:8px}
.hp .show:active{transform:scale(.97);box-shadow:var(--press)}
.hp .ft{padding:12px 20px 16px;border-top:1px solid var(--brow);display:flex;align-items:center;gap:12px;flex:none}
.hp .ft .q{font-size:13px;color:var(--muted);white-space:nowrap}
.hp .ft .qs{display:flex;flex-direction:column;gap:2px}
.SHEET .hp .ft{padding-bottom:max(16px,env(safe-area-inset-bottom))}
/* the peek bar while Show Me points at the page on a sheet */
.hp .pk{display:none}
.SHEET .hp.peek .grab,.SHEET .hp.peek .hd,.SHEET .hp.peek .bd,.SHEET .hp.peek .ft{display:none}
.SHEET .hp.peek .pk{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;padding:12px 10px 8px;width:100%}
.SHEET .hp.peek .pk .what{flex:1 1 220px;font-size:15px;line-height:1.4;padding:0 8px}
.SHEET .hp.peek .pk .what b{font-weight:600}
.SHEET .hp.peek{height:auto}
.SHEET .hp.peek .pk .back{margin-left:auto}
.SHEET .hp.peek .pk .x{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;color:var(--ink2);flex:none}
.SHEET .hp.peek .pk .back{flex:none;height:44px;padding:0 14px;border-radius:8px;background:var(--sage);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:500;font-size:16px;white-space:nowrap}
/* Show Me: the part of the page it means gets the green ring for a moment */
.ftabs.spot-on{outline-offset:0;border-radius:8px 8px 0 0}
.spot-on{outline:2px solid var(--sage-text)!important;outline-offset:2px;border-radius:8px;animation:spot 1.6s var(--ease) 1}
@keyframes spot{0%,100%{box-shadow:0 0 0 0 rgba(75,105,71,0)}30%{box-shadow:0 0 0 8px rgba(75,105,71,.18)}}

/* Cook (no header): a full-screen page; the shopper link: no navigation */
.app.noframe{grid-template-rows:1fr}
.app.shopf{grid-template-columns:1fr}
.app.shopf .body{grid-column:1/2}
.SIDE .app.shopf.room{grid-template-columns:1fr 416px}
.top .shoptag{font-size:14px;color:var(--hdr-text);opacity:.85;margin-right:8px}
.M-phone .top .shoptag{display:none}
.app.noframe .body{grid-column:1/2}
.cookstep{font-size:22px;line-height:1.35;max-width:720px}
.timerchip{height:32px;border-radius:8px;padding:0 10px;display:inline-flex;align-items:center;gap:6px;background:var(--amber-light);color:var(--amber-text);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.dlg .dh{display:flex;align-items:center;gap:4px;margin:-8px -8px 4px 0}
.SHEET.M-phone .scrim{place-items:end stretch;padding:0}
.SHEET.M-phone .dlg{width:100%;border-radius:16px 16px 0 0;padding:8px 20px 24px}
.dlg .gb{display:none}.SHEET.M-phone .dlg .gb{display:flex;justify-content:center;padding:0 0 8px}.dlg .gb i{width:40px;height:4px;border-radius:2px;background:rgb(var(--c-muted) / .35)}
.dlg .dx{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;color:var(--ink2)}
.dlg .dh h3{margin:0;flex:1}


/* ---------- FIRST-MONTH PAGE TIP: a small floater, bottom right, on a page's first visit; fades after a minute ---------- */
.ptip{position:fixed;right:24px;bottom:24px;z-index:15;background:var(--card);border-radius:12px;box-shadow:var(--shadow-pop),0 0 0 1px var(--bcard);transition:opacity .4s var(--ease),transform .2s var(--ease)}
.SHEET.M-phone .ptip{right:12px;left:auto;bottom:92px}
.ptip .tb1{display:flex;align-items:center;gap:4px;padding:6px 6px 6px 0;cursor:pointer}
.ptip .tb1 .see{margin-left:12px}
.ptip .go{display:flex;align-items:center;gap:10px;height:44px;padding:0 6px 0 14px;border-radius:8px;font-size:15px;font-weight:500;color:var(--ink)}
.ptip .go svg.i{color:var(--sage-text);width:22px;height:22px}
.ptip .go:hover{background:var(--row-hover)}
.ptip .tx{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;color:var(--ink2)}
.ptip .tx:hover{box-shadow:var(--hover)}
.ptip{overflow:hidden}
.ptip .life{height:2px;margin:0;background:transparent;overflow:hidden}
.ptip .life i{display:block;height:100%;width:62%;background:var(--sage)}
.ptip .tb1 .see{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--ink2);font-size:14px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center}
.ptip .tb1 .see:hover{box-shadow:var(--hover)}
.ptip .tb1 .lbl{display:flex;align-items:center;gap:10px;padding-left:14px;font-size:15px;font-weight:500}
.ptip .tb1 .lbl svg.i{color:var(--sage-text);width:22px;height:22px}
.ptip.big{width:320px;padding:16px}
.SHEET.M-phone .ptip.big{left:12px;width:auto}
.ptip.big h4{margin:0 0 4px;font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
.ptip.big h4 svg.i{color:var(--sage-text)}
.ptip.big p{margin:0 0 12px;font-size:14px;color:var(--ink2)}
.ptip.big .acts{display:flex;flex-direction:column;gap:8px}
.ptip.big .acts .btn{width:100%}
.ptip.big .acts .btn.quiet{border-color:transparent;box-shadow:none;color:var(--ink2)}
.ptip.big .x2{position:absolute;top:6px;right:6px}
.hp .tipline{margin:20px 0 4px;padding-top:14px;border-top:1px solid var(--brow);font-size:14px;color:var(--ink2);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hp .tipline .btn{height:36px;padding:0 12px;font-size:14px}
/* a switch with its word (4.4.2) */
.sw{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--ink2);flex:none;min-height:44px}
.sw i{width:44px;height:26px;border-radius:13px;background:var(--sage-text);position:relative;display:block}
.sw i::after{content:"";position:absolute;top:3px;left:21px;width:20px;height:20px;border-radius:50%;background:var(--card);transition:left .2s var(--ease)}
.sw.off i{background:var(--track)}.sw.off i::after{left:3px}

/* ---------- THE WAYS (Tyler 16:00: "iterate on all the various ways and figure out what seems like the most appropriate") ---------- */
.mock2{position:fixed;top:40px;left:0;right:0;height:36px;z-index:90;background:#33302A;color:var(--hdr-text);display:flex;align-items:center;gap:4px;padding:0 8px;overflow-x:auto;scrollbar-width:none}
.mock2::-webkit-scrollbar{display:none}
.mock2 b{font-size:12px;font-weight:600;opacity:.7;margin:0 4px;white-space:nowrap}
.mock2 button{height:28px;padding:0 10px;border-radius:6px;font-size:13px;white-space:nowrap;color:var(--hdr-text)}
.mock2 button.on{background:var(--hdr-text);color:var(--ink);font-weight:600}
.mock2 button.pick::after{content:" \2713";color:#9FC79A}
.mock2 button.on.pick::after{color:var(--sage-text)}
.app,.scrim,.hpscrim{top:76px!important}
.SIDE .hp{top:134px}.SIDE .hp.nohdr{top:84px}
/* B. overlay: a full-height side sheet over everything, with the scrim; the page does not move */
.way-overlay.SIDE .app.room{grid-template-columns:219px 1fr}
.way-overlay.SIDE.M-ipad .app.room{grid-template-columns:64px 1fr}
.way-overlay.SIDE .app.noframe.room{grid-template-columns:1fr}
.way-overlay.SIDE .hp{top:76px;right:0;bottom:0;border-radius:16px 0 0 16px}
.way-overlay .hpscrim.side{opacity:1;pointer-events:auto}
/* C. bottom sheet everywhere: on wide screens a centred sheet up to 720 wide */
.way-bottom.SIDE .app.room{grid-template-columns:219px 1fr}
.way-bottom.SIDE.M-ipad .app.room{grid-template-columns:64px 1fr}
.way-bottom.SIDE .app.noframe.room{grid-template-columns:1fr}
.way-bottom.SIDE .hp{top:auto;left:0;right:0;bottom:0;margin:0 auto;width:min(720px,100%);height:auto;max-height:60%;border-radius:16px 16px 0 0;transform:translateY(100%)}
.way-bottom.SIDE .hp.open{transform:none}
.way-bottom .hpscrim.side{opacity:1;pointer-events:auto}
/* D. inline: a panel that opens under the tan bar and pushes the page down */
.hpin{background:var(--card);border-bottom:1px solid var(--brow);box-shadow:0 6px 16px rgba(45,33,22,.08);max-height:46vh;display:flex;flex-direction:column;min-height:0;position:relative;z-index:4}
.hpin .hd{padding:12px 8px 8px 20px;border-bottom:1px solid var(--brow);display:flex;align-items:center}
.hpin .hd h2{margin:0;font-size:18px;font-weight:600;flex:1}
.hpin .hd .x{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;color:var(--ink2)}
.hpin .bd{overflow:auto;padding:0 20px 16px;max-width:1212px;width:100%;margin:0 auto;columns:2 320px;column-gap:40px}
.M-phone .hpin .bd{columns:1}
.hpin .bd .hs{break-after:avoid}
.hpin .bd ul,.hpin .bd ol{break-inside:avoid}
.hpin .hs{font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:16px 0 2px}
.hpin ul,.hpin ol{list-style:none;margin:0;padding:0}.hpin li{padding:8px 0;border-bottom:1px solid var(--brow);font-size:15px}
.hpin .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--sage-light);color:var(--sage-text);font-size:12px;font-weight:600;margin-right:8px}
.hpin .lead{margin:12px 0 0;font-size:16px}
.body.inl{grid-template-rows:46px auto 1fr}
/* E. full page: help replaces the page, with the standard back */
.hppage{max-width:640px}
.hppage .hs{font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:20px 0 4px}
.hppage ul,.hppage ol{list-style:none;margin:0;padding:0}.hppage li{padding:10px 0;border-bottom:1px solid var(--brow)}
.hppage .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--sage-light);color:var(--sage-text);font-size:13px;font-weight:600;margin-right:10px}
.hppage .lead{font-size:17px;margin:0}
/* the compare card */
.cmp{position:fixed;left:50%;top:96px;transform:translateX(-50%);z-index:80;width:min(980px,calc(100% - 16px));max-height:calc(100% - 112px);overflow:auto;background:var(--card);border-radius:16px;box-shadow:var(--shadow-float),0 0 0 1px var(--bcard);padding:20px}
.cmp h3{margin:0 0 4px;font-size:20px;font-weight:600}
.cmp p{margin:0 0 12px;color:var(--ink2);font-size:14px}
.cmp table{width:100%;border-collapse:collapse;font-size:14px}
.cmp th,.cmp td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--brow);vertical-align:top}
.cmp th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:500}
.cmp td.sc{text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.cmp tr.pick td{background:var(--sage-light)}
.cmp .x{position:absolute;top:10px;right:10px;width:44px;height:44px;border-radius:8px;display:grid;place-items:center;color:var(--ink2)}
.M-phone .cmp td.hide,.M-phone .cmp th.hide{display:none}
.toast{position:fixed;right:24px;bottom:24px;background:var(--ink);color:var(--hdr-text);padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;transform:translateY(12px);transition:.2s var(--ease);pointer-events:none;z-index:var(--z-toast)}
.SHEET .toast{left:16px;right:16px;bottom:80px;text-align:center}
.toast.on{opacity:1;transform:none}
</style>

const opener=(cls='')=>`<button class="hq ${cls}" data-a="help" aria-label="How This Page Works" aria-keyshortcuts="H" aria-expanded="${S.open}" aria-controls="hp">${ic('help')}<span class="tip" role="tooltip">How This Page Works${TOUCH?'':'<kbd>H</kbd>'}</span></button>`;

function pageKitchen(){
  const r=[['Milk','Fridge','¾ gal','Running low'],['Cheddar','Fridge','6 oz','Use by Tue'],['Chicken thighs','Freezer','3 lb','Stocked'],['Rice','Pantry','2 lb','Stocked'],['Eggs','Fridge','9 eggs','Stocked'],['Butter','Fridge','2 sticks','Stocked'],['Flour','Pantry','2 cups','Stocked']];
  const tab=(t,n,on)=>`<span class="ftab ${on?'on':''}">${t}<span class="n">${n}</span></span>`;
  return {bar:`<span class="ttl">Kitchen</span><span class="vl"></span><span class="meta">What you have at home</span><span class="sp"></span><button class="btn pri" data-spot="add">${ic('plus')}${PHONE?'Add':'Add Food'}</button><button class="btn icon" data-spot="more" aria-label="More Kitchen actions">${ic('dots')}</button>`,
   body:`<div class="wide"><div><div class="ftabs" data-spot="tabs">${tab('All',14,1)}${tab('Fridge',6)}${tab('Freezer',3)}${tab('Pantry',5)}</div>
   <div class="card tabbed"><div class="row" data-spot="low" style="border-top:0;min-height:48px;color:var(--ink2);font-size:14px">3 staples low<span class="vl" style="margin:0 4px"></span><b style="color:var(--ink)">See Staples</b></div><div data-spot="rows">${r.map(([t,s,a,b])=>`<div class="row"><div><div class="t">${t}</div><div class="s">${s}</div></div><div class="r"><b>${a}</b>${b}</div></div>`).join('')}</div></div></div>

function groceryList(){const a=[['Produce',[['Bananas','1 bunch',1],['Spinach','1 bag',0],['Limes','4',0]]],['Dairy',[['Milk','1 gal',0],['Cheddar','8 oz',1]]],['Pantry',[['Canned tomatoes','3 cans',0],['Rice','2 lb',0]]]];
  return `<div data-spot="rows">${a.map(([g,it])=>`<div class="card"><div class="eyebrow">${g}</div>${it.map(([t,q,d])=>`<div class="row ${d?'struck':''}"><span class="tick ${d?'on':''}"></span><div><div class="t">${t}</div><div class="s">${q}</div></div></div>`).join('')}</div>`).join('')}</div>`}
function pageGroc(){
  return {bar:`<span class="ttl">Groceries</span><span class="vl"></span><span class="meta">12 items</span><span class="sp"></span><button class="btn pri" data-spot="add">${ic('plus')}${PHONE?'Add':'Add Items'}</button><button class="btn icon" aria-label="More">${ic('dots')}</button>`,
   body:`<div class="chips" data-spot="store" style="padding:0 0 12px"><span class="chip on">Aldi</span><span class="chip">Costco</span><span class="chip">Target</span></div>${groceryList()}`}}
function pageRecipe(){
  return {bar:`<button class="bk" aria-label="Back to Recipes">${ic('left')}Recipes</button>${SEP}<span class="ttl">Chicken tikka masala</span><span class="sp"></span><button class="btn pri" data-spot="add">${PHONE?'Cook':'Cook This'}</button><button class="btn icon" aria-label="More">${ic('dots')}</button>`,
   body:`<div class="wide"><div class="card" data-spot="ing"><div class="eyebrow">Ingredients<span class="vl" style="display:inline-block;vertical-align:-4px;margin:0 8px"></span>6 Servings</div>${['2 lb chicken thighs','1 cup yogurt','1 can tomatoes','1 cup cream','2 tbsp garam masala'].map(x=>`<div class="row" style="min-height:48px"><div class="t" style="font-weight:400">${x}</div></div>`).join('')}</div>
   <div class="card" data-spot="steps"><div class="eyebrow">Steps</div>${['Mix the yogurt and spices. Add the chicken.','Brown the chicken in a hot pan.','Add tomatoes and cream. Simmer 20 min.'].map((x,i)=>`<div class="step"><span class="n">${i+1}</span><div>${x}</div></div>`).join('')}</div></div>`}}
function pageCook(){

  const dos=h.do.length?`<div class="hs">Things you can do</div><ol>${h.do.map((it,i)=>`<li class="${it.spot&&!dl?'sh':''}" data-line="${it.spot||''}"><span class="n">${i+1}</span><span>${it.t}</span>${show(it)}</li>`).join('')}</ol>`:'';
  const know=h.know.length?`<div class="hs">Good to know</div><ul>${h.know.map(it=>`<li>${it.t}</li>`).join('')}</ul>`:'';
  return `<div class="pk"><span class="what">${S.spotLine||''}</span><button class="back" data-a="unpeek">${ic('up')}Back to Help</button><button class="x" data-a="close" aria-label="Close help">${ic('x')}</button></div>
   <div class="grab" data-a="grab" aria-hidden="true"><i></i></div>
   <div class="hd"><div><div class="ey">${h.icon==='none'?'':(NI[h.icon]||'')}${h.page}</div><h2 id="hpt">How This Page Works</h2></div><button class="x" data-a="close" aria-label="Close How This Page Works" title="Close${TOUCH?'':' (Esc or H)'}">${ic('x')}</button></div>
   <div class="bd" id="hpbd">${dl||S.coming?'':'<span class="ph">Placeholder: help words come later</span>'}
   ${dl?`<p class="here"><span class="l1">${SIDE?'<b>Add Food</b> is still open. Your typing is kept.':'Close help to go back to <b>Add Food</b>. Your typing is kept.'}</span>${S.coming?'':`<span class="l2">Add Food help is coming. This is help for ${h.page}.</span>`}</p>`:''}
   ${S.coming?`<p class="lead">${dl?`Help for Add Food and the ${h.page} page is coming.`:"Help for this page is coming."} Until then, Email Us and we will help.</p>`:`<p class="lead">${h.lead}</p>${see}${dos}${know}`}${S.fromTip?`<div class="tipline"><span>Tips show on new pages for your first month.</span><button class="btn cancel" data-a="tipsoffpane">Don't Show Tips Again</button></div>`:''}</div>
   <div class="ft"><button class="btn cancel" data-a="ask">Email Us</button><span class="qs"><span class="q">We answer within 2 days</span>${TOUCH?'':'<span class="q">Press H to open or close</span>'}</span></div>`}

function mock(){const b=(a,v,l,on)=>`<button class="${on?'on':''}" data-m="${a}" data-v="${v}">${l}</button>`;
  document.getElementById('mock').innerHTML=`<b>Mockup</b>${b('page','kitchen','Kitchen',S.page==='kitchen')}${b('page','groc','Groceries',S.page==='groc')}${b('page','recipe','Recipe',S.page==='recipe')}${b('page','cook','Cook',S.page==='cook')}${b('page','shop','Shared List',S.page==='shop')}${b('page','settings','Settings',S.page==='settings')}<span class="gap"></span>${b('st','tip','First-Visit Tip',S.tip===1&&!S.open)}${b('st','tipbig','Tip Tapped',S.tip===2&&!S.open)}${b('st','closed','Closed',!S.open&&!S.dlg&&!S.tip)}${b('st','open','Help Open',S.open&&!S.dlg&&!S.peek)}${b('st','show','Show Me',S.open&&S.peek)}${b('st','dlg','Over a Dialog',S.dlg)}${b('st','coming','Words Coming',S.coming&&!S.dlg)}${b('st','comingdlg','Coming, Over a Dialog',S.coming&&S.dlg)}`}
const WAYS=[['push','A. Side Card (Page Makes Room)'],['overlay','B. Side Sheet over Everything'],['bottom','C. Bottom Sheet Everywhere'],['inline','D. Panel under the Bar'],['page','E. Its Own Page']];
const BASE_SIDE=SIDE;
function setWay(w){S.way=w;const de=document.documentElement;WAYS.forEach(([k])=>de.classList.remove('way-'+k));de.classList.add('way-'+w)}
function helpBody(h){let n=0;const see=h.see.length?`<div class="hs">What you see</div><ul>${h.see.map(it=>`<li><b>${it.b}</b>: ${it.t}</li>`).join('')}</ul>`:'';
  const dos=h.do.length?`<div class="hs">Things you can do</div><ol>${h.do.map(it=>`<li><span class="n">${++n}</span>${it.t}</li>`).join('')}</ol>`:'';
  const know=h.know.length?`<div class="hs">Good to know</div><ul>${h.know.map(it=>`<li>${it.t}</li>`).join('')}</ul>`:'';
  return `<p class="lead">${h.lead}</p>${see}${dos}${know}`}
function mock2(){const b=(k,l)=>`<button class="${S.way===k?'on':''} ${k==='push'?'pick':''}" data-way="${k}">${l}</button>`;
  document.getElementById('mock2').innerHTML=`<b>Way</b>${WAYS.map(([k,l])=>b(k,l)).join('')}<span class="gap" style="width:1px;height:18px;background:rgba(250,244,235,.25);margin:0 6px"></span><button class="${S.cmp?'on':''}" data-way="cmp">Compare the Ways</button>`}
function compareHTML(){const r=[
  ['push','A. Side card, page makes room',9,9,9,8,9,'Picked. The page stays in view and usable, so Show Me can point at it. Nothing covers the bar buttons. iPhone and iPad upright use the bottom sheet (C), because a side card would cover the whole page.'],
  ['overlay','B. Side sheet over everything',7,8,6,8,7,'Simple and familiar, but the dimmed page blocks taps: you cannot try a step while reading it, and Show Me points at something you cannot touch.'],
  ['bottom','C. Bottom sheet everywhere',6,7,7,8,8,'Right for iPhone. On a computer a sheet rising from the bottom of a wide screen wastes the width and covers the lower half of the page.'],
  ['inline','D. Panel under the bar',6,6,6,7,6,'Keeps everything on one screen, but it pushes the page down, so the page jumps and gets cramped on iPhone. Hard to keep open while you scroll.'],
  ['page','E. Its own page',7,8,5,7,5,'Most room for words, but you leave the page you are asking about: no Show Me, an extra Back, and help cannot follow you from page to page.']];
  return `<div class="cmp" role="dialog" aria-label="Compare the ways"><button class="x" data-way="cmpx" aria-label="Close">${ic('x')}</button><h3>Five ways to show How This Page Works</h3><p>My grades, 1 to 10. All five outside reviewers also picked A. Tap a way in the bar above to try it on any page.</p>
  <table><thead><tr><th>Way</th><th>Look</th><th class="hide">Fits the app</th><th>Does the job</th><th class="hide">Easy</th><th>Few steps</th><th class="hide">Why</th></tr></thead><tbody>${r.map(x=>`<tr class="${x[0]==='push'?'pick':''}"><td><b>${x[1]}</b>${PHONE?`<br><span style="color:var(--ink2);font-size:13px">${x[7]}</span>`:''}</td><td class="sc">${x[2]}</td><td class="sc hide">${x[3]}</td><td class="sc">${x[4]}</td><td class="sc hide">${x[5]}</td><td class="sc">${x[6]}</td><td class="hide">${x[7]}</td></tr>`).join('')}</tbody></table></div>`}
function render(){
  const bd=document.getElementById('hpbd');if(bd&&bd.offsetParent)S.scroll[S.lastPage||S.page]=bd.scrollTop;
  let p=PAGES[S.page]();const nf=NOFRAME();const W=S.way;
  const room=S.open&&SIDE&&W==='push';
  const H0=HELP[S.page];
  if(W==='page'&&S.open){p={bar:`<button class="bk" data-a="close" aria-label="Back to ${H0.page}">${ic('left')}${H0.page}</button>${SEP}<span class="ttl">How ${H0.page} Works</span>`,body:`<div class="hppage"><span class="ph" style="display:inline-block;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--amber-text);background:var(--amber-light);border-radius:4px;padding:2px 8px;margin-bottom:12px">Placeholder: help words come later</span>${helpBody(H0)}<div style="margin-top:20px"><button class="btn cancel" data-a="ask">Email Us</button></div></div>`}}
  const inl=W==='inline'&&S.open;
  document.getElementById('root').innerHTML=`<div class="app ${nf?'noframe':''} ${SHOPF()?'shopf':''} ${room?'room':''}" ${S.open&&!SIDE&&!S.peek?'aria-hidden="true"':''}>${nf?'':SHOPF()?header():header()+rail()}<main class="body ${inl?'inl':''}"><div class="bar"><div class="in">${p.bar}</div></div>${inl?`<section class="hpin" aria-label="How This Page Works"><div class="hd"><h2>How ${H0.page} Works</h2><button class="x" data-a="close" aria-label="Close">${ic('x')}</button></div><div class="bd">${helpBody(H0)}</div></section>`:''}<div class="scroll" id="scroll"><div class="col">${p.body}</div></div></main>${nf||SHOPF()?'':tabbar()}</div>
   ${S.dlg?`<div class="scrim ${S.open&&SIDE?'beside':''}"><div class="dlg" role="dialog" aria-modal="true" aria-label="Add Food"><div class="gb"><i></i></div><div class="dh"><h3>Add Food</h3>${opener('indlg')}${SIDE?'':`<button class="dx" data-a="dlgx" aria-label="Close">${ic('x')}</button>`}</div><p>Every sheet and dialog has the same "?" in its head, so help is never out of reach.</p><div class="fld">What did you get?</div><div class="acts"><button class="btn pri">Add It</button><button class="btn cancel" data-a="dlgx">Cancel</button></div></div></div>`:''}`;
  const pg=HELP[S.page].page;
  document.getElementById('tipbox').innerHTML=S.tip===1&&!S.open?`<div class="ptip" role="status"><div class="tb1" data-a="tipopen"><span class="lbl">${ic('help')}First time on ${pg}?</span><button class="see" data-a="tipopen">See How</button><button class="tx" data-a="tipnot" aria-label="Not now">${ic('x')}</button></div><div class="life" aria-hidden="true"><i></i></div></div>`
   :S.tip===2&&!S.open?`<div class="ptip big" role="dialog" aria-label="New to ${pg}"><button class="tx x2" data-a="tipnot" aria-label="Not now">${ic('x')}</button><h4>${ic('help')}New to ${pg}?</h4><p>A quick look at what this page is for and what you can do here.</p><div class="acts"><button class="btn sec" data-a="tipabout">How This Page Works</button><button class="btn cancel" data-a="tipsoff">Don't Show Tips Again</button></div></div>`:'';
  const hp=document.getElementById('hp');hp.innerHTML=helpHTML();
  hp.classList.toggle('open',S.open&&(W==='push'||W==='overlay'||W==='bottom'));hp.classList.toggle('peek',S.peek&&!SIDE);hp.classList.toggle('nohdr',nf);hp.classList.toggle('overdlg',!!S.dlg);document.body.classList.toggle('hpdlg',!!S.dlg&&S.open&&!SIDE&&!S.peek);
  hp.setAttribute('aria-modal',SIDE?'false':'true');
  document.getElementById('hpscrim').classList.toggle('on',S.open&&!SIDE&&!S.dlg&&!S.peek&&(W==='push'||W==='overlay'||W==='bottom'));
  document.getElementById('hpscrim').classList.toggle('side',S.open&&SIDE&&(W==='overlay'||W==='bottom'));
  document.getElementById('cmpbox').innerHTML=S.cmp?compareHTML():'';
  const nb=document.getElementById('hpbd');if(nb)nb.scrollTop=S.scroll[S.page]||0;S.lastPage=S.page;
  mock();mock2();
}
function setOpen(o){S.open=o;S.peek=false;render();
  if(o)setTimeout(()=>{const h=document.getElementById('hpt');if(h){h.setAttribute('tabindex','-1');h.focus()}},30);else (document.querySelector('[data-a="help"]')||document.body).focus()}
function toast(t,undo){const e=document.getElementById('toast');e.innerHTML=t+(undo?' <button data-a="undo" style="color:var(--hdr-text);font-weight:600;text-decoration:underline;margin-left:10px;pointer-events:auto">Undo</button>':'');e.style.pointerEvents=undo?'auto':'none';e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),undo?5000:1600)}
function spot(name){const el=document.querySelector(`[data-spot="${name}"]`);if(!el)return;
  const h=HELP[S.page];const it=[...h.see,...h.do].find(x=>x.spot===name);S.spotLine=it?(it.b?`<b>${it.b}</b>: ${it.t}`:it.t):'';
  document.querySelectorAll('.hp li.act').forEach(l=>l.classList.remove('act'));const ln=document.querySelector(`.hp li[data-line="${name}"]`);if(ln){ln.classList.add('act')}
  if(!SIDE){S.peek=true;render()}
  const t=document.querySelector(`[data-spot="${name}"]`);
  t.scrollIntoView({block:'center',behavior:'smooth'});t.classList.remove('spot-on');void t.offsetWidth;document.querySelectorAll('.spot-on').forEach(x=>x.classList.remove('spot-on'));t.classList.add('spot-on')}
document.addEventListener('click',e=>{const wy=e.target.closest('[data-way]');if(wy){const v=wy.dataset.way;if(v==='cmp')S.cmp=!S.cmp;else if(v==='cmpx')S.cmp=false;else{setWay(v);S.cmp=false;S.open=true;S.peek=false}render();return}
  const m=e.target.closest('[data-m]');
  if(m){if(m.dataset.m==='page'){S.page=m.dataset.v;S.peek=false}else{const v=m.dataset.v;S.tip=v==='tip'?1:v==='tipbig'?2:0;S.fromTip=false;S.open=!['closed','tip','tipbig'].includes(v);S.dlg=v==='dlg'||v==='comingdlg';S.coming=v==='coming'||v==='comingdlg';S.peek=false;
    if(v==='show'){S.peek=!SIDE;render();setTimeout(()=>spot(HELP[S.page].see[0].spot),60);return}}render();return}
  const a=e.target.closest('[data-a]');const go=e.target.closest('[data-go]');const sp=e.target.closest('[data-spot-to]');
  if(sp){const li=sp.closest('li');if(li&&li.classList.contains('act')){li.classList.remove('act');document.querySelectorAll('.spot-on').forEach(x=>x.classList.remove('spot-on'));return}spot(sp.dataset.spotTo);return}
  const usedSpot=e.target.closest('[data-spot]');if(usedSpot&&usedSpot.classList.contains('spot-on')){usedSpot.classList.remove('spot-on');document.querySelectorAll('.hp li.act').forEach(l=>l.classList.remove('act'));if(S.peek&&!SIDE){S.peek=false;S.open=false;render()}}
  if(go){const k={Kitchen:'kitchen',Groceries:'groc',Recipes:'recipe'}[go.dataset.go];if(k){if(S.peek){S.peek=false;S.open=false;document.querySelectorAll('.spot-on').forEach(x=>x.classList.remove('spot-on'))}S.page=k;render()}else toast(go.dataset.go+' is not in this mockup');return}
  if(!a){if(e.target.id==='hpscrim')setOpen(false);return}
  ({help:()=>{if(S.peek&&!SIDE){S.peek=false;render();return}setOpen(!S.open)},close:()=>setOpen(false),unpeek:()=>{S.peek=false;render()},tipsoffpane:()=>{S.tips=false;S.fromTip=false;render();toast('Tips are off.',true)},undo:()=>{S.tips=true;render();toast('Tips are back on.')},grab:()=>{},ask:()=>toast('Opens an email to SupperCraft help'),tipopen:()=>{S.tip=2;render()},tipnot:()=>{S.tip=0;render();toast('Tip hidden. The ? at the top always opens help.')},tipabout:()=>{S.tip=0;S.fromTip=true;setOpen(true)},tipsoff:()=>{S.tip=0;S.tips=false;S.fromTip=false;S.open=false;render();toast('Tips are off.',true)},tipsw:()=>{S.tips=!S.tips;render()},dlgx:()=>{S.dlg=false;render()}}[a.dataset.a]||(()=>{}))()});
/* the H key: only when no text box has the cursor and no modifier is held */
document.addEventListener('keydown',e=>{const t=e.target;const typing=t&&(t.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName));
  if(e.key==='Escape'&&S.open){setOpen(false);e.preventDefault();return}
  if(typing||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='h'||e.key==='H'||e.key==='?'){if(S.peek&&!SIDE){S.peek=false;render()}else setOpen(!S.open);e.preventDefault()}});
/* sheet: drag the grabber or the head down to close */
(()=>{let y0=null;document.addEventListener('pointerdown',e=>{if(e.target.closest('.hp .grab,.hp .hd'))y0=e.clientY});
  document.addEventListener('pointerup',e=>{if(y0==null)return;const d=e.clientY-y0;y0=null;if(d>60&&!SIDE)setOpen(false)})})();
setWay('push');render();
</script>
