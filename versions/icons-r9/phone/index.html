pre{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;background:var(--chip);padding:10px 12px;border-radius:8px;overflow-x:auto;margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.g2,.g3,.g4{display:grid;gap:14px}

.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.cell{border:1px solid var(--border);border-radius:8px;padding:12px;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center}
.cell .cap{font-size:13.5px;color:var(--quiet);margin-top:8px;text-align:left;width:100%}
.cell .cap b{color:var(--ink)}
.diag{width:100%;max-width:150px;height:auto;aspect-ratio:1/1;display:block}
.ok,.no,.nf{display:inline-block;font-size:12px;font-weight:700;padding:1px 7px;border-radius:4px;margin-bottom:6px;align-self:flex-start}
.ok{background:var(--sage-light);color:var(--accent)}
.no{background:var(--urgent-bg);color:var(--urgent)}
.nf{background:var(--caution-bg);color:var(--caution);border:1px dashed var(--caution)}
.sizes{display:flex;align-items:flex-end;justify-content:center;gap:12px;margin-top:8px;color:var(--ink)}
svg.i{display:inline-block;vertical-align:middle;flex:none}

.fam svg{display:block;margin:0 auto 4px;color:var(--ink)}
.rules{margin:4px 0 0;padding-left:20px}
.rules li{margin:4px 0}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{border-top:1px solid var(--border);padding:8px 8px;text-align:left;vertical-align:top}
th{font-size:12.5px;color:var(--quiet);font-weight:600;border-top:none}
.ct td{font-variant-numeric:tabular-nums}
.ct td.n{text-align:right;white-space:nowrap}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px;border:1px solid var(--border)}
.low{color:var(--bad);font-weight:700}
.ex{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.lab{font-size:12px;font-weight:700;color:var(--quiet);margin:0 0 6px}

.mbtn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:8px;background:var(--sage);font-weight:600;font-size:14px;color:var(--ink)}
.meta{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--quiet)}
.link{display:inline-flex;align-items:flex-start;gap:1px;font-size:14px;color:var(--accent);font-weight:600}
.tile{width:36px;height:36px;border-radius:8px;background:var(--chip);display:flex;align-items:center;justify-content:center;flex:none;color:var(--quiet)}
.srow{display:flex;align-items:center;gap:12px;text-align:left}
.srow b{display:block;font-size:14px}.srow span{font-size:12.5px;color:var(--quiet)}
.sbox{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border:1px solid var(--quiet);border-radius:8px;color:var(--ph);font-size:14px;min-width:180px;background:var(--card)}
.pbar{display:flex;align-items:flex-end;border-top:1px solid var(--border);background:var(--card);width:100%;max-width:360px;height:60px;position:relative;margin-top:18px;border-radius:0 0 10px 10px;box-shadow:0 0 0 1px var(--border)}
.pbar .tb{flex:1;display:flex;justify-content:center;align-items:center;height:60px}
.pbar .sh{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 8px;border-radius:8px;min-width:56px;font-size:12px;color:var(--quiet);color:var(--quiet)}
.pbar .sh svg{color:var(--quiet)}
.pbar .sh.cur{background:var(--sage-light);color:var(--accent);font-weight:500}
.pbar .sh.cur svg{color:var(--accent)}
.pbar .cap{width:76px;display:flex;justify-content:center;align-self:flex-start;margin-top:-18px}
.capbtn{width:60px;height:60px;border-radius:50%;background:var(--sage-dark);color:var(--header-text);display:inline-flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(var(--shadow),.25)}
.ibtn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:22px;color:var(--ink)}
.notice{display:flex;gap:10px;align-items:center;text-align:left;border-radius:12px;padding:10px 12px;background:var(--caution-bg);color:var(--caution);font-size:14px;border:1px solid var(--border)}
.notice .x{margin-left:auto;display:flex}
.drawer{display:grid;grid-template-columns:repeat(3,72px);gap:8px}
.dt{border:1px solid var(--border);background:var(--card);border-radius:12px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--quiet)}
.dt svg{color:var(--quiet)}
.dt.cur{background:var(--sage-light);border-color:transparent;color:var(--accent)}.dt.cur svg{color:var(--accent)}
.nop{width:84px;height:68px;border-radius:4px;background:var(--page);box-shadow:inset 0 0 0 1px var(--border);display:flex;align-items:center;justify-content:center;color:var(--ph);flex:none}
.side{display:grid;grid-template-columns:1fr 1fr;border-radius:12px;overflow:hidden;border:1px solid var(--border)}
.side>div{background:var(--page);color:var(--ink);padding:16px;min-width:0}
.side .stack{display:flex;flex-direction:column;gap:16px;align-items:stretch}
.side .hd{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--quiet);margin-bottom:12px}
.side .surf{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px}
.hr{border-top:1px dashed var(--bad);padding-top:12px}
.badc{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--card);display:flex;align-items:center;justify-content:center;flex:none}
ol,ul{margin:4px 0 8px;padding-left:22px}
li{margin:4px 0}
.qs li{margin:10px 0}
.pick{font-weight:600;color:var(--accent)}
.lesson{border:1px solid var(--border);border-radius:8px;padding:12px;min-width:0;display:flex;flex-direction:column}
.lesson>b{display:block;margin-bottom:8px}
.lesson .pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lesson .pc{display:flex;flex-direction:column;align-items:center;min-width:0}
.lesson .pc .cap{font-size:13px;color:var(--quiet);margin-top:6px;text-align:center}
.lesson .note{font-size:13.5px;color:var(--quiet);margin:10px 0 0;border-top:1px solid var(--border);padding-top:8px;margin-top:auto}
.rowcmp .odd{display:inline-flex;outline:1.5px dashed var(--quiet);outline-offset:3px;border-radius:3px}
.chipt{display:inline-flex;width:28px;height:28px;border-radius:6px;align-items:center;justify-content:center;vertical-align:middle;margin-right:8px;border:1px solid var(--border)}
.rowcmp{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;margin:2px 0}
.rowcmp .ic{display:flex;gap:10px;color:var(--ink)}
.rowcmp .t{font-size:13px;color:var(--quiet)}
.szt{display:grid;grid-template-columns:48px minmax(0,300px) minmax(0,1fr);gap:0 16px;align-items:start}
.szt>div{border-top:1px solid var(--border);padding:12px 0;min-width:0}
.szt .h{font-size:12.5px;color:var(--quiet);font-weight:600;border-top:none;padding:0 0 4px}
.szt .sz{font-weight:700;font-size:18px}
.szt .exc .ex{gap:14px 20px}
.exn{font-size:12px;color:var(--ph);display:block;margin-top:4px}
.fam2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.fbox{border:1px solid var(--border);border-radius:8px;padding:12px;min-width:0}
.fbox h3{margin:0 0 4px}
.fbox ul{padding-left:18px;margin:6px 0 0;font-size:14px}

.minute ul{margin:0}
.dark-only{display:none}

.nf.sm{font-size:12px;padding:0 6px;margin:0;align-self:center}

@media (max-width:700px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}

.ti{display:grid;grid-template-columns:28px minmax(0,1fr) 84px 92px;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--border);font-size:13.5px}
.ti .chipt{margin:0}.ti .tn b{display:block;font-size:13.5px}.ti .for{display:block;font-size:12px;color:var(--quiet);line-height:1.3}
.ti .ts{color:var(--quiet);font-size:12.5px}.ti .tv{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 24px;align-items:start}
.tiles .hr{grid-column:1/-1}
.light-only{display:inline}.th-dark .light-only{display:none}.th-dark .dark-only{display:inline}
.g3.three{grid-template-columns:repeat(3,minmax(0,1fr))!important}
.fam{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px 4px}.fam>div{width:auto}
@media (max-width:900px){.tl{grid-template-columns:1fr}}
@media (max-width:700px){.tiles{grid-template-columns:1fr}}
@media (max-width:520px){.diag{max-width:118px}.minute .icons{display:none}.ti{grid-template-columns:28px minmax(0,1fr) 70px 82px}
 .g3.three{grid-template-columns:1fr!important;gap:8px}.g3.three .cell{flex-direction:row;align-items:center;gap:12px;padding:8px 12px}.g3.three .cell .ok,.g3.three .cell .no{margin:0}.g3.three .sizes{margin:0}.g3.three .cap{margin:0;flex:1}}
/* end r7 css */
@media (max-width:520px){.src{display:none}.lesson .pc .sizes{gap:6px}}
.qt{display:block;font-size:16px;margin-bottom:4px}.qn{display:inline-block;font-size:12px;font-weight:700;color:var(--caution);background:var(--caution-bg);border-radius:4px;padding:1px 7px;margin-bottom:6px}
.pick{display:block;margin-top:6px}.tries{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center}
/* end r7b css */
@media (max-width:520px){.fam{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 8px}.g3.three .cell .ok,.g3.three .cell .no{min-width:64px;text-align:center;flex:none}}
details.bld .g3{align-items:start}.fbox table td:first-child{white-space:nowrap;padding-right:10px}
</style>
