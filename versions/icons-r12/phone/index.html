<style>
/* Colours: app src/kit/palettes/light.js and darkProof.js on origin/main (dark is a proof palette, not a designed theme). */
.th-light{--page:#EDE5D8;--card:#FAF6EE;--ink:#1E1E1C;--quiet:#54524A;--ph:#605E55;--accent:#4B6947;--sage:#8FAF8A;--sage-dark:#1F3A1C;--sage-light:#E4EDE2;
 --chip:#E4D9C6;--subbar:#E4D3B3;--sbd:#5C3D0A;--sbs:#7A5030;--caution:#5C3D0A;--caution-bg:#F5ECD8;--urgent:#5C1A1A;--urgent-bg:#F5E4E4;--gold:#C8943A;--amber-text:#7E5C22;
 --header:#6B3E14;--header-text:#FAF4EB;--border:rgba(0,0,0,.09);--grid:rgba(0,0,0,.07);--grid4:rgba(0,0,0,.16);--live:rgba(75,105,71,.13);--bad:#8E3131;--shadow:45,33,22}
.th-dark{--page:#1A1815;--card:#24211D;--ink:#EEE8DC;--quiet:#C6BFB1;--ph:#ADA698;--accent:#A3C49D;--sage:#4A6646;--sage-dark:#2F5A2A;--sage-light:#22301F;
 --chip:#3A3329;--subbar:#2E2619;--sbd:#E3C99A;--sbs:#CDB08C;--caution:#EBCB92;--caution-bg:#30271A;--urgent:#F2C0C0;--urgent-bg:#3A1E1E;--gold:#D9A54B;--amber-text:#E0B56A;
 --header:#3A220C;--header-text:#F3EBDD;--border:rgba(255,255,255,.12);--grid:rgba(255,255,255,.08);--grid4:rgba(255,255,255,.18);--live:rgba(163,196,157,.13);--bad:#C46A6A;--shadow:0,0,0}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--page);color:var(--ink);font-size:15px;line-height:1.45;overflow-x:hidden}
.hdr{background:var(--header);color:var(--header-text);height:52px;display:flex;align-items:center;padding:0 20px;
 background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 2px,transparent 2px 7px),repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 9px)}

table{border-collapse:collapse;width:100%;font-size:14px}
td,th{border-top:1px solid var(--border);padding:8px 8px;text-align:left;vertical-align:top}

.pbar .sh svg{color:var(--quiet)}

.capbtn{width:60px;height:60px;border-radius:50%;background:var(--sage-dark);color:var(--header-text);display:inline-flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(var(--shadow),.25)}

.hr{border-top:1px dashed var(--bad);padding-top:12px}
.badc{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--card);display:flex;align-items:center;justify-content:center;flex:none}
ol,ul{margin:4px 0 8px;padding-left:22px}
li{margin:4px 0}
.qs li{margin:10px 0}
.pick{font-weight:600;color:var(--accent)}
.lesson{border:1px solid var(--border);border-radius:8px;padding:12px;min-width:0;display:flex;flex-direction:column}

.lesson .note{font-size:13.5px;color:var(--quiet);margin:10px 0 0;border-top:1px solid var(--border);padding-top:8px;margin-top:auto}
.rowcmp .odd{display:inline-flex;outline:1.5px dashed var(--quiet);outline-offset:3px;border-radius:3px}
.chipt{display:inline-flex;width:28px;height:28px;border-radius:6px;align-items:center;justify-content:center;vertical-align:middle;margin-right:8px;border:1px solid var(--border)}
.rowcmp{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;margin:2px 0}
.rowcmp .ic{display:flex;gap:10px;color:var(--ink)}
.rowcmp .t{font-size:13px;color:var(--quiet)}
.szt{display:grid;grid-template-columns:48px minmax(0,300px) minmax(0,1fr);gap:0 16px;align-items:start}
.szt>div{border-top:1px solid var(--border);padding:12px 0;min-width:0}
.szt .h{font-size:12.5px;color:var(--quiet);font-weight:600;border-top:none;padding:0 0 4px}
.szt .sz{font-weight:700;font-size:18px}
.szt .exc .ex{gap:14px 20px}
.exn{font-size:12px;color:var(--ph);display:block;margin-top:4px}
.fam2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.fbox{border:1px solid var(--border);border-radius:8px;padding:12px;min-width:0}
.fbox h3{margin:0 0 4px}
.fbox ul{padding-left:18px;margin:6px 0 0;font-size:14px}
.minute{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:start}
.minute ul{margin:0}
.dark-only{display:none}
@media (max-width:900px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3.lessons{grid-template-columns:1fr}.minute{grid-template-columns:1fr}}
@media (max-width:700px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g3.one{grid-template-columns:1fr}.fam2,.g2{grid-template-columns:1fr}
 .szt{grid-template-columns:36px minmax(0,1fr)}.szt .h3{display:none}.szt .exc{grid-column:2;border-top:none;padding-top:0}
 .side{grid-template-columns:1fr}}

 .fam>div{width:62px}}
.nf.sm{font-size:12px;padding:0 6px;margin:0;align-self:center}
.qcard .qrow{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:center;padding:14px 0;border-top:1px solid var(--border)}
.qcard h2+.qrow{border-top:none;padding-top:4px}
.qpic{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:transparent}
.opt{border:1px solid var(--border);border-radius:8px;padding:10px;background:var(--card);min-width:0;color:var(--ink)}
.opt .lab{margin-bottom:8px}
.onc{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--ink)}
.es{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:14px}
.es b{font-size:14px}.es.sm{flex-direction:row;gap:12px}
.eic{display:flex;align-items:center;justify-content:center;width:72px;height:60px;border-radius:4px;background:var(--card);box-shadow:0 1px 2px rgba(var(--shadow),.12),0 3px 8px rgba(var(--shadow),.14),0 0 0 1px var(--border);color:var(--ph)}
.mbtn.sm{min-height:36px;font-size:13px;padding:0 12px;gap:6px}
.tcell{display:flex;align-items:flex-start;gap:8px}.tcell .chipt{margin:0;flex:none}
.cell.st{align-items:stretch;text-align:left;gap:6px}.cell.st .cap{margin-top:4px}
details.bld summary{cursor:pointer;list-style:none}details.bld summary::-webkit-details-marker{display:none}
details.bld summary h2::before{content:"\25B8  ";color:var(--quiet)}details.bld[open] summary h2::before{content:"\25BE  "}
@media (max-width:900px){.qcard .qrow{grid-template-columns:1fr;gap:12px}}
@media (max-width:700px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 24px;margin:4px 0 8px}
.ti{display:grid;grid-template-columns:28px minmax(0,1fr) 84px 92px;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--border);font-size:13.5px}
.ti .chipt{margin:0}.ti .tn b{display:block;font-size:13.5px}.ti .for{display:block;font-size:12px;color:var(--quiet);line-height:1.3}
.ti .ts{color:var(--quiet);font-size:12.5px}.ti .tv{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 24px;align-items:start}
.tiles .hr{grid-column:1/-1}
.light-only{display:inline}.th-dark .light-only{display:none}.th-dark .dark-only{display:inline}
.g3.three{grid-template-columns:repeat(3,minmax(0,1fr))!important}
.fam{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px 4px}.fam>div{width:auto}
@media (max-width:900px){.tl{grid-template-columns:1fr}}
@media (max-width:700px){.tiles{grid-template-columns:1fr}}
@media (max-width:520px){.diag{max-width:118px}.minute>div{display:contents}.minute .icons{order:-1;margin-bottom:4px}.ti{grid-template-columns:28px minmax(0,1fr) 70px 82px}
 .g3.three{grid-template-columns:1fr!important;gap:8px}.g3.three .cell{flex-direction:row;align-items:center;gap:12px;padding:8px 12px}.g3.three .cell .ok,.g3.three .cell .no{margin:0}.g3.three .sizes{margin:0}.g3.three .cap{margin:0;flex:1}}

.qt{display:block;font-size:16px;margin-bottom:4px}.qn{display:inline-block;font-size:12px;font-weight:700;color:var(--caution);background:var(--caution-bg);border-radius:4px;padding:1px 7px;margin-bottom:6px}
.pick{display:block;margin-top:6px}.tries{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center}
/* end r7b css */

details.bld .g3{align-items:start}.fbox table td:first-child{white-space:nowrap;padding-right:10px}
/* r10: T-2147 menu pictures (colour cut in light, plain cut in dark) */
.mpic{vertical-align:middle;flex:none;line-height:0}.mpic svg{display:block;width:100%;height:100%;margin:0}
.fam .mpic{display:block;margin:0 auto 4px}.fam .mpic svg{margin:0}
.old{opacity:.75}.old .fam svg{color:var(--quiet)}

.rail .ri{display:flex;align-items:center;gap:10px;height:36px;padding:0 9px;border-radius:8px;font-size:14px;color:var(--quiet)}

.mpic{display:inline-block}
.rail .rcap{display:flex;align-items:center;gap:10px;height:44px;padding:0 12px;border-radius:8px;background:var(--sage-dark);color:var(--header-text);font-weight:600;font-size:14px;margin-bottom:4px}

.drawer{grid-template-columns:repeat(3,minmax(0,84px))}
.rule11{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);background:var(--sage-light);border-radius:4px;padding:0 6px;margin-left:4px;vertical-align:1px;white-space:nowrap}

<div class="hdr"><span class="wm">SupperCraft</span></div>
<div class="tan"><span class="t">Icon style sheet</span><span class="sub">r12 · for your OK</span>
 <div class="seg" id="seg"><button data-th="light" class="on">Light</button><button data-th="dark">Dark (proof)</button></div></div>
<div class="wrap" id="w"></div>
