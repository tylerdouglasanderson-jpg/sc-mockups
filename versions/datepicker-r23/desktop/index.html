<script>
/* SupperCraft date picker mockup (App Walkthrough 6, T-2154). Tyler asked for it 11-26 20:19; NOT agreed yet.
   Full-screen mode for the review links: window.SC_FULL = desktop | ipad | phone, or ?full=ipad by hand. No bezel. */
window.FULL=window.SC_FULL||new URLSearchParams(location.search).get('full')||'';
if(window.FULL)document.documentElement.classList.add('full','full-'+window.FULL);
</script>

*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--page)}
body{color:var(--ink);font:400 15px/1.45 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden;font-variant-numeric:tabular-nums;text-wrap:pretty}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input{font:inherit;color:inherit}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:16px;height:16px}
:focus-visible{outline:2px solid var(--sage-text);outline-offset:2px}
[hidden]{display:none!important}
/* ONE themed scroll bar for every scroller (DESIGN 4.10) */
/* ONE themed scroll bar for EVERY scroller, set once here for the whole page (DESIGN 4.10; round 33 / picker 18, Tyler
   11-27 11:18: "we need to sweep everywhere and use ... *our* scroll bar"). Chrome and Safari draw our 6 px rounded thumb
   in a 12 px gutter, no arrows. Firefox (no ::-webkit-scrollbar) gets the thin bar in the same colours. The standard
   scrollbar-width / scrollbar-color are kept OFF in Chrome on purpose: once set, Chrome draws its own system bar instead. */
*::-webkit-scrollbar{width:12px;height:12px;background:transparent}
*::-webkit-scrollbar-thumb{background:rgb(var(--c-muted) / .35);border:3px solid transparent;background-clip:padding-box;border-radius:999px;min-height:32px}
*::-webkit-scrollbar-thumb:hover{background-color:rgb(var(--c-ink2) / .7)}
*::-webkit-scrollbar-thumb:active{background-color:rgb(var(--c-ink2) / .85)}
*::-webkit-scrollbar-track,*::-webkit-scrollbar-corner{background:transparent}
*::-webkit-scrollbar-button{display:none;width:0;height:0}
@supports not selector(::-webkit-scrollbar){*{scrollbar-width:thin;scrollbar-color:rgb(var(--c-muted) / .35) transparent}}
/* (round 19, panel 7 visual 6) a phone shows its own thin overlay bar, not a 12 px desktop gutter: the mockup draws a
   6 px stand-in (4 px thumb) so a full-bleed phone page keeps its width */
@media (max-width:640px){*::-webkit-scrollbar{width:6px;height:6px}*::-webkit-scrollbar-thumb{border-width:1px;min-height:24px}}

.top{position:relative}
.top::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--wood-sheen-top),var(--wood-sheen-bottom));pointer-events:none}
.wordmark{font-style:italic;font-weight:600;font-size:22px;position:relative}
.top .sp{flex:1}
.av{display:inline-grid;place-items:center;border-radius:50%;font-weight:600;color:var(--hdr-text);flex:none}
.av.hdr{width:28px;height:28px;font-size:12px;background:var(--member-1);box-shadow:0 0 0 2px var(--hdr-text);position:relative}
.rail{background:var(--card);border-right:1px solid var(--bcard);padding:12px 8px;display:flex;flex-direction:column;gap:4px;min-height:0}
.rail .cap{height:44px;border-radius:8px;background:var(--sage);color:var(--ink);display:flex;align-items:center;gap:8px;padding:0 12px;font-weight:500;font-size:16px;margin-bottom:8px}
.rail .ri{display:flex;align-items:center;gap:12px;height:44px;border-radius:8px;padding:0 12px;color:var(--ink2);font-weight:500;font-size:16px;text-align:left;flex:none}
.rail .ri svg.i,.rail svg.ni{width:24px;height:24px;flex:none}
svg.ni{display:block;overflow:visible}
.rail .ri.on{background:var(--sage-light);color:var(--sage-text)}
.rail hr{border:0;border-top:1px solid var(--bcard);margin:4px 8px}
.rail .grow{flex:1}
@media (hover:hover){.rail .ri:hover,.rail .cap:hover{box-shadow:var(--hover)}}
.body{display:grid;grid-template-rows:46px 1fr;min-height:0;min-width:0;position:relative}
.bar{background:var(--subbar);border-bottom:1px solid var(--brow);position:relative;display:flex;z-index:5}
.bar .in{display:flex;align-items:center;gap:12px;width:100%;max-width:1212px;margin:0 auto;padding:0 16px;min-width:0}
.bar .ttl{font-weight:600;font-size:16px;color:var(--subbar-date);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bar .meta{font-size:13px;color:var(--subbar-2);padding-left:12px;border-left:1px solid var(--chip-warm-edge);white-space:nowrap}
.bar .sp{flex:1}
.bar .crumb{font-weight:600;font-size:16px;color:var(--subbar-2);white-space:nowrap}
.bar .sepc{color:var(--subbar-2);flex:none;display:flex}
.back{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--subbar-date);margin-left:-8px;flex:none}
/* (round 22, Tyler 11-27 15:22, STANDARDS) the tan bar's back is one text button, "‹ Kitchen", then a thin vertical line
   and the page's own name; never a lone arrow (Kitchen v3's .back.word, the same rule) */
.back.word{width:auto;padding:0 10px 0 4px;gap:2px;display:inline-flex;align-items:center;font-weight:500;font-size:16px;white-space:nowrap;color:var(--subbar-2)}
/* (round 23, picker panel 11 fit 6; STANDARDS "Back in the tan bar", agreed 16:59) "‹ Kitchen › Spinach": the back words quieter than the page name */
.back.word~.ttl{font-style:italic}.back.word+.sepc{opacity:.6}
.bar .sepc.vl{width:1px;height:20px;background:var(--chip-warm-edge);margin:0 4px}
.scroll{overflow:auto;min-height:0;overscroll-behavior:contain}

/* kit Button: 44 tall, rounded rectangle (radius 8), never a pill */
.btn{height:44px;border-radius:8px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:500;font-size:16px;white-space:nowrap;transition:transform 50ms var(--ease),box-shadow .2s var(--ease);position:relative;flex:none}
.btn:active{transform:scale(.97);box-shadow:var(--press)}
.btn.pri{background:var(--sage-dark);color:var(--hdr-text)}
.btn.sec{background:var(--sage);color:var(--ink)}
.btn.cancel{background:transparent;border:1px solid var(--ink2);color:var(--ink)}
.btn.tan{background:var(--chip-warm);border:1px solid var(--chip-warm-edge);color:var(--ink)}
.bar .btn{height:36px;padding:0 14px;font-size:15px}
@media (hover:hover){.btn.sec:hover,.btn.cancel:hover,.btn.tan:hover{box-shadow:var(--hover)}.btn.pri:hover{box-shadow:inset 0 0 0 100px var(--on-dark-hover)}}
.card{background:var(--card);border-radius:12px;border:1px solid var(--bcard);box-shadow:var(--shadow-card)}
.eyebrow{font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
/* kit Chip (radius 8, never pills) */
.chip{height:44px;border-radius:8px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:15px;color:var(--ink);background:var(--chip);border:1px solid transparent;font-weight:600;white-space:nowrap;transition:transform 50ms var(--ease),background .2s var(--ease)}
.chip:active{transform:scale(.97);box-shadow:var(--press)}
@media (hover:hover){.chip:hover{box-shadow:var(--hover)}}
.chip.on{background:var(--chip-on);border-color:var(--sage-text);font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.tag{font-size:13px;font-weight:600;color:var(--ink);background:var(--chip);border-radius:8px;padding:1px 8px;white-space:nowrap;display:inline-block;line-height:20px}

/* ---------- page layout ---------- */
.wrap{max-width:1212px;margin:0 auto;padding:24px 16px 48px;display:grid;grid-template-columns:minmax(0,1fr) 392px;gap:24px;align-items:start}
.wrap.one{grid-template-columns:minmax(0,720px);justify-content:center}
/* the Kitchen list (folder tabs look D, simplified for this mockup) */
.ftabs{display:flex;align-items:flex-end;height:40px;padding:0 24px;gap:2px;overflow:hidden}
@media (max-width:640px){.ftabs{padding:0 8px}.ftab{padding:0 12px}}
.ftab{height:38px;padding:0 18px;border-radius:10px 10px 0 0;background:var(--folder-2);font-size:15px;font-weight:600;color:var(--folder-ink);display:flex;align-items:center;gap:6px;border:1px solid var(--folder-line);border-bottom:0}
.ftab.on{background:var(--card);height:40px;color:var(--sage-text)}
.ftab .n{font-size:13px;font-weight:500;opacity:.8}
.lcard{border-radius:12px;overflow:hidden;position:relative}
.lhead{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--brow)}
.lhead b{font-weight:600}
.ph{display:flex;align-items:center;gap:8px;padding:12px 20px;background:var(--alert);font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.ph.plain{background:none}
.row{display:flex;align-items:center;gap:12px;padding:10px 20px;border-top:1px solid var(--brow);min-height:58px}
.row.soon{background:var(--alert)}
.row.on{background:var(--sage-light)}
.row .nm{font-size:16px;font-weight:500}.row .nm small{font-size:13px;color:var(--ink2);font-weight:400;margin-left:0}
/* (round 22) the name and its place: a thin vertical line between them (STANDARDS "Separators are vertical lines") */
.row .nm small::before{content:"";display:inline-block;width:1px;height:.9em;background:currentColor;opacity:.4;margin:0 .5em;vertical-align:-.08em}
.row .sub{display:block;font-size:13px;color:var(--ink2)}
.row .sp{flex:1}
.row .r{font-size:15px;font-weight:600;color:var(--amber-text)}.row .r.now{color:var(--urgent-text)}.row .r.q{color:var(--ink);font-weight:500}
/* item pane (Kitchen side pane / narrow item page) */
.pane{padding:20px 20px 8px}
.pane .hd{display:flex;align-items:flex-start;gap:12px}
.pane .hd h2{margin:2px 0 0;font-size:24px;font-weight:600;line-height:1.25}
.pane .x,.ccard .x{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;color:var(--ink2);margin:-8px -10px 0 auto;flex:none}
.tipb{display:flex;gap:10px;align-items:center;background:var(--alert);border-radius:8px;padding:12px 16px;margin:14px 0 6px;font-size:15px}
.tipb b{font-weight:600}
.fact{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--brow)}
.fact .k{display:block;font-size:13px;color:var(--ink2)}
.fact .v{display:block;font-size:16px;font-weight:600;margin-top:2px}.fact .v small{display:block;font-size:13px;font-weight:400;color:var(--ink2)}
.fact>.btn{width:144px}
.fact>.btn.open{box-shadow:inset 0 0 0 1px var(--chip-warm-edge)}
.fact .ipanel{grid-column:1/-1;margin:8px 0 4px}
.facts2{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 0;border-top:1px solid var(--brow)}
.facts2 .btn{width:100%}
/* kit inline panel (C5), as Kitchen's Change Date */
.ipanel{background:var(--panel);border:1px solid var(--bcard);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.ipanel .q{font-size:15px;font-weight:600}
.ipanel .q .qsub{display:block;font-size:13px;font-weight:400;color:var(--ink2);margin-top:2px}
.ipanel .say{font-size:13px;color:var(--ink2)}
.ipanel .acts{display:flex;gap:8px;justify-content:flex-end}
.ipanel .acts .btn{min-width:96px}
/* the hand form (Kitchen "Type It by Hand") */
.ccard{padding:16px 20px 20px}
.hfhd{display:flex;align-items:center;margin:-4px 0 8px}
.hfhd h3{flex:1;margin:0;font-size:16px;font-weight:600}
.hform{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px 16px;align-items:center}
.hform>.lab{font-size:13px;color:var(--ink2);font-weight:500}
.hform .field{display:flex;align-items:center;height:52px;border:1px solid var(--ink2);border-radius:8px;background:var(--card);padding:0 16px}
.hform .field input{flex:1;border:0;outline:none;background:none;font-size:16px;min-width:0}
.hform .acts{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.stepper{display:inline-flex;align-items:center;height:44px;border:1px solid var(--ink2);border-radius:8px;background:var(--card)}
.stepper button{width:44px;height:42px;display:grid;place-items:center;color:var(--ink2)}
.stepper span{width:62px;text-align:center;font-size:16px;border-left:1px solid var(--brow);border-right:1px solid var(--brow);line-height:42px}
.sel{height:44px;border-radius:8px;background:var(--card);padding:0 12px 0 16px;display:inline-flex;align-items:center;gap:4px;font-size:15px;font-weight:600;color:var(--ink);border:1px solid var(--folder-line,var(--bcard));white-space:nowrap;margin-left:12px}
.hform .rawn{align-self:center;font-size:13px;color:var(--ink2);white-space:nowrap;padding-left:8px}
.hdwrap{display:flex;flex-direction:column;gap:10px;min-width:0}
.hdread{font-size:16px;font-weight:500;min-height:23px}.hguess{font-size:13px;color:var(--muted);font-weight:400}
/* Plan week list */
.dayrow{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 20px;border-top:1px solid var(--brow);min-height:60px}
.dayrow:first-of-type{border-top:0}
.dayrow .dn{font-size:13px;color:var(--ink2)}.dayrow .dn b{display:block;font-size:15px;color:var(--ink);font-weight:600}
.dayrow .meal{font-size:16px;font-weight:500}.dayrow .meal small{display:block;font-size:13px;color:var(--ink2);font-weight:400}
.dayrow.today{background:var(--sage-light)}
.dayrow.open{background:var(--panel-alt)}
.dayrow .ipanel{grid-column:1/-1;margin:4px 0 6px}
.lede{font-size:15px;color:var(--ink2);margin:0 0 16px}
h1.pt{font-size:28px;font-weight:600;margin:0 0 4px;line-height:1.2}

/* Kitchen's side pane scrolls on its own under the food's sticky name (as in Kitchen v3) */
/* (round 19, panel 7) the pane's scroll bar sits on its LEFT edge (direction rtl; its contents stay left to right), so
   it never runs beside the page's bar at the window edge; its height is the real scroll box's (--sh, set on render),
   so Cancel and Save Date are never cut at the window's foot */
/* (round 20) its 12 px gutter is always kept (no width jump) and hugs the card, so the bar reads as the pane's (Kitchen r35) */
.side{position:sticky;top:24px;max-height:calc(var(--sh,100dvh) - 48px);overflow:auto;overscroll-behavior:contain;padding:2px 8px 8px 2px;margin:-2px -8px 0 -2px;direction:rtl;scrollbar-gutter:stable}
.side>*{direction:ltr}
@media (min-width:1101px){.wrap:has(>.side){padding-bottom:24px}}
.side .pane .hd{position:sticky;top:-2px;z-index:3;background:var(--card);margin:-20px -20px 0;padding:20px 20px 8px;border-radius:12px 12px 0 0}
.side .pane .hd.stuck{box-shadow:0 1px 0 var(--bcard);border-radius:12px 12px 0 0}
.side .pane .hd.stuck::before,.side .pane .hd.stuck::after{content:"";position:absolute;top:0;width:13px;height:13px;pointer-events:none}
.side .pane .hd.stuck::before{left:-1px;background:radial-gradient(circle at 13px 13px,transparent 11.5px,var(--bcard) 11.5px,var(--bcard) 12.5px,var(--page) 12.5px)}
.side .pane .hd.stuck::after{right:-1px;background:radial-gradient(circle at 0 13px,transparent 11.5px,var(--bcard) 11.5px,var(--bcard) 12.5px,var(--page) 12.5px)}

/* ==== inlined from components/date_picker/dp.css (edit that file, never this copy) ==== */
/* ================= THE DATE PICKER (B4), the ONE shared part =================
   This block is the standard's look. The date picker mockup AND Kitchen v3 are built from this one file
   (scratch datepicker/dp.css, inlined by both build.py), so they can never look different. */
/* the three colours this part adds to the kit's tokens (BRIEF "For the app build") */
:root{--dp-off:#8C897F;--dp-strike:rgba(84,82,74,.6);--dp-dim:rgba(45,33,22,.12)}
/* 1. The date field: one outline (the kit field, 52 tall), the typed box on the left and the Calendar button on the
   right, split by one thin line. Focus and error colour the whole outline, the split line too. */
.dgrp{display:flex;align-items:stretch;width:100%;max-width:308px;height:52px;border:1px solid var(--ink2);border-radius:8px;background:var(--card);position:relative;transition:box-shadow .2s var(--ease),border-color .2s var(--ease)}
/* in a form the field fills the form's column, like Name (a change panel keeps it at 308) */
.dgrp.dp-full{max-width:none}
.dgrp:has(input:focus){border-color:var(--sage-text);box-shadow:0 0 0 1px var(--sage-text)}
.dgrp.dp-bad,.dgrp.dp-bad:has(input:focus){border-color:var(--urgent-text);box-shadow:0 0 0 1px var(--urgent-text)}
.dgrp:has(input:focus) .dpbtn{border-left-color:var(--sage-text)}.dgrp.dp-bad .dpbtn,.dgrp.dp-bad:has(input:focus) .dpbtn{border-left-color:var(--urgent-text)}
.dgrp .dfield{display:flex;align-items:center;flex:1;min-width:0;height:auto;max-width:none;border:0;border-radius:7px 0 0 7px;padding:0 14px;gap:0;background:none;transition:background .2s var(--ease)}
.dgrp .dfield:focus-within{border:0;padding:0 14px}
.dgrp .dfield input{flex:1;min-width:0;border:0;outline:none;background:none;font-size:16px;height:100%;color:var(--ink)}
.dgrp .dfield input::placeholder{color:var(--muted)}
/* the iPad type tier (as the pages' other fields) */
.dev-ipad .dgrp .dfield input{font-size:17px}
.dpbtn{flex:none;display:flex;align-items:center;gap:6px;padding:0 14px 0 12px;border-left:1px solid var(--ink2);border-radius:0 7px 7px 0;background:var(--chip-warm);color:var(--subbar-date);font-size:15px;font-weight:600;position:relative;transition:background .2s var(--ease),color .2s var(--ease),border-color .2s var(--ease)}
.dpbtn svg.i{width:20px;height:20px;color:currentColor}
.dpbtn:active{box-shadow:var(--press)}
@media (hover:hover){.dpbtn:hover{box-shadow:var(--hover)}}
/* open: a light green tint (not a fill), so the page's Save stays the loudest green */
.dpbtn[aria-expanded=true]{background:var(--sage-light);color:var(--sage-dark)}
/* the button's focus ring stays inside the button, never across the split into the box */
.dpbtn:focus-visible,.dpbtn.dp-kf{outline:none;box-shadow:inset 0 0 0 2px var(--sage-text)}
/* compact (Kitchen's phone bottom-bar hand form only): 44 tall, the button shows only its icon (44 wide) */
.dgrp.dp-sm{height:44px}.dgrp.dp-sm .dpbtn{width:44px;padding:0;justify-content:center}.dgrp.dp-sm .dpbtn .dp-lb{display:none}
/* the confirm flash after a calendar pick (700 ms: green, held 35%, then back) */
.dgrp.dp-flash .dfield{animation:dpflash .7s var(--ease)}
@keyframes dpflash{0%,35%{background:var(--chip-on)}100%{background:transparent}}
/* a picked date not saved yet keeps a light green box until the page's Save (the Save itself stays sage) */
.dgrp.dp-dirty .dfield{background:var(--sage-light)}
.dgrp.dp-dirty.dp-flash .dfield{animation-name:dpflashd}
@keyframes dpflashd{0%,35%{background:var(--chip-on)}100%{background:var(--sage-light)}}
/* the read-out under the field: one line, the same form on every page */
.dread{display:block;font-size:13px;color:var(--ink2);margin-top:-4px;min-height:19px;text-wrap:pretty}
.dread.dp-bad{color:var(--urgent-text);font-weight:600}
.dread .dp-pend{color:var(--sage-text);font-weight:600;white-space:nowrap}
.dread .dp-why{color:var(--muted)}.dread .dp-nw{white-space:nowrap}
.dread.dp-hint{color:var(--muted)}
.dev-ipad .dread{font-size:14px}
/* 2. Our calendar: a popover on computer and iPad, a bottom sheet on the phone. Same parts in both. */
.dp{--cw:44px;--ch:44px;--gap:2px;--pad:12px;position:fixed;z-index:80;background:var(--card);border:1px solid var(--bcard);border-radius:12px;box-shadow:var(--shadow-float);padding:8px var(--pad) 4px;width:calc(var(--cw)*7 + var(--gap)*6 + var(--pad)*2 + 2px);transform-origin:top left;color:var(--ink);font-size:15px;line-height:1.45}
.dp[hidden]{display:none}
.dp.dp-up{transform-origin:bottom left}
/* (round 18, Tyler 11-27 11:18: "it needs to pop up above everything") the calendar and its dim live in the page's TOP
   LAYER (popover="manual", shown from the page root), so no column, side pane, sheet, dialog or clipped box can hold it
   in or draw over it. These undo the browser's own popover look (centred, bordered, scrolling) so ours shows. */
.dp[popover],.dpscrim[popover]{margin:0;overflow:visible;color:var(--ink)}
.dp[popover]{inset:auto;height:auto}
.dpscrim[popover]{border:0;padding:0;width:auto;height:auto}
/* beside a right-hand side pane (computer, sideways iPad): it grows out from the pane's edge, level with the date */
.dp.dp-beside{transform-origin:top right}
/* iPad: wider days for fingers (48), rows stay 44 so the calendar fits under the date on an upright iPad */
.dev-ipad .dp{--cw:48px;--ch:44px}
.dph{display:flex;align-items:center;gap:4px;margin:0 -2px 4px 0}
/* the month name is a real (tan) button: tap it for the months */
.dpm{height:44px;border-radius:8px;padding:0 10px 0 12px;display:inline-flex;align-items:center;gap:6px;font-size:16px;font-weight:600;color:var(--ink);white-space:nowrap;background:var(--chip-warm);border:1px solid var(--chip-warm-edge);min-width:0}
.dpm svg{color:var(--ink2);transition:transform .2s var(--ease);flex:none}
.dpm[aria-expanded=true]{background:var(--sage-light);border-color:var(--sage-text)}
.dpm[aria-expanded=true] svg{transform:rotate(180deg)}
/* month view: the range name is longer, so it sets a little smaller; the arrows and the close x never move */
.dp.dp-mview .dpm{font-size:14px;padding:0 8px 0 10px;gap:4px}
.dph .dp-sp{flex:1}
.dpn{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;color:var(--ink2);flex:none}
.dpn:disabled{opacity:.45;cursor:default}
@media (hover:hover){.dpm:hover,.dpn:not(:disabled):hover,.dptoday:hover{box-shadow:var(--hover)}}
.dpm:active,.dpn:not(:disabled):active,.dptoday:active{box-shadow:var(--press)}
/* the day area runs out to the calendar's edges, so a sliding month is never cut inside the padding */
.dpbody{height:calc(var(--ch)*6 + var(--gap)*5 + 24px);position:relative;overflow:hidden;margin:0 calc(var(--pad)*-1);padding:0 var(--pad)}
.dpview{position:absolute;top:0;bottom:0;left:var(--pad);right:var(--pad)}
.dpview.dp-d{top:24px}
.dpwk{display:grid;grid-template-columns:repeat(7,var(--cw));column-gap:var(--gap);height:24px;align-items:center;transition:opacity .2s var(--ease)}
.dpwk span{text-align:center;font-size:13px;font-weight:500;color:var(--muted)}
.dpbody.dp-months .dpwk{opacity:0}
.dpgrid{border-collapse:separate;border-spacing:var(--gap);margin:calc(var(--gap)*-1);table-layout:fixed;width:calc(var(--cw)*7 + var(--gap)*8)}
/* real column headers for screen readers: the cells stay in the table, their words are visually hidden (no font-size 0) */
.dpgrid thead th{padding:0;height:0;border:0}
.dpgrid td{width:var(--cw);height:var(--ch);padding:0;text-align:center;vertical-align:middle;border-radius:8px;font-size:15px;font-weight:500;color:var(--ink);cursor:pointer;position:relative;transition:background .2s var(--ease)}
/* each day and month is a native button inside its grid cell (VoiceOver reads it as a button) */
.dpgrid td>button,.dpmonths td>button{display:block;width:100%;height:100%;border-radius:8px;font:inherit;color:inherit;text-decoration:inherit;outline-offset:-3px;cursor:inherit;background:none;border:0;padding:0}
.dev-ipad .dpgrid td{font-size:17px}
/* days of the month before and after: smaller and muted, still pickable (fills the sixth row; Dec 1 from late Nov) */
.dpgrid td.dp-o{color:var(--muted);font-weight:400;font-size:13px}
.dev-ipad .dpgrid td.dp-o,.dp.dpsheet .dpgrid td.dp-o{font-size:15px}
.dpgrid td.dp-today{font-weight:700}
.dpgrid td.dp-today::after{content:"";position:absolute;left:50%;bottom:5px;width:18px;height:3px;margin-left:-9px;border-radius:2px;background:var(--sage-text)}
/* picked: the kit Chip's selected look exactly (chip-on fill, 1 px selected-border edge, bold); it lands at once
   (no fade), so the 80 ms beat before the close shows it solid */
.dpgrid td.dp-pk{background:var(--chip-on);box-shadow:inset 0 0 0 1px var(--sage-text);font-weight:700;color:var(--ink);transition:none}
/* today that is also picked: the bar goes full ink, so "which day is today" still reads inside the green */
.dpgrid td.dp-pk.dp-today::after{background:var(--sage-dark);width:22px;margin-left:-11px}
/* off: readable (about 3:1) and crossed out, so it never leans on colour alone */
.dpgrid td.dp-off{color:var(--dp-off);font-weight:400;text-decoration:line-through;text-decoration-thickness:1px;text-decoration-color:var(--dp-strike);cursor:default}
@media (hover:hover){.dpgrid td:not(.dp-off):not(.dp-pk):hover{box-shadow:var(--hover)}.dpgrid td.dp-pk:hover{box-shadow:inset 0 0 0 1px var(--sage-text),var(--hover)}}
.dpgrid td:not(.dp-off):active{box-shadow:var(--press)}
/* keyboard focus: a dark ring, shown only when the keyboard is in use (never on a touch or mouse open) */
.dpgrid td>button:focus,.dpmonths td>button:focus{outline:none}
.dp.dp-kbd .dpgrid td>button:focus,.dpgrid td.dp-kf>button,.dp.dp-kbd .dpmonths td>button:focus,.dpmonths td.dp-kf>button{outline:2px solid var(--ink);outline-offset:-3px}
/* month view: the next 12 months (a history field: the last 12), each saying how far it is */
.dpmonths{border-collapse:separate;border-spacing:6px;margin:-6px;width:calc(100% + 12px);height:calc(100% + 12px);table-layout:fixed}
/* (round 23, picker panel 11 visual 6) 10 px under the range button, as the weekday row gives the days, from the tiles' height */
.dpbody.dp-months .dpmonths{margin-top:0;height:calc(100% + 6px)}
/* (round 21, picker panel 9 visual 2) a month you can pick is the strongest tile: the warm chip fill and its edge; a
   crossed-out month keeps only a faint outline */
.dpmonths td{border-radius:8px;text-align:center;vertical-align:middle;cursor:pointer;background:var(--chip-warm);box-shadow:inset 0 0 0 1px var(--chip-warm-edge);padding:0;position:relative}
.dpmonths td b{display:block;font-size:16px;font-weight:600;white-space:nowrap}
.dpmonths td small{display:block;font-size:13px;color:var(--ink2);margin-top:3px;white-space:nowrap}
/* the computer popover's month tiles are 102 wide: their "how far" sets at 12, so "in about 1½ years" keeps side room */
.dp:not(.dpsheet) .dpmonths td small{font-size:12px}.dev-ipad .dp .dpmonths td small{font-size:12px}
.dpmonths td.dp-now::after{content:"";position:absolute;left:50%;bottom:6px;width:18px;height:3px;margin-left:-9px;border-radius:2px;background:var(--sage-text)}
.dpmonths td.dp-pk{background:var(--chip-on);box-shadow:inset 0 0 0 1px var(--sage-text);transition:none}
/* this month and picked: the same full-ink, wider bar as a day */
.dpmonths td.dp-pk.dp-now::after{background:var(--sage-dark);width:22px;margin-left:-11px}
/* (round 20, picker panel 8 visual 5) a crossed-out month keeps its tile's outline, so its line never runs into the next */
.dpmonths td.dp-off{cursor:default;background:transparent;box-shadow:inset 0 0 0 1px rgba(84,82,74,.16)}
.dpmonths td.dp-off b,.dpmonths td.dp-off small{color:var(--dp-off);font-weight:400}.dpmonths td.dp-off b{text-decoration:line-through;text-decoration-color:var(--dp-strike)}
@media (hover:hover){.dpmonths td:not(.dp-off):hover{box-shadow:var(--hover)}.dpmonths td.dp-pk:hover{box-shadow:inset 0 0 0 1px var(--sage-text),var(--hover)}}
/* the foot: the Today key, the line saying which days are off and why, and This Month (shown when you are away);
   in the month view: the line and Back to Days */
/* (round 20, picker panel 8 visual 5) the foot's button has the same room under it as beside it (about 12 px with the card's padding) */
.dpf{display:flex;align-items:center;gap:10px;margin-top:6px;padding:6px 0 6px;border-top:1px solid var(--brow);min-height:54px}
.dpnote{flex:1;min-width:0;font-size:13px;color:var(--ink2);line-height:1.35}
.dev-ipad .dpnote{font-size:14px}
/* (round 20, picker panel 8 ease 3) the Today key is a legend, not a button: the mark first, then the word, regular
   weight, and only while today is in the grid */
.dpkey{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:400;color:var(--ink2);line-height:1;flex:none;padding:0}
.dpkey i{width:18px;height:3px;border-radius:2px;background:var(--sage-text)}
.dpf.dp-nokey .dpkey{display:none}
.dpbody.dp-months~.dpf .dpkey{display:none}
/* (round 19) the Today key steps aside while the foot names the ringed day, so it never reads as that day's label */
.dpf.dp-kbf .dpkey{display:none}
.dptoday{height:44px;border-radius:8px;padding:0 12px;font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;flex:none;background:var(--chip-warm);border:1px solid var(--chip-warm-edge)}
/* a hidden This Month gives its room to the line (no held-empty slot, so the line never wraps early) */
.dptoday.dp-hide{display:none}
/* the close x on the popover, after a thin divider (the sheet has its own in its title row); kept in the month view */
.dph .dpx{margin-left:2px;position:relative}
.dph .dpx::before{content:"";position:absolute;left:-3px;top:12px;bottom:12px;width:1px;background:var(--brow)}
/* computer and iPad: a light warm dim over the page area behind the popover (the app's shadow brown at 12%; the
   wood header, tan page bar and rail stay as they are), with a hole where the date's panel is, so that panel (its
   chips, box, read-out and Save) stays bright and live under the popover */
.dpscrim{position:fixed;inset:0;background:var(--scrim);z-index:79}
.dpscrim[hidden]{display:none}
.dpscrim.dp-lite{background:var(--dp-dim);z-index:78}
.dpnow{font-weight:500;color:var(--ink2);font-size:15px;margin-left:8px}
/* phone: a bottom sheet with the kit Sheet's grab bar (drag down to close), a title saying what you are choosing and
   the date with how far it is, and a close x; the foot sits at the bottom, as on the popover */
.dp.dpsheet{left:0;right:0;bottom:0;top:auto!important;width:auto;border:0;border-radius:16px 16px 0 0;--pad:16px;padding:0 var(--pad) calc(4px + env(safe-area-inset-bottom));--cw:calc((100vw - 44px)/7);--ch:48px;transform-origin:bottom center}
.dp.dpsheet .dpgrid td{font-size:17px}
.dpgrab{height:20px;display:grid;place-items:center;touch-action:none;cursor:grab}
.dpgrab i{width:40px;height:4px;border-radius:8px;background:var(--ink);opacity:.35}
.dptop{display:flex;align-items:center;gap:8px;padding:0 0 6px;margin-bottom:6px;border-bottom:1px solid var(--brow);touch-action:none;min-height:52px}
.dptop h2{margin:0;font-size:18px;font-weight:600;line-height:1.3}
.dptop .dpnow{display:block;margin:2px 0 0;font-size:14px}
/* the sheet's x lines up with the header's > arrow under it */
.dptop .dp-x{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;color:var(--ink2);margin:0 -2px 0 auto;flex:none}
.dplive,.dp .dp-vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.dpnote.dp-kb{color:var(--ink);font-weight:600;font-size:14px}
@media (max-width:640px){.dgrp{max-width:none}}
/* reduced motion: the kit's rule, states change at once (no flash) */
@media (prefers-reduced-motion:reduce){.dgrp.dp-flash .dfield,.dgrp.dp-dirty.dp-flash .dfield{animation:none!important}}
/* a panel button the open calendar covers (even in part) hides until it closes; (round 23, Kitchen panel 19 friction 4)
   its words fade out over the calendar's open (never a one-frame blink), then take no taps */
.dpunder{opacity:0;visibility:hidden;transition:opacity 160ms cubic-bezier(.25,.46,.45,.94),visibility 0s linear 160ms}
@media (prefers-reduced-motion:reduce){.dpunder{transition:none}}
/* (round 23) a separator where the words wrap (DP.tidy) */
.dp-vsoff{visibility:hidden}
/* a date field in a fixed bottom bar (Kitchen's phone hand form): while the phone sheet is open the bar rides up so
   the field and its read-out sit just above the sheet, and only that strip of the bar shows (dp.js, [data-dplift]) */
.dplifted{position:relative;will-change:transform,clip-path}
/* (round 17) the strip is a deliberate bar: a hairline along its top (--dpcut: where the strip starts, 12 px over the

   it out (its own .dplifted rules), so nothing of them is cut in a sliver */
.dplifted::after{content:"";position:absolute;left:0;right:0;top:var(--dpcut,0);height:1px;background:var(--bcard);pointer-events:none}
/* (round 19) a strip pulled flush to the page's bars is one band with them: square corners, no hairline of its own */
.dplifted.dp-flush::after{display:none}
/* the sheet title's thing ("| Ground turkey"): quieter than the label, cut with … when long */
.dptop h2{display:flex;min-width:0;white-space:nowrap}.dpwhat{font-weight:500;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;min-width:0}
.dptop>div{min-width:0;flex:1}
/* (round 20) the popover's title line, the sheet title's small twin: "Use by | Spinach", one line, cut with … when long */
.dptl{display:flex;min-width:0;white-space:nowrap;font-size:14px;line-height:20px;color:var(--ink);padding:2px 0 6px}
.dptl b{font-weight:600;flex:none}
.dev-ipad .dptl{font-size:15px}
/* (round 21, picker panel 9 job 3) opening upward over its own panel, the line keeps the saved date the panel's
   "It's on ... now" line said (the calendar covers it); else hidden */
.dptl .dpwas{display:none;flex:none;font-weight:500;color:var(--ink2)}
.dp.dp-up .dptl .dpwas{display:inline}
/* (round 21, picker panel 9 friction 2) a finger on the popover's dim is the page's to drag (dp.js scrolls what is under) */
.dpscrim.dp-lite{touch-action:none}

   the up-down pan), so a month swipe is never taken over and cancelled */
.dp.dpsheet .dpbody{touch-action:pan-y}
/* (round 20, Kitchen panel 16 visual 3) a side pane's left bar steps aside while the calendar stands beside it (its
   gutter stays, so the card never moves) */
.dp-sidecal::-webkit-scrollbar-thumb,.dp-sidecal::-webkit-scrollbar-thumb:hover{background-color:transparent}
/* (round 17) the compact field (Kitchen's keyboard-up row) gives its box 8 px sides, so "May 25, 2027" fits beside two chips */
.dgrp.dp-sm .dfield,.dgrp.dp-sm .dfield:focus-within{padding:0 8px}
/* (round 20, picker panel 8 fit 3) the field's other sizes are options of this part, never a page's own rules:
   dp-h44 is a 44-tall field that keeps the word Calendar (a phone form whose other boxes are 44, like Name) */
.dgrp.dp-h44{height:44px}
/* (round 20, picker panel 8 visual 2 / job 1 / fit 1 / ease 1, Kitchen panel 15-16 friction: the Pantry year) the
   compact ROW (dp-inline on the page's wrapper): its quick chips, then the field, on one line, the read-out under them.
   The field never cuts its date: its least width fits what is in it (--dpn, the date's or the placeholder's length, set
   by dp.js), and with no room left beside the chips it takes its own line */
.dp-inline{display:flex;flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px 8px;min-width:0}
.dp-inline>.chips{flex:none;flex-wrap:nowrap}

.dp-inline>.dread{flex-basis:100%;margin-top:0}
/* reduced motion, said here for the whole part (not left to a page's global rule): every state change is at once;
   the open and close are the 120 ms fade in dp.js */
@media (prefers-reduced-motion:reduce){.dp,.dp *,.dp *::before,.dp *::after,.dgrp,.dgrp *,.dgrp *::before,.dgrp *::after,.dread{transition-duration:0s!important;animation:none!important}}
/* (round 22, Tyler 11-27 15:22, STANDARDS "Separators are vertical lines") parts on one line ("Use by | Spinach",
   "Friday, Nov 27 (in 2 days) | not saved yet") are parted by a thin vertical line, never "·" and never a bare space:
   1 px, 0.9 em tall, the text's own colour at 40%, 0.5 em each side; a screen reader hears a comma */
.dp-vs{display:inline-block;width:1px;height:.9em;background:currentColor;opacity:.4;margin:0 .5em;vertical-align:-.08em;flex:none;position:relative}
.dp-vs>.dp-vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.dptl .dp-vs,.dptop h2 .dp-vs{align-self:center}

.dread .dp-why{display:inline-block}

.toasts{position:fixed;right:24px;bottom:24px;display:flex;flex-direction:column-reverse;gap:8px;align-items:flex-end;z-index:60;pointer-events:none;max-width:380px}
.toast{background:var(--ink);color:var(--page);border-radius:12px;padding:6px 6px 6px 16px;min-height:48px;font-size:15px;display:flex;gap:8px;align-items:center;pointer-events:auto;box-shadow:var(--shadow-pop)}
.toast button{height:36px;padding:0 12px;border-radius:8px;color:var(--chip-on);font-weight:600}
/* mockup-only state bar (not part of the app) */
.mock{position:fixed;left:50%;transform:translateX(-50%);top:9px;z-index:90;background:var(--ink);color:var(--page);border-radius:12px;padding:3px;display:flex;gap:2px;align-items:center;font-size:12px;box-shadow:var(--shadow-pop);white-space:nowrap;max-width:calc(100vw - 420px);overflow-x:auto;scrollbar-width:none}
.mock::-webkit-scrollbar{display:none}
.mock span{padding:0 8px;opacity:.7}
.mock button{height:26px;padding:0 7px;border-radius:8px;color:var(--page);white-space:nowrap;flex:none}
.mock button.on{background:var(--page);color:var(--ink);font-weight:600}

.tabbar{display:none}

const setSH=()=>{const s=$('#scroll');if(s)document.documentElement.style.setProperty('--sh',s.clientHeight+'px')};addEventListener('resize',setSH);
function render(){if(DPS.open)closeDP({instant:true});const sc=$('#scroll'),top=sc?sc.scrollTop:0,sd=$('#side'),stop=sd?sd.scrollTop:0;
  $('#app').innerHTML=`<div class="app"><header data-dptop class="top"><span class="wordmark">SupperCraft</span><span class="sp"></span><span class="av hdr" aria-label="Tyler">TS</span></header>${rail()}
  <main class="body ${S.bar?'hasbar':''}"><div class="bar" data-dptop>${tanbar()}</div><div class="scroll" id="scroll" data-dpscroll>${content()}</div>${S.bar?`<div class="bbar" id="bbar" data-dplift>${handScene()}</div>`:''}</main>${tabbar()}</div>`;
  setSH();$('#scroll').scrollTop=top;const sd2=$('#side');if(sd2)sd2.scrollTop=stop;
  if(sd2){const hd=sd2.querySelector('.pane .hd');const st=()=>hd&&hd.classList.toggle('stuck',sd2.scrollTop>4);sd2.addEventListener('scroll',st,{passive:true});st()}
  mockbar()}

/* ---------- page events ---------- */
let TT=null;
function toast(msg,undo){const box=$('#toasts');box.innerHTML='';const t=document.createElement('div');t.className='toast';t.innerHTML=`<span>${esc(msg)}</span>${undo?'<button>Undo</button>':''}`;box.appendChild(t);
  t.animate([{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none'}],{duration:200,easing:'cubic-bezier(.25,.46,.45,.94)'});
  clearTimeout(TT);TT=setTimeout(()=>{const a=t.animate([{opacity:1},{opacity:0}],{duration:200,fill:'forwards'});a.onfinish=()=>t.remove()},TOUCH?8000:6000)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.closest('#dp'))return;const a=b.dataset.a;
  if(a==='kpanel'){S.panel=!S.panel;if(S.panel){const it=ITEMS[S.item];F.dd.what=it.nm;setField('dd',it.by===null?null:addD(TODAY,it.by));F.dd.saved=F.dd.sel;F.dd.noDate=DP.NODATE(it.p)}render();if(S.panel)showPanel('#datepanel',true);return}
  if(a==='kcancel'){S.panel=false;render();return}
  if(a==='hplace'){S.hplace=b.dataset.p;F.hfd.noDate=DP.NODATE(S.hplace);if(!F.hfd.noDate&&!F.hfd.sel&&!F.hfd.bad)S.hguess=true;if(S.hguess)setField('hfd',addD(TODAY,S.hplace==='Freezer'?MD(3):S.hplace==='Pantry'?MD(6):/turkey|chicken|beef|pork|fish/i.test(S.hname)?2:5));render();return}
  // every page's Save (Save Date, Move It, Save, Add It) runs one check first
  if(a==='ksave'||a==='pmove'||a==='csave'||a==='hadd'){commit({ksave:'dd',pmove:'pd',csave:'cd',hadd:'hfd'}[a])}});
// what each page does with a date it keeps (in the mockup: a toast with Undo). Save with no change says so.
function commit(id){const f=F[id];if(!okToSave(id))return;const v=value(id);
  if(id==='hfd'){toast(`Added ${S.hname.toLowerCase()} to the ${S.hplace}. ${v?'Use by '+fmtShort(v):'No use-by date'}.`,true);return}
  if(unchanged(id)){const nm=ITEMS[S.item].nm.toLowerCase();
    toast(id==='dd'?(v?`No change: the ${nm} is already use by ${fmtShort(v)}.`:`No change: the ${nm} already has no date.`):id==='pd'?`No change: Tacos is already on ${fmtShort(v)}.`:`No change: cooked on ${fmtShort(v)}.`);syncField(id);return}
  if(id==='dd'){const it=ITEMS[S.item];it.by=v?dd(v):null;S.panel=false;render();toast(it.by===null?`${it.nm} has no use-by date now.`:`Use by is now ${fmtShort(v)}.`,true);return}
  f.saved=v;syncField(id);toast(id==='pd'?`Moved Tacos to ${fmtShort(v)}.`:`Cooked on ${fmtShort(v)}.`,true);if(id==='cd')render()}

/* ---------- mockup states ---------- */
// short names, so all the states fit the mockup bar on a computer (the full names are in BRIEF "States")
const STATES=[['date','Closed'],['open','Open'],['typed','Typed'],['hint','Typing'],['keys','Keys'],['picked','Picked'],['bad','Wrong'],['past','Passed'],
  ['freezer','Freezer'],['months','Months'],['far','Far'],['handc','Add Food'],['hand','Add + Cal'],['nodate','No Date'],['empty','Empty Save'],['compact','Phone Compact'],['lift','Bottom Bar'],['plan','Plan'],['edge','Plan Edge'],['up','Upward'],['history','History'],['hmonths','Hist. Months']];
function mockbar(){$('#mock').innerHTML=`<span>Mockup</span>`+STATES.map(([k,l])=>`<button class="${S.state===k?'on':''}" onclick="setState('${k}')">${l}</button>`).join('')}
function setState(k){closeDP({instant:true});S.state=k;$('#toasts').innerHTML='';
  Object.assign(ITEMS.spinach,{by:0});Object.assign(ITEMS.beef,{by:56});
  S.scene='kitchen';S.item='spinach';S.panel=true;S.hplace='Fridge';S.hguess=true;S.compact=false;S.bar=false;S.hname='Ground turkey';F.hfd.what=S.hname;
  document.querySelectorAll('.dpspace').forEach(x=>x.remove());
  setField('dd',TODAY);setField('hfd',addD(TODAY,2));setField('pd',addD(TODAY,3));setField('cd',addD(TODAY,-2));F.pd.saved=F.pd.sel;F.cd.saved=F.cd.sel;F.hfd.noDate=false;
  if(['freezer','months','far'].includes(k)){S.item='beef';setField('dd',addD(TODAY,56))}
  if(k==='far')setField('dd',new Date(2027,5,14));
  F.dd.saved=addD(TODAY,ITEMS[S.item].by);F.dd.noDate=DP.NODATE(ITEMS[S.item].p);F.dd.what=ITEMS[S.item].nm;
  if(k==='handc'||k==='hand'||k==='nodate'||k==='empty'||k==='compact'||k==='lift'){S.scene='hand'}
  // (round 20, picker panel 8 job 6) Add It pressed with the needed date box emptied: the red line says what to do
  if(k==='empty'){S.hguess=false;setField('hfd',null)}
  // a form in a bar that never scrolls (Kitchen's phone bottom bar, [data-dplift]): the bar rides up over the sheet
  if(k==='lift')S.bar=PHONE();
  if(k==='compact')S.compact=true;
  if(k==='nodate'){S.hname='Brown rice';F.hfd.what=S.hname;S.hplace='Pantry';S.hguess=false;F.hfd.noDate=true;setNone('hfd')}
  if(k==='plan'||k==='edge'||k==='up')S.scene='plan';if(k==='history'||k==='hmonths')S.scene='history';
  if(k==='typed'){F.dd.text='Dec 9';F.dd.sel=new Date(2026,11,9)}
  if(k==='hint'){F.dd.text='Dec 2, 20';F.dd.sel=null;F.dd.hint=KEEPTYPING}
  if(k==='bad'){F.dd.text='soonish';F.dd.sel=null;F.dd.bad=NOTREAD}
  if(k==='past'){F.dd.text='yesterday';F.dd.sel=null;F.dd.bad='That day has passed. Pick today or later.'}
  if(k==='picked'){setField('dd',new Date(2026,11,2))}
  render();
  const sc=$('#scroll');sc.scrollTop=0;const sd=$('#side');if(sd)sd.scrollTop=0;
  // the date field in view (as a person would have it before tapping the calendar button)
  const show=id=>{const g=grpOf(id);if(!g)return;const box=g.closest('[data-dpscroll]'),r=g.getBoundingClientRect(),s=box.getBoundingClientRect();const over=r.bottom+(PHONE()?24:96)-s.bottom;if(over>0)box.scrollTop+=snapNeed(box,over,Math.max(over,Math.floor(r.top-H.edge(box)-12)),g.closest('.card'))};
  const id=k.startsWith('hand')||k==='nodate'||k==='empty'||k==='compact'||k==='lift'?'hfd':k==='plan'||k==='edge'||k==='up'?'pd':k==='history'||k==='hmonths'?'cd':'dd';
  if(k==='lift'){const bb=$('#bbar');if(bb)bb.scrollTop=bb.scrollHeight}
  if(['date','picked','hint','past'].includes(k))showPanel('#datepanel');else if(k==='handc'||k==='nodate'||k==='empty')showPanel('#hform');else if(k==='up'){/* C5b: the field near the screen's foot, the page held where it is, so the calendar opens upward */const g=grpOf('pd'),r=g.getBoundingClientRect(),need=Math.ceil(r.bottom-(innerHeight-70));sc.scrollTop+=snapNeed(sc,need,need+70,sc)}else if(!S.bar)show(id);
  if(['open','typed','hint','keys','bad','freezer','months','far','hand','compact','lift','plan','edge','up','history','hmonths'].includes(k)){openDP(id,{instant:true,mode:k.endsWith('months')||k==='edge'?'months':'days',side:k==='up'?'above':null});if(k.endsWith('months')||k==='edge'){if(k==='edge'){DPS.mpage=1;DPS.mf=DPS.mf+12}updateDP(0,'mode')}}
  if(k==='typed'||k==='hint'){const i=$('#dd');i.focus({preventScroll:true});i.setSelectionRange(i.value.length,i.value.length)}
  if(k==='keys'){DPS.kbd=true;$('#dp').classList.add('dp-kbd');DPS.focus=addD(TODAY,8);moveFocus(DPS.focus);$$('#dpbody .dpview').slice(0,-1).forEach(v=>v.remove());const c=$('#dpbody .dpview:last-child button[tabindex="0"]');c&&c.parentNode.classList.add('dp-kf')}
  if(k==='picked'){const g=grpOf('dd');g.classList.add('dp-flash')}
  if(k==='empty')okToSave('hfd');
  mockbar()}
render();setState(new URLSearchParams(location.search).get('state')||'date');
