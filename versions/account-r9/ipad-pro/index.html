/* Tokens, header, rail, tan bar, buttons and cards: copied from Today v4 (C-083) / Groceries v3 (C-071).
   Setup card, story column, fields and radio cards: copied from Entry (C-090). */
:root{
  --page:#EDE5D8; --card:#FAF6EE; --panel:#F6F2E9; --panel-alt:#F1E8DA;
  --header:#6B3E14; --subbar:#E4D3B3; --hdr-text:#FAF4EB; --subbar-date:#5C3D0A; --subbar-2:#7A5030;
  --ink:#1E1E1C; --ink2:#54524A; --muted:#605E55; --line:#8A8478;
  --sage:#8FAF8A; --sage-dark:#1F3A1C; --sage-light:#E4EDE2; --sage-text:#4B6947;
  --amber:#C8943A; --amber-light:#F5ECD8; --amber-text:#7E5C22;
  --urgent-bg:#F5E4E4; --urgent-text:#5C1A1A; --urgent-border:#8E3131;
  --chip:#E4D9C6; --chip-on:#B7D0B0; --chip-warm:#EFE4CC; --chip-warm-edge:#988048;
  --row-hover:#F0EEE3; --track:#DDD5C5; --folder-line:#D2C6B0;
  --c-muted:96 94 85; --c-ink2:84 82 74;
  --m-pat:#8A5A3C; --m-sam:#55714D; --m-jo:#4F6A86;
  --bcard:rgba(0,0,0,.09); --brow:rgba(0,0,0,.06); --scrim:rgba(0,0,0,.4);
  --shadow-card:0 1px 2px rgba(45,33,22,.055),0 6px 16px rgba(45,33,22,.055);
  --shadow-pop:0 4px 14px rgba(45,33,22,.16); --shadow-float:0 16px 48px rgba(45,33,22,.2);
  --hover:inset 0 0 0 100px rgba(30,30,28,.04); --press:inset 0 0 0 100px rgba(30,30,28,.16);
  --on-dark-hover:rgba(250,244,235,.08); --on-dark-press:rgba(250,244,235,.16);
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --ease:cubic-bezier(.25,.46,.45,.94);
  --mb:40px;
}
.nobar{--mb:0px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--page)}
body{color:var(--ink);font:400 15px/1.45 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
input{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:16px;height:16px}
svg.ni{display:block;overflow:visible}
:focus-visible{outline:2px solid var(--sage-text);outline-offset:2px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes shim{to{background-position:-200% 0}}
@keyframes ringin{from{box-shadow:0 0 0 10px rgba(75,105,71,0)}to{box-shadow:0 0 0 4px rgba(75,105,71,.28)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01s!important;transition-duration:.01s!important}.btn:active{transform:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* one thin themed scroll bar (DESIGN 4.10) */
.scroll,.sheet .sb{scrollbar-width:thin;scrollbar-color:rgb(var(--c-muted) / .35) transparent}
.scroll::-webkit-scrollbar,.sheet .sb::-webkit-scrollbar{width:12px;height:12px}
.scroll::-webkit-scrollbar-thumb,.sheet .sb::-webkit-scrollbar-thumb{background:rgb(var(--c-muted) / .35);border:3px solid transparent;background-clip:padding-box;border-radius:999px}
.scroll::-webkit-scrollbar-track{background:transparent}

.top::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(0,0,0,.10));pointer-events:none}
.top>*{position:relative;z-index:1}
/* round 4: the app's own wordmark (C-083 / C-092 / C-093, DESIGN 2.5.5): Plex italic, no serif (Q14) */
.wordmark{font-style:italic;font-weight:600;font-size:22px}
.top .sp{flex:1}
.av{display:inline-grid;place-items:center;border-radius:50%;font-weight:600;color:var(--hdr-text);flex:none}
.av.hdr{width:28px;height:28px;font-size:12px;background:var(--m-pat);box-shadow:0 0 0 2px var(--hdr-text)}
/* the "?" help door (Walk 6 owns its look; drawn here only so setup can point at it) */
.hq{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--hdr-text)}
.hq:hover{background:var(--on-dark-hover)}
.hq svg{width:22px;height:22px}
.bar{background:var(--subbar);border-bottom:1px solid var(--brow);display:flex;height:46px;flex:none;position:relative}
.bar .in{display:flex;align-items:center;gap:12px;width:100%;max-width:1212px;margin:0 auto;padding:0 16px;min-width:0}
.bar .ttl{font-style:normal;font-weight:600;font-size:16px;color:var(--subbar-date);white-space:nowrap}
/* C-091: "‹ Page name › This page" (a small chevron after the back button) */
.sepc{width:14px;height:14px;color:var(--subbar-2);opacity:.6;flex:none;margin:0 -4px 0 -10px}
.bar .bb.sec{background:var(--sage);color:var(--ink)}
.bar .meta{font-size:13px;color:var(--subbar-2);padding-left:12px;border-left:1px solid var(--chip-warm-edge);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bar .sp{flex:1}
.bar .btn.icon{width:36px;height:36px;color:var(--subbar-date)}
.bar .bb{height:34px;padding:0 14px;font-size:15px}
/* C-091: back in the tan bar is "‹ Page name", one quiet text button */
.bar .back{display:inline-flex;align-items:center;gap:2px;height:36px;padding:0 8px 0 2px;border-radius:8px;color:var(--subbar-2);font-size:15px;font-weight:500;white-space:nowrap}
.bar .back:hover{box-shadow:var(--hover)}
.bar .back svg{width:18px;height:18px}

/* ---------- kit Button: 44 tall (Entry cards 52), Title Case, press = .97 + overlay ---------- */
.btn{height:44px;border-radius:8px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:500;font-size:16px;white-space:nowrap;transition:transform 50ms var(--ease),box-shadow .2s var(--ease),background-color .2s var(--ease),color .2s var(--ease);position:relative;flex:none}
.btn:active{transform:scale(.97);box-shadow:var(--press)}
.btn.pri{background:var(--sage-dark);color:var(--hdr-text)}.btn.pri:hover{box-shadow:inset 0 0 0 100px var(--on-dark-hover)}
.btn.sec{background:var(--sage);color:var(--ink)}.btn.sec:hover{box-shadow:var(--hover)}
.btn.cancel{background:transparent;border:1px solid var(--ink2);color:var(--ink)}.btn.cancel:hover{box-shadow:var(--hover)}
.btn.tan{background:var(--chip-warm);border:1px solid var(--chip-warm-edge);color:var(--ink)}.btn.tan:hover{box-shadow:var(--hover)}
.btn.icon{width:44px;padding:0;color:var(--ink2)}.btn.icon:hover{box-shadow:var(--hover)}
/* G14: every turned-off button is grey */
.btn.off{background:var(--chip)!important;color:var(--muted)!important;border-color:transparent!important;cursor:default}.btn.off:active{transform:none;box-shadow:none}
/* round 4 (DESIGN 4.2.11): a link that stands alone is a chevron link, no underline, 44 tall tap area */
.tl{display:inline-flex;align-items:center;gap:2px;min-height:44px;color:var(--sage-text);font-weight:600;border-radius:6px;padding:0;text-decoration:none}
.tl svg.i{width:16px;height:16px;stroke-width:2.4}
.tl:hover{color:var(--sage-dark)}
/* kit quiet text button (no fill, no border, no underline): Go to Today, Import a Recipe First */
.btn.ghost{background:transparent;color:var(--sage-text);font-weight:600;gap:2px}.btn.ghost svg.i{stroke-width:2.4}.btn.ghost:hover{box-shadow:var(--hover)}

/* ---------- setup: Entry's frame (C-090, decision 11) ---------- */
.setup{height:calc(100vh - var(--mb));height:calc(100dvh - var(--mb));margin-top:var(--mb);display:flex;flex-direction:column}
.setup .scroll{flex:1;min-height:0;overflow:auto}
.cols{width:100%}
.w2 .cols{display:flex;align-items:flex-start;justify-content:center;gap:64px;padding:40px 40px 64px}
.w2 .story{flex:1;max-width:430px;position:sticky;top:40px;padding-top:29px}
.story .eb[hidden]+h1{margin-top:0}
/* round 7 (panel 2 visual 5): the card starts 40 under the tan bar on every computer and iPad (phone 12), never centred */
.w2 .ccol{flex:1;max-width:470px}
.setup.w2 .bar .in{max-width:1044px;padding:0 40px}
.setup.one .bar .in{max-width:502px;padding:0 16px}
.setup.ph .bar .in{padding:0 8px 0 12px}
.one .cols{max-width:502px;margin:0 auto;padding:40px 16px 48px}
.one .story{display:none}
.ph .cols{padding:12px 12px 32px}
.eb{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);line-height:1.3}
.story h1{font-size:24px;line-height:1.2;font-weight:700;margin:8px 0 0;letter-spacing:-.005em;text-wrap:balance}
.story .spx{font-size:15px;line-height:1.45;color:var(--ink2);margin:8px 0 0;max-width:400px}
.steps{list-style:none;margin:20px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.steps li{display:flex;align-items:center;gap:12px;font-size:15px;color:var(--ink2);min-height:28px}
.steps li b{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:var(--ink2);align-self:flex-start;margin-top:4px}
/* round 10 (panel 3 fit 2): Today's Getting Started marks, same sizes: outline tick = set, ring with a dot = this step,
   empty ring = not yet; a dash in the ring only for skipped. No number discs, no strike-through. */
.steps li.done b{color:var(--sage-text)}
.steps li.done b svg{width:20px;height:20px}
.ring.sk{position:relative}.ring.sk::after{content:"";position:absolute;left:3px;right:3px;top:50%;height:1.7px;margin-top:-.85px;background:var(--ink2);border-radius:1px}
.steps li.cur{color:var(--ink);font-weight:600}
.steps li small{display:block;font-size:13px;color:var(--muted);font-weight:400}
/* round 7: one fixed foot on every step: button, 8, one reserved why-line, then 28 (phone 18), the same as the sides */
.scard{padding:28px;position:relative;transition:opacity .2s var(--ease)}
.ph .scard{padding:18px}
h2.t{font-size:30px;line-height:1.2;font-weight:700;letter-spacing:-.005em;text-wrap:balance}
.ph h2.t{font-size:26px}
.q{font-size:15px;line-height:1.45;color:var(--ink2);margin:6px 0 0;text-wrap:pretty}
.f{margin-top:20px}
.f>label,.lab2{display:block;font-size:13px;font-weight:500;color:var(--ink2);margin-bottom:6px}
.inp{width:100%;height:50px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:0 14px;font:400 16px var(--font);color:var(--ink);outline:none;transition:border-color .16s}
.inp:focus{border:2px solid var(--sage-text);padding:0 13px}
.inp::placeholder{color:#6E6A60}
.inp.zip{width:160px}
.fh{font-size:13px;color:var(--muted);margin-top:4px;min-height:19px}
.fh.why{color:var(--urgent-text)}
/* B3 stepper */
.stp{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;height:50px;background:var(--card)}
.stp button{width:48px;height:48px;display:grid;place-items:center;color:var(--ink2);border-radius:8px}
.stp button:hover{box-shadow:var(--hover)}
.stp output{min-width:44px;text-align:center;font-size:17px;font-weight:600}
.stprow{display:flex;align-items:center;gap:14px}.stprow .fh{margin:0;min-height:0}
.ph .stprow{flex-direction:column;align-items:flex-start;gap:4px}
/* B12 colour swatches (24 presets live; 12 drawn) */
.sw{display:flex;flex-wrap:wrap;gap:10px}
.sw button{width:36px;height:36px;border-radius:50%;position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.sw button.on::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--ink)}
.sw button svg{width:18px;height:18px;stroke:#fff;stroke-width:3;position:absolute;inset:9px;opacity:0}
.sw button.on svg{opacity:1}
/* plain Claude card (round 1 Q3 a): one card, full note one tap away */
.cc{margin-top:20px;border-radius:12px;background:var(--panel-alt);border:1px solid var(--bcard);padding:14px;display:flex;gap:12px}
.cc>svg{color:var(--ink2);margin-top:2px}
.cc b{display:block;font-weight:600;font-size:15px}
.cc p{font-size:14px;color:var(--ink2);margin-top:2px}
.cc .more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .2s var(--ease)}
.cc .more.open{grid-template-rows:1fr}
.cc .more>div{overflow:hidden}
.cc .more p{margin-top:8px}
.cc .tl{margin:0 0 -10px;font-size:14px}
/* radio cards (Entry's rectangles, never pills) */
.rcs{display:flex;flex-direction:column;gap:8px;margin-top:20px}
.rc{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);border-radius:10px;padding:12px 16px;background:var(--card);transition:background-color .2s var(--ease),border-color .2s var(--ease)}
.rc:hover{box-shadow:var(--hover)}
.rc .rd{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--ink2);margin-top:1px;display:grid;place-items:center}
.rc .rd::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--sage-dark);transform:scale(0);transition:transform .2s var(--ease)}
.rc.on{border-color:var(--sage-text);background:var(--sage-light)}
.rc.on .rd{border-color:var(--sage-dark)}.rc.on .rd::after{transform:none}
.rc .tx{flex:1;min-width:0}
.rc b{display:block;font-weight:600;font-size:16px}
.rc b em{font-style:normal;font-weight:500;font-size:14px;color:var(--sage-text);white-space:nowrap}
.rc b em::before{content:"";display:inline-block;width:1px;height:.95em;background:currentColor;opacity:.5;margin:0 8px;vertical-align:-2px}
.dev-ipad .rc b em{font-size:16px}
.rc b:has(em.wr){display:flex;flex-direction:column}.rc b em.wr{order:-1;font-size:13px;font-weight:600;margin:0 0 1px;line-height:1.3}.rc b em.wr::before{display:none}
.rc small{display:block;font-size:14px;color:var(--ink2);margin-top:2px}
.rc .xtra{display:block}
.rc .xtra>span{display:flex;flex-wrap:wrap;align-items:center;gap:0 12px;padding-top:6px}
.rc .xtra .tl{margin:-6px 0 -10px}
.btn.sm2{height:40px;font-size:15px;font-weight:600;padding:0 14px}
.rc .xn{font-size:13px;color:var(--muted)}
.rc .impok{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--sage-dark);font-weight:500}
/* card foot: Back left, the one dark button right; a why-line under it keeps its room (no jump) */
.cfoot{display:flex;align-items:center;gap:12px;margin-top:20px;padding-top:16px;border-top:1px solid var(--brow)}
.cfoot .sp{flex:1}
.cfoot .btn{height:52px;font-size:16px;font-weight:600;padding:0 22px}

.ld .gt{--a:16%;--b:84%;color:transparent!important;-webkit-box-decoration-break:clone;box-decoration-break:clone;
  background:radial-gradient(circle at 5px calc(var(--a) + 5px),var(--track) 4.5px,#0000 5px) no-repeat,radial-gradient(circle at calc(100% - 5px) calc(var(--a) + 5px),var(--track) 4.5px,#0000 5px) no-repeat,
  radial-gradient(circle at 5px calc(var(--b) - 5px),var(--track) 4.5px,#0000 5px) no-repeat,radial-gradient(circle at calc(100% - 5px) calc(var(--b) - 5px),var(--track) 4.5px,#0000 5px) no-repeat,
  linear-gradient(var(--track),var(--track)) 0 50%/100% calc(var(--b) - var(--a) - 10px) no-repeat,linear-gradient(var(--track),var(--track)) 50% 50%/calc(100% - 10px) calc(var(--b) - var(--a)) no-repeat}

  if(id==='el_err')return appView('',bar,msgCard('alert','The Error Log Didn\'t Load','Check your connection, then try again.',`<button class="btn pri" data-a="toast" data-t="Tries again">${ic('refresh','i sm')}Try Again</button>`));
  const ld=id==='el_load', sh=t=>ld?`<span class="shp">${t}</span>`:t;
  /* round 4 (fit 7): kit folder tabs (DESIGN 4.4.8); the Code filter is today's box, list-filter icon, its right edge on the Count column */
  const tb=`<div class="etb"><div class="ftabs" role="tablist"><button class="ftab on" role="tab" aria-selected="true">24 Hours</button><button class="ftab" role="tab" aria-selected="false" data-a="toast" data-t="Shows the last 7 days">7 Days</button></div><span class="sp"></span><label class="cfil">${ic('lfilter')}<input class="inp" placeholder="Filter by Code" aria-label="Filter by code"></label></div>`;
  /* round 9 (CODE_MAP 4.4 "no match"): the Code filter finds nothing; one quiet way back */
  if(id==='el_nomatch')return appView('',bar,`<div class="elw"><section class="card" aria-label="Errors">${tb.replace('placeholder="Filter by Code"','placeholder="Filter by Code" value="STRIPE_REFUND"')}<div class="state-msg emp"><span class="eic">${ic('search')}</span><h2>No Codes Match</h2><p>Nothing in the last 24 hours has a code with STRIPE_REFUND.</p><div class="acts"><button class="btn sec" data-a="go" data-s="el">Clear the Filter</button></div></div></section></div>`);
  const rows=id==='el_empty'?`<div class="state-msg emp"><span class="eic">${ic('checkc')}</span><h2>No Errors</h2><p>Nothing went wrong in the last 24 hours.</p></div>`
    :`<div class="erh" aria-hidden="true"><span>Code</span><span>Page</span><span>Last Seen</span><span>Count</span></div>${ERRS.map(([c,r,n,when,ser])=>`<div class="er"><span class="cd"><span class="code">${sh(c.replace(/_/g,'_<wbr>'))}</span>${ser&&!ld?`<span class="ser">${ic('alert','i')}Serious</span>`:''}</span><span class="rt">${sh(r)}</span><span class="tm">${sh(when)}</span><span class="sub">${sh(SL(r,when))}</span><span class="ct">${sh(n)}</span></div>`).join('')}<p class="elnote">${ic('alert','i')}Serious means it was bad enough for the error email.</p>`;
  return appView('',bar,`<div class="elw ${ld?'ld':''}"><section class="card" aria-label="Errors">${tb}${rows}</section></div>`);
}

/* ---------- round 1: three menu shapes side by side ---------- */
function waysView(){
  const p=PEOPLE.pat, hd=`<header class="top"><span class="wordmark">SupperCraft</span><span class="sp"></span><span class="avb"><span class="av hdr" style="background:var(${p[2]})">${p[1]}</span></span></header>`;
  const save={...U};U.menu=true;const a=acMenu();Object.assign(U,save);
  const b=`<div class="acm wb2" style="top:54px;right:12px" role="menu" aria-label="Way B"><div class="pc"><span class="av" style="background:var(${p[2]})">${p[1]}</span><b>${p[0]}</b><small>${p[3]}</small><small>${HOME}</small></div><div class="pb"><button class="btn tan">Settings</button><button class="btn tan">Household</button></div><hr>${mi('help','How This Page Works','toast',{t:'Way B'})}${mi('msgc','Contact Us','toast',{t:'Way B'})}${mi('flag','Report a Problem','toast',{t:'Way B'})}${mi('inbox','My Reports','toast',{t:'Way B'})}${mi('info','About SupperCraft','toast',{t:'Way B'})}<div class="so"><button class="btn cancel">Sign Out of This Device</button></div></div>`;
  const c=`<div class="wsheet" role="dialog" aria-label="Way C"><div class="sh"><b>Your Account</b><button class="btn icon" aria-label="Close">${ic('x')}</button></div>${a.replace('class="acm"','class="acm"').replace('id="acm"','')}</div>`;
  const G=[['A','Grouped drop-down (kept)',a.replace('id="acm"','style="top:54px;right:12px"'),`<b>${SL('Visual 8','Fit 9','Job 8','Ease 8','Friction 8')}</b>`+' Same card, rows and lines as Today\'s ⋯ menu (C-083); drops under the avatar and the page stays bright (DESIGN 4.7.1). Who you are on top answers "who is signed in" on a shared device.'],
    ['B','Profile card with buttons',b,`<b>${SL('Visual 7','Fit 5','Job 7','Ease 7','Friction 6')}</b>`+' Two tan buttons and an outline Sign Out inside a menu are a new pattern nowhere else in the app; the card is 90 px taller, so the phone scrolls with the Staff group.'],
    ['C','Full-height account sheet',c,`<b>${SL('Visual 7','Fit 4','Job 8','Ease 6','Friction 6')}</b>`+' A right-side sheet is How This Page Works\' place (Walk 6), so two sheets would open from the same edge; it covers the page and needs a close X, an extra tap every time.']];
  return `<div class="wpage"><div class="wh"><h1>Avatar Menu: Three Shapes</h1><p>Round 1. Same rows in each (Q4 order). Graded strictly; A is kept.</p></div><div class="ways">${G.map(([k,t,m,g])=>`<div><div class="wlab">Way ${k}: ${t}</div><div class="wframe">${hd}${m}</div><p class="wgrade">${g}</p></div>`).join('')}</div></div>`;
}

/* ---------- render ---------- */
function view(){
  const id=U.id;
  if(id==='ways')return waysView();
  if(id.startsWith('m_')||id.startsWith('so_')&&id!=='so_done')return todayView();
  if(id==='so_done')return signInView();
  if(id.startsWith('contact'))return contactView();
  if(id.startsWith('kipad'))return kipadView();
  if(id.startsWith('about'))return aboutView();
  if(id.startsWith('wb'))return wbView();
  if(id.startsWith('cr'))return crView();
  if(id.startsWith('el'))return elView();
  return '';
}
const DOC={privacy_policy:['Privacy Policy','v1.3','Nov 20, 2026',[['What we collect','What you tell SupperCraft to plan meals: your recipes, your Kitchen, your plan and what you cook. Sample words for the mockup.'],['Who sees it','Everyone in your household can see all of it. We never sell it and never show ads.'],['Your choices','You can download everything or delete your household from Settings.']]],
  data_retention:['Data Retention Policy','v1.1','Nov 20, 2026',[['While you use SupperCraft','We keep what it needs to plan meals. Sample words for the mockup.'],['When you delete your account','You have 30 days to change your mind.']]],
  sub_processors:['Sub-Processors Disclosure','v1.2','Nov 14, 2026',[['Who helps us run SupperCraft','Each company that touches your data, named, with what leaves and why. Sample words for the mockup.']]]};
function sheet(){
  const s=$('#scrim'), sh=$('#sheet'), id=U.id;
  let h='', cls='sheet';
  const dv=DEV==='phone'?'phone':DEV==='ipad'?'iPad':'computer';
  /* round 4 (fit 3; Q21): a plain sign-out loses nothing, so its main button is the dark one and red is kept for loss.
     Q18: when work would be lost, the SAFE choice is the dark main button on top; Sign Out Anyway is the red outline. */
  const stay=`<button class="btn pri" data-a="cancel">Stay Signed In</button>`, anyway=`<button class="btn danger" data-a="dosignout">Sign Out Anyway</button>`;
  if(id==='so_confirm'){cls+=' box';h=`<div class="sb"><h2 id="shh">Sign Out of This Device?</h2><p>You'll need to sign in again on this ${dv}. Your household's plans and recipes stay saved.</p></div><div class="ft"><button class="btn pri" data-a="dosignout">Sign Out</button><button class="btn cancel" data-a="cancel">Cancel</button></div>`}
  /* round 7 (friction 3, visual): both lines in ink; the person learns they need not come back to check */
  else if(id==='so_warn'){cls+=' box';h=`<div class="sb"><h2 id="shh">3 Grocery Changes Haven't Sent</h2><p class="lead">You're offline, so they are only on this ${dv}. If you sign out now, they are lost.</p><p class="lead">Stay signed in. They send by themselves when you reconnect, and then you can sign out with nothing lost.</p></div><div class="ft">${stay}${anyway}</div>`}
  else if(id==='so_rec'){cls+=' box';h=`<div class="sb"><h2 id="shh">2 Recipes Haven't Saved</h2><p class="lead">You added them offline, so they are only on this ${dv}. If you sign out now, they are lost.</p><p class="lead">Stay signed in. They save by themselves when you reconnect, and then you can sign out with nothing lost.</p></div><div class="ft">${stay}${anyway}</div>`}
  /* round 7 (friction 2, Q23 pick): more than one kind unsent is still ONE box that lists them all, so nobody agrees to a loss before seeing the next */
  else if(id==='so_multi'){cls+=' box';h=`<div class="sb"><h2 id="shh">Some Work Is Only on This ${dv==='iPad'?'iPad':dv[0].toUpperCase()+dv.slice(1)}</h2><p class="lead">If you sign out now, all of it is lost:</p><ul class="lost"><li>${ic('cart','i sm')}3 grocery changes haven't sent</li><li>${ic('book','i sm')}2 recipes haven't saved</li><li>${ic('inbox','i sm')}3 captures aren't sorted yet</li></ul><p class="lead">Stay signed in and the first two send by themselves when you reconnect. Export the captures to keep a copy of them.</p></div><div class="ft">${stay}<button class="btn sec" data-a="dosignout" data-x="1">Export Captures, Then Sign Out</button>${anyway}</div>`}
  else if(id==='so_cap'){cls+=' box';h=`<div class="sb"><h2 id="shh">3 Captures Are Only on This ${dv==='iPad'?'iPad':dv[0].toUpperCase()+dv.slice(1)}</h2><p class="lead">They haven't been sorted yet.</p><p>Export them to keep a copy before you sign out, or they are lost.</p></div><div class="ft"><button class="btn pri" data-a="dosignout" data-x="1">Export, Then Sign Out</button>${anyway}<button class="btn cancel" data-a="cancel">Stay Signed In</button></div>`}
  else if(id==='about_doc'||id==='about_lic'){cls+=' rdr';
    const LIC=[['IBM Plex Sans','SIL Open Font License 1.1','Copyright the IBM Plex project authors.'],['Fraunces','SIL Open Font License 1.1','Copyright the Fraunces project authors. The font of the name, SupperCraft.'],['Lucide','ISC License','Copyright the Lucide contributors.']];
    const FULL={'SIL Open Font License 1.1':'This Font Software is licensed under the SIL Open Font License, Version 1.1. PREAMBLE: The goals of the Open Font License (OFL) are to stimulate worldwide development of collaborative font projects, to support the font creation efforts of academic and linguistic communities, and to provide a free and open framework in which fonts may be shared and improved in partnership with others. (The app shows the whole licence here.)',
      'ISC License':'Permission to use, copy, modify, and/or distribute this software for any purpose with or without fee is hereby granted, provided that the above copyright notice and this permission notice appear in all copies. (The app shows the whole licence here.)'};
    const body=id==='about_lic'?LIC.map(([n,l,c],i)=>`<div class="lic"><h3>${n}</h3><p><b class="ln">${l}.</b> ${c}</p><button class="btn sec sm" data-a="licx" data-i="${i}" aria-expanded="${U.licOpen===i}">${U.licOpen===i?'Hide the Licence':'Read the Licence'}</button>${U.licOpen===i?`<p class="full">${FULL[l]}</p>`:''}</div>`).join('')
      :DOC[U.doc||'privacy_policy'][3].map(([a,b])=>`<h3>${a}</h3><p>${b}</p>`).join('');
    const d=id==='about_lic'?['Open Source Licences','The fonts and icons SupperCraft ships','']:DOC[U.doc||'privacy_policy'];
    /* round 7 (friction 8): one way out, Close at the foot (DESIGN 4.7.4); no second X at the top */
    h=`<div class="rh"><div><h2 id="shh">${d[0]}</h2><small>${d[2]?SL(d[1],d[2]):d[1]}</small></div></div><div class="sb">${body}</div><div class="ft rf"><button class="btn cancel" data-a="closer">Close</button></div>`}
  s.classList.toggle('open',!!h);sh.className=cls;sh.innerHTML=h;
}
function mockBar(){
  const ix=STATES.findIndex(s=>s[0]===U.id);
  $('#mock').innerHTML=`<span class="tag">MOCKUP</span><button class="mm" data-m="pop" aria-haspopup="true">States</button><button data-m="prev" aria-label="Previous state">${ic('left','i sm')}</button><button data-m="next" aria-label="Next state">${ic('right','i sm')}</button><span class="cur">${ix+1} of ${STATES.length}: ${SN(U.id)}</span>`;
  $('#mpop').innerHTML=GROUPS.map(([g,l])=>`<h4>${l}</h4>${STATES.filter(s=>s[1]===g).map(([id,,n])=>`<button class="${id===U.id?'on':''}" data-m="go" data-s="${id}">${n}</button>`).join('')}`).join('');
  $('#mnote').textContent=NOTES[U.id]||NOTES[U.id.split('_')[0]]||'';
}
/* the menu hangs 4 under the header, its right edge on the avatar ring's right edge (C-083 openMenu) */
function placeMenu(){const m=$('#acm'),b=$('.avb .av');if(!m||!b)return;const app=m.closest('.app').getBoundingClientRect(),r=b.getBoundingClientRect();
  if(!PHONE())m.style.right=Math.max(8,Math.round(app.right-r.right-2))+'px';m.style.top=Math.round($('.app>.top').getBoundingClientRect().bottom-app.top+4)+'px'}
function render(focus){
  const sc=$('#scroll'), keep=sc&&!focus?sc.scrollTop:0;
  $('#app').innerHTML=view();
  sheet();mockBar();placeMenu();
  document.title='SupperCraft: '+SN(U.id)+' (mockup)';
  const s2=$('#scroll');if(s2&&keep)s2.scrollTop=keep;
  /* the found person sits in the People group: open the state scrolled to it */
  if(U.id==='cr_find'&&s2&&!keep){const f=$('#find');if(f)s2.scrollTop=f.getBoundingClientRect().top-s2.getBoundingClientRect().top-44}
  /* round 7 (ease 4): Contact Us opens with the box ready, so its label already sits on the box's top edge (DESIGN 4.3.1) */
  const cq=$('#cq');if(cq&&U.id.startsWith('contact'))cq.focus({preventScroll:true});
  else if(focus){const h=$('#ct');if(h)h.focus({preventScroll:true})}
}
function go(id,focus=true){const keep=U;U=fresh(id);if(id==='about_doc')U.doc=keep.doc||'privacy_policy';if(['m_rest','m_owner'].includes(id)){U.newHelp=keep.newHelp;U.folders=keep.folders}
  if(id.startsWith('about')&&!['about_set'].includes(id)&&keep.from&&keep.id.startsWith('about'))U.from=keep.from;
  $('#mpop').classList.remove('open');render(focus);history.replaceState(null,'','?'+new URLSearchParams({...Object.fromEntries(Q),state:id}));}
function toast(t,tm){const el=document.createElement('div');el.className='toast';el.innerHTML=(tm?`<span class="tm">${tm}</span>`:'')+t;$('#toasts').appendChild(el);setTimeout(()=>el.remove(),4200)}

/* ---------- actions ---------- */
document.addEventListener('click',e=>{
  const m=e.target.closest('[data-m]');
  if(m){const ix=STATES.findIndex(s=>s[0]===U.id);
    if(m.dataset.m==='pop')$('#mpop').classList.toggle('open');
    else if(m.dataset.m==='prev')go(STATES[(ix-1+STATES.length)%STATES.length][0]);
    else if(m.dataset.m==='next')go(STATES[(ix+1)%STATES.length][0]);
    else go(m.dataset.s);return}
  if(!e.target.closest('#mpop'))$('#mpop').classList.remove('open');
  /* outside click closes the menu (web: no scrim; the page stays bright) */
  if(U.menu&&!e.target.closest('#acm')&&!e.target.closest('[data-a="av"]')){U.menu=false;render();return}
  if(e.target.id==='scrim'&&(U.id==='about_doc'||U.id==='about_lic')){go('about');return}
  const b=e.target.closest('[data-a]');if(!b||b.getAttribute('aria-disabled')==='true')return;
  const a=b.dataset.a;
  const closeAnd=f=>{U.menu=false;f()};
  switch(a){
    case 'av':if(U.id==='ways')break;U.menu=!U.menu;if(U.menu&&U.id==='m_rest')U.id='m_owner';if(U.menu&&U.id==='m_reply_rest')U.id='m_reply';render();if(U.menu){const f=$('#acm .who');f&&f.focus({preventScroll:true})}break;
    case 'htpw':U.newHelp=false;closeAnd(render);toast('Opens How This Page Works (Walk 6). The New mark is gone now.','Mockup');break;
    case 'folders':U.folders=b.dataset.v;$$('#acm .seg button').forEach(x=>x.setAttribute('aria-checked',x.dataset.v===U.folders));toast('Folder look: '+U.folders+', on this device only','Mockup');break;
    case 'signout':{const off=U.off;U.menu=false;go(off?'so_warn':'so_confirm');break}
    case 'dosignout':go('so_done');toast(b.dataset.x?'Captures exported to Downloads. Signed out of this device.':'Signed out of this device.');break;
    case 'cancel':go('m_rest');break;
    case 'go':if(U.menu)U.menu=false;if(b.dataset.s==='about')U.from='Today';go(b.dataset.s);break;
    case 'nav':toast('Opens '+b.dataset.to,'Mockup');break;
    case 'copy':{U.copied=true;$('#copyb').innerHTML=`${ic('check')}Copied`;toast('Support details copied: app 2.4.0 (118), server 2.4.1, '+(DEV==='phone'?'iPhone':DEV==='ipad'?'iPad':'Chrome on Windows')+', home code R7K2.');clearTimeout(window.cpT);window.cpT=setTimeout(()=>{if(U.id.startsWith('about')){U.copied=false;const c=$('#copyb');if(c)c.innerHTML=`${ic('copy')}Copy Support Details`}},2400);break}
    case 'doc':{const from=U.from;U.doc=b.dataset.d;go('about_doc');U.from=from;render();break}
    case 'lic':{const from=U.from;go('about_lic');U.from=from;render();break}
    case 'closer':{const from=U.from;go(from==='Settings'?'about_set':'about');break}
    case 'relegal':go('about');break;
    case 'sel':U.sel=+b.dataset.i;render();break;
    case 'rtab':U.rtab=b.dataset.v;render();break;
    case 'chk':{const on=b.getAttribute('aria-checked')!=='true';b.setAttribute('aria-checked',on);toast(on?'Screen details will be sent':'Screen details left out','Mockup');break}
    case 'sent':go('contact_sent');toast('Sent. The answer comes to My Reports.');break;
    case 'licx':{U.licOpen=U.licOpen===+b.dataset.i?null:+b.dataset.i;sheet();break}
    case 'toast':if(U.menu){U.menu=false;render()}toast(b.dataset.t,'Mockup');break;
  }
});
/* Contact Us: Send stays grey until something is typed (G14); the reserved line under it says why, so nothing moves */
document.addEventListener('input',e=>{if(e.target.id!=='cq')return;const has=!!e.target.value.trim(),b=$('#sendb');b.className='btn '+(has?'pri':'off');
  if(has){b.dataset.a='sent';b.removeAttribute('aria-disabled')}else{delete b.dataset.a;b.setAttribute('aria-disabled','true')}$('#cwhy').textContent=has?'':'Type your question to send it.'});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(U.menu){U.menu=false;render();$('.avb')&&$('.avb').focus();return}if($('#scrim.open')){go(U.id.startsWith('about')?(U.from==='Settings'?'about_set':'about'):'m_rest')}}
  if(U.menu&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();const items=$$('#acm [role=menuitem]:not([aria-disabled="true"]),#acm [role=menuitemradio]'),i=items.indexOf(document.activeElement);const n=items[(i+(e.key==='ArrowDown'?1:-1)+items.length)%items.length];n&&n.focus()}
});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>render(),120)});
render();

</script>
