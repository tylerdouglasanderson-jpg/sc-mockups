function realPage(fn){const k={ld:S.loading,er:S.error};S.loading=false;S.error=false;const h=fn();S.loading=k.ld;S.error=k.er;return h}
function splitLede(h){const i=h.indexOf('<section');return [h.slice(0,i),h.slice(i)]}
function skL(w,h){return '<i class="sk" style="display:inline-block;vertical-align:middle;width:'+w+';height:'+(h||12)+'px"></i>'}
/* House Rules in its real row shapes: value rows, People Eating, the three meal times, switch rows */
function rulesShape(first){
  const tap=(i)=>'<div class="rrow nw"><div class="tx"><b>'+skL((30+i*7%20)+'%')+'</b><span class="v">'+skL((40+i*9%25)+'%')+'</span><small>'+skL((55+i*5%25)+'%')+'</small></div><span class="chev">'+skL('16px',16)+'</span></div>';
  const times=tap(3);
  const swr=(i)=>'<div class="rrow nw"><div class="tx"><b>'+skL((38+i*9%24)+'%')+'</b><small>'+skL((58+i*7%26)+'%')+'</small></div><div class="ctl r"><span class="sk" style="display:inline-block;width:84px;height:28px;margin:8px 0"></span></div></div>';
  /* round 15: People Eating is a tap row now, so it loads as one */
  const eat=tap(4);
  /* first: only the Home group (a failed load covers just that card, never a page-tall empty box: round 8) */
  return [['Home',tap(0)+eat+times+tap(1)],['Planning',tap(2)+swr(0)],['Shopping and Alerts',swr(1)+swr(2)]].slice(0,first?1:3).map(g=>'<section class="sec"><div class="sechd"><span class="eyebrow">'+g[0]+'</span></div><div class="card">'+g[1]+'</div></section>').join('');
}
/* People: heading (with the Add a Person block for the Owner) and five people rows */
function peopleShape(){return '<section class="sec"><div class="sechd'+(S.role==='owner'?' hasbtn':'')+'"><span class="eyebrow">Everyone Who Eats Here</span>'+(S.role==='owner'?'<span class="btn sm sk" style="width:144px;margin-left:auto"></span>':'')+'</div><div class="card rows">'+skRows(5)+'</div></section>'}
/* Devices: the iPad card at the set-up card's height */
/* round 8: the REAL set-up card (name, facts, Who Is This?, Switch Off) with its words and pictures turned into shimmer
   blocks, so every line holds its place and nothing pops in when it arrives */
function devShape(){const keep={st:S.dev.state,ld:S.loading,er:S.error};S.dev.state='set';S.loading=false;S.error=false;const real=devicesHTML();S.dev.state=keep.st;S.loading=keep.ld;S.error=keep.er;
  const i=real.indexOf('<section class="sec">');return '<div class="shim" aria-hidden="true" inert>'+real.slice(i)+'</div>'}
function loadingHTML(){
  const lbl={people:'Getting your household',rules:'Getting your house rules',devices:'Checking for a kitchen iPad',hub:'Getting your settings',person:'Getting what this person can do'}[S.page]||'Getting your settings';
  const L='<p class="loadlbl" role="status">'+lbl+'</p>';
  const lede=(w)=>'<p class="lede">'+skL(w,14)+'</p>';
  if(S.page==='rules')return wrap(shimOf(realPage(rulesHTML))+L);
  if(S.page==='person'){const p=person(S.pid);
    /* the head comes from the People list (name, tier). The Access card and Remove wait in their REAL shape: the card is
       drawn from the roster's tier with its words and controls turned into shimmer blocks, so nothing moves when they arrive */
    const full=personHTML(),i=full.indexOf('<section class="card acc">');
    return wrap(pheadHTML(p)+'<div class="shim" aria-hidden="true" inert>'+full.slice(i)+'</div>'+L)}
  if(S.page==='devices')return wrap(shimOf(splitLede(realPage(devicesHTML))[0])+devShape()+L);
  if(S.page==='hub')return wrap(shimOf(realPage(hubHTML))+L);
  return wrap(shimOf(realPage(peopleHTML))+L);
}
/* a failed load is exactly the loading shape's size (DESIGN 4.8.2): the shape is drawn invisibly and the error box covers it */
/* round 8: on a multi-card page (House Rules, Devices) the failed box is its own size (min 300), not a page-tall empty box;
   People keeps the list's shape (5 rows) so the box fills the space the list will take */
function errorHTML(what,shape){shape=shape.split('<div class="shim" aria-hidden="true" inert>').join('<div>');const i=shape.indexOf('<div class="card');const j=shape.indexOf('>',i)+1;
  return '<div class="errwrap">'+shape.slice(0,i)+shape.slice(i,j).replace('class="card','class="card errcard')+'<div class="errbox" role="alert">'+errInner(what)+'</div>'+shape.slice(j)+'</div>'}
function errInner(what){return ic('alert','lg')+'<b>We couldn’t load '+(what||'your household')+'.</b><p>Check your internet, then try again. Nothing was changed.</p><button class="btn sec" data-act="retry" data-k="retry">'+ic('reload')+'Try Again</button>'}

/* ---------- hub ---------- */
function hubHTML(){
  const m=me(),c=counts(),ro=S.role==='limited';
  /* phone: no count line (the rows carry their counts), a one-row profile card and one-line Me rows, so House Rules and People
     show on the first screen above the tab bar (round 6) */
  const P=S.phone,ml=(t)=>P?'':t;
  let h=P?'':'<p class="countln">'+c.people+' people · '+c.places+' storage places</p>';
  h+='<section class="sec"><div class="sechd"><span class="eyebrow">Me</span></div>'+(P?'':'<p class="lede" style="margin-bottom:12px">Yours alone to change. The rest of the home only sees your name and colour.</p>');
  /* phone: the profile card is one compact row and IS the Your Colour row (the hub is About You; no new page, round 8) */
  /* round 10: your own name is yours to change again (live ProfileCard: name and colour). Phone: the one-row card opens About You;
     computer and iPad: Your Name and Your Colour rows, both open the same small About You pop-up */
  if(P)h+='<button class="card prof one" data-act="me" data-k="me" aria-label="About You: '+esc(m.name)+', colour '+m.cname+'. Change your name or colour."><span class="av" style="background:'+m.color+'">'+initials(m.name)+'</span><span class="tx"><b>'+esc(m.name)+'</b><small>'+TIER[m.tier]+' · '+esc(m.email)+'</small><small>Change your name or colour</small></span><span class="dot" style="background:'+m.color+'"></span><span class="chev">'+ic('right')+'</span></button>';
  else h+='<div class="card prof"><div class="ph"><span class="av lg" style="background:'+m.color+'">'+initials(m.name)+'</span><div class="tx"><b>'+esc(m.name)+'</b><small>'+TIER[m.tier]+' · '+esc(m.email)+'</small></div></div></div>';
  /* round 12: on a computer and iPad, Your Name and Your Colour are the first two rows of the Me card under it, drawn exactly like
     Reminders and the rest (they were a lighter row style inside the profile card) */
  const merow=P?'':'<button class="row" data-act="me" data-k="me-name"><span class="tile">'+ic('user')+'</span><span class="tx"><b>Your Name</b><small>What everyone at home sees.</small></span><span class="end"><span class="val">'+esc(m.name)+'</span><span class="chev">'+ic('right')+'</span></span></button>'+
    '<button class="row" data-act="me" data-k="me-col"><span class="tile"><span class="dot" style="background:'+m.color+'"></span></span><span class="tx"><b>Your Colour</b><small>Shows next to your name on plans, meals and lists.</small></span><span class="end"><span class="val">'+m.cname+'</span><span class="chev">'+ic('right')+'</span></span></button>';
  /* phone rows are one line, except the two that warn: Sign Out of All Devices (it does NOT switch off the kitchen iPad,
     CODE_MAP 7.2) and Leaving (a short line; Limited's says to ask the Owner). A two-line .one row is still 52 tall. */
  const one=(go,icn,t,l,end,keep)=>P?hrow(go,icn,t,keep||'',end,false,'one'):hrow(go,icn,t,l,end);
  h+='<div class="card rows" style="margin-top:16px">'+
    (P?'':merow)+
    one('reminders','bell','Reminders for Me','When things come back to you.')+
    one('signin','key','Sign-in Methods','How you sign in.')+
    (ro?'':one('export','download','Export My Data','One file, once a week.','<span class="val" style="color:var(--sage-text)">Export</span>'))+
    one('signout','logout','Sign Out of All Devices','For a lost phone. Not the kitchen iPad.','','Not the kitchen iPad.')+
    one('leaving','door','Leaving SupperCraft',ro?'Ask the Owner to take you off, or delete your account.':'Leave, or delete your account.','',ro?'Ask the Owner to take you off.':'Leave, or delete your account.')+'</div></section>';
  if(!S.wide){
    h+='<section class="sec"><div class="sechd"><span class="eyebrow">My Household</span></div><p class="lede" style="margin-bottom:12px">'+(S.phone?'The Owner and Full Access change these.':'Everyone at home sees these. The Owner and Full Access can change them.')+'</p><div class="card rows">'+NAV_HH.map(x=>hrow(x[0],x[1],x[2],S.phone?x[5]:x[3],x[4]?'<span>'+((x[4]==='devices'&&ro)?'':c[x[4]])+'</span>':'')).join('')+'</div></section>';
    h+='<section class="sec"><div class="sechd"><span class="eyebrow">Help</span></div><div class="card rows">'+NAV_HELP.map(x=>hrow(x[0],x[1],x[2],'')).join('')+'</div></section>'+footHTML('p');
  }
  return h;
}
function hrow(go,icn,t,l,end,nochev,cls){return '<button class="row'+(cls?' '+cls:'')+'" data-go="'+go+'"><span class="tile">'+ic(icn)+'</span><span class="tx"><b>'+t+'</b>'+(l?'<small>'+l+'</small>':'')+'</span><span class="end">'+(end||'')+(nochev?'':'<span class="chev">'+ic('right')+'</span>')+'</span></button>'}

/* ---------- People ---------- */
function peopleHTML(){
  /* round 10: one load-failed card size on every page (the compact card House Rules and Devices use) */
  /* round 13: the failed card is the loading card's own size and slot; the page's line, the list's heading and Add a Person stay */
  if(S.error){const sp=splitLede(realPage(peopleHTML));return '<p class="lede">New plans cook for one serving per person.</p>'+errorHTML('your household','<div class="shim" aria-hidden="true" inert>'+sp[1].replace(/<button class="btn sec sm" data-act="add" data-k="add2"[^>]*>/,'<button class="btn sec sm errvis" data-k="add2" aria-disabled="true" title="Try Again first.">').replace(/<span class="cnt">[^<]*<\/span>/,'')+'</div>')}
  const r=S.role,ppl=signed().concat(nosign()),n=S.people.length;
  let h='<p class="lede">New plans cook for '+(S.rules.eatHand?S.rules.eat+' (set by hand in House Rules).':n+', one for each person here.')+'</p>'+offNote();
  const kit=S.dev.on==='kitchen';
  /* the Owner's main button (Invite Someone) is in the tan bar; Add a Person sits in the list's own heading, above the
     list, so it never falls below the fold on a big home (round 6). Full Access has Add a Person in the tan bar instead.
     Round 10: it is an ordinary mid-sage button (DESIGN 2.2.2), not the amber-edged tan one. */
  const addHd=r==='owner'&&!kit?'<button class="btn sec sm" data-act="add" data-k="add2"'+dis(S.offline,offWhy())+'>'+ic('plus','sm')+'Add a Person</button>':'';
  h+='<section class="sec"><div class="sechd'+(addHd?' hasbtn':'')+'"><span class="eyebrow">Everyone Who Eats Here</span><span class="cnt">'+n+' people</span>'+addHd+'</div><div class="card rows" id="plist">'+ppl.map(prow).join('')+'</div>';
  /* on the shared kitchen iPad the server refuses access changes, invites and leaving (CODE_MAP 3.1, 6.2): say where to do them */
  if(kit&&r!=='limited')h+='<p class="note">'+ic('info','sm')+'<span>This is the kitchen iPad. To invite someone or change what someone can do, use your own phone or computer.</span></p>';
  else if(r==='full')h+='<p class="note">'+ic('info','sm')+'<span>Only the Owner can invite someone or change what a signed-in person can do. You can add, rename or take off people who don’t sign in.</span></p>';
  else if(r==='limited')h+='<p class="note">'+ic('info','sm')+'<span>The Owner looks after this.</span></p>';
  h+='</section>';
  if(r!=='limited'&&S.invites.length)h+='<section class="sec"><div class="sechd"><span class="eyebrow">Waiting to Join</span><span class="sp"></span><span class="cnt">'+S.invites.length+(S.invites.length===1?' invite':' invites')+'</span></div><div class="card rows">'+S.invites.map(irow).join('')+'</div></section>';
  if(kit)h+='<section class="sec"><p class="note" style="margin:0">'+ic('door','sm')+'<span>To leave this home, sign in to your own account on your phone or computer.</span></p></section>';
  else h+='<section class="sec"><div class="card rows">'+hrow('leaving','door','Leaving SupperCraft',r==='limited'?'Ask the Owner to take you off, or delete your account.':'Leave this home, or delete your account.')+'</div></section>';
  return h;
}
/* who may open a row (CODE_MAP 3.2, 6.2): the Owner opens other signed-in people (not on the kitchen iPad, not offline);
   the Owner and Full Access open people who don't sign in (not offline: their sheet is only for changing). Nobody opens their
   own row here. Limited opens nothing. Offline, the Owner can still open a signed-in person's page to read it (Save is off there).
   openPerson() checks this too, so nothing can open a row that shows no arrow. */
function canOpen(p){
  if(!p)return false;const r=S.role,isMe=p.id===me().id;
  if(isMe)return false;
  /* round 10: one offline rule: every row that opens online still opens offline, to read (its Save is off and says why) */
  if(p.band)return r==='owner'||r==='full';
  return r==='owner'&&S.dev.on!=='kitchen';
}
/* sign-in facts (email, last used) go only to the Owner and Full Access, and never on the shared kitchen iPad (CODE_MAP 3.2, 6.2 _may_see_sign_in_facts) */
function seesFacts(){return S.role!=='limited'&&S.dev.on!=='kitchen'}
function prow(p){
  const isMe=p.id===me().id,opens=canOpen(p),facts=seesFacts();
  const av=p.band?'<span class="av md plain">'+initials(p.name)+'</span>':'<span class="av md" style="background:'+p.color+'">'+initials(p.name)+'</span>';
  let l2,l3='';
  /* access, then last used, on ONE line (round 10); the email is a third line on computer and iPad, and on the phone waits on the person's page */
  if(p.band)l2='<span class="tag">No Sign-in</span><span>· '+(p.band==='child'?'Child':'Adult')+'</span>';
  else{l2='<span class="tag">'+TIER[p.tier]+'</span>'+(facts&&!isMe?'<span class="used">· '+p.used+'</span>':'');
    if(facts)l3='<div class="l3">'+esc(p.email)+'</div>'}
  const inner=av+'<span class="tx"><span class="nm">'+esc(p.name)+(isMe?'<em>· that’s you</em>':'')+'</span><span class="l2">'+l2+'</span>'+l3+'</span><span class="chev'+(opens?'':' none')+'">'+ic('right')+'</span>';
  /* a row that doesn't open carries only data-pid (for the "just changed" glow), never data-person, so a click does nothing */
  if(!opens)return '<div class="row prow" data-pid="'+p.id+'">'+inner+'</div>';
  return '<button class="row prow" data-pid="'+p.id+'" data-person="'+p.id+'" data-k="p-'+p.id+'" aria-label="'+esc(p.name)+', '+(p.band?'no sign-in':TIER[p.tier])+'">'+inner+'</button>';
}
/* the server masks invite emails on the shared iPad and for Limited (CODE_MAP 6.3, HHAUTH F5) */
function maskEmail(e){const i=e.indexOf('@');return e[0]+'•••'+e.slice(i)}
function irow(v,i){
  const own=S.role==='owner'&&S.dev.on!=='kitchen',off=S.offline;
  const tt='<span class="tag">'+TIER[v.tier]+'</span>';
  const sub=v.ran?tt+'<span class="tag amb">Ran Out</span><span>'+v.ran+'. They can’t join with it.</span>':(v.nomail?tt+'<span class="tag amb">Email Didn’t Go Out</span><span>They didn’t get it.</span>':tt+'<span>· '+(S.phone?'':'Sent '+v.sent+' · ')+'Works until '+v.until+'</span>');
  /* no Resend: the server has none. A dead invite gets "Invite Again" (cancel, then a new invite to the same email).
     Cancel Invite deletes the link, so it has the red outline the live app's Revoke has (MemberAction look="danger", round 10). */
  const again=v.ran||v.nomail;
  const acts=own?'<span class="acts">'+(again?'<button class="btn sec sm" data-act="inv-again" data-i="'+v.id+'" data-k="ia-'+v.id+'"'+dis(off,offWhy())+'>Invite Again</button>':'')+'<button class="btn danger sm" data-act="inv-cancel" data-i="'+v.id+'" data-k="ic-'+v.id+'" aria-label="Cancel the invite for '+esc(v.email)+'"'+dis(off||v.busy,off?offWhy():'Cancelling. Wait a moment.')+'>'+(v.busy?'<span class="spin"></span>Cancelling':'Cancel Invite')+'</button></span>':'';
  /* round 10: a cancel that failed says so on its own row, with Try Again (the invite still works) */
  const ferr=v.cfail?'<div class="err" role="alert" style="flex:1 1 100%;margin-top:8px"><span class="em">'+ic('alert','sm')+'<span>We couldn’t cancel this invite. It still works.</span></span><button class="btn sec sm" data-act="inv-cancel" data-i="'+v.id+'" data-k="icr-'+v.id+'">Try Again</button></div>':'';
  return '<div class="row prow inv'+(v.lit?' lit':'')+(v.cfail?' hasferr':'')+'" data-inv="'+v.id+'"><span class="tile">'+ic('mail')+'</span><span class="tx"><b>'+esc(seesFacts()?v.email:maskEmail(v.email))+'</b><span class="l2">'+sub+'</span></span>'+(v.cfail?'':acts)+ferr+'</div>';
}

/* ---------- One person's page ---------- */
function startDraft(){const p=person(S.pid);S.saved={tier:p.tier,perm:Object.assign({},p.perm||PERM_SAM)};S.draft={tier:p.tier,perm:Object.assign({},S.saved.perm)}}
function dirty(){if(!S.draft)return false;if(S.draft.tier!==S.saved.tier)return true;if(S.draft.tier!=='limited')return false;return Object.keys(S.draft.perm).some(k=>S.draft.perm[k]!==S.saved.perm[k])}
function tierSentence(t,n){return t==='owner'?n+' can do everything, like you, including who lives here. A second Owner is your backup.':t==='full'?n+' can plan, cook, shop, change the house rules and add people who don’t sign in, but can’t invite people or change what anyone can do.':n+' can see everything at home. You choose what else '+n+' can do.'}
function alsoLine(n){const on=Object.keys(PERM_WORDS).filter(k=>S.draft.perm[k]);if(!on.length)return n+' can only look.';const w=on.map(k=>PERM_WORDS[k]);return n+' can also '+(w.length>1?w.slice(0,-1).join(', ')+' and '+w[w.length-1]:w[0])+'.'}
function pheadHTML(p){return '<div class="phead"><span class="av lg" style="background:'+p.color+'">'+initials(p.name)+'</span><div class="tx"><b>'+esc(p.name)+'</b><small>'+esc(p.email)+'</small><small>Joined '+p.joined+' · '+p.used+'</small></div></div>'}
function personHTML(){
  /* round 10: while it saves, the whole Access card is locked (what saves is what you pressed Save on) */
  const p=person(S.pid),d=S.draft,lim=d.tier==='limited',off=S.offline||S.conflict||S.busy;
  const offWhyP=S.busy?'Saving. Wait a moment.':S.conflict?'Reload first.':offWhy();
  let h=pheadHTML(p)+offNote();
  /* only an Owner can change this, so the other change came from another device (or a backup Owner): never name a Full Access person here */
  if(S.conflict)h+='<div class="notice">'+ic('alert')+'<div class="tx"><b>What '+esc(p.name)+' can do changed a minute ago, somewhere else.</b><p>Your change was not saved. Reload to see the newest, then change it again.</p><div class="acts"><button class="btn sec sm" data-act="reload" data-k="reload">'+ic('reload','sm')+'Reload</button></div></div></div>';
  h+='<section class="card acc"><div class="cardhd"><span class="eyebrow">Access</span><span class="sp"></span><span class="tag amb'+(dirty()?'':' hid')+'" id="unsaved">Not Saved Yet</span></div>';
  h+='<div class="seg" role="radiogroup" aria-label="Access">'+['owner','full','limited'].map(t=>'<button role="radio" aria-checked="'+(d.tier===t)+'" data-tier="'+t+'" data-k="t-'+t+'"'+dis(off,offWhyP)+'>'+TIER[t]+'</button>').join('')+'</div>';
  h+='<p class="tsent" id="tsent">'+tierSentence(d.tier,p.name)+'</p>';
  h+='<div '+fold('f-cust',lim)+'><div><button class="crow" data-act="customise" data-k="cust" aria-expanded="'+S.cust+'" aria-controls="f-sw"'+dis(S.busy,offWhyP)+'><span class="tx"><b>Customise What '+esc(p.name)+' Can Do</b><small id="also">'+alsoLine(p.name)+'</small></span><span class="chev">'+ic('down')+'</span></button>';
  const gOn=PERMS[0],gCh=PERMS[1];
  h+='<div '+fold('f-sw',lim&&S.cust)+'><div><div class="pgrp"><h4>'+gCh.h+'</h4><p class="gl">'+gCh.gl+'</p>'+gCh.items.map(it=>{
      const on=!!d.perm[it[0]];return '<div class="prm"><span class="l" id="pl-'+it[0]+'">'+it[1]+'</span>'+swHTML('perm-'+it[0],on,'aria-labelledby="pl-'+it[0]+'" data-perm="'+it[0]+'"',off,offWhyP)+'</div>'}).join('')+'</div>'+
    '<div class="lockln"><p>'+ic('lock','sm')+'<span><b>Always on:</b> '+esc(p.name)+' can always see the kitchen, recipes, the plan, the shopping list, cooking as it happens, meals cooked before and the prep list.</span></p>'+
    '<p>'+ic('lock','sm')+'<span><b>Full Access only:</b> skipping a prep job, making a new prep list, folding away a prep card, sending or stopping the shopping link and sharing a cooking session. Pick Full Access above to allow these.</span></p></div></div></div>';
  h+='</div></div>';
  /* round 10: a failed save says so inside the Access card, keeps the change, and offers Try Again; "couldn't tell" says Reload */
  if(S.sfail==='fail')h+='<div class="err" role="alert" style="margin:16px 0 0"><span class="em">'+ic('alert','sm')+'<span>We couldn’t save that. '+esc(p.name)+' still has '+TIER[S.saved.tier]+'. Your change is still here.</span></span><button class="btn sec sm" data-act="save-retry" data-k="sretry">Try Again</button></div>';
  if(S.sfail==='unknown')h+='<div class="err" role="alert" style="margin:16px 0 0"><span class="em">'+ic('alert','sm')+'<span>We couldn’t tell whether that saved. Reload to see what '+esc(p.name)+' can do now.</span></span><button class="btn sec sm" data-act="save-reload" data-k="sreload">'+ic('reload','sm')+'Reload</button></div>';
  h+='</section>';
  h+='<div class="dz"><button class="btn danger" data-act="remove" data-k="remove"'+dis(S.offline||S.busy,S.busy?'Saving. Wait a moment.':offWhy())+'>Remove '+esc(p.name)+'</button><p>'+esc(p.name)+' won’t be able to open '+HOME+' after this. What '+esc(p.name)+' added stays.</p></div>';
  return h;
}
function swHTML(k,on,attrs,off,why){return '<button class="sw" role="switch" aria-checked="'+on+'" data-k="'+k+'" '+attrs+dis(off,why||offWhy())+'><span class="tr"></span><span class="wd">'+(on?'On':'Off')+'</span></button>'}

/* ---------- House Rules ---------- */
function rulesHTML(){
  /* ed: may change right now. Offline or a 409 (someone else changed it) locks every control until Reload, like Sam's page */
  const R=S.rules,ed=canEditRules()&&!S.offline&&!S.rconflict,ro=!canEditRules(),n=S.people.length,why=()=>S.rconflict?'Reload first. The house rules changed somewhere else.':offWhy();
  const sw=(key)=>{
    if(S.rsave===key)return '<span class="saving" role="status"><span class="spin"></span>Saving</span>';
    if(ro)return '<span class="ro">'+(R[key]?'On':'Off')+'</span>';
    return swHTML('r-'+key,R[key],'data-rule="'+key+'" aria-labelledby="rl-'+key+'"',!ed,why())};

/* the busy wait, then the action (mockup: 700 ms). The failures: Apple's sheet closed or Face ID failed ('notdone'), signed in as
   another account ('other'), the server refused or the internet dropped ('net'). Nothing changes on any of them. */
function authDone(){
  const o=S.auth;if(!o||o.busy)return;const m=authMethod(o);
  if(m==='link'){o.sent=true;o.fail=null;drawAuth();return}
  if(m==='password'){const v=o.pw||'';
    if(!v){o.bad='empty';drawAuth();focusPw();return}
    /* mockup only: the password "wrong" shows the wrong-password line */
    if(v.toLowerCase()==='wrong'){o.bad='wrong';o.pw='';drawAuth();focusPw();return}}
  o.busy=true;o.fail=null;drawAuth();
  setTimeout(()=>{if(S.auth!==o||!o.busy)return;
    if(S.failNext==='auth'||S.failNext==='authother'||S.failNext==='authnet'){o.fail=({auth:'notdone',authother:'other',authnet:'net'})[S.failNext];S.failNext=null;o.busy=false;drawAuth();return}
    /* the action runs first, then the pop-up closes: a sheet that comes back (Invite: Sending) shows in its new state, and a
       sheet the action closes (Set Up) never flashes back on its way out (round 9) */
    S.auth=null;S.oldSignIn=false;OLD_SIGNIN=false;drawMock();
    /* round 13: a merged yes/no can still fail AFTER the sign-in: its result goes through the same red line (FAIL) as the plain pop-up */
    if(o.for==='remove'&&S.failNext==='remove'){S.failNext=null;S.ov={k:'remove',id:o.id||S.pid,fail:FAIL.remove};drawAuth();drawOv();return}
    if(o.for==='switchoff'&&S.failNext==='switchoff'){S.failNext=null;S.ov={k:'switchoff',which:o.which,fail:FAIL.switchoff};drawAuth();drawOv();return}
    ({switchoff:()=>doSwitchOff(o.which),remove:()=>doRemove(o.id||S.pid),save:doSave,invite:sendInvite,setup:finishSetup})[o.for]();
    drawAuth()},700);
}

function toast(msg,undo){
  const box=document.getElementById('toasts');box.innerHTML='';
  const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');
  t.innerHTML='<span>'+msg+'</span>'+(undo?'<button data-act="undo">Undo</button>':'')+'<button class="tx" data-act="toastx" aria-label="Close">'+ic('x','sm')+'</button>';
  box.appendChild(t);toast.undo=undo||null;clearTimeout(toast.h);toast.h=setTimeout(()=>hideToast(),6000);
  /* a toast that comes with a changed row: that row's one move also keeps the toast clear (showChanged). Otherwise nothing moves. */
  /* measured once the type has loaded (a late font reflows the list by a few px) */
  if(CHANGED){const c=CHANGED;CHANGED=null;document.fonts.ready.then(()=>requestAnimationFrame(()=>showChanged(c,true)))}
}
function hideToast(){const t=document.querySelector('.toast');if(!t)return;t.classList.add('out');setTimeout(()=>t.remove(),200);toast.undo=null}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(document.getElementById('menu').classList.contains('open')){closeMenu();return}if(S.auth){S.auth=null;drawAuth();return}if(S.ov&&!S.ov.busy&&!S.ov.saving){S.ov=null;drawOv()}return}
  if(e.key==='Enter'&&S.auth&&e.target.id==='f-pw'){e.preventDefault();const b=document.querySelector('#authscrim [data-act="auth-yes"]');if(b)b.click();return}
  if(e.key==='Enter'&&S.ov&&e.target.tagName==='INPUT'){const b=document.querySelector('#scrim .ft .btn.pri,#scrim .stack .btn:first-child');if(b){e.preventDefault();b.click()}}
  if(e.key==='Tab'&&(S.ov||S.auth)){const L=S.auth?'#authscrim':'#scrim';const f=[...document.querySelectorAll(L+' button,'+L+' input')].filter(x=>x.offsetParent);if(!f.length)return;const i=f.indexOf(document.activeElement);if(e.shiftKey&&i<=0){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&i===f.length-1){e.preventDefault();f[0].focus()}}

/* mockup only: a phone or iPad shows its keyboard while a box in a pop-up has focus; the pop-up rides up above it */
function touchDev(){return !!S.phone||document.documentElement.classList.contains('tablet')}
function kbOn(t){if(!touchDev()||t.readOnly)return;const h=S.phone?336:(innerWidth>innerHeight?398:364);const d=document.documentElement;d.style.setProperty('--kbh',h+'px');d.classList.add('kb');
  requestAnimationFrame(()=>{if(!t.isConnected)return;
    /* round 14: keep the whole box AND its red line clear of the buttons that stick to the bottom of the pop-up */
    const sh=t.closest('.sheet'),st=sh&&sh.querySelector('.stack,.ft');if(sh)sh.style.scrollPaddingBottom=((st?st.offsetHeight:0)+12)+'px';
    const f=t.closest('.fld')||t,q=t.dataset.mt==='d'&&document.querySelector('#scrim .qt');(q||f).scrollIntoView({block:'nearest'});if(q)f.scrollIntoView({block:'nearest'})})}
function kbOff(){document.documentElement.classList.remove('kb')}
document.addEventListener('focusin',e=>{const t=e.target;if(t.tagName==='INPUT'&&t.closest('#scrim,#authscrim')){kbOn(t);if(t.dataset.mt!==undefined&&t.select)t.select()}else if(!t.closest||!t.closest('#scrim,#authscrim'))kbOff()});
document.addEventListener('focusout',e=>{setTimeout(()=>{const a=document.activeElement;if(!(a&&a.tagName==='INPUT'&&a.closest('#scrim,#authscrim')&&!a.readOnly))kbOff()},0)});
let drag=null;
document.addEventListener('pointerdown',e=>{if(!S.phone||!S.ov)return;const g=e.target.closest('#scrim .grab,#scrim .sheet:not(.confirm) .hd');if(!g||e.target.closest('button:not(.grab)'))return;const sh=g.closest('.sheet');drag={y:e.clientY,sh:sh,dy:0};sh.classList.add('drag');sh.style.transition='none'});
document.addEventListener('pointermove',e=>{if(!drag)return;drag.dy=Math.max(0,e.clientY-drag.y);drag.sh.style.transform='translateY('+drag.dy+'px)'});
document.addEventListener('pointerup',()=>{if(!drag)return;const d=drag;drag=null;d.sh.classList.remove('drag');if(d.dy>90&&!(S.ov&&S.ov.busy)){S.ov=null;drawOv()}else{d.sh.style.transition='transform .2s';d.sh.style.transform=''}});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(layout())render(false)},80)});

/* ===================== mockup-only bar ===================== */
function drawMock(){
  const inMore=MORE.some(m=>m[0]===S.st&&m.length>1);
  const cur=inMore?MORE.find(m=>m[0]===S.st)[1]:'More';
  document.getElementById('mock').innerHTML='<span>Mockup only:</span>'+STATES.map(s=>'<button class="'+(S.st===s[0]?'on':'')+'" data-s="'+s[0]+'">'+s[1]+'</button>').join('')+'<button data-more="1" class="'+(inMore?'on':'')+'">'+cur+' ▾</button>'+
    '<button data-old="1" class="'+(S.oldSignIn?'on':'')+'" aria-pressed="'+!!S.oldSignIn+'" title="Your last sign-in is over 5 minutes old: risky actions ask you to sign in again">Old Sign-in: '+(S.oldSignIn?'On':'Off')+'</button>';
  document.getElementById('mockmore').innerHTML=MORE.map(m=>m.length===1?'<b>'+m[0]+'</b>':'<button class="'+(S.st===m[0]?'on':'')+'" data-s="'+m[0]+'">'+m[1]+'</button>').join('');
}
function toggleMore(btn){const mm=document.getElementById('mockmore');if(mm.classList.contains('open')){mm.classList.remove('open');return}mm.classList.add('open');const r=btn.getBoundingClientRect();mm.style.top=(r.bottom+6)+'px';mm.style.left=Math.max(8,Math.min(r.right-mm.offsetWidth,innerWidth-mm.offsetWidth-8))+'px'}

S=fresh();layout();
setState(Q.get('state')||'people');
