<!doctype html>
<html lang="en">
<head><script>window.SC_FULL='phone'</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings r16 iPhone</title>
<script>
/* Settings v2 (My Household) mockup, T-2162. NOT agreed: built on the overnight picks in ../QUESTIONS_MORNING.md.
   One file. Full-screen mode for the review links: window.SC_FULL = desktop | ipad | phone, or ?full=ipad by hand.
   ?state=<id> opens one state (the shot and walk scripts use it); ?bar=0 hides the dark mockup-only bar. */
window.FULL=window.SC_FULL||new URLSearchParams(location.search).get('full')||'';
if(window.FULL)document.documentElement.classList.add('full','full-'+window.FULL);
if(new URLSearchParams(location.search).get('bar')==='0')document.documentElement.classList.add('nobar');
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,600&display=swap" rel="stylesheet">
<style>
/* Frame, tokens and kit parts copied from the Plan v3 mockup (which copies the live app and src/kit):
   header 50, app rail 219 (64 under 1100), tan bar 46, Button 44 radius 8, Chip 44 radius 8, Card radius 12,
   Sheet radius 16, Dialog 420, toast bottom right, scroll bar 12 gutter / 6 thumb.
   Settings frame copied from SettingsChrome.tsx: its own side list 236 wide (ME / MY HOUSEHOLD / HELP) when the
   content is 660 or wider, a chip row at 600-659, the hub list on the phone. */
:root{
  --page:#EDE5D8; --card:#FAF6EE; --panel:#F6F2E9; --panel-alt:#F1E8DA; --alert:#F8F0E0;
  --header:#6B3E14; --subbar:#E4D3B3; --hdr-text:#FAF4EB; --subbar-date:#5C3D0A; --subbar-2:#7A5030;
  --ink:#1E1E1C; --ink2:#54524A; --muted:#605E55;
  --sage:#8FAF8A; --sage-dark:#1F3A1C; --sage-light:#E4EDE2; --sage-text:#4B6947; --sage-line:#B9CDB4;
  --amber:#C8943A; --amber-light:#F5ECD8; --amber-text:#7E5C22;
  --urgent-bg:#F5E4E4; --urgent-text:#5C1A1A; --urgent-border:#8E3131;
  --chip:#E4D9C6; --chip-on:#B7D0B0; --chip-warm:#EFE4CC; --chip-warm-edge:#988048;
  --row-hover:#F0EEE3; --track:#DDD5C5;
  --bcard:rgba(0,0,0,.09); --brow:rgba(0,0,0,.06); --scrim:rgba(0,0,0,.4);
  --shadow-card:0 1px 2px rgba(45,33,22,.055),0 6px 16px rgba(45,33,22,.055);
  --shadow-pop:0 4px 14px rgba(45,33,22,.16); --shadow-float:0 16px 48px rgba(45,33,22,.2);
  --hover:inset 0 0 0 100px rgba(30,30,28,.04); --press:inset 0 0 0 100px rgba(30,30,28,.16);
  --c-muted:96 94 85; --c-ink2:84 82 74;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --ease:cubic-bezier(.25,.46,.45,.94);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--page)}
body{color:var(--ink);font:400 15px/1.45 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input{font:inherit;color:inherit}
p{margin:0}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:16px;height:16px}svg.i.lg{width:24px;height:24px}svg.i.xl{width:32px;height:32px}
svg.ni{display:block;overflow:visible;width:24px;height:24px;flex:none}
:focus-visible{outline:2px solid var(--sage-text);outline-offset:2px}
[tabindex="-1"]:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fadeout{from{opacity:1}to{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
@keyframes slidedown{from{transform:none}to{transform:translateY(100%)}}
@keyframes shimmer{from{background-position:-600px 0}to{background-position:600px 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes lit{0%{background:var(--sage-light)}100%{background:transparent}}

/* the one themed scroll bar (DESIGN 4.10) */
.scroll,.srail,.sheet,.menu .mi,.mock,.mockmore{scrollbar-width:thin;scrollbar-color:rgb(var(--c-muted) / .35) transparent}
.scroll::-webkit-scrollbar,.srail::-webkit-scrollbar,.sheet::-webkit-scrollbar,.menu .mi::-webkit-scrollbar,.mockmore::-webkit-scrollbar{width:12px;height:12px}
.scroll::-webkit-scrollbar-thumb,.srail::-webkit-scrollbar-thumb,.sheet::-webkit-scrollbar-thumb,.menu .mi::-webkit-scrollbar-thumb,.mockmore::-webkit-scrollbar-thumb{background:rgb(var(--c-muted) / .35);border:3px solid transparent;background-clip:padding-box;border-radius:999px}
.scroll::-webkit-scrollbar-thumb:hover,.srail::-webkit-scrollbar-thumb:hover,.sheet::-webkit-scrollbar-thumb:hover{background-color:rgb(var(--c-ink2) / .7)}
.scroll::-webkit-scrollbar-track,.srail::-webkit-scrollbar-track,.sheet::-webkit-scrollbar-track,.menu .mi::-webkit-scrollbar-track{background:transparent}

/* ---------- app frame ---------- */
.app{height:100vh;height:100dvh;display:grid;grid-template-columns:219px minmax(0,1fr);grid-template-rows:50px minmax(0,1fr)}
.top{grid-column:1/-1;display:flex;align-items:center;padding:0 28px 0 12px;color:var(--hdr-text);background:var(--header);position:relative}
.top::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(0,0,0,.10));pointer-events:none}
.wordmark{font-style:italic;font-weight:600;font-size:22px;position:relative;letter-spacing:.01em}
.top .sp{flex:1}
.av{display:inline-grid;place-items:center;border-radius:50%;font-weight:600;color:#fff;flex:none;line-height:1}
.av.hdr{width:28px;height:28px;font-size:12px;box-shadow:0 0 0 2px var(--hdr-text);position:relative;z-index:1}
.av.hdr::after{content:"";position:absolute;inset:-8px}
.av.md{width:40px;height:40px;font-size:15px}
.av.lg{width:56px;height:56px;font-size:20px}
.av.plain{background:var(--chip);color:var(--ink2);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.rail{background:var(--card);border-right:1px solid var(--bcard);padding:12px 8px;display:flex;flex-direction:column;gap:4px;min-height:0;overflow:hidden}
.rail .cap{height:44px;border-radius:8px;background:var(--sage);color:var(--ink);display:flex;align-items:center;gap:8px;padding:0 12px;font-weight:500;font-size:16px;margin-bottom:8px;flex:none}
.rail .ri{display:flex;align-items:center;gap:12px;height:44px;border-radius:8px;padding:0 12px;color:var(--ink2);font-weight:500;font-size:16px;text-align:left;flex:none}
.rail .ri:hover,.rail .cap:hover{box-shadow:var(--hover)}
.rail hr{border:0;border-top:1px solid var(--bcard);margin:4px 8px;flex:none}
.rail .grow{flex:1}
.body{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:0;min-width:0;position:relative;overflow:hidden}
.main{display:grid;grid-template-rows:46px minmax(0,1fr);min-height:0;min-width:0}

/* Settings' own side list (SettingsChrome rail, 236 wide) */
.srail{background:var(--card);border-right:1px solid var(--bcard);padding:8px 8px 0;overflow:auto;display:flex;flex-direction:column;min-height:0}
.srail .grp{font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 12px 4px}
.srail .srow{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 10px;white-space:nowrap;border-radius:8px;font-size:15px;font-weight:500;color:var(--ink);width:100%;text-align:left;flex:none}
.srail .srow svg{color:var(--ink2)}
.srail .srow:hover{box-shadow:var(--hover)}
.srail .srow.on{background:var(--chip-on);color:var(--ink);font-weight:600}
.srail .srow.on svg{color:var(--sage-dark)}
.srail .srow .n{margin-left:auto;font-size:13px;color:var(--ink2);min-width:12px;text-align:right}
.srail .foot{margin-top:auto;font-size:13px;color:var(--ink2);padding:16px 12px 14px;flex:none}
.srail .n .sk{display:inline-block;width:12px;height:12px;vertical-align:-1px}

/* tan bar (C-057): title, one main button on the right, the ⋯ menu. Nothing else. */
.bar{background:var(--subbar);border-bottom:1px solid var(--brow);position:relative;display:flex;min-width:0}
.bar .in{display:flex;align-items:center;gap:8px;width:100%;padding:0 12px 0 16px;min-width:0}
/* the live title is Txt kind=item weight=bold, upright (SettingsChrome.tsx:254); italic is the wordmark's only (DESIGN 2.5.5) */
.bar .ttl{margin:0;font-weight:700;font-style:normal;font-size:16px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bar .ttl .crumb{font-weight:500;font-style:normal;color:var(--subbar-2)}
.bar .ttl .crumb svg{width:14px;height:14px;vertical-align:-2px;margin:0 2px;color:var(--subbar-2)}
.bar .sp{flex:1}
.bar .btn{height:36px;padding:0 14px;font-size:15px}.bar .btn::after{content:"";position:absolute;inset:-4px 0}
.bar .btn.icon{width:36px;padding:0;color:var(--subbar-date)}.bar .btn.icon::after{inset:-4px}
.back{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--subbar-date);margin-left:-8px;position:relative;flex:none}
.back:hover{box-shadow:var(--hover)}.back::after{content:"";position:absolute;inset:-4px}
.back[aria-disabled="true"],.srail .srow[aria-disabled="true"],.schipsrow .chip[aria-disabled="true"]{opacity:.45;cursor:default;box-shadow:none}

/* kit Button */
.btn{height:44px;border-radius:8px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:500;font-size:16px;white-space:nowrap;transition:transform 50ms var(--ease),box-shadow .2s var(--ease),opacity .2s,background-color .2s;position:relative;flex:none}
.btn:active{transform:scale(.97);box-shadow:var(--press)}
.btn.pri{background:var(--sage-dark);color:var(--hdr-text)}.btn.pri:hover{box-shadow:inset 0 0 0 100px rgba(250,244,235,.08)}.btn.pri:active{box-shadow:inset 0 0 0 100px rgba(250,244,235,.16)}
.btn.sec{background:var(--sage);color:var(--ink)}.btn.sec:hover{box-shadow:var(--hover)}
.btn.cancel{background:transparent;border:1px solid var(--ink2);color:var(--ink)}.btn.cancel:hover{box-shadow:var(--hover)}
.btn.danger{background:transparent;border:1px solid var(--urgent-border);color:var(--urgent-text)}.btn.danger:hover{box-shadow:var(--hover)}.btn.danger:active{background:var(--urgent-border);color:var(--hdr-text)}
.btn.dangerfill{background:var(--urgent-border);color:var(--hdr-text)}
.btn.tan{background:var(--chip-warm);border:1px solid var(--chip-warm-edge);color:var(--ink)}.btn.tan:hover{box-shadow:var(--hover)}
.btn.icon{width:44px;padding:0;background:transparent;color:var(--ink2)}.btn.icon:hover{box-shadow:var(--hover)}
/* a smaller-looking button is still 44 tall on the page (BRIEF: buttons 44); only the tan-bar button is 36 with a 44 reach (bar is 46) */
.btn.sm{height:44px;padding:0 14px;font-size:15px}
.btn.wide{width:100%}
.btn[aria-disabled="true"]{opacity:.45;cursor:default;transform:none!important;box-shadow:none!important}
/* round 15: ONE off look (DESIGN 6.3, the one 0.45 opacity) on ONE base for every tier: mid sage, ink words, no edge (QUESTIONS 54) */
.btn[aria-disabled="true"]:not(.busy):not(.icon){background:var(--sage)!important;color:var(--ink)!important;border-color:transparent!important}
.btn.busy{cursor:progress;opacity:1}
.btn.busy:active{transform:none;box-shadow:none}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite;flex:none;opacity:.8}
/* round 10: ONE tag look, and it can't be mistaken for a button or a picked choice: plain words, no fill, no border.
   Access is ink-secondary words; a status that needs a look (Ran Out, Not Saved Yet) is amber words with a small amber dot. */
.tag{font-size:13px;font-weight:600;color:var(--ink2);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;line-height:20px}
.tag.amb{color:var(--amber-text)}
.tag.amb::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--amber);flex:none}
.tag.hid{visibility:hidden}
.eyebrow{font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--card);border-radius:12px;border:1px solid var(--bcard);box-shadow:var(--shadow-card)}
.chip{height:44px;border-radius:8px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:15px;color:var(--ink);background:var(--chip);border:1px solid transparent;font-weight:600;white-space:nowrap;transition:transform 50ms var(--ease),background-color .2s}
.chip:hover{box-shadow:var(--hover)}.chip:active{transform:scale(.97);box-shadow:var(--press)}
/* the one picked look (DESIGN 2.2.3): sage-light fill, sage-text words, 1px sage-text border. Chips, the access track,
   Time Zone rows and colour swatches all use it (round 10) */
.chip.on{background:var(--sage-light);border-color:var(--sage-text);color:var(--sage-text);font-weight:700}
.chip[aria-disabled="true"]{opacity:.45;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.sk{background:linear-gradient(90deg,var(--track) 0,var(--panel) 120px,var(--track) 240px) 0 0/600px 100%;animation:shimmer 1.4s linear infinite;border-radius:8px}
.fadein{animation:fade .2s var(--ease) both}

/* page column */
.scroll{overflow-y:auto;overflow-x:hidden;min-height:0;scrollbar-gutter:stable;position:relative}
.col{max-width:760px;margin:0 auto;padding:20px 24px 48px}
.col.reading{max-width:640px}
.col{container-type:inline-size}
@container (max-width:620px){.col .inv{flex-wrap:wrap}.col .inv .acts{flex:1 1 100%;padding-left:0}.col .inv .acts .btn{flex:1 1 0}}
.lede{color:var(--ink2);font-size:15px;margin:0 0 16px}
/* page sections only (a secondary button is also class "sec": round 8 scoped this so buttons get no 24 px margin) */
section.sec{margin:0 0 24px}
.sechd{display:flex;align-items:baseline;gap:8px;margin:0 0 8px;min-height:20px}
.sechd .sp{flex:1}
.sechd .cnt{font-size:13px;color:var(--ink2)}
.note{display:flex;gap:8px;align-items:flex-start;font-size:15px;color:var(--ink2);margin:12px 0 0}
.note svg{color:var(--ink2);margin-top:2px}

/* rows (SettingsRows: RowsCard + SettingsRow) */
.rows{overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:12px 16px;border-top:1px solid var(--brow);width:100%;text-align:left;position:relative}
.row:first-child{border-top:0}
button.row:hover,a.row:hover{background:var(--row-hover)}
button.row:active{box-shadow:var(--press)}
.row .tile{width:36px;height:36px;border-radius:8px;background:var(--chip);display:grid;place-items:center;flex:none;color:var(--ink2)}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:15px;font-weight:600;line-height:20px}
.row .tx small{display:block;font-size:13px;color:var(--ink2);line-height:18px;margin-top:2px}
.row .end{display:flex;align-items:center;gap:8px;margin-left:8px;flex:none;color:var(--ink2);font-size:15px}
.row .end .val{font-weight:600;color:var(--ink)}
.row .chev{color:var(--ink2)}
.row.lit{animation:lit 1.6s var(--ease)}

/* people rows */
.prow{align-items:flex-start}
.prow .av{margin-top:2px}
.prow .nm{font-size:16px;font-weight:600;line-height:22px;display:flex;flex-wrap:wrap;column-gap:6px;align-items:baseline}
.prow .nm em{font-style:normal;font-weight:400;font-size:13px;color:var(--ink2)}
.prow .l2{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:4px;font-size:13px;color:var(--ink2);line-height:20px}
.prow .l3{font-size:13px;color:var(--ink2);margin-top:2px;overflow-wrap:anywhere;line-height:18px}
.prow .chev{align-self:center}
.prow .chev.none{visibility:hidden}
.addrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.inv .tx b{overflow-wrap:anywhere}
.inv .acts{display:flex;gap:8px;flex:none;align-self:center}

/* switch (kit: our own, with the word On / Off beside it), radius 8 not a pill */
.sw{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 2px;font-size:15px;font-weight:600;color:var(--ink);flex:none}
.sw .tr{width:46px;height:28px;border-radius:8px;background:var(--track);position:relative;transition:background-color .2s var(--ease);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);flex:none}
.sw .tr::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:6px;background:#fff;box-shadow:0 1px 2px rgba(45,33,22,.25);transition:transform .2s var(--ease)}
.sw[aria-checked="true"] .tr{background:var(--sage-text)}
.sw[aria-checked="true"] .tr::after{transform:translateX(18px)}
.sw .wd{min-width:28px;text-align:left}
/* one offline rule (round 10): the On / Off word is a value and stays full ink; only the track fades */
.sw[aria-disabled="true"]{cursor:default}.sw[aria-disabled="true"] .tr{opacity:.45}
.sw.locked{cursor:default}
.sw.locked .tr{opacity:.55}
.saving{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-size:15px;color:var(--ink2);font-weight:500;min-width:84px}

/* House Rules rows with a control */
.rrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:12px 16px;border-top:1px solid var(--brow);min-height:68px}
.rrow:first-child{border-top:0}
.rrow .tx{flex:1 1 240px;min-width:0}
.rrow .tx b{display:block;font-size:15px;font-weight:600;line-height:20px}
.rrow .tx small{display:block;font-size:13px;color:var(--ink2);line-height:18px;margin-top:2px}
.rrow .ctl{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.rrow .ro{font-size:15px;font-weight:600;color:var(--ink);min-height:44px;display:flex;align-items:center}
.card>.err{margin:0 16px 12px}
.rrow .err,.card>.err{flex:1 1 100%;display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;background:var(--urgent-bg);color:var(--urgent-text);border-radius:8px;padding:8px 8px 8px 12px;font-size:15px}
/* the icon and the words travel together (the icon never sits alone on a line); Try Again keeps the right edge, or spans on the phone */
.err .em{display:flex;gap:8px;align-items:flex-start;flex:1 1 220px;min-width:0}
.err .em svg{margin-top:3px;flex:none}
.err .btn{flex:none;margin-left:auto}
.stepper{display:inline-flex;align-items:center;gap:4px}
.stepper button{width:44px;height:44px;border-radius:8px;background:var(--chip);display:grid;place-items:center;color:var(--ink)}
.stepper button:hover{box-shadow:var(--hover)}.stepper button:active{box-shadow:var(--press);transform:scale(.97)}
.stepper output{min-width:36px;text-align:center;font-size:17px;font-weight:600}
.timebtn{height:44px;border-radius:8px;background:var(--chip);padding:0 10px 0 14px;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:15px}
.timebtn:hover{box-shadow:var(--hover)}
.timebtn svg{color:var(--ink2);transition:transform .2s var(--ease)}
.timebtn[aria-expanded="true"] svg{transform:rotate(180deg)}
/* every control that can't be used right now looks it (DESIGN 6.3: 0.45) */
.timebtn[aria-disabled="true"],.stepper button[aria-disabled="true"],.sheet .x[aria-disabled="true"],.notice .x[aria-disabled="true"]{opacity:.45;cursor:default;box-shadow:none!important;transform:none!important}

/* notices */
.notice{display:flex;gap:12px;align-items:flex-start;border-radius:12px;padding:12px 12px 12px 16px;margin:0 0 16px;background:var(--alert);border:1px solid rgba(200,148,58,.45)}
.notice>svg.i{color:var(--amber-text);margin-top:2px}
.notice .x{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;color:var(--ink2);flex:none;margin:-10px -6px -10px 0}
.notice .x:hover{box-shadow:var(--hover)}
.notice .tx{flex:1;min-width:0;font-size:15px}
.notice .tx b{display:block;font-weight:600}
.notice .tx p{color:var(--ink2)}
.notice .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.notice.ok{background:var(--sage-light);border-color:var(--sage-line)}.notice.ok>svg.i{color:var(--sage-text)}
.notice.bad{background:var(--urgent-bg);border-color:rgba(142,49,49,.35)}.notice.bad>svg.i{color:var(--urgent-border)}

/* one person's page */
.phead{display:flex;align-items:center;gap:16px;margin:4px 0 20px}
.phead .tx b{display:block;font-size:20px;font-weight:600;line-height:26px}
.phead .tx small{display:block;font-size:13px;color:var(--ink2);line-height:19px;overflow-wrap:anywhere}
.acc{padding:16px 20px 20px}
.cardhd{display:flex;align-items:center;gap:8px;min-height:24px;margin-bottom:12px}
.cardhd .sp{flex:1}
.seg{display:flex;background:var(--chip);border-radius:8px;padding:4px;gap:4px}

.tsent{margin:12px 0 0;font-size:15px;color:var(--ink);min-height:44px}

.crow{display:flex;align-items:center;gap:12px;width:100%;margin:12px 0 0;padding:12px 0;min-height:64px;border-top:1px solid var(--brow);text-align:left}
.crow:hover{background:var(--row-hover)}.crow:active{box-shadow:var(--press)}
.crow .tx{flex:1;min-width:0}.crow .tx b{display:block;font-size:15px;font-weight:600;line-height:20px}.crow .tx small{display:block;font-size:13px;color:var(--ink2);line-height:18px;margin-top:2px}

.crow[aria-disabled="true"]{cursor:default}.crow[aria-disabled="true"] .chev{opacity:.45}.crow[aria-disabled="true"]:hover{background:none}

.custbar .also{flex:1 1 220px;font-size:13px;color:var(--ink2)}

.pgrp{margin-top:16px}

.prm{display:flex;align-items:center;gap:12px;min-height:48px;border-top:1px solid var(--brow)}

/* House Rules: value rows (value on its own line, Change at the right) and meal times */
.rrow.nw{flex-wrap:wrap}
.rrow.nw .tx{flex:1 1 0}
.rrow .tx .v{display:block;font-size:15px;color:var(--ink);line-height:20px;margin-top:2px}
.rrow .tx .v b{display:inline;font-weight:700}
button.rrow{width:100%;text-align:left;font:inherit;color:inherit;background:none}
.rrow.tap .tx b,.rrow.tap .tx small,.rrow.tap .tx .v{display:block}
.rrow.tap .tx .v b{display:inline}
.rrow.tap:hover{box-shadow:var(--hover)}
.rrow.tap:active{box-shadow:var(--press)}
.rrow.tap[aria-disabled="true"]{cursor:default;box-shadow:none}
/* an off value row keeps its words readable (you can still read the rules offline); only the arrow dims */

.card>.rrow.tap:first-child{border-radius:12px 12px 0 0}
.card>.rrow.tap:last-child{border-radius:0 0 12px 12px}
.rrow .sub{flex:1 1 100%;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mtimes{flex:1 1 100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:520px}
.mtimes .mc{display:flex;flex-direction:column;gap:4px;min-width:0}
.mtimes .ml{font-size:13px;color:var(--ink2);font-weight:500}
.mtimes .timebtn{width:100%;justify-content:space-between}
.mtimes .timebtn.unset{color:var(--ink2);font-weight:500}
.mtimes .ro{min-height:0}
.mtimes .timebtn{white-space:nowrap}
.mhint{flex:1 1 100%;font-size:13px;color:var(--ink2);line-height:18px;margin:0}
.app.phone .mtimes{grid-template-columns:1fr;gap:0;max-width:none}
.app.phone .mtimes .mc{flex-direction:row;align-items:center;justify-content:space-between;min-height:52px;border-top:1px solid var(--brow)}
.app.phone .mtimes .mc:first-child{border-top:0}
.app.phone .mtimes .ml{font-size:15px;color:var(--ink);font-weight:500}
.app.phone .mtimes .timebtn{width:144px}
.tzlist{display:grid;gap:4px}
.tzlist button{display:flex;align-items:center;gap:12px;min-height:48px;border-radius:8px;text-align:left;font-size:15px;padding:0 12px;border:1px solid transparent}
.tzlist button:hover{box-shadow:var(--hover)}

.tzlist button .ck{margin-left:auto;display:inline-flex;align-items:center;gap:8px;color:var(--ink2);font-size:13px;font-weight:500}
.tzlist button .ck svg{visibility:hidden;color:var(--sage-text)}
.tzlist button[aria-checked="true"] .ck svg{visibility:visible}
/* Devices: who shows on the iPad */
.who{margin-top:16px;padding-top:16px;border-top:1px solid var(--brow)}
.who h4{margin:0 0 2px;font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.who p.gl{font-size:13px;color:var(--ink2);margin:0 0 12px}
.wholn{display:flex;gap:12px;align-items:center}

.prm .lk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);font-weight:500}
.dz{margin-top:24px;padding-top:20px;border-top:1px solid var(--bcard)}
.dz p{font-size:13px;color:var(--ink2);margin-top:8px}

/* Devices */
.dev{padding:20px}
.dev .dh{display:flex;gap:16px;align-items:flex-start}
.dev .dh .tile{width:56px;height:56px;border-radius:12px;background:var(--chip);display:grid;place-items:center;color:var(--ink2);flex:none}

.dev .dh small{display:block;font-size:13px;color:var(--ink2);line-height:19px}

.dev .acts{margin-top:20px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.empty p{color:var(--ink2);max-width:440px;margin-top:6px}
.empty .btn{margin-top:16px}

/* hub (phone) profile card */
.prof{padding:16px}
.prof .ph{display:flex;align-items:center;gap:16px}
.prof .ph .tx{flex:1;min-width:0}
.prof .ph b{display:block;font-size:17px;font-weight:600}
.prof .ph small{display:block;font-size:13px;color:var(--ink2);overflow-wrap:anywhere}
.prof .colr{display:flex;align-items:center;gap:8px;border-top:1px solid var(--brow);margin-top:14px;padding-top:6px;min-height:52px;width:100%;text-align:left}
.prof .colr .tx{flex:1}.prof .colr b{display:block;font-size:15px;font-weight:600}.prof .colr small{display:block;font-size:13px;color:var(--ink2)}
.dot{width:20px;height:20px;border-radius:50%;flex:none}
.prof .colr+.colr{margin-top:0}
html.tablet .prof .ph b{font-size:20px;line-height:26px}html.tablet .prof .ph small{font-size:14px}
.prof .colr:hover{box-shadow:var(--hover)}
/* colour swatches: the one picked look (2.2.3) around a round colour; a taken colour is off and says whose on tap */
.swat{display:grid;grid-template-columns:repeat(8,44px);justify-content:space-between;margin:0 0 4px}
.swat button{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;border:1px solid transparent}
.swat button:hover{box-shadow:var(--hover)}
.swat button span{width:28px;height:28px;border-radius:50%;display:block}
.swat button[aria-checked="true"]{background:var(--sage-light);border-color:var(--sage-text)}
.swat button[aria-disabled="true"]{opacity:.35;cursor:default}.swat button[aria-disabled="true"]:hover{box-shadow:none}
/* an invite whose cancel failed: the red line spans the row */
.inv.hasferr{flex-wrap:wrap}
.inv .err{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;background:var(--urgent-bg);color:var(--urgent-text);border-radius:8px;padding:8px 8px 8px 12px;font-size:15px}
.inv .err .btn{margin-left:auto}
.card.rows.dev{padding:0}.card.dev .row{min-height:64px}
.prow .l2{column-gap:6px}
.countln{font-size:13px;color:var(--ink2);margin:0 0 12px;min-height:19px}
.foot{font-size:13px;color:var(--ink2);text-align:center;margin-top:8px}
.schipsrow{display:none}

/* skeleton people rows */
.skrow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--brow);min-height:76px}
.skrow:first-child{border-top:0}
.skrow .c{width:40px;height:40px;border-radius:50%}
.skrow .ls{flex:1;display:grid;gap:8px}
.skrow .ls i{display:block;height:12px}
.loadlbl{font-size:13px;color:var(--ink2);min-height:19px;margin:8px 0 0;opacity:0;animation:fade .2s var(--ease) 1s forwards}
.errbox{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;padding:24px}
.errbox>svg{color:var(--urgent-border)}
/* page-shaped loading (C-066): House Rules rows, a person's page, the iPad card */
.skr{display:flex;align-items:center;gap:16px;padding:12px 16px;border-top:1px solid var(--brow);min-height:68px}
.skr:first-child{border-top:0}
.av.sk{border-radius:50%}
.skr .ls{flex:1;display:grid;gap:8px}.skr .ls i{display:block;height:12px}
.skr .ctl{width:84px;height:28px;flex:none}
.skr .ctl.w{width:24px;height:24px}
.errbox b{font-size:17px}
.errbox.errown{min-height:300px;justify-content:flex-start;padding-top:56px;margin-top:28px}
.ghost{position:relative}.ghost .gh{visibility:hidden}.ghost .errbox{position:absolute;inset:0;justify-content:flex-start;padding-top:56px}
.ghost .gh .sk{animation:none}
/* loading people rows: each bar fills its real line (name 22, tag 22; iPad name 24) */
.prow .skn{display:block;height:14px;margin:4px 0}.prow .skt{display:block;width:92px;height:20px;margin:1px 0}
html.tablet .prow .skn{margin:5px 0}
.shim{pointer-events:none}
.shim .seg,.shim .tsent,.shim .also,.shim .btn,.shim .dz p{color:transparent!important;border-color:transparent!important;box-shadow:none!important;background:linear-gradient(90deg,var(--track) 0,var(--panel) 120px,var(--track) 240px) 0 0/600px 100%!important;animation:shimmer 1.4s linear infinite;border-radius:8px}
.shim .seg>*,.shim .btn>*,.shim .tag{visibility:hidden}
/* round 15: one shimmer rule for every loading page: the real page, each word a bar on its own line box (same height), pictures
   and switches as plain track shapes, arrows hidden */
.shim .ln{color:transparent!important;background:linear-gradient(90deg,var(--track) 0,var(--panel) 120px,var(--track) 240px) 0 0/600px 100%;animation:shimmer 1.4s linear infinite;border-radius:6px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.shim svg,.shim .chev{visibility:hidden}
.shim .av,.shim .tile,.shim .dot{background:var(--track)!important;color:transparent!important;box-shadow:none!important;border-color:transparent!important}
.shim .av .ln,.shim .tile .ln{background:none!important;animation:none}
.shim .sw .tr{background:var(--track)!important;border-color:transparent!important;box-shadow:none!important}.shim .sw .tr::before,.shim .sw .tr::after,.shim .sw .tr *{visibility:hidden}
.shim .notice{visibility:hidden}
/* words between bars (the dots) stay invisible; the group headings are known before the data, so they show as words */
.shim,.shim *{color:transparent!important}
.shim .eyebrow,.shim .eyebrow *{color:var(--muted)!important}.shim .eyebrow .ln{background:none!important;animation:none!important}
.shim .tag::before,.shim .tag::after{visibility:hidden!important}
.shim .tag.hid{visibility:hidden!important}
.shim .tag:not(.hid){visibility:visible!important;background:var(--track)!important;border-color:transparent!important}.shim .tag .ln{background:none!important;animation:none!important}
/* round 14: the Customise row waits in shape too (its words become shimmer blocks) */
.shim .crow .tx b,.shim .crow .tx small{color:transparent!important;background:linear-gradient(90deg,var(--track) 0,var(--panel) 120px,var(--track) 240px) 0 0/600px 100%;animation:shimmer 1.4s linear infinite;border-radius:8px;width:max-content;max-width:100%}.shim .crow .chev{visibility:hidden}
.errbox p{color:var(--ink2)}
/* round 13 (DESIGN 4.8.2): a failed load is drawn in the loading shape itself: the page's line and headings stay, the first card
   keeps its exact loading size with the message centred in it, the rest keeps its space (nothing jumps on Try Again) */
.errwrap *{visibility:hidden;animation:none!important}
.errwrap .eyebrow,.errwrap .errcard,.errwrap .errvis,.errwrap .errvis *,.errwrap .errbox,.errwrap .errbox *{visibility:visible}
.errwrap .errcard{position:relative}
/* round 14: only the first card's heading shows; the later groups keep their space but show no orphan headings */
.errwrap section.sec~section.sec .eyebrow{visibility:hidden}
.errwrap .errcard>.errbox{position:absolute;inset:0;justify-content:flex-start;padding-top:40px!important;padding:16px;gap:6px;border-radius:12px;background:var(--card)}
.errwrap .errcard>.errbox .btn{margin-top:6px}
.errwrap .errcard.shimcard{background:var(--card)!important}

/* fields */
.fld{position:relative;margin:0 0 16px}
.fld input{width:100%;height:52px;border-radius:8px;border:1px solid rgba(0,0,0,.18);background:#FFFDF8;padding:20px 14px 6px;font-size:16px;outline:none;transition:border-color .2s,box-shadow .2s}
.fld input:focus{border-color:var(--sage-text);box-shadow:0 0 0 1px var(--sage-text)}
.fld label{position:absolute;left:15px;top:15px;font-size:16px;color:var(--muted);pointer-events:none;transition:top .2s var(--ease),font-size .2s var(--ease)}
.fld input:focus+label,.fld input:not(:placeholder-shown)+label{top:6px;font-size:12px}
.fld input[readonly]{opacity:.45;cursor:default;box-shadow:none;border-color:rgba(0,0,0,.18)}
.fld input[readonly]+label{opacity:.6}
.fld.bad input{border-color:var(--urgent-border);box-shadow:0 0 0 1px var(--urgent-border)}
.fld .hint{font-size:13px;color:var(--ink2);min-height:18px;margin-top:4px}
.fld.bad .hint{color:var(--urgent-text)}
.flbl{font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
/* round 13: the last field of a pop-up has no space under its own helper line (the helper and the error share one line) */
.sheet .bd>.fld:last-child{margin-bottom:0}
/* Invite Again: the email is fixed (it is this person again); it reads as a value, not a greyed box */
.fld.fixed input[readonly]{opacity:1;background:var(--panel);border-color:rgba(0,0,0,.10)}.fld.fixed input[readonly]+label{opacity:1}
/* Meal Times: one tap for the likely dinner times */
.qt{margin:-4px 0 16px}.qt .chip{height:44px;padding:0 12px;font-weight:500}
/* People Eating sheet: two choices as rows (the Time Zone look), the number under the picked one */
.eatn{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:4px 12px 0}
.eatn b{font-weight:600}
.subt+.flbl{margin-top:16px}
.subt{font-size:13px;color:var(--ink2);margin:8px 0 0;min-height:38px}

#authscrim{z-index:65}
/* one scrim at a time (DESIGN 2.8.3): while the Sign In Again pop-up is open, the sheet under it is hidden; Cancel brings it back */
#scrim.underauth{visibility:hidden}
/* Sign In Again (round 12): one quiet line, and a text button with a 44 px reach */
.authln{font-size:14px;color:var(--ink2);margin:0}
html.tablet .authln{font-size:16px;line-height:22px}
.authln+.authln{margin-top:8px}
/* round 13: the sign-in page's own Apple and Google buttons (ProviderButtons.tsx: kit outline look, tall, semibold item words,
   "Continue with Apple / Google" as Apple's rules require) with the real marks (DESIGN 8.9.2) */
/* round 15 (panel 7a 1, 7b 3): in Check It's You the provider button is the box's MAIN action, so it uses the provider's own
   filled button: Apple's black "Continue with Apple" and Google's dark one (both brands give these styles for exactly this);
   on the sign-in page, next to other ways in, they stay outlined (QUESTIONS 57) */
.btn.prov{background:#000;border:1px solid #000;color:#fff;font-weight:600}
.btn.prov.g{background:#131314;border-color:#131314;color:#E3E3E3}
.btn.prov:hover{box-shadow:inset 0 0 0 100px rgba(255,255,255,.12)}
/* round 15: "another way" (Forgot Password, Use My Password Instead, Use Apple Instead, Send It Again) is ONE quiet look: the kit's
   QuietAction (words and an icon in the quiet ink, a 44 px reach, no fill), so the way out never outweighs the way through */
.btn.quiet{background:transparent;color:var(--ink2);font-weight:500;border:1px solid transparent}.btn.quiet:hover{box-shadow:var(--hover);color:var(--ink)}
/* round 15 (panel 7a 4): the one look for "a sign-in opens next", the same on every action: one line right under the main button */
.stepln{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;line-height:18px;color:var(--ink2);margin:0 0 4px;text-align:center}
.stepln .mk,.stepln svg.i{width:14px;height:14px;flex:none}
html.tablet .stepln{font-size:14px;line-height:20px}
.authpop .stack .btn.cancel{margin-top:4px}
/* the other ways share one row under the main button (they stack only when they don't fit) */
.qrow{display:flex;flex-wrap:wrap;gap:0 4px;justify-content:center}.qrow .btn.quiet{flex:1 1 auto;width:auto!important;padding:0 8px}
/* phone: "Last used" gets its own line instead of a dot at the end of a line */
.app.phone .dev .sep{display:none}.app.phone .dev .lu{display:block}
.vi{white-space:nowrap}.app.phone .rrow .v .vsep{display:none}.app.phone .rrow .v .vi{display:block}
/* a link sign-in came back: one green line at the top of the box it reopens */
.okln{display:flex;gap:8px;align-items:flex-start;font-size:14px;color:var(--sage-text);background:var(--sage-light);border-radius:8px;padding:10px 12px;margin:0 0 12px}
.okln svg{flex:none;margin-top:1px}
html.tablet .okln{font-size:16px}
/* round 15 (panel 7a 8): Invite Again's email is a plain value (it is this person again), no box */
.fixedv{margin:0 0 16px}.fixedv b{display:block;font-size:16px;font-weight:600;word-break:break-all}.fixedv small{display:block;font-size:13px;color:var(--ink2);margin-top:2px}
html.tablet .fixedv small{font-size:15px}
.btn.prov .mk{width:18px;height:18px;flex:none;display:block}
/* round 13: the destructive MAIN button of a yes/no box (proposed DESIGN 4.2.3 wording): urgent wash, urgent words, a red edge;
   pressed it fills deep red. A destructive button on a page keeps the plain red outline. */
.btn.dwash{background:var(--urgent-bg);border:1px solid var(--urgent-border);color:var(--urgent-text);font-weight:600}
.btn.dwash:hover{box-shadow:inset 0 0 0 100px rgba(142,49,49,.06)}
.btn.dwash:active{background:var(--urgent-border);color:var(--hdr-text)}
/* mockup only: the on-screen keyboard on a phone or iPad while a box has focus. The pop-up rides up above it (the live kit's
   useRevealOnKeyboard), so its buttons are never under the keys. */
.kbd{position:fixed;left:0;right:0;bottom:0;height:var(--kbh,0px);background:#D1D4DA;border-top:1px solid #B7BBC2;z-index:80;display:none;place-items:center;color:#5E636B;font-size:13px;font-weight:500;pointer-events:none}
html.kb .kbd{display:grid}
html.kb .scrim{padding-bottom:calc(var(--kbh) + 8px)!important;transition:padding-bottom .2s var(--ease)}
html.kb .sheet{max-height:calc(100dvh - var(--kbh) - 72px)!important}
html.kb .scrim:not(.center) .sheet{border-radius:16px}
.authln{margin:0 0 4px}
.sheet{scroll-padding-bottom:148px;scroll-padding-top:8px}
/* a yes/no box's buttons stay in view too when the keyboard makes it scroll (like a form's footer) */
.sheet .stack{position:sticky;bottom:0;background:var(--card)}
html.kb .scrim.center{padding-top:8px!important}html.kb .scrim.center .sheet{max-height:calc(100dvh - var(--kbh) - 20px)!important}

/* menu, scrim, sheets, dialogs, toasts (kit) */
.menu{position:fixed;background:var(--card);border:1px solid var(--bcard);border-radius:12px;box-shadow:var(--shadow-pop);z-index:50;min-width:240px;display:none}
.menu.open{display:block;animation:pop .2s var(--ease)}
.menu.closing{display:block;animation:fadeout .16s var(--ease) forwards;pointer-events:none}
.menu .mi{padding:8px;overflow:auto;max-height:70vh;border-radius:12px}
.menu .mhd{font-size:13px;color:var(--ink2);padding:4px 8px 8px}
.menu button.it{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;border-radius:8px;padding:0 12px;font-size:15px;text-align:left}
.menu button.it:hover{background:var(--row-hover)}
.menu button.it svg{color:var(--ink2)}
.menu button.it.warn{color:var(--urgent-border)}.menu button.it.warn svg{color:var(--urgent-border)}
.menu hr{border:0;border-top:1px solid var(--brow);margin:4px}
.tgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:4px;width:min(400px,calc(100vw - 32px))}
.tgrid .chip{padding:0 4px;font-weight:500;font-size:14px}
@media (max-width:420px){.tgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}.tgrid .chip.on{font-weight:700}
.scrim{position:fixed;inset:0;background:var(--scrim);display:none;place-items:center;z-index:60;padding:16px}
.scrim.open{display:grid;animation:fade .2s var(--ease)}
.scrim.closing{display:grid;animation:fadeout .2s var(--ease) forwards;pointer-events:none}
/* round 10: ONE pop-up shape per device. Computer and iPad: 420 wide (DESIGN 2.6.3 dialog), centred, buttons stacked with the
   main one on top and Cancel under it (4.7.2, 4.7.4). Phone: forms rise from the bottom at their own height (kit Sheet: up to
   90%), yes/no pop-ups sit centred; the same stacked buttons either way. */
.sheet{width:420px;max-width:100%;max-height:min(90vh,720px);overflow:auto;background:var(--card);border-radius:16px;box-shadow:var(--shadow-float);display:flex;flex-direction:column}
.scrim.open .sheet.enter{animation:rise .2s var(--ease)}
.sheet.dlg{width:420px}
.sheet .hd h2:focus{outline:none}
/* round 10: the X sits in the corner, so the words under the title use the pop-up's full width (no short last lines) */
.sheet .hd{display:flex;align-items:flex-start;gap:12px;padding:20px 24px 8px 24px;position:relative}
.sheet .hd>div{flex:1;min-width:0}.sheet .hd h2{padding-right:40px}
.sheet .hd h2{margin:0;font-size:20px;font-weight:700;line-height:1.3}
.sheet .hd p{margin:4px 0 0;font-size:15px;color:var(--ink2)}
.sheet .x{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;color:var(--ink2);flex:none;position:absolute;right:12px;top:14px}
.sheet .x:hover{box-shadow:var(--hover)}
.sheet .bd{padding:8px 24px 16px;flex:1}
.sheet .ft{display:grid;gap:8px;padding:12px 24px 20px;border-top:1px solid var(--brow);background:var(--card);position:sticky;bottom:0}
.sheet .ft .btn{width:100%}
/* a failed action inside a pop-up: one line, the same red box as House Rules, with Try Again as the main button below */
.sheet .err{display:flex;gap:8px;align-items:flex-start;background:var(--urgent-bg);color:var(--urgent-text);border-radius:8px;padding:10px 12px;font-size:15px;margin:0 0 12px}
.sheet .err svg{margin-top:3px;flex:none}
.sheet .stack .err{margin:0 0 4px}
.sheet .offln{display:flex;gap:8px;align-items:flex-start;font-size:15px;color:var(--ink2);margin:0 0 12px}
.sheet .offln svg{margin-top:2px;flex:none}
/* offline you can still read the name: the value stays full ink, only the box looks locked (one offline rule, round 10) */
.offsheet .fld input[readonly]{opacity:1;background:transparent}.offsheet .fld input[readonly]+label{opacity:1}
.sheet .stack{display:grid;gap:8px;padding:8px 24px 20px}
.sheet .stack .btn{width:100%}
.sheet .msg{min-height:0}
.sheet .tgrid{width:auto;padding:0}
.lstep{display:flex;align-items:center;gap:12px;min-height:60px;border-top:1px solid var(--brow)}
.lstep:first-child{border-top:0}
.lstep b{flex:1;font-weight:600}
.toasts{position:fixed;right:24px;bottom:24px;display:flex;flex-direction:column-reverse;gap:8px;align-items:flex-end;z-index:70;pointer-events:none;max-width:420px}
.toast{background:var(--ink);color:var(--page);border-radius:12px;padding:2px 2px 2px 16px;min-height:48px;font-size:15px;display:flex;gap:8px;align-items:center;pointer-events:auto;animation:rise .2s var(--ease);box-shadow:var(--shadow-pop)}
.toast>span{padding:6px 0}
.toast.out{animation:fadeout .2s var(--ease) forwards}
.toast button{color:var(--page);font-weight:500;font-size:16px;border-radius:8px;padding:0 14px;height:40px;flex:none;border:1px solid rgba(250,244,235,.45);position:relative}
.toast button::after{content:"";position:absolute;inset:-2px 0}
.toast button:hover{background:rgba(250,244,235,.12)}
.toast .tx{border:0;width:44px;height:44px;padding:0;display:inline-flex;align-items:center;justify-content:center}

/* mockup-only state bar (copied from Plan v3) */
.mock{position:fixed;left:50%;transform:translateX(-50%);top:9px;z-index:90;background:var(--ink);color:var(--page);border-radius:12px;padding:3px;display:flex;gap:2px;align-items:center;font-size:12px;box-shadow:var(--shadow-pop);white-space:nowrap;max-width:calc(100vw - 420px);overflow-x:auto;scrollbar-width:none}
.mock::-webkit-scrollbar{display:none}
.mock span{padding:0 8px;opacity:.7}
.mock button{height:26px;padding:0 8px;border-radius:8px;color:var(--page);white-space:nowrap;flex:none}
.mock button.on{background:var(--page);color:var(--ink);font-weight:600}
.mock button[data-more]{position:sticky;right:0;background:var(--ink);box-shadow:-10px 0 8px var(--ink)}.mock button[data-more].on{background:var(--page)}
.mockmore{position:fixed;z-index:91;background:var(--ink);color:var(--page);border-radius:12px;padding:6px;display:none;flex-direction:column;gap:2px;font-size:13px;box-shadow:var(--shadow-pop);max-height:70vh;overflow:auto}
.mockmore.open{display:flex}
.mockmore b{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.6;padding:6px 10px 2px}
.mockmore button{text-align:left;height:30px;padding:0 10px;border-radius:8px;color:var(--page);white-space:nowrap}
.mockmore button.on{background:var(--page);color:var(--ink);font-weight:600}
.mockmore button:hover{background:rgba(255,255,255,.1)}
html.nobar .mock,html.nobar .mockmore{display:none!important}

/* ---------- phone pieces ---------- */
.tabbar{display:none}

/* Settings frame by content width (SettingsChrome 1.2): .swide = side list; .schips = chip row; .snarrow = hub list */
.app:not(.swide) .body{grid-template-columns:minmax(0,1fr)}
.app:not(.swide) .srail{display:none}
.app.schips .schipsrow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:12px 24px 0;max-width:760px;margin:0 auto}
.app.schips .schipsrow .chip{flex:none}

/* ---------- narrower screens ---------- */
@media (max-width:1100px){
  .app{grid-template-columns:64px minmax(0,1fr)}
  .rail{padding:12px 0;align-items:center}
  .rail .cap,.rail .ri{font-size:0;gap:0;justify-content:center;padding:0;width:44px;height:44px}
  .rail hr{margin:4px 0;width:44px}
  .mock{position:fixed;top:0;left:0;right:0;transform:none;border-radius:0;padding:4px 8px;height:40px;box-shadow:none;max-width:none}
  .mock button{height:32px}
  .app{height:calc(100vh - 40px);height:calc(100dvh - 40px);margin-top:40px}
  html.nobar .app{height:100vh;height:100dvh;margin-top:0}
  .scrim{padding-top:56px}
}
@media (max-width:640px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:50px minmax(0,1fr) 64px}
  .top{padding:0 16px}
  .rail{display:none}
  .col{padding:16px 16px 40px}
  .bar .in{padding:0 8px 0 12px}
  .tabbar{display:flex;grid-column:1/-1;background:var(--card);border-top:1px solid var(--bcard);align-items:center;padding:0 4px;position:relative;z-index:5}
  .tabbar .tb{flex:1;display:flex;justify-content:center;align-items:center;height:64px}
  .tabbar .tb>span{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:500;color:var(--ink2);min-width:56px;padding:4px 8px;border-radius:8px}
  .tabbar .capslot{width:72px;display:flex;justify-content:center;align-items:center}
  .tabbar .capc{width:60px;height:60px;border-radius:50%;background:var(--sage);color:var(--ink);display:grid;place-items:center;margin-top:-18px;box-shadow:var(--shadow-card)}
  .tabbar .capc svg.ni{width:32px;height:32px}
  .toasts{left:16px;right:16px;bottom:80px;align-items:stretch;max-width:none}
  .scrim{place-items:end center;padding:56px 0 0}
  .sheet{width:100%!important;max-width:none;border-radius:16px 16px 0 0;max-height:calc(100dvh - 72px)}
  .scrim.open .sheet.enter{animation:slideup .28s var(--ease)}
  .scrim.closing .sheet{animation:slidedown .2s var(--ease) forwards}
  .sheet .hd{padding:16px 16px 8px 16px}.sheet .hd .x{right:8px;top:10px}.sheet .bd{padding:8px 16px 16px}.sheet .ft{padding:12px 16px 16px}.sheet .stack{padding:8px 16px 20px}
  .addrow .btn{flex:1 1 0;padding:0 8px}
  /* an invite's buttons span the card (3.2.3), under the email, not indented under the words (round 10) */
  .inv{flex-wrap:wrap}.inv .acts{flex:1 1 100%;padding-left:0}.inv .acts .btn{flex:1 1 0}
  /* People rows: access and last used share one line, the email waits on the person's page (round 10) */
  .prow .l3{display:none}
  /* People Eating: Set a Number goes under its words, spanning the row (round 10) */
  .rrow.stackctl .ctl.r{flex:1 1 100%;margin-left:0}.rrow.stackctl .ctl.r .btn{width:100%}
  /* Add a Person keeps its own width at the right of the list's heading (round 10: it no longer spans and competes with the tan-bar button) */
  .sechd.hasbtn{flex-wrap:nowrap}.sechd.hasbtn .cnt{display:none}
  .rrow .ctl{margin-left:0;justify-content:flex-start}
  .rrow.nw .ctl.r{margin-left:auto}
  .rrow:not(.nw) .ctl.r{flex:1 1 100%;justify-content:flex-start}
  .dev .acts .btn{flex:1 1 100%}
  .empty .btn{width:100%}
  .seg button{padding:0 6px;font-size:14px}
  /* DESIGN 2.10.1: phone main buttons 48; 3.2.3: a button in a phone row spans the width */
  /* 48 for the main (filled) button; a pop-up's own buttons and a sheet's footer row match it so a row never mixes heights; other page buttons 44 */
  .app .col .btn.pri,.sheet .ft .btn,.sheet .stack .btn{height:48px}
  .dz .btn,.custbar .btn,.notice .acts .btn,.rrow .sub .btn,.addrow .btn,.err .btn{width:100%;flex:1 1 100%;margin-left:0}
  /* the load-failed box is a column: a full-width Try Again must not grow tall (round 8) */
  .errbox .btn{width:100%;flex:none;margin-left:0}
  .custbar .also{flex:1 1 100%}
  .notice .acts{display:grid}
  /* yes/no and Sign In Again pop-ups stay centred (4.3.6); form sheets open almost full height with a grab bar (4.7.3) */
  .scrim.center{place-items:center;padding:16px}
  .scrim.center .sheet{border-radius:16px;max-height:calc(100dvh - 32px)}
  .scrim.center.open .sheet.enter{animation:rise .2s var(--ease)}
  .scrim.center.closing .sheet{animation:fadeout .2s var(--ease) forwards}
  /* round 10: a form sheet is its own height (kit Sheet: content height, up to 90%), never a tall half-empty box */
  .scrim:not(.center) .sheet{max-height:90dvh}
  .scrim .sheet .grab{display:block}
  .toasts{bottom:76px}
}
.sheet .grab{display:none;width:40px;height:5px;border-radius:3px;background:rgba(0,0,0,.2);margin:8px auto 0;flex:none;touch-action:none;position:relative}
.sheet .grab::after{content:"";position:absolute;inset:-12px -40px}
.sheet.drag{transition:none}
.col{padding-bottom:96px}
/* round 13: the phone toast floats above the tabs again (DESIGN 4.6.2); round 12's cut-off list window is gone */
@media (max-width:640px){.col{padding-bottom:140px}}
/* People: Add a Person sits in the list's own heading, so it is reachable on a big home without scrolling */
.sechd{flex-wrap:wrap}
.sechd .btn{margin:0 0 0 auto}
.sechd.hasbtn{align-items:center;margin-bottom:12px}
/* phone hub: the profile card is one row (the colour shows on the avatar and lives in About You) */
.prof.one{padding:12px 16px;display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.prof.one .av{width:44px;height:44px;font-size:16px}
.prof.one .tx{flex:1;min-width:0}.prof.one b{display:block;font-size:16px;font-weight:600}.prof.one small{display:block;font-size:13px;color:var(--ink2);overflow-wrap:anywhere}
.prof.one .chev{color:var(--ink2)}
.row.one{min-height:52px;padding:6px 16px}.row.one .tile{width:32px;height:32px}
/* iPad: tablet type sizes (DESIGN 2.5: body 17, item 18, meta 14, eyebrow 14, label 13) */
html.tablet body{font-size:17px}
html.tablet .lede,html.tablet .note,html.tablet .tsent,html.tablet .prm span.l,html.tablet .dev .facts div,html.tablet .empty p,html.tablet .errbox p,html.tablet .notice .tx,html.tablet .sheet .hd p,html.tablet .rrow .tx .v,html.tablet .toast,html.tablet .fld input,html.tablet .tzlist button,html.tablet .menu button.it{font-size:17px}
html.tablet .row .tx b,html.tablet .rrow .tx b,html.tablet .prow .nm,html.tablet .srail .srow,html.tablet .phead .tx small+small{font-size:18px;line-height:24px}
html.tablet .phead .tx small+small{font-size:14px;line-height:20px}
html.tablet .row .tx small,html.tablet .rrow .tx small,html.tablet .prow .l2,html.tablet .prow .l3,html.tablet .lockln p,html.tablet .pgrp p.gl,html.tablet .who p.gl,html.tablet .custbar .also,html.tablet .subt,html.tablet .mhint,html.tablet .dev .dh small,html.tablet .phead .tx small,html.tablet .countln,html.tablet .sechd .cnt,html.tablet .tag,html.tablet .tiles .t,html.tablet .dz p,html.tablet .loadlbl,html.tablet .srail .srow .n,html.tablet .foot,html.tablet .mtimes .ml{font-size:14px;line-height:20px}
html.tablet .eyebrow,html.tablet .srail .grp,html.tablet .pgrp h4,html.tablet .who h4{font-size:14px}
html.tablet .tiles .t small{font-size:13px}html.tablet .flbl{font-size:14px}
html.tablet .btn,html.tablet .chip,html.tablet .seg button,html.tablet .timebtn,html.tablet .sw{font-size:17px}
html.tablet .btn.sm{font-size:16px}
html.tablet .sheet .hd h2{font-size:22px}
/* the tan-bar title is never smaller than the rows under it (DESIGN 2.5) */
html.tablet .bar .ttl{font-size:18px}
/* a busy button keeps its exact width: the label stays (hidden) and "Saving" sits over it */
.btn .bo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px}
.btn .bl{visibility:hidden;display:inline-flex;align-items:center;gap:8px}
/* Devices loading: the real iPad card with every word and picture turned into a shimmer block (same height, nothing pops in) */
.shim .dev .dh b,.shim .dev .dh small,.shim .dev .ln,.shim .who h4,.shim .dev .note span{color:transparent!important;background:linear-gradient(90deg,var(--track) 0,var(--panel) 120px,var(--track) 240px) 0 0/600px 100%;animation:shimmer 1.4s linear infinite;border-radius:8px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.shim .dev .dh b,.shim .dev .dh small,.shim .who h4{width:max-content;max-width:100%}
.shim .dev .tile,.shim .stk .av,.shim .facts svg,.shim .dev .note svg{background:var(--track)!important;color:transparent!important;box-shadow:none!important}
.shim .dev .tile svg{visibility:hidden}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.2s!important;transition-property:opacity,background-color,border-color,color,box-shadow,grid-template-rows,visibility!important;scroll-behavior:auto!important}
  .scrim.open .sheet.enter,.toast,.menu.open,.fadein{animation-name:fade!important;animation-duration:.2s!important}
  .scrim.closing .sheet,.toast.out{animation-name:fadeout!important}
  .sk,.shim *{animation:none!important}.spin{animation-duration:2.4s}
  .btn:active,.chip:active,.stepper button:active{transform:none}
  .btn:active,.chip:active{box-shadow:inset 0 0 0 100px rgba(75,105,71,.22)}
  .sw .tr::after{transition:none}
  .custbar .btn svg,.timebtn svg{transition:none}
}
</style>

function fmtT(m){const h=Math.floor(m/60),mm=m%60;return ((h+11)%12+1)+':'+(mm<10?'0':'')+mm+(h<12?' AM':' PM')}
/* a typed time, read the way the live app's parseDinnerTime does: "6:30 PM", "6:30pm", "630", "18:30". With no AM or PM,
   breakfast means morning and lunch or dinner means the afternoon or evening. null = not a time. */
function parseT(s,k){const m=String(s).trim().toLowerCase().replace(/\./g,'').match(/^(\d{1,2})(?::?(\d{2}))?\s*(am|pm|a|p)?$/);if(!m)return null;
  let h=+m[1],mm=m[2]?+m[2]:0;if(mm>59)return null;const ap=m[3]?m[3][0]:null;
  if(ap){if(h<1||h>12)return null;if(ap==='p'&&h<12)h+=12;if(ap==='a'&&h===12)h=0}
  else{if(h>23)return null;if(h<=12&&k!=='b'&&h<11)h+=12;}
  return h*60+mm}

function layout(){
  const W=innerWidth,a=document.getElementById('app');
  const appRail=W>1100?219:W>640?64:0, C=W-appRail;
  /* round 10: the live breakpoints (SettingsChrome.tsx:145-146, surfaceFor.ts RAIL_MIN_WIDTH 900, SETTINGS_CHIPS_MIN_WIDTH 600):
     Settings' own side list only from 900 of content width; an upright iPad (756 beside the app rail) gets the chip row and one
     full-width column, like the live app */
  const phone=W<=640, wide=!phone&&C>=900, chips=!phone&&!wide&&C>=600;
  const key=[phone,wide,chips].join();
  a.classList.toggle('phone',phone);a.classList.toggle('swide',wide);a.classList.toggle('schips',chips);a.classList.toggle('snarrow',!wide&&!chips);
  document.documentElement.classList.toggle('tablet',!phone&&(window.FULL==='ipad'||(!window.FULL&&matchMedia('(pointer:coarse)').matches)));
  const changed=layout.key&&layout.key!==key;layout.key=key;
  S.wide=wide;S.phone=phone;S.chips=chips;
  return changed;
}

/* round 8: the page never moves because a toast showed. The only move is "show the row you just changed", made once: if a
   toast comes with it (same moment), the spot is picked so the toast covers no row, heading or button; if the row is already in
   view and clear, nothing moves at all. The page end has fixed room for the toast (.col bottom padding), never added on the fly. */
let CHANGED=null;
function markChanged(el,nav){CHANGED={el:el,nav:nav};setTimeout(()=>{if(CHANGED&&CHANGED.el===el){const c=CHANGED;CHANGED=null;showChanged(c,false)}},0)}
function showChanged(c,withToast){
  const el=c.el;if(!el||!el.isConnected)return;
  const sc=document.getElementById('scroll'),pg=document.getElementById('page'),sr=sc.getBoundingClientRect(),r=el.getBoundingClientRect();
  /* round 10: the toast is measured where it will END, not mid-way through its 8 px rise (that 8 px put it over a row on the phone) */
  const tel=withToast&&document.querySelector('#toasts .toast');
  const tb=tel?(()=>{const q=document.getElementById('toasts').getBoundingClientRect(),ty=new DOMMatrix(getComputedStyle(tel).transform).m42||0;return {top:q.top-ty,bottom:q.bottom-ty,left:q.left,right:q.right}})():null;
  /* covering a row or button costs much more than covering a heading (in a packed list a 48 px toast can't always find a gap) */
  /* the toast keeps an 8 px gap from every row and card edge (round 9: it used to touch card borders by 1-2 px) */
  const R=tb?[...pg.querySelectorAll('button,.row,.rrow,.sechd,.notice,.card,a')].filter(x=>x.offsetParent).map(x=>{const q=x.getBoundingClientRect();q.w=x.matches('.sechd,.card')?1:100;return q}).filter(q=>q.height>0&&q.right>tb.left&&q.left<tb.right):[];
  const hits=d=>tb?R.filter(q=>{const m=q.w===1?8:1;return q.bottom-d>tb.top-m&&q.top-d<tb.bottom+m}).reduce((n,q)=>n+q.w,0):0;
  const lo=-sc.scrollTop,hi=sc.scrollHeight-sc.clientHeight-sc.scrollTop,bottom=tb?tb.top-8:sr.bottom-8;
  const fits=d=>r.top-d>=sr.top+8&&r.bottom-d<=bottom;
  if(fits(0)&&!hits(0))return;
  let best=null;
  for(let d=Math.ceil(lo);d<=Math.floor(hi);d++){const s=(fits(d)?0:1e10)+hits(d)*1e5+Math.abs(d);if(!best||s<best.s)best={s:s,d:d}}
  if(!best||!best.d)return;
  const smooth=!c.nav&&!matchMedia('(prefers-reduced-motion:reduce)').matches;
  sc.scrollBy({top:best.d,behavior:smooth?'smooth':'auto'});
}
