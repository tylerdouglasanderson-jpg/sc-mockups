const NOTES={
 all:[['What this is','Round 11 of the recipe book (11-24), with the small 11b follow-up just below. The maps below say where each round-11 ask shows; the round-7 map is under them. Standards everywhere: one themed scrollbar, buttons are rounded rectangles (never pills) with Title Case words, and links that leave the app get a small arrow tip<span class="ext"><svg class="tip" viewBox="0 0 10 10" aria-hidden="true"><path d="M3 2.2h4.8V7"/></svg></span> (just the point, no shaft). Switch devices at the top. Turn on <i>Slow motion</i> to see each move clearly.'],
  ['Round 11b: the recipe\'s buttons','<b>No Mark It Made</b>: there is no Done Cooking button. Finishing a cooking session (from <i>Start Cooking</i>) is what counts a recipe as made; "Made 3 times, last on Oct 28" stays as plain text under the facts. <b>Buttons in the title</b>: <i>Start Cooking</i> (the filled green main button), <i>Add to Plan</i> and a ♥ Favorite (filled when it is a favorite) sit in a small row at the top right of the recipe\'s title section, the same height, corners and type as the old tan-bar buttons. Where there is no room beside the photo (iPad sideways and upright, phone, Expanded, Quick Naan) the row drops to its own line under "from …", left aligned, and the header grows by one ruled line, so the title is never covered. The old Add to Plan and Favorite buttons under the facts are gone. <b>Tan bar</b>: only ‹ Back (when there is one) and ⋯ (Move to Collection ›, Edit, Share / Print), so each recipe page has exactly one Start Cooking and one Add to Plan. <b>Card buttons</b> match, on every device: <i>Add to Plan</i> (outline), then <i>Start Cooking</i> (filled green) at the right, next to the heart.'],
  ['Round 11: where each ask is','<b>1 Name</b>: the rail, the phone\'s More drawer and the tan bar all say <i>Recipes</i>. <b>2 Cover</b>: stays closed 3 s, then opens by itself; it says only <i>Tap to Open</i>, no countdown. <b>3</b> <i>+ Add a Recipe</i> everywhere. <b>4 One name</b>: <i>Add to Plan</i> on every card and in the recipe\'s title row. Once added it reads <i>✓ On Plan</i> and the recipe shows under the <b>On Plan</b> collection; tap again to take it off. <b>5 Collections</b>: ⋯ → <i>Move to Collection ›</i> opens a small menu beside the first one (on the phone it takes the menu\'s place, with <i>‹ Back</i> on top). Pick one, or <i>New Collection…</i> to name a new one; the recipe moves there. <b>6 No photo</b>: Ginger Beef Stir-Fry and Naan Pizza show a small bowl with steam, drawn like the card icons, in a tile the same size as a photo. <b>7 Notes</b>: tap <i>Edit</i> or the note itself and type right there; <i>Done</i> and <i>Cancel</i> sit where Edit was. <b>8</b> Edit, Share and Print in ⋯ are as before. <b>10 Pile cards</b> (round 12): back to the tight pile; the card under the mouse lifts gently, and its two buttons sit in the title row, right of the name (a long name wraps to two lines instead of being cut). <b>11 One Add to Plan per place</b>: the recipe\'s title row has it (11b), so the tan bar and the ⋯ menu do not repeat it.'],
  ['Round 7: where each ask is','<b>1 Scrollbars</b>: every scroll area, same thin themed bar. <b>2 Search card</b>: its top lines up with the jump bar on the right. <b>3 Count</b>: add a filter; "18 recipes" stays put and only the number changes. <b>4 Notes Edit</b>: rounded rectangle. <b>5 Header</b>: photo, title and "from Serious Eats" sit centered above the red line. <b>6 Facts</b>: time, serves and difficulty sit just below the red line. <b>7 Expand</b>: hover it; it acts just like a jump button. <b>8 Shrink</b>: the label turns back to Expand only when the card lands. <b>9 Arrow tip</b><span class="ext"><svg class="tip" viewBox="0 0 10 10" aria-hidden="true"><path d="M3 2.2h4.8V7"/></svg></span>: "Serious Eats" and the Source links. <b>10 No pills</b>: grocery button, timers, Add to Plan, Favorite, Edit, tags. <b>11 Expanded + Quick Naan</b>: no tan; the naan card has <i>Close</i> top right; the main card keeps its own jump bar plus <i>Back to book</i>; no "Back to Chicken Tikka Masala" there. In the book view, that sticky Back stays. <b>14 Binding</b>: soft fold, no shadow on the dotted pages, no flash when the cover opens. <b>16 Card hover</b>: Lift, now with buttons on the lifted card. <b>17</b>: Clear all stays dashed. <b>18 Content</b>: no allergen (Nut-free) anywhere; new <i>Prep ahead</i> fold; "You need" row gone.'],
 ['1. The cover','All wood now, no leather. The spine starts on edge, outside facing left, and swings down as the cover opens. While it moves you see its outside, with the wood bands. Once flat it becomes the gutter between the pages. The right-hand page is there the whole time the cover turns, not popped in at the end. The binding sits dead center. The cover says <i>Tap to Open</i>; tap it, or it opens by itself after 3 s. <i>Replay the cover</i> shows it again.'],
  ['2. Collections','No folders (Tyler, 11-23). Your collections are plain buttons with rounded corners at the top of the pinned search card: All, Favorites, Not Tried, Want to Try, On Plan, then any you make. All, Not Tried and On Plan fill themselves. The phone has the same buttons in one row that slides sideways. To move a recipe: ⋯ in the tan bar → <i>Move to Collection ›</i>. A small menu pops out beside the first one with your collections; pick one and both menus close with "Moved to …". <i>New Collection…</i> turns into a name box with <i>Create</i> (Enter works too); the new collection shows up with the others. On the phone the list takes the menu\'s place, with <i>‹ Back</i> on top. (Quick is gone: the Under 30 min filter does the same job.)'],
  ['3. Search and filters','The pinned note card, now level and untaped, lined up with the jump bar. Search, Filters and + Add a Recipe are one row, all the same height, with rounded-rectangle buttons. <b>Filters</b> opens a panel that floats over everything, with the tags in groups (Diet, Time, Main ingredient, Cuisine, Keeps well, Your lists), each showing how many recipes it matches. Pick as many as you like, then <i>Show N recipes</i>. Only the tags you picked stay on the card, each with an ✕. Each new one drops in and settles; the card grows down first if it needs a new row. <i>Clear all</i> is a small dashed button with a reset arrow.'],
  ['4. Add to Plan','One name everywhere (was "Save for Next Plan" and "Plan It"). <i>Add to Plan</i> puts the recipe on your plan list, no day yet. It is on every card, and in the recipe\'s title row between <i>Start Cooking</i> and the ♥: one per place, never two. Once added, the button reads <i>✓ On Plan</i>, the card gets a small "On Plan" mark, and the recipe shows under the <b>On Plan</b> collection, so you find it when you plan. Tap it again to take it off (the message has Undo).'],
  ['5. Your notes','Tap <i>Edit</i>, or tap the note. The same note turns into a typing area right where it is: same font, size and ruled lines, so nothing moves; it grows one line at a time as you type. A faint green edge shows you are typing, with the cursor at the end. <i>Done</i> keeps it, <i>Cancel</i> puts the old note back; they sit where Edit was. Keys: Esc = Cancel, Ctrl+Enter (⌘+Enter on a Mac) = Done. Tapping somewhere else keeps what you typed. On the iPad and phone the page scrolls so the note sits in the upper middle, above the keyboard. Notes stay until you reload (mockup).'],
  ['Try the options','★ is my pick. <b>Card pile</b>: ways the small cards lie on the left page. A a neat stack, B a loose pile tossed in by hand (my pick), C two across. Every card shows its name and a line of facts: time, how often you made it, and how much you have. <b>Card lines</b>: A rules the whole card (your pick), B only Ingredients and Steps. In both, every line of words now sits right on a blue line, all the way down. <b>Add to Plan</b>: A the title-row button opens a small menu under it (Pick a Day… or No Day Yet), C the title-row button adds it in one tap (my pick). (The old B, a ⚑ icon in the tan bar, is gone: the tan bar holds only ‹ and ⋯.) <b>Recipe photo</b>: A a taped snapshot, B no photo. <b>Card hover</b> (computer): A the card lifts gently and shows two buttons in its title row, right of the name: <i>Add to Plan</i> and <i>Start Cooking</i> (my pick, your pick too); B the same buttons, but the card tilts toward the mouse. <b>Binding</b>: A as before, B a soft fold (my pick): the wide wooden spine darkens toward the middle, the dotted backdrop sits on the wood with wood showing on all four sides, no shadow on the dots, and it is dark from the moment the cover opens. Behind the book is the normal page color.']],
 computer:[['6. Cards (computer)','Rest the mouse on a card (or Tab to it): after a short pause it slides up a little out of the pile (it stays behind the cards in front of it, never on top) and shows <i>Add to Plan</i> in its title row, right of the name and heart. Cards have no Start Cooking button: that lives on the open recipe. A long name wraps to two lines instead of being cut. The other cards stay in their tight pile, so you can run the mouse down them fast. Click anywhere else on the card to open it on the right.'],
  ['7. The recipe card','One big index card. Its title section (photo, name, "from Serious Eats", then a line of buttons under them, the same on every screen) holds the recipe\'s buttons: <i>Start Cooking</i>, <i>Add to Plan</i> and ♥ at the top right, or on their own line under "from …" when the card is narrow. Try servings − 4 +, <i>Add 3 to Grocery List</i> (its little cart becomes the new grocery icon later), <i>swap</i>, a timer, the folds at the bottom, and the jump panel above the card (the part you are reading lights up). Tap the stars to rate.'],
  ['8. Expand','<b>Expand</b> (top right of the card) grows it over the whole work area, with Ingredients and Steps side by side. The jump buttons come with it: a slim bar at the top of the big card that stays put while you scroll, out of the title\'s way. The recipe\'s buttons sit on their own line under "from …". <b>Shrink</b> or Esc puts it back; the button says Shrink until the card has landed.'],
  ['9. Quick Naan','Under Ingredients → For serving (the green chip with the card icon). It slides in like a binder page, and the jump bar works inside it. It has its own <i>Start Cooking</i>, <i>Add to Plan</i> and ♥ row in its title section, on its own line under "from …". <i>Back to Chicken Tikka Masala</i> stays at the top while you scroll. In Expanded, the main recipe moves to the left half with its own jump bar and a <i>Back to book</i> button, and the naan fills the right with <i>Close</i> at the top right.'],
  ['10. The tan bar','It names the page: <i>Recipes</i>, with the open recipe\'s name beside it. It holds only ‹ Back (when there is one) and ⋯, both 32 px with the same room above and below. Start Cooking and Add to Plan moved into the recipe\'s title section (11b). The ⋯ menu opens right under it: Move to Collection ›, Edit, Share / Print.'],
  ['11. Coming Later','Things we know we want but have not built yet stay in the menu, greyed, with a dashed <i>Coming Later</i> tag (Edit, Share / Print). Tapping one only says it is on our list. They all go on one running list so we can build them later.'],
  ['12. Book name','The cover says <i>Anderson Family Cookbook</i>: your household name plus Cookbook. You can change it in Settings, Household.']],
 ipadside:[['iPad sideways','Same layout as the computer, but touch: cards do not react to hover; one tap opens. Every card shows <i>Add to Plan</i> in its title row, right of the name (no hover on touch). The other cards stay tight in the pile so they are easy to scan. Ingredients and Steps stack in one column; they sit side by side only in Expanded view. The recipe card is narrower here, so its Start Cooking / Add to Plan / ♥ row sits on its own line under "from …". Editing a note scrolls it to the upper middle, above the keyboard.']],
 ipadup:[['iPad upright','No book cover: it opens straight to the list. Slim rail (it says <i>Recipes</i>), a plain list. Tap a recipe: it slides in from the right over the list. Every row shows <i>Add to Plan</i> at the top right. On the recipe, <i>Start Cooking</i>, <i>Add to Plan</i> and ♥ sit on their own line under "from …". ‹ in the tan bar slides it back. Editing a note scrolls it to the upper middle, above the keyboard.']],
 phone:[['Phone','Bottom bar (More is lit because Recipes lives in More: tap More to see). No book cover: it opens straight to the list. Plain list; the recipe slides in over it. Every row shows <i>Add to Plan</i> at the top right; the name wraps to two lines beside them. The recipe count lives only in the tan bar. On the recipe, <i>Start Cooking</i>, <i>Add to Plan</i> and ♥ fit on one line under "from …"; the tan bar holds only ‹ and ⋯. ⋯ → <i>Move to Collection ›</i> swaps the menu for the collection list, with <i>‹ Back</i> on top. Editing a note scrolls it to the upper middle, above the keyboard.']]

function fmt(x){if(!x)return'';const w=Math.floor(x+1e-9),f=x-w;const fr=[[0,''],[.25,'¼'],[1/3,'⅓'],[.5,'½'],[2/3,'⅔'],[.75,'¾'],[1,'']];
 let best=fr[0],d=9;for(const p of fr){const dd=Math.abs(f-p[0]);if(dd<d){d=dd;best=p}}let ww=w+(best[0]===1?1:0);return (ww?ww:'')+best[1]||'0';}
function toast(m){const t=$('.toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2200);}
function toastUndo(m,undo){const t=$('.toast');t.innerHTML='';t.append(m);const b=document.createElement('button');b.textContent='Undo';b.onclick=()=>{undo();t.classList.remove('show','undo');};t.append(b);
 t.classList.add('show','undo');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show','undo'),4000);}

function openPlanMenu(b,id){const m=$('#pmenu'),on=!(m.classList.contains('show')&&S.pmId===id);closeMenu();if(!on)return;S.pmId=id;
 $('#pmflag').firstChild.textContent=S.flags[id]?'✓ On Plan, No Day Yet':'No Day Yet';
 const p=m.offsetParent||m.parentElement,pr=p.getBoundingClientRect(),br=b.getBoundingClientRect(),k=pr.width/(p.offsetWidth||pr.width)||1;
 m.classList.add('show');const w=m.offsetWidth,left=Math.max(8,Math.min((br.left-pr.left)/k,p.clientWidth-w-8));

 const sc=c.querySelector('.rscroll'),top=sc.scrollTop;renderRecipe(c,cid,false);c.querySelector('.rscroll').scrollTop=top;});}
function setFlag(id,quiet){S.flags[id]=!S.flags[id];refreshRecipe(id);

 if(!quiet)toastUndo(S.flags[id]?`Added ${rec(id).n} to the Plan. Find it under On Plan.`:'Taken off the Plan.',()=>setFlag(id,true));}

function visible(extra){if(S.o.book==='B')return [];const q=S.q.trim().toLowerCase(),fs=[...S.f,...(extra?[extra]:[])];return R.filter(r=>hasTab(r,S.tab)&&(!q||r.n.toLowerCase().includes(q))&&fs.every(f=>hasTag(r,f)));}
/* folder tab outline, ported from the app's FolderDrawer (drawerTabPaths) */
function ftPath(W,open){const H=32,s=6,r=7,f=4,L=.5,R=W-.5,top=1.5,len=Math.hypot(s,H-top),ux=s/len,uy=(H-top)/len,n=v=>+v.toFixed(2);
 const tl=`L${n(L+s-r*ux)} ${n(top+r*uy)} Q${n(L+s)} ${n(top)} ${n(L+s+r)} ${n(top)} L${n(R-s-r)} ${n(top)} Q${n(R-s)} ${n(top)} ${n(R-s+r*ux)} ${n(top+r*uy)}`;
 if(!open)return{fill:`M${L-.5} ${H} ${tl} L${R+.5} ${H} Z`,stroke:`M${L} ${H+.5} ${tl} L${R} ${H+.5}`};
 const a=`${n(L+f*ux)} ${n(H+.5-f*uy)}`,b=`${n(R-f*ux)} ${n(H+.5-f*uy)}`;
 return{fill:`M${L-f} ${H+1} L${L-f} ${H} Q${L} ${H} ${a} ${tl} L${b} Q${R} ${H} ${R+f} ${H} L${R+f} ${H+1} Z`,stroke:`M${L-f} ${H+.5} Q${L} ${H+.5} ${a} ${tl} L${b} Q${R} ${H+.5} ${R+f} ${H+.5}`};}

function renderTabs(){const mt=$('.mtabs'),ft=$('.ftabs');if(!mt)return;
 const lab=([k,l])=>`<span>${esc(l)}<small>${tabCount(k)}</small></span>`;
 mt.innerHTML=TABS.map(t=>`<button class="mtab ${t[0]===S.tab?'on':''}" data-tab="${t[0]}">${lab(t)}</button>`).join('');
 ft.innerHTML=TABS.map((t,i)=>`<button class="ftab ${t[0]===S.tab?'on':''}" data-tab="${t[0]}" style="z-index:${t[0]===S.tab?50:20-i}"><svg></svg>${lab(t)}</button>`).join('');
 $$('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));drawTabs();mtFade(true);}
/* CH-4 the collection row: fade only the edge that hides more buttons; keep the picked one in view */
function mtFade(show){const m=$('.mtabs');if(!m)return;const on=CH(4);
 if(on&&show){const b=m.querySelector('.on');if(b){const l=b.offsetLeft-m.offsetLeft,r=l+b.offsetWidth;if(l<m.scrollLeft+20)m.scrollLeft=Math.max(0,l-30);else if(r>m.scrollLeft+m.clientWidth-20)m.scrollLeft=r-m.clientWidth+30;}}

 saved:'The card goes back to read mode where you were (nothing moves), with a short <i>Saved</i> note: bottom right on iPad and computer, just above the tabs on the iPhone (DESIGN 4.6.2). Save keeps every field as typed: a range like <i>1–2</i>, the active time, How Hard and the source (a person stays a person).',
 leave:'Leaving with changes asks first: <i>Save Changes</i> (main), <i>Keep Them for Later</i> (kept on this device; the recipe offers them next time, see <i>Draft: on the recipe</i>), <i>Throw Away Changes</i> (red), <i>Cancel</i>.',
 draft_add:'A card you started is kept on this device. Next time, <i>+ Add a Recipe</i> offers <i>Pick Up Where You Left Off</i> or <i>Start Over</i>. <i>Read It</i> stays grey while the box is empty, the same as on the plain sheet.',
 draft_recipe:'Changes you left on a saved recipe: when you open it, the recipe offers <i>Pick Up Where You Left Off</i> (mid green; Start Cooking stays the one dark button) or <i>Start Over</i>.',

 conflict:'Someone else (May) saved a change while you edited. The card opens on the changed line with its group name showing; the line shows what she wrote. <i>Keep Mine and Save</i> (main) or <i>Take May’s</i> (then Save as usual).',
 later:'Record a Kitchen Talk (Coming Later): its first screen as a preview, <i>Let everyone know you’re recording</i>. Its <i>Start Recording</i> button is grey and only says <i>Coming later. It is on our list.</i>; the two tips are plain lines.'};

 $('#ttick').onclick=flipTick;$('#ttick').onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();flipTick();}};

 $('.main').insertAdjacentHTML('beforeend',`<div class="asheet" id="asheet" role="dialog" aria-label="Add a Recipe"></div><div class="menu emenu" id="emenu" role="menu"></div><div class="dscrim" id="dscrim"></div><div class="dlg" id="dlg" role="dialog" aria-modal="true"></div><div class="nsheet" id="nsheet" role="dialog" aria-label="Edit with Claude"></div>`);
 $('#tedit').onclick=()=>{E.mode='edit';E.m=modelFromDetail(S.sel);startEdit();E.st='edit';renderStates();renderNotes();};
 $('#tcancel').onclick=cancelEdit;$('#tsave').onclick=edSave;
 {const bk=$('.book');bk.addEventListener('scroll',()=>{if(bk.scrollLeft||bk.scrollTop){bk.scrollLeft=0;bk.scrollTop=0;}});}

   :`${E.role==='member'?'':'<button data-m="add">+ Add a Recipe</button>'}<button data-m="move" aria-haspopup="menu" aria-expanded="false">Move to Collection<span class="mar">›</span></button><button data-m="share" class="later" aria-disabled="true">Share / Print<span class="cl">Coming Later</span></button>${E.role==='member'?'<hr><div class="mnote">Only the book’s owner and people with Full Access can edit or delete recipes.</div>':''}`;
  placeMenu(m,dots);m.classList.add('show');dots.classList.add('on');$('#scrim').classList.add('show');$('#scrim').style.opacity=0;

  $$('#menu [data-m2]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();closeMenu();const k=b.dataset.m2;

   if(k==='toss')dialog('Throw this card away?','What you typed on it is gone for good.',[['Throw It Away','red',()=>{endEdit();toast('Card thrown away.');}],['Keep It','',null]]);});};
 /* while editing, opening another recipe asks first */
 $$('#dscroll .ic').forEach(el=>el.addEventListener('click',e=>{if(E.on&&E.dirty){e.stopImmediatePropagation();askLeave(()=>{endEdit();openRecipe(el.dataset.id);});}},true));
 setTanMode();};
