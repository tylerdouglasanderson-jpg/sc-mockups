  {id:'AB',name:'AB. Box foot, matched bow wisps',d:'M3 13h18c0 3.5-2.5 6-6 6v2H9v-2c-3.5 0-6-2.5-6-6ZM9 9c0-1 1.4-1.4 1.4-3S9 4 9 3M14 9c0-1 1.4-1.4 1.4-3s-1.4-2-1.4-3',why:'The bowl curve ends flat at 19, then the foot drops straight down 2 to 21 (6 wide): a clear step, corners on whole units. Two copies of one wisp, 5 apart, 9 to 3: straight up, one soft bow (1.4) to the right, straight up again.'},
  {id:'AC',name:'AC. Foot that tapers in, matched bow wisps',d:'M3 13h18c0 3.5-2.5 6-5 6l-1 2H9l-1-2c-2.5 0-5-2.5-5-6ZM9 9c0-1 1.4-1.4 1.4-3S9 4 9 3M14 9c0-1 1.4-1.4 1.4-3s-1.4-2-1.4-3',why:'Y\'s idea done right: the foot is 8 wide where it meets the bowl and narrows to 6 at 21 (sides lean in, no flare). Same wisps as AB.'},
  {id:'AD',name:'AD. Box foot, small S wisps',d:'M3 13h18c0 3.5-2.5 6-6 6v2H9v-2c-3.5 0-6-2.5-6-6ZM9.5 9c-1-.8-1-2.2 0-3s1-2.2 0-3M14.5 9c-1-.8-1-2.2 0-3s1-2.2 0-3',why:'AB\'s bowl with the usual steam wave: two matched S wisps that swing only 0.75 each way, so they stay calm and do not hook into a "2".'}
 ]}
];
const PICK={1:'B',2:'F',3:'J',4:'L',5:'Q',6:'V',7:'Z',8:'AB'};
const Q=new URLSearchParams(location.search);
if(Q.get('theme')==='dark')document.body.className='th-dark';
const ONLY=Q.get('round');
const pathEl=p=>p.startsWith('<')?p:`<path d="${p}"/>`;
function svg(o,size,cls=''){const inner=o.lu?LU[o.lu].map(pathEl).join(''):`<path d="${o.d}"/>`;
 return `<svg class="${cls}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;}
const nbr=(o,s)=>['soup','search','funnel','book-open','clock'].map(k=>svg({lu:k},s)).join('')+`<span class="sep"></span>`+svg(o,s,'me');
function sizes(o,rid,th){return `<div class="side ${th}"><div class="lab">${th==='th-dark'?'Dark (proof palette), placeholder tone':'Light, placeholder tone'}</div><div class="strip">${[16,20,24,32,64].map(s=>`<div class="sz" id="${th==='th-dark'?'d':'l'}${rid}${o.id}s${s}">${svg(o,s)}${s}</div>`).join('')}<div class="sz"><div class="g128" id="${th==='th-dark'?'d':'l'}${rid}${o.id}s128"><div class="gr"></div><div class="safe"></div>${svg(o,128)}</div>128</div></div>
 <div class="nb">${nbr(o,20)}</div><div class="nb">${nbr(o,24)}</div></div>`;}
const PHOTO=c=>`<div class="th" style="--food:${c}"></div>`;
function ctx(o,th){const nop=`<div class="th nop" title="No photo yet">${svg(o,24)}</div>`;
 const I_CLOCK=svg({lu:'clock'},16,'ico');
 const card=(n,t,c,photo)=>`<div class="ic"><div class="ich"><b>${n}</b></div><div class="im"><span>${I_CLOCK}${t} min</span><span>Made 1×</span><span class="hv">Have 4 of 8</span></div><div class="icb">${photo?PHOTO(c):nop}<div class="ix"><div>Fast, use any veg.</div><div class="src">Your own recipe</div></div></div></div>`;
 return `<div class="side ${th}" style="background:var(--page);padding:10px;border-radius:10px"><div class="ctxlab">${th==='th-dark'?'Dark (proof)':'Light'}: C-058 card 84x68, pile 64x48, list row 56x48, iPhone row 48x42</div><div class="ctx"><div class="col">
 ${card('Ginger Beef Stir-Fry',25,'#7A4A2A',false)}${card('Chicken Tikka Masala',45,'#C0682E',true)}
 <div style="display:flex;gap:10px;align-items:center">${PHOTO('#D07A3A').replace('class="th"','class="th p64"')}<div class="th nop p64">${svg(o,24)}</div><span class="ctxlab">pile tiles</span></div></div>
 <div class="col"><div class="rows">
  <div class="row">${PHOTO('#C0682E')}<b>Chicken Tikka Masala</b><div class="m">45 min<br>Have 6 of 9</div></div>
  <div class="row">${nop}<b>Ginger Beef Stir-Fry</b><div class="m">25 min<br>Have 4 of 8</div></div>
  <div class="row">${nop}<b>Naan Pizza</b><div class="m">15 min<br>Have 4 of 5</div></div></div>
  <div class="rows"><div class="row ph">${PHOTO('#C0682E')}<b>Chicken Tikka Masala</b><div class="m">45 min</div></div>
  <div class="row ph">${nop}<b>Ginger Beef Stir-Fry</b><div class="m">25 min</div></div></div></div></div></div>`;}
function render(){let h=`<div class="card"><h2>A recipe with no photo yet</h2><p class="q">Its photo spot shows a quiet paper tile with a small bowl in the middle. Everyday line icon (Lucide family: 24 grid, line 2, round ends, no fill), placeholder tone, 24 px in the tile. Must not look like Lucide <code>soup</code> (that is "lunch" in the app). ★ marks my pick each round. Brief: <code>BRIEF.md</code>; grades: <code>ITERATIONS.md</code>.</p></div>`;
 for(const r of [...ROUNDS].reverse()){h+=`<div class="card rnd${ONLY==r.n?' show':''}" id="round${r.n}"><h2>Round ${r.n}</h2><div class="opts">`;
  for(const o of r.opts){const pk=PICK[r.n]===o.id;
   h+=`<div class="opt${pk?' pick':''}" id="o${r.n}${o.id}"><div class="nm">${o.name}${pk?'<span class="pk">★ my pick</span>':''}</div><div class="why">${o.why}</div>
   <div class="two">${sizes(o,r.n,'th-light')}${sizes(o,r.n,'th-dark')}</div>
   <h3>In the Recipe Book</h3><div class="two" style="grid-template-columns:minmax(0,1fr)">${ctx(o,'th-light')}${ctx(o,'th-dark')}</div>
   <pre>${o.lu?'Lucide '+o.lu+' (6 parts)':o.d}</pre></div>`;}
  h+=`</div></div>`;}
 document.getElementById('app').innerHTML=h;
 if(ONLY)document.body.classList.add('only-round');
 document.getElementById('seg').innerHTML=[`<button class="${!ONLY?'on':''}" onclick="location.search=''">All rounds</button>`,...ROUNDS.map(r=>`<button class="${ONLY==r.n?'on':''}" onclick="location.search='?round=${r.n}'">Round ${r.n}</button>`),`<button onclick="const u=new URLSearchParams(location.search);u.set('theme',document.body.className==='th-dark'?'light':'dark');location.search=u">Light / Dark page</button>`].join('');}
render();
</script>
<script>if(window.SC_FULL)document.documentElement.dataset.full=window.SC_FULL;</script>
</body>
