<html lang="en"><head><script>window.SC_FULL='phone'</script><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="SC Sign In">
<title>Before Sign-In Pages iPhone</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Fraunces:ital,opsz,wght@1,9..144,500;1,9..144,600&display=swap" rel="stylesheet">
<style>
/* SupperCraft before-sign-in pages, p12 v1. Real values: app kit (palettes, scales), EntryShell/EntryParts (ENTRY_SIZE),
   LIVE_NOW.md "Measurements". Device text is in rem so "Big text" can scale it; mockup chrome is in px. */
:root{--page:#EDE5D8;--card:#FAF6EE;--ink:#1E1E1C;--ink2:#54524A;--muted:#605E55;--ph:#6F6C62;--sage:#1F3A1C;--sage-hov:#132611;--accent:#4B6947;
--sage-light:#E4EDE2;--sage-mid:#8FAF8A;--tan:#E4D3B3;--border:rgba(0,0,0,.09);--line:#8A8577;--err:#8E3131;--errbg:#F5E4E4;--errline:#8E3131;--amber:#F5ECD8;--ease:cubic-bezier(.25,.46,.45,.94);--sb:rgba(96,94,85,.35);--sb-h:rgba(84,82,74,.7);--sb-p:rgba(84,82,74,.85);
--shape:#E2D9C9;--shape-in:#ECE5D7;--track:#DDD5C5;--brand:#6B3E14;--k:1}
*{box-sizing:border-box}
html{font-size:16px}
html.big{font-size:20.8px}
html,body{margin:0}
#dev{font-variant-numeric:tabular-nums}
body{font-family:"IBM Plex Sans",system-ui,sans-serif;background:#efece7;color:#222}
button{font:inherit;color:inherit}
/* ---------- mockup-only chrome (outside the device) ---------- */
#ctl{position:sticky;top:0;z-index:100;background:#fff;border-bottom:1px solid #ddd;padding:8px 14px;display:flex;flex-direction:column;gap:6px;font-size:13px}
#ctl .r{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
#ctl .tag{font:700 11px system-ui;letter-spacing:.08em;background:#FFF1A8;border:1px solid #d9c25a;border-radius:4px;padding:2px 6px;color:#5a4a00}
#ctl h1{font:700 14px system-ui;margin:0}
#ctl .lbl{font:600 11px system-ui;color:#777;text-transform:uppercase;letter-spacing:.06em;margin-right:2px}
#ctl .seg{display:inline-flex;flex-wrap:wrap;gap:4px}
#ctl .seg button,#ctl .cb{border:1px solid #cfc6b5;background:#fff;border-radius:7px;padding:5px 10px;font-size:13px;cursor:pointer;line-height:1.2}
#ctl .seg button.on{background:#1F3A1C;color:#fff;border-color:#1F3A1C;font-weight:600}
#ctl .cb.on{background:#FFF1A8;border-color:#d9c25a}
#ctl .tab{margin-left:auto;font-size:12px;color:#555}
#ctl .tab b{font-weight:600;color:#222}
#wrap{display:flex;gap:16px;padding:14px;align-items:flex-start}
#stage{flex:1;min-width:0}
#scaler{transform-origin:0 0}
#notes{flex:0 0 300px;position:sticky;top:120px;display:flex;flex-direction:column;gap:10px;font-size:13px;line-height:1.45}
.mnote{background:#FFF6B8;border:1px solid #E6D774;border-radius:4px;padding:10px 12px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.mnote b{display:block;margin-bottom:3px}
.mnote ul{margin:4px 0 0;padding-left:16px}
.mnote li{margin:2px 0}
@media (max-width:1100px){#wrap{flex-direction:column}#notes{position:static;flex:none;width:100%}}
html.full,html.full body{height:100%;overflow:hidden;background:var(--page)}
html.full #ctl,html.full #notes{display:none!important}
html.full #wrap{padding:0;display:block}
html.full #dev{border:0;border-radius:0;box-shadow:none}
#fab{display:none;position:fixed;left:10px;bottom:10px;z-index:200;font:600 12px system-ui;background:#FFF1A8;border:1px solid #d9c25a;border-radius:8px;padding:6px 10px;cursor:pointer;opacity:.85}
html.full.nav:not(.shots) #fab{display:block}
#pop{display:none;position:fixed;left:10px;bottom:46px;z-index:201;width:min(560px,calc(100vw - 20px));max-height:70vh;overflow:auto;background:#fff;border:1px solid #ccc;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:12px;font:13px/1.4 system-ui}
#pop.show{display:block}
#pop h4{margin:8px 0 4px;font-size:12px;text-transform:uppercase;color:#777;letter-spacing:.05em}
#pop button{border:1px solid #cfc6b5;background:#fff;border-radius:7px;padding:4px 8px;margin:2px;font-size:12px;cursor:pointer}
#pop button.on{background:#1F3A1C;color:#fff}

/* ---------- the device ---------- */
#dev{position:relative;background:var(--page);border:8px solid #22211f;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,.18);color:var(--ink)}
#dev *{-webkit-tap-highlight-color:transparent}

 box-shadow:inset 0 -1px 0 rgba(0,0,0,.35)}
.bar .in{width:100%;padding:0 16px 0 18px;display:flex;align-items:center;justify-content:space-between}
.wm{font-family:Fraunces,serif;font-style:italic;font-weight:600;font-size:22px;color:#FAF4EB;text-decoration:none;letter-spacing:.005em;line-height:50px;padding-right:32px;cursor:pointer}
.wm.plain{cursor:default}
.av{width:30px;height:30px;border-radius:50%;background:#C77B4A;color:#fff;font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;border:2px solid #FAF6EE}
.scroll{flex:1;min-height:0;overflow:auto;position:relative;scrollbar-width:thin;scrollbar-color:var(--sb) transparent}
.scroll::-webkit-scrollbar,.thin::-webkit-scrollbar,.board::-webkit-scrollbar{width:12px;height:12px}
.scroll::-webkit-scrollbar-thumb,.thin::-webkit-scrollbar-thumb,.board::-webkit-scrollbar-thumb{background:var(--sb);border:3px solid transparent;background-clip:padding-box;border-radius:999px}
:is(.scroll,.thin,.board)::-webkit-scrollbar-thumb:hover{background-color:var(--sb-h)}:is(.scroll,.thin,.board)::-webkit-scrollbar-thumb:active{background-color:var(--sb-p)}
.scroll::-webkit-scrollbar-track,.thin::-webkit-scrollbar-track{background:transparent}
.thin,.board{scrollbar-width:thin;scrollbar-color:var(--sb) transparent}
/* the frame: two columns at 900+ (w2), one centred column below (one), phone (ph) */
.cols{width:100%}
.w2 .cols{display:flex;align-items:flex-start;justify-content:center;gap:64px;padding:40px}
.w2 .story{flex:1;max-width:430px}
.w2 .ccol{flex:1;max-width:470px}
.one .cols{max-width:502px;margin:0 auto;padding:40px 16px}
.one.ph .cols{padding:12px 16px 32px}
.one .ccol{margin-top:24px}
.one.ph .ccol{margin-top:12px}

/* story (C-043) */
.eb{font-size:.75rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);line-height:1.3}
.story h1{font-size:2.25rem;line-height:1.15;font-weight:700;margin:8px 0 0;color:var(--ink);letter-spacing:-.005em}
/* iPad scale from LIVE_NOW "Measurements" (40 / 32 / 17 / 13) is in the t-ipad block below; phone headline 34 */
.ph .story h1{font-size:2.125rem}
/* loading shape of the story: the real words, drawn as grey bars line by line (so it never moves on fade-in) */
.ghost .eb,.ghost h1,.ghost .sp,.ghost .steps li>span,.ghost .pt b,.ghost .pt span{color:transparent!important}
.ghost .gt{background:linear-gradient(var(--shape),var(--shape)) 0 55%/100% 64% no-repeat;border-radius:6px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.ghost .steps b,.ghost .pt i{background:var(--shape)!important;color:transparent!important}
.ghost .steps b svg,.ghost .pt i svg{visibility:hidden}
.cghost{pointer-events:none}
.cghost *{color:transparent!important;text-decoration:none!important}
.cghost .gt{background:linear-gradient(var(--shape-in),var(--shape-in)) 0 55%/100% 64% no-repeat;border-radius:6px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.cghost input,.cghost .btn,.cghost .rc,.cghost .prow,.cghost .ddb,.cghost .chip,.cghost .amb{background:var(--shape-in)!important;border-color:transparent!important;box-shadow:none!important;opacity:1!important}
.cghost .btn .gt,.cghost .rc .gt,.cghost .prow .gt,.cghost .ddb .gt,.cghost .chip .gt,.cghost .amb .gt{background:none}
.cghost svg,.cghost .rd,.cghost .tg,.cghost .okb{visibility:hidden}
.cghost .foot{border-top-color:var(--shape-in)}
.cghost .or:before,.cghost .or:after{background:var(--shape-in)}
.cghost .clist{overflow:hidden}
.row2.hr{margin-top:2px;min-height:40px}
.row2.hr .fh{margin-top:0}
.story .sp{font-size:.9375rem;line-height:1.45;color:var(--ink2);margin:4px 0 0}
.ph .story .sp{display:none}
.steps{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.one .steps,.one .pts{display:none}
.steps li{display:flex;align-items:center;gap:10px;font-size:.9375rem;color:var(--ink2)}
.steps b{flex:none;width:24px;height:24px;border-radius:50%;background:var(--sage-light);color:var(--accent);font-size:.75rem;font-weight:600;display:flex;align-items:center;justify-content:center}
.steps li.done b{background:var(--accent);color:#fff}
.pts{margin:18px 0 0;display:flex;flex-direction:column;gap:14px}
.pt{display:flex;gap:10px;align-items:flex-start}
.pt i{flex:none;width:24px;height:24px;border-radius:6px;background:var(--sage-light);color:var(--accent);display:flex;align-items:center;justify-content:center;margin-top:-1px}
.pt b{display:block;font-size:.9375rem;font-weight:600;color:var(--ink)}
.pt span{font-size:.8125rem;color:var(--ink2)}
/* the card */
.card{background:var(--card);border-radius:12px;border:1px solid var(--border);box-shadow:0 1px 2px rgba(45,33,22,.055),0 6px 16px rgba(45,33,22,.055);padding:28px;position:relative}
.card.gliding{overflow:hidden}
.ph .card{padding:18px}
.ci{transition:opacity 160ms var(--ease)}
.ci.fade{opacity:0}
h2.t{font-size:1.875rem;line-height:1.2;font-weight:700;margin:0;color:var(--ink);outline:none;letter-spacing:-.005em;overflow-wrap:anywhere}
.ph h2.t{font-size:1.625rem}
.q{font-size:.9375rem;line-height:1.45;color:var(--ink2);margin:6px 0 0}
.po{display:none}.ph .po{display:block}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--errbg);border:1px solid var(--errline);color:#5C1A1A;border-radius:8px;padding:10px 12px;font-size:.875rem;line-height:1.4;margin-bottom:18px}
.note .ic{flex:none;margin-top:1px;color:var(--err)}
.note.ok{background:var(--sage-light);border-color:var(--sage-mid);color:var(--accent)}
.note.ok .ic{color:var(--accent)}
.f{margin-top:18px}
.f label,.lab{display:block;font-size:.75rem;font-weight:500;color:var(--ink2);margin-bottom:6px}
.f input,.inp{width:100%;height:50px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:0 14px;font:400 1rem "IBM Plex Sans",sans-serif;color:var(--ink);outline:none;transition:border-color 160ms,box-shadow 160ms}
.f input:focus{border-color:var(--accent)}.f input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.f input.bad{border-color:#8E3131}
.f input:disabled{background:#F1E8DA;color:var(--muted)}
.f input::placeholder{color:var(--ph)}
.fh{font-size:.8125rem;color:var(--muted);margin-top:6px}
.ferr{font-size:.8125rem;color:var(--err);margin-top:6px;line-height:1.35}
.ferr[hidden]{display:none}
.row2{display:flex;justify-content:space-between;align-items:center;margin-top:12px;min-height:44px}
.showpw{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--ink2);font-size:.9375rem;padding:8px 6px;border-radius:8px;cursor:pointer}
.showpw:hover{background:var(--tan);color:var(--ink)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border:0;border-radius:8px;background:var(--sage);color:#FAF4EB;font-size:1rem;font-weight:600;cursor:pointer;margin-top:20px;padding:8px 16px;text-align:center;transition:background-color 120ms,opacity 160ms}
.btn:hover{background:var(--sage-hov)}
.btn.pale{background:#61725B;cursor:default}
.btn.pale:hover{background:#61725B}
.btn.busy{opacity:1;cursor:default}
.btn.ol{background:var(--card);color:var(--ink);border:1px solid var(--ink2)}
.btn.ol:hover{background:var(--sage-light)}
.btn.ol.pale,.btn.ol.pale:hover{background:var(--card);color:var(--muted);border-color:#B5B0A3}
.btn+.btn,.why+.btn{margin-top:8px}
.btn.ol.first{margin-top:12px}
.btn:focus-visible,.rc:focus-visible,.tl:focus-visible,.back:focus-visible,.prow:focus-visible,.ddb:focus-visible,.showpw:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite;opacity:.8}
@keyframes spin{to{transform:rotate(360deg)}}
/* why-line: takes no room while empty; reserved (20 px) only under a busy button, where the 10 s slow line lands */
.why{margin-top:8px;font-size:.8125rem;line-height:1.4;color:var(--muted);text-align:center}
.why:empty{margin:0;min-height:0}
.or{display:flex;align-items:center;gap:12px;margin:16px 0 0;font-size:.875rem;color:var(--muted)}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--border)}
.or+.btn{margin-top:12px}
.foot{margin-top:20px;padding-top:4px;border-top:1px solid var(--border);display:flex;flex-direction:column;align-items:center}
.foot>div{min-height:44px;display:flex;align-items:center;justify-content:center;gap:5px;font-size:.9375rem;color:var(--ink2);text-align:center;flex-wrap:wrap}
.card .foot{margin-bottom:-8px}
.lrow{min-height:44px;display:flex;align-items:center;margin-top:4px}
.tl{color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer;border-radius:6px;padding:2px 2px}
.tl:hover{background:var(--tan);color:var(--ink)}
.back{display:inline-flex;align-items:center;min-height:44px;margin-top:8px;font-size:.9375rem;color:var(--ink2);font-weight:500;text-decoration:none;cursor:pointer;padding:0 8px;margin-left:-8px;border-radius:8px}
.back:hover{background:var(--tan);color:var(--ink)}
.chip{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--border);border-radius:8px;padding:12px 14px;font-weight:600;font-size:.9375rem;color:var(--ink);word-break:break-word;overflow-wrap:anywhere}
.chip .ic{flex:none;color:var(--accent)}
.hint{font-size:.875rem;line-height:1.45;color:var(--ink2);margin:14px 0 0}
.amb{background:var(--amber);border-radius:8px;padding:10px 12px;font-size:.875rem;color:var(--ink2);line-height:1.45;margin-top:16px}
.amb .more{margin-top:6px;font-size:.8125rem}
.small{font-size:.8125rem;color:var(--muted);line-height:1.45}
.small.c{text-align:center;margin:12px 0 0}
.why:not(:empty)+.small.c{margin-top:14px}
.amb+.amb{margin-top:8px}
.lline{margin-top:10px;font-size:.8125rem;color:var(--muted)}
/* radio cards (kit RadioCard) */
.rcs{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.rc{display:flex;align-items:center;gap:12px;min-height:50px;border:1px solid rgba(0,0,0,.16);border-radius:8px;background:var(--card);padding:8px 14px;font-size:.9375rem;font-weight:600;color:var(--ink);cursor:pointer;text-align:left;width:100%}
.rc:hover{background:#F0EEE3;border-color:rgba(0,0,0,.3)}
.rc .rd{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--ink2);display:flex;align-items:center;justify-content:center}
.rc.on{border-color:var(--accent);background:var(--sage-light)}
.rc.on .rd{border-color:var(--sage)}
.rc.on .rd:after{content:"";width:10px;height:10px;border-radius:50%;background:var(--sage)}
.rc .tg{margin-left:auto;font-size:.75rem;font-weight:500;color:var(--muted);background:var(--page);border-radius:6px;padding:2px 8px}
.rc.row{display:inline-flex}
.rcs.two{flex-direction:row}.rcs.two .rc{flex:1}
.clist{margin-top:8px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding-right:4px;max-height:var(--lh,296px)}
.nomatch{padding:14px 4px;font-size:.9375rem;color:var(--muted)}
/* policy row */
.prow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:50px;margin-top:18px;border:1px solid rgba(0,0,0,.16);border-radius:8px;background:var(--card);padding:8px 14px;cursor:pointer;text-align:left}
.prow:hover{background:#F0EEE3}
.prow b{font-size:.9375rem;color:var(--ink)}
.prow span{font-size:.8125rem;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.prow.ok span{color:var(--accent);font-weight:600}
/* drop-down (C-045) */
.dd{position:relative}
.ddb{display:flex;align-items:center;justify-content:space-between;width:100%;height:50px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:0 14px;font-size:1rem;color:var(--ink);cursor:pointer;text-align:left}
.ddb.open{border-color:var(--accent);box-shadow:0 0 0 3px var(--sage-light)}
.ddb .ph{color:var(--ph)}
.ddl{position:absolute;left:0;right:0;top:56px;z-index:6;background:var(--card);border:1px solid rgba(0,0,0,.18);border-radius:12px;box-shadow:0 4px 14px rgba(45,33,22,.16);padding:6px}
.ddl .o{width:100%;border:0;background:transparent;text-align:left;color:var(--ink);align-items:center}
.ddl .o:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.ddl .o .tg{font-size:.75rem;font-weight:500;color:var(--muted);background:var(--page);border-radius:6px;padding:2px 8px}
.ddl .srch{display:flex;align-items:center;gap:8px;height:42px;border-bottom:1px solid var(--border);padding:0 8px;margin-bottom:4px;color:var(--muted);font-size:.9375rem}
.ddl .srch input{border:0;background:transparent;outline:none;font:inherit;color:var(--ink);flex:1;min-width:0}
.ddl .opts{max-height:200px;overflow:auto}
.ddl .o{padding:10px;border-radius:8px;font-size:.9375rem;display:flex;justify-content:space-between;cursor:pointer}
.ddl .o:hover,.ddl .o.hl{background:#F0EEE3}
.story h1,h2.t{text-wrap:balance}
.ddl .o.on{background:var(--sage-light);color:var(--accent);font-weight:600}
/* shapes (C-066 / C-050): still grey bars in the words' own places */
.sh{background:var(--shape);border-radius:6px}
.card .sh{background:var(--shape-in)}
/* overlays inside the device */
#ovl{position:absolute;inset:0;pointer-events:none;z-index:20}
#ovl>*{pointer-events:auto}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.4);animation:fin 200ms var(--ease)}
@keyframes fin{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(640px,calc(100% - 48px));height:min(720px,calc(100% - 80px));background:var(--card);border-radius:16px;box-shadow:0 16px 48px rgba(45,33,22,.2);display:flex;flex-direction:column;animation:fin 240ms var(--ease)}
.ph .sheet{left:0;right:0;bottom:0;top:auto;transform:none;width:auto;height:calc(100% - 40px);border-radius:16px 16px 0 0;animation:rise 240ms var(--ease)}
.sheet.fail,.ph .sheet.fail{height:auto}
.sheet.fail .sh-b{flex:none;padding:20px 24px}.ph .sheet.fail .sh-b{padding:16px 18px}.sheet.fail .note{margin-bottom:0}
.sheet .sh-h{padding:22px 24px 12px;border-bottom:1px solid var(--border)}
.ph .sheet .sh-h{padding:16px 18px 10px}
.sheet .sh-h h3{margin:0;font-size:1.625rem;font-weight:700;color:var(--ink)}
.sheet .sh-h .v{font-size:.8125rem;color:var(--muted);margin-top:4px}
.sheet .sh-b{flex:1;overflow:auto;padding:8px 24px 20px;font-size:.9375rem;line-height:1.55;color:var(--ink2)}
.ph .sheet .sh-b{padding:8px 18px 16px}
.sheet .sh-b h4{font-size:1.0625rem;color:var(--ink);margin:18px 0 4px;font-weight:600}
.sheet .sh-f{padding:12px 24px 16px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px;justify-content:flex-end}
.ph .sheet .sh-f{flex-direction:column;align-items:stretch;padding:10px 18px 18px}
.sheet .sh-f .why{margin:0 auto 0 0;text-align:left}
.ph .sheet .sh-f .why{margin:0;text-align:center}
.sheet .sh-f .btn{margin:0;width:auto;min-width:120px}
.ph .sheet .sh-f .btn{width:100%}
.dlg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,calc(100% - 32px));background:var(--card);border-radius:16px;box-shadow:0 16px 48px rgba(45,33,22,.2);padding:24px;animation:fin 200ms var(--ease)}
.dlg h3{margin:0;font-size:1.375rem;font-weight:700;color:var(--ink);line-height:1.25;overflow-wrap:anywhere}
.dlg p{margin:8px 0 0;font-size:.9375rem;color:var(--ink2);line-height:1.45}
.dlg .acts{display:flex;gap:10px;margin-top:20px}
.dlg .acts .btn{margin:0}
.ph .dlg .acts{flex-direction:column}
/* the board (D-01) and the Signing-in cover */
.board{position:absolute;inset:0;background:var(--page);display:flex;align-items:safe center;justify-content:center;padding:16px 24px;z-index:30;transition:opacity 400ms var(--ease);overflow:auto}
.ph .board{padding:12px 16px}
.board.out{opacity:0}
.bpanel{width:100%;max-width:520px}
.bcard{background:var(--card);border-radius:12px;border:1px solid var(--border);padding:24px;display:flex;flex-direction:column;align-items:center;box-shadow:0 1px 2px rgba(45,33,22,.055),0 6px 16px rgba(45,33,22,.055);transition:transform 350ms ease-out}
.board.out .bcard{transform:scale(.98)}
.bwm{font-family:Fraunces,serif;font-style:italic;font-weight:600;font-size:1.75rem;line-height:1.2;color:var(--ink)}
.bq{font-style:italic;font-size:.8125rem;color:var(--muted);margin-top:4px;text-align:center}
.tiles{width:100%;display:flex;flex-wrap:wrap;justify-content:center;margin-top:20px}
.cell{padding:4px;width:25%}
.ph .cell{width:50%}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:8px;padding:12px 8px;border:1px solid var(--border);background:var(--page);transition:background-color 450ms ease-out,border-color 450ms ease-out}
.tile .dot{width:8px;height:8px;border-radius:4px;background:var(--track);transition:all 450ms ease-out}
.tile .cnt{font-size:.9375rem;line-height:1.3;font-weight:600;color:var(--ink);margin-top:8px;min-height:1.3em;opacity:0;transition:opacity 450ms;white-space:nowrap}
.tile .lb{font-size:.8125rem;font-weight:500;color:var(--muted);margin-top:2px}
.tile.lit{background:var(--sage-light);border-color:rgba(143,175,138,.85)}
.tile.lit .dot{background:var(--sage);box-shadow:0 0 0 4px rgba(143,175,138,.3)}
.tile.lit .lb{color:var(--accent)}
.tile.lit .cnt{opacity:1}
.tile .cnt.none{font-weight:500;font-style:italic;color:var(--muted)}
.tile.later .cnt{opacity:1;font-weight:500;font-style:italic;color:var(--muted)}
.slot{position:relative;min-height:44px;margin-top:16px;width:100%;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:2px 6px;font-style:italic;font-size:.8125rem;color:var(--ink2);text-align:center}
.ph .slot{min-height:66px}
.slot a{font-style:normal;font-weight:600;color:var(--accent);text-decoration:underline;text-underline-offset:2px;cursor:pointer;font-size:.9375rem;min-height:44px;display:inline-flex;align-items:center;padding:0 8px;border-radius:8px}
.slot a:hover{background:var(--tan);color:var(--ink)}
.slot a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.slot .done{display:inline-flex;align-items:center;gap:8px;font-style:normal;font-size:.9375rem;font-weight:600;color:var(--accent)}
.rule{width:100%;height:2px;border-radius:2px;overflow:hidden;background:var(--track);margin-top:16px}
.fill{height:2px;background:var(--sage);width:0;transition:width 450ms ease-out}
.fill.ind{width:30%;animation:ind 1.4s ease-in-out infinite}
@keyframes ind{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
.cover-back{margin-top:6px}
/* Welcome Back (C-018 v1) */
.wb{position:absolute;inset:0;z-index:40;background:var(--page);display:flex;align-items:center;justify-content:center;flex-direction:column;cursor:pointer;transition:opacity 400ms cubic-bezier(.55,.085,.68,.53);border:0;width:100%;padding:0;font:inherit;color:inherit}
.wb:focus-visible{outline:2px solid var(--accent);outline-offset:-6px}
.wb.out{opacity:0}
.wb .nm{font:italic 600 4.75rem/1.05 Fraunces,serif;font-variation-settings:'opsz' 144;color:var(--brand);white-space:nowrap}
.ph .wb .nm{font-size:3.125rem}
.wb .nm span{display:inline-block}
.wb.play .nm span{animation:lup 320ms cubic-bezier(.25,.46,.45,.94) both}
@keyframes lup{from{opacity:0;transform:translateY(14px)}}
.wb .rl{height:1px;background:var(--brand);opacity:.55;width:180px;margin-top:18px}
.ph .wb .rl{width:120px}
.wb.play .rl{animation:sx 300ms 200ms both}
@keyframes sx{from{transform:scaleX(0)}}
.wb .cap{font:500 .8125rem/1 "IBM Plex Sans",sans-serif;letter-spacing:.34em;text-transform:uppercase;padding-left:.34em;color:var(--accent);margin-top:14px}
.wb.play .cap{animation:fin 250ms 260ms both}
.wb .wslow{position:absolute;bottom:18%;font-style:italic;font-size:.8125rem;color:var(--ink2);animation:fin 200ms both}
/* Today stand-in */
.today{padding:28px 32px}
.ph .today{padding:20px 16px}
.today h1{margin:0 0 4px;font-size:1.625rem;color:var(--ink)}
.today .sub{color:var(--muted);font-size:.875rem;margin-bottom:18px}
.today .row{display:flex;gap:12px;flex-wrap:wrap}
.today .blk{flex:1 1 240px;min-height:110px;border-radius:12px;background:var(--card);border:1px solid var(--border);padding:14px;color:var(--ink2);font-size:.875rem}
.today .blk b{display:block;color:var(--ink);margin-bottom:6px}
/* Welcome (invited members, C-047) */
.wcol{width:100%;max-width:552px;margin:0 auto;padding:28px 16px}
.ph .wcol{padding:20px 16px}
.dots{display:flex;gap:6px;align-items:center;margin-bottom:12px}
.dots span{height:8px;border-radius:4px;background:rgba(0,0,0,.15);width:8px}
.dots span.on{background:var(--accent)}
.dots span.cur{width:22px}
.dots em{font-style:normal;font-size:.75rem;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-left:6px}
.wcol h1{font-size:1.875rem;line-height:1.2;margin:0;color:var(--ink);font-weight:700;outline:none;overflow-wrap:anywhere}
.wcol .sub{font-size:.9375rem;color:var(--ink2);margin:6px 0 16px;line-height:1.45;overflow-wrap:anywhere}
.rowcard{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:6px 16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(45,33,22,.055),0 6px 16px rgba(45,33,22,.055)}
.rowcard.pad{padding:16px}
.rowcard.pad>.f:first-child{margin-top:0}
.rowcard .gl{background:var(--shape-in);border-radius:6px}
.scroll .wcol{padding-bottom:32px}
.ir{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--border)}
.ir:first-child{border-top:0}
.ir i{flex:none;width:32px;height:32px;border-radius:8px;background:var(--sage-light);color:var(--accent);display:flex;align-items:center;justify-content:center}
.ir b{display:block;font-size:.9375rem;color:var(--ink)}
.ir span{font-size:.875rem;color:var(--ink2)}
.fullnote{font-size:.875rem;color:var(--ink2);line-height:1.5;padding:4px 0 10px}
.wbar{flex:none;border-top:1px solid var(--border);background:var(--card);padding:16px 0 4px}.wbar.nowhy{padding:16px 0}.wbar.wo{padding-bottom:4px}
.wout{min-height:44px;display:flex;align-items:center;justify-content:center;gap:4px;font-size:.9375rem;color:var(--ink2);margin-top:2px}
.wbar .wcol{padding-top:0;padding-bottom:0}
.wbar .btn{margin-top:0}
.wbar .why{margin-top:6px}
.sws{display:flex;flex-wrap:wrap;gap:14px}
.ph .sws{display:grid;grid-template-columns:repeat(4,44px);justify-content:space-between;gap:16px 0;padding:0 6px}
.sw{position:relative;width:44px;height:44px;border-radius:50%;border:0;cursor:pointer;padding:0;overflow:hidden}
.swo{position:relative;border-radius:50%;width:44px;height:44px}
.swo.on{box-shadow:0 0 0 3px var(--card),0 0 0 6px var(--sage)}
.sw:focus-visible{outline:none}
.swo:has(.sw:focus-visible){box-shadow:0 0 0 3px var(--card),0 0 0 6px var(--accent),0 0 0 9px var(--sage-light)}
.sw.taken{cursor:not-allowed}
.sw.taken:before{content:"";position:absolute;inset:0;background:rgba(250,246,238,.6)}
.sw.taken:after{content:"";position:absolute;left:50%;top:-10px;width:2px;height:64px;margin-left:-1px;background:var(--ink);transform:rotate(45deg)}
.swl{font-size:.8125rem;color:var(--muted);margin-top:14px}
.swl b{color:var(--ink);font-weight:600}
.kbd{flex:none;height:291px;background:#D1D4DA;border-top:1px solid #b9bcc2;display:grid;grid-template-rows:repeat(4,1fr);gap:8px;padding:10px 4px 46px}
.kbd div{display:flex;gap:6px;justify-content:center}
.kbd span{background:#fff;border-radius:5px;width:32px;box-shadow:0 1px 0 #898a8d}
/* Emails */
.mail{flex:1;min-height:0;overflow:auto;background:#F4F3F1;font-family:"IBM Plex Sans",Helvetica,Arial,sans-serif}
.mhead{background:#fff;border-bottom:1px solid #e2e0dc;padding:16px 28px}
.ph .mhead{padding:12px 16px}
.mhead .s{font-size:1.25rem;font-weight:600;color:#202124;margin-bottom:10px;overflow-wrap:anywhere}
.ph .mhead .s{font-size:1.0625rem}
.mhead .fr{display:flex;gap:10px;align-items:center;font-size:.8125rem;color:#5f6368}
.mhead .fr i{width:36px;height:36px;border-radius:50%;background:var(--brand);color:#FAF4EB;font:italic 600 1rem Fraunces,serif;display:flex;align-items:center;justify-content:center;flex:none}
.mhead .fr b{color:#202124;font-weight:600}
.mbody{padding:28px 16px 40px}
.ph .mbody{padding:16px 10px 28px}
.em{max-width:560px;margin:0 auto;background:#FAF6EE;border-radius:12px;overflow:hidden;border:1px solid rgba(0,0,0,.08)}
.ph .em .band{padding:0 18px}
.em .band{height:50px;display:flex;align-items:center;padding:0 28px;background:var(--brand)!important;background-image:none!important;box-shadow:none}
.em .band span{font-family:Fraunces,Georgia,serif;font-style:italic;font-weight:600;font-size:1.375rem;color:#FAF4EB}
.em .eb2{padding:28px 28px 26px;color:#1E1E1C}
.ph .em .eb2{padding:22px 18px 20px}
.em h2{margin:0 0 10px;font-size:1.5rem;line-height:1.25;overflow-wrap:anywhere}
.em p{margin:0 0 14px;font-size:1rem;line-height:1.5;color:var(--ink2);overflow-wrap:anywhere}
.em .ebtn{display:inline-block;background:rgb(31,58,28);color:#FAF4EB;font-weight:600;font-size:1rem;text-decoration:none;border-radius:8px;padding:14px 26px;margin:6px 0 18px}
.ph .em .ebtn{display:block;text-align:center}
.em .fine{font-size:.8125rem;color:#605E55;line-height:1.5;margin:0 0 8px}
.em .fine a{color:#4B6947;font-weight:600;overflow-wrap:anywhere}

 t.content.querySelectorAll('[id]').forEach(e=>e.removeAttribute('id'));t.content.querySelectorAll('[data-go],[data-act]').forEach(e=>{e.removeAttribute('data-go');e.removeAttribute('data-act');});

function ddHTML(k,ctry,open,term){
 const face=ctry&&ctry!=='x'?`<span>${esc(ctry)}</span>`:'<span class="ph">Choose your country</span>';
 if(!open)return `<button type="button" class="ddb" id="${k}-dd" data-act="dd-open" data-k="${k}" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="${k}-lab ${k}-dd">${face}${ic('down')}</button>`;
 return `<div class="dd"><button type="button" class="ddb open" id="${k}-dd" data-act="dd-close" data-k="${k}" aria-haspopup="listbox" aria-expanded="true" aria-labelledby="${k}-lab ${k}-dd">${face}${ic('up')}</button><div class="ddl" data-k="${k}"><div class="srch">${ic('search',16)}<input id="${k}-q" value="${esc(term)}" placeholder="Search countries" aria-label="Search countries" role="combobox" aria-expanded="true" aria-controls="ddopts" aria-autocomplete="list"${(term||'').trim()&&ddMatch(term).length?' aria-activedescendant="ddo0"':''} data-filter="dd" data-k="${k}" autocomplete="off"></div><div class="opts thin" id="ddopts" tabindex="-1" role="listbox" aria-label="Country" data-k="${k}">${ddOpts(term,ctry)}</div>${ddNone(ddMatch(term).length)}<div class="vh" aria-live="polite" id="ddlive"></div></div></div>`;}
/* "My country isn't listed" sits under the scrolling list, always in view; with no match it is the one Tab stop, so Tab lands on it and the menu stays open */
const ddNone=n=>`<button type="button" tabindex="${n?-1:0}" class="o onone" data-pick="__none"><span>My country isn’t listed</span></button>`;

function ddOpts(t,cur){const typed=!!(t||'').trim();const l=ddMatch(t);
 /* one option is in the Tab order: the typed top match, else the picked country, else the first */
 const ti=typed?0:Math.max(0,l.findIndex(c=>c[0]===cur));

 return rows||'<div class="nomatch">No country matches.</div>';}

  const bs=$('#bstat');if(bs)bs.textContent='Ready';const rm=reduced||S.rm;
  /* D-01 Finish A: a quick wave across the tiles, then the line becomes a drawn check + Ready; Reduce Motion: the word only */
