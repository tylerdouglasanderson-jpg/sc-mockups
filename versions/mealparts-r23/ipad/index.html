.top::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--wood-sheen-top),var(--wood-sheen-bottom));pointer-events:none}
.wordmark{font-style:italic;font-weight:600;font-size:22px;position:relative}
.top .sp{flex:1}
.av{display:inline-grid;place-items:center;border-radius:50%;font-weight:600;color:var(--hdr-text);flex:none}
.av.hdr{width:28px;height:28px;font-size:12px;background:var(--member-1);box-shadow:0 0 0 2px var(--hdr-text);position:relative;z-index:1}
.av.sm{width:22px;height:22px;font-size:11px}.av.m2{background:var(--member-2)}
.rail{background:var(--card);border-right:1px solid var(--bcard);padding:12px 8px;display:flex;flex-direction:column;gap:4px;min-height:0}
.rail .cap{height:44px;border-radius:8px;background:var(--sage);color:var(--ink);display:flex;align-items:center;gap:8px;padding:0 12px;font-weight:500;font-size:16px;margin-bottom:8px}
.rail .ri{display:flex;align-items:center;gap:12px;height:44px;border-radius:8px;padding:0 12px;color:var(--ink2);font-weight:500;font-size:16px;text-align:left;flex:none}
.rail svg.ni,.rail svg.i{width:24px;height:24px;flex:none}
svg.ni{display:block;overflow:visible}
.rail .ri:hover,.rail .cap:hover{box-shadow:var(--hover)}
.rail .ri.on{background:var(--sage-light);color:var(--sage-text)}
.rail hr{border:0;border-top:1px solid var(--bcard);margin:4px 8px}
.rail .grow{flex:1}
.body{display:grid;grid-template-rows:46px 1fr;grid-template-columns:minmax(0,1fr);min-height:0;min-width:0;position:relative}
.bar{background:var(--subbar);border-bottom:1px solid var(--brow);position:relative;display:flex;z-index:5}
.bar .in{display:flex;align-items:center;gap:12px;width:100%;padding:0 16px;min-width:0}
.bar .ttl{font-weight:600;font-size:16px;color:var(--subbar-date);white-space:nowrap}
.bar .meta{font-size:13px;color:var(--subbar-2);padding-left:12px;border-left:1px solid var(--chip-warm-edge);display:flex;align-items:center;white-space:nowrap;min-width:0;overflow:hidden}
.bar .sp{flex:1}
.bar .bk{display:inline-flex;align-items:center;gap:2px;height:32px;padding:0 8px 0 6px;margin-left:-10px;border-radius:8px;color:var(--subbar-2);font-weight:500;font-size:16px;white-space:nowrap}
.bar .bk:hover{background:rgba(75,105,71,.12);color:var(--subbar-date)}
.bar .sepc{width:14px;height:14px;opacity:.6;color:var(--subbar-2)}
.sep{display:inline-block;width:1px;height:.95em;background:rgb(var(--c-muted) / .42);margin:0 8px;vertical-align:-.14em;flex:none}
.bar .sep{background:var(--chip-warm-edge);opacity:.7}
/* kit Button */
.btn{height:44px;border-radius:8px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:500;font-size:16px;white-space:nowrap;transition:transform .16s var(--ease),box-shadow .2s var(--ease),opacity .2s var(--ease);position:relative;flex:none}
.btn:active{transform:scale(.97);box-shadow:var(--press)}
.btn.pri{background:var(--sage-dark);color:var(--hdr-text)}.btn.pri:hover{box-shadow:inset 0 0 0 100px var(--on-dark-hover)}
.btn.sec{background:var(--sage);color:var(--ink)}.btn.sec:hover{box-shadow:var(--hover)}
.btn.cancel{background:transparent;border:1px solid var(--ink2);color:var(--ink)}.btn.cancel:hover{box-shadow:var(--hover)}
.btn.tan{background:var(--chip-warm);border:1px solid var(--chip-warm-edge);color:var(--ink)}.btn.tan:hover{box-shadow:var(--hover)}
.btn.wide{width:100%}
.btn.sm{height:36px;padding:0 12px;font-size:15px}
.btn.sm::after{content:"";position:absolute;inset:-4px 0}
.bar .btn{height:36px;padding:0 14px;font-size:15px}
.btn.icon{width:44px;padding:0;background:transparent;color:var(--ink2)}.btn.icon:hover{box-shadow:var(--hover)}
.bar .btn.icon{width:36px;color:var(--subbar-date)}
.btn.off,.btn[aria-disabled=true]{opacity:.45;filter:grayscale(1);cursor:default}.btn.off:active,.btn.off:hover{transform:none;box-shadow:none}
.scroll{overflow:auto;min-height:0;overscroll-behavior:contain}
.card{background:var(--card);border-radius:12px;border:1px solid var(--bcard);box-shadow:var(--shadow-card)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
/* kit Chip (radius 8, never pills) */
.chip{height:36px;border-radius:8px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;color:var(--ink);background:var(--chip);border:1px solid transparent;font-weight:600;white-space:nowrap;position:relative}
.chip::after{content:"";position:absolute;inset:-4px 0}
.chip:hover{box-shadow:var(--hover)}
.chip.on{background:var(--chip-on);border-color:var(--sage-text);font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{font-size:12px;font-weight:600;color:var(--ink);background:var(--chip);border-radius:6px;padding:0 7px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;line-height:20px}
.tag.ahead{background:var(--sage-light);color:var(--sage-text)}
.tag.guess{background:var(--amber-light);color:var(--amber-text)}
.tape{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:#2F4A66;background:var(--tape);border:1px solid var(--tape-edge);border-radius:2px;padding:0 6px;line-height:18px;transform:rotate(-1.5deg)}
.cl{font-size:12px;font-weight:600;color:#6B5B40;border:1px dashed #B89F72;border-radius:6px;padding:1px 8px;line-height:17px;white-space:nowrap;background:#FBF6EC}

/* ---------- Plan page: the week (left) ---------- */
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:20px;padding:16px 20px 0 16px;min-height:0;height:100%}
.wk{min-height:0;display:flex;flex-direction:column}
.wkhead{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex:none}
.wkchip{display:flex;flex-direction:column;justify-content:center;height:44px;padding:0 14px;border-radius:8px;background:var(--sage-light);border:1px solid var(--sage-text);color:var(--sage-dark);line-height:1.15}
.wkchip b{font-size:15px}.wkchip small{font-size:12px;color:var(--ink2)}
.days{flex:1;min-height:0;padding:0 0 24px}
.days .card{padding:0;overflow:hidden}
.drow{display:grid;grid-template-columns:64px minmax(0,1fr);gap:4px;padding:12px 12px 12px 14px;border-bottom:1px solid var(--brow)}
.drow:last-child{border-bottom:0}
.dlab{line-height:1.1;padding-top:2px}
.dlab .dw{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--ink2)}
.dlab .dn{font-size:22px;font-weight:700;display:block;margin:2px 0}
.dlab .dm{font-size:12px;color:var(--ink2)}
.dlab.today .dw,.dlab.today .dn{color:var(--sage-text)}
.dmeals{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
/* a meal card = a small index card (Plan v3, C-058 look) */
.meal{position:relative;width:218px;border-radius:4px;padding:6px 12px 6px;text-align:left;display:flex;flex-direction:column;background:var(--icard);box-shadow:0 1px 2px rgba(40,26,8,.14),0 0 0 1px rgba(60,40,10,.13);transition:box-shadow .2s var(--ease),transform .2s var(--ease)}
.meal:hover{box-shadow:0 4px 10px rgba(40,26,8,.16),0 0 0 1px rgba(60,40,10,.16)}
.meal.sel{box-shadow:0 0 0 2px var(--sage-text),0 6px 14px rgba(40,26,8,.16)}
.meal .mh{display:flex;align-items:center;gap:6px;height:24px}
.meal .mt{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2)}
.meal .mx{margin-left:auto;margin-right:-8px;width:32px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--ink2)}
.meal .mx:hover{box-shadow:var(--hover)}
.meal .mn{font-weight:600;font-size:15px;line-height:20px;padding:2px 0 5px;border-bottom:2px solid var(--ired);margin:0 -12px;padding-left:12px;padding-right:12px}
.meal .fx{display:flex;align-items:center;gap:4px;white-space:nowrap;font-size:13px;color:var(--ink2);min-height:30px;padding-top:2px}
.meal .fx svg{width:13px;height:13px}
.meal .fx .sep{margin:0 6px}
.meal .made{font-size:12px;color:var(--sage-text);font-weight:600;display:flex;align-items:center;gap:4px;margin-top:-2px;padding-bottom:2px;white-space:nowrap;min-width:0}.meal .made span{overflow:hidden;text-overflow:ellipsis}
.meal .made svg{width:13px;height:13px}
.sdb{flex:none;margin-left:auto;margin-right:-6px;height:22px;min-width:30px;padding:0 4px;display:inline-flex;align-items:center;justify-content:center;gap:2px;border-radius:4px;color:var(--sage-text);background:color-mix(in srgb,var(--sage-light) 80%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--sage-line) 60%,transparent);position:relative}
.sdb::after{content:"";position:absolute;inset:-8px -6px}
.sdb svg{width:16px;height:16px;stroke-width:1.8}
.sdb .sdn{font-size:12px;font-weight:600;line-height:1}
.sdb.none{color:var(--muted);background:transparent;box-shadow:none;opacity:.42}
.sdb:hover{background:var(--sage-light);opacity:1}
.addm{width:150px;height:44px;border-radius:4px;border:1.5px dashed var(--folder-line);color:var(--ink2);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:15px;font-weight:500}
.addm:hover{box-shadow:var(--hover)}

/* ---------- the meal with parts (Plan's side pane / iPad side sheet / phone sheet) ---------- */
/* r4 (fit 2, visual 1-2): no ruled paper behind the list; the card ends with its content (it scrolls only when full) */
.pane{display:flex;flex-direction:column;min-height:0;max-height:calc(100% - 16px);align-self:start;background:var(--icard);border-radius:6px;box-shadow:var(--ishadow);margin-bottom:16px;position:relative}
.pane.claude{height:auto}
.pane.in{animation:paneIn .22s var(--ease)}
@keyframes paneIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
.pane .ph{padding:12px 8px 10px 20px;border-bottom:1.5px solid var(--ired);flex:none}
.pane .ph .r1{display:flex;align-items:center;gap:4px;min-height:32px}
.pane .ph .r1 .eyebrow{flex:1;min-width:0}
.pane .ph h2{margin:0;font-size:22px;line-height:28px;font-weight:700;padding-right:12px}
.pane .ph .facts{font-size:14px;color:var(--ink2);margin-top:4px;display:flex;flex-wrap:wrap;align-items:center;padding-right:12px}
.pane .pb{flex:0 1 auto;min-height:0;overflow:auto;padding:2px 0 8px}
.pane .pf{flex:none;border-top:1px solid var(--brow);padding:10px 16px 12px 20px;display:flex;align-items:center;gap:12px;background:var(--icard);position:relative;border-radius:0 0 6px 6px}
.pane .pf p{margin:0;font-size:14px;color:var(--ink2);flex:1;line-height:1.45}
/* the toast takes a row at the top of the foot: it covers no dish, no add button and no foot words */
.pane .pf{flex-wrap:wrap;row-gap:10px}
.pane .ptoast{order:-1;flex-basis:100%;display:flex;margin:-2px -8px 0 -12px}
.pane .ptoast .toast{flex:1;max-width:none;justify-content:space-between}
.lnk{color:var(--sage-text);font-weight:600;font-size:14px;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--sage-text) 40%,transparent);text-underline-offset:3px;border-radius:4px;min-height:32px;padding:0 2px;white-space:nowrap;position:relative}
.lnk::after{content:"";position:absolute;inset:-6px -4px}
.lnk:hover{text-decoration-color:var(--sage-text)}
.lnk[aria-disabled=true]{color:var(--muted);text-decoration:none;cursor:default}
.lnk.sm{font-size:13px;letter-spacing:0;text-transform:none;min-height:24px}
.sg{white-space:nowrap}.sg.wr>.sep{display:none}
.sg .plc{vertical-align:-3px}
.plc{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
svg.i.pi{width:16px;height:16px;color:inherit;flex:none}
.idn{font-weight:500;color:var(--muted);letter-spacing:.02em;white-space:nowrap}
.rolehd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 2px 20px;height:40px}
.rolehd .rn{font-weight:500;letter-spacing:0;margin-left:6px;padding-left:6px;border-left:1px solid rgb(var(--c-muted) / .42)}
.part{display:grid;grid-template-columns:28px minmax(0,1fr) 44px;column-gap:10px;padding:8px 4px 8px 20px;align-items:start;background:var(--icard);position:relative;transition:background .2s var(--ease)}
.part+.part{border-top:1px solid rgba(80,120,170,.22)}
.part .pic{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--ink2);background:var(--panel-alt);margin-top:2px}
.part .pic svg{width:16px;height:16px}
.part .pic.idea{background:var(--amber-light);color:var(--amber-text)}
.part .pic.buy{background:var(--chip)}
.part .pic.have{background:var(--sage-light);color:var(--sage-text)}
.part .pn{font-weight:600;font-size:16px;line-height:22px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.part .pn button.nm{text-align:left;font-weight:600;border-radius:4px}
.part .pn button.nm:hover{text-decoration:underline;text-decoration-color:var(--folder-line);text-underline-offset:3px}
.part .pm{font-size:13px;color:var(--ink2);line-height:20px;display:flex;flex-wrap:wrap;align-items:center}
.part .pm .sep{margin:0 6px}
.part .keep{font-size:13px;line-height:20px;color:var(--sage-text);font-weight:600;display:flex;align-items:center;flex-wrap:wrap;gap:0 5px;margin-top:2px;text-align:left}
.part .keep svg{width:14px;height:14px}
.part .keep .kw{font-weight:400;color:var(--ink2);display:inline-flex;align-items:center}
.part .keep.warn{color:var(--amber-text)}
.part button.keep.go{border-radius:6px;min-height:28px;padding:0 6px 0 4px;margin-left:-4px;position:relative}
.part button.keep.go:hover{background:var(--sage-light)}
.part button.keep.go svg.ch{width:14px;height:14px;margin-left:-1px}
.part .pm .fw{color:var(--ink);font-weight:600}
.part .pm.why{margin-top:4px;color:var(--muted)}
.part .pacts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center}
.part .px{width:44px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--ink2)}
.part .px:hover{box-shadow:var(--hover)}
.part.off{opacity:.55}
.part.new{animation:partIn .3s var(--ease)}
@keyframes partIn{from{background:var(--sage-light)}to{background:var(--icard)}}
.addpart{display:flex;align-items:center;gap:8px;margin:10px 16px 6px 20px;height:40px;padding:0 12px;border-radius:6px;border:1.5px dashed var(--folder-line);color:var(--ink2);font-weight:500;font-size:15px;width:calc(100% - 36px);background:var(--icard)}
.addpart:hover{box-shadow:var(--hover);color:var(--ink)}
.addpart.off{opacity:.45;filter:grayscale(1);cursor:default}
.banner{display:flex;align-items:flex-start;gap:10px;margin:10px 16px 2px 20px;padding:10px 12px;border-radius:8px;background:var(--alert);border:1px solid var(--soon-edge,#E5D3AE);font-size:14px;line-height:1.4;color:var(--ink)}
.banner svg{margin-top:1px;color:var(--amber-text)}
.banner .bt{flex:1}
.banner b{font-weight:600}
.banner.calm{background:var(--sage-light);border-color:var(--sage-line)}.banner.calm svg{color:var(--sage-text)}
/* Way C: the inline add row */
.inl{margin:6px 16px 6px 20px;border:1px solid var(--folder-line);border-radius:8px;background:var(--card);box-shadow:var(--shadow-pop);overflow:hidden;animation:growIn .2s var(--ease)}
@keyframes growIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.inl .srch{margin:8px}
.inl .grp{padding:0 8px 6px}
.inl .gl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 8px 2px}
.inl .more{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--brow);padding:6px 8px 8px 16px;font-size:13px;color:var(--ink2)}

/* search field (kit B2) */
.srch{display:flex;align-items:center;gap:8px;height:44px;border-radius:8px;border:1px solid var(--folder-line);background:#fff;padding:0 8px 0 12px;color:var(--ink2)}
.srch:focus-within{border-color:var(--sage-text);box-shadow:0 0 0 1px var(--sage-text)}
.srch input{border:0;outline:0;background:transparent;flex:1;min-width:0;font-size:16px;color:var(--ink)}
.srch input::placeholder{color:var(--muted)}
.srch .clr{width:32px;height:32px;border-radius:6px;display:grid;place-items:center}
.srch .clr:hover{box-shadow:var(--hover)}

/* result rows (Add a Side) */
.rrow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;column-gap:10px;align-items:center;min-height:56px;padding:6px 8px;border-radius:8px}
.rrow:hover{background:var(--row-hover)}
.rrow .pic{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--ink2);background:var(--panel-alt)}
.rrow .pic svg{width:16px;height:16px}
.rrow .pic.idea{background:var(--amber-light);color:var(--amber-text)}
.rrow .pic.have{background:var(--sage-light);color:var(--sage-text)}
.rrow .pic.buy{background:var(--chip)}
.rrow b{font-weight:600;font-size:15px;line-height:20px;display:block}
.rrow small{display:flex;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--ink2);line-height:18px}
.rrow small .sep{margin:0 6px}
.rrow small .g{color:var(--sage-text);font-weight:600}
.rrow small .w{color:var(--amber-text);font-weight:600}
.rrow.added b{color:var(--sage-text)}
.secl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:14px 8px 4px;display:flex;align-items:center;justify-content:space-between}
.secl small{font-size:12px;letter-spacing:0;text-transform:none;font-weight:500}
.emptyb{text-align:center;padding:28px 16px 20px;color:var(--ink2);font-size:15px}
.emptyb b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.emptyb .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}

/* folder tabs (kit FolderDrawer, small) */
.ftabs{display:flex;align-items:flex-end;gap:4px;height:42px;padding:0 20px;position:relative;z-index:2;margin-top:6px}
.ftab{height:36px;padding:0 14px;border-radius:10px 10px 0 0;background:var(--sheet2);color:var(--folder-ink);font-weight:600;font-size:15px;border:1px solid var(--folder-line);border-bottom:0;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.ftab small{font-weight:500;font-size:13px;color:var(--ink2)}
.ftab:hover{box-shadow:var(--hover)}
.ftab.on{background:var(--card);height:42px;margin-bottom:-1px;box-shadow:none}
.fbody{border-top:1px solid var(--folder-line);background:var(--card)}

/* kit Popover */
.menu{position:fixed;background:var(--card);border:1px solid var(--bcard);border-radius:12px;box-shadow:var(--shadow-pop);z-index:50;min-width:260px;max-width:calc(100vw - 16px)}
.menu{animation:pop .2s var(--ease)}
.menu .mi{padding:8px;overflow:auto;max-height:70vh}
.menu .mhd{padding:6px 12px 8px;border-bottom:1px solid var(--brow);margin:0 -8px 6px;padding-left:20px}
.menu .mhd b{display:block;font-size:15px}.menu .mhd small{font-size:13px;color:var(--ink2)}
.menu button.it{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;border-radius:8px;padding:0 12px;font-size:15px;text-align:left}
.menu button.it:hover{background:var(--row-hover)}
.menu button.it svg{color:var(--ink2)}
.menu button.it svg.ni{width:20px;height:20px;filter:grayscale(1);opacity:.8}
.menu button.it .ml{display:flex;flex-direction:column;line-height:1.3;padding:6px 0}
.menu button.it .ml small{font-size:13px;color:var(--muted)}
.menu button.it.red{color:var(--urgent-text)}.menu button.it.red svg{color:var(--urgent-text)}
.menu .mnote{display:flex;gap:8px;align-items:flex-start;margin:4px 0 2px;padding:8px 12px;font-size:13px;color:var(--ink2);background:var(--alert);border-radius:8px}
.menu .mnote svg{margin-top:1px;color:var(--amber-text)}
.menu hr{border:0;border-top:1px solid var(--brow);margin:4px 8px}
.menu .stp{display:flex;align-items:center;gap:12px;padding:6px 12px 10px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--folder-line);border-radius:8px;height:44px;background:#fff}
.stepper button{width:44px;height:42px;display:grid;place-items:center;color:var(--ink2)}
.stepper button:hover{box-shadow:var(--hover)}
.stepper b{min-width:36px;text-align:center;font-size:17px}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
.scrim{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:45;animation:fade .2s var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:560px;max-width:calc(100vw - 32px);height:min(680px,86vh);background:var(--card);border-radius:16px;box-shadow:var(--shadow-float);animation:rise .2s var(--ease);display:flex;flex-direction:column;overflow:hidden}
.sheet.dlg{height:auto;width:480px}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.sheet .hd{display:flex;align-items:flex-start;gap:12px;padding:18px 12px 6px 24px;flex:none}
.sheet .hd h2{margin:0;font-size:20px;font-weight:700;line-height:1.3}
.sheet .hd p{margin:2px 0 0;font-size:14px;color:var(--ink2);display:flex;align-items:center;flex-wrap:wrap}
.sheet .x{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;color:var(--ink2);margin-left:auto;flex:none;margin-top:-6px}
.sheet .x:hover{box-shadow:var(--hover)}
.sheet .tools{padding:6px 24px 10px;display:flex;flex-direction:column;gap:10px;flex:none}
.sheet .tools .lab{font-size:13px;color:var(--ink2);font-weight:500;margin-right:4px}
.sheet .bd{padding:4px 16px 16px;flex:1;overflow:auto;min-height:0}
.sheet .ft{display:flex;align-items:center;gap:8px;padding:12px 24px;border-top:1px solid var(--brow);flex:none}
.sheet .ft .sp{flex:1}
.sheet .ft p{margin:0;font-size:13px;color:var(--ink2)}
.sheet .ft .lab{font-size:13px;color:var(--ink2);font-weight:500;margin-right:2px}
.sheet .ft .addn{font-size:14px;color:var(--sage-text);font-weight:600;margin-right:4px}
.sheet .tools .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -24px;padding:0 24px 2px}
.chip small{font-weight:500;font-size:12px;color:var(--ink2)}
.dlg .bd{padding:4px 24px 8px;font-size:15px;color:var(--ink2)}
.dlg .bd p{margin:0 0 10px}
.dlg .acts{display:flex;flex-direction:column;gap:8px;padding:8px 24px 20px}
/* kit Toast */
.toasts{position:fixed;right:24px;bottom:24px;display:flex;flex-direction:column-reverse;gap:8px;align-items:flex-end;z-index:60;pointer-events:none;max-width:440px}
.toast{background:var(--ink);color:var(--page);border-radius:12px;padding:6px 6px 6px 16px;min-height:48px;font-size:15px;display:flex;gap:8px;align-items:center;pointer-events:auto;animation:rise .2s var(--ease);box-shadow:var(--shadow-pop)}
.toast>span{padding:6px 0}
.toast button{color:var(--page);font-weight:500;font-size:16px;text-decoration:underline;text-underline-offset:3px;border-radius:8px;padding:0 12px;height:44px;flex:none}
.skel{display:block;height:12px;border-radius:4px;background:linear-gradient(90deg,var(--track) 0%,var(--panel) 50%,var(--track) 100%);background-size:200% 100%;animation:shim 1.4s infinite linear}
@keyframes shim{to{background-position:-200% 0}}

/* other pages (just enough to show the meal-parts bits) */
.pg{padding:16px 20px 24px 16px;display:grid;grid-template-columns:minmax(0,720px) minmax(0,340px);gap:20px;align-content:start}
.pg.one{grid-template-columns:minmax(0,760px)}
.lcard{background:var(--card);border-radius:12px;border:1px solid var(--bcard);box-shadow:var(--shadow-card);overflow:hidden}
.lcard .lh{display:flex;align-items:baseline;flex-wrap:wrap;column-gap:10px;row-gap:2px;padding:14px 20px 10px;border-bottom:1.5px solid var(--ired);background:var(--icard)}
.lcard .lh h3{margin:0;font-size:18px}.lcard .lh small{color:var(--ink2);font-size:13px}
.lrow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;column-gap:12px;align-items:center;padding:10px 12px 10px 20px;border-top:1px solid var(--brow);background:var(--icard)}
.lrow:first-child{border-top:0}
.lrow b{font-weight:600;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lrow small{font-size:13px;color:var(--ink2);display:flex;flex-wrap:wrap;align-items:center;line-height:20px}
.lrow small .sep{margin:0 6px}
.lrow .for{color:var(--sage-text);font-weight:600}
.lrow.hl{background:color-mix(in srgb,var(--sage-light) 55%,var(--icard))}
.lrow.dim b,.lrow.dim small{opacity:.55}
.src{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-top:2px;line-height:1.4;flex-wrap:wrap}
.src .sep{margin:0 6px}
.src .more{font-size:13px;color:var(--ink);font-weight:600;background:var(--chip);border-radius:8px;padding:0 8px;height:24px;line-height:24px;position:relative}
.src .more::after{content:"";position:absolute;inset:-10px -2px}
.cb{width:24px;height:24px;border-radius:5px;border:1.5px solid var(--muted);background:#fff;display:grid;place-items:center}
.ghd{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:12px 20px 6px;background:var(--panel)}
.side .card{padding:14px 18px}
.side h4{margin:0 0 8px;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.urow{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--brow);font-size:14px}
.urow:first-of-type{border-top:0}
.urow b{display:block;font-size:15px}.urow small{color:var(--ink2);display:flex;align-items:center;flex-wrap:wrap}
.urow .when{color:var(--amber-text);font-weight:600;white-space:nowrap;font-size:13px}
.ex{font-size:13px;color:var(--ink2);padding:10px 4px}

/* ---------- r4: menus, sheet, recipe pop-up ---------- */
.menu button.it.off{opacity:.45;filter:grayscale(1);cursor:default}.menu button.it.off:hover{background:none}
.menu .stp.fewer{padding:4px 12px 6px;flex-wrap:wrap;row-gap:6px}.menu .stp.fewer .fl{font-size:14px;color:var(--ink2);flex-basis:100%}
.menu .stp.fewer .chips{flex-wrap:nowrap}.menu .stp.fewer .fl2{font-size:14px;color:var(--ink2)}
.menu .stp.fewer .chip{min-width:44px}
.sheet .tools .chips.role{flex-wrap:nowrap}
.sheet .tools .chips.role .lab{font-size:13px;color:var(--ink2);font-weight:500;margin-right:2px;white-space:nowrap}
.secl .lnk{font-weight:600}
.sheet.rcp{width:720px;height:auto;max-height:86vh}
.rcp .hd .eyebrow{display:flex;align-items:center;margin-bottom:2px}
.rcpb{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:24px;padding:8px 24px 16px!important;color:var(--ink)!important}
.rcpb h3{margin:6px 0 8px}
.rcpb ul,.rcpb ol{margin:0;padding-left:20px;font-size:15px;line-height:1.5}.rcpb li{margin-bottom:6px}
.sheet .ft p{flex:1}

/* ---------- r4: Cook v3 Get ready (full screen: tan bar, one big card, Start Cooking under it) ---------- */
.app.cookapp{grid-template-columns:1fr;grid-template-rows:1fr}
.cookapp .body{grid-template-rows:46px 1fr}
.cookpg{padding:16px 28px 20px;display:flex;flex-direction:column;align-items:center;gap:14px}
.grcard{width:100%;max-width:1224px;background:var(--icard);border:1px solid var(--bcard);border-radius:8px;box-shadow:var(--shadow-card)}
.grh{padding:16px 28px 12px;border-bottom:1.5px solid var(--ired)}
.grh h1{margin:0;font-size:36px;line-height:1.15;font-weight:700}
.grh small{font-size:14px;color:var(--ink2);display:flex;flex-wrap:wrap;margin-top:4px}
.grb{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:36px;padding:16px 28px 22px}
.grlh{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}.grlh h3{margin:0;font-size:18px}.grlh small{font-size:13px;color:var(--ink2)}
.dish{padding:8px 0 10px;border-bottom:1px solid rgba(80,120,170,.3)}
.dish .dh{display:flex;align-items:center;gap:10px;min-height:44px;flex-wrap:wrap}
.dish .dh>b{font-size:18px;font-weight:600}
.dish .sq{width:14px;height:14px;border-radius:3px;background:var(--chip-warm);border:1px solid var(--chip-warm-edge);flex:none}
.dish .sp{flex:1}
.dish .dt{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}.dish .dt b{font-size:14px;color:var(--amber-text)}.dish .dt small{font-size:12px;color:var(--ink2)}
.dish .dsub{font-size:14px;color:var(--ink2);display:flex;align-items:center;flex-wrap:wrap;gap:0 4px;margin:-4px 0 4px 24px}
.dish .dsub.ok{color:var(--sage-text);font-weight:600}.dish .dsub.ok .plc,.dish .dsub.ok .idn{font-weight:500}
.dish .dsub.warn{color:var(--amber-text);font-weight:600}
.dish.off .dh>b,.dish.off .dsub{opacity:.6}
.ing{display:grid;grid-template-columns:24px 88px 1fr;gap:12px;align-items:center;min-height:34px;padding-left:24px;border-top:1px solid var(--brow);font-size:16px}
.ing b{font-weight:600}
.sbx{background:var(--sage-light);border:1px solid var(--sage-line);border-radius:8px;padding:14px 16px}
.sbx h3{margin:0 0 6px;font-size:22px}.sbx h3 span{color:var(--sage-text)}.sbx p{margin:0 0 8px;font-size:14px;color:var(--ink2)}.sbx small{font-size:14px;color:var(--ink2);display:flex;flex-wrap:wrap}
.abx{margin-top:14px;background:var(--amber-light);border:1px solid #E5D3AE;border-radius:8px;padding:12px 14px;font-size:15px;line-height:1.55}
.abx p{margin:0}.abx .k{font-size:13px;font-weight:600;color:var(--ink2)}
.btn.big{height:56px;min-width:320px;font-size:18px;font-weight:600}

/* ---------- r4: Groceries v3 / Leftovers v1 / Kitchen v3 / Prep v1 parts ---------- */
.ftabs.pgt{padding:0 0 0 28px;margin:4px 0 0}
.fcard{position:relative}
.fcard .sh{position:absolute;inset:0;border-radius:12px;border:1px solid var(--folder-line);pointer-events:none}
.fcard .sh2{transform:translate(10px,10px);background:var(--sheet2)}.fcard .sh1{transform:translate(5px,5px);background:var(--sheet1)}
.lcard.flat{position:relative;border-color:var(--folder-line);background:var(--card)}
.lhead{display:flex;align-items:center;gap:12px;padding:10px 16px 10px 20px;border-bottom:1px solid var(--brow);font-size:15px;color:var(--ink2);min-height:64px;line-height:1.3}
.lhead b{color:var(--ink);font-weight:600}
.lhead .sum{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center}
.lhead .sum small{flex-basis:100%;display:flex;align-items:flex-start;gap:6px;font-size:13px;color:var(--muted);margin-top:2px;line-height:20px}
.lhead .sum small svg{width:16px;height:16px;flex:none;margin-top:2px}
.lhead.bare{border:0;padding-left:4px;min-height:52px}
.find{display:flex;align-items:center;gap:8px;height:44px;width:220px;border:1px solid var(--folder-line);border-radius:8px;background:var(--panel);padding:0 12px;color:var(--muted)}
.find input{border:0;outline:0;background:transparent;font-size:15px;min-width:0;flex:1}

.twrow{display:flex;align-items:center;gap:8px;width:100%;padding:12px 2px;border-top:1px solid var(--brow);text-align:left;font-size:15px}
.twrow>span{flex:1;min-width:0}.twrow b{display:block;font-weight:500;color:var(--ink)}.twrow small{color:var(--ink2);font-size:13px}

/* the pinned add strip has the list's own rule on top, so a row passing under it reads as scrolled, not cut */

/* menus: the width set is the width drawn, so the 12 px insets are equal (visual 3) */
.menu{box-sizing:border-box}
.menu button.it>small{white-space:nowrap}
/* Plan v3's ruled index card all the way down: every line of the card sits on a 28 px rule (visual 4, fit 6) */
.rcp2 .rscroll{background:repeating-linear-gradient(to bottom,transparent 0 20.8px,var(--iblue) 20.8px 22px,transparent 22px 28px) 0 var(--rl,124px)/100% calc(100% - var(--rl,124px)) no-repeat,#FFFDF7;background-attachment:local}
.rcp2 .rfacts{padding:0;line-height:28px;min-height:28px;row-gap:0}
.rcp2 .rfew{margin:0;height:28px}
.rcp2 .rhist{margin:0;padding:0;border:0;line-height:28px}
.rcp2 .marks{padding:0;min-height:28px;align-items:center;gap:6px}
.rcp2 .mk{line-height:16px}
.rcp2 .rsec{padding:28px 0 0;margin:0;border:0}
.rcp2 .rsec h3{margin:0;height:28px;line-height:28px}
.rcp2 .srv button{height:24px}.rcp2 .srv span{line-height:24px}
.rcp2 .yne{height:24px}
.rcp2 .yn{padding:0 12px;line-height:28px;min-height:28px;box-sizing:border-box}
.rcp2 .rgr{margin:28px 0 0;padding:0 14px;line-height:28px}
.rcp2 .onhand{box-sizing:border-box;min-height:28px;padding:0 10px;margin:0;line-height:26px;row-gap:0}
.rcp2 .ing{padding:0;border:0;min-height:28px;line-height:28px;align-items:center}
.rcp2 .ing .short{line-height:18px}
.rcp2 .stphd{margin:0;line-height:28px}
.rcp2 .stp li{padding:0 0 0 36px;line-height:28px}
.rcp2 .stp li::before{top:2px}
.rcp2 .rsec p{margin:0;line-height:28px}
.rcp2 .gnote{display:none}
/* "See the Steps ›" starts flush when it wraps (visual 6, fit 8d) */
.rrow small .lnk.go.sm.steps.inl{margin:0;padding:0}
/* Add a Side: a recipe's name opens its card (friction 6), drawn like the meal's dish names */
.rrow .rnm{font:inherit;color:inherit;text-align:left;border-radius:4px;padding:0}
.rrow .rnm:hover{text-decoration:underline;text-decoration-color:var(--folder-line);text-underline-offset:3px}
/* the meal pane's way back after a batch link (friction 3) */
.pane .pbk{display:inline-flex;align-items:center;gap:4px;min-height:28px;margin:-4px 0 4px -4px;padding:0 6px 0 2px;border-radius:6px;font-size:14px;font-weight:600;color:var(--sage-text)}
.pane .pbk:hover{box-shadow:var(--hover)}
/* phone Cook: name and buttons on one line, the times on one line under them (fit 8b) */
@media (max-width:640px){
  .dish .dh.v3{flex-wrap:wrap;row-gap:2px}
  .dish .dh.v3 .sq{align-self:center;margin-top:0}
  .dish .dh.v3>.dtp{order:9;flex-basis:100%;padding-left:22px;margin:-4px 0 4px;align-items:baseline}
  .dish .dh.v3>.dtp .sep{margin:0 2px}
}

/* r22 (panel 7 visual 1): "It's a" sits on the chips' line, so a part menu fits under its ⋯ on a 1280x800 computer */
.menu .stp.fewer.role{flex-wrap:nowrap;column-gap:12px;padding:4px 12px 6px}
.menu .stp.fewer.role .fl{flex-basis:auto;white-space:nowrap}

/* r22b (panel 7 visual 2-3): the computer pane keeps one height (Q25): it fills the column; the add strip follows the
   dishes and the foot sits at the bottom, as on the iPad side sheet */
@media (min-width:1101px){.wrap>.pane{height:calc(100% - 16px)}.wrap>.pane>.pf{margin-top:auto}}
/* "More below" keeps its strip's room while the list scrolls at all; at the end it is blank room, so nothing jumps */
.pane.scr .addwrap .mbelow{display:flex}
.pane.scr:not(.ovf) .addwrap .mbelow{visibility:hidden}
/* the next row shows under a fade, so the cut list never looks empty (no more hole above "More below") */
.pane>.addwrap{position:relative}
.pane.ovf>.addwrap::before{content:"";position:absolute;left:0;right:14px;top:-28px;height:28px;background:linear-gradient(to bottom,rgb(255 255 255 / 0),var(--icard));pointer-events:none}

/* r22c (panel 7 visual 5): in Add a Side "See the Steps ›" gets its own line, as on the phone and in the pane's Best match */
.rrow small .lnk.go.sm.steps.inl{display:flex;width:fit-content;margin:2px 0 0;padding:0;min-height:24px}
/* r22c (panel 7 visual 6): the keep fact is the same grey as the facts beside it */
.rrow small .g{color:var(--ink2);font-weight:400}
/* r22c (panel 7 visual 7): iPad upright: the message sits above the side sheet's foot, never over its links */
@media (max-width:1100px) and (min-width:641px){
  .pane .pf .ptoast{position:static;min-height:0;margin:0 -4px 8px -8px}
}
/* r22c (panel 7 visual 8): the line between dishes is inset the same on both sides (the scroll gutter on the right) */
.part+.part{border-top:0;position:relative}
.part+.part::before{content:"";position:absolute;top:0;left:var(--gut,0px);right:0;border-top:1px solid rgba(80,120,170,.22);pointer-events:none}
/* r22c (panel 7 visual 8): the list's last row keeps a little room above the add strip's line */
.pane .pb{padding-bottom:8px}

/* r23 (panel 7 visual 4): Plan v3's menu dim (body.mdim, .38): what the menu does not belong to steps back, so the head
   line and rows in the menu's 12 px gutters read as behind it, not colliding with it */
.pane.mdim .pb>.part:not(.menuon),.pane.mdim .pb>.rolehd,.pane.mdim .pbn,.pane.mdim>.addwrap,.pane.mdim>.pf,.pane.mdim.mpart>.ph{opacity:.38;transition:opacity .2s var(--ease)}
.pane.mdim.mmeal>.ph{border-bottom-color:color-mix(in srgb,var(--ired) 38%,transparent)}

/* r23b: the fade over the cut grows to cover a role head that would sit alone at the cut (set from syncPb as --fade) */
.pane.ovf>.addwrap::before{top:calc(-1 * var(--fade,28px));height:var(--fade,28px)}

function mealCard(m){const p0=m.parts[0],n=m.parts.length-1,sel=S.sel===m.id&&S.page==='plan';
  const madeN=m.parts.filter(p=>p.made).length;

  const spot=`<button class="sdb${n?'':' none'}" data-a="opensides" data-m="${m.id}" aria-label="${n?`${n} more dish${n>1?'es':''}`:'Add a side'}">${ic('sides')}${n?`<span class="sdn">${n}</span>`:''}</button>`;
  return `<div class="meal${sel?' sel':''}" role="button" tabindex="0" data-a="open" data-m="${m.id}" aria-label="${esc(m.type)}: ${esc(mealName(m))}${n?`, and ${n} more`:''}">
   <div class="mh"><span class="mt">${m.type}</span><button class="mx" data-a="mealmenu" data-m="${m.id}" aria-label="Meal menu">${ic('dots','i sm')}</button></div>
   <div class="mn">${esc(mealName(m))}</div>
   <div class="fx">${ic('clock')}${esc(m.title?'4 hr':p0.t||'')}${sep}Serves ${m.serves}${spot}</div>
   ${madeN?`<div class="made">${ic('check')}<span>${madeN} dish${madeN>1?'es':''} made ahead</span></div>`:''}</div>`}

  const rows=DAYS.map(([k,w,n])=>{const ms=Object.values(M).filter(m=>m.day===k);
    return `<div class="drow" data-day="${k}"><div class="dlab${k===TODAY?' today':''}"><span class="dw">${k===TODAY?'TODAY':w}</span><span class="dn">${n}</span><span class="dm">Nov</span></div><div class="dmeals">${ms.map(mealCard).join('')}<button class="addm" data-a="later">${ic('plus','i sm')}Add a Meal</button></div></div>`}).join('');
  /* r9 (fit 4): Plan v3's own frame: This Week + Plan Another Week, Recent Changes and All Recipes; on a phone, the day
     strip and one day at a time, All Recipes under it and the "Plan with Claude" bar (approved week: no Approve Plan) */
  const head=PH()?wkHead():'';const _h=`<div class="wkhead"><div class="wkchip"><b>This Week</b><small>Approved</small></div><button class="addw" data-a="later">${ic('plus','i sm')}Plan Another Week</button><span class="sp"></span><button class="btn kit tb2 hide-ph" data-a="later">${ic('undo','i sm')}Recent Changes${sep}2</button><button class="btn tan tb2 hide-ph" data-a="later">${NI.book}All Recipes</button></div>`;
  if(PH()){const cur=S.phDay||(S.sel&&M[S.sel]?M[S.sel].day:TODAY),d=DAYS.find(x=>x[0]===cur),ms=Object.values(M).filter(m=>m.day===cur);
    /* r17 (fit 4): Plan v3's DaySquare: "Today" on today; a past day cooked ✓; a day with an idea still to pick ◉; planned ○ */
    const strip=`<div class="dstrip" role="tablist" aria-label="Days">${DAYS.map(([k,w])=>{const ms2=Object.values(M).filter(m=>m.day===k),kk=dayIx(k)<dayIx(TODAY)?'cooked':ms2.some(m=>m.parts.some(p=>p.kind==='idea'))?'partly':ms2.length?'planned':'empty';
      return `<button class="dsb k-${kk}${k===cur?' on':''}${k===TODAY?' today':''}" role="tab" aria-selected="${k===cur}" data-a="pday" data-d="${k}"><b>${k===TODAY?'Today':w.charAt(0)+w.slice(1).toLowerCase()}</b>${kk==='cooked'?ic('check','i sm'):kk==='empty'?ic('minus','i sm'):`<span class="dot${kk==='partly'?' fill':''}"></span>`}</button>`}).join('')}</div>`;
    return `<div class="wk ph1">${head}${strip}<div class="days scroll" id="days"><div class="phday"><h3>${cur===TODAY?'Today':d[3]}, Nov ${d[2]}</h3><small>${ms.length} meal${ms.length===1?'':'s'}</small>${ms.map(mealCard).join('')}<button class="addm" data-a="later">${ic('plus','i sm')}Add a Meal</button><button class="allrec" data-a="later">${NI.book}<b>All Recipes</b><span>for the whole week</span></button></div></div>${S.sel?'':`<button class="pwc" data-a="later">${ic('chat')}<span><b>Change with Claude</b><small>Tap a meal's menu, or tell Claude.</small></span>${ic('up','i sm')}</button>`}</div>`}

function partHTML(m,p){
  const fewer=p.serves&&p.serves<m.serves;
  let meta=[];
  /* r4 (ease 5): one wording on every row: "N on the list" / "On the list" / "All in your kitchen" */
  if(p.kind==='recipe')meta=['Recipe',p.t,p.buy?`${p.buy} on the list`:'All in your kitchen'];
  if(p.kind==='guess')meta=['Our Guess',p.t,'All in your kitchen'];
  if(p.kind==='buy')meta=['To buy',p.amt,'On the list'];
  if(p.kind==='have')meta=['In your kitchen',plc(p.place),p.amt];
  if(p.kind==='idea')meta=['Idea','Pick what to make'];
  if(p.made)meta=[`<span class="idn">#${p.made.id}</span>`,plc(p.made.place),`Keeps until ${p.made.until}`];
  if(p.made&&p.made.from)meta.push(`Made ${p.made.from}`);
  if(fewer)meta.push(`<b class="fw">For ${p.serves} of ${m.serves}</b>`);
  let keep='';
  /* r4 (fit 4): a made-ahead dish = the Leftovers row (name, Made Ahead tag, #ID | place) plus Brief 7's "Already Made: Warm It Up" */
  if(p.made)keep=`<div class="keep">${ic('flame')}Already Made: Warm It Up</div>${p.made.warm?`<div class="pm">Warm it at ${esc(p.made.warm)} ${isTodayM(m)?(m.type==='Dinner'?'tonight':'today'):'on the day'}.</div>`:''}`;
  /* r8 (job 3, friction 6): on the meal's own day an unmade dish no longer offers cooking ahead: it joins today's cook */
  else if(p.keep&&p.role!=='Main'&&m.day===TODAY)keep=`<div class="keep warn">${ic('clock')}Not made ahead. It joins ${m.type==='Dinner'?'tonight':'today'}'s cook.</div>`;
  else if(p.keep&&dayIx(m.day)<=dayIx(TODAY))keep='';
  /* r4 (ease 6, friction 6): the keep line is the way in to Cook It Ahead */
  else if(p.keep&&!aheadOpen(m,p))keep=`<div class="keep notyet">${ic('clock')}<span>Can make it from ${aheadFrom(m,p)[3].slice(0,3)} <span class="nw">(keeps ${keepDays(p.keep)})</span></span></div>`;
  else if(p.keep)keep=S.offline?`<div class="keep off">${ic('clock')}Can make it up to ${keepDays(p.keep)} early</div>`:`<button class="keep go" data-a="go" data-to="cookahead">${ic('clock')}Can make it up to ${keepDays(p.keep)} early${ic('right','i sm ch')}</button>`;
  /* r20 (friction 1): a dish skipped in Cook says so on its meal (it stays on the plan) */
  if(S.notTonight&&S.notTonight[p.id]&&isTodayM(m))keep=`<div class="keep notyet">${ic('skip')}<span>Not tonight. You skipped it in Cook.</span></div>`;
  /* r16 (friction 2, job 3): after a move the fresh batch says where the made one went, one tap away */
  if(p.batch)keep+=`<button class="keep go" ${p.batch.to==='sat'?`data-a="batchsat" data-p="${p.id}"`:'data-a="go" data-to="movesaveleft"'}>${ic('tag')}Friday's potatoes: ${p.batch.to==='sat'?'at Friendsgiving':'in Leftovers'}${ic('right','i sm ch')}</button>`;
  const best=ideasFor(m.id,p.role)[0]||IDEAS_ALL[1];
  /* r4 (job 2): one tap makes it real: the best match is on the row; "Other Choices" opens the list */
  /* r10 (ease 5, visual 6, DESIGN 8.10.17): the best match is named with its reason and "See the Steps" BEFORE you add it;
     then "Use It" and "Other Choices" side by side */
  const acts=p.kind==='idea'?`<div class="bestx"><div class="bl">Best match: <b>${esc(best.n)}</b></div><div class="pm">${J(['Our Guess',best.t])}</div><div class="pm why2">${esc(best.why)}</div><button class="lnk go sm steps" data-a="ideasteps" data-n="${esc(best.n)}" data-p="${p.id}">See the Steps${ic('right','i sm')}</button></div><div class="pacts nw"><button class="btn tan sm" data-a="usebest" data-p="${p.id}"${S.offline?' aria-disabled="true"':''}>Use It</button><button class="btn kit sm" data-a="makereal" data-p="${p.id}"${S.offline?' aria-disabled="true"':''}>Other Choices</button></div>`
    :p.kind==='guess'?`<button class="lnk go sm steps" data-a="steps" data-p="${p.id}">See the Steps${ic('right','i sm')}</button>`:'';
  const who=p.by==='Sam'?`<span class="av sm m2" title="Sam added it">S</span>`:'';
  const nm=(p.kind==='recipe'||p.kind==='guess')?`<button class="nm" data-a="${p.kind==='guess'?'steps':'recipe'}" data-p="${p.id}">${esc(p.name)}</button>`:`<span>${esc(p.name)}</span>`;
  return `<div class="part${S.lastAdded===p.id||p.by==='Sam'?' new':''}" data-p="${p.id}"><span class="pic ${kindCls(p)}">${ic(kindIcon(p))}</span>
    <div><div class="pn">${nm}${p.made?'<span class="tag ahead">Made Ahead</span>':''}${who}</div><div class="pm">${J(meta)}</div>${keep}${acts}</div>
    <button class="px${S.menu&&S.menu.kind==='part'&&S.menu.pid===p.id?' on':''}" data-a="partmenu" data-p="${p.id}" aria-label="${esc(p.name)} menu" aria-expanded="${!!(S.menu&&S.menu.pid===p.id)}">${ic('dots')}</button></div>`}
function addBtn(m,role,label){
  if(S.add&&S.add.inline&&S.add.role===role&&S.add.mid===m.id)return inlineAdd(m);
  /* r10 (visual 1, ease 2, friction 1): the add button sits in a solid strip pinned to the bottom of the dish list, so it is
     never cut by the foot; on a short meal it simply follows the last dish */
  /* r17 (fit 3): right after an add, the add button itself offers another of the same kind (the message keeps one action, Undo) */
  const ag=S.toast&&S.toast.again===m.id&&!S.offline;
  return `<div class="addwrap"><button class="mbelow" data-a="pbmore" tabindex="-1" aria-hidden="true">${ic('right','i sm dn')}<span>More below</span></button>${ag?`<button class="addpart" data-a="again" data-m="${m.id}">${ic('plus','i sm')}Add Another ${S.againRole||'Side'}</button>`:`<button class="addpart${S.offline?' off':''}" data-a="add" data-role="${role}" data-m="${m.id}"${S.offline?' aria-disabled="true"':''}>${ic('plus','i sm')}${label}</button>`}</div>`}
function paneHTML(){
  if(S.loading)return `<aside class="pane" aria-busy="true"><div class="ph"><span class="skel" style="width:140px;margin:8px 0 10px"></span><span class="skel" style="width:220px;height:20px"></span><span class="skel" style="width:180px;margin-top:10px"></span></div><div class="pb">${[0,1,2,3].map(i=>`<div class="part"><span class="skel" style="width:28px;height:28px;border-radius:6px"></span><div><span class="skel" style="width:${[170,200,120,140][i]}px;height:14px;margin:4px 0 8px"></span><span class="skel" style="width:150px"></span></div><span></span></div>`).join('')}</div></aside>`;
  const m=M[S.sel];
  if(!m||S.page!=='plan')return `<aside class="pane claude"><div class="ph"><div class="r1"><span class="eyebrow">Plan with Claude</span></div><h2>Nov 24 – Nov 30</h2><div class="facts">Click a meal to see all its dishes.</div></div><div class="pb"></div></aside>`;
  const d=dayOf(m),n=m.parts.length;
  const roles=roleOrder.filter(r=>m.parts.some(p=>p.role===r));
  let body='';
  /* r16 (visual 1, fit 1): banners sit pinned above the list, so a scroll never hides them; one short line each */
  let bn='';
  if(S.offline)bn+=`<div class="banner">${ic('wifioff')}<div class="bt"><b>You're offline.</b> Changes wait until you're back.</div></div>`;
  if(S.other)bn+=`<div class="banner calm">${ic('users')}<div class="bt"><b>Sam</b> just added Garlic Bread.</div></div>`;
  const single=n===1;
  roles.forEach(r=>{const ps=m.parts.filter(p=>p.role===r);
    if(!single)body+=`<div class="rolehd"><span class="eyebrow">${roleLabel[r]}${ps.length>1?`<span class="rn">${ps.length}</span>`:''}</span></div>`;
    body+=ps.map(p=>partHTML(m,p)).join('');
  });
  /* r4 (fit, friction 5): one way in, in Plan v3's own words, under the last dish of every meal */
  const addw=addBtn(m,'Side','Add a Side, Dessert or Drink');
  const isToday=isTodayM(m);
  /* r8 (job 1): the foot counts each grocery row once (butter serves three dishes), and a made dish's share is already used */
  const its=new Set();m.parts.forEach(p=>{if(p.made)return;if(p.items)p.items.forEach(x=>its.add(x));else if(p.kind==='recipe')for(let i=0;i<(p.buy||0);i++)its.add(p.id+'.'+i);else if(p.kind==='buy')its.add(p.id)});const buyN=its.size;
  const ideas=m.parts.filter(p=>p.kind==='idea');
  /* r4 (ease 5): true for every mix; an idea still to pick is named */
  const line=(buyN?`${buyN} thing${buyN===1?'':'s'} for this meal ${buyN===1?'is':'are'} on your list.`:'Everything for this meal is in your kitchen.')+(ideas.length?` "${esc(ideas[0].name)}" still needs a pick.`:'');
  /* r7 (ease 6, fit 5, visual 4): the sentence, then "See Them in Groceries ›" on its own line; Start Cooking beside the pair.
     Offline the link stays: it only looks (ease, smaller). */
  /* r15 (sizing): the sentence on its own line, then "See Them in Groceries ›" and Start Cooking on one row */
  const foot=`<p class="pfs">${line}</p><div class="pfr">${buyN?`<button class="lnk go" data-a="go" data-to="groc" data-m="${m.id}">See Them in Groceries${ic('right','i sm')}</button>`:''}${isToday?`<button class="btn tan sm" data-a="go" data-to="cook" data-m="${m.id}"${S.offline?' aria-disabled="true"':''}>${ic('flame','i sm')}Start Cooking</button>`:''}</div>`;
  /* r4 (fit 3): the pane's title is the card's title; the facts line counts the dishes */
  const pbk=S.paneBack&&S.paneBack.mid!==m.id?`<button class="pbk" data-a="paneback">${ic('left','i sm')}${esc(S.paneBack.label)}</button>`:'';
  return `<aside class="pane in" aria-label="${esc(mealName(m))}"><div class="ph">${pbk}<div class="r1"><span class="eyebrow">${d[3]} ${m.type}<span class="sep"></span>${isToday?'Today':`Nov ${d[2]}`}</span><button class="btn icon" data-a="mealmenu" data-m="${m.id}" aria-label="Meal menu" style="height:36px;width:40px">${ic('dots')}</button><button class="btn icon" data-a="close" aria-label="Close" style="height:36px;width:40px">${ic('x')}</button></div>
    <h2>${esc(mealName(m))}</h2>
    <div class="facts">${J([`Serves ${m.serves}`,n>1?`${n} dishes`:'',m.start?`Start by ${m.start}`:''])}</div></div>
    ${bn?`<div class="pbn">${bn}</div>`:''}<div class="pb scroll" id="pb">${body}</div>${addw}<div class="pf">${toastHTML()}${foot}</div></aside>`}

/* ---------- Add a Side: the three ways ---------- */
function rowRec(r,mode){const k=keepLine(M[S.add&&S.add.mid]||M.sun,r.keep);
  return `<div class="rrow"><span class="pic">${ic('book')}</span><div><b><button class="rnm" data-a="addrecipe" data-n="${esc(r.n)}">${esc(r.n)}</button></b><small>${J([r.t,r.buy?`${r.buy} to buy`:'All in your kitchen',k])}</small></div>${addB(r.n,'recipe',mode)}</div>`}
function rowKit(k,mode){return `<div class="rrow"><span class="pic have">${ic(PLACE_IC[k.place])}</span><div><b>${esc(k.n)}</b><small>${J([plc(k.place),k.use?`<span class="${k.soon?'w':''}">${k.use}</span>`:'',k.amt])}</small></div>${addB(k.n,'have',mode)}</div>`}
/* r8 (ease 5, DESIGN 8.10.17): the steps can be seen before you add an idea */
function rowIdea(i,mode){return `<div class="rrow"><span class="pic idea">${ic('bulb')}</span><div><b>${esc(i.n)}</b><small>${J(['Our Guess',i.t])}</small><small class="why2">${i.why} <button class="lnk go sm steps inl" data-a="ideasteps" data-n="${esc(i.n)}">See the Steps${ic('right','i sm')}</button></small></div>${addB(i.n,'guess',mode)}</div>`}
function addB(n,kind,mode){const done=S.add&&S.add.added&&S.add.added.includes(n);
  return done?`<span class="btn sm" style="color:var(--sage-text)" aria-live="polite">${ic('check','i sm')}Added</span>`:`<button class="btn tan sm" data-a="pick" data-n="${esc(n)}" data-k="${kind}">${mode==='rep'?'Use It':'Add'}</button>`}
function filt(list,q){q=(q||'').trim().toLowerCase();return q?list.filter(x=>x.n.toLowerCase().includes(q)):list}
function noneBlock(q,mode){if(mode==='rep')return `<div class="emptyb"><b>Nothing called "${esc(q)}" yet</b>Use it as a plain food to buy. It goes on your grocery list.<div class="acts"><button class="btn tan sm" data-a="pick" data-n="${esc(q)}" data-k="buy">${ic('basket','i sm')}Use "${esc(q)}"</button></div></div>`;
  return `<div class="emptyb"><b>Nothing called "${esc(q)}" yet</b>Add it as a plain food to buy, or keep it as an idea and pick the dish later.<div class="acts"><button class="btn tan sm" data-a="pick" data-n="${esc(q)}" data-k="buy">${ic('basket','i sm')}Buy "${esc(q)}"</button><button class="btn tan sm" data-a="pick" data-n="${esc(q)}" data-k="idea">${ic('bulb','i sm')}Keep "${esc(q)}" as an Idea</button></div></div>`}
/* r4 (ease 7, friction 4): what you typed can always be a plain food to buy OR an idea, under its own label */
function typedRow(q,rep){if(!q)return '';const buy=`<div class="rrow"><span class="pic buy">${ic('basket')}</span><div><b>Buy "${esc(q)}"</b><small>A plain food. It goes on your grocery list.</small></div><button class="btn tan sm" data-a="pick" data-n="${esc(q)}" data-k="buy">${rep?'Use It':'Add'}</button></div>`;
  return `<div class="secl">Not What You Meant?</div>${buy}${rep?'':`<div class="rrow"><span class="pic idea">${ic('bulb')}</span><div><b>Keep "${esc(q)}" as an Idea</b><small>Pick the dish later</small></div><button class="btn tan sm" data-a="pick" data-n="${esc(q)}" data-k="idea">Add</button></div>`}`}
function tabBody(){const a=S.add,q=a.q,mode=a.rep?'rep':'add',role=a.role,many=recFor(role),main=mealName(M[a.mid]);
  if(a.tab==='rec'){const good=filt(many.filter(r=>r.good),q),rest=filt(many.filter(r=>!r.good),q);
    if(!good.length&&!rest.length)return noneBlock(q,mode);
    return (good.length&&!q?`<div class="secl">Good With ${esc(main)}</div>${good.map(r=>rowRec(r,mode)).join('')}<div class="secl">All Your ${ROLE_PL[role]}<small>${rest.length} recipes, A to Z</small></div>`:'')+(q?[...good,...rest]:[...rest].sort((x,y)=>x.n.localeCompare(y.n))).map(r=>rowRec(r,mode)).join('')+(q?typedRow(q):'')}
  if(a.tab==='kit'){const k=filt(kitFor(a.mid,role),q);if(!k.length)return noneBlock(q,mode);
    return `<div class="secl">In Your Kitchen<small>Nothing to buy</small></div>${k.map(x=>rowKit(x,mode)).join('')}${q?typedRow(q):''}`}
  const ids=a.noideas?[]:filt(ideasFor(a.mid,role),q);

function openMenu(o,btn){const r=btn.getBoundingClientRect();let w=Math.min(320,innerWidth-16);
  /* r20 (visual 3, fit 3): in the meal pane every menu (part or meal) is the pane's width less 12 px each side; it hangs
     under its ⋯ when it fits (the list scrolls up to make room), else above it, and never covers the ⋯ that opened it */
  /* (layout box, not the drawn one: the pane may still be sliding in) */
  const pnl=!PH()&&btn.closest('.pane');let x;if(pnl){const op=pnl.offsetParent,ol=(op?op.getBoundingClientRect().left:0)+pnl.offsetLeft;w=Math.round(pnl.offsetWidth-24);x=Math.round(ol+12)}
  else{x=Math.min(r.right-w,innerWidth-w-8);x=Math.max(8,x)}
  S.menu={...o,x,y:r.bottom+6,w};render();if(PH())return;const mn=$('#menu');if(!mn)return;
  /* r20: the page was redrawn, so measure the live ⋯, not the one that was clicked */
  const live=()=>o.kind==='part'?document.querySelector(`.part[data-p="${o.pid}"] .px`):pnl?document.querySelector('.pane .ph [data-a="mealmenu"]'):document.querySelector(`.meal[data-m="${o.mid}"] .mx`);
  let bt=live()||btn;
  /* r22 (panel 7 visual 4): a menu never cuts the week toolbar's buttons: it stays under them */
  const wkh=pnl&&document.querySelector('.wkhead');const h=mn.offsetHeight,topMin=wkh?Math.round(wkh.getBoundingClientRect().bottom+6):58;let below=innerHeight-8-(r.bottom+6);
  if(h<=below)return;
  const pb=bt.closest('#pb');
  if(pb){const need=h-below+4,room=pb.scrollHeight-pb.clientHeight-pb.scrollTop,pbr=pb.getBoundingClientRect();
    /* scroll only while the ⋯ stays inside the list */
    const can=Math.min(room,Math.max(0,r.top-pbr.top-4));
    if(can>=need){pb.scrollTop+=need;S.menu.y=bt.getBoundingClientRect().bottom+6;render();return}}
  bt=live()||bt;const b2=bt.getBoundingClientRect(),above=b2.top-6-topMin;below=innerHeight-8-(b2.bottom+6);
  if(h<=above){S.menu.y=b2.top-6-h;render();return}
  if(below>=above){S.menu.y=b2.bottom+6;S.menu.mh=below-2;render();return}
  S.menu.y=topMin;S.menu.mh=above-2;render()}

function syncPb(fit){const b=$('#pb'),pn=b&&b.closest('.pane');/* r16b */
  if(pn){if(fit){b.style.maxHeight='';b.style.marginBottom='';b.style.paddingBottom=''}

    {const cut=b.getBoundingClientRect().bottom;let fd=28;

      for(const e of b.querySelectorAll(':scope>.rolehd,:scope>.part')){const y=e.getBoundingClientRect().top-bt+st;if(y>=max-1){const pad=Math.ceil(y-max);if(pad>1)b.style.paddingBottom=pad+'px';break}}}

function showNew(n){n=n&&n.nodeType?n:$('.pane .part.new');const b=$('#pb');if(!n||!b){syncPb();return}b.style.maxHeight='';b.style.marginBottom='';const r=n.getBoundingClientRect(),br=b.getBoundingClientRect();

/* r4 (visual 4, friction 8, fit 7): with the meal open, the toast sits inside it, just above its foot, never over it */
const paneOpen=()=>S.page==='plan'&&!S.loading&&!!S.sel&&!!M[S.sel];
/* r20: a message goes after 10 seconds (not while the pointer is on it), as app messages do; on a computer it lies over
   the meal's foot for that time, then the foot's links are back */
let toastTimer=null;
function toastLife(){const cur=S.toast;clearTimeout(toastTimer);if(!cur)return;toastTimer=setTimeout(function tick(){if(S.toast!==cur)return;if(document.querySelector('.toast:hover')){toastTimer=setTimeout(tick,2000);return}S.toast=null;render()},10000)}
function toastHTML(g){if(!S.toast)return '';if(S.toast!==S._lastToast){S._lastToast=S.toast;setTimeout(toastLife,0)}const t=`<div class="toast"><span>${esc(S.toast.msg)}</span><span class="tacts">${S.toast.undo?'<button data-a="undo">Undo</button>':''}</span></div>`;return g?t:`<div class="ptoast" aria-live="polite">${t}</div>`}
document.addEventListener('input',e=>{if(e.target.id==='q'&&S.add){S.add.q=e.target.value;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(S.menu){S.menu=null;render()}else if(S.add){S.add=null;render()}else if(S.dlg){S.dlg=null;render()}}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('.meal')){e.preventDefault();e.target.click()}});
document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');
  if(S.mockOpen&&!(a&&(a.dataset.a==='mockmore'))&&!e.target.closest('#mockmore')){S.mockOpen=null;if(!a){render();return}}
  if(S.menu&&!e.target.closest('#menu')&&!(a&&['partmenu','mealmenu'].includes(a.dataset.a))){S.menu=null;if(!a){render();return}}
  if(!a)return;const act=a.dataset.a;
  if(a.getAttribute('aria-disabled')==='true'&&!['st','way','mockmore'].includes(act))return;
  const findP=id=>{for(const m of Object.values(M)){const p=m.parts.find(x=>x.id===id);if(p)return [m,p]}return []};
  switch(act){
    case 'st':setState(a.dataset.s);break;
    case 'way':S.way=a.dataset.w;setState(S.st.startsWith('add')||S.st==='makereal'?S.st:'add');break;
    case 'mockmore':{const r=a.getBoundingClientRect();S.mockOpen=S.mockOpen?null:{x:Math.min(r.left,innerWidth-280),y:r.bottom+6};render();break}
    case 'open':if(e.target.closest('.mx'))break;S.paneBack=null;S.sel=a.dataset.m;S.menu=null;S.add=null;S.toast=null;render();break;
    case 'close':S.sel=null;S.paneBack=null;render();break;
    case 'opensides':{e.stopPropagation();S.sel=a.dataset.m;S.menu=null;S.add=null;S.toast=null;render();requestAnimationFrame(()=>{const h=[...document.querySelectorAll('.pane .rolehd')][1];if(h)h.scrollIntoView({block:'start'})});break}
    case 'nav':{const to=a.dataset.to;const map={Plan:'four',Prep:'prep',Today:'today',Leftovers:'left',Kitchen:'kitchen',Groceries:'groc'};if(map[to])setState(map[to]);else toast('Not part of this mockup.');break}
    case 'go':{const to=a.dataset.to;const pp=a.closest('.part');const pn=pp?findP(pp.dataset.p)[1]:a.dataset.p?findP(a.dataset.p)[1]:null;
      if(['moved','removed','cook','groc','left','prep','cookahead','four','keeps','idea','moveserve','movesave','servesat','movesaveleft'].includes(to)){const pm=pp?findP(pp.dataset.p)[0]:a.dataset.p?findP(a.dataset.p)[0]:null;const mm=M,td=TODAY,pg=S.page,pd=S.prepDone,ps=S.prepServ;
        /* r20 (friction 1, 3, 4): leaving an open meal keeps a copy of the plan as it is, so back returns to it */
        const snap0=pg==='plan'&&S.sel&&M[S.sel]&&['groc','cook','cookahead','left','movesaveleft'].includes(to)?{M:mm,TODAY:td,sel:S.sel,toast:S.toast,undoM:S.undoM,phDay:S.phDay}:null;
        setState(to);if(snap0){S.backSnap=snap0;if(to==='movesaveleft'||to==='left')render()}
        if(to==='cookahead'&&pn){M=mm;TODAY=td;S.caP=pn.name;S.caMid=pm?pm.id:'sun';S.caFrom='plan';render()}
        else if(to==='cookahead'&&a.dataset.n){S.caP=a.dataset.n;S.caMid=a.dataset.m||'sun';S.caFrom=pg==='today'?'today':'prep';render()}
        else if((to==='groc'||to==='cook')&&a.dataset.m&&mm[a.dataset.m]){M=mm;TODAY=td;S.notTonight={};S.skipCrisp=false;if(to==='groc'){S.grocMeal=a.dataset.m;S.fromMeal=true}else S.cookMid=a.dataset.m;render()}
        else if(to==='left'&&(pg==='prep'||pg==='today')&&pd){S.leftThu=pd;TODAY='thu';S.prepDone=pd;S.prepServ=ps;S.fromPrep=pg;render()}}break}
    case 'backprep':{S.page=S.fromPrep||'prep';S.leftThu=false;S.fromPrep=null;render();const n=$('.pnum');if(n)n.scrollIntoView({block:'nearest'});break}
    case 'backplan':{const to=a.dataset.to||'plan';
      if(to==='plan'&&S.backSnap){const b=S.backSnap;M=b.M;TODAY=b.TODAY;Object.assign(S,{page:'plan',sel:b.sel,toast:b.toast,undoM:b.undoM,phDay:b.phDay||null,backSnap:null,grocMeal:false,fromMeal:false,leftMove:false,leftThu:false,cookMid:null,caP:null,caMid:null,caFrom:null,dlg:null,_fresh:true});render();break}
      if(to!=='plan'){setState(to);if(a.dataset.quiet){S.toast=null;S.undoM=null;render()}break}setState('four');if(a.dataset.m&&M[a.dataset.m]){S.sel=a.dataset.m;render()}break}
    case 'grocall':S.grocMeal=false;render();break;
    case 'pday':S.phDay=a.dataset.d;S.sel=null;S.toast=null;render();break;
    case 'grocsun':S.grocMeal=a.dataset.m||'sun';render();break;
    case 'usebest':{snap();const [m,p]=findP(a.dataset.p);const I0=ideasFor(m.id,p.role)[0];const was=p.name;Object.assign(p,{kind:'guess',name:I0.n,t:I0.t,by:null});S.lastAdded=p.id;S.st='ideadone';toast(`${was} is now ${I0.n}.`,1);break}
    case 'steps':{const [m,p]=findP(a.dataset.p);S.menu=null;S.dlg='steps';S.dlgP=p.name;S.stepsFor=null;render();break}
    case 'fvset':{snap();const [m,p]=findP(a.dataset.p);const v=+a.dataset.v;p.serves=v>=m.serves?null:v;S.menu=null;toast(p.serves?`${p.name} is now for ${p.serves} of ${m.serves}. Groceries changed.`:`${p.name} is for all ${m.serves} again.`,1);showPart(p.id);break}
    case 'later':toast('Not part of this mockup.');break;
    case 'mealmenu':{e.stopPropagation();if(S.menu&&S.menu.kind==='meal'&&S.menu.mid===a.dataset.m){S.menu=null;render();break}openMenu({kind:'meal',mid:a.dataset.m},a);break}
    case 'partmenu':{const [m,p]=findP(a.dataset.p);if(S.menu&&S.menu.pid===p.id){S.menu=null;render();break}openMenu({kind:'part',mid:m.id,pid:p.id},a);break}
    case 'fewer':{const [m,p]=findP(a.dataset.p);S.menu.fewer=true;S.menu.fv=p.serves||m.serves;render();reMenu();break}
    case 'fvother':S.menu.other=true;render();reMenu();break;
    case 'menux':S.menu=null;render();break;
    case 'fv':{const m=M[S.menu.mid];S.menu.fv=Math.max(1,Math.min(m.serves,S.menu.fv+ +a.dataset.d));render();break}
    case 'fvdone':{snap();const [m,p]=findP(a.dataset.p);p.serves=S.menu.fv>=m.serves?null:S.menu.fv;S.menu=null;toast(p.serves?`${p.name} is now for ${p.serves} of ${m.serves}. Groceries changed.`:`${p.name} is for all ${m.serves} again.`,1);showPart(p.id);break}
    case 'setrole':{snap();const [m,p]=findP(a.dataset.p);p.role=a.dataset.r;S.menu=null;toast(`${p.name} is now a ${p.role.toLowerCase()}.`,1);showPart(p.id);break}
    case 'rmpart':{snap();const [m,p]=findP(a.dataset.p);m.parts=m.parts.filter(x=>x!==p);S.menu=null;toast(`Removed ${p.name}. Its groceries came off the list.`,1);break}
    case 'swap':{const [m,p]=findP(a.dataset.p);S.menu=null;S.add={mid:m.id,role:p.role,tab:'rec',q:'',added:[],rep:p.id,repName:p.name,repKind:p.kind,inline:false,filter:'all'};render();break}
    case 'recipe':{const [m,p]=findP(a.dataset.p);S.menu=null;S.dlg='recipe';S.dlgP=p.name;render();break}
    case 'dlgx':if(e.target!==a&&a.classList.contains('scrim'))break;S.dlg=null;render();break;
    case 'dlgdone':S.dlg=null;toast(a.dataset.msg,1);break;
    case 'add':{if(a.getAttribute('aria-disabled'))break;const m=M[a.dataset.m];S.menu=null;S.sel=m.id;S.add={mid:m.id,role:a.dataset.role||'Side',tab:'rec',q:'',added:[],inline:S.way==='C'};render();if(S.add.inline){const i=$('#q');if(i)i.focus()}else{const i=$('#q');if(i&&!PH())i.focus()}break}
    case 'makereal':{if(a.getAttribute('aria-disabled'))break;const [m,p]=findP(a.dataset.p);S.add={mid:m.id,role:p.role,tab:'idea',q:'',added:[],rep:p.id,repName:p.name,repKind:'idea',inline:false,filter:'idea'};render();break}
    case 'closeadd':S.add=null;render();break;
    case 'closeadd-scrim':if(e.target===a){S.add=null;render()}break;
    case 'tab':S.add.tab=a.dataset.t;S.add.q='';if(a.dataset.t==='rec')S.add.noideas=S.add.noideas;render();break;
    case 'role':S.add.role=a.dataset.r;render();break;
    case 'clrq':S.add.q='';render();$('#q')&&$('#q').focus();break;
    case 'morerec':S.add.many=true;render();break;
    case 'filter':S.add.filter=a.dataset.f;render();const bd=$('#addbd');if(bd)bd.scrollTop=0;break;
    case 'inlmore':S.add.inline=false;S.add.filter='all';render();break;
    case 'pick':{snap();const m=M[S.add.mid],n=a.dataset.n,k=a.dataset.k;const R0=ALLREC().find(r=>r.n===n),I0=IDEAS_ALL.find(r=>r.n===n),K0=KIT_ALL.find(r=>r.n===n);
      const np=k==='recipe'?P(S.add.role,'recipe',n,{t:R0.t,buy:R0.buy,keep:R0.keep}):k==='guess'?P(S.add.role,'guess',n,{t:I0.t}):k==='have'?P(S.add.role,'have',n,{place:K0.place,amt:K0.amt}):k==='idea'?P(S.add.role,'idea',n,{}):P(S.add.role,'buy',n.charAt(0).toUpperCase()+n.slice(1),{amt:'1'});
      if(S.add.rep){const i=m.parts.findIndex(x=>x.id===S.add.rep);np.role=m.parts[i].role;m.parts[i]=np;S.lastAdded=np.id;const was=S.add.repName,chg=S.add.repKind!=='idea';S.add=null;if(chg)S.undoSt=S.st;else S.st='ideadone';toast(chg?`Changed ${was} to ${np.name}.`:`${was} is now ${np.name}.`,1);requestAnimationFrame(showNew);break}
      const ri=roleOrder.indexOf(np.role);let at=m.parts.findIndex(x=>roleOrder.indexOf(x.role)>ri);if(at<0)at=m.parts.length;m.parts.splice(at,0,np);S.lastAdded=np.id;
      /* r4 (friction 2): one add closes the sheet; the add button is right there for another */
      const lastF=S.way==='A'?S.add.tab:(S.add.filter||'all');S.add=null;
      S.toast={msg:`Added ${np.name} as a ${np.role.toLowerCase()}.`,undo:1,again:m.id};S.againRole=np.role;S.againF=lastF;render();
      /* r8 (friction 3, ease 8): the add button stays whole under the new dish, ready for another */
      requestAnimationFrame(showNew);break}
    /* r11 (friction 2): Add Another opens on the role and filter (or tab) you just used */
    case 'again':{const m=M[a.dataset.m],f=S.againF||'all';S.toast=null;S.add={mid:m.id,role:S.againRole||'Side',tab:['kit','idea'].includes(f)?f:'rec',filter:f,q:'',added:[],inline:false};render();break}
    case 'batchsat':{const [m0]=findP(a.dataset.p);const sp=M.sat&&M.sat.parts.find(x=>x.made&&x.made.id==='0048');S.paneBack={mid:m0.id,label:mealRef(m0)};S.sel='sat';S.lastAdded=sp?sp.id:null;render();requestAnimationFrame(showNew);break}
    case 'paneback':{S.sel=S.paneBack.mid;S.paneBack=null;S.lastAdded=null;render();break}
    case 'addrecipe':S.dlg='recipe';S.dlgP=a.dataset.n;S.stepsFor={add:1,kind:'recipe'};render();break;
    case 'ideasteps':S.dlg='steps';S.dlgP=a.dataset.n;S.stepsFor=S.add?{add:1}:{pid:a.dataset.p};render();break;
    case 'usesteps':{const f=S.stepsFor,n=a.dataset.n;S.dlg=null;S.stepsFor=null;
      if(f&&f.add&&S.add){if(f.kind!=='recipe'){S.add.filter='idea';S.add.tab='idea';S.add.q=''}render();const b=document.querySelector(`#addbd [data-a="pick"][data-n="${CSS.escape(n)}"]`);if(b)b.click();break}
      snap();const [m,p]=findP(f&&f.pid);if(!p){render();break}const I0=IDEAS_ALL.find(x=>x.n===n)||ideasFor(m.id,p.role)[0];const was=p.name;Object.assign(p,{kind:'guess',name:I0.n,t:I0.t,by:null});S.lastAdded=p.id;S.st='ideadone';toast(`${was} is now ${I0.n}.`,1);break}
    case 'allsides':S.add.allSides=true;S.add.filter='all';render();break;
    /* r16 (friction 3): Move goes through the keep question when a made dish would spoil; Remove removes this meal */
    case 'mvmeal':{const m=M[a.dataset.m];S.menu=null;if(m.id!=='sun'){toast('Not part of this mockup: Plan v3 asks which day.');break}
      const mp=m.parts.find(p=>p.made);if(mp&&dayIx(mp.made.until)<dayIx('mon')){S.dlg='moveask';render();break}
      snap();m.day='mon';if(M.mon)M.mon.day='sun';S.sel=m.id;toast(`Roast Chicken moved to Monday${M.mon?', Beef Lasagna to Sunday':''}.${mp?` Potatoes #${mp.made.id} go too.`:''}`,1);break}
    case 'rmmeal':{const m=M[a.dataset.m];S.menu=null;snap();const mp=m.parts.find(p=>p.made);delete M[m.id];S.sel=null;
      toast(`${mealRef(m)} removed. ${mp?`${mp.name} (#${mp.made.id}) stays in the fridge as a leftover.`:'Its groceries came off the list.'}`,1);break}
    case 'pbmore':{const b=$('#pb');if(b)b.scrollBy({top:Math.round(b.clientHeight*.7),behavior:'smooth'});break}
    case 'ptick':{const k=a.dataset.k;S.prepDone=S.prepDone===k?false:k;S.prepServ=null;render();
      /* r18 (friction 5): the saved box (number, servings, Check It in Leftovers) comes into view */
      if(S.prepDone){const n=$('.pnum');if(n)n.scrollIntoView({block:'nearest'})}break}
    case 'pserv':{const base=S.prepServ||(S.prepDone==='pie'?10:6);S.prepServ=Math.max(1,Math.min(20,base+ +a.dataset.v));render();break}
    case 'nt':{const id=a.dataset.p;S.notTonight[id]=!S.notTonight[id];render();break}
    case 'undo':if(S.undoM){const u=S.undoM;S.undoM=null;M=u.M;S.sel=u.sel;TODAY=u.TODAY;S.page='plan';S.toast=null;S.lastAdded=null;S.dlg=null;S.undoSt=null;render();break}
      if(S.undoSt){const u=S.undoSt;S.undoSt=null;setState(u==='partmenu'||u==='fewer'?'four':u);break}S.toast=null;setState(S.st==='ideadone'?'idea':S.st==='added'||S.st==='removed'||S.st==='moved'?'four':S.st);break;
  }
});
addEventListener('resize',()=>{S.menu=null;render()});
setState(Q.get('state')||'four');
window.__go=(k,w)=>{if(w)S.way=w;setState(k)};
if(document.fonts)document.fonts.ready.then(()=>fixWraps());
