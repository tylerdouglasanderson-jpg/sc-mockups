/* Frame, tokens and kit parts copied from Groceries v3 (round 35) so the pages sit side by side: header 50, rail 219,
   tan bar 46, kit Button / Chip / Popover / Dialog / Toast / Stepper / FolderDrawer look D. Kitchen parts below. */
:root{--soon-edge:#E5D3AE;--soon-line:rgba(126,92,34,.16);--soon-hover:rgba(255,255,255,.45);--guest:#6B675C;--bar-lift:rgba(45,33,22,.22);--card-clear:rgb(250 246 238 / 0);--drawer-lift:rgba(0,0,0,.14);
  --page:#EDE5D8; --card:#FAF6EE; --card-hover:#FFFCF5; --panel:#F6F2E9; --panel-alt:#F1E8DA; --alert:#F8F0E0;
  --header:#6B3E14; --subbar:#E4D3B3; --hdr-text:#FAF4EB; --subbar-date:#5C3D0A; --subbar-2:#7A5030;
  --ink:#1E1E1C; --ink2:#54524A; --muted:#605E55;
  --sage:#8FAF8A; --sage-dark:#1F3A1C; --sage-light:#E4EDE2; --sage-text:#4B6947; --sage-hover:#82A37C;
  --amber:#C8943A; --amber-light:#F5ECD8; --amber-text:#7E5C22; --amber-dark:#5C3D0A;
  --urgent-bg:#F5E4E4; --urgent-text:#5C1A1A; --urgent-border:#8E3131;
  --chip:#E4D9C6; --chip-on:#B7D0B0; --chip-warm:#EFE4CC; --chip-warm-edge:#988048;
  --row-hover:#F0EEE3; --track:#DDD5C5;
  --folder-line:#D2C6B0; --folder-ink:#4A3A22; --sheet1:#F1E4CB; --sheet2:#E6D3AE;
  --folder-1:#E8D6B2; --folder-2:#E2CDA4; --folder-3:#DCC598; --folder-4:#D6BD8C;
  --c-muted:96 94 85; --c-ink2:84 82 74;
  --member-1:#5E7C55; --member-2:#8A5226; --member-3:#5F4F86; --member-4:#2E6670;
  --bcard:rgba(0,0,0,.09); --brow:rgba(0,0,0,.06); --scrim:rgba(0,0,0,.4);
  --shadow-card:0 1px 2px rgba(45,33,22,.055),0 6px 16px rgba(45,33,22,.055);
  --shadow-pop:0 4px 14px rgba(45,33,22,.16); --shadow-float:0 16px 48px rgba(45,33,22,.2);
  --hover:inset 0 0 0 100px rgba(30,30,28,.04); --press:inset 0 0 0 100px rgba(30,30,28,.16);
  --on-dark-hover:rgba(250,244,235,.08);--on-dark-press:rgba(250,244,235,.16);--wood-sheen-top:rgba(255,255,255,.04);--wood-sheen-bottom:rgba(0,0,0,.10);
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --ease:cubic-bezier(.25,.46,.45,.94);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--page)}
body{color:var(--ink);font:400 15px/1.45 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden;font-variant-numeric:tabular-nums;text-wrap:pretty}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input{font:inherit;color:inherit}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:16px;height:16px}
:focus-visible{outline:2px solid var(--sage-text);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.2s!important;animation-name:fade!important;transition-duration:.01s!important}.btn:active,.chip:active{transform:none!important}.skel{animation:none!important;background:var(--track)!important}}
/* ONE themed scroll bar for every scroller (DESIGN 4.10) */
.scroll,.side,.sheet .bd,.menu .mi{scrollbar-width:thin;scrollbar-color:rgb(var(--c-muted) / .35) transparent}
.scroll::-webkit-scrollbar,.side::-webkit-scrollbar,.sheet .bd::-webkit-scrollbar,.menu .mi::-webkit-scrollbar{width:12px;height:12px}
.scroll::-webkit-scrollbar-thumb,.side::-webkit-scrollbar-thumb,.sheet .bd::-webkit-scrollbar-thumb,.menu .mi::-webkit-scrollbar-thumb{background:rgb(var(--c-muted) / .35);border:3px solid transparent;background-clip:padding-box;border-radius:999px}
.scroll::-webkit-scrollbar-track,.side::-webkit-scrollbar-track{background:transparent}

.top::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--wood-sheen-top),var(--wood-sheen-bottom));pointer-events:none}
.wordmark{font-style:italic;font-weight:600;font-size:22px;position:relative}
.top .sp{flex:1}
.av{display:inline-grid;place-items:center;border-radius:50%;font-weight:600;color:var(--hdr-text);flex:none}
.av.hdr{width:28px;height:28px;font-size:12px;background:var(--member-1);box-shadow:0 0 0 2px var(--hdr-text);position:relative}
.av.md{width:32px;height:32px;font-size:13px}
.rail{background:var(--card);border-right:1px solid var(--bcard);padding:12px 8px;display:flex;flex-direction:column;gap:4px;min-height:0}
.rail .cap{height:44px;border-radius:8px;background:var(--sage);color:var(--ink);display:flex;align-items:center;gap:8px;padding:0 12px;font-weight:500;font-size:16px;margin-bottom:8px}
.rail .cap:hover{box-shadow:var(--hover)}
.rail .ri{display:flex;align-items:center;gap:12px;height:44px;border-radius:8px;padding:0 12px;color:var(--ink2);font-weight:500;font-size:16px;text-align:left;flex:none}
.rail .ri svg.i,.rail svg.ni{width:24px;height:24px;flex:none}
svg.ni{display:block;overflow:visible}
.rail .ri:hover{box-shadow:var(--hover)}
.rail .ri.on{background:var(--sage-light);color:var(--sage-text)}
.rail hr{border:0;border-top:1px solid var(--bcard);margin:4px 8px}
.rail .grow{flex:1}
.body{display:grid;grid-template-rows:46px 1fr auto;min-height:0;min-width:0;position:relative}
.bar{background:var(--subbar);border-bottom:1px solid var(--brow);position:relative;display:flex;z-index:5}
.bar .in{display:flex;align-items:center;gap:12px;width:100%;max-width:1212px;margin:0 auto;padding:0 16px;min-width:0}
.bar .ttl{font-weight:600;font-size:16px;color:var(--subbar-date);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bar .meta{font-size:13px;color:var(--subbar-2);padding-left:12px;border-left:1px solid var(--chip-warm-edge);display:flex;align-items:center;gap:8px;white-space:nowrap}
.bar .sp{flex:1}
.bar .crumb{font-weight:600;font-size:16px;color:var(--subbar-2);border-radius:8px;padding:0 4px;margin:0 -4px;height:36px;display:inline-flex;align-items:center;white-space:nowrap;position:relative}.bar .crumb::after{content:"";position:absolute;inset:-4px 0}
.bar .crumb:hover{box-shadow:var(--hover);color:var(--subbar-date)}
.bar .sepc{color:var(--subbar-2);flex:none}
.back{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--subbar-date);margin-left:-8px;position:relative;flex:none}
.back:hover{box-shadow:var(--hover)}.back::after{content:"";position:absolute;inset:-4px}
/* a back that names where it goes ("< Kitchen"), on the Leftovers page opened from Kitchen (panel 2 ease 2) */
.back.word{width:auto;padding:0 10px 0 4px;gap:2px;display:inline-flex;align-items:center;font-weight:600;font-size:16px;white-space:nowrap}
/* the tan bar's button slot keeps its width while loading so nothing moves when it fades in (CODE_MAP risk 6) */
.bar .slot{display:flex;align-items:center;gap:8px;transition:opacity .2s var(--ease)}
.bar .slot.hold{opacity:0;pointer-events:none}

/* kit Button: 44 tall, four tiers, press = shrink .97 + 16% overlay */
.btn{height:44px;border-radius:8px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:500;font-size:16px;white-space:nowrap;transition:transform 50ms var(--ease),box-shadow .2s var(--ease),opacity .2s var(--ease);position:relative;flex:none}
.btn:active{transform:scale(.97);box-shadow:var(--press)}
.btn.pri{background:var(--sage-dark);color:var(--hdr-text)}.btn.pri:hover{box-shadow:inset 0 0 0 100px var(--on-dark-hover)}.btn.pri:active{box-shadow:inset 0 0 0 100px var(--on-dark-press)}
.btn.sec{background:var(--sage);color:var(--ink)}.btn.sec:hover{box-shadow:var(--hover)}
.btn.cancel{background:transparent;border:1px solid var(--ink2);color:var(--ink)}.btn.cancel:hover{box-shadow:var(--hover)}
.btn.tan{background:var(--chip-warm);border:1px solid var(--chip-warm-edge);color:var(--ink)}.btn.tan:hover{box-shadow:var(--hover)}
.btn.wide{width:100%}
.bar .btn{height:36px;padding:0 14px;font-size:15px}.bar .btn::after{content:"";position:absolute;inset:-4px 0}
.btn.icon{width:44px;padding:0;background:transparent;color:var(--ink2)}.btn.icon:hover{box-shadow:var(--hover)}
.bar .btn.icon{width:36px;color:var(--subbar-date)}.bar .btn.icon::after{inset:-4px}
.btn.icon[aria-expanded=true]{box-shadow:var(--press)}
/* an off button is Groceries' and Plan's: the same button at .45, words and edge kept (panel 6 fit 1; replaces round 11's
   Kitchen-only white look) */
.btn.off{opacity:.45;cursor:default}.btn.off:active,.btn.off:hover{transform:none;box-shadow:none}
.scroll{overflow:auto;min-height:0;overscroll-behavior:contain}
.card{background:var(--card);border-radius:12px;border:1px solid var(--bcard);box-shadow:var(--shadow-card)}
.eyebrow{font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* kit Chip (radius 8, never pills) */
.chip{height:44px;border-radius:8px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:15px;color:var(--ink);background:var(--chip);border:1px solid transparent;font-weight:600;white-space:nowrap;transition:transform 50ms var(--ease),background .2s var(--ease)}
.chip:hover{box-shadow:var(--hover)}.chip:active{transform:scale(.97);box-shadow:var(--press)}
.chip.on{background:var(--chip-on);border-color:var(--sage-text);font-weight:700}
/* kit Chip compact: meta type, 12 a side, still 44 tall (Chip.tsx) */
.chip.cmp{padding:0 12px;font-size:13px}
.chip .n{font-weight:500;color:var(--ink2)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
/* kit TagChip */
.tag{font-size:13px;font-weight:600;color:var(--ink);background:var(--chip);border-radius:8px;padding:1px 8px;white-space:nowrap;display:inline-block;line-height:20px}
.tag.lo{background:var(--panel-alt);border:1px solid var(--folder-line);color:var(--ink2);padding:0 7px}

/* folder drawer (kit FolderDrawer look D) */
.drawer{position:relative;padding:0 12px 12px 0}
.ftabs{display:flex;align-items:flex-end;height:44px;padding:0 24px;position:relative;z-index:2}
.ftab{position:relative;height:44px;flex:none;display:block;font-size:15px;font-weight:600;color:var(--folder-ink);line-height:38px;padding-top:6px;text-align:center;white-space:nowrap}
.ftab svg{position:absolute;left:-4px;top:0;overflow:visible;pointer-events:none}
.ftab span{position:relative}
.ftab .n{font-size:13px;font-weight:500;opacity:.8;margin-left:6px}
.ftab.on{color:var(--sage-text)}
.ftab:not(.on):hover svg path:first-child{filter:brightness(.96)}
.ftab:focus-visible{outline-offset:-4px;border-radius:8px}
.fcard{position:relative;z-index:1}
.fcard .sh{position:absolute;inset:0;border-radius:12px;border:1px solid var(--folder-line);pointer-events:none}
.fcard .sh2{transform:translate(12px,12px);background:var(--sheet2)}
.fcard .sh1{transform:translate(6px,6px);background:var(--sheet1)}
.fcard>.card{position:relative;border-color:var(--folder-line);overflow:clip}

/* ---------- Kitchen page ---------- */
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px 24px;padding:24px 16px 96px;max-width:1212px;margin:0 auto;align-items:start}
@media (max-width:1320px){.wrap{grid-template-columns:minmax(0,1fr) 352px}}
@media (max-width:1240px){.wrap{grid-template-columns:minmax(0,1fr) 372px;gap:16px;padding:20px 12px 96px}.find.wide{width:168px}.side{top:20px!important;max-height:calc(100dvh - 132px)!important}}
/* a page-wide notice (offline, save error, who you are, tips) spans the list and the side pane, one top and one 16 px gap
   under it on every size (panel 3 visual 5); the side pane then starts under it */
.wrap>.banner{grid-column:1/-1;margin:0}
.wrap.one{grid-template-columns:minmax(0,760px);justify-content:center}
.lst{min-width:0}
/* the folder head: what's here, in one line, and Find */
.lhead{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 20px;border-bottom:1px solid var(--brow);font-size:15px;color:var(--ink2);min-height:64px;line-height:1.3}
.lhead b{color:var(--ink);font-weight:600}
.lhead .sp{flex:1}
.lhead .sum{min-width:0}
.lhead .sum small{display:block;font-size:13px;color:var(--muted)}
@media (max-width:1240px) and (min-width:1101px),(max-width:640px){.lhead .tl2{display:block;font-size:13px;color:var(--muted)}.lhead .tl2 b{color:var(--ink2);font-weight:600}.lhead .tl2 .sep{display:none}.dev-ipad .lhead .tl2{font-size:14px}}
.find{display:flex;align-items:center;gap:8px;height:44px;width:220px;border:1px solid var(--folder-line);border-radius:8px;background:var(--panel);padding:0 8px 0 12px;color:var(--muted);transition:border-color .2s var(--ease)}
.find:hover{border-color:var(--ink2)}
.find:focus-within{border:2px solid var(--sage-text);padding:0 7px 0 11px;background:var(--card)}
.find input{flex:1;min-width:0;border:0;outline:none;background:none;font-size:15px;color:var(--ink)}
.find input::placeholder{color:var(--muted)}
.find .clr{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--ink2);position:relative}.find .clr::after{content:"";position:absolute;inset:-8px}
/* Use Soon box: All only (Q2), one warm band across the folder card, so its names and words share the rows' edges */
.soon{margin:0;background:var(--amber-light);border-bottom:1px solid var(--soon-edge);overflow:clip}
.soon .shd{display:flex;align-items:center;gap:8px;min-height:44px;padding:12px 16px 4px 20px;color:var(--amber-dark);font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.soon .shd .hint{text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink2);margin-left:auto}
.soon .shd svg{color:var(--amber-text)}
.srow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:8px 16px 8px 20px;min-height:56px;border-top:1px solid var(--soon-line);transition:background .2s var(--ease)}
.srow .go{color:var(--muted);flex:none;margin-right:-4px}
.soon .srow:first-of-type{border-top:0}
.srow:hover{background:var(--soon-hover)}.srow:active{box-shadow:var(--press)}
.srow.picked{background:var(--sage-light)}
.srow .m{flex:1;min-width:0}
.srow .nm{font-size:16px;font-weight:500}
.srow .nm .where{font-size:13px;font-weight:400;color:var(--ink2);margin-left:8px}
.srow .tip{display:block;font-size:13px;color:var(--ink2)}
.srow .when{font-size:15px;font-weight:600;color:var(--amber-text);white-space:nowrap}
.srow .when.now{color:var(--urgent-text)}
.soon .morebtn{display:flex;align-items:center;gap:4px;width:100%;padding:0 16px;min-height:48px;border-top:1px solid var(--soon-line);font-size:15px;font-weight:600;color:var(--amber-dark)}
.soon .morebtn:hover{background:var(--soon-hover)}
/* place groups: sticky name with its own ... */
.grp{position:relative}
.ph{position:sticky;top:0;background:var(--card);z-index:2;padding:8px 8px 4px 20px;font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--brow);display:flex;gap:8px;align-items:center;min-height:52px}
.ph .nc{text-transform:none;letter-spacing:0;font-weight:400}
.ph .sp{flex:1}
.kebab{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;color:var(--muted);flex:none}
.kebab:hover,.kebab[aria-expanded=true]{box-shadow:var(--hover);color:var(--ink)}
.kebab[aria-expanded=true]{box-shadow:var(--press)}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:64px;padding:8px 16px 8px 20px;border-bottom:1px solid var(--brow);position:relative;transition:background .2s var(--ease)}
.row:hover{background:var(--row-hover)}.row:active{box-shadow:var(--press)}
.row.picked{background:var(--sage-light)}
.row.picked .nm{color:var(--sage-text)}
.row .m{flex:1;min-width:0}
.row .nm{font-size:16px;font-weight:500;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row .sub{font-size:13px;color:var(--muted);margin-top:2px;display:flex;flex-wrap:wrap;column-gap:8px}
.row .sub .just{color:var(--sage-text);font-weight:500}
.row .sub .err{color:var(--urgent-text);font-weight:500;display:inline-flex;align-items:center;gap:4px}
.row .r{text-align:right;flex:none;max-width:45%}
.row .amt{font-size:15px;font-weight:500;color:var(--ink2);white-space:nowrap}
/* a rough amount: the plain word in a quieter tone (Q5), never a range or a made-up number */
.amt.rough{color:var(--muted);font-weight:400}
.row .st{font-size:13px;font-weight:600;white-space:nowrap;margin-top:2px}
.st.s-now{color:var(--urgent-text)}.st.s-soon{color:var(--amber-text)}.st.s-low{color:var(--amber-text)}
.row .go{color:var(--muted);flex:none;margin-right:-4px}
/* wide screens: no end column. Amounts, the Use Soon words and hint, and each place's ⋯ dots all end on one line,
   23 px in from the card's edge (panel 4 visual 5); a leftover's "opens another page" mark rides in its tag */
@media (min-width:1101px){.row,.srow{padding-right:23px}.soon .shd{padding-right:23px}.row .gos,.srow .gos{display:none}}
.tag.lo svg{width:12px;height:12px;vertical-align:-1px;margin-left:2px;stroke-width:2.2}
.srow .where svg{width:12px;height:12px;vertical-align:-1px;margin-left:4px;color:var(--muted)}
.lfoot{padding:16px 20px;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.lfoot svg{flex:none;margin-top:1px}
.nomatch{padding:32px 24px;text-align:center;color:var(--ink2)}
.nomatch b{display:block;color:var(--ink);font-size:16px;font-weight:600;margin-bottom:4px}
.new{animation:flash 2.4s var(--ease)}
@keyframes flash{0%,40%{background:var(--sage-light)}100%{background:transparent}}
.row.picked.new{animation:none}

/* side column: the open item, or a calm summary */
.side{position:sticky;top:24px;max-height:calc(100dvh - 136px);overflow:auto;overscroll-behavior:contain;padding:2px 8px 8px;margin:-2px -8px 0;display:flex;flex-direction:column;gap:16px}
.side>*{flex:none}
/* while more of the side pane waits below, its last 24 px fade out, so its bottom edge never cuts a line (round 16) */
/* round 17: the fade ends fully clear 12 px above the edge, so no ghost of a word shows there (panel 6 visual 8) */
/* round 19 (panel 7 visual 1): the ramp is short and steep (26 px) and the last 36 px are fully clear, so a line is
   either readable or gone; nothing sits half-faded for long */
.side.moreb{--fz:linear-gradient(#000 calc(100% - 62px),rgba(0,0,0,.35) calc(100% - 50px),transparent calc(100% - 36px));-webkit-mask-image:var(--fz);mask-image:var(--fz)}
.pane{padding:20px}
.pane .hd{display:flex;align-items:flex-start;gap:12px}
/* the open item's name and close stay at the top of the side pane while a tall panel scrolls it (panel 3 visual 2,
   ease 5): the head sticks, with a hairline under it once something slides beneath */
.side .pane .hd{position:sticky;top:-2px;z-index:3;background:var(--card);margin:-20px -20px 0;padding:20px 20px 8px;border-radius:12px 12px 0 0}
/* once stuck: the kit hairline under it, and the next 12 px fade out under it, so nothing reads as sliced (panel 4 visual 6, fit 2) */
.side .pane .hd.stuck{box-shadow:0 1px 0 var(--bcard);border-radius:0}
/* round 17 (panel 4-6 visual, the root cause): an opened panel no longer scrolls to "nearest", which left whatever
   happened to sit under the head cut in half. It scrolls so a fact row's top edge meets the head's hairline (or, for a
   panel taller than the pane, the panel's own top), so the edge under the head is always a row line, never a word */
/* narrow item page: the big name scrolls with the page; once it is under the tan bar, the bar's crumb shows it
   (round 15: one name on screen, never two; panel 5 visual 3, fit 5) */
.bar .itn{transition:opacity .2s var(--ease);opacity:0}.bar.named .itn{opacity:1}
/* what scrolls up under the tan bar on an item page fades over 12 px instead of showing a cut line (round 16) */
.body:has(.pane.page)>.scroll{-webkit-mask-image:linear-gradient(transparent,#000 12px);mask-image:linear-gradient(transparent,#000 12px)}
.side .pane .hd .x{margin-top:-8px}
.side .pane .hd+*{margin-top:4px}
.pane .hd .t{flex:1;min-width:0}
.pane h2{margin:2px 0 0;font-size:24px;font-weight:600;line-height:1.25}
.pane h2 .tag{font-size:13px;vertical-align:4px;margin-left:8px}
.pane .x{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;color:var(--ink2);margin:-8px -8px 0 0;flex:none}
.pane .x:hover{box-shadow:var(--hover)}
.pane .lede{font-size:15px;color:var(--ink2);margin:8px 0 0}
.line{display:flex;gap:8px;align-items:flex-start;font-size:15px;margin-top:12px;padding:12px;border-radius:8px}
.line svg{flex:none;margin-top:2px}
.justl{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:500;color:var(--sage-text);margin-top:4px}
.line.tipl{background:var(--amber-light);color:var(--amber-dark)}
.line.who{background:var(--panel-alt);color:var(--ink)}
.line.lowl{background:var(--amber-light);color:var(--amber-dark)}
.line b{font-weight:600}
.facts{margin-top:16px;border-top:1px solid var(--brow)}
.fact{border-bottom:1px solid var(--brow)}
.fact .fr{display:flex;align-items:flex-start;gap:12px;min-height:60px;padding:8px 0}
.fact .kvb{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.fact .k{font-size:13px;color:var(--muted)}
.fact .v{font-size:16px;font-weight:500}
.fact .v small{display:block;font-size:13px;font-weight:400;color:var(--muted);white-space:normal}
.fact .v small.warn{color:var(--amber-text);font-weight:600}
.fact .v small.bad{color:var(--urgent-text);font-weight:600}
/* one button width for every fact (fits "Make It a Staple"); each button lines up with its label and value, not the middle of a tall fact */
.fact .fr>.btn{width:144px;padding:0 12px}
.fact .v.rough{color:var(--ink2)}
.fact .btn{height:44px}
/* an open fact keeps the tan button (Groceries' and Plan's .btn.tan); the pressed shade and the panel under it show it's open (panel 2 fit 1) */
/* round 17 (panel 6 visual 4): an open fact keeps its tan fill and gets a dark 2 px edge, not a muddy grey overlay */
.fact .btn[aria-expanded=true]{border-color:var(--amber-dark);box-shadow:inset 0 0 0 1px var(--amber-dark)}
/* Tossed It sits in the fact buttons' column (same left edge and width); Used It All fills the rest (panel 6 visual 2) */
.closeout{display:grid;grid-template-columns:minmax(0,1fr) 144px;gap:12px;margin-top:16px}
.facts.stp{margin-top:16px}
/* an inline panel grows open under its fact (200 ms height, reduced motion = fade) */
.ipanel{background:var(--panel);border:1px solid var(--bcard);border-radius:12px;padding:16px;margin:0 0 12px;display:flex;flex-direction:column;gap:12px}
.ipanel .q{font-size:15px;font-weight:600}
.ipanel .say{font-size:13px;color:var(--ink2)}
.ipanel .say.warn{color:var(--amber-text)}
.ipanel .q .now{font-weight:500;color:var(--ink2);margin-left:8px;font-size:13px}
.dnote{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.dnote li{display:grid;grid-template-columns:18px 1fr;gap:8px;align-items:start;font-size:13px;color:var(--ink2);line-height:1.4}
.dnote li .i{margin-top:1px;color:var(--ink2)}
.dnote li b{color:var(--ink);font-weight:600;white-space:nowrap}
/* "Move it to", then a quiet line saying where it is now (panel 4 ease 4) */
.ipanel .q .qsub{display:block;font-size:13px;font-weight:400;color:var(--ink2);margin-top:2px}
.dev-ipad .ipanel .q .qsub{font-size:14px}
/* every chip is the kit Chip, as in Groceries: no edge at rest (lead, round 15; panel 5 fit 2) */
/* "Also 1 lb in the Freezer" opens that part (panel 4 ease 2) */
.alsol{display:inline-flex;align-items:center;gap:2px;font-size:13px;font-weight:600;white-space:nowrap;color:var(--sage-text);border-radius:8px;padding:0 4px;margin:0 -4px;min-height:28px;position:relative}
.alsol:hover{box-shadow:var(--hover)}.alsol::after{content:"";position:absolute;inset:-8px 0}
.dnote li.one{color:var(--ink)}
.dev-ipad .dnote li,.dev-ipad .ipanel .q .now{font-size:14px}
.ipanel .acts{display:flex;gap:8px;justify-content:flex-end}
.ipanel .unst{display:flex;align-items:center;gap:4px;flex-wrap:wrap}.ipanel .unst .undol{margin:0 0 0 -8px;padding:0 8px;font-size:15px}
.ipanel .acts .btn{min-width:96px}
.ipanel .acts>.say{margin-right:auto;align-self:center;flex:1;min-width:0}
.ipanel .acts:has(>.say) .btn{flex:none}
/* kit Stepper exactly (border-strong-soft edge, 44 cells, 56 value) */
.stepw{display:flex;align-items:center;gap:12px}
.step{display:inline-flex;align-items:stretch;outline:1px solid var(--folder-line);outline-offset:-1px;border-radius:8px;overflow:hidden;background:var(--card);height:44px;flex:none}
.step button{width:44px;height:44px;display:grid;place-items:center;color:var(--muted)}
.step button:hover{box-shadow:var(--hover);color:var(--ink)}.step button:active{box-shadow:var(--press);color:var(--ink)}
.step input{width:64px;text-align:center;font-weight:500;font-size:16px;border:0;border-left:1px solid var(--brow);border-right:1px solid var(--brow);background:var(--card);outline:none}
.step:hover{outline-color:var(--ink2)}.step:focus-within{outline:2px solid var(--sage-text);outline-offset:2px}
.stepw .unit{font-size:15px;color:var(--ink2)}
.more{margin-top:16px;border-top:1px solid var(--brow)}
.more summary{list-style:none;cursor:pointer;min-height:52px;display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ink2);border-radius:8px;padding:0 8px;margin:0 -8px}
.more summary::-webkit-details-marker{display:none}
.more summary:hover{box-shadow:var(--hover)}
.more summary .chev{transition:transform .2s var(--ease);margin-left:auto}
.more[open] summary .chev{transform:rotate(90deg)}
.kvs{font-size:15px;padding:0 0 8px}
.kvs div{display:flex;gap:12px;padding:6px 0}.kvs span:first-child{width:72px;flex:none;font-size:13px;color:var(--muted);padding-top:2px}
.hist{font-size:13px;color:var(--ink2);padding:4px 0}
.ro{font-size:13px;color:var(--ink2);margin-top:16px;display:flex;gap:8px;align-items:flex-start}
.ro svg{flex:none;color:var(--muted);margin-top:1px}
.ro.calm{margin:8px 4px 0;min-height:20px;align-items:center}
/* calm pane: what Today's card says, the places, recent changes */
.big{font-size:24px;font-weight:600;line-height:1.25;margin:2px 0 4px}
.today{font-size:15px;color:var(--ink2)}
.kv{display:flex;align-items:center;justify-content:space-between;width:calc(100% + 16px);margin:0 -8px;min-height:48px;padding:8px;border-radius:8px;font-size:15px;text-align:left;gap:12px;border-top:1px solid var(--brow)}
.kv:first-of-type{border-top:0}
.kv:hover{box-shadow:var(--hover)}.kv:active{box-shadow:var(--press)}
.kv .v{color:var(--ink2);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.kv small{display:block;font-size:13px;color:var(--muted)}
.kvs2{margin-top:12px}
.feed{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--brow);font-size:15px}
.feed:first-of-type{border-top:0}
.feed .tx{flex:1;min-width:0}.feed .tx small{display:block;font-size:13px;color:var(--muted)}
.feed b{font-weight:600}
.feed.undone .tx{color:var(--muted)}
.feed .tx small.noundo{color:var(--amber-text);margin-top:2px}
.feed .btn{padding:0 12px;font-size:15px}
.av.m0{background:var(--guest)}.av.m1{background:var(--member-1)}.av.m2{background:var(--member-2)}.av.m3{background:var(--member-3)}.av.m4{background:var(--member-4)}
.sidehd{display:flex;align-items:center;gap:8px;margin-bottom:4px}.sidehd .sp{flex:1}
.sidehd h3{margin:0;font-size:16px;font-weight:600}

/* notices (kit notice: tinted card, plain icon, close X; no edge stripes) */
.banner{border-radius:12px;padding:4px 4px 4px 16px;margin-bottom:16px;display:flex;gap:12px;align-items:center;font-size:15px;min-height:52px;box-shadow:var(--shadow-card);border:1px solid var(--bcard);flex-wrap:wrap}
.banner>svg.i{flex:none}
.banner .tx{flex:1;min-width:240px;padding:8px 0}.banner b{font-weight:600}
.banner .sub{display:block;font-size:13px;margin-top:2px;color:var(--ink2)}
.banner .acts{display:flex;gap:8px;flex:none;align-items:center;flex-wrap:wrap;margin-left:auto}
.banner .acts .btn{height:44px}
.banner.ok{background:var(--sage-light)}.banner.ok>svg{color:var(--sage-text)}
.banner.off{background:var(--panel-alt)}.banner.off>svg{color:var(--ink2)}
.banner.err{background:var(--urgent-bg);color:var(--urgent-text);border-color:var(--urgent-border)}
.banner.err .sub{color:var(--urgent-text)}
.banner.ro{background:var(--panel-alt)}.banner.ro>svg{color:var(--ink2)}
/* a button that fits its words (kit ButtonRow inline): still the kit's 44 tall */
.btn.sm{padding:0 12px;font-size:15px}
/* every Undo for one food is the kit Toast (panel 2 fit 3). After Used It All or Tossed It, the one optional follow-up
   (why it was tossed, or Add to Grocery List) is a notice where the act happened: the top of the side pane on wide
   screens, the in-flow bottom bar on narrow ones (it covers no rows: the list just ends higher). Notice look, not toast. */
/* round 13 (panel 4 visual 1, friction 3): one clear next step. Row 1: the question and ×. Row 2: the one sage action
   (Add to Grocery List) or the short result, and Undo at the far end, the toast's own underlined Undo, its words ending
   under the ×. A reason card adds its chips under that. Shorter, so it clears the phone's Capture circle */
/* round 17 (panel 6 visual 7, fit 4): the card is the plain card colour, so its kit chips and sage action read as they
   do on every other card; one layout on every size: the question and ×, the choice (chips, or Add to Grocery List full
   width, as Groceries' phone notice stacks its action), then "You can skip this." and the named Undo */
.aft{border-radius:12px;background:var(--card);border:1px solid var(--bcard);box-shadow:var(--shadow-card);padding:4px 4px 6px 16px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.aft .acts .btn.sec{flex:1}
.aft .tp>svg.i{color:var(--sage-text)}
.aft .tp{display:flex;gap:12px;align-items:center;min-height:44px}
.aft .tp>svg.i{color:var(--ink2)}
.aft .tx{flex:1;min-width:0}.aft b{font-weight:600}
.aft .sub{font-size:13px;color:var(--ink2)}
.aft .sub.saved{color:var(--sage-text);font-weight:600;display:inline-flex;align-items:center;gap:6px}
.aft .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:4px 8px 0 0}
.undol{height:44px;padding:0 16px 0 12px;white-space:nowrap;border-radius:8px;font-size:16px;font-weight:500;color:var(--ink);text-decoration:underline;text-underline-offset:3px;flex:none;position:relative;margin-left:auto}
.undol:hover{box-shadow:var(--hover)}
/* the picked reason keeps its width (no check mark, same weight), so the card never grows after a tap (panel 2 visual 2);
   tight enough that the three reasons sit on one row in the 352 pane */
.aft .chip.cmp{padding:0 8px;font-size:14px}@media (min-width:1400px){.dev-desktop .aft .chip.cmp{font-size:15px}}.aft .chip.cmp.on{font-weight:700}
.aft .x{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;color:var(--ink2);flex:none}
.aft .x:hover{box-shadow:var(--hover)}
/* Undo lives in the card while it is up (panel 3 friction 2, visual 1): one thing at the bottom, not a toast on a card */
/* the Undo's right edge lines up with the chips' and the close's (it reaches under the ×'s column) */
.aft .subq{margin:-6px 12px 0 32px;height:auto;min-height:20px}.aft .subq .sub{display:block;white-space:normal;line-height:20px;text-wrap:pretty}.aft .subq .sub svg{vertical-align:-3px}
.aft .tp .undol{margin-left:auto;padding:0 12px;font-weight:600}
.aft .acts{padding:4px 4px 4px 0}.aft .acts.why{gap:6px}
.fact .v small,.line span,.ro span,.ipanel .say{text-wrap:balance}
.ipanel .say.mvhint,.ipanel .q .qsub{text-wrap:balance}
.dnote li span{text-wrap:pretty}
.dev-ipad .aft{font-size:17px}.dev-ipad .aft .sub{font-size:14px}
/* the bottom bar (kit BottomBar, as Groceries' phone add box): in the flow under the list, so it rides the keyboard */
.bbar{background:var(--card);border-top:1px solid var(--bcard);padding:8px 12px;min-width:0}
/* narrow: the follow-up keeps the notice look (Groceries' .banner: notice colour, 12 radius, edge) on the page tan, and
   the bar casts a soft edge up so the list clearly ends above it; no toast stacks on it (panel 3 visual 1, 4; fit 1) */
.bbar.aftbar{background:var(--page);border-top:1px solid var(--bcard);box-shadow:0 -6px 14px -8px var(--bar-lift);padding:8px 12px 12px}
.bbar .aft{max-width:760px;margin:0 auto}
.dev-phone .bbar{padding-bottom:26px}
/* every narrow bottom bar casts the same soft edge up and starts 12 px down, so the add box reads as its own bar, not a
   card lying on the list (panel 4 visual 3) */
@media (max-width:1100px){.bbar{background:var(--page);box-shadow:0 -6px 14px -8px var(--bar-lift);padding-top:12px}
  /* the list fades into the page tan for its last 28 px above a bottom bar, so no half line shows at the seam (panel 5 visual 1) */
  /* round 17: fully clear for the last 20 px, so no ghost word shows at the seam (panel 6 visual 8) */
  .body:has(>.bbar)>.scroll{--fz:linear-gradient(#000 calc(100% - 54px),rgba(0,0,0,.35) calc(100% - 44px),transparent calc(100% - 30px));-webkit-mask-image:var(--fz);mask-image:var(--fz)}}

/* Add Food: one line (Q3), shown back as a row, then Add. The hand form is one tap away. */
.addcard{padding:16px;margin-bottom:16px}
.addhd{display:flex;align-items:center;gap:8px;margin:-4px -4px 12px 0}
.addhd h3{margin:0;font-size:16px;font-weight:600;flex:1}
.addhd .x{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;color:var(--ink2)}
.addhd .x:hover{box-shadow:var(--hover)}
.addrow{display:flex;align-items:center;gap:8px}
.add{flex:1;min-width:0;display:flex;align-items:center;gap:12px;height:52px;padding:0 4px 0 16px;background:var(--card);border:1px solid var(--ink2);border-radius:8px}
.add>svg{color:var(--muted)}
.add input{flex:1;border:0;background:none;outline:none;font-size:16px;height:100%;min-width:0}
.add input::placeholder{color:var(--muted)}
.add:focus-within{border:2px solid var(--sage-text);padding:0 3px 0 15px}
.mic{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;color:var(--sage-text);flex:none}
.mic:hover{box-shadow:var(--hover)}
.result{display:flex;align-items:center;gap:12px;margin-top:12px;padding:8px 8px 8px 16px;border-radius:8px;background:var(--panel);border:1px solid var(--folder-line);min-height:64px}
.result .m{flex:1;min-width:0}.result .nm{font-size:16px;font-weight:500}.result .nm b{font-weight:400;color:var(--ink2)}
.result .sub{font-size:13px;color:var(--ink2);margin-top:2px}
.result .sub .g{color:var(--amber-text);font-weight:600}
.result .also{display:block;font-size:13px;color:var(--muted)}
.result.added{background:var(--sage-light);border-color:transparent}.result.added>svg{color:var(--sage-text)}
.result .nm,.result .sub{display:block}
.resultph{margin-top:12px;min-height:64px;border-radius:8px;border:1px solid var(--folder-line);display:flex;align-items:center;padding:0 16px;font-size:13px;color:var(--muted);background:var(--panel)}
.addfoot{display:flex;align-items:center;gap:12px;margin-top:12px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.addfoot .sp{flex:1}
.kept{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--sage-text)}.hform .kept{grid-column:1/-1;margin:0}
.linkbtn{height:44px;border-radius:8px;padding:0 8px;margin-left:-8px;font-size:15px;font-weight:600;color:var(--sage-text);display:inline-flex;align-items:center;gap:6px}
.linkbtn:hover{box-shadow:var(--hover)}

/* kit Popover and Dialog */

/* ================= THE DATE PICKER (B4), the ONE shared part =================
   This block is the standard's look. The date picker mockup AND Kitchen v3 are built from this one file
   (scratch datepicker/dp.css, inlined by both build.py), so they can never look different. */
/* the three colours this part adds to the kit's tokens (BRIEF "For the app build") */
:root{--dp-off:#8C897F;--dp-strike:rgba(84,82,74,.6);--dp-dim:rgba(45,33,22,.12)}
/* 1. The date field: one outline (the kit field, 52 tall), the typed box on the left and the Calendar button on the
   right, split by one thin line. Focus and error colour the whole outline, the split line too. */
.dgrp{display:flex;align-items:stretch;width:100%;max-width:308px;height:52px;border:1px solid var(--ink2);border-radius:8px;background:var(--card);position:relative;transition:box-shadow .2s var(--ease),border-color .2s var(--ease)}
/* in a form the field fills the form's column, like Name (a change panel keeps it at 308) */
.dgrp.dp-full{max-width:none}
.dgrp:has(input:focus){border-color:var(--sage-text);box-shadow:0 0 0 1px var(--sage-text)}
.dgrp.dp-bad,.dgrp.dp-bad:has(input:focus){border-color:var(--urgent-text);box-shadow:0 0 0 1px var(--urgent-text)}
.dgrp:has(input:focus) .dpbtn{border-left-color:var(--sage-text)}.dgrp.dp-bad .dpbtn,.dgrp.dp-bad:has(input:focus) .dpbtn{border-left-color:var(--urgent-text)}
.dgrp .dfield{display:flex;align-items:center;flex:1;min-width:0;height:auto;max-width:none;border:0;border-radius:7px 0 0 7px;padding:0 14px;gap:0;background:none;transition:background .2s var(--ease)}
.dgrp .dfield:focus-within{border:0;padding:0 14px}
.dgrp .dfield input{flex:1;min-width:0;border:0;outline:none;background:none;font-size:16px;height:100%;color:var(--ink)}
.dgrp .dfield input::placeholder{color:var(--muted)}
/* the iPad type tier (as the pages' other fields) */
.dev-ipad .dgrp .dfield input{font-size:17px}
.dpbtn{flex:none;display:flex;align-items:center;gap:6px;padding:0 14px 0 12px;border-left:1px solid var(--ink2);border-radius:0 7px 7px 0;background:var(--chip-warm);color:var(--subbar-date);font-size:15px;font-weight:600;position:relative;transition:background .2s var(--ease),color .2s var(--ease),border-color .2s var(--ease)}
.dpbtn svg.i{width:20px;height:20px;color:currentColor}
.dpbtn:active{box-shadow:var(--press)}
@media (hover:hover){.dpbtn:hover{box-shadow:var(--hover)}}
/* open: a light green tint (not a fill), so the page's Save stays the loudest green */
.dpbtn[aria-expanded=true]{background:var(--sage-light);color:var(--sage-dark)}
/* the button's focus ring stays inside the button, never across the split into the box */
.dpbtn:focus-visible,.dpbtn.dp-kf{outline:none;box-shadow:inset 0 0 0 2px var(--sage-text)}
/* compact (Kitchen's phone bottom-bar hand form only): 44 tall, the button shows only its icon (44 wide) */
.dgrp.dp-sm{height:44px}.dgrp.dp-sm .dpbtn{width:44px;padding:0;justify-content:center}.dgrp.dp-sm .dpbtn .dp-lb{display:none}
/* the confirm flash after a calendar pick (700 ms: green, held 35%, then back) */
.dgrp.dp-flash .dfield{animation:dpflash .7s var(--ease)}
@keyframes dpflash{0%,35%{background:var(--chip-on)}100%{background:transparent}}
/* a picked date not saved yet keeps a light green box until the page's Save (the Save itself stays sage) */
.dgrp.dp-dirty .dfield{background:var(--sage-light)}
.dgrp.dp-dirty.dp-flash .dfield{animation-name:dpflashd}
@keyframes dpflashd{0%,35%{background:var(--chip-on)}100%{background:var(--sage-light)}}
/* the read-out under the field: one line, the same form on every page */
.dread{display:block;font-size:13px;color:var(--ink2);margin-top:-4px;min-height:19px;text-wrap:pretty}
.dread.dp-bad{color:var(--urgent-text);font-weight:600}
.dread .dp-pend{color:var(--sage-text);font-weight:600;white-space:nowrap}
.dread .dp-why{color:var(--muted)}.dread .dp-nw{white-space:nowrap}
.dread.dp-hint{color:var(--muted)}

/* 2. Our calendar: a popover on computer and iPad, a bottom sheet on the phone. Same parts in both. */
.dp{--cw:44px;--ch:44px;--gap:2px;--pad:12px;position:fixed;z-index:80;background:var(--card);border:1px solid var(--bcard);border-radius:12px;box-shadow:var(--shadow-float);padding:8px var(--pad) 4px;width:calc(var(--cw)*7 + var(--gap)*6 + var(--pad)*2 + 2px);transform-origin:top left;color:var(--ink);font-size:15px;line-height:1.45}
.dp[hidden]{display:none}
.dp.dp-up{transform-origin:bottom left}
/* iPad: wider days for fingers (48), rows stay 44 so the calendar fits under the date on an upright iPad */
.dev-ipad .dp{--cw:48px;--ch:44px}
.dph{display:flex;align-items:center;gap:4px;margin:0 -2px 4px 0}
/* the month name is a real (tan) button: tap it for the months */
.dpm{height:44px;border-radius:8px;padding:0 10px 0 12px;display:inline-flex;align-items:center;gap:6px;font-size:16px;font-weight:600;color:var(--ink);white-space:nowrap;background:var(--chip-warm);border:1px solid var(--chip-warm-edge);min-width:0}
.dpm svg{color:var(--ink2);transition:transform .2s var(--ease);flex:none}
.dpm[aria-expanded=true]{background:var(--sage-light);border-color:var(--sage-text)}
.dpm[aria-expanded=true] svg{transform:rotate(180deg)}
/* month view: the range name is longer, so it sets a little smaller; the arrows and the close x never move */
.dp.dp-mview .dpm{font-size:14px;padding:0 8px 0 10px;gap:4px}
.dph .dp-sp{flex:1}
.dpn{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;color:var(--ink2);flex:none}
.dpn:disabled{opacity:.45;cursor:default}
@media (hover:hover){.dpm:hover,.dpn:not(:disabled):hover,.dptoday:hover{box-shadow:var(--hover)}}
.dpm:active,.dpn:not(:disabled):active,.dptoday:active{box-shadow:var(--press)}
/* the day area runs out to the calendar's edges, so a sliding month is never cut inside the padding */
.dpbody{height:calc(var(--ch)*6 + var(--gap)*5 + 24px);position:relative;overflow:hidden;margin:0 calc(var(--pad)*-1);padding:0 var(--pad)}
.dpview{position:absolute;top:0;bottom:0;left:var(--pad);right:var(--pad)}
.dpview.dp-d{top:24px}
.dpwk{display:grid;grid-template-columns:repeat(7,var(--cw));column-gap:var(--gap);height:24px;align-items:center;transition:opacity .2s var(--ease)}
.dpwk span{text-align:center;font-size:13px;font-weight:500;color:var(--muted)}
.dpbody.dp-months .dpwk{opacity:0}
.dpgrid{border-collapse:separate;border-spacing:var(--gap);margin:calc(var(--gap)*-1);table-layout:fixed;width:calc(var(--cw)*7 + var(--gap)*8)}
/* real column headers for screen readers: the cells stay in the table, their words are visually hidden (no font-size 0) */
.dpgrid thead th{padding:0;height:0;border:0}
.dpgrid td{width:var(--cw);height:var(--ch);padding:0;text-align:center;vertical-align:middle;border-radius:8px;font-size:15px;font-weight:500;color:var(--ink);cursor:pointer;position:relative;transition:background .2s var(--ease)}
/* each day and month is a native button inside its grid cell (VoiceOver reads it as a button) */
.dpgrid td>button,.dpmonths td>button{display:block;width:100%;height:100%;border-radius:8px;font:inherit;color:inherit;text-decoration:inherit;outline-offset:-3px;cursor:inherit;background:none;border:0;padding:0}
.dev-ipad .dpgrid td{font-size:17px}
/* days of the month before and after: smaller and muted, still pickable (fills the sixth row; Dec 1 from late Nov) */
.dpgrid td.dp-o{color:var(--muted);font-weight:400;font-size:13px}
.dev-ipad .dpgrid td.dp-o,.dp.dpsheet .dpgrid td.dp-o{font-size:15px}
.dpgrid td.dp-today{font-weight:700}
.dpgrid td.dp-today::after{content:"";position:absolute;left:50%;bottom:5px;width:18px;height:3px;margin-left:-9px;border-radius:2px;background:var(--sage-text)}
/* picked: the kit Chip's selected look exactly (chip-on fill, 1 px selected-border edge, bold); it lands at once
   (no fade), so the 80 ms beat before the close shows it solid */
.dpgrid td.dp-pk{background:var(--chip-on);box-shadow:inset 0 0 0 1px var(--sage-text);font-weight:700;color:var(--ink);transition:none}
/* today that is also picked: the bar goes full ink, so "which day is today" still reads inside the green */
.dpgrid td.dp-pk.dp-today::after{background:var(--sage-dark);width:22px;margin-left:-11px}
/* off: readable (about 3:1) and crossed out, so it never leans on colour alone */
.dpgrid td.dp-off{color:var(--dp-off);font-weight:400;text-decoration:line-through;text-decoration-thickness:1px;text-decoration-color:var(--dp-strike);cursor:default}
@media (hover:hover){.dpgrid td:not(.dp-off):not(.dp-pk):hover{box-shadow:var(--hover)}.dpgrid td.dp-pk:hover{box-shadow:inset 0 0 0 1px var(--sage-text),var(--hover)}}
.dpgrid td:not(.dp-off):active{box-shadow:var(--press)}
/* keyboard focus: a dark ring, shown only when the keyboard is in use (never on a touch or mouse open) */
.dpgrid td>button:focus,.dpmonths td>button:focus{outline:none}
.dp.dp-kbd .dpgrid td>button:focus,.dpgrid td.dp-kf>button,.dp.dp-kbd .dpmonths td>button:focus,.dpmonths td.dp-kf>button{outline:2px solid var(--ink);outline-offset:-3px}

.dpmonths{border-collapse:separate;border-spacing:6px;margin:-6px;width:calc(100% + 12px);height:calc(100% + 12px);table-layout:fixed}
.dpmonths td{border-radius:8px;text-align:center;vertical-align:middle;cursor:pointer;background:var(--panel);padding:0;position:relative}
.dpmonths td b{display:block;font-size:16px;font-weight:600;white-space:nowrap}
.dpmonths td small{display:block;font-size:13px;color:var(--ink2);margin-top:3px;white-space:nowrap}

.dp:not(.dpsheet) .dpmonths td small{font-size:12px}.dev-ipad .dp .dpmonths td small{font-size:13px}
.dpmonths td.dp-now::after{content:"";position:absolute;left:50%;bottom:6px;width:18px;height:3px;margin-left:-9px;border-radius:2px;background:var(--sage-text)}
.dpmonths td.dp-pk{background:var(--chip-on);box-shadow:inset 0 0 0 1px var(--sage-text);transition:none}
/* this month and picked: the same full-ink, wider bar as a day */
.dpmonths td.dp-pk.dp-now::after{background:var(--sage-dark);width:22px;margin-left:-11px}
.dpmonths td.dp-off{cursor:default;background:transparent}
.dpmonths td.dp-off b,.dpmonths td.dp-off small{color:var(--dp-off);font-weight:400}.dpmonths td.dp-off b{text-decoration:line-through;text-decoration-color:var(--dp-strike)}
@media (hover:hover){.dpmonths td:not(.dp-off):hover{box-shadow:var(--hover)}.dpmonths td.dp-pk:hover{box-shadow:inset 0 0 0 1px var(--sage-text),var(--hover)}}
/* the foot: the Today key, the line saying which days are off and why, and This Month (shown when you are away);
   in the month view: the line and Back to Days */
.dpf{display:flex;align-items:center;gap:10px;margin-top:6px;padding-top:6px;border-top:1px solid var(--brow);min-height:54px}
.dpnote{flex:1;min-width:0;font-size:13px;color:var(--ink2);line-height:1.35}

.dpkey i{width:18px;height:3px;border-radius:2px;background:var(--sage-text)}
.dpbody.dp-months~.dpf .dpkey{display:none}
.dptoday{height:44px;border-radius:8px;padding:0 12px;font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;flex:none;background:var(--chip-warm);border:1px solid var(--chip-warm-edge)}
/* a hidden This Month gives its room to the line (no held-empty slot, so the line never wraps early) */
.dptoday.dp-hide{display:none}
/* the close x on the popover, after a thin divider (the sheet has its own in its title row); kept in the month view */
.dph .dpx{margin-left:2px;position:relative}
.dph .dpx::before{content:"";position:absolute;left:-3px;top:12px;bottom:12px;width:1px;background:var(--brow)}
/* computer and iPad: a light warm dim over the page area behind the popover (the app's shadow brown at 12%; the
   wood header, tan page bar and rail stay as they are), with a hole where the date's panel is, so that panel (its
   chips, box, read-out and Save) stays bright and live under the popover */
.dpscrim{position:fixed;inset:0;background:var(--scrim);z-index:79}
.dpscrim[hidden]{display:none}
.dpscrim.dp-lite{background:var(--dp-dim);z-index:78}
.dpnow{font-weight:500;color:var(--ink2);font-size:15px;margin-left:8px}
/* phone: a bottom sheet with the kit Sheet's grab bar (drag down to close), a title saying what you are choosing and
   the date with how far it is, and a close x; the foot sits at the bottom, as on the popover */
.dp.dpsheet{left:0;right:0;bottom:0;top:auto!important;width:auto;border:0;border-radius:16px 16px 0 0;--pad:16px;padding:0 var(--pad) calc(4px + env(safe-area-inset-bottom));--cw:calc((100vw - 44px)/7);--ch:48px;transform-origin:bottom center}

.dptop{display:flex;align-items:center;gap:8px;padding:0 0 6px;margin-bottom:6px;border-bottom:1px solid var(--brow);touch-action:none;min-height:52px}
.dptop h2{margin:0;font-size:18px;font-weight:600;line-height:1.3}

<script>
/* =====================================================================================================
   THE DATE PICKER (B4): the ONE shared part. Both the date picker mockup and Kitchen v3 are built from this
   one file (scratch datepicker/dp.js, inlined by both build.py), so the chips, lines, "how far" words, look,
   motion and keys can never differ between them.
   A page gives: its fields (DP.field(id, DP.PAGES.x)), [data-dppanel] on each date panel or form, data-save="<id>"
   on that panel's Save, data-dpscroll on its scroll boxes, and its hooks (DP.H: commit, filled, why, changed, edge).
   ===================================================================================================== */
const DP=(()=>{
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const ic=(id,c='i')=>`<svg class="${c}" aria-hidden="true"><use href="#${id}"/></svg>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RM=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
const PHONE=()=>innerWidth<=640;

/* ---------- dates: plain local year, month, day (never a UTC time). Today is Wed, Nov 25, 2026 in both mockups ---------- */
const TODAY=new Date(2026,10,25);
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONL=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],DAYSL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const WK=['Su','Mo','Tu','We','Th','Fr','Sa'];
const d0=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const addD=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const addM=(d,n)=>{const t=new Date(d.getFullYear(),d.getMonth()+n,1);t.setDate(Math.min(d.getDate(),dim(t.getFullYear(),t.getMonth())));return t};
const same=(a,b)=>!!a&&!!b&&a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
// "the same saved value": two dates on one day, or no date and no date
const eqD=(a,b)=>(!a&&!b)||same(a,b);
const sameM=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth();
const mIdx=d=>d.getFullYear()*12+d.getMonth();
const dd=d=>Math.round((d0(d)-TODAY)/864e5);
const ofN=n=>n==null?null:addD(TODAY,n);
// a date more than about 5 months away says its year, so "Sep 21" never reads as a date already gone
const yr=d=>Math.abs(dd(d))>150?`, ${d.getFullYear()}`:'';
const fmtBox=d=>`${MON[d.getMonth()]} ${d.getDate()}${yr(d)}`;
const fmtShort=d=>`${DAYS[d.getDay()]}, ${MON[d.getMonth()]} ${d.getDate()}${yr(d)}`;
const fmtLong=d=>`${DAYSL[d.getDay()]}, ${MON[d.getMonth()]} ${d.getDate()}${yr(d)}`;
const fmtAria=d=>`${DAYSL[d.getDay()]}, ${MONL[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
// the read-out's form: "Wednesday, Dec 2"; a short weekday once the year shows ("Mon, Jun 14, 2027")
const fmtRead=d=>(yr(d)?fmtShort(d):fmtLong(d));
const iso=d=>`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
const unIso=s=>{const [y,m,x]=s.split('-').map(Number);return new Date(y,m-1,x)};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);

/* ONE "how far" helper: the read-out, the sheet title, the keyboard foot, the month tiles, and Kitchen's rows, item
   pane and Move panel. Days to 13; weeks (exact, or days to 3 weeks) to 7 weeks; then months to 17 months; then years by
   halves. "about" whenever it rounds; the same day of a later month (or the last day, when that month is shorter) is exact. */
const yrs=y=>`${String(y).replace('.5','½')} year${y===1?'':'s'}`;
function spanM(k,exact){const a=Math.abs(k);return a===12?'1 year':a<18?`${a} month${a===1?'':'s'}`:a%12===0&&exact?yrs(a/12):yrs(Math.round(a/12*2)/2)}
function rel(d){if(typeof d==='number')d=ofN(d);const n=dd(d);if(n===0)return 'today';if(n===1)return 'tomorrow';if(n===-1)return 'yesterday';const a=Math.abs(n);let s;
  const km=(d.getFullYear()-TODAY.getFullYear())*12+d.getMonth()-TODAY.getMonth();
  // the same day of a later month is a whole number of months; so is a clamped month end (Jan 31 + 1 month = Feb 28)
  const exactM=d.getDate()===TODAY.getDate()||(d.getDate()===dim(d.getFullYear(),d.getMonth())&&TODAY.getDate()>d.getDate());
  if(km&&exactM&&a>=28){const k=Math.abs(km);s=(k>=18&&k%6!==0?'about ':'')+spanM(k,true)}
  else if(a<14)s=`${a} days`;
  else if(a<50)s=a%7===0?`${a/7} weeks`:a<=21?`${a} days`:`about ${Math.round(a/7)} weeks`;
  else{const k=Math.round(a/30.44)*Math.sign(n);const t=spanM(k,false);s='about '+t}
  return n>0?`in ${s}`:`${s} ago`}
// a month tile: whole months from this one, worded by the same helper ("in 7 months", "in 1 year", "about 1½ years")
function relM(y,m){const n=y*12+m-mIdx(TODAY),a=Math.abs(n);if(n===0)return 'this month';if(n===1)return 'next month';if(n===-1)return 'last month';
  const s=(a>=18&&a%6!==0?'about ':'')+spanM(n,true);return n>0?`in ${s}`:`${s} ago`}

/* ---------- the per-page settings (BRIEF "Per-page settings"), as data both mockups read ---------- */
// month chips are calendar months (In 3 Months on Nov 25 is Feb 25), so the read-out says "in 3 months" exactly
const MD=k=>dd(addM(TODAY,k));
const CHIPS={Fridge:[['Today',0],['Tomorrow',1],['In 3 Days',3],['In a Week',7],['In 2 Weeks',14]],
  Freezer:[['In a Week',7],['In a Month',MD(1)],['In 3 Months',MD(3)],['In 6 Months',MD(6)]],
  Pantry:[['In a Month',MD(1)],['In 3 Months',MD(3)],['In 6 Months',MD(6)],['In a Year',MD(12)]],
  Leftover:[['Today',0],['Tomorrow',1],['In 2 Days',2],['In 3 Days',3],['In 4 Days',4]]};
// a freezer or pantry food's date is a guess: it may be left empty (No Date); a fridge food or a leftover always has one
const NODATE=p=>p==='Freezer'||p==='Pantry';
const chipsAt=p=>NODATE(p)?[...CHIPS[p],['No Date',null]]:CHIPS[p];
// the two lines every date panel says, in one pattern
const SAY={change:'Tap a quick date to save it.',move:'Tap a quick day to move it.',type:w=>`Or type a date or use the calendar, then ${w}:`};
const USEBY={label:'Use by',title:'Choose a use-by date',dir:'future',min:TODAY,max:addM(TODAY,60),note:'Past days are off.',range:'Up to 5 years ahead.',noneNote:'no use-soon reminder'};
/* every row of the BRIEF's "Per-page settings" (round 16: the whole table is data here, chips and Save words too, so a
   page passes its row and nothing else). kind: change (a chip saves at once) or form (a chip fills; the form saves).
   chips: a list of [words, days from today] (null days = No Date), or a function of the page's own date */
const wdN=n=>DAYS[addD(TODAY,n).getDay()];
// Plan: Today, Tomorrow, the two days after the meal's own day (by weekday name, never Today or Tomorrow again; a meal
// a week or more away says their dates), and A Week Later (the meal's day + 7) while that is inside the year
// (round 17: every chip stays inside the year, and a day a week or more out says its date, so "Wed" never names a
// Wednesday a week after today's)
const inYear=n=>addD(TODAY,n)<=addM(TODAY,12);
function planChips(meal){const m=dd(meal),out=[['Today',0],['Tomorrow',1]],far=m>=5;
  for(let n=m+1;out.length<4&&n<=m+7;n++){if(n<=1)continue;if(!inYear(n))break;out.push([far?fmtShort(addD(TODAY,n)):wdN(n),n])}
  if(inYear(m+7))out.push(['A Week Later',m+7]);return out}
// Groceries: Today, Tomorrow, This Sat (the coming Saturday, left out when it is today or tomorrow), A Week Later (the
// saved trip day + 7, as Plan's is the meal's day + 7; with no trip day saved yet, today + 7). A Week Later is left out
// when it is Today, Tomorrow or This Sat already, or past the year
function tripChips(trip){const sat=(6-TODAY.getDay()+7)%7,b=trip?dd(trip):0;return [['Today',0],['Tomorrow',1],...(sat>1?[['This Sat',sat]]:[]),...(b+7>1&&b+7!==sat&&inYear(b+7)?[['A Week Later',b+7]]:[])]}
const PAGES={useby:{...USEBY,kind:'change',save:'Save Date',chips:p=>chipsAt(p)},
  leftover:{...USEBY,noneNote:undefined,title:'Choose a use-by date for the leftover',kind:'change',save:'Save Date',chips:()=>CHIPS.Leftover},
  hand:{...USEBY,kind:'form',save:'Add It',chips:p=>chipsAt(p)},
  leftoverAdd:{...USEBY,noneNote:undefined,title:'Choose a use-by date for the leftover',kind:'form',save:'Add Leftover',chips:()=>CHIPS.Leftover},
  madeOn:{label:'Made on',title:'Choose the day you made it',dir:'past',min:addM(TODAY,-1),max:TODAY,note:'Up to a month back. Later days are off.',range:'Up to a month back.',early:'That is more than a month ago.',kind:'form',save:'Add Leftover',chips:()=>[['Today',0],['Yesterday',-1],['2 Days Ago',-2]]},
  madeOnChange:{label:'Made on',title:'Choose the day you made it',dir:'past',min:addM(TODAY,-1),max:TODAY,note:'Up to a month back. Later days are off.',range:'Up to a month back.',early:'That is more than a month ago.',kind:'change',save:'Save',chips:()=>[['Today',0],['Yesterday',-1],['2 Days Ago',-2]]},
  plan:{label:'Move to',title:'Choose a day for the meal',dir:'future',min:TODAY,max:addM(TODAY,12),note:'Up to a year ahead. Past days are off.',range:'Up to a year ahead.',kind:'change',save:'Move It',chips:planChips},
  trip:{label:'Shop on',title:'Choose a shopping day',dir:'future',min:TODAY,max:addM(TODAY,12),note:'Up to a year ahead. Past days are off.',range:'Up to a year ahead.',kind:'change',save:'Save',chips:tripChips},
  cooked:{label:'Cooked on',title:'Choose the day you cooked it',dir:'past',min:addM(TODAY,-24),max:TODAY,note:'Up to 2 years back. Later days are off.',range:'Up to 2 years back.',early:'That is more than 2 years ago.',kind:'change',save:'Save',chips:()=>[['Today',0],['Yesterday',-1],['2 Days Ago',-2],['3 Days Ago',-3]]},
  remind:{label:'Remind me on',title:'Choose a reminder day',dir:'future',min:TODAY,max:addM(TODAY,24),note:'Up to 2 years ahead. Past days are off.',range:'Up to 2 years ahead.',kind:'form',save:'Save Reminder',chips:()=>[['Tomorrow',1],['In a Week',7],['In a Month',MD(1)]]},
  remindChange:{label:'Remind me on',title:'Choose a reminder day',dir:'future',min:TODAY,max:addM(TODAY,24),note:'Up to 2 years ahead. Past days are off.',range:'Up to 2 years ahead.',kind:'change',save:'Save',chips:()=>[['Tomorrow',1],['In a Week',7],['In a Month',MD(1)]]}};

/* ---------- reading a typed date ---------- */
const NOTREAD='Not a date yet. Try: Friday, Dec 2 or 12/2';
const KEEPTYPING='Keep typing, like Dec 2, Friday or 12/2';
// (round 17) a field that leans back (Made on, Cooked on) gives a past example: "Dec 2" there would mean last December
const PEX=addD(TODAY,-5),PEXB=`${MON[PEX.getMonth()]} ${PEX.getDate()}`,PEXN=`${PEX.getMonth()+1}/${PEX.getDate()}`;
const NOTREAD_P=`Not a date yet. Try: Yesterday, ${PEXB} or ${PEXN}`,KEEPTYPING_P=`Keep typing, like ${PEXB}, Yesterday or ${PEXN}`;
const notRead=f=>f&&f.dir==='past'?NOTREAD_P:NOTREAD,keepTyping=f=>f&&f.dir==='past'?KEEPTYPING_P:KEEPTYPING;
const isNR=s=>s===NOTREAD||s===NOTREAD_P;
const NUM={a:1,an:1,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,twelve:12};
const monOf=s=>{const i=MON.findIndex(m=>s.startsWith(m.toLowerCase()));return i<0||(s.length>3&&!MONL[i].toLowerCase().startsWith(s)&&!(i===8&&s==='sept'))?-1:i};
// weekday words: whole names and the usual short forms only ("monkey" and "month" are not Monday)
const WDW={sun:0,sunday:0,mon:1,monday:1,tue:2,tues:2,tuesday:2,wed:3,weds:3,wednesday:3,thu:4,thur:4,thurs:4,thursday:4,fri:5,friday:5,sat:6,saturday:6};
const WDRE='(sunday|sun|monday|mon|tuesday|tues|tue|wednesday|weds|wed|thursday|thurs|thur|thu|friday|fri|saturday|sat)';
// which way a date is out of range, in the words the foot uses
const lowWhy=f=>f.dir==='past'?f.range:'Past days are off.',highWhy=f=>f.dir==='past'?'Later days are off.':f.range;
// o.typing: the box is still being typed in, so a year "20" or "19" is the start of a 4-digit year, not 2020
function parseDate(raw,f,o={}){let t=raw.trim().toLowerCase().replace(/\./g,'').replace(/\s+/g,' ');if(!t)return {d:null};

// the same words in the box and in the place sections (fit 7, must 3)

/* ---------- folder tabs: Kitchen's places, plus Household when a non-food staple exists ---------- */
function stTabBtn(t,ix,total,n){const on=S.stTab===t;const w=Math.ceil(measure(t,'600 15px "IBM Plex Sans"')+(n==null?0:measure(' '+(n===''?'00':n),'500 13px "IBM Plex Sans"')))+6;

/* ---------- rows: one layout in the box and in the place sections ---------- */
function stRow(i,box){const sel=S.stOpen===i.id&&!NARROW();const st=i.staple,s=stStat(i);
  const sub=[];if(box)sub.push(`<span class="pl">${esc(stPlaceOf(i))}</span>`);

  return `<div class="strw ${cart?'hascart':''}"><button class="row strow ${sel?'picked':''}" data-a="stopen" data-id="${i.id}" data-row="${i.id}" aria-current="${sel}"><span class="m"><span class="nm">${esc(i.n)}</span><span class="sub">${sub.join('<span aria-hidden="true">·</span>')}</span></span><span class="r">${i.hh?'':`<span class="amt ${i.rough||i.gone?'rough':''}">${esc(stAmt(i))}</span>`}${stWord(i)}${cart?`<span class="cartph" aria-hidden="true">${cl}</span>`:''}</span>${goSlot(i)}</button>${cb}</div>`}
// place each row's "Add to List" exactly on its reserved space (under the status, inside the right column)
function stPlaceCarts(){document.querySelectorAll('.strw.hascart').forEach(w=>{const ph=w.querySelector('.cartph'),b=w.querySelector('.rowcart');if(!ph||!b)return;
  const a=ph.getBoundingClientRect(),o=w.getBoundingClientRect();b.style.left=(a.left-o.left)+'px';b.style.top=(a.top-o.top)+'px';b.style.width=a.width+'px'})}
// the box on All (like Use Soon): low, out, low after a planned meal, skipped this trip, or put on by hand
function stLowBox(xs){const L=xs.filter(inBox);if(!L.length)return'';const shut=!!S.stShut.low;const onl=L.filter(onList).length,sk=L.length-onl;
  const hint=shut?`${esc(L[0].n)}${L.length>1?` +${L.length-1}`:''}`:PHONE()?(sk?`${sk} skipped`:''):`${onl} on the grocery list${sk?` · ${sk} skipped`:''}`;
  // up to 6 rows before "Show N More" on every size (friction 8)

  return `<section class="soon stlow ${shut?'shut':''}" aria-label="Low or on the list"><div class="shd tg"><button class="shb" id="sph-low" data-a="stfold" data-sec="low" aria-expanded="${!shut}" aria-controls="sgb-low">${ic('right','i sm chev')}${ic('jar','i sm')}<span class="ttl">Low or On the List · ${L.length}<span class="vh"> ${shut?'closed':'open'}</span></span>${hint?`<span class="hint">${hint}</span>`:''}</button></div>
    <div class="sbody" id="sgb-low" ${shut?'hidden':''}>${shut?'':L.slice(0,cut).map(i=>stRow(i,true)).join('')+(L.length>cut?`<button class="morebtn" data-a="stlowmore">Show ${L.length-cut} More ${ic('down','i sm')}</button>`:'')}</div></section>`}
// the find box and the Show row stick under the tan bar while the list scrolls (must 6); the phone always shows the box
function stTool(nAll,nBox,nOk,chips){
  const box=`<label class="find stfind">${ic('search','i sm')}<input id="stq" placeholder="Find a staple" value="${esc(S.stFind)}" aria-label="Find a staple" autocomplete="off">${S.stFind?`<button class="clr" data-a="stqclr" aria-label="Clear">${ic('x','i sm')}</button>`:''}</label>`;
  const fc=(k,l,n)=>`<button class="chip cmp ${S.stFilter===k?'on':''}" role="radio" aria-checked="${S.stFilter===k}" data-a="stfilter" data-f="${k}">${l}<span class="n">${n}</span></button>`;
  const filt=chips?`<div class="stfilt"><span class="lab" id="stshow">Show</span><span class="chips" role="radiogroup" aria-labelledby="stshow">${fc('all','All',nAll)}${fc('low','Low or On the List',nBox)}${S.stTab==='Household'?'':fc('ok','Stocked',nOk)}</span></div>`:'';
  return `<div class="sttool" id="sttool">${box}${filt}</div>`}
const ST_FOOT=`<div class="lfoot">${''}<span>Staples go on the grocery list by themselves when they get low, and meals on your plan count too. Household ones you put on yourself.</span></div>`;
function stListCard(){const f=S.stFind.trim().toLowerCase(),all=stAll(),ed=!S.offline;
  let xs=all.filter(i=>stIn(i,S.stTab));if(f)xs=xs.filter(i=>i.n.toLowerCase().includes(f));

  const groups=places.map(p=>{const rs=ys.filter(i=>S.stTab==='All'?i.p===p:true);if(!rs.length)return'';const shut=folds&&!!S.stShut[p];

  let body=groups;
  if(!ys.length){if(f&&!nAll){const T=capF(S.stFind.trim());body=`<div class="stnone"><b>No staple called "${esc(S.stFind.trim())}".</b>Check the spelling, or make it one.<br><button class="btn tan ${ed?'':'off'}" data-a="stmakefind" ${ed?'':'aria-disabled="true"'}>${ic('plus')}Make "${esc(T)}" a Staple</button></div>`}
    else if(S.stFilter==='low')body=`<div class="stnone"><b>Nothing is low or on the list.</b>Every counted staple here is stocked.<br><button class="btn tan" data-a="stfilter" data-f="all">Show All Staples</button></div>`;

/* ---------- one staple open: side pane (computer, iPad sideways) or its own page (iPad upright, phone) ---------- */
// "Last Times on the List" keeps the amount and unit used at the time (ease 5): the text is frozen when first read
function stHist(i){const st=i.staple;if(st.just)return st.histNew||[];if(!st.hist){const b=sBuyT(i);
    st.hist=i.hh?[['Nov 20',b,'Guest put it on, on the Kitchen iPad'],['Oct 30',b,'Sarah put it on']]:[['Nov 18',b,'by itself, it was low'],['Nov 4',b,'Sarah put it on'],['Oct 21',b,'by itself, it was low']]}
  return st.hist}
function stPane(i,page){const st=i.staple,s=stStat(i),off=S.offline,dis=off?'aria-disabled="true"':'';const t=byIdLive(i.twin);const nm=i.n.toLowerCase(),buy=esc(sBuyT(i));
  const ed=!!S.stEdit,ph=PHONE();stHist(i);
  const other=S.other&&S.other.id===i.id?`<div class="line who">${av(S.other.who)}<span><b>${S.other.who} changed this just now:</b> ${esc(S.other.what)}</span></div>`:'';
  const just=S.stJust===i.id;let status='';
  // round 7 (job 3, ease 3): a staple on the list says so and links there, "On the grocery list · See List ›"
  const see=`<button class="inl" data-a="stgolist" data-id="${i.id}">See List${ic('right','i sm')}</button>`;
  // an in-place line, never a toast, while the staple is open (fit 3, ease 3); round 7 (ease 2): after Save it says what

      :v.nowOff?`It isn't low now, so it came off the grocery list (nobody had changed that row).`
      :v.wasOn?(v.buyWas===sBuyT(i)?`The grocery list still says ${buy}.`:`The grocery list now says ${buy} (it said ${esc(v.buyWas)}).`)
      :`It isn't low, so it's not on the grocery list.`;
    status=`<div class="line okl">${ic('check','i sm')}<span><b>Saved.</b> ${what}${onList(i)?' '+see.replace('class="inl"','class="inl in"'):''}</span>${!off?`<button class="undol" data-a="stsavedundo">Undo</button>`:''}</div>`}
  else if(s==='low')status=`<div class="line lowl stsl">${ic('cart','i sm')}<span><b>Running low</b> · On the grocery list: ${buy}</span>${see}</div>`;
  else if(s==='out')status=`<div class="line lowl stsl">${ic('cart','i sm')}<span><b>Out</b> · On the grocery list: ${buy}</span>${see}</div>`;
  else if(s==='plan')status=`<div class="line lowl stsl">${ic('cal','i sm')}<span><b>Low after ${esc(st.plan)}.</b> They use ${esc(qtyT(st.planUse,st.u||'count',i))}, so ${buy} is on the grocery list.</span>${see}</div>`;
  else if(s==='skip')status=`<div class="line who">${ic('info','i sm')}<span><b>Skipped this trip.</b> ${esc(st.skip.who)} took it off the grocery list ${esc(st.skip.when)}. If it's still low, it goes back on next trip.</span></div>`;
  else if(s==='listed')status=just&&!off?`<div class="line okl">${ic('check','i sm')}<span><b>On the grocery list:</b> ${buy}. You put it there just now. ${see.replace('class="inl"','class="inl in"')}</span><button class="undol" data-a="stlistundo" data-id="${i.id}">Undo</button></div>`
    :`<div class="line okl stsl">${ic('check','i sm')}<span><b>On the grocery list:</b> ${buy}</span>${see}</div>`;
  else if(s==='nc')status=`<div class="line who">${ic('info','i sm')}<span><b>Not counted.</b> The Kitchen doesn't keep count of ${esc(nm)}. Put it on the list when you're low, or tell Capture "out of ${esc(nm)}".</span></div>`;
  // job 4: a planned meal moved, so the row it put on came off (it was untouched); say so, with Undo
  else if(st.moved)status=`<div class="line who">${ic('cal','i sm')}<span><b>Off the grocery list.</b> ${esc(st.moved.meal)} moved to ${esc(st.moved.to)}, so ${esc(nm)} isn't low this week.</span>${!off?`<button class="undol" data-a="stmovedundo" data-id="${i.id}">Undo</button>`:''}</div>`;
  // phone, while editing: the editor takes the screen (visual 2); the amount at home moves into it

  const where=t?`<small>${esc(amt(i))} in the ${i.p}, ${esc(amt(t))} in the ${t.p}</small>`:`<small>In the ${i.p}</small>`;
  const seeK=!i.gone?`<small><button class="alsol" data-a="stkitchen" data-id="${i.id}">See in Kitchen${ic('right','i sm')}</button></small>`:'';

  const eyebrow=`<div class="eyebrow">${ic('jar','i sm tj')}Staple · ${esc(stPlaceOf(i))}</div>`;

  return `<section class="card pane ${page?'page':''} ${ed?'editing':''}" id="detail" aria-label="${esc(i.n)}">${page?`${eyebrow}<h2 class="pgname">${esc(i.n)}</h2>`:`<div class="hd"><div class="t">${eyebrow}<h2>${esc(i.n)}</h2></div><button class="x" data-a="stclose" aria-label="Close">${ic('x')}</button></div>`}

// the editor's bottom: the save error sits right above Cancel and Save

// Edit Staple: Low at (a stepper, or rough words) and Buy (a stepper and the food's own units); nothing saves until Save

const SUG=[{n:'Black beans',id:33,why:'Always at home',low:1,lu:'can',bq:2,bu:'can'},{n:'Lemons',id:9,why:'Bought most weeks',low:1,lu:'count',bq:3,bu:'count'},
 {n:'Sourdough bread',id:26,why:'Bought most weeks',low:1,lu:'loaf',bq:1,bu:'loaf'},{n:'Sugar',id:45,why:'Always at home',low:1,lu:'lb',bq:4,bu:'lb'},
 {n:'Toilet paper',hh:1,why:'On 6 of your last 8 lists',bq:1,bu:'pack'},{n:'Yellow onions',id:42,why:'Bought most weeks',low:1,lu:'count',bq:1,bu:'bag'}];

// job 5: our guessed low point is always BELOW what is at home, so a well-stocked food never goes on the list at once
function guessLow(it,lu){if(!it||it.gone)return 1;if(it.rough)return RIX(it.rough)>=2?'Almost None':'A little';const q=it.q||0;
  if(halvesU(lu))return q>1?1:q>.5?.5:0;if(q>=6)return Math.floor(q/3);return q>=2?1:0}
function sugCand(s){const it=s.id?byId(s.id):null;const low=s.hh?null:it?guessLow(it,s.lu):s.low;
  return{...s,low,k:'s:'+s.n.toLowerCase(),p:it?it.p:'Household',gone:!!(it&&it.gone),amt:it?(it.gone?'None':it.rough||amtN(it)):'',rough:it&&it.rough}}
function candOf(i){const lu=sing(i.u)||'count';const us=foodUnits(i.n,i.u);const bu=us.includes(lu)?lu:us[0];
  const low=guessLow(i,lu);const bq=bu===lu?(i.gone?(i.was||1):Math.max(1,Math.ceil(i.q||1))):1;
  return{k:'i:'+i.id,n:i.n,id:i.id,p:i.p,gone:!!i.gone,amt:i.gone?'None':i.rough||amtN(i),rough:i.rough,low,lu,bq,bu}}
function newCand(q){const n=capF(q.trim());const us=foodUnits(n);const g=Object.keys(FOOD).find(k=>n.toLowerCase().includes(k));
  const hhw=/foil|bag|towel|soap|wrap|sponge|napkin|bleach|batter|bulb/i.test(n);
  return{k:'n:'+n.toLowerCase(),n,isNew:1,p:hhw?'Household':g?FOOD[g][0]:'Pantry',hh:hhw?1:0,low:0,lu:us[0],bq:1,bu:us[0]}}
const cHH=c=>!!c.hh||c.p==='Household';
function cLowNow(c){if(cHH(c))return false;if(c.isNew||c.gone)return true;const it=byId(c.id);if(!it)return false;if(it.rough)return typeof c.low==='string'&&RIX(it.rough)>=RIX(c.low);return it.q<=c.low}
// visual 4: one left column (name and why, then "Low at 1 · Buy 3"); a ticked row has Change (friction 3)
function pkRow(c){CANDS[c.k]=c;const on=!!S.stPick[c.k];const cc=on?S.stPick[c.k]:c;const hh=cHH(cc);const ln=cLowNow(cc);const ci={n:c.n};

  const now0=c.isNew||c.gone?'None at home':c.amt?`${c.amt} now`:'';const now=now0?`<span class="gnow">${esc(now0)} · </span>`:'';
  const g=hh?`Not counted · Buy ${esc(qtyS(cc.bq,cc.bu,c.n))}`:`${now}${esc(lowLine(cc.low,cc.lu,c.n))} · Buy ${esc(qtyS(cc.bq,cc.bu,c.n))}`;
  // round 7 (friction 5, job 8): ticking a NEW food opens only "Where it's kept"; the amounts stay behind Change
  const opn=on&&S.stPkOpen===c.k;const full=opn&&S.stPkMode!=='where';

function pkEd(c,full=true){const k=esc(c.k),hh=cHH(c);const lu=c.lu||'count';
  const where=c.isNew?`<span class="q">Where it's kept</span><span class="chips pkwhere" role="radiogroup" aria-label="Where it's kept">${SPL.map(p=>`<button class="chip cmp ${c.p===p?'on':''}" role="radio" aria-checked="${c.p===p}" data-a="stpkplace" data-k="${k}" data-p="${p}">${p==='Household'?'Household, not counted':p}</button>`).join('')}</span>`:'';

    :lowStep(c.low,lu,c.n,`data-k="${k}" data-f="low"`,`data-a="stpkstep" data-k="${k}" data-f="low"`,'pkin');
  const buyC=`<span class="stepw"><span class="step"><button data-a="stpkstep" data-k="${k}" data-f="bq" data-d="-1" aria-label="Less">${ic('minus')}</button><input class="pkin" data-k="${k}" data-f="bq" value="${fmt(c.bq)}" inputmode="decimal" aria-label="How much to buy" enterkeyhint="done"><button data-a="stpkstep" data-k="${k}" data-f="bq" data-d="1" aria-label="More">${ic('plus')}</button></span><button class="sel" data-a="stpkunit" data-k="${k}" aria-haspopup="menu" aria-expanded="false" aria-label="Unit: ${esc(uLab(c.bu,c.n,c.bq))}">${esc(uLab(c.bu,c.n,c.bq))}${ic('down','i sm')}</button></span>`;

function stCands(q){q=q.trim().toLowerCase();const seen=new Set(),out=[],have=[];
  for(const i of S.items){if(i.lo)continue;const n=i.n.toLowerCase();if(!n.includes(q)||seen.has(n))continue;seen.add(n);
    if(i.staple){have.push(i);continue}const s=SUG.find(x=>x.id===i.id);out.push(s?sugCand(s):candOf(i))}
  SUG.filter(s=>s.hh&&s.n.toLowerCase().includes(q)&&!seen.has(s.n.toLowerCase())&&!isStaple(s.n)).forEach(s=>{seen.add(s.n.toLowerCase());out.push(sugCand(s))});
  out.sort((a,b)=>(a.gone?1:0)-(b.gone?1:0)||a.n.localeCompare(b.n));
  const starts=[...seen].some(n=>n.startsWith(q));const nu=q.length>=3&&!starts?newCand(q):null;
  return{out,have:have.sort((a,b)=>a.n.localeCompare(b.n)),nu}}
function stAddList(){const q=S.stQ.trim();const P=Object.values(S.stPick);

  const {out,have,nu}=stCands(q);const shownK=new Set([...out.map(c=>c.k),...(nu?[nu.k]:[])]);const tick=P.filter(c=>!shownK.has(c.k));

    +(!found.length&&!have.length?`<div class="nothing">${q.length<3?'Type a little more of the name.':'No food called that.'}</div>`:'')}

function setState(k,fadeFrom){if(!ST[k]||!ST[k].f)return;const prev=STATE;STATE=k;DP.closeDP({instant:true});document.querySelectorAll('.dpspace').forEach(x=>x.remove());DP.field('dd',{...DP.PAGES.useby});DP.field('hfd',{...DP.PAGES.useby});S=fresh();ST[k].f();closeMenu();closeSheet();$('#toasts').innerHTML='';S.resetScroll=true;
  if(prev==='loading'&&k!=='loading')FX.push({sel:'#scroll',k:'fade'});
  render();if(ST[k].after)setTimeout(ST[k].after,30);
  if(S.panel){const g=$('[data-grow]');if(g)reveal(g,true)}
  const u=new URL(location);u.searchParams.set('state',k);history.replaceState(null,'',u)}
function mockBar(){const m=$('#mock');const main=Object.entries(ST).filter(([k,v])=>!v.m);const isMore=ST[STATE]&&ST[STATE].m;
  m.innerHTML=`<span>Mockup</span>`+main.map(([k,v])=>`<button data-st="${k}" class="${STATE===k||(k==='more'&&isMore)?'on':''}">${v.l}</button>`).join('');
  $('#mockmore').innerHTML=Object.entries(ST).filter(([k,v])=>v.m).map(([k,v])=>`<button data-st="${k}" class="${STATE===k?'on':''}">${v.l}</button>`).join('')}
document.addEventListener('click',e=>{const b=e.target.closest('#mock button,#mockmore button');if(!b)return;const k=b.dataset.st;
  if(k==='more'){const mm=$('#mockmore');const r=b.getBoundingClientRect();mm.style.left=Math.min(r.left,innerWidth-280)+'px';mm.style.top=(r.bottom+6)+'px';mm.classList.toggle('open');return}
  $('#mockmore').classList.remove('open');setState(k)});
