<style>
:root{
  --page:#EDE5D8; --card:#FAF6EE; --card-hover:#FFFCF5; --panel:#F6F2E9;
  --header:#6B3E14; --subbar:#E4D3B3; --hdr-text:#FAF4EB; --subbar-date:#5C3D0A; --subbar-2:#7A5030;
  --ink:#1E1E1C; --ink2:#54524A; --muted:#605E55;
  --sage:#8FAF8A; --sage-dark:#1F3A1C; --sage-light:#E4EDE2; --sage-text:#4B6947;
  --amber-light:#F5ECD8; --amber-text:#7E5C22; --urgent-text:#5C1A1A;
  --chip:#E4D9C6; --chip-warm:#EFE4CC; --chip-warm-edge:#988048; --row-hover:#F0EEE3; --track:#DDD5C5;
  --member-1:#5E7C55;
  --bcard:rgba(0,0,0,.09); --brow:rgba(0,0,0,.06);
  --shadow-card:0 1px 2px rgba(45,33,22,.055),0 6px 16px rgba(45,33,22,.055);
  --shadow-pop:0 4px 14px rgba(45,33,22,.16);
  --hover:inset 0 0 0 100px rgba(30,30,28,.04); --press:inset 0 0 0 100px rgba(30,30,28,.16);
  --wood-sheen-top:rgba(255,255,255,.04); --wood-sheen-bottom:rgba(0,0,0,.10);
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --ease:cubic-bezier(.25,.46,.45,.94);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:16px;height:16px}
svg.ni{display:block;overflow:visible}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important}.bk:active{transform:none!important}}

/* ---------- the sheet around the frames ---------- */
.doc{padding:0 0 64px}
.mast{position:sticky;top:0;z-index:50;background:var(--ink);color:var(--hdr-text);display:flex;align-items:center;gap:6px;padding:6px 10px;overflow-x:auto;scrollbar-width:none}
.mast::-webkit-scrollbar{display:none}
.mast b{font-weight:600;font-size:13px;margin-right:6px;white-space:nowrap;opacity:.8}
.mast a{color:var(--hdr-text);text-decoration:none;font-size:13px;padding:6px 10px;border-radius:6px;white-space:nowrap}
.mast a:hover{background:rgba(250,244,235,.12)}
.sec{padding:28px 24px 8px;max-width:1240px;margin:0 auto}
.sec h2{font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:0 0 6px}
.sec h3{font-size:22px;font-weight:600;margin:0 0 6px;line-height:1.25}
.sec p{margin:0 0 12px;color:var(--ink2);max-width:680px}
.sec p b{color:var(--ink);font-weight:600}
.lab{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:var(--ink2);padding:14px 24px 6px;max-width:1240px;margin:0 auto}
.lab .tag{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:4px}
.lab .tag.b4{background:var(--track);color:var(--ink2)}
.lab .tag.af{background:var(--sage-light);color:var(--sage-text);box-shadow:inset 0 0 0 1px var(--sage-text)}
.lab .why{font-weight:400;color:var(--muted)}

/* ---------- a real-size slice of the app: header, rail, tan bar, the first rows ---------- */

.frw{padding:0 24px}.M-phone .frw{padding:0 8px}
.pair{padding-bottom:8px}
.M-ipad .fr{grid-template-columns:64px 1fr}
.M-phone .fr{grid-template-columns:1fr}

.top::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--wood-sheen-top),var(--wood-sheen-bottom));pointer-events:none}
.M-phone .top{padding:0 16px}
.wordmark{font-style:italic;font-weight:600;font-size:22px;position:relative}
.top .sp{flex:1}
.hq{position:relative;z-index:1;width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--hdr-text);background:rgba(250,244,235,.16);box-shadow:inset 0 0 0 1px rgba(250,244,235,.35);margin-right:8px}
.hq svg.i{width:22px;height:22px}
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;font-weight:600;background:var(--member-1);color:var(--hdr-text);box-shadow:0 0 0 2px var(--hdr-text);position:relative}
.rail{grid-row:2/4;overflow:hidden;background:var(--card);border-right:1px solid var(--bcard);padding:12px 8px;display:flex;flex-direction:column;gap:4px}
.M-ipad .rail{padding:12px 0;align-items:center}
.M-phone .rail{display:none}
.rail .cap{height:44px;border-radius:8px;background:var(--sage);color:var(--ink);display:flex;align-items:center;gap:8px;padding:0 12px;font-weight:500;font-size:16px;margin-bottom:8px;flex:none}
.rail .cap svg.ni{width:24px;height:24px}
.M-ipad .rail .cap{font-size:0;padding:0;width:44px;justify-content:center}
.rail .ri{display:flex;align-items:center;gap:12px;height:44px;border-radius:8px;padding:0 12px;color:var(--ink2);font-weight:500;font-size:16px;flex:none}
.M-ipad .rail .ri{font-size:0;gap:0;justify-content:center;padding:0;width:44px}
.rail .ri svg.ni{width:24px;height:24px}
.rail .ri.on{background:var(--sage-light);color:var(--sage-text)}
.bar{background:var(--subbar);border-bottom:1px solid var(--brow);display:flex;min-width:0}
.bar .in{display:flex;align-items:center;gap:12px;width:100%;max-width:1212px;margin:0 auto;padding:0 16px;min-width:0}
.ttl{font-style:italic;font-weight:600;font-size:16px;color:var(--subbar-date);padding-right:2px;white-space:nowrap;overflow:hidden;min-width:0;flex:0 100 auto}
.bar .btn,.bar .sp{flex-shrink:0}
.meta{font-size:13px;color:var(--subbar-2);white-space:nowrap;overflow:hidden;min-width:0}
.bar .sp{flex:1}
.vl{width:1px;height:20px;background:var(--chip-warm-edge);flex:none;margin:0 -1px}
.sepc{width:14px;height:14px;color:var(--subbar-2);opacity:.6;flex:none;margin:0 -4px}
.M-phone .bar .in{gap:8px}
.bk+.sepc{margin-left:-6px}
.ttl.gone+.vl,.ttl.gone{display:none}
.bar .btn{height:32px;border-radius:8px;padding:0 14px;display:inline-flex;align-items:center;gap:8px;font-weight:500;font-size:15px;white-space:nowrap;flex:none}
.bar .btn.pri{background:var(--sage-dark);color:var(--hdr-text)}
.bar .btn.icon{width:32px;padding:0;justify-content:center;color:var(--ink2)}
.bar .btn:hover{box-shadow:var(--hover)}
.body{padding:16px 0 18px;min-width:0}
.body .col{max-width:1212px;margin:0 auto;padding:0 16px}
.card{background:var(--card);border-radius:12px;box-shadow:var(--shadow-card),0 0 0 1px var(--bcard);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 16px;border-bottom:1px solid var(--brow)}
.row:last-child{border-bottom:0}
.row .t{font-weight:500;font-size:16px}
.row .s{font-size:13px;color:var(--muted)}
.row .r{margin-left:auto;font-size:13px;color:var(--ink2)}
.ph{height:12px;border-radius:6px;background:var(--track)}

/* ---------- BEFORE: the three back looks used today ---------- */
/* app kit BackControl: a 44 round target, chevron only, soft green circle on hover */
.o-circ{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink);margin-left:-10px;flex:none}
.o-circ:hover{background:rgba(75,105,71,.12)}
.o-circ svg.i{width:24px;height:24px}
/* mockups: a 36 square, arrow only */
.o-sq{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--subbar-date);margin-left:-8px;flex:none}
.o-sq:hover{box-shadow:var(--hover)}
/* Settings today: arrow and a separate crumb, two targets */
.o-crumb{font-weight:600;font-size:16px;color:var(--ink);height:36px;display:inline-flex;align-items:center;padding:0 6px;border-radius:8px;margin-left:-10px}
.o-crumb:hover{background:rgba(75,105,71,.12)}
/* Recipes book: a bare "‹" glyph */
.o-glyph{font-size:24px;line-height:1;min-width:44px;height:44px;display:inline-flex;align-items:center;padding:0 10px 2px 0;margin-left:-10px;color:var(--ink)}

/* ---------- AFTER: THE STANDARD. One text button: chevron + where it goes ---------- */
.bk{position:relative;display:inline-flex;align-items:center;gap:2px;height:32px;padding:0 8px 0 6px;margin-left:-10px;border-radius:8px;
  color:var(--subbar-2);font-weight:500;font-size:16px;white-space:nowrap;flex:0 1 auto;min-width:0;
  transition:transform 50ms var(--ease),box-shadow .2s var(--ease)}
.bk::after{content:"";position:absolute;inset:-6px 0}            /* 44 tall to the finger */
.bk svg.i{transition:transform .2s var(--ease)}
.bk .w{overflow:hidden;min-width:0;white-space:nowrap}
.bk.ov .w{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
.bk:hover,.bk.is-hover{background:rgba(75,105,71,.12);color:var(--subbar-date)}
.bk:hover svg.i,.bk.is-hover svg.i{transform:translateX(-2px)}
.bk:active,.bk.is-press{transform:scale(.97);box-shadow:var(--press)}
.bk:focus-visible,.bk.is-focus{outline:2px solid var(--sage-text);outline-offset:2px}
.touch .bk:hover svg.i{transform:none}.touch .bk:hover{box-shadow:none}
.ttl.ov{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}

/* ---------- the states board ---------- */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;padding:6px 24px 0;max-width:1240px;margin:0 auto}
.cell{background:var(--card);border-radius:12px;box-shadow:var(--shadow-card),0 0 0 1px var(--bcard);overflow:hidden}
.cell .strip{height:46px;background:var(--subbar);display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--brow)}
.cell .cap{padding:10px 14px 12px;font-size:13px;color:var(--ink2)}
.cell .cap b{display:block;color:var(--ink);font-size:14px;font-weight:600;margin-bottom:2px}
.spec{width:100%;border-collapse:collapse;font-size:14px;background:var(--card);border-radius:12px;overflow:hidden;box-shadow:var(--shadow-card),0 0 0 1px var(--bcard)}
.spec td{padding:9px 14px;border-bottom:1px solid var(--brow);vertical-align:top}
.spec tr:last-child td{border-bottom:0}
.spec td:first-child{font-weight:600;width:190px;color:var(--ink)}
.spec td:last-child{color:var(--ink2)}
.specwrap{padding:6px 24px 0;max-width:1240px;margin:0 auto}
.M-phone .spec td:first-child{width:110px}
.M-phone .sec,.M-phone .lab,.M-phone .board,.M-phone .specwrap{padding-left:16px;padding-right:16px}
.M-phone .sec h3{font-size:20px}
.anat{display:flex;align-items:center;gap:0;flex-wrap:wrap;padding:12px 24px 0;max-width:1240px;margin:0 auto}
.anat .strip{height:46px;background:var(--subbar);display:flex;align-items:center;gap:12px;padding:0 16px;border-radius:12px;box-shadow:0 0 0 1px var(--bcard);position:relative}

.callouts{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--ink2);padding:10px 24px 0;max-width:1240px;margin:0 auto}
.callouts span{display:inline-flex;gap:6px;align-items:baseline}
.callouts i{font-style:normal;font-weight:600;color:var(--sage-text)}
.M-phone .anat,.M-phone .callouts{padding-left:16px;padding-right:16px}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--hdr-text);padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;transition:.2s var(--ease);pointer-events:none;z-index:99}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>

0.8"/><rect x="0.60" y="7.00" width="2" height="4" rx=".6" fill="#8FAF8A" stroke="#4A3A22" stroke-width="1.1"/><rect x="17.40" y="7.00" width="2" height="4" rx=".6" fill="#8FAF8A" stroke="#4A3A22" stroke-width="1.1"/></svg>',hist:'<svg class="ni" aria-hidden="true" focusable="false" viewBox="0 0 20 20" stroke-linejoin="round" stroke-linecap="round"><circle cx="10.4" cy="10.4" r="7.4" fill="#F2DCAE"/><path d="M3.99 14.10 A7.4 7.4 0 1 0 9.12 3.11" fill="none" stroke="#4A3A22" stroke-width="1.5"/><path d="M9.12 3.11 A7.4 7.4 0 0 0 3.64 7.39" fill="none" stroke="#4B6947" stroke-width="1.7"/><path d="M2.11 3.95 L2.96 8.92 L7.22 6.23" fill="none" stroke="#4B6947" stroke-width="1.7"/><path d="M10.4 6.4v4l3 1.8" fill="none" stroke="#4A3A22" stroke-width="1.5"/></svg>',remind:'<svg class="ni" aria-hidden="true" focusable="false" viewBox="0 0 20 20" stroke-linejoin="round" stroke-linecap="round"><path d="M4.8 13.8 V9.4 a5.2 5.2 0 0 1 10.4 0 V13.8 l1.6 2 H3.2 Z" transform="translate(10 10.2) scale(1.1) translate(-10 -10)" fill="#E8B04B" stroke="#4A3A22" stroke-width="1.4"/><path d="M8.2 15.8 a1.8 1.8 0 0 0 3.6 0 Z" transform="translate(10 10.2) scale(1.1) translate(-10 -10)" fill="#6B4319" stroke="#4A3A22" stroke-width="1.2"/><path d="M10 2.4 V4.2" transform="translate(10 10.2) scale(1.1) translate(-10 -10)" fill="none" stroke="#4A3A22" stroke-width="1.5"/><path d="M7.2 9.2 a3 3 0 0 1 1.8-2.6" transform="translate(10 10.2) scale(1.1) translate(-10 -10)" fill="none" stroke="#FBE3A8" stroke-width="1.2"/></svg>',cap:'<svg class="ni" aria-hidden="true" focusable="false" viewBox="0 0 20 20" stroke-linejoin="round" stroke-linecap="round"><path d="M10 4 V16 M4 10 H16" fill="none" stroke="#4A3A22" stroke-width="1.8"/></svg>'};
const MODE=(()=>{const f=window.FULL;if(f==='phone'||f==='ipad'||f==='desktop')return f;const w=innerWidth;return w<700?'phone':w<1200?'ipad':'desktop'})();
const TOUCH=MODE!=='desktop';
document.documentElement.classList.add('M-'+MODE);if(TOUCH)document.documentElement.classList.add('touch');
const I={left:'<path d="m15 18-6-6 6-6"/>',plus:'<path d="M12 5v14M5 12h14"/>',dots:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
  right:'<path d="m9 18 6-6-6-6"/>'};
const ic=(n,c='')=>`<svg class="i ${c}" viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const NAV=[['today','Today'],['prep','Prep'],['plan','Plan'],['book','Recipes'],['groc','Groceries'],['kitchen','Kitchen'],['left','Leftovers'],['hist','History']];
const rail=on=>`<nav class="rail" aria-label="Main"><span class="cap">${NI.cap}Capture</span>${NAV.map(([k,l])=>`<span class="ri ${l===on?'on':''}">${NI[k]}${l}</span>`).join('')}</nav>`;
/* THE STANDARD: one text button. Its words are where the tap goes. */
const bk=(to,extra='',cls='')=>`<button class="bk ${cls}" data-to="${esc(to)}" aria-label="Back to ${esc(to)}" ${extra}>${ic('left')}<span class="w">${esc(to)}</span></button>`;
const SEP=`<svg class="i sepc" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>`;
const ttl=(t,cls='')=>`<span class="ttl ${cls}">${esc(t)}</span>`;
const frame=(on,barIn,body)=>`<div class="frw"><div class="fr">${`<header class="top"><span class="wordmark">SupperCraft</span><span class="sp"></span><span class="hq" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg></span><span class="av">TS</span></header>`}${rail(on)}<div class="bar"><div class="in">${barIn}</div></div><div class="body"><div class="col">${body}</div></div></div></div>`;
const rows=(list)=>`<div class="card">${list.map(([t,s,r])=>`<div class="row"><div><div class="t">${t}</div>${s?`<div class="s">${s}</div>`:''}</div>${r?`<span class="r">${r}</span>`:''}</div>`).join('')}</div>`;
const P=MODE==='phone';

/* ---------- the four real pages: before and after ---------- */
const PAGES=[
 {id:'recipe',on:'Recipes',name:'A recipe, opened from Recipes',
  before:{why:'App today: the kit BackControl, an arrow alone in a round 44 target. Its name is only read aloud.',
    bar:`<button class="o-circ" aria-label="Back">${ic('left')}</button>${ttl('Chicken tikka masala')}<span class="sp"></span><button class="btn pri">${P?'Cook':'Cook This'}</button><button class="btn icon" aria-label="More">${ic('dots')}</button>`},
  after:{bar:`${bk('Recipes')}${SEP}${ttl('Chicken tikka masala')}<span class="sp"></span><button class="btn pri">${P?'Cook':'Cook This'}</button><button class="btn icon" aria-label="More">${ic('dots')}</button>`},
  body:rows([['Chicken tikka masala','6 Servings | 45 min',''],['Ingredients','12 items','']])},
 {id:'settings',on:'',name:'Settings, Household',
  before:{why:'App today: the arrow and the word "Settings" are two separate buttons side by side (iPhone: the arrow alone).',
    bar:`<button class="o-circ" aria-label="Settings">${ic('left')}</button>${P?'':`<button class="o-crumb">Settings</button>`}<span class="ttl" style="color:var(--ink);font-weight:700;margin-left:12px">Household</span>`},
  after:{bar:`${bk('Settings')}${SEP}${ttl('Household')}`},
  body:rows([['Parker home','3 people',''],['Invite Someone','','']])},
 {id:'history',on:'History',name:'A cooked meal, opened from History',
  before:{why:'App today: the round arrow alone; its name ("All history") is only read aloud.',
    bar:`<button class="o-circ" aria-label="All history">${ic('left')}</button>${ttl('Chicken tacos')}${P?'':`<span class="vl"></span><span class="meta">Cooked Nov 12</span>`}`},
  after:{bar:`${bk('History')}${SEP}${ttl('Chicken tacos')}`},
  body:rows([['Chicken tacos','Cooked Nov 12 | 4 Servings',''],['Notes','"Less lime next time"','']])},
 {id:'three',on:'',name:'Three deep: a person, in Settings, Members',
  before:{why:'App today: the arrow and a separate "members" crumb (iPhone: the arrow alone).',
    bar:`<button class="o-circ" aria-label="members">${ic('left')}</button>${P?'':`<button class="o-crumb">members</button>`}<span class="ttl" style="color:var(--ink);font-weight:700;font-style:normal;margin-left:12px">Sarah</span>`},
  after:{why:'One level per tap: it goes to Members. The rail or the avatar menu reaches Settings in one tap.',bar:`${bk('Members')}${SEP}${ttl('Sarah')}`},
  body:rows([['Sarah','Full Access',''],['Colour','Copper','']])},
 {id:'about',on:'',name:'A page whose back sits beside its big title (About)',
  before:{why:'App today: the tan bar has the name, and a round arrow sits again beside the big title below it.',
    bar:`${ttl('About SupperCraft')}`,
    body:`<div style="display:flex;align-items:center;gap:8px"><button class="o-circ" aria-label="Back">${ic('left')}</button><span style="font-size:26px;font-weight:600">About SupperCraft</span></div>`},
  after:{why:'The back moves up into the tan bar; the page keeps only its words.',bar:`${bk('Settings')}${SEP}${ttl('About SupperCraft')}`,body:rows([['Version 2.4','Updated Nov 20',''],['Privacy','How we use your data','']])},
  body:''},
 {id:'refresh',on:'Kitchen',name:'Refresh a Place, opened from Kitchen',
  before:{why:'Kitchen mockup (C-088): a 36 square arrow alone, then a separate "Kitchen" crumb.',
    bar:`<button class="o-sq" aria-label="Back">${ic('left')}</button>${P?ttl('Refresh a Place'):`<span class="ttl" style="color:var(--subbar-2)">Kitchen</span>${ic('right','sm')}${ttl('Refresh a Place')}`}`},
  after:{bar:`${bk('Kitchen')}${SEP}${ttl('Refresh a Place')}`},
  body:rows([['Fridge','Checked 3 days ago',''],['Pantry','Checked last week','']])},
];

const LONG='Grandma Rose\u2019s chicken and dumplings';
function states(){
  const cell=(t,cap,strip,st='')=>`<div class="cell"><div class="strip" ${st}>${strip}</div><div class="cap"><b>${t}</b>${cap}</div></div>`;
  const sameT=`${SEP}${ttl('Staples')}`;
  return `<div class="board">
   ${cell('At rest','A left arrow and the place it goes, in soft brown. This page\u2019s name is darker. No box, no circle.',bk('Kitchen')+sameT)}
   ${cell('Pointing at it (computer)','The soft green shade the back has today, now on a rounded square, and the arrow nudges left. Touch screens skip this.',bk('Kitchen','','is-hover')+sameT)}
   ${cell('Pressed','A darker shade and a tiny shrink, like every button.',bk('Kitchen','','is-press')+sameT)}
   ${cell('Keyboard focus','The green ring every control gets.',bk('Kitchen','','is-focus')+sameT)}
   ${cell('Came from somewhere else','It says where the tap really goes: opened from Groceries, it says Groceries.',bk('Groceries')+sameT)}
   ${cell('Scrolled down','The bar turns light tan as it sticks. Back stays in the same spot.',bk('Kitchen')+sameT,'style="background:var(--chip-warm);box-shadow:0 1px 0 var(--chip-warm-edge)"')}
  </div>`}
/* the bar when it is full: buttons never shrink, the page name fades first, then the back words (never under 112 px) */
function crowded(){return frame('Recipes',`${bk('Main Recipe')}${SEP}${ttl(LONG)}<span class="sp"></span><button class="btn pri">${P?'Cook':'Cook This'}</button><button class="btn icon" aria-label="More">${ic('dots')}</button>`,rows([['Grandma Rose\u2019s chicken and dumplings','A sub-recipe, opened from its recipe','']]))}
function anatomy(){
  return `<div class="anat"><div class="strip">${bk('Kitchen')}${SEP}${ttl('Staples')}</div></div>
  <div class="callouts"><span>The arrow and the place it goes are one button, in soft brown. Then a small, quiet \u203A and this page\u2019s name in dark brown italic.</span></div>`}
function spec(){
  const r=[
   ['What it is','One button at the left of the tan bar: a left arrow and the name of the page it goes to ("\u2039 Kitchen"). It replaces the arrow alone, the arrow in a circle, and an arrow with a separate name beside it.'],
   ['Its words','The page you came from, by its short name: "Recipes", "Settings", "Members", "Main Recipe". If you did not come from anywhere (a link), the page this one lives under. Never someone\u2019s own words like a recipe title, and never just "Back". One page per tap.'],
   ['After it','A small, quiet \u203A, then this page\u2019s name in dark brown italic, as on every tan bar.'],
   ['Look','Soft brown words, a bit lighter than the page name. As tall as the other bar buttons, and big enough for a finger.'],
   ['When the bar is full','The buttons on the right never shrink, and the back words are short, so only this page\u2019s name fades at its end. Never "...". The full name is always the first line of the page itself.'],
   ['Always works','Back is never greyed out. A page with unsaved typing keeps it as a draft, or asks first when something would be lost.'],
   ['Everywhere','The same on computer, iPad and iPhone. On iPad and iPhone a swipe from the left edge goes to the same place as the button.'],
   //['For the builders','Arrow 20 px, stroke 2. Words 16 px, weight 500, subbar-secondary; hover: the ruled sage-text tint (overlay.backHover) on radius 8, words turn subbar-date; press as 6.1. 32 tall, 44 to the finger; padding 4 left, 10 right; pulled 8 px left. Page name 16/600 subbar-date. Read aloud "Back to Kitchen".'],
  ];
  return `<div class="specwrap"><table class="spec"><tbody>${r.map(([a,b])=>`<tr><td>${a}</td><td>${b}</td></tr>`).join('')}</tbody></table></div>`}
function render(){
  const dev={desktop:'computer (1440 wide)',ipad:'iPad (sideways)',phone:'iPhone'}[MODE];
  let h=`<nav class="mast" aria-label="Sections"><b>Back standard</b><a href="#std">The Standard</a><a href="#states">States</a>${PAGES.map(p=>`<a href="#p-${p.id}">${{recipe:'Recipe',settings:'Settings',history:'History',three:'Three Deep',about:'About',refresh:'Kitchen'}[p.id]}</a>`).join('')}<a href="#full">Bar Full</a><a href="#rules">Rules</a></nav><div class="doc">`;
  h+=`<section class="sec" id="std"><h2>Standard | mockup, not agreed</h2><h3>Back in the tan bar is “‹ Page name”</h3><p>One text button: the arrow and the name of the page it goes back to. It is the same on every page, at every size. Shown here at real size on the ${dev}.</p></section>`;
  h+=anatomy();
  h+=`<section class="sec" id="states"><h2>States</h2></section>`+states();
  for(const p of PAGES){
    h+=`<section class="sec" id="p-${p.id}"><h2>Before and after</h2><h3>${p.name}</h3></section>`;
    h+=`<div class="lab"><span class="tag b4">Before</span><span class="why">${p.before.why}</span></div>`+frame(p.on,p.before.bar,p.before.body||p.body);
    h+=`<div class="pair"></div><div class="lab"><span class="tag af">After</span><span class="why">${p.after.why||'The standard. Tap it.'}</span></div>`+frame(p.on,p.after.bar,p.after.body||p.body);
  }
  h+=`<section class="sec" id="full"><h2>When the bar is full</h2><h3>A long page name next to the page’s buttons</h3><p>Back words are always a short page name (“Main Recipe”, never the recipe’s own name), so they never get cut. The buttons keep their size; the page name fades at its end, and the page shows it in full as its first line.</p></section>`+crowded();
  h+=`<section class="sec" id="rules"><h2>The rule, written down</h2></section>`+spec()+`</div>`;
  document.getElementById('app').innerHTML=h;
}
render();
function fit(){document.querySelectorAll('.bk .w,.ttl').forEach(el=>{const o=el.scrollWidth>el.clientWidth+1;(el.classList.contains('w')?el.parentElement:el).classList.toggle('ov',o)})}
fit();addEventListener('resize',fit);document.fonts&&document.fonts.ready.then(fit);
let tt;document.addEventListener('click',e=>{const b=e.target.closest('.bk');if(!b)return;const t=document.getElementById('toast');t.textContent='Goes to '+b.dataset.to;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1400)});
</script>
</body>
</html>
