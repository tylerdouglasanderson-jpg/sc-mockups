*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);background:#efece7;color:#222;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
textarea{font:inherit;color:inherit}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:16px;height:16px}
:focus-visible{outline:2px solid var(--sage-text);outline-offset:2px}

/* ---------- mockup-only state bar (never in ?full) ---------- */
#ctl{position:sticky;top:0;z-index:100;background:#f8f6f2;border-bottom:1px solid #ddd;padding:8px 14px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
#ctl h1{font-size:15px;margin:0 6px 0 0;font-weight:700}
#ctl .lbl{color:#777;margin-right:2px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid #cfc6b5;border-radius:8px;overflow:hidden;background:#fff}
.seg button{padding:6px 10px;font-size:12.5px;border-right:1px solid #e4ddd0}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--sage-dark);color:#fff;font-weight:600}
.tg{border:1px solid #cfc6b5;background:#fff;border-radius:8px;padding:6px 10px;font-size:12.5px}
.tg.on{background:#FFF1A8;border-color:#d9c25a}
#wrap{display:flex;gap:16px;padding:14px;align-items:flex-start}
#stage{flex:1;min-width:0}
#scaler{transform-origin:0 0}
#notes{flex:0 0 280px;display:flex;flex-direction:column;gap:10px;position:sticky;top:120px}
.note{background:#FFF6B8;border:1px solid #E6D774;border-radius:4px;padding:10px 12px;font-size:13px;line-height:1.45;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.note b{display:block;margin-bottom:2px}
@media (max-width:1100px){#wrap{flex-direction:column}#notes{position:static;flex:none;width:100%}}
html.full,html.full body{height:100%;overflow:hidden;background:var(--page)}
html.full #ctl,html.full #notes{display:none!important}
html.full #wrap{padding:0;display:block}
html.full #dev{border:0;border-radius:0;box-shadow:none}

/* ---------- the device ---------- */

#dev.t-phone{--pad:16px}

.top::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(0,0,0,.10));pointer-events:none}
.top>*{position:relative;z-index:1}
.wm{font-family:Fraunces,Georgia,serif;font-style:italic;font-weight:600;font-size:22px;letter-spacing:.005em;line-height:1.25}
.top .sp{flex:1}
.cloud{width:36px;height:36px;display:grid;place-items:center;border-radius:8px;color:var(--hdr-text);opacity:0;transition:opacity .24s var(--ease)}
.cloud.on{opacity:1}
.mockbtn{height:28px;padding:0 10px;border-radius:8px;border:1px dashed rgba(250,244,235,.55);font-size:12px;color:var(--hdr-text);opacity:.8}
html.shots .mockbtn,html:not(.full) .mockbtn{display:none}
.av{display:inline-grid;place-items:center;border-radius:50%;font-weight:600;color:var(--hdr-text);flex:none}
.av.hdr{width:28px;height:28px;font-size:12px;background:#5E7C55;box-shadow:0 0 0 2px var(--hdr-text)}
.av.hdr.m{background:#8A5A8C}
.av.xs{width:20px;height:20px;font-size:11px;background:#5E7C55}
.av.xs.m{background:#8A5A8C}.av.xs.s{background:#B0683A}
.dbody{flex:1;display:flex;min-height:0;position:relative}

/* rail: kit frame/Rail + CaptureButton (DESIGN 3.3.1, C-074, C-076) */
.rail{flex:none;width:220px;background:var(--card);border-right:1px solid var(--bcard);padding:12px 8px;display:flex;flex-direction:column;gap:4px;z-index:3}
.rail.slim{width:64px;padding:12px 0;align-items:center}
.cap{height:44px;margin:0 0 8px;border-radius:8px;background:var(--sage-dark);color:var(--hdr-text);display:flex;align-items:center;gap:8px;padding:0 12px;font-weight:500;font-size:var(--item);transition:transform 50ms var(--ease),box-shadow .2s}
.cap:hover{box-shadow:inset 0 0 0 100px rgba(0,0,0,.25)}
.cap:active{transform:scale(.97);box-shadow:inset 0 0 0 100px rgba(0,0,0,.4)}
.rail.slim .cap{width:44px;padding:0;justify-content:center}
.rail.slim .cap span{display:none}
.cap svg{width:24px;height:24px}
.ri{display:flex;align-items:center;gap:12px;height:44px;border-radius:8px;padding:0 12px;color:var(--ink2);font-weight:500;font-size:var(--item);text-align:left;white-space:nowrap}
.ri svg{width:24px;height:24px;flex:none}
.ri:hover{box-shadow:var(--hover)}
.ri.on{background:var(--sage-light);color:var(--sage-text)}
.rail.slim .ri{width:44px;justify-content:center;padding:0}
.rail.slim .ri span{display:none}
.rail hr{border:0;border-top:1px solid var(--bcard);margin:4px 8px}
.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
/* r6: the tan bar's words sit on Groceries v3's inner grid (.bar .in: 1212, padding 0 16), so its edges match the cards */
.tan{height:46px;flex:none;background:var(--subbar);border-bottom:1px solid var(--brow);display:flex;position:relative;z-index:2}
.tan .in{display:flex;align-items:center;gap:12px;width:100%;max-width:1212px;margin:0 auto;padding:0 16px;min-width:0}
.one .tan .in{max-width:820px}
.t-phone .tan .in{padding:0 12px;gap:8px}
.tan .ttl{font-style:italic;font-weight:600;font-size:16px;color:var(--subbar-date);white-space:nowrap}
.t-ipad .tan .ttl{font-size:18px}
.tan .line{width:1px;height:18px;background:var(--chip-warm-edge);opacity:.5;flex:none}
.tan .det{font-size:13px;color:var(--subbar-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.t-ipad .tan .det{font-size:14px}
.tan .sp{flex:1}
.tan .shape{width:120px;height:12px;border-radius:4px;background:var(--track);opacity:.7}
/* r6: Sort Now is the kit primary Button at the tan bar's 36 (Groceries v3 .bar .btn), 44 hit area */
.tan .btn{height:36px;padding:0 14px;font-size:15px}.tan .btn::after{content:"";position:absolute;inset:-4px 0}
.t-ipad .tan .btn{font-size:17px}
/* r6: one themed thin scrollbar everywhere (STANDARDS; Groceries v3 lines 58-63) */
.scroll,.pbody,#mockmenu,.menu{scrollbar-width:thin;scrollbar-color:rgba(96,94,85,.35) transparent}
.scroll::-webkit-scrollbar,.pbody::-webkit-scrollbar,#mockmenu::-webkit-scrollbar{width:12px;height:12px}
.scroll::-webkit-scrollbar-thumb,.pbody::-webkit-scrollbar-thumb,#mockmenu::-webkit-scrollbar-thumb{background:rgba(96,94,85,.35);border:3px solid transparent;background-clip:padding-box;border-radius:999px}
.scroll::-webkit-scrollbar-thumb:hover,.pbody::-webkit-scrollbar-thumb:hover,#mockmenu::-webkit-scrollbar-thumb:hover{background-color:rgba(84,82,74,.7)}
.scroll::-webkit-scrollbar-thumb:active,.pbody::-webkit-scrollbar-thumb:active,#mockmenu::-webkit-scrollbar-thumb:active{background-color:rgba(84,82,74,.85)}
.scroll::-webkit-scrollbar-track,.pbody::-webkit-scrollbar-track,#mockmenu::-webkit-scrollbar-track{background:transparent}
.scroll{flex:1;overflow:auto;min-height:0;position:relative}
.pagefade{animation:fade .24s var(--ease) both}
/* phone tab bar (C-055, C-073): Today, Plan, +, Groceries, More */
.tabs{height:56px;flex:none;background:var(--card);border-top:1px solid var(--bcard);display:flex;align-items:center;justify-content:space-around;position:relative;z-index:3}
.tb{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:64px;height:48px;justify-content:center;border-radius:8px;font-size:12px;font-weight:500;color:var(--ink2)}
.tb svg{width:24px;height:24px}
.tb.on{color:var(--sage-text);font-weight:600;background:var(--sage-light)}
.tb.on svg{filter:none}
/* r6: the + sits in a 78 slot at the bar's top and rises the kit's full 18 (Groceries v3 .capslot; DESIGN 3.3.1) */
.capslot{width:78px;display:flex;justify-content:center;align-self:flex-start}
.capc{width:60px;height:60px;border-radius:50%;background:var(--sage-dark);color:var(--hdr-text);display:grid;place-items:center;margin-top:-18px;box-shadow:var(--shadow-card);transition:transform 50ms var(--ease)}
.capc:active{transform:scale(.97)}

/* kit Button (44 tall, radius 8, Title Case; DESIGN 4.2) */
.btn{height:44px;border-radius:8px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:500;font-size:var(--item);white-space:nowrap;transition:transform 50ms var(--ease),box-shadow .2s var(--ease),opacity .2s;position:relative;flex:none;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.btn:active{transform:scale(.97);box-shadow:var(--press)}
.btn.pri{background:var(--sage-dark);color:var(--hdr-text)}.btn.pri:hover{box-shadow:inset 0 0 0 100px rgba(0,0,0,.25)}
.btn.cancel{border:1px solid var(--ink2);color:var(--ink)}.btn.cancel:hover{box-shadow:var(--hover)}
.btn.tan{background:var(--chip-warm);border:1px solid var(--chip-warm-edge);color:var(--ink)}.btn.tan:hover{box-shadow:var(--hover)}
/* r6: ONE size. Every button and chip is 44 (48 for the phone's talk row, kit D32); 36 only inside the tan bar
   (Groceries v3 .bar .btn). Words on the kit scale: 15 on computer and phone, 17 on iPad (var(--body)). */
.btn.sm{height:44px;padding:0 14px;font-size:var(--body)}
.btn.grow{flex:1;min-width:0}
.btn.off{background:var(--track);color:var(--ink2);border-color:transparent;pointer-events:none}
.btn[aria-disabled="true"]{opacity:.42;pointer-events:none}
.btn>*,.chip>*,.undo>*{pointer-events:none}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:rot .8s linear infinite;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}
/* r4/r6: back-outs (Undo, Undo All, Undo All and Fix Words, Cancel) = kit `cancel` (outlined, no fill, Button.tsx:6);
   it is the kit's undo-a-thing look. Forward moves (Notes jump, See More, Keep Open) are kit `tan`. 44 everywhere. */
.undo{height:44px;padding:0 12px;border-radius:8px;border:1px solid var(--ink2);background:none;color:var(--ink);font-size:var(--body);font-weight:500;white-space:nowrap;flex:none;position:relative;transition:transform 50ms var(--ease),box-shadow .2s var(--ease)}
.undo:hover{box-shadow:var(--hover)}.undo:active{transform:scale(.97);box-shadow:var(--press)}
.btn.out{border:1px solid var(--ink2);color:var(--ink)}.btn.out:hover{box-shadow:var(--hover)}
/* kit Chip: soft square, 44 tall, tan; picked = chip-on + 1px sage-text (Chip.tsx) */
.chip{min-height:44px;padding:0 16px;border-radius:8px;background:var(--chip);border:1px solid transparent;font-weight:600;font-size:var(--body);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;transition:transform 50ms var(--ease),box-shadow .2s}
.chip:hover{box-shadow:var(--hover)}.chip:active{transform:scale(.97);box-shadow:var(--press)}
.chip.on{background:var(--chip-on);border-color:var(--sage-text);font-weight:700}
/* r6: the kit's 44 muted kebab (Groceries v3 .kebab), not a 32 brown one */
.dots{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;color:var(--muted);flex:none;position:relative}
.dots:hover,.dots[aria-expanded=true]{box-shadow:var(--hover);color:var(--ink)}
.dots:active{box-shadow:var(--press)}
/* r6: Groceries v3's one dropdown trigger (.sel: kit Chip at rest, 15/600, trailing chevron) */
.sel{height:44px;border-radius:8px;background:var(--chip);padding:0 10px 0 14px;display:inline-flex;align-items:center;gap:4px;font-size:var(--body);font-weight:600;color:var(--ink);border:1px solid transparent;white-space:nowrap;transition:transform 50ms var(--ease);flex:none}
.sel:hover{box-shadow:var(--hover)}.sel:active{transform:scale(.97);box-shadow:var(--press)}
.sel[aria-expanded=true]{background:var(--chip-on);border-color:var(--sage-text)}
/* r6: Change Amount is an option, not an answer: the quiet chip (card edge, no fill) */
.chip.alt{background:none;border-color:var(--chip-warm-edge);font-weight:500;color:var(--ink2)}
.amt{display:inline-flex;align-items:center;gap:4px}
.amt .n{min-width:28px;text-align:center;font-weight:600}
.amt .chip{min-width:44px;padding:0}
.link{color:var(--sage-text);font-weight:600;font-size:var(--meta);display:inline-flex;align-items:center;gap:2px;min-height:44px;padding:0 2px}
.link:hover{text-decoration:underline}
.eyebrow{font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.t-ipad .eyebrow{font-size:14px}
.quiet{color:var(--muted);font-size:var(--meta)}

/* ---------- layers ---------- */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:40;opacity:0;pointer-events:none;transition:opacity .24s var(--ease)}
.scrim.on{opacity:1;pointer-events:auto}
.pop{position:absolute;z-index:41;display:none;transition:top .26s var(--ease),bottom .26s var(--ease),left .26s var(--ease)}
.pop.show{display:block;animation:popIn .24s var(--ease) both}
.pop.hide{display:block;animation:popOut .2s var(--ease) both;pointer-events:none}
@keyframes popIn{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:none}}
@keyframes popOut{to{opacity:0;transform:scale(.2)}}
.caret{position:absolute;width:12px;height:12px;background:var(--card);transform:rotate(45deg);box-shadow:-2px 2px 4px rgba(45,33,22,.06);transition:opacity .2s}
/* r6: three parts. The head (words + X) and the foot (talk row + Open Capture) stay put; only the middle scrolls,
   with a soft fade when more sits below (panel 2 visual 2, ease 4, friction 6). */
.pin{position:relative;background:var(--card);border-radius:12px;box-shadow:var(--shadow-pop);padding:12px;display:flex;flex-direction:column;overflow:hidden}
.pin.glide{transition:height .24s var(--ease)}
.pbody{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;margin:0 -12px;padding:0 12px;position:relative}
.pfoot2{flex:none;position:relative}
.pfade{position:absolute;left:-12px;right:-12px;top:-28px;height:28px;background:linear-gradient(180deg,rgba(250,246,238,0),var(--card));pointer-events:none;opacity:0;transition:opacity .2s var(--ease)}
.pin.over .pfade{opacity:1}
.ph{flex:none;display:flex;align-items:center;gap:8px;min-height:44px;margin:-4px -4px 4px 0}
.ph .pt{flex:1;min-width:0;font-weight:600;font-size:var(--item);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .pt.quote{font-weight:400;font-style:italic;color:var(--ink2);font-size:var(--body)}
.ph .lis{display:inline-flex;align-items:center;gap:8px}
.ph .lis i{width:10px;height:10px;border-radius:50%;background:var(--sage-text);box-shadow:0 0 0 0 rgba(75,105,71,.45);animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(75,105,71,.5)}70%,100%{box-shadow:0 0 0 7px rgba(75,105,71,0)}}
.xbtn{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;color:var(--ink2);flex:none}
.xbtn:hover{box-shadow:var(--hover)}
.boxw{position:relative}
.box{display:block;width:100%;min-height:96px;max-height:168px;resize:none;border:1px solid var(--ink2);border-radius:8px;background:var(--card);padding:12px 14px;font-size:var(--item);line-height:1.4;outline:none;transition:opacity .24s var(--ease),box-shadow .24s var(--ease),border-color .24s}
.box::placeholder{color:var(--ph)}
.box:focus{border-color:var(--sage-text);box-shadow:0 0 0 1px var(--sage-text)}
.pentry[data-ph=typed] .box,.pentry[data-ph=fix] .box{border-color:var(--sage-text);box-shadow:0 0 0 1px var(--sage-text)}
.pentry[data-ph=listen] .box{border-color:var(--sage-text)}
.pentry[data-ph=send] .box{opacity:.42}
.pentry[data-ph=reply] .boxw,.pentry[data-ph=kept] .boxw{display:none}
/* sending: the step bar over the faded words (Tyler 10-09 S3) */
.steps{position:absolute;left:10px;right:10px;bottom:10px;background:var(--card);border:1px solid var(--bcard);border-radius:8px;padding:8px 10px;box-shadow:var(--shadow-card);display:none}
.pentry[data-ph=send] .steps{display:block;animation:enter .22s var(--ease) both}
.segs{display:flex;gap:4px}
.segs i{flex:1;height:6px;border-radius:3px;background:var(--track);position:relative;overflow:hidden}
.segs i::after{content:"";position:absolute;inset:0;width:0;background:var(--sage-text);border-radius:3px;transition:width .3s var(--ease)}
.segs i.done::after{width:100%}
.segs i.now::after{width:55%}
.stl{font-size:var(--meta);color:var(--ink2);margin-top:6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.stl>span:first-child{display:inline-flex;align-items:center;gap:8px}
.stl .spin{color:var(--sage-text)}
.slot{margin-top:8px}
.ex{display:flex;flex-direction:column;gap:0}
.ex .exl{font-size:var(--meta);color:var(--ink2);margin-bottom:2px}
.pentry[data-ph=idle] .slot,.pentry[data-ph=listen] .slot{height:96px;display:flex;flex-direction:column;justify-content:flex-end}
.pentry[data-ph=listen] .slot{justify-content:center}
.ex button{text-align:left;font-size:var(--meta);color:var(--ink2);min-height:24px;padding:1px 0}
.ex button:hover{color:var(--ink)}
.bars{height:48px;display:none;align-items:center;justify-content:center;gap:5px}
.bars i{width:5px;height:44px;border-radius:3px;background:var(--sage-text);transform:scaleY(.35);animation:bar 1.1s ease-in-out infinite}
@keyframes bar{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.hint{font-size:var(--meta);color:var(--muted);display:none}
.khint{font-size:var(--meta);color:var(--muted);display:none;margin-top:6px}
.t-desk .pentry[data-ph=typed]:not(.voice) .khint,.t-desk .pentry[data-ph=fix] .khint{display:block}
.vcd{display:none}
.pentry[data-ph=typed].vc .vcd{display:block}
.pentry[data-ph=typed].vc .hint{display:none!important}
.lisl{font-size:var(--meta);color:var(--muted);display:none;text-align:center;margin-bottom:6px}
.pentry[data-ph=listen] .lisl{display:block}
.fixnote{font-size:var(--meta);color:var(--ink2);display:none}
.pentry[data-ph=idle] .ex{display:flex}
.pentry:not([data-ph=idle]) .ex{display:none}
.pentry[data-ph=listen] .bars{display:flex}
.pentry[data-ph=typed].voice .hint{display:block}
.pentry[data-ph=fix] .fixnote{display:block}
.pentry[data-ph=send] .slot,.pentry[data-ph=reply] .slot,.pentry[data-ph=kept] .slot{display:none}
.prow{display:flex;gap:8px;margin-top:10px}
.prow .btn{height:44px}
.t-phone .prow .btn{height:48px}
.prow .btn:not(.grow){min-width:96px}
#pin[data-ph=send] .prow{display:none}
#pin[data-ph=reply] .prow,#pin[data-ph=kept] .prow{margin-top:0;padding-top:12px;border-top:1px solid var(--brow)}
#pin[data-ph=reply] .pbody,#pin[data-ph=kept] .pbody{padding-bottom:4px}
.btn.hold.held{box-shadow:0 0 0 4px var(--sage-light),inset 0 0 0 100px rgba(0,0,0,.3)}
.pfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px -2px -8px 0;min-height:44px}
.ln.info .tx{font-weight:500}
.pfoot .quiet{flex:1;min-width:0}
/* reply */
.lines{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.ln{border-radius:8px}
.lt{display:flex;align-items:center;gap:10px;min-height:44px;padding:4px 0}
.lt .dot{width:6px;height:6px;border-radius:50%;background:var(--sage-text);flex:none;margin-top:1px}
.lt .tx{flex:1;min-width:0;font-size:var(--body)}
.ln.undone .tx{color:var(--muted)}
.ln.undone .dot{background:var(--track)}
.ln.info .dot{background:var(--subbar-2)}
.ln.no .tx{color:var(--ink2)}
.sub{font-size:var(--meta);color:var(--ink2);margin:-6px 0 6px 16px}
/* r6: two question looks with two jobs. An offer (optional, done already: "Add oat milk ...?") sits under its line,
   indented, on the plain panel. An ask-first question (nothing written until you tap; it waits in To review if you
   close) stands on its own, flush, in To review's amber. Both are stronger than the talk row under them. */
.q,.qp{border-radius:8px;padding:10px 12px}
.q{background:var(--panel);border:1px solid var(--bcard);margin:2px 0 8px 16px}
.qp{background:var(--amber-light);border:1px solid rgba(152,128,72,.45);margin:8px 0}
.qp .qt{color:var(--amber-dark)}
.qp .chip{background:var(--card);border-color:rgba(152,128,72,.45)}
.qt{font-weight:500;font-size:var(--body);margin-bottom:8px}
.qb{display:flex;flex-wrap:wrap;gap:8px}
.t-phone .qb .chip{flex:1 1 auto}
.qerr{font-size:var(--meta);color:var(--urgent-text);margin-top:8px}
.heard{font-size:var(--meta);color:var(--muted);margin-top:6px}
.more{font-size:var(--meta);color:var(--muted);margin:0 0 8px 16px}
.slotl{font-size:var(--meta);color:var(--ink2);margin:6px 0 8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.slotl span{flex:1;min-width:0}
.cd{height:4px;border-radius:2px;background:var(--track);overflow:hidden;margin:0 0 8px}
.cd i{display:block;height:100%;width:100%;background:var(--sage-text);transform-origin:left;transition:transform linear}
.racts{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 2px}
.said{font-style:italic}
.kept{display:flex;gap:10px;align-items:center;padding:4px 0 8px}
.kept .ic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--amber-light);color:var(--amber-dark)}
.kept.err .ic{background:var(--urgent-bg);color:var(--urgent-text)}
.kept.ok .ic{background:var(--sage-light);color:var(--sage-text)}
.kept .kt{font-weight:500}
.kept .kq{font-size:var(--meta);color:var(--ink2);margin-top:2px}
.kbtns{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 8px}
.t-phone .kbtns .btn{flex:1 1 auto}
.last{background:var(--panel);border:1px solid var(--bcard);border-radius:8px;padding:6px 10px 6px 12px;margin-bottom:10px}
.last .lq{font-size:var(--meta);color:var(--muted)}
.last .lt{min-height:40px;padding:0}
/* fake phone keyboard (shots and the state bar only; a real iPhone shows its own) */
.kb{position:absolute;left:0;right:0;bottom:0;height:291px;background:#D2D5DB;z-index:45;transform:translateY(100%);transition:transform .26s var(--ease);padding:8px 3px 30px;display:flex;flex-direction:column;gap:11px}
.kb.on{transform:none;visibility:visible}
.kb:not(.on){visibility:hidden;transition:transform .26s var(--ease),visibility 0s .26s}
.kb .kr{display:flex;gap:6px;justify-content:center;flex:1}
.kb .kr i{flex:0 0 33px;background:#fff;border-radius:5px;box-shadow:0 1px 0 rgba(0,0,0,.3);font-style:normal;font-size:20px;display:grid;place-items:center;color:#111}
.kb .kr i.w{flex:0 0 44px;background:#ABB0BA}
.kb .kr i.sp{flex:1;font-size:15px}
/* r4: Groceries v3's toast as is (radius 12, min 48, 15 px, page-colour words, the action a 44 button) */
.toast{position:absolute;z-index:50;right:24px;bottom:24px;max-width:340px;background:var(--ink);color:var(--page);border-radius:12px;padding:6px 6px 6px 16px;min-height:48px;font-size:15px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-pop);opacity:0;transform:translateY(8px);transition:opacity .24s var(--ease),transform .24s var(--ease);pointer-events:none}
.toast>span{padding:6px 0;flex:1;min-width:0}
.t-ipad .toast{font-size:17px}
.toast.on{opacity:1;transform:none;pointer-events:auto}
.toast button{color:var(--page);font-weight:500;font-size:16px;text-decoration:underline;text-underline-offset:3px;border-radius:8px;padding:0 12px;height:44px;flex:none}
.toast button:hover{box-shadow:inset 0 0 0 100px rgba(250,244,235,.12)}
.t-phone .toast{left:8px;right:8px;bottom:72px;max-width:none}
/* r6: Groceries v3's menu (kit Popover: 1px card edge, 12 padding, 240 wide) */
.menu{position:absolute;z-index:60;background:var(--card);border:1px solid var(--bcard);border-radius:12px;box-shadow:var(--shadow-pop);padding:12px;min-width:240px;display:none}
.menu hr{border:0;border-top:1px solid var(--brow);margin:4px 8px}
.menu.on{display:block;animation:enter .2s var(--ease) both}
.menu button{display:flex;width:100%;min-height:44px;align-items:center;padding:0 12px;border-radius:8px;font-size:var(--body);text-align:left;gap:8px}
.menu button:hover{background:#F0EEE3}
.t-ipad .menu button{font-size:17px}
.menu .mh{font-size:13px;font-weight:500;color:var(--muted);padding:6px 12px 2px;text-transform:uppercase;letter-spacing:.06em}
.menu button.on{background:var(--sage-light);color:var(--sage-text);font-weight:600}
#mockmenu{max-height:80%;overflow:auto;width:260px}

/* ---------- Today (quiet background page) ---------- */
/* r4: Today and Capture share Groceries v3's .wrap grid (1212, 340 / 300 side, padding 24 16) */
.today{max-width:1212px;margin:0 auto;padding:24px 16px 96px}
.one .today{max-width:820px}
.t-phone .today{padding:16px 12px 96px}
.card{background:var(--card);border-radius:12px;border:1px solid var(--bcard);box-shadow:var(--shadow-card)}
.tc{padding:var(--pad);margin-bottom:16px}
.tc h3{margin:4px 0 2px;font-size:22px;font-weight:600}
.tc p{margin:0;color:var(--ink2)}
.trow{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.t-phone .trow{grid-template-columns:1fr;gap:0}
.strip{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:0 16px;margin-bottom:16px;border-radius:12px;background:var(--amber-light);color:var(--amber-dark);border:1px solid rgba(152,128,72,.45);font-weight:600;text-align:left}
.strip .sq{flex:1;min-width:0;font-weight:400;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip:hover{box-shadow:var(--hover)}

/* ---------- Capture page ---------- */
.cpw{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;max-width:1212px;margin:0 auto;padding:24px 16px 96px;align-items:start}
.cpw.w300{grid-template-columns:minmax(0,1fr) 300px}
.cpw>.col+.col{position:sticky;top:24px}
.one .cpw{grid-template-columns:minmax(0,1fr);max-width:820px;padding:16px 16px 112px;gap:16px}
.t-phone .cpw{padding:12px 12px 112px}
.col{display:flex;flex-direction:column;gap:24px;min-width:0}
.one .col{gap:16px}
.sec{padding:0 var(--pad) 12px}
/* r4: every card has the same head: a tinted strip with a real heading (17-18 semibold); eyebrows only for groups */
.sh{display:flex;align-items:center;gap:8px;min-height:52px;border-radius:12px 12px 0 0;margin:0 calc(var(--pad)*-1) 0;padding:6px var(--pad);background:var(--panel);border-bottom:1px solid var(--brow)}
.sh h2{flex:1;min-width:0;margin:0;font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.t-ipad .sh h2{font-size:20px}
.t-phone .sh{gap:6px}
.t-phone .sh .sel,.t-phone .sh .jump{padding:0 8px 0 10px;gap:2px}
.one .sh{position:sticky;top:0;z-index:2}
.rvh{background:var(--amber-light);border-bottom-color:rgba(152,128,72,.3)}
.rvh h2{color:var(--amber-dark)}
.sq1{font-size:var(--meta);color:var(--ink2);margin:8px 0 4px}
.sub2{font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 2px;display:flex;align-items:center;gap:8px}
.t-ipad .sub2{font-size:14px}
.more2{margin:4px 0 2px}
.more2 .btn{white-space:normal;height:auto;min-height:44px;padding:10px 14px;text-align:left;max-width:100%;line-height:1.3}
.rv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 8px;padding:10px 0;border-top:1px solid var(--brow)}
.sub2+.rv{border-top:0}
.rv .rq{font-weight:500}
.rv .rw{font-style:italic}
.rv .chips{grid-column:1/2;display:flex;flex-wrap:wrap;gap:8px}
.rv .rm{grid-column:1/2;font-size:var(--meta);color:var(--muted)}
.rv .ra{grid-column:2;grid-row:1/3;display:flex;align-items:flex-start;gap:6px}
/* r7: a row's ⋯ sits top-right and never pads the row (44 hit area kept, pulled into the margin) */
.rv .ra .dots,.enh .dots{margin:-10px -10px -10px 0}
.rv.res .rq{font-weight:400}
.rv .rgo{grid-column:1/2;display:flex;gap:8px;align-items:center}
.t-phone .rv .chips .chip{flex:1 1 auto;padding:0 10px}
.t-phone .rv .ra{grid-row:1/2}
.t-phone .rv .chips,.t-phone .rv .rm,.t-phone .rv .rgo{grid-column:1/3}
.day{margin:16px 0 4px}
.en{padding:12px 0;border-top:1px solid var(--brow)}
.day+.en{border-top:0}
.enh{display:flex;align-items:flex-start;gap:8px}
.enq{font-style:italic;color:var(--ink);flex:1;min-width:0}
.enm{display:flex;align-items:center;gap:6px;font-size:var(--meta);color:var(--muted);margin:4px 0 4px}
/* r6: a line with a button gets 4 px above and below (8 px clear between two stacked Undos); a line with none is text height */
.enl{display:flex;align-items:center;gap:10px;padding:4px 0}
.enl:has(button){min-height:52px}
.enl .tx{flex:1;min-width:0}
.enl.undone .tx{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(96,94,85,.5)}
.enl .by{font-size:var(--meta);color:var(--muted)}
.enl.none .tx,.enl.drop .tx{color:var(--ink2)}
.enl.drop .tx{font-size:var(--meta)}
.ena{display:flex;justify-content:flex-end;align-items:center;gap:6px;margin-top:4px}
.ena .quiet{flex:1}
.filt{display:flex;align-items:center;gap:8px;font-size:var(--meta);color:var(--ink2);background:var(--panel);border-radius:8px;padding:4px 4px 4px 12px;margin:4px 0 8px}
.filt span{flex:1}
/* r6: the Notes jump is a forward move, so it is the kit tan Button with a down arrow (44), not the back-out outline */
.jump{padding:0 12px 0 10px;gap:4px}
/* r6: "Your Words" is a quiet toggle until picked (panel fill, card edge); picked = kit Chip on */
.wtog{min-height:44px;padding:0 12px;border-radius:8px;background:var(--panel);border:1px solid var(--bcard);font-size:var(--meta);font-weight:500;color:var(--ink2);white-space:nowrap;flex:none;transition:transform 50ms var(--ease)}
.wtog:hover{box-shadow:var(--hover)}.wtog:active{transform:scale(.97)}
.wtog.on{background:var(--chip-on);border-color:var(--sage-text);color:var(--ink);font-weight:600}
.nt{padding:10px 0;border-top:1px solid var(--brow);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:start}
.nt>.ntx{grid-column:1}.nt>.wtog{grid-column:2;grid-row:1/3}
/* r7: in the 300 side column the toggle drops under who/when, so the note keeps the full width */
.w300 .nt>.ntx{grid-column:1/3;grid-row:1}.w300 .nt>.nm{grid-column:1/3;grid-row:2}.w300 .nt>.wtog{grid-column:1/3;grid-row:3;justify-self:start;margin-top:4px}.w300 .nt>.nraw{grid-row:4}
.sq1+.nt{border-top:0}
.nt .nm{font-size:var(--meta);color:var(--muted);grid-column:1}
.nt .nraw{font-size:var(--meta);color:var(--ink2);margin-top:4px;display:none;grid-column:1/3}
.nt.raw .nraw{display:block;animation:enter .22s var(--ease) both}
.empty{max-width:520px;margin:64px auto;text-align:center;padding:32px 24px}
/* r6: Groceries v3 empty state: 80 square, radius 16, panel-alt; title 30 (32 iPad, 26 phone) */
.empty .pic{width:80px;height:80px;margin:0 auto 16px;border-radius:16px;background:var(--sunken);display:grid;place-items:center}
.empty .pic svg{width:48px;height:48px}
.empty h2{font-size:30px;font-weight:600;margin:0 0 12px;line-height:1.2}
.t-ipad .empty h2{font-size:32px}.t-phone .empty h2{font-size:26px}
.empty .exs{display:flex;flex-direction:column;gap:4px;color:var(--ink2);margin-bottom:16px}
.empty .tag{color:var(--muted);margin-bottom:6px}
/* r6: Groceries v3 skeleton (.skel: track to panel shimmer); each loading card has the same 52 head strip */
.shp{height:12px;border-radius:4px;background:linear-gradient(90deg,var(--track) 0%,var(--panel) 50%,var(--track) 100%);background-size:200% 100%;animation:shim 1.4s infinite linear}
@keyframes shim{to{background-position:-200% 0}}
.shcard{padding:0 var(--pad) 12px}
.shcard .sh .shp{width:34%;margin:0}
.shcard>.shp{margin:14px 0}
.locked{max-width:480px;margin:64px auto;padding:24px;text-align:center}

/* motion: every move 0.16-0.30 s (DESIGN 2.9, C-056); everything animates in and out (Tyler 10-09 P1) */
.enter{animation:enter .22s var(--ease) both}
.leave{animation:leave .16s var(--ease) both;pointer-events:none}
@keyframes enter{from{opacity:0;transform:translateY(4px)}}
@keyframes leave{to{opacity:0;transform:scale(.98)}}
@keyframes fade{from{opacity:0}}
html.noanim *,html.noanim *::before,html.noanim *::after{animation:none!important;transition:none!important}
html.rm *,html.rm *::before,html.rm *::after{animation-duration:.12s!important;animation-name:fade!important;animation-iteration-count:1!important;transition-duration:.12s!important}
html.rm .pin.glide{transition:none}
html.rm .bars i{transform:scaleY(.6)}
html.rm .bars i:nth-child(odd){transform:scaleY(.9)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.12s!important;animation-name:fade!important;animation-iteration-count:1!important;transition-duration:.12s!important}.bars i{transform:scaleY(.7)}}
</style>
</head>
<body>
<div id="ctl">
 <h1>Capture (p11 v1)</h1>
 <span class="lbl">Device</span><span class="seg" id="devs"></span>
 <span class="lbl">Pop-up</span><span class="seg" id="pstates"></span>
 <span class="lbl">Page</span><span class="seg" id="gstates"></span>
 <span class="lbl">World</span><button class="tg" id="w-off">Offline</button><button class="tg" id="w-live">AI Off</button><button class="tg" id="w-fail">Server Fails</button><button class="tg" id="w-rm">Reduce Motion</button>
</div>
<div id="wrap">
 <div id="stage"><div id="scaler"><div id="dev"></div></div></div>
 <div id="notes"></div>
</div>
<script>

 const isPage=GSTATES.some(g=>g[0]===id);seed(isPage);
 if(isPage){S.page='capture';
  if(id==='loading')S.pstate='loading';
  if(id==='empty'){S.pstate='empty';S.entries=[];S.notes=[];S.review=[];}
  if(id==='busy')busySeed();
  if(id==='limited'){S.who='limited';S.review=[{id:'r9',type:'q',by:'maria',q:'Which yogurt is out?',chips:['Plain yogurt','Berry yogurt','All of them'],from:'From Tuesday: “out of yogurt”'}];}
  /* r4: live off, guest words go to the old sort (FP B12), so To review holds 2 and the bar's "3 not sorted yet" is a different 3 */
  if(id==='liveoff'){S.live=false;S.unsorted=3;S.review=S.review.filter(r=>r.type!=='guest');[['add 2 lemons and milk','alex'],['used the last of the butter','maria'],['note party is saturday','alex']].forEach(([q,b],i)=>S.entries.unshift({id:'u'+i,by:b,day:'Today',time:['10:05 am','10:21 am','10:40 am'][i],quote:q,unsorted:true,lines:[]}));}
 }
 build();syncWorld();
 const say=w=>{S.words=w;$('#pbox').value=w;};
 if(!isPage&&id!=='closed'){S.pop=true;$('#pop').classList.add('show');$('#scrim').classList.add('on');}
 const instant=R=>{R.quote=S.words;S.reply=R;showReplyNow(R);};
 switch(id){
  case 'listen':S.voice=true;say("We're out of");setPh('listen',true);break;
  case 'vcount':S.voice=true;say("We're out of oat milk");startVc();setPh('typed',true);break;
  case 'trip':say('Add lemons');instant(route(S.words));startTimer();break;
  case 'guest':say('Can we get popsicles');instant(keptFor('guest'));startTimer();break;
  case 'usedup':S.usedup=true;say('Used 3 eggs and add lemons');instant(keptFor('usedup'));break;
  case 'tapfail':say("We're out of oat milk");{const R=route(S.words);instant(R);S.online=false;syncWorld();R.lines[0].q.err="No internet, so nothing changed. Try again when you're back online.";renderReply();}break;
  case 'typed':say("We're out of oat milk");setPh('typed',true);if(k()==='phone')S.kb=true;break;
  case 'send':say("We're out of oat milk");setPh('send',true);S.step=1;stepUI();break;
  case 'reply':say("We're out of oat milk");instant(route(S.words));break;
  case 'multi':S.voice=true;say(SAY[1]);instant(route(S.words));break;
  case 'unsure':S.voice=true;say("We're out of milk");instant(route(S.words));break;
  case 'countdown':say('Used 3 eggs');instant(route(S.words));startTimer();break;
  case 'closedq':say("We're out of milk");instant(route(S.words));break;
  case 'undo':say("We're out of oat milk");{const R=route(S.words);instant(R);R.lines[0].st='undone';R.lines[0].q=null;linesChanged();S.fixNote='Undone. Oat milk back to 1 carton. Your words are back if you want to fix them.';S.fixFrom=S.words;S.reply=null;setPh('fix',true);}break;
  case 'fix':S.voice=true;say("Used 3 eggs, we're out of oat milk");S.fixFrom=S.words;S.fixNote='Undone. Fix your words and send again.';setPh('fix',true);break;
  case 'answer':say('Do we have eggs?');instant(route(S.words));startTimer();break;
  case 'listed':S.listed=true;say("We're out of oat milk");instant(route(S.words));startTimer();break;
  case 'offline':S.online=false;say('Used 3 eggs and add lemons');instant(keptFor('off'));syncWorld();break;
  case 'aioff':S.live=false;say('Add 2 lemons and milk');S.unsorted=1;instant(keptFor('aioff'));startTimer();break;
  case 'error':S.fail=true;say("We're out of oat milk");instant(keptFor('fail'));break;
 }
 renderPop();placePop();
 if(id==='closedq'){closePop({nofocus:true});}
  renderMain(false);
 /* r4: Notes is the sticky side column on wide screens, so only the one-column page scrolls to it (card tops stay put) */
 if(id==='notes'){const f=$('.nt');f&&f.classList.add('raw');const b=f&&f.querySelector('[data-nraw]');if(b){b.classList.add('on');b.setAttribute('aria-pressed','true');}if(k()==='phone'||k()==='up')scrollToSec('notes');}
 if(id==='closedq'){html.classList.remove('noanim');}
 requestAnimationFrame(()=>requestAnimationFrame(()=>html.classList.remove('noanim')));
 $$('#pstates button,#gstates button').forEach(b=>b.classList.toggle('on',b.dataset.s===id));
 note();
}
function showReplyNow(R){logEntry(R,false);keepWords(R);addNotes(R);setPh(R.kind==='kept'?'kept':'reply',true);renderReply();}
function busySeed(){
 const more=[['alex','Today','11:02 am','add milk eggs bread butter cheese apples bananas yogurt coffee rice beans tortillas',[{st:'done',t:'Added 12 to your grocery list: milk, eggs, bread and 9 more.',u:'Undone. 12 off your grocery list.',each:1}]],
  ['maria','Today','10:40 am','used 2 cups of flour and 3 eggs',[{st:'done',t:'Used 2 cups of flour. 6 cups left.',u:'Undone. Flour back to 8 cups.'},{st:'done',t:'Used 3 eggs. 6 left.',u:'Undone. Eggs back to 9.'}]],
  ['maria','Today','10:12 am','we are out of juice boxes',[{st:'done',t:'Juice boxes set to 0 (was 4).',u:'Undone. Juice boxes back to 4.'}]],
  ['alex','Today','9:58 am','sam is allergic to peanuts',[{st:'done',t:'Saved as a note: “Sam is allergic to peanuts.”',u:'Undone. Note removed.'},{st:'none',t:"Capture can't change food needs."}]],
  ['alex','Today','9:31 am','running low on coffee',[{st:'none',t:'Coffee not changed: running low.'}]],
  ['alex','Today','9:20 am','used a pinch of salt',[{st:'none',t:'Salt not changed: a pinch has no amount.'}]]];
 more.reverse().forEach(([b,d,t,q,l],i)=>S.entries.unshift({id:'b'+i,by:b,day:d,time:t,quote:q,lines:l}));
 S.notes.unshift({t:'Sam is allergic to peanuts.',raw:'sam is allergic to peanuts',by:'alex',age:'today'});
 /* r4: "threw out the spinach" asks first (LOGIC S9), so it is only a To review row, never also a written line */
 S.review.unshift({id:'r5',type:'q',by:'alex',q:'Is all the spinach gone?',chips:['Yes, All Gone','Some Left'],from:'From 9:40 am: “threw out the spinach”'},{id:'r6',type:'q',by:'alex',q:'You said 2 eggs, then 3. Which?',chips:['2 Eggs','3 Eggs'],from:'From Yesterday: “used two eggs no wait three”'},{id:'r7',type:'q',by:'alex',q:'How many cloves of garlic are left?',chips:['None Left','Pick Amount'],from:'From Nov 23: “used some garlic”'});
 S.review.push({id:'r8',type:'unsent',by:'alex',w:'add foil and freezer bags',m:'You · Today 8:15 am · You left before it was sent.',act:'Send Now'});
}

/* ---------- notes beside the device ---------- */
const NOTE={closed:['Closed','Today, with the rail. Capture is the dark green soft square at the top of the rail (C-076). Press it.'],
 open:['Open','The box, Hold to Talk with Type beside it, three example lines, and a small Open Capture link (picks 2A, 8A, 5C). In the mockup, tap an example to fill the box, or press Hold to Talk: it "hears" a sample line.'],
 listen:['Listening','Bars in the accent green, not red. Words appear at the top; the bars sit right above the button you hold (round 3 H2).'],
 vcount:['Spoken, sending in 8','After you let go, the words send by themselves after 8 seconds ("Just start with 8 seconds", Tyler 10-09 R2). Send Now skips the wait; a tap on the words stops it to edit; Cancel stops it (Undo in the toast brings the words back). Closing sends it, through the same offline / guest / AI-off checks as Send (Tyler 10-09 R3).'],
 typed:['Typed','Send is now the main button (7A). On a computer, Ctrl+Enter (⌘ Return) sends (DESIGN 3.4.6). On iPhone a tap in the box raises the keyboard and the pop-up slides up to sit on it (6A).'],
 send:['Sending','A step bar over the faded words, not a "Working" block (round 1 S3). "Got your words" for typed, "Heard you" for spoken; "Done" only when the reply is back. GUESS: timed steps; the live send reports no progress.'],
 reply:['Reply','"Oat milk set to 0 (was 1 carton)." then a one-tap follow-up: Yes, No, or Change Amount (1-99, LOGIC §2.3). Once it is answered, the pop-up closes by itself again (8 s). While a question waits, Hold to Talk drops to the quiet look.'],
 multi:['Several things','One line per change, each with Undo. At most 2 questions on screen. Ask-first questions are amber (they wait in To review if you close); offers sit under their line on the plain panel (skipped if you close). Only the middle scrolls; the talk row and Open Capture stay put.'],
 unsure:['Not sure','It asks before writing stock. Close it now and the question goes to To review on Today (4C).'],
 countdown:['Closing by itself','Nothing is open, so it closes after 8 s (3C). Touch it to keep it open.'],
 closedq:['Closed with a question','"1 question sent to To review on Today." The Today strip shows it.'],
 undo:['Undo','A one-line typed reply has no Fix Words button, so its Undo puts the words back in the box: "Undone. Oat milk back to 1 carton." Fix and Send, or close (the words already sit in Recent changes).'],
 fix:['Fix words','"Undone. Fix your words and send again." Cancel keeps unchanged words in Recent changes; changed words wait in To review.'],
 answer:['Answer','Questions get a read-only answer. Nothing is written.'],
 listed:['Already on the list','No offer; it says "Oat milk is already on your list." (round 2 call 1).'],
 trip:['Mid-trip','Alex is shopping, so "add lemons" goes straight onto the trip: "Added lemons to your trip." (pick 9A; needs G7 / G38).'],
 offline:['Offline','Nothing changed. The words wait in To review from now on (close and they stay); Send Now works once you are back online (World: Offline).'],
 tapfail:['Tap failed','Wi-Fi dropped, then Yes: "No internet, so nothing changed. Try again when you\'re back online." Yes stays (LOGIC §6, G29, T37).'],
 aioff:['AI off','Same box. The reply says "Saved. Sorted soon." (10B).'],
 usedup:['AI used up','"AI help is used up for this month. Your words are saved." Keep as Note is the one main button. LOGIC §6 also lists [Open Capture]; the pop-up\'s own Open Capture link is that door, so it is not drawn twice.'],
 guest:['Guest (Sam)','"Saved. An adult will check this." No buttons; it closes by itself (G17 / B6). Owner and Full Access see it under From guests.'],
 error:['Error','"Couldn\'t do that. Nothing changed. Your words are saved." Try Again is the one main button; Hold to Talk goes quiet.'],
 loading:['Loading','The shaped empty page (C-066): rail, bars and card shapes, no words.'],
 empty:['First visit','One centred empty state with three examples.'],
 returning:['Returning','To review on top (amber head), Recent changes under it, Notes beside it. The rail stays (5C).'],
 busy:['Busy','Many entries, 4 questions waiting (3 shown; See More right under Questions opens the 4th), a 12-item grocery line with Show Each. Some Left / Pick Amount open the amount in place; an answered row has Undo.'],
 notes:['Notes','Tidied text first, the speaker\'s words one tap away: "Your Words" on yours, "Maria\'s Words" on hers (10-09 R3).'],
 limited:['Limited member (Maria)','Sees everyone\'s changes; can undo only her own. Others say who can undo. No Sort Now.'],
 liveoff:['Live off','Bar: "3 not sorted yet" + Sort Now (FP §3.1). Entries say "Saved. Sorted soon." To review holds 2: guest words go to the old sort.']};
function note(){const n=$('#notes');if(!n||FULL)return;const x=NOTE[S.sid]||['Click through','Use the pop-up and page as you would the app.'];
 n.innerHTML=`<div class="note"><b>${x[0]}</b>${x[1]}</div><div class="note"><b>Try</b>Type "We're out of oat milk" and Send. Tap Yes. Close and reopen: the last capture shows above a fresh box. Open Capture opens the page with the rail kept.</div><div class="note"><b>Not agreed yet</b>Brief agreed 11-25; this mockup is not. Open points: BRIEF.md §6.</div>`;}

/* ---------- boot ---------- */
function bootBar(){
 $('#devs').innerHTML=Object.entries(DEV).map(([kk,v])=>`<button data-d="${kk}" class="${kk===S.d?'on':''}">${v.n}</button>`).join('');
 $('#pstates').innerHTML=PSTATES.map(([s,l])=>`<button data-s="${s}">${l}</button>`).join('');
 $('#gstates').innerHTML=GSTATES.map(([s,l])=>`<button data-s="${s}">${l}</button>`).join('');
 $$('#devs button').forEach(b=>b.onclick=()=>{S.d=b.dataset.d;$$('#devs button').forEach(x=>x.classList.toggle('on',x===b));applyState(S.sid||'closed');});
 $$('#pstates button,#gstates button').forEach(b=>b.onclick=()=>applyState(b.dataset.s));
 $('#w-off').onclick=()=>toggleWorld('off');$('#w-live').onclick=()=>toggleWorld('live');$('#w-fail').onclick=()=>toggleWorld('fail');$('#w-rm').onclick=()=>toggleWorld('rm');
}
if(FULL)S.d=fullPick();else{const d=Q.get('d');if(d&&DEV[d])S.d=d;}
bootBar();
applyState(Q.get('state')||'closed');
</script>
