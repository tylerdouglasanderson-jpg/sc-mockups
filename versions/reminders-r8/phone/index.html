*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--page)}
body{color:var(--ink);font:400 15px/1.45 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden;font-variant-numeric:tabular-nums;text-wrap:pretty}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input{font:inherit;color:inherit}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:16px;height:16px}
:focus-visible{outline:2px solid var(--sage-text);outline-offset:2px}

/* ONE themed scroll bar for every scroller (DESIGN 4.10) */
.scroll,.side,.sheet .bd,.menu .mi,.mockmore{scrollbar-width:thin;scrollbar-color:rgb(var(--c-muted) / .35) transparent}
.scroll::-webkit-scrollbar,.side::-webkit-scrollbar,.sheet .bd::-webkit-scrollbar,.menu .mi::-webkit-scrollbar{width:12px;height:12px}
.scroll::-webkit-scrollbar-thumb,.side::-webkit-scrollbar-thumb,.sheet .bd::-webkit-scrollbar-thumb,.menu .mi::-webkit-scrollbar-thumb{background:rgb(var(--c-muted) / .35);border:3px solid transparent;background-clip:padding-box;border-radius:999px}
.scroll::-webkit-scrollbar-track,.side::-webkit-scrollbar-track{background:transparent}

.top::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--wood-sheen-top),var(--wood-sheen-bottom));pointer-events:none}
.wordmark{font-style:italic;font-weight:600;font-size:22px;position:relative}
.top .sp{flex:1}
.av{display:inline-grid;place-items:center;border-radius:50%;font-weight:600;color:var(--hdr-text);flex:none}
.av.hdr{width:28px;height:28px;font-size:12px;background:var(--member-1);box-shadow:0 0 0 2px var(--hdr-text);position:relative}
.av.m0{background:var(--guest)}.av.m4{background:var(--member-4)}
.rail{background:var(--card);border-right:1px solid var(--bcard);padding:12px 8px;display:flex;flex-direction:column;gap:4px;min-height:0}
.rail .cap{height:44px;border-radius:8px;background:var(--sage);color:var(--ink);display:flex;align-items:center;gap:8px;padding:0 12px;font-weight:500;font-size:16px;margin-bottom:8px}
.rail .cap:hover{box-shadow:var(--hover)}
.rail .ri{display:flex;align-items:center;gap:12px;height:44px;border-radius:8px;padding:0 12px;color:var(--ink2);font-weight:500;font-size:16px;text-align:left;flex:none}
.rail .ri svg.i,.rail svg.ni{width:24px;height:24px;flex:none}
svg.ni{display:block;overflow:visible}
.rail .ri:hover{box-shadow:var(--hover)}
.rail .ri.on{background:var(--sage-light);color:var(--sage-text)}
.rail hr{border:0;border-top:1px solid var(--bcard);margin:4px 8px}
.rail .grow{flex:1}
.body{display:grid;grid-template-rows:46px 1fr auto;min-height:0;min-width:0;position:relative}
.bar{background:var(--subbar);border-bottom:1px solid var(--brow);position:relative;display:flex;z-index:5}
.bar .in{display:flex;align-items:center;gap:12px;width:100%;max-width:1212px;margin:0 auto;padding:0 16px;min-width:0}
.bar .ttl{font-weight:600;font-size:16px;color:var(--subbar-date);white-space:nowrap;overflow:hidden;text-overflow:clip;min-width:0}
.bar .meta{font-size:13px;color:var(--subbar-2);padding-left:12px;border-left:1px solid var(--chip-warm-edge);display:flex;align-items:center;gap:8px;white-space:nowrap}
.bar .meta .updm{margin-left:-8px}
/* round 37: the separator kit part (rule E2). 1 px, one letter tall, light grey; the tan bar's own line colour there */
.sep{display:inline-block;width:1px;height:.95em;background:rgb(var(--c-muted) / .42);margin:0 8px;vertical-align:-.14em;position:relative;flex:none}
.bar .sep{background:var(--chip-warm-edge);opacity:.7}
.sep .vh,.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.gh .sep{height:.85em;vertical-align:-.1em}
/* round 37: room under the list while a toast sits at its foot */
@media (min-width:1101px){.tup .wrap>.lst{padding-bottom:96px}}
.bar .sp{flex:1}
.bar .crumb{font-weight:600;font-size:16px;color:var(--subbar-2);border-radius:8px;padding:0 4px;margin:0 -4px;height:36px;display:inline-flex;align-items:center;white-space:nowrap;position:relative}.bar .crumb::after{content:"";position:absolute;inset:-4px 0}
.bar .crumb:hover{box-shadow:var(--hover);color:var(--subbar-date)}
.bar .sepc{color:var(--subbar-2);flex:none}
/* round 37 (STANDARDS "Back in the tan bar is '< Page name'", agreed 16:59; C-091 r4): one text button, arrow + where it goes */
.bar .bk{position:relative;display:inline-flex;align-items:center;gap:2px;height:32px;padding:0 8px 0 6px;margin-left:-10px;border-radius:8px;color:var(--subbar-2);font-weight:500;font-size:16px;white-space:nowrap;flex:0 1 auto;min-width:0;transition:transform .16s var(--ease),box-shadow .2s var(--ease)}
.bar .bk::after{content:"";position:absolute;inset:-6px 0}
.bar .bk svg.i{transition:transform .2s var(--ease)}
.bar .bk .w{overflow:hidden;min-width:0;white-space:nowrap}
.bar .bk:hover{background:rgba(75,105,71,.12);color:var(--subbar-date)}.bar .bk:hover svg.i{transform:translateX(-2px)}
.bar .bk:active{transform:scale(.97);box-shadow:var(--press)}
.touch .bar .bk:hover svg.i{transform:none}
.bar .bk+.itn .sepc{width:14px;height:14px;opacity:.6;margin:0 -4px}
.bar .itemw .itn{gap:8px}.bar .itemw .itn .ttl{font-size:16px;font-weight:600;color:var(--subbar-date)}
.back{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--subbar-date);margin-left:-8px;position:relative;flex:none}
.back:hover{box-shadow:var(--hover)}.back::after{content:"";position:absolute;inset:-4px}
.bar .slot{display:flex;align-items:center;gap:8px}
.bar .back.word{width:auto;padding:0 10px 0 4px;gap:4px;display:inline-flex;align-items:center;font-weight:600;font-size:15px;color:var(--subbar-date);margin-left:-8px}

/* kit Button: 44 tall, four tiers, press = shrink .97 + 16% overlay */
.btn{height:44px;border-radius:8px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:500;font-size:16px;white-space:nowrap;transition:transform .16s var(--ease),box-shadow .2s var(--ease),opacity .2s var(--ease);position:relative;flex:none}
.btn:active{transform:scale(.97);box-shadow:var(--press)}
.btn.pri{background:var(--sage-dark);color:var(--hdr-text)}.btn.pri:hover{box-shadow:inset 0 0 0 100px var(--on-dark-hover)}.btn.pri:active{box-shadow:inset 0 0 0 100px var(--on-dark-press)}
.btn.sec{background:var(--sage);color:var(--ink)}.btn.sec:hover{box-shadow:var(--hover)}
.btn.cancel{background:transparent;border:1px solid var(--ink2);color:var(--ink)}.btn.cancel:hover{box-shadow:var(--hover)}
.btn.tan{background:var(--chip-warm);border:1px solid var(--chip-warm-edge);color:var(--ink)}.btn.tan:hover{box-shadow:var(--hover)}
.btn.wide{width:100%}
.btn.sm{padding:0 12px;font-size:15px}
.bar .btn{height:36px;padding:0 14px;font-size:15px}.bar .btn::after{content:"";position:absolute;inset:-4px 0}
.btn.icon{width:44px;padding:0;background:transparent;color:var(--ink2)}.btn.icon:hover{box-shadow:var(--hover)}
.bar .btn.icon{width:36px;color:var(--subbar-date)}.bar .btn.icon::after{inset:-4px}
.btn.icon[aria-expanded=true]{box-shadow:var(--press)}
.btn.off{opacity:.45;filter:grayscale(1);cursor:default}.btn.off:active,.btn.off:hover{transform:none;box-shadow:none}
.btn[aria-expanded=true].tan{border-color:var(--amber-dark);box-shadow:inset 0 0 0 1px var(--amber-dark)}
.scroll{overflow:auto;min-height:0;overscroll-behavior:contain}
.card{background:var(--card);border-radius:12px;border:1px solid var(--bcard);box-shadow:var(--shadow-card)}
.eyebrow{font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
/* kit Chip (radius 8, never pills) and TagChip */
.chip{height:44px;border-radius:8px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:15px;color:var(--ink);background:var(--chip);border:1px solid transparent;font-weight:600;white-space:nowrap;transition:transform .16s var(--ease),background .2s var(--ease)}
.chip:hover{box-shadow:var(--hover)}.chip:active{transform:scale(.97);box-shadow:var(--press)}
.chip.on{background:var(--chip-on);border-color:var(--sage-text);font-weight:700}
.chip.cmp{padding:0 12px;font-size:13px}
.chip small{font-weight:500;color:var(--ink2);font-size:13px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.tag{font-size:13px;font-weight:600;color:var(--ink);background:var(--chip);border-radius:8px;padding:0 8px;white-space:nowrap;display:inline-block;line-height:22px}
.tag.ahead{background:var(--sage-light);color:var(--sage-text)}
.tag.plan{background:var(--panel-alt);border:1px solid var(--folder-line);color:var(--ink2);line-height:20px;padding:0 7px}
/* C-080 Coming Later tag, exactly (12 px floor, as C-080's #dev .cl) */
.cl{margin-left:auto;font-size:12px;font-weight:600;color:#6B5B40;border:1px dashed #B89F72;border-radius:6px;padding:1px 8px;line-height:17px;white-space:nowrap;background:#FBF6EC}
.menu button.later{color:#9A9184;cursor:default}.menu button.later:hover{background:none}.menu button.later svg{color:#9A9184}
/* C-095: page layout (Kitchen v3), list head */
/* ---------- page layout (Kitchen v3: the list, and a side pane on wide screens) ---------- */
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px 24px;padding:24px 16px 96px;max-width:1212px;margin:0 auto;align-items:start}
@media (max-width:1320px){.wrap{grid-template-columns:minmax(0,1fr) 352px}}
@media (max-width:1240px){.wrap{grid-template-columns:minmax(0,1fr) 372px;gap:16px;padding:20px 12px 96px}}
.wrap>.banner{grid-column:1/-1;margin:0}
.wrap.one{grid-template-columns:minmax(0,760px);justify-content:center}
.lst{min-width:0}
.lhead{display:flex;align-items:center;gap:12px;padding:10px 16px 10px 20px;border-bottom:1px solid var(--brow);font-size:15px;color:var(--ink2);min-height:64px;line-height:1.3}
.lhead b{color:var(--ink);font-weight:600}
.lhead .sp{flex:1}
.lhead .sum{min-width:0;flex:1}
.lhead .updw{color:var(--muted);font-size:13px}
.lrow .sub .seg{white-space:nowrap}
.lhead .sum small{display:flex;align-items:flex-start;gap:6px;font-size:13px;color:var(--muted);margin-top:2px;line-height:20px}
.lhead .sum small svg{width:16px;height:16px;color:var(--muted);flex:none;margin-top:2px}
.lhead .sum small.fresh{color:var(--ink2);font-weight:400}.lhead .sum small.fresh b{color:var(--sage-text);font-weight:600}
.lhead .sum small.fresh svg{color:var(--sage-text)}
.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
/* C-095: notices */
/* notices (kit notice: tinted card, plain icon, close X; no edge stripes) */
.banner{border-radius:12px;padding:4px 4px 4px 16px;margin-bottom:16px;display:flex;gap:12px;align-items:center;font-size:15px;min-height:52px;box-shadow:var(--shadow-card);border:1px solid var(--bcard);flex-wrap:wrap}
.banner>svg.i{flex:none}
.banner .tx{flex:1;min-width:220px;padding:8px 0}.banner b{font-weight:600}
.banner .sub{display:block;font-size:13px;margin-top:2px;color:var(--ink2)}
.banner .acts{display:flex;gap:8px;flex:none;align-items:center;flex-wrap:wrap;margin-left:auto}
.banner.ok{background:var(--sage-light)}.banner.ok>svg{color:var(--sage-text)}
.banner.off,.banner.ro,.banner.gst{background:var(--panel-alt)}.banner.off>svg,.banner.ro>svg,.banner.gst>svg{color:var(--ink2)}
.lst>.banner{margin-right:12px}
.lfoot{padding:16px 20px;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.lfoot svg{flex:none;margin-top:1px;width:16px;height:16px}
/* C-095: fold row */
.hidl{display:flex;align-items:center;gap:8px;width:100%;min-height:52px;padding:0 20px;border-top:1px solid var(--brow);font-size:15px;color:var(--ink2);text-align:left}
.hidl:hover{box-shadow:var(--hover)}
.hidl .chev{color:var(--muted);transition:transform .2s var(--ease)}
.hidl[aria-expanded=true] .chev{transform:rotate(90deg)}
/* C-095: group head */
.gh{display:flex;align-items:center;gap:8px;min-height:44px;padding:12px 16px 4px 20px;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.menu.up .caret{top:auto;bottom:-7px;transform:rotate(225deg)}

.form>.mrow{grid-column:1/-1;display:grid;grid-template-columns:subgrid;column-gap:16px;row-gap:6px;align-items:center;margin:-8px;padding:8px;border-radius:12px}

/* kit Toast */

/* ================= THE DATE PICKER (B4), the ONE shared part =================
   This block is the standard's look. The date picker mockup AND Kitchen v3 are built from this one file
   (scratch datepicker/dp.css, inlined by both build.py), so they can never look different. */
/* the three colours this part adds to the kit's tokens (BRIEF "For the app build") */
:root{--dp-off:#8C897F;--dp-strike:rgba(84,82,74,.6);--dp-dim:rgba(45,33,22,.12)}
/* 1. The date field: one outline (the kit field, 52 tall), the typed box on the left and the Calendar button on the
   right, split by one thin line. Focus and error colour the whole outline, the split line too. */
.dgrp{display:flex;align-items:stretch;width:100%;max-width:308px;height:52px;border:1px solid var(--ink2);border-radius:8px;background:var(--card);position:relative;transition:box-shadow .2s var(--ease),border-color .2s var(--ease)}
/* in a form the field fills the form's column, like Name (a change panel keeps it at 308) */
.dgrp.dp-full{max-width:none}
.dgrp:has(input:focus){border-color:var(--sage-text);box-shadow:0 0 0 1px var(--sage-text)}
.dgrp.dp-bad,.dgrp.dp-bad:has(input:focus){border-color:var(--urgent-text);box-shadow:0 0 0 1px var(--urgent-text)}
.dgrp:has(input:focus) .dpbtn{border-left-color:var(--sage-text)}.dgrp.dp-bad .dpbtn,.dgrp.dp-bad:has(input:focus) .dpbtn{border-left-color:var(--urgent-text)}
.dgrp .dfield{display:flex;align-items:center;flex:1;min-width:0;height:auto;max-width:none;border:0;border-radius:7px 0 0 7px;padding:0 14px;gap:0;background:none;transition:background .2s var(--ease)}
.dgrp .dfield:focus-within{border:0;padding:0 14px}
.dgrp .dfield input{flex:1;min-width:0;border:0;outline:none;background:none;font-size:16px;height:100%;color:var(--ink)}
.dgrp .dfield input::placeholder{color:var(--muted)}
/* the iPad type tier (as the pages' other fields) */
.dev-ipad .dgrp .dfield input{font-size:17px}
.dpbtn{flex:none;display:flex;align-items:center;gap:6px;padding:0 14px 0 12px;border-left:1px solid var(--ink2);border-radius:0 7px 7px 0;background:var(--chip-warm);color:var(--subbar-date);font-size:15px;font-weight:600;position:relative;transition:background .2s var(--ease),color .2s var(--ease),border-color .2s var(--ease)}
.dpbtn svg.i{width:20px;height:20px;color:currentColor}
.dpbtn:active{box-shadow:var(--press)}
@media (hover:hover){.dpbtn:hover{box-shadow:var(--hover)}}
/* open: a light green tint (not a fill), so the page's Save stays the loudest green */
.dpbtn[aria-expanded=true]{background:var(--sage-light);color:var(--sage-dark)}
/* the button's focus ring stays inside the button, never across the split into the box */
.dpbtn:focus-visible,.dpbtn.dp-kf{outline:none;box-shadow:inset 0 0 0 2px var(--sage-text)}
/* compact (Kitchen's phone bottom-bar hand form only): 44 tall, the button shows only its icon (44 wide) */
.dgrp.dp-sm{height:44px}.dgrp.dp-sm .dpbtn{width:44px;padding:0;justify-content:center}.dgrp.dp-sm .dpbtn .dp-lb{display:none}
/* the confirm flash after a calendar pick (700 ms: green, held 35%, then back) */
.dgrp.dp-flash .dfield{animation:dpflash .7s var(--ease)}
@keyframes dpflash{0%,35%{background:var(--chip-on)}100%{background:transparent}}
/* a picked date not saved yet keeps a light green box until the page's Save (the Save itself stays sage) */
.dgrp.dp-dirty .dfield{background:var(--sage-light)}
.dgrp.dp-dirty.dp-flash .dfield{animation-name:dpflashd}
@keyframes dpflashd{0%,35%{background:var(--chip-on)}100%{background:var(--sage-light)}}
/* the read-out under the field: one line, the same form on every page */
.dread{display:block;font-size:13px;color:var(--ink2);margin-top:-4px;min-height:19px;text-wrap:pretty}
.dread.dp-bad{color:var(--urgent-text);font-weight:600}
.dread .dp-pend{color:var(--sage-text);font-weight:600;white-space:nowrap}
.dread .dp-why{color:var(--muted)}.dread .dp-nw{white-space:nowrap}
.dread.dp-hint{color:var(--muted)}
.dev-ipad .dread{font-size:14px}
/* 2. Our calendar: a popover on computer and iPad, a bottom sheet on the phone. Same parts in both. */
.dp{--cw:44px;--ch:44px;--gap:2px;--pad:12px;position:fixed;z-index:80;background:var(--card);border:1px solid var(--bcard);border-radius:12px;box-shadow:var(--shadow-float);padding:8px var(--pad) 4px;width:calc(var(--cw)*7 + var(--gap)*6 + var(--pad)*2 + 2px);transform-origin:top left;color:var(--ink);font-size:15px;line-height:1.45}
.dp[hidden]{display:none}
.dp.dp-up{transform-origin:bottom left}
/* (round 18, Tyler 11-27 11:18: "it needs to pop up above everything") the calendar and its dim live in the page's TOP
   LAYER (popover="manual", shown from the page root), so no column, side pane, sheet, dialog or clipped box can hold it
   in or draw over it. These undo the browser's own popover look (centred, bordered, scrolling) so ours shows. */
.dp[popover],.dpscrim[popover]{margin:0;overflow:visible;color:var(--ink)}
.dp[popover]{inset:auto;height:auto}
.dpscrim[popover]{border:0;padding:0;width:auto;height:auto}
/* beside a right-hand side pane (computer, sideways iPad): it grows out from the pane's edge, level with the date */
.dp.dp-beside{transform-origin:top right}
/* iPad: wider days for fingers (48), rows stay 44 so the calendar fits under the date on an upright iPad */
.dev-ipad .dp{--cw:48px;--ch:44px}
.dph{display:flex;align-items:center;gap:4px;margin:0 -2px 4px 0}
/* the month name is a real (tan) button: tap it for the months */
.dpm{height:44px;border-radius:8px;padding:0 10px 0 12px;display:inline-flex;align-items:center;gap:6px;font-size:16px;font-weight:600;color:var(--ink);white-space:nowrap;background:var(--chip-warm);border:1px solid var(--chip-warm-edge);min-width:0}
.dpm svg{color:var(--ink2);transition:transform .2s var(--ease);flex:none}
.dpm[aria-expanded=true]{background:var(--sage-light);border-color:var(--sage-text)}
.dpm[aria-expanded=true] svg{transform:rotate(180deg)}
/* month view: the range name is longer, so it sets a little smaller; the arrows and the close x never move */
.dp.dp-mview .dpm{font-size:14px;padding:0 8px 0 10px;gap:4px}
.dph .dp-sp{flex:1}
.dpn{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;color:var(--ink2);flex:none}

@media (hover:hover){.dpm:hover,.dpn:not(:disabled):hover,.dptoday:hover{box-shadow:var(--hover)}}
.dpm:active,.dpn:not(:disabled):active,.dptoday:active{box-shadow:var(--press)}
/* the day area runs out to the calendar's edges, so a sliding month is never cut inside the padding */
.dpbody{height:calc(var(--ch)*6 + var(--gap)*5 + 24px);position:relative;overflow:hidden;margin:0 calc(var(--pad)*-1);padding:0 var(--pad)}
.dpview{position:absolute;top:0;bottom:0;left:var(--pad);right:var(--pad)}

.dpwk{display:grid;grid-template-columns:repeat(7,var(--cw));column-gap:var(--gap);height:24px;align-items:center;transition:opacity .2s var(--ease)}
.dpwk span{text-align:center;font-size:13px;font-weight:500;color:var(--muted)}
.dpbody.dp-months .dpwk{opacity:0}
.dpgrid{border-collapse:separate;border-spacing:var(--gap);margin:calc(var(--gap)*-1);table-layout:fixed;width:calc(var(--cw)*7 + var(--gap)*8)}
/* real column headers for screen readers: the cells stay in the table, their words are visually hidden (no font-size 0) */
.dpgrid thead th{padding:0;height:0;border:0}
.dpgrid td{width:var(--cw);height:var(--ch);padding:0;text-align:center;vertical-align:middle;border-radius:8px;font-size:15px;font-weight:500;color:var(--ink);cursor:pointer;position:relative;transition:background .2s var(--ease)}
/* each day and month is a native button inside its grid cell (VoiceOver reads it as a button) */
.dpgrid td>button,.dpmonths td>button{display:block;width:100%;height:100%;border-radius:8px;font:inherit;color:inherit;text-decoration:inherit;outline-offset:-3px;cursor:inherit;background:none;border:0;padding:0}

.dev-ipad .dpgrid td.dp-o,.dp.dpsheet .dpgrid td.dp-o{font-size:15px}
.dpgrid td.dp-today{font-weight:700}
.dpgrid td.dp-today::after{content:"";position:absolute;left:50%;bottom:5px;width:18px;height:3px;margin-left:-9px;border-radius:2px;background:var(--sage-text)}
/* picked: the kit Chip's selected look exactly (chip-on fill, 1 px selected-border edge, bold); it lands at once

/* today that is also picked: the bar goes full ink, so "which day is today" still reads inside the green */
.dpgrid td.dp-pk.dp-today::after{background:var(--sage-dark);width:22px;margin-left:-11px}
/* off: readable (about 3:1) and crossed out, so it never leans on colour alone */
.dpgrid td.dp-off{color:var(--dp-off);font-weight:400;text-decoration:line-through;text-decoration-thickness:1px;text-decoration-color:var(--dp-strike);cursor:default}
@media (hover:hover){.dpgrid td:not(.dp-off):not(.dp-pk):hover{box-shadow:var(--hover)}.dpgrid td.dp-pk:hover{box-shadow:inset 0 0 0 1px var(--sage-text),var(--hover)}}
.dpgrid td:not(.dp-off):active{box-shadow:var(--press)}
/* keyboard focus: a dark ring, shown only when the keyboard is in use (never on a touch or mouse open) */
.dpgrid td>button:focus,.dpmonths td>button:focus{outline:none}
.dp.dp-kbd .dpgrid td>button:focus,.dpgrid td.dp-kf>button,.dp.dp-kbd .dpmonths td>button:focus,.dpmonths td.dp-kf>button{outline:2px solid var(--ink);outline-offset:-3px}
/* month view: the next 12 months (a history field: the last 12), each saying how far it is */
.dpmonths{border-collapse:separate;border-spacing:6px;margin:-6px;width:calc(100% + 12px);height:calc(100% + 12px);table-layout:fixed}
/* (round 23, picker panel 11 visual 6) 10 px under the range button, as the weekday row gives the days, from the tiles' height */
.dpbody.dp-months .dpmonths{margin-top:0;height:calc(100% + 6px)}
/* (round 21, picker panel 9 visual 2) a month you can pick is the strongest tile: the warm chip fill and its edge; a
   crossed-out month keeps only a faint outline */
.dpmonths td{border-radius:8px;text-align:center;vertical-align:middle;cursor:pointer;background:var(--chip-warm);box-shadow:inset 0 0 0 1px var(--chip-warm-edge);padding:0;position:relative}
.dpmonths td b{display:block;font-size:16px;font-weight:600;white-space:nowrap}

.dp:not(.dpsheet) .dpmonths td small{font-size:12px}.dev-ipad .dp .dpmonths td small{font-size:12px}
.dpmonths td.dp-now::after{content:"";position:absolute;left:50%;bottom:6px;width:18px;height:3px;margin-left:-9px;border-radius:2px;background:var(--sage-text)}
.dpmonths td.dp-pk{background:var(--chip-on);box-shadow:inset 0 0 0 1px var(--sage-text);transition:none}
/* this month and picked: the same full-ink, wider bar as a day */

/* (round 20, picker panel 8 visual 5) a crossed-out month keeps its tile's outline, so its line never runs into the next */
.dpmonths td.dp-off{cursor:default;background:transparent;box-shadow:inset 0 0 0 1px rgba(84,82,74,.16)}
.dpmonths td.dp-off b,.dpmonths td.dp-off small{color:var(--dp-off);font-weight:400}.dpmonths td.dp-off b{text-decoration:line-through;text-decoration-color:var(--dp-strike)}
@media (hover:hover){.dpmonths td:not(.dp-off):hover{box-shadow:var(--hover)}.dpmonths td.dp-pk:hover{box-shadow:inset 0 0 0 1px var(--sage-text),var(--hover)}}
/* the foot: the Today key, the line saying which days are off and why, and This Month (shown when you are away);
   in the month view: the line and Back to Days */
/* (round 20, picker panel 8 visual 5) the foot's button has the same room under it as beside it (about 12 px with the card's padding) */
.dpf{display:flex;align-items:center;gap:10px;margin-top:6px;padding:6px 0 6px;border-top:1px solid var(--brow);min-height:54px}
.dpnote{flex:1;min-width:0;font-size:13px;color:var(--ink2);line-height:1.35}
.dev-ipad .dpnote{font-size:14px}
/* (round 20, picker panel 8 ease 3) the Today key is a legend, not a button: the mark first, then the word, regular
   weight, and only while today is in the grid */
.dpkey{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:400;color:var(--ink2);line-height:1;flex:none;padding:0}
.dpkey i{width:18px;height:3px;border-radius:2px;background:var(--sage-text)}
.dpf.dp-nokey .dpkey{display:none}
.dpbody.dp-months~.dpf .dpkey{display:none}
/* (round 19) the Today key steps aside while the foot names the ringed day, so it never reads as that day's label */
.dpf.dp-kbf .dpkey{display:none}
.dptoday{height:44px;border-radius:8px;padding:0 12px;font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;flex:none;background:var(--chip-warm);border:1px solid var(--chip-warm-edge)}
/* a hidden This Month gives its room to the line (no held-empty slot, so the line never wraps early) */
.dptoday.dp-hide{display:none}
/* the close x on the popover, after a thin divider (the sheet has its own in its title row); kept in the month view */
.dph .dpx{margin-left:2px;position:relative}
.dph .dpx::before{content:"";position:absolute;left:-3px;top:12px;bottom:12px;width:1px;background:var(--brow)}
/* computer and iPad: a light warm dim over the page area behind the popover (the app's shadow brown at 12%; the
   wood header, tan page bar and rail stay as they are), with a hole where the date's panel is, so that panel (its
   chips, box, read-out and Save) stays bright and live under the popover */
.dpscrim{position:fixed;inset:0;background:var(--scrim);z-index:79}
.dpscrim[hidden]{display:none}
.dpscrim.dp-lite{background:var(--dp-dim);z-index:78}
.dpnow{font-weight:500;color:var(--ink2);font-size:15px;margin-left:8px}
/* phone: a bottom sheet with the kit Sheet's grab bar (drag down to close), a title saying what you are choosing and
   the date with how far it is, and a close x; the foot sits at the bottom, as on the popover */
.dp.dpsheet{left:0;right:0;bottom:0;top:auto!important;width:auto;border:0;border-radius:16px 16px 0 0;--pad:16px;padding:0 var(--pad) calc(4px + env(safe-area-inset-bottom));--cw:calc((100vw - 44px)/7);--ch:48px;transform-origin:bottom center}
.dp.dpsheet .dpgrid td{font-size:17px}
.dpgrab{height:20px;display:grid;place-items:center;touch-action:none;cursor:grab}

.dptop{display:flex;align-items:center;gap:8px;padding:0 0 6px;margin-bottom:6px;border-bottom:1px solid var(--brow);touch-action:none;min-height:52px}
.dptop h2{margin:0;font-size:18px;font-weight:600;line-height:1.3}
.dptop .dpnow{display:block;margin:2px 0 0;font-size:14px}
/* the sheet's x lines up with the header's > arrow under it */
.dptop .dp-x{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;color:var(--ink2);margin:0 -2px 0 auto;flex:none}
.dplive,.dp .dp-vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.dpnote.dp-kb{color:var(--ink);font-weight:600;font-size:14px}
@media (max-width:640px){.dgrp{max-width:none}}
/* reduced motion: the kit's rule, states change at once (no flash) */
@media (prefers-reduced-motion:reduce){.dgrp.dp-flash .dfield,.dgrp.dp-dirty.dp-flash .dfield{animation:none!important}}
/* a panel button the open calendar covers (even in part) hides until it closes; (round 23, Kitchen panel 19 friction 4)
   its words fade out over the calendar's open (never a one-frame blink), then take no taps */
.dpunder{opacity:0;visibility:hidden;transition:opacity 160ms cubic-bezier(.25,.46,.45,.94),visibility 0s linear 160ms}
@media (prefers-reduced-motion:reduce){.dpunder{transition:none}}
/* (round 23) a separator where the words wrap (DP.tidy) */
.dp-vsoff{visibility:hidden}
/* a date field in a fixed bottom bar (Kitchen's phone hand form): while the phone sheet is open the bar rides up so
   the field and its read-out sit just above the sheet, and only that strip of the bar shows (dp.js, [data-dplift]) */
.dplifted{position:relative;will-change:transform,clip-path}
/* (round 17) the strip is a deliberate bar: a hairline along its top (--dpcut: where the strip starts, 12 px over the
   field) under the rounded top corners of the clip. The page shows a label beside the field and fades the rows above
   it out (its own .dplifted rules), so nothing of them is cut in a sliver */
.dplifted::after{content:"";position:absolute;left:0;right:0;top:var(--dpcut,0);height:1px;background:var(--bcard);pointer-events:none}
/* (round 19) a strip pulled flush to the page's bars is one band with them: square corners, no hairline of its own */
.dplifted.dp-flush::after{display:none}
/* the sheet title's thing ("| Ground turkey"): quieter than the label, cut with … when long */
.dptop h2{display:flex;min-width:0;white-space:nowrap}.dpwhat{font-weight:500;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;min-width:0}
.dptop>div{min-width:0;flex:1}
/* (round 20) the popover's title line, the sheet title's small twin: "Use by | Spinach", one line, cut with … when long */
.dptl{display:flex;min-width:0;white-space:nowrap;font-size:14px;line-height:20px;color:var(--ink);padding:2px 0 6px}
.dptl b{font-weight:600;flex:none}
.dev-ipad .dptl{font-size:15px}
/* (round 21, picker panel 9 job 3) opening upward over its own panel, the line keeps the saved date the panel's
   "It's on ... now" line said (the calendar covers it); else hidden */
.dptl .dpwas{display:none;flex:none;font-weight:500;color:var(--ink2)}
.dp.dp-up .dptl .dpwas{display:inline}
/* (round 21, picker panel 9 friction 2) a finger on the popover's dim is the page's to drag (dp.js scrolls what is under) */
.dpscrim.dp-lite{touch-action:none}
/* (round 20, picker panel 8 friction 1) the phone sheet's days take a sideways swipe themselves (the browser keeps only
   the up-down pan), so a month swipe is never taken over and cancelled */
.dp.dpsheet .dpbody{touch-action:pan-y}
/* (round 20, Kitchen panel 16 visual 3) a side pane's left bar steps aside while the calendar stands beside it (its
   gutter stays, so the card never moves) */
.dp-sidecal::-webkit-scrollbar-thumb,.dp-sidecal::-webkit-scrollbar-thumb:hover{background-color:transparent}
/* (round 17) the compact field (Kitchen's keyboard-up row) gives its box 8 px sides, so "May 25, 2027" fits beside two chips */
.dgrp.dp-sm .dfield,.dgrp.dp-sm .dfield:focus-within{padding:0 8px}
/* (round 20, picker panel 8 fit 3) the field's other sizes are options of this part, never a page's own rules:
   dp-h44 is a 44-tall field that keeps the word Calendar (a phone form whose other boxes are 44, like Name) */
.dgrp.dp-h44{height:44px}
/* (round 20, picker panel 8 visual 2 / job 1 / fit 1 / ease 1, Kitchen panel 15-16 friction: the Pantry year) the
   compact ROW (dp-inline on the page's wrapper): its quick chips, then the field, on one line, the read-out under them.
   The field never cuts its date: its least width fits what is in it (--dpn, the date's or the placeholder's length, set
   by dp.js), and with no room left beside the chips it takes its own line */
.dp-inline{display:flex;flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px 8px;min-width:0}
.dp-inline>.chips{flex:none;flex-wrap:nowrap}
.dp-inline>.chips .chip{padding:0 8px;font-size:13px}

.dp-inline>.dread{flex-basis:100%;margin-top:0}
/* reduced motion, said here for the whole part (not left to a page's global rule): every state change is at once;
   the open and close are the 120 ms fade in dp.js */
@media (prefers-reduced-motion:reduce){.dp,.dp *,.dp *::before,.dp *::after,.dgrp,.dgrp *,.dgrp *::before,.dgrp *::after,.dread{transition-duration:0s!important;animation:none!important}}
/* (round 22, Tyler 11-27 15:22, STANDARDS "Separators are vertical lines") parts on one line ("Use by | Spinach",
   "Friday, Nov 27 (in 2 days) | not saved yet") are parted by a thin vertical line, never "·" and never a bare space:
   1 px, 0.9 em tall, the text's own colour at 40%, 0.5 em each side; a screen reader hears a comma */
.dp-vs{display:inline-block;width:1px;height:.9em;background:currentColor;opacity:.4;margin:0 .5em;vertical-align:-.08em;flex:none;position:relative}
.dp-vs>.dp-vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

const addM=(d,n)=>{const t=new Date(d.getFullYear(),d.getMonth()+n,1);t.setDate(Math.min(d.getDate(),dim(t.getFullYear(),t.getMonth())));return t};

/* ---------- the tan bar: page name only, then the count; New Reminder and the page's ⋯ ---------- */
function barHTML(){const n=nowCount(),off=ROLE()==='offline';
  const meta=S.st==='away'?'Paused until Sun, Nov 29':KIO()?'':S.st==='loading'?'':n?`${n} need${n===1?'s':''} you now`:'';
  const nw=PHONE()?`${ic('plus')}New`:`${ic('plus')}New Reminder`;
  const back=KIO()?`<button class="bk" data-a="mk" data-m="Back to the kitchen iPad's Today (C-083)." aria-label="Back to Today">${ic('left')}<span class="w">Today</span></button><span class="sep bksep" aria-hidden="true"></span>`:'';
  return `<div class="bar" data-dptop><div class="in">${back}<span class="ttl">Reminders</span>${meta?`<span class="meta">${meta}</span>`:''}<span class="sp"></span>
   ${S.st==='away'?'':`<button class="btn tan ${off?'off':''}" data-a="${off?'offmsg':'new'}" ${off?'aria-disabled="true"':''}>${nw}</button>`}
   ${KIO()?'':`<button class="btn icon" data-a="pagemenu" aria-label="More for Reminders" aria-haspopup="menu" aria-expanded="false">${ic('dots')}</button>`}</div></div>`}

/* ---------- a row ---------- */
function subHTML(r){return r.s.map((x,i)=>{const pl=(x==='Fridge'?ic('fridge'):x==='Freezer'?ic('frz'):'');return (i?sep:'')+`<span class="seg">${pl}${esc(x)}</span>`}).join('')}
function rowHTML(r){
  if(r.snz)return `<div class="rm snz" data-id="${r.id}"><span class="ri2">${ic('clock')}</span><span class="tx"><b>${r.t.replace(/<[^>]+>/g,'')}</b><small><span class="seg">Set aside</span>${sep}<span class="seg">${esc(r.snz)}</span></small></span>
   <button class="kb" data-a="rmenu" data-id="${r.id}" aria-label="More for this set-aside reminder" aria-haspopup="menu" aria-expanded="false">${ic('dots')}</button></div>`;
  if(S.hand===r.id)return `<div class="rm hand" data-id="${r.id}" role="status"><span class="ri2">${ic('check')}</span><span class="tx"><b>Sarah moved the chicken to the fridge</b><small>Just now${sep}It will be thawed for Thu Dinner</small></span></div>`;
  const role=ROLE(),lim=LIM(r),off=role==='offline'||lim,koff=off;
  return `<div class="rm" data-id="${r.id}"><span class="ri2">${ic(r.ic)}</span>
   <span class="tx"><b>${r.t}</b><small>${subHTML(r)}</small></span>
   <button class="kb ${koff?'off':''}" data-a="${koff?'offmsg':'rmenu'}" data-id="${r.id}" aria-label="More for this reminder" aria-haspopup="menu" aria-expanded="false" ${koff?'aria-disabled="true" style="opacity:.45"':''}>${ic('dots')}</button>
   <span class="acts"><button class="btn ${r.g==='now'?'tan':'cancel'} sm go ${off?'off':''}" data-a="${off?'offmsg':'go'}" data-id="${r.id}" ${off?'aria-disabled="true"':''}>${esc(r.go)}</button></span></div>`}
const GROUPS=[['now','Now'],['later','Later Today'],['up','Coming Up']];
const FOOD=r=>['food','left'].includes(r.k)&&live(r);
const fname=r=>r.t.replace(/<[^>]+>/g,'').split(':')[0];
/* round 4 (fix 4): Now with more than 6 folds its 3+ foods to use soon into one row; See opens them in place */
function foldHTML(fs){const k=PHONE()?1:3,nm=fs.slice(0,k).map(fname).join(', ')+(fs.length>k?`, ${fs.length-k} more`:'');
  return `<div class="rm fold" data-id="fold"><span class="ri2">${ic('p-kitchen')}</span><span class="tx"><b>${fs.length} foods to use soon</b><small>${esc(nm)}</small></span>
   <span class="kb" aria-hidden="true" style="visibility:hidden"></span><span class="acts"><button class="btn tan sm go" data-a="fold" aria-expanded="false">See</button></span></div>`}
function listHTML(items){const cap=(S.st==='many'||S.st==='manyopen')&&!S.moreOpen?6:99;
  const due=r=>r.due==null?500:r.due;
  return GROUPS.map(([g,l])=>{const all0=items.filter(r=>r.g===g);if(!all0.length)return '';
    /* round 6 (fix 1): soonest due first inside each group; set-aside lines stay at the foot */
    const srt=a=>[...a].sort((x,y)=>due(x)-due(y));
    const lim=all0.filter(LIM),all=all0.filter(r=>!LIM(r));
    /* round 7 (review 3 fix 2): set-aside lines sort by their come-back time, the same as every other row */
    const rs=srt(all),n=all.filter(live).length;
    const limHTML=lim.length?`<button class="morebtn limf" data-a="limf" data-g="${g}" aria-expanded="${!!S.limOpen[g]}">${ic('down','i sm'+(S.limOpen[g]?' flip':''))}A full member handles ${lim.length===1?'this':'these'} (${lim.length})</button>${S.limOpen[g]?srt(lim).map(rowHTML).join(''):''}`:'';
    const fs=rs.filter(FOOD),fold=g==='now'&&n>6&&fs.length>=3;
    let shown=g==='up'?rs.slice(0,cap):rs,hid=rs.length-shown.length,body;
    if(fold&&!S.foldOpen){const at=shown.indexOf(fs[0]);body=shown.filter(r=>!fs.includes(r)).map(rowHTML);body.splice(Math.min(at,body.length),0,foldHTML(fs));body=body.join('')}
    else body=shown.map(rowHTML).join('')+(fold?`<button class="morebtn lessbtn" data-a="fold" aria-expanded="true">${ic('down','i sm flip')}Fold the ${fs.length} Foods Back</button>`:'');
    const hint=g==='later'?`<span class="hint">From 8:30 PM</span>`:g==='up'?`<span class="hint">Tomorrow and after</span>`:'';
    return `<section class="grp" aria-label="${l}"><div class="gh">${l}${ROLE()==='limited'?'':`<span class="n">${n}</span>`}${hint}</div>${body}
     ${hid?`<button class="morebtn" data-a="morerows">${ic('down','i sm')}Show ${hid} More in Coming Up</button>`:''}${limHTML}</section>`}).join('')}
function doneHTML(){const d=S.done;if(!d.length)return '';const off=ROLE()!=='full';
  return `<button class="hidl" data-a="dw" aria-expanded="${S.dwOpen}">${ic('right','i chev')}Done This Week <small>${d.length}</small></button>
   ${S.dwOpen?`<div class="dwk">${d.map(x=>`<div class="rm"><span class="ri2">${ic(x.ic)}</span><span class="tx"><b>${esc(x.t)}</b><small>${[x.by&&x.by!==ME()?{TS:'Tyler',JS:'Jamie'}[x.by]:x.s[0],...x.s.slice(1)].map(y=>`<span class="seg">${esc(y)}</span>`).join(sep)}</small></span>
     ${x.back?`<span class="acts"><button class="btn cancel sm ${off?'off':''}" data-a="${off?'offmsg':'back'}" data-id="${x.id}">Bring Back</button></span>`:''}</div>`).join('')}</div>`:''}`}
/* round 2 (my r1 weakest: "5 need you now" said twice): the tan bar says how many need you now; the list head says how
   many in all and how fresh it is, on one line (offline: the banner already says when, so the head says it once, short) */
function lheadHTML(){const v=visible().filter(r=>live(r)&&!LIM(r));
  const up=S.st==='offline'?`<span class="updw">${sep}From 7:40 PM</span>`:`<span class="updw">${sep}Up to date at 7:55 PM</span>`;
  return `<div class="lhead"><span class="sum"><b>${v.length} reminders</b>${up}</span></div>`}
function bannerHTML(){
  if(S.st==='offline')return `<div class="banner off" role="status">${ic('cloud')}<span class="tx"><b>Not connected</b><span class="sub">Showing what we knew at 7:40 PM. The buttons come back when you are online.</span></span></div>`;
  if(S.st==='limited')return `<div class="banner ro" role="status">${ic('lock')}<span class="tx"><b>You have Limited access</b><span class="sub">You can rate meals and make your own reminders. The rest are folded under each group.</span></span></div>`;
  if(KIO())return `<div class="banner gst" role="status">${ic('users')}<span class="tx"><b>Reminders for everyone at home</b><span class="sub">Not Now here waits for the whole household. Just Me reminders stay on your own phone.</span></span></div>`;
  return ''}
function pageBody(){
  if(S.st==='loading')return `<div class="wrap one"><section class="lst"><div class="card rcard" aria-busy="true" aria-label="Checking reminders">
    <div class="lhead"><span class="sum" style="display:flex;flex-direction:column;gap:8px"><span class="skel" style="width:180px;height:14px"></span><span class="skel" style="width:120px;height:10px"></span></span></div>
    ${['Now','Later Today','Coming Up'].map((l,gi)=>`<section class="grp"><div class="gh">${l}</div>${[0,1,2].slice(0,gi===1?1:gi===0?3:2).map(i=>`<div class="skrow"><span class="skel" style="width:22px;height:22px;border-radius:6px"></span><span class="m"><span class="skel" style="width:${[62,48,70][i]}%;height:13px"></span><span class="skel" style="width:${[34,40,28][i]}%;height:10px"></span></span><span class="skel bt"></span></div>`).join('')}</section>`).join('')}
    <div class="lfoot">Checking reminders</div></div></section></div>`;
  if(S.st==='away')return `<div class="wrap one"><section class="lst"><div class="card empty kemp">${bigArt('remind')}<h2>Reminders are paused</h2>
    <p>You are away until Sun, Nov 29. Until then reminders do not show here or buzz your phone. Only food to use soon stays on Today.</p>
    <div class="acts"><button class="btn tan" data-a="mk" data-m="Opens Plan on the Away dates.">${ic('cal')}Change Away Dates</button></div></div></section></div>`;
  const v=S.st==='empty'?[]:visible();
  if(!v.length)return `<div class="wrap one"><section class="lst">${bannerHTML()}<div class="card empty kemp">${bigArt('remind')}<h2>Nothing needs you</h2>
    <p>Food to use soon, a thaw or prep coming up, a week with no plan: when something needs someone at home, it shows here.</p>
    <div class="acts"><button class="btn tan" data-a="new">${ic('plus')}New Reminder</button></div></div>
    <div class="card rcard" style="margin-top:16px">${doneHTML()}</div></section></div>`;
  return `<div class="wrap one lk${S.look} ${KIO()?'kio':''}"><section class="lst">${bannerHTML()}<div class="card rcard">${lheadHTML()}${listHTML(v)}${doneHTML()}
    ${KIO()?'':`<div class="lfoot inf">${ic('info')}<span>Only a few of these ever buzz your phone. Choose which in <button class="lnk" data-a="settings">Reminder Settings</button>.</span></div>`}</div></section></div>`}

/* ---------- stand-ins (only to show this page's pieces in their places) ---------- */
function todayBody(){const v=visible().filter(live),sh=v.slice(0,4);

   <section class="card"><div class="ch"><span class="eyebrow">This Week</span></div><div class="stub"></div></section></div>

   <div class="rows2">${sh.map(r=>`<button class="rr"><span class="ri2">${ic(r.ic)}</span><span class="tx"><b>${r.t}</b><small>${subHTML(r)}</small></span>${ic('right','i chev')}</button>`).join('')}
   <button class="rr all" data-a="seeall"><span class="ri2">${ic('list')}</span><span class="tx"><b>See All ${v.length} Reminders</b></span>${ic('right','i chev')}</button></div></section>
   <section class="card"><div class="ch"><span class="eyebrow">Kitchen</span></div><div class="stub"></div></section></div></div>`}
function kitchenBody(){const rows=[['Spinach','Fridge','1 bag','Use by tomorrow','s1','k1'],['Chicken thighs','Freezer','2 lb','Mar 3','','k2'],['Whole milk','Fridge','Half a gallon','Use by Fri','','k3'],['Cheddar','Fridge','Half a block','Use by Sat','','k4']];
  return `<div class="wrap one"><section class="lst"><div class="card"><div class="lhead"><span class="sum"><b>48 things at home</b>${sep}3 to use soon<small>Stand-in for Kitchen v3 (C-088): only the row's ⋯ is real here</small></span></div>
   ${rows.map(([n,p,a,u,c,id])=>`<div class="krow"><span class="m"><b>${n}</b><small>${ic(p==='Freezer'?'frz':'fridge')}${p}${sep}${a}</small></span><span class="st ${c}">${u}</span><button class="kb" data-a="kmenu" data-id="${id}" aria-label="More for ${n}" aria-haspopup="menu" aria-expanded="false">${ic('dots')}</button></div>`).join('')}</div></section></div>`}

/* ---------- render ---------- */
function render(){
  CUR=['today'].includes(S.st)?'Today':['itemmenu','fromitem'].includes(S.st)?'Kitchen':'Reminders';
  document.documentElement.classList.toggle('kio',KIO());
  let bar,body;
  if(CUR==='Today'){bar=`<div class="bar" data-dptop><div class="in"><span class="ttl">Wednesday, Nov 25</span></div></div>`;body=todayBody()}
  else if(CUR==='Kitchen'){bar=`<div class="bar" data-dptop><div class="in"><span class="ttl">Kitchen</span><span class="meta">3 to use soon</span></div></div>`;body=kitchenBody()}
  else{bar=barHTML();body=pageBody()}
  $('#app').innerHTML=frame(bar,body);
  $('#drawerm').innerHTML=drawerHTML();$('#drawerm').classList.toggle('open',S.drawer);
  mockBar();fitMeta()}
/* round 7 (review 3 fix 1): a phone row's small words never split a piece or end on a separator. Pieces drop from the
   end (the first always stays) until the line fits beside the button; re-run after fonts load and on resize */
function fitMeta(){document.querySelectorAll('.rm .tx small,.rr .tx small').forEach(sm=>{
  const segs=[...sm.children].filter(e=>e.classList.contains('seg'));sm.querySelectorAll('.drop').forEach(e=>e.classList.remove('drop'));sm.classList.remove('wrap1');
  if(!PHONE()||segs.length<2&&sm.scrollWidth<=sm.clientWidth+1)return;
  for(let i=segs.length-1;i>0&&sm.scrollWidth>sm.clientWidth+1;i--){segs[i].classList.add('drop');const pv=segs[i].previousElementSibling;if(pv&&pv.classList.contains('sep'))pv.classList.add('drop')}
  if(sm.scrollWidth>sm.clientWidth+1)sm.classList.add('wrap1')})}
if(document.fonts)document.fonts.ready.then(fitMeta);

/* ---------- menus ---------- */
let MENU=null;
function openMenu(btn,html,id){closeMenu();const m=$('#menu');$('#menuin').innerHTML=html;m.classList.add('open');m.classList.remove('up');m.classList.toggle('kxm',KIO());
  btn.setAttribute('aria-expanded','true');MENU={btn,id};placeMenu()}
function placeMenu(){if(!MENU)return;const m=$('#menu'),r=MENU.btn.getBoundingClientRect(),w=m.offsetWidth,h=m.offsetHeight;
  let left=Math.min(Math.max(8,r.right-w),innerWidth-8-w),top=r.bottom+8,up=false;
  const foot=PHONE()?innerHeight-64:innerHeight-8;if(top+h>foot&&r.top-8-h>56){top=r.top-8-h;up=true}
  m.classList.toggle('up',up);m.style.left=left+'px';m.style.top=top+'px';m.style.setProperty('--cx',(r.left+r.width/2-left-6)+'px')}
function closeMenu(){$('#menu').classList.remove('open');if(MENU&&MENU.btn)MENU.btn.setAttribute('aria-expanded','false');MENU=null}
const byId=id=>S.items.find(r=>r.id===id);
function rowMenu(r){const lim=LIM(r);
  if(r.snz)return `<button data-a="unsnz" data-id="${r.id}">${ic('refresh')}<span class="ml">Bring Back Now</span></button>
   <button data-a="dismiss" data-id="${r.id}">${ic('x')}<span class="ml">Dismiss</span></button>`;
  return `${r.to?`<button data-a="mk" data-m="${esc(r.mk||'Opens it on its own page.')}">${RAIL(r.to[0])}<span class="ml">${r.to[1]}</span></button><hr>`:`<button data-a="chday" data-id="${r.id}">${ic('cal')}<span class="ml">Change the Day</span></button><hr>`}
   <button data-a="notnow" data-id="${r.id}">${ic('clock')}<span class="ml">Not Now</span><span style="margin-left:auto">${ic('right','i sm')}</span></button>
   <button class="${lim?'off':''}" data-a="${lim?'offmsg':'dismiss'}" data-id="${r.id}" ${lim?'aria-disabled="true"':''}>${ic('x')}<span class="ml">Dismiss</span></button>
   ${KIO()?`<div class="mfoot">${ic('users')}Not Now and Dismiss here count for everyone at home</div>`:''}`}
function notNowMenu(r){const lim=LIM(r);
  return `<div class="mhd"><button data-a="nnback" data-id="${r.id}" aria-label="Back">${ic('left','i sm')}Not Now</button></div><hr>
   <button data-a="nn" data-id="${r.id}" data-w="Back tonight at 9 PM">${ic('clock')}<span class="ml"><b>Tonight</b><small>Back at 9 PM</small></span></button>
   <button data-a="nn" data-id="${r.id}" data-w="Back tomorrow at 8 AM">${ic('clock')}<span class="ml"><b>Tomorrow</b><small>Back Thu at 8 AM</small></span></button>
   <button data-a="nn" data-id="${r.id}" data-w="Back Mon, Nov 30">${ic('cal')}<span class="ml"><b>Next Week</b><small>Back Mon, Nov 30</small></span></button>
   ${KIO()?`<div class="mfoot">${ic('users')}It waits for everyone at home</div>`:r.hh?`<div class="mfoot">${ic('user')}Just for you</div>`:''}`}
function pageMenu(){return `<button data-a="settings">${ic('p-remind','i railp')}<span class="ml">Reminder Settings<small>What shows here and what buzzes your phone</small></span></button>
   <button data-a="mk" data-m="Opens How This Page Works (the standard help pane, C-094).">${ic('info')}<span class="ml">How This Page Works</span></button>`}
function kitMenu(){return `<button data-a="mk" data-m="Kitchen v3's amount editor (stand-in).">${ic('minus')}<span class="ml">Used Some</span></button>
   <button data-a="mk" data-m="Kitchen v3's Change Date (stand-in).">${ic('cal')}<span class="ml">Change the Date</span></button>
   <button data-a="mk" data-m="Kitchen v3's Move (stand-in).">${ic('next')}<span class="ml">Move</span></button><hr>
   <button data-a="fromk">${ic('p-remind','i railp')}<span class="ml">Remind Me About It</span></button>`}

/* ---------- toasts and notes ---------- */
function toast(msg,undo){const t=document.createElement('div');t.className='toast';t.innerHTML=`<span>${msg}</span>${undo?'<button>Undo</button>':''}`;
  if(undo)t.querySelector('button').onclick=()=>{undo();drop(t)};$('#toasts').appendChild(t);setTimeout(()=>drop(t),undo?8000:4000)}
function drop(t){if(!t.isConnected)return;const a=t.animate([{opacity:1},{opacity:0}],{duration:200});a.onfinish=()=>t.remove()}
function mk(m){const n=$('#mknote');n.textContent='Mockup: '+m;n.classList.add('on');clearTimeout(mk.t);mk.t=setTimeout(()=>n.classList.remove('on'),4200)}

/* ---------- actions ---------- */
function leave(id,doneRow,msg){const el=document.querySelector(`.rm[data-id="${id}"]`);const r=byId(id),ix=S.items.indexOf(r);
  const fin=()=>{S.items.splice(S.items.indexOf(r),1);if(doneRow)S.done.unshift(doneRow);rerender();
    toast(msg,()=>{S.items.splice(ix,0,r);if(doneRow)S.done.splice(S.done.indexOf(doneRow),1);rerender()})};
  if(el&&!matchMedia('(prefers-reduced-motion:reduce)').matches){el.classList.add('out');setTimeout(fin,240)}else fin()}
function rerender(){const sc=$('#scroll'),y=sc?sc.scrollTop:0;render();const s2=$('#scroll');if(s2)s2.scrollTop=y}
const A={
  nav(b){const to=b.dataset.to;S.drawer=false;if(to==='Reminders'){S.st='normal';reset();render()}else if(to==='Today'){S.st='today';render()}else mk('Goes to '+to+'.')},
  drawer(){S.drawer=!S.drawer;render()},
  other(){mk('Another part of the app.')},
  mk(b){closeMenu();mk(b.dataset.m)},
  offmsg(){toast(ROLE()==='offline'?'Not connected. This comes back when you are online.':'A full member handles this one.')},
  rmenu(b){const r=byId(b.dataset.id);openMenu(b,rowMenu(r),r.id)},
  notnow(b){const r=byId(b.dataset.id);$('#menuin').innerHTML=notNowMenu(r);placeMenu();$('#menuin button').focus()},
  nnback(b){const r=byId(b.dataset.id);$('#menuin').innerHTML=rowMenu(r);placeMenu()},
  /* round 4 (fix 2): Not Now is not done. The row waits, quiet and uncounted, at the foot of the group it comes back to */
  nn(b){const r=byId(b.dataset.id),w=b.dataset.w;closeMenu();const el=document.querySelector(`.rm[data-id="${r.id}"]`);
    const fin=()=>{const g0=r.g,d0=r.due;r.g0=g0;r.due0=d0;r.snz=w;r.g=/tonight/.test(w)?'later':'up';r.due=/tonight/.test(w)?1:/tomorrow/.test(w)?12:108;rerender();
      toast(`Set aside. ${w.replace('Back','It comes back')}.`,()=>{delete r.snz;r.g=g0;r.due=d0;rerender()})};
    if(el&&!matchMedia('(prefers-reduced-motion:reduce)').matches){el.classList.add('out');setTimeout(fin,240)}else fin()},
  unsnz(b){const r=byId(b.dataset.id);closeMenu();delete r.snz;r.g=r.g0||'now';if(r.due0!=null)r.due=r.due0;rerender();
    const el=document.querySelector(`.rm[data-id="${r.id}"]`);if(el){el.classList.add('new');el.scrollIntoView({block:'nearest'})}
    toast(`Brought back. It is in ${{now:'Now',later:'Later Today',up:'Coming Up'}[r.g]}.`)},
  fold(){S.foldOpen=!S.foldOpen;rerender()},
  limf(b){const g=b.dataset.g;S.limOpen[g]=!S.limOpen[g];rerender()},
  dismiss(b){const r=byId(b.dataset.id);closeMenu();leave(r.id,{id:'x'+r.id,ic:'x',t:'Dismissed: '+r.t.replace(/<[^>]+>/g,''),s:['You','Just now'],back:1,from:r},'Dismissed. It is in Done This Week.')},
  go(b){const r=byId(b.dataset.id);if(r.mk){mk(r.mk);return}leave(r.id,{id:'g'+r.id,ic:'check',t:r.done.replace(/\..*$/,''),s:['You','Just now'],back:1,from:r},r.done)},
  back(b){const d=S.done.find(x=>x.id===b.dataset.id);S.done.splice(S.done.indexOf(d),1);
    const r=d.from||{id:'b'+d.id,k:'own',g:'now',ic:'p-remind',t:d.t.replace(/^(Not now|Dismissed): /,''),s:['Brought back'],go:'Done',done:'Done.'};
    delete r.snz;r.g='now';S.items.unshift(r);rerender();const el=document.querySelector(`.rm[data-id="${r.id}"]`);if(el){el.classList.add('new');el.scrollIntoView({block:'nearest'})}toast('Brought back. It is in Now.')},
  dw(){S.dwOpen=!S.dwOpen;rerender();if(S.dwOpen){const d=$('.dwk');if(d)d.scrollIntoView({block:'nearest',behavior:'smooth'})}},
  morerows(){S.moreOpen=true;rerender()},
  pagemenu(b){openMenu(b,pageMenu())},
  settings(){closeMenu();settingsSheet()},
  kmenu(b){openMenu(b,kitMenu(),b.dataset.id)},
  fromk(){closeMenu();newSheet({words:'Use the spinach',day:1,time:'8',from:'spinach'})},
  new(){newSheet({})},
  chday(b){closeMenu();changeDaySheet(byId(b.dataset.id))},
  seeall(){seeAllSheet()},
  close(){closeSheet()},
  rsave(){saveNew()},
  chsave(){saveDay()},
  tm(b){NEW.time=b.dataset.v;document.querySelectorAll('[data-a="tm"]').forEach(x=>{x.classList.toggle('on',x===b);x.setAttribute('aria-pressed',x===b)})},
  wh(b){NEW.who=b.dataset.v;document.querySelectorAll('[data-a="wh"]').forEach(x=>{x.classList.toggle('on',x===b);x.setAttribute('aria-pressed',x===b)});$('#bznote').textContent=bzNote()},
  sw(b){b.classList.toggle('on');b.setAttribute('aria-checked',b.classList.contains('on'))},
  look(b){S.look=b.dataset.v;$('#mockmore').classList.remove('open');render()},
  state(b){go(b.dataset.v)}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');
  if(!b){if(!e.target.closest('#menu'))closeMenu();if(!e.target.closest('#mockmore,#mock'))$('#mockmore').classList.remove('open');return}
  if(!b.closest('#menu')&&b.dataset.a!=='rmenu'&&b.dataset.a!=='pagemenu'&&b.dataset.a!=='kmenu')closeMenu();
  const f=A[b.dataset.a];if(f){if(['rmenu','pagemenu','kmenu'].includes(b.dataset.a)&&MENU&&MENU.btn===b){closeMenu();return}f(b,e)}});
$('#scrim').addEventListener('click',e=>{if(e.target.id==='scrim'&&!DP.state.open)closeSheet()});
addEventListener('keydown',e=>{if(e.key==='Escape'){if(MENU)closeMenu();else if($('#scrim').classList.contains('open')&&!DP.state.open)closeSheet()}});
addEventListener('resize',()=>{if(MENU)placeMenu()});

/* ---------- sheets ---------- */
function openSheet(html,cls=''){const s=$('#sheet');s.className='sheet '+cls;s.innerHTML=html;$('#scrim').classList.add('open');document.documentElement.classList.add('dlgdp');s.focus()}
function closeSheet(){if(DP.state.open)DP.closeDP();$('#scrim').classList.remove('open');document.documentElement.classList.remove('dlgdp');$('#sheet').innerHTML=''}
function seeAllSheet(){const v=visible();
  openSheet(`<div class="hd"><span><h2 id="shh">${v.filter(live).length} Reminders</h2><p>${nowCount()} need you now</p></span><button class="x" data-a="close" aria-label="Close">${ic('x')}</button></div>
   <div class="bd" style="padding:0"><div class="lk${S.look}">${listHTML(v)}${doneHTML()}</div></div>`,'allrem');fitMeta()}
let NEW={};
/* round 4 (fix 5): the buzz note follows For */
const bzNote=()=>KIO()?'It shows for everyone at home. A phone buzzes for it only where its owner turned on buzz for own reminders.'
  :NEW.who==='home'?'Everyone at home sees it. A phone buzzes for it only where its owner turned on buzz for own reminders.'
  :'Only you see it. Your phone buzzes for it (Your Own Reminders, in Reminder Settings).';
/* round 8 (Tyler 23:17, Q3 widened): a new reminder is for Everyone at Home on every device; Just Me only when it is personal */
function newSheet(o){NEW={time:o.time||'none',who:'home',from:o.from};
  DP.field('rd',{...DP.PAGES.remind,what:o.words||''});if(o.day)DP.setField('rd',DP.addD(DP.TODAY,o.day));
  const src=o.from?`<p class="src">${ic('p-kitchen')}From Kitchen${sep}${ic('fridge')}Fridge${sep}1 bag</p>`:'';
  openSheet(`<div class="hd"><span><h2 id="shh">${o.from?'Remind Me About Spinach':'New Reminder'}</h2>${src}</span><button class="x" data-a="close" aria-label="Close">${ic('x')}</button></div>
   <div class="bd" data-dpscroll><div class="form" data-dppanel>
    <label class="lab" for="rw">What</label><div class="field"><input id="rw" value="${esc(o.words||'')}" placeholder="Soak the beans" autocomplete="off"></div>
    <span class="lab ltop">Remind me on</span><div class="dpart">${DP.chipsFor('rd',DP.PAGES.remind.chips())}${DP.dgroup('rd','full')}${DP.dread('rd')}</div>
    <span class="lab ltop">Time</span><div class="chips" role="group" aria-label="Time">${[['none','Any Time'],['8','8 AM'],['12','Noon'],['17','5 PM'],['21','9 PM']].map(([v,l])=>`<button class="chip cmp ${NEW.time===v?'on':''}" data-a="tm" data-v="${v}" aria-pressed="${NEW.time===v}">${l}</button>`).join('')}</div>
    <span class="lab ${KIO()?'':'ltop'}">For</span>${KIO()?`<span class="forlock">${ic('users')}Everyone at Home</span>`:`<div class="chips" role="group" aria-label="Who it is for">${[['home','Everyone at Home'],['me','Just Me']].map(([v,l])=>`<button class="chip cmp ${NEW.who===v?'on':''}" data-a="wh" data-v="${v}" aria-pressed="${NEW.who===v}">${l}</button>`).join('')}</div>`}
    <span class="lab"></span><span class="note" id="bznote">${bzNote()}</span>
   </div></div>
   <div class="ft"><span class="sp"></span><button class="btn cancel" data-a="close">Cancel</button><button class="btn pri" data-a="rsave" data-save="rd">Save Reminder</button></div>`,'newrem');
  if(!o.words)setTimeout(()=>{const i=$('#rw');if(i&&!PHONE())i.focus()},30)}
function saveNew(){const w=($('#rw').value||'').trim();if(!w){$('#rw').focus();toast('Write what to remind you about.');return}
  if(!DP.okToSave('rd'))return;const d=DP.value('rd');if(!d)return;
  const days=Math.round((DP.d0(d)-DP.d0(DP.TODAY))/864e5);const g=days<=0?'later':'up';const tl={none:'',8:'8 AM',12:'Noon',17:'5 PM',21:'9 PM'}[NEW.time];
  const r={id:'n'+Date.now(),k:'own',g,due:days*24+(NEW.time==='none'?12:+NEW.time-20),who:NEW.who==='home'?null:ME(),hh:NEW.who==='home'?1:0,ic:'p-remind',t:esc(w),s:[DP.fmtShort(d)+(tl?' at '+tl:''),NEW.who==='home'?'Everyone at home':'Just me'],go:'Done',to:null,done:'Done: '+w+'.'};
  closeSheet();if(CUR!=='Reminders'){toast(`Saved. It shows in Reminders on ${DP.fmtShort(d)}.`);return}
  S.items.push(r);rerender();const el=document.querySelector(`.rm[data-id="${r.id}"]`);if(el){el.classList.add('new');el.scrollIntoView({block:'nearest'})}
  toast(`Saved for ${DP.fmtShort(d)}. It is in ${g==='later'?'Later Today':'Coming Up'}.`,()=>{S.items.splice(S.items.indexOf(r),1);rerender()})}
/* round 4 (fix 5): titled "Reminder Settings" (the ⋯ item's words); the four things that may buzz a phone come first,
   so Check on Phone and Cooking Timers sit in the Buzz column beside the thaw and your own reminders */
function settingsSheet(){const K=[['Check on Phone','Groceries sent from the computer',null,1],['Cooking Timers','When a timer is done',null,1],
   ['Thaw the Night Before','"Move the chicken to the fridge tonight"',1,1],['Your Own Reminders','The ones you make',1,1],
   ['Food to Use Soon','Food and leftovers near their use-by day',1,0],['Prep Coming Up','A prep task for tomorrow',1,0],['Plan the Week','No plan yet for next week (and the one weekly email)',1,0],
   ["Tomorrow's Shopping","Tomorrow's meal still needs things",0,0],['Shopping Trip Left Open','Only when you ask',0,0],['Rate a Meal','About a day and a half after you cook',0,0],['Cook Left Open','A cook nobody finished',0,0],['Notes to Sort','Captured notes waiting',0,0]];
  const cell=(on,lab)=>`<span class="c"><button class="sw ${on?'on':''}" role="switch" aria-checked="${!!on}" aria-label="${lab}" data-a="sw"></button></span>`;
  openSheet(`<div class="hd"><span><h2 id="shh">Reminder Settings</h2><p>What shows here, and the only four things that may buzz your phone</p></span><button class="x" data-a="close" aria-label="Close">${ic('x')}</button></div>
   <div class="bd"><div class="kset"><span class="hdr">Kind</span><span class="hdr">Show</span><span class="hdr">Buzz</span>
    ${K.map(([n,sm,on,bz])=>`<span class="k"><b>${n}</b><small>${sm}</small></span>${on===null?'<span class="c"></span>':cell(on,'Show '+n)}${bz?cell(1,'Phone buzz for '+n):'<span class="c"></span>'}`).join('')}
   </div><p class="note" style="margin:12px 0 0">Stand-in for Settings v2 (Walk 3): the names match this page's kinds.</p></div><div class="ft"><span class="sp"></span><button class="btn pri" data-a="close">Done</button></div>`,'setrem')}

/* round 8: an own reminder's ⋯ Change the Day = the shared date picker's change panel (DP.PAGES.remindChange, C-089
   "Reminders: change the day"): a quick date saves at once; or type / use the calendar, then Save */
let CHG=null;
const dayOf=r=>DP.addD(DP.TODAY,Math.floor((19.92+(r.due||0))/24));
function changeDaySheet(r){CHG=r;const d0=dayOf(r);DP.field('rc',{...DP.PAGES.remindChange,saved:d0});DP.setField('rc',d0);
  openSheet(`<div class="hd"><span><h2 id="shh">Change the Day</h2><p>${esc(r.t.replace(/<[^>]+>/g,''))}</p></span><button class="x" data-a="close" aria-label="Close">${ic('x')}</button></div>
   <div class="bd" data-dpscroll><div class="form" data-dppanel>
    <span class="lab ltop">Remind me on</span><div class="dpart">${DP.chipsFor('rc',DP.PAGES.remindChange.chips())}${DP.dgroup('rc','full')}${DP.dread('rc')}</div>
   </div></div>
   <div class="ft"><span class="sp"></span><button class="btn cancel" data-a="close" data-dpcancel="rc">Cancel</button><button class="btn pri" data-a="chsave" data-save="rc">Save</button></div>`,'newrem chday')}
function saveDay(){if(!CHG)return;if(!DP.okToSave('rc'))return;const d=DP.value('rc');if(!d)return;const r=CHG,old={due:r.due,g:r.g,s:[...r.s]};
  const days=Math.round((DP.d0(d)-DP.d0(DP.TODAY))/864e5),tm=(r.s.length>1?r.s[0]:'').match(/\d{1,2}(:\d\d)? [AP]M$/);
  r.due=days*24+(days?0:1);r.g=days<=0?'later':'up';r.s=[days<=0&&tm?tm[0]:DP.fmtShort(d)+(tm?' at '+tm[0]:''),r.s[r.s.length-1]];
  closeSheet();CHG=null;rerender();const el=document.querySelector(`.rm[data-id="${r.id}"]`);if(el){el.classList.add('new');el.scrollIntoView({block:'nearest'})}
  toast(`Moved to ${DP.fmtShort(d)}. It is in ${r.g==='later'?'Later Today':'Coming Up'}.`,()=>{Object.assign(r,old);rerender()})}
DP.H.commit=id=>{if(id==='rc')saveDay()};

/* the date picker floats in its own layer under the date (C-095 round 38: nothing under it moves); the phone keeps the shared bottom sheet */
DP.H.place=(id,w,h)=>{if(PHONE())return null;const g=DP.grpOf(id);if(!g)return null;const gr=g.getBoundingClientRect();
  /* round 4 (fix 5): in a dialog the calendar never covers the dialog's own buttons. Room at the side: it floats
     beside the dialog, level with the date. No room: under the date, lifted to end above the buttons if it must */
  const dlg=g.closest('.sheet');
  if(dlg){const dr=dlg.getBoundingClientRect(),ft=dlg.querySelector('.ft'),fr=ft?ft.getBoundingClientRect():dr;
    const clampT=t=>Math.round(Math.max(58,Math.min(t,innerHeight-16-h)));
    if(innerWidth-dr.right>=w+28)return {left:Math.round(dr.right+12),top:clampT(gr.top-48)};
    if(dr.left>=w+28)return {left:Math.round(dr.left-12-w),top:clampT(gr.top-48)};
    const left=Math.round(Math.max(16,Math.min(gr.right-w,innerWidth-16-w)));let top=gr.bottom+8;
    if(top+h>fr.top-8)top=Math.max(gr.top+44,fr.top-8-h);if(top+h>fr.top-8)top=Math.max(58,gr.top-8-h);
    return {left,top:Math.round(top)}}
  const left=Math.max(16,Math.min(gr.right-w,innerWidth-16-w));let top=gr.bottom+8;if(top+h>innerHeight-16){const up=gr.top-8-h;top=up>=58?up:Math.max(58,innerHeight-16-h)}
  return {left:Math.round(left),top:Math.round(top)}};
DP.H.bottom=sc=>sc.matches('.sheet .bd')?sc.getBoundingClientRect().bottom:innerHeight;

/* ---------- mockup state bar ---------- */
const STATES=[['normal','Normal'],['loading','Loading'],['empty','Empty'],['many','Many'],['menu','Row ⋯ menu'],['notnow','Not Now picker'],['dismiss','Dismiss + Undo'],['done','Done This Week open'],
  ['new','New Reminder'],['newcal','New Reminder + calendar'],['itemmenu','Kitchen item ⋯ (stand-in)'],['fromitem','From a Kitchen item'],['today','Today: See All sheet'],['kitchen','Kitchen iPad'],
  ['limited','Limited member'],['limitedopen','Limited: folds open'],['offline','Offline'],['handled','Someone else did it'],['away','Away (paused)'],['settings','Reminder Settings (stand-in)'],['pagemenu','Page ⋯ menu'],['drawer','Phone More drawer'],['manyopen','Many: foods opened'],['notnowdone','Just set aside'],['kitchennew','Kitchen iPad: New Reminder'],['kitchenmenu','Kitchen iPad: row ⋯ menu'],['ownmenu','Own reminder ⋯ menu'],['changeday','Change the Day + calendar']];
function mockBar(){const cur=(STATES.find(s=>s[0]===S.st)||['','Normal'])[1];
  $('#mock').innerHTML=`<span class="cur">${cur}</span>${['A','B','C'].map(l=>`<button class="${S.look===l?'on':''}" data-a="look" data-v="${l}">Row ${l}</button>`).join('')}<button class="stbtn" id="stbtn">States ▾</button>`;
  $('#mockmore').innerHTML=`<b>Row drawing (round 1)</b>${[['A','A: plain row, button at right'],['B','B: a small card each'],['C','C: button under the words']].map(([v,l])=>`<button class="${S.look===v?'on':''}" data-a="look" data-v="${v}">${l}</button>`).join('')}<b>States</b>${STATES.map(([k,l])=>`<button class="${S.st===k?'on':''}" data-a="state" data-v="${k}">${l}</button>`).join('')}`;
  $('#stbtn').onclick=e=>{e.stopPropagation();const m=$('#mockmore'),r=e.target.getBoundingClientRect();m.classList.toggle('open');m.style.top=(r.bottom+6)+'px';m.style.left=Math.max(8,Math.min(r.left,innerWidth-260))+'px'}}
function go(st){S.st=st;$('#mockmore').classList.remove('open');closeMenu();closeSheet();reset();render();
  const sc=$('#scroll');
  if(st==='menu'||st==='notnow'){const b=document.querySelector('.rm[data-id="r4"] .kb');openMenu(b,rowMenu(byId('r4')),'r4');if(st==='notnow'){$('#menuin').innerHTML=notNowMenu(byId('r4'));placeMenu()}}
  if(st==='dismiss'){leave('r4',{id:'xr4',ic:'x',t:'Dismissed: Spinach: use by tomorrow',s:['You','Just now'],back:1,from:byId('r4')},'Dismissed. It is in Done This Week.');}
  if(st==='done'){S.dwOpen=true;rerender();const d=$('.dwk');if(d&&sc)$('#scroll').scrollTop=1e5}
  if(st==='new')newSheet({});
  if(st==='newcal'){newSheet({words:'Soak the black beans'});setTimeout(()=>{DP.openDP('rd')},60)}
  if(st==='itemmenu'){const b=document.querySelector('.krow .kb');openMenu(b,kitMenu(),'k1')}
  if(st==='fromitem')newSheet({words:'Use the spinach',day:1,time:'8',from:'spinach'});
  if(st==='today')seeAllSheet();
  if(st==='settings')settingsSheet();
  if(st==='pagemenu'){const b=document.querySelector('[data-a="pagemenu"]');if(b)openMenu(b,pageMenu())}
  if(st==='drawer'){S.drawer=true;render()}
  if(st==='manyopen'){S.foldOpen=true;rerender()}
  if(st==='kitchennew')newSheet({});
  if(st==='kitchenmenu'){const b=document.querySelector('.rm[data-id="r2"] .kb');openMenu(b,rowMenu(byId('r2')),'r2')}
  if(st==='ownmenu'){const b=document.querySelector('.rm[data-id="r13"] .kb');if(b){b.scrollIntoView({block:'center'});openMenu(b,rowMenu(byId('r13')),'r13')}}
  if(st==='changeday'){changeDaySheet(byId('r13'));setTimeout(()=>{DP.openDP('rc')},60)}
  if(st==='notnowdone'){const b=document.createElement('button');b.dataset.id='r4';b.dataset.w='Back tomorrow at 8 AM';A.nn(b)}}
reset();render();go(S.st);
addEventListener('resize',()=>{if(!$('#scrim').classList.contains('open'))rerender()});
</script>
