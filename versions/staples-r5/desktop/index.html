<title>Staples icon Desktop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@1,9..144,600&display=swap" rel="stylesheet">
<style>

.th-light{--page:#EDE5D8;--card:#FAF6EE;--ink:#1E1E1C;--quiet:#54524A;--ph:#605E55;--accent:#4B6947;--sage-light:#E4EDE2;--chip:#E4D9C6;--chip-on:#B7D0B0;--subbar:#E4D3B3;--sbd:#5C3D0A;--sbs:#7A5030;
 --header:#6B3E14;--header-text:#FAF4EB;--border:rgba(0,0,0,.09);--brow:rgba(0,0,0,.06);--grid:rgba(0,0,0,.07);--grid4:rgba(0,0,0,.16);--shadow:45,33,22}
.th-dark{--page:#1A1815;--card:#24211D;--ink:#EEE8DC;--quiet:#C6BFB1;--ph:#ADA698;--accent:#A3C49D;--sage-light:#22301F;--chip:#3A3329;--chip-on:#2F4A2B;--subbar:#2E2619;--sbd:#E3C99A;--sbs:#CDB08C;
 --header:#3A220C;--header-text:#F3EBDD;--border:rgba(255,255,255,.12);--brow:rgba(255,255,255,.08);--grid:rgba(255,255,255,.08);--grid4:rgba(255,255,255,.18);--shadow:0,0,0}
*{box-sizing:border-box}
.card.th-light,.card.th-dark,.side.th-light,.side.th-dark{color:var(--ink)}
html,body{margin:0}
body{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--page);color:var(--ink);font-size:15px;line-height:1.45;overflow-x:hidden}
.hdr{background:var(--header);color:var(--header-text);height:52px;display:flex;align-items:center;padding:0 20px}
.hdr .wm{font-family:Fraunces,Georgia,serif;font-style:italic;font-weight:600;font-size:22px}
.tan{background:var(--subbar);min-height:46px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:6px 20px;border-bottom:1px solid var(--border)}
.tan .t{font-weight:600;font-size:16px;color:var(--sbd)}
.tan .sub{font-size:14px;color:var(--sbs)}
.seg{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
.seg button{font:inherit;font-size:13px;font-weight:600;padding:5px 10px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--ink);cursor:pointer}
.seg button.on{background:var(--sage-light);color:var(--accent);border-color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding:20px}
@media (max-width:560px){.wrap{padding:12px}}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 1px 2px rgba(var(--shadow),.055),0 6px 16px rgba(var(--shadow),.055)}
@media (max-width:560px){.card{padding:14px}}
h2{font-size:18px;margin:0 0 6px}h3{font-size:15px;margin:14px 0 8px}p{margin:4px 0 8px}
.q{color:var(--quiet);font-size:14px}
code,pre{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;background:var(--chip);border-radius:6px}
code{padding:0 4px;overflow-wrap:anywhere}
pre{padding:8px 10px;margin:8px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:14px}
.opt{border:1px solid var(--border);border-radius:10px;padding:12px;min-width:0}
.opt.pick{border:2px solid var(--accent)}
.opt .nm{font-weight:700;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.opt .pk{font-size:12.5px;font-weight:700;color:var(--accent);background:var(--sage-light);border-radius:6px;padding:0 8px}
.opt .why{font-size:13.5px;color:var(--quiet);margin:2px 0 8px}
.strip{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 14px;padding:10px 12px;border-radius:8px;background:var(--card);color:var(--ink);border:1px solid var(--border)}
.strip .sz{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--quiet)}
.strip svg{display:block}
.g128{position:relative;width:128px;height:128px}
.g128 .gr{position:absolute;inset:0;pointer-events:none;
 background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/16px 16px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/16px 16px}
.g128 .safe{position:absolute;left:10.67px;top:10.67px;width:106.67px;height:106.67px;outline:1px dashed var(--grid4);pointer-events:none}
.g128 svg{position:relative}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
@media (max-width:560px){.two{grid-template-columns:minmax(0,1fr)}}
.side{min-width:0;background:var(--page);padding:8px;border-radius:10px}
@media (max-width:560px){.side{padding:6px}}
.lab{font-size:12px;font-weight:600;color:var(--quiet);margin-bottom:4px}
.nb{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;background:var(--card);color:var(--quiet);border:1px solid var(--border);margin-top:6px}
.nb .me{outline:1px dashed var(--grid4);outline-offset:2px;border-radius:2px;color:var(--ink)}
.nb .sep{width:1px;align-self:stretch;background:var(--border)}
.nb .tw{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--quiet)}
.nb svg{display:block;flex:none}
/* ---------- C-071 grocery row (copied from agreed C-071 CSS, trimmed) ---------- */
.ctx{background:var(--page);padding:10px;border-radius:10px;min-width:0}
.ctxs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:8px;margin-top:8px}
.lst{background:var(--card);border-radius:12px;border:1px solid var(--border);overflow:hidden}
.aisle{padding:12px 16px 6px;font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ph);border-bottom:1px solid var(--brow)}
.row{display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 8px 8px 16px;border-bottom:1px solid var(--brow)}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0;padding:2px 0}
.row .rn{font-size:16px;font-weight:500}.row .rn b{font-weight:400;color:var(--quiet)}
.src{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--ph);margin-top:2px;line-height:1.4}
.src>span{min-width:0}
.src svg{width:16px;height:16px;margin-top:1px;flex:none}
.dots{width:44px;height:44px;display:grid;place-items:center;color:var(--quiet);flex:none}
.key{padding:10px 16px;display:grid;gap:8px;font-size:14px;color:var(--ink)}
.key .kv{display:flex;gap:12px;align-items:center}
.key svg{color:var(--ph);flex:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:10px 12px}
.chip{height:44px;border-radius:8px;padding:0 12px;display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:15px;color:var(--ink);background:var(--chip);border:1px solid transparent;font-weight:600;white-space:nowrap}
.chip.on{background:var(--chip-on);border-color:var(--accent);font-weight:700}
.chip svg{flex:none}
.chip.sm{height:32px;font-size:13px;padding:0 10px;gap:6px}
.kb{padding:10px 12px;display:grid;gap:8px}
.kbr{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.kst{font-size:12px;font-weight:600;color:var(--quiet);width:26px}
.act{height:44px;border-radius:8px;padding:0 14px;display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:15px;font-weight:600;color:var(--ink);background:var(--card);border:1px solid var(--quiet);white-space:nowrap}
.act.on{background:var(--chip-on);border-color:var(--accent)}
.cmp{padding:6px 12px;display:grid;gap:6px}
.cr{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cid{font-weight:700;width:16px;color:var(--quiet)}
.opt .pk.ru{color:var(--quiet);background:var(--chip)}
.fam{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:center}
.fam .fi{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--quiet);text-align:center}
.only-round .rnd:not(.show){display:none}
</style>
</head>

function svg(o,size,cls=''){const inner=o.lu?LU[o.lu]:`<path d="${o.d}"/>`;
 return `<svg class="${cls}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;}
