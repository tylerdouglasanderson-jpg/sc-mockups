*{box-sizing:border-box}
.card.th-light,.card.th-dark{color:var(--ink)}
html,body{margin:0}
body{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--page);color:var(--ink);font-size:15px;line-height:1.45;overflow-x:hidden}
.hdr{background:var(--header);color:var(--header-text);height:52px;display:flex;align-items:center;padding:0 20px}
.hdr .wm{font-family:Fraunces,Georgia,serif;font-style:italic;font-weight:600;font-size:22px}
.tan{background:var(--subbar);min-height:46px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:6px 20px;border-bottom:1px solid var(--border)}
.tan .t{font-weight:600;font-size:16px;color:var(--sbd)}
.tan .sub{font-size:14px;color:var(--sbs)}
.seg{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
.seg button{font:inherit;font-size:13px;font-weight:600;padding:5px 10px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--ink);cursor:pointer}
.seg button.on{background:var(--sage-light);color:var(--accent);border-color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 1px 2px rgba(var(--shadow),.055),0 6px 16px rgba(var(--shadow),.055)}
h2{font-size:18px;margin:0 0 6px}h3{font-size:15px;margin:14px 0 8px}p{margin:4px 0 8px}
.q{color:var(--quiet);font-size:14px}
code,pre{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;background:var(--chip);border-radius:6px}
code{padding:0 4px;overflow-wrap:anywhere}
pre{padding:8px 10px;margin:8px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:14px}
.opt{border:1px solid var(--border);border-radius:10px;padding:12px;min-width:0}
.opt.pick{border:2px solid var(--accent)}
.opt .nm{font-weight:700;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.opt .pk{font-size:12.5px;font-weight:700;color:var(--accent);background:var(--sage-light);border-radius:6px;padding:0 8px}
.opt .why{font-size:13.5px;color:var(--quiet);margin:2px 0 8px}
.strip{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 14px;padding:10px 12px;border-radius:8px;background:var(--card);color:var(--ink);border:1px solid var(--border)}
.strip .sz{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--quiet)}
.strip svg{display:block}
.g128{position:relative;width:128px;height:128px}
.g128 .gr{position:absolute;inset:0;pointer-events:none;

.g128 .safe{position:absolute;left:10.67px;top:10.67px;width:106.67px;height:106.67px;outline:1px dashed var(--grid4);pointer-events:none}
.g128 svg{position:relative}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
@media (max-width:560px){.two{grid-template-columns:minmax(0,1fr)}}
.side{min-width:0}
.lab{font-size:12px;font-weight:600;color:var(--quiet);margin-bottom:4px}
.nb{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;background:var(--card);color:var(--ink);border:1px solid var(--border);margin-top:6px}
.nb .me{outline:1px dashed var(--grid4);outline-offset:2px;border-radius:2px}
.nb .sep{width:1px;align-self:stretch;background:var(--border)}
.nb .tw{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--quiet)}
.cands{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cand{border:1px solid var(--border);border-radius:8px;padding:8px;display:flex;gap:10px;align-items:center;min-width:0;background:var(--card)}
.cand .nmc{font-size:12.5px;line-height:1.25;color:var(--quiet);overflow-wrap:anywhere}
.cand .nmc b{color:var(--ink);font-weight:600}

.rc{position:relative;width:100%;max-width:460px;border-radius:6px;padding:10px 18px 14px;color:var(--ink);
 background:repeating-linear-gradient(to bottom,transparent 0 27px,var(--iblue) 27px 28px) 0 0/100% 28px,var(--icard);
 box-shadow:0 2px 6px rgba(40,26,8,.14),0 0 0 1px rgba(60,40,10,.12)}
.rc .src{font-size:13.5px;line-height:28px;color:var(--muted)}
.rc .src a{color:var(--sage-mid);text-decoration:underline;text-underline-offset:2px;font-weight:500}
.ext{display:inline-block;margin-left:1px;text-decoration:none;vertical-align:.32em;line-height:0}.ext .tip{width:.62em;height:.62em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rc h3{font-size:15px;font-weight:600;color:var(--ink2);line-height:28px;margin:0;display:flex;gap:10px;align-items:center}
.rc h3 .ico{color:var(--muted)}
.grp{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);line-height:28px;margin:0}
.ing{display:flex;gap:8px;align-items:flex-start;font-size:14.5px;line-height:28px;min-height:28px}
.ing .q{min-width:72px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.ing .n{flex:1;color:var(--ink2);min-width:0}
.ing .ok{color:var(--sage-mid);font-size:13px}
.ing .short{color:var(--amber);font-size:12.5px;font-weight:600;background:var(--amber-light);border-radius:4px;padding:0 6px;line-height:19px;margin-top:4px}
.ing .rcp{font-size:12.5px;color:var(--muted)}
.sub{display:inline-flex;align-items:center;gap:6px;vertical-align:top;margin-top:3px;font:inherit;font-size:14.5px;line-height:22px;text-decoration:none;
 background:var(--sage-light);border:1px solid var(--sage-line);border-radius:6px;padding:0 8px;color:var(--sage);font-weight:600;cursor:pointer}
.sub svg{flex:none;display:block}
.sub .chev{margin-left:-4px;margin-right:-3px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;padding:6px 0 2px}
.bb{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:14.5px;font-weight:600;line-height:20px;padding:6px 12px;border-radius:8px;border:1px solid var(--sage-line);background:var(--icard);color:var(--sage);cursor:pointer}
.bb svg{flex:none;display:block}
.stp{margin:0;padding:0;list-style:none;counter-reset:s}
.stp li{counter-increment:s;position:relative;padding:0 0 0 36px;font-size:14.5px;line-height:28px;color:var(--ink2)}
.stp li::before{content:counter(s);position:absolute;left:0;top:4px;width:19px;height:19px;border-radius:50%;background:var(--sage-light);color:var(--sage);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1px rgba(60,40,10,.15)}
.stp li .sub{margin-top:0;vertical-align:-1px;line-height:20px}
.meta{display:flex;gap:6px 14px;align-items:center;font-size:12.5px;color:var(--ink2);line-height:28px;flex-wrap:wrap}
.meta .rt{color:var(--rt);font-weight:600}
.meta .ico{width:16px;height:16px;vertical-align:-3px;margin-right:3px}
.ctx{background:var(--page);padding:10px;border-radius:10px;min-width:0}
.ctxs{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin-top:8px}
.sub span{white-space:nowrap}
.only-round .rnd:not(.show){display:none}
</style>
</head>

const PICK={1:'D',2:'G',3:'G',4:'',5:'J'}; /* round 4: no pick, every cue made it worse (ITERATIONS.md) */

function svg(o,size,cls=''){const inner=o.lu?LU[o.lu]:`<path d="${o.d}"/>`;
 return `<svg class="${cls}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;}

const nbr=(o,s)=>`${L('chevron-right',s)}${L('clock',s)}${L('star',s)}${L('heart',s)}<span style="font-size:${s*0.9}px;line-height:1;color:var(--sage-mid)">link${TIP}</span><span class="sep"></span>${svg(o,s,'me')}<span class="sep"></span><span class="tw">${L('credit-card',s)}card</span><span class="tw">${L('file',s)}note</span><span class="tw">${L('file-text',s)}file-text</span><span class="tw">${L('sticky-note',s)}sticky</span><span class="tw">${L('captions',s)}captions</span><span class="tw">${L('book-open',s)}recipes</span><span class="tw">${bookPic(s)}book pic</span>`;
const pid=(th,rid,id,s)=>`${th==='th-dark'?'d':'l'}${rid}${id}s${s}`;

  h+=`</div></div>`;}
 document.getElementById('app').innerHTML=h;
