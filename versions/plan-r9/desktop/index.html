<!doctype html>
<html lang="en">
<head><script>window.SC_FULL='desktop'</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan Desktop</title>
<script>
/* Plan a week v3 mockup (T-2132 / T-2149, App Walkthrough 3). Not agreed. One file.
   Full-screen mode for the review links: window.SC_FULL = desktop | ipad | phone, or ?full=ipad by hand.
   ?state=<id> opens one state (the shot script uses it). The dark bar at the top is mockup-only. */
window.FULL=window.SC_FULL||new URLSearchParams(location.search).get('full')||'';
if(window.FULL)document.documentElement.classList.add('full','full-'+window.FULL);
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,600&family=Fraunces:ital,opsz,wght@1,9..144,600&display=swap" rel="stylesheet">
<style>
/* Frame, tokens and kit parts are copied from the Groceries v3 mockup (round 17), which copies the live app and src/kit:
   header 50, rail 219, tan bar 46, Button 44 radius 8, Chip 44 radius 8, Card radius 12, Popover radius 12, Dialog 420/480,
   Toast bottom right, scrollbar 12 gutter / 6 thumb. Index cards copy the C-058 Recipe Book mockup (round 15). */
:root{
  --page:#EDE5D8; --card:#FAF6EE; --panel:#F6F2E9; --panel-alt:#F1E8DA;
  --header:#6B3E14; --subbar:#E4D3B3; --hdr-text:#FAF4EB; --subbar-date:#5C3D0A; --subbar-2:#7A5030;
  --ink:#1E1E1C; --ink2:#54524A; --muted:#605E55;
  --sage:#8FAF8A; --sage-dark:#1F3A1C; --sage-light:#E4EDE2; --sage-text:#4B6947; --sage-line:#B9CDB4;
  --amber:#C8943A; --amber-light:#F5ECD8; --amber-text:#7E5C22;
  --urgent-bg:#F5E4E4; --urgent-text:#5C1A1A; --urgent-border:#8E3131;
  --chip:#E4D9C6; --chip-on:#B7D0B0; --chip-warm:#EFE4CC; --chip-warm-edge:#988048;
  --row-hover:#F0EEE3; --track:#DDD5C5; --folder-line:#D2C6B0;
  --bcard:rgba(0,0,0,.09); --brow:rgba(0,0,0,.06); --scrim:rgba(0,0,0,.4);
  --shadow-card:0 1px 2px rgba(45,33,22,.055),0 6px 16px rgba(45,33,22,.055);
  --shadow-pop:0 4px 14px rgba(45,33,22,.16); --shadow-float:0 16px 48px rgba(45,33,22,.2);
  --hover:inset 0 0 0 100px rgba(30,30,28,.04); --press:inset 0 0 0 100px rgba(30,30,28,.16);
  /* C-058 index card */
  --icard:#FFFDF7; --ired:rgba(196,72,60,.55); --iblue:rgba(80,120,170,.16); --tan-line:#D2BE98; --endpaper:#F3E9D6;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --ease:cubic-bezier(.25,.46,.45,.94);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--page)}
body{color:var(--ink);font:400 15px/1.45 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea{font:inherit;color:inherit}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:16px;height:16px}
:focus-visible{outline:2px solid var(--sage-text);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.2s!important;animation-name:fade!important;transition-duration:.01s!important}}

/* the one themed scroll bar (DESIGN 4.10) */
.scroll,.sheet,.menu .mi,.pk-scroll,.chat .msgs,.swap .list,.tpcards,.fpop{scrollbar-width:thin;scrollbar-color:rgba(96,94,85,.35) transparent}
.scroll::-webkit-scrollbar,.sheet::-webkit-scrollbar,.pk-scroll::-webkit-scrollbar,.chat .msgs::-webkit-scrollbar,.swap .list::-webkit-scrollbar,.menu .mi::-webkit-scrollbar,.tpcards::-webkit-scrollbar,.fpop::-webkit-scrollbar{width:12px;height:12px}
.scroll::-webkit-scrollbar-thumb,.sheet::-webkit-scrollbar-thumb,.pk-scroll::-webkit-scrollbar-thumb,.chat .msgs::-webkit-scrollbar-thumb,.swap .list::-webkit-scrollbar-thumb,.menu .mi::-webkit-scrollbar-thumb,.tpcards::-webkit-scrollbar-thumb,.fpop::-webkit-scrollbar-thumb{background:rgba(96,94,85,.35);border:3px solid transparent;background-clip:padding-box;border-radius:999px}
.scroll::-webkit-scrollbar-track,.sheet::-webkit-scrollbar-track,.pk-scroll::-webkit-scrollbar-track,.chat .msgs::-webkit-scrollbar-track,.swap .list::-webkit-scrollbar-track,.menu .mi::-webkit-scrollbar-track,.tpcards::-webkit-scrollbar-track,.fpop::-webkit-scrollbar-track{background:transparent}

/* ---------- frame ---------- */
.app{height:100vh;height:100dvh;display:grid;grid-template-columns:219px 1fr;grid-template-rows:50px 1fr}
.top{grid-column:1/-1;display:flex;align-items:center;padding:0 28px 0 12px;color:var(--hdr-text);background:var(--header);position:relative}

.top::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(0,0,0,.10));pointer-events:none}
.wordmark{font-family:Fraunces,Georgia,serif;font-style:italic;font-weight:600;font-size:22px;position:relative;letter-spacing:.01em}
.top .sp{flex:1}
.av{display:inline-grid;place-items:center;border-radius:50%;font-weight:600;color:#fff;flex:none}
.av.hdr{width:28px;height:28px;font-size:12px;background:#5E7C55;box-shadow:0 0 0 2px var(--hdr-text);position:relative}
.av.sm{width:24px;height:24px;font-size:12px}
.rail{background:var(--card);border-right:1px solid var(--bcard);padding:12px 8px;display:flex;flex-direction:column;gap:4px}
.rail .cap{height:44px;border-radius:8px;background:var(--sage-dark);color:var(--hdr-text);display:flex;align-items:center;gap:8px;padding:0 12px;font-weight:500;font-size:16px;margin-bottom:8px}
.rail .ri{display:flex;align-items:center;gap:12px;height:44px;border-radius:8px;padding:0 12px;color:var(--ink2);font-weight:500;font-size:16px;text-align:left}
.rail .ri svg.i{width:24px;height:24px}
.rail .ri:hover{box-shadow:var(--hover)}.rail .cap:hover{box-shadow:inset 0 0 0 100px rgba(250,244,235,.08)}
.rail .ri.on{background:var(--sage-light);color:var(--sage-text)}
.rail hr{border:0;border-top:1px solid var(--bcard);margin:4px 8px}
.rail .grow{flex:1}
.body{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:46px auto 1fr;min-height:0;min-width:0;position:relative;overflow:hidden}

/* tan bar (C-057): title, one main button on the right, the ⋯ menu. Nothing else. */
.bar{background:var(--subbar);border-bottom:1px solid var(--brow);position:relative;display:flex}
.bar .in{display:flex;align-items:center;gap:12px;width:100%;padding:0 16px}
.bar .ttl{font-style:italic;font-weight:600;font-size:16px;color:var(--subbar-date);white-space:nowrap}
.bar .ttl .crumb{font-style:normal;font-weight:500;color:var(--subbar-2)}
.bar .meta{font-size:13px;color:var(--subbar-2);padding-left:12px;border-left:1px solid var(--chip-warm-edge);display:flex;align-items:center;gap:8px;white-space:nowrap;min-width:0;overflow:hidden}
.bar .sp{flex:1}
.bar .btn{height:36px;padding:0 14px;font-size:15px}.bar .btn::after{content:"";position:absolute;inset:-4px 0}
.bar .btn.icon{width:36px;padding:0;color:var(--subbar-date);position:relative}.bar .btn.icon::after{content:"";position:absolute;inset:-4px}
.back{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--subbar-date);margin-left:-8px;position:relative}
.back:hover{box-shadow:var(--hover)}.back::after{content:"";position:absolute;inset:-4px}

/* kit Button */
.btn{height:44px;border-radius:8px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:500;font-size:16px;white-space:nowrap;transition:transform 50ms var(--ease),box-shadow .2s var(--ease),opacity .2s;position:relative;flex:none}
.btn:active{transform:scale(.97);box-shadow:var(--press)}
.btn.pri{background:var(--sage-dark);color:var(--hdr-text)}.btn.pri:hover{box-shadow:inset 0 0 0 100px rgba(250,244,235,.08)}
.btn.sec{background:var(--sage);color:var(--ink)}.btn.sec:hover{box-shadow:var(--hover)}
.btn.cancel{background:transparent;border:1px solid var(--ink2);color:var(--ink)}.btn.cancel:hover{box-shadow:var(--hover)}
.btn.danger{background:transparent;border:1px solid var(--urgent-border);color:var(--urgent-text)}.btn.danger:hover{box-shadow:inset 0 0 0 100px rgba(142,49,49,.06)}
.btn.danger.fill{background:var(--urgent-border);color:#fff}
.btn.tan{background:var(--chip-warm);border:1px solid var(--chip-warm-edge);color:var(--ink)}.btn.tan:hover{box-shadow:var(--hover)}
.btn.icon{width:44px;padding:0;background:transparent;color:var(--ink2)}.btn.icon:hover{box-shadow:var(--hover)}
.btn.sm{height:36px;padding:0 12px;font-size:15px}.btn.sm::after{content:"";position:absolute;inset:-4px 0}
.btn.wide{width:100%}
.btn.off{opacity:.45;cursor:default}
.tag{font-size:13px;font-weight:600;color:var(--ink);background:var(--chip);border-radius:8px;padding:2px 8px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.tag.ok{background:var(--sage-light);color:var(--sage-text)}
.tag.amb{background:var(--amber-light);color:var(--amber-text)}
.tag.card{background:var(--card);border:1px solid var(--bcard)}
.eyebrow{font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--card);border-radius:12px;border:1px solid var(--bcard);box-shadow:var(--shadow-card)}
.chip{height:44px;border-radius:8px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:15px;color:var(--ink);background:var(--chip);border:1px solid transparent;font-weight:600;white-space:nowrap;transition:transform 50ms var(--ease)}
.chip:hover{box-shadow:var(--hover)}.chip:active{transform:scale(.97);box-shadow:var(--press)}
.chip.on{background:var(--chip-on);border-color:var(--sage-text);font-weight:700}
.chip.cmp{height:36px;padding:0 12px;font-size:14px}.chip.cmp::after{content:"";position:absolute;inset:-4px 0}
.chip{position:relative}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:rot .8s linear infinite;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
@keyframes growin{from{grid-template-rows:0fr;opacity:0}to{grid-template-rows:1fr;opacity:1}}
@keyframes dropin{from{opacity:0;transform:translateY(-18px) rotate(-2deg)}to{opacity:1;transform:none}}
@keyframes arrive{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
@keyframes shimmer{0%{background-position:-300px 0}100%{background-position:300px 0}}
.scroll{overflow:auto;min-height:0}

/* ---------- week row: one button per plan, under the tan bar (never in it) ---------- */
.weeks{display:flex;align-items:center;gap:8px;padding:12px 16px 0;min-width:0}
/* only the week buttons scroll sideways; the board's tools stay put at the right */
.wlist{display:flex;align-items:center;gap:8px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:0 1 auto}
.weeks .wsp{flex:1 1 0;min-width:0}
.weeks .wk.add{flex:none}
/* the edge fade only shows when the row really runs past the edge */
.wlist.ovf{padding-right:28px;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
.wlist::-webkit-scrollbar{display:none}
.wlist.t1 .lg{display:none}
.weeks.slimtools .btn.tan svg{display:none}.weeks.slimtools .btn.tan{padding:0 14px}
/* r9: each week keeps its state words. When room runs out the long words swap for short ones ("Draft · 1 open", "Not imported") and the icon goes */
.wk small .shs{display:none}
.wlist.t2 .wk small .lgs{display:none}.wlist.t2 .wk small .shs{display:inline}
.wlist.t2 .wk:not(.add) .wi{display:none}.wlist.t2 .wk{padding:0 10px}
/* phone, last resort: "+ Plan Week" becomes a 44 px + button (its name stays in the label); a solid kit edge, not dashed */
.wlist.t2 .wk.add{font-size:0;gap:0;width:44px;padding:0;justify-content:center;border:1px solid var(--bcard);background:var(--card)}
.wk{height:44px;border-radius:8px;padding:0 14px 0 10px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bcard);text-align:left;flex:none;transition:background .2s var(--ease),border-color .2s var(--ease)}
.wk:hover{box-shadow:var(--hover)}
.wk b{display:block;font-size:15px;font-weight:600;line-height:19px}
.wk small{display:block;font-size:13px;color:var(--ink2);line-height:17px;white-space:nowrap}
.wk .wi{width:18px;height:18px;flex:none;display:grid;place-items:center;color:var(--muted)}
.wk .wi svg{width:18px;height:18px}
.wk .wi.appr{color:var(--sage-text)}.wk .wi.draft{color:var(--amber-text)}
.wk.on{background:var(--sage-light);border:1px solid var(--sage-text)}
.wk.on b{color:var(--ink)}
/* "+ Plan Another Week" is an action, so it reads as a quiet text button, not as another week */
.wk.add{background:transparent;border:0;color:var(--sage-text);font-weight:600;font-size:15px;gap:6px;padding:0 10px}
.wk.add:hover{background:rgba(255,255,255,.45);box-shadow:none}
.wk.add svg{color:var(--sage-text);width:18px;height:18px}

/* ---------- work area: the board, and Claude beside it ---------- */
.work{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;padding:12px 16px 16px;min-height:0;transition:grid-template-columns .2s var(--ease)}
.work.closed{grid-template-columns:minmax(0,1fr) 0px;gap:0}
.board{display:flex;flex-direction:column;min-height:0;min-width:0;position:relative}
.board>.scroll{flex:1;border-radius:12px}
.days{background:var(--card);border:1px solid var(--bcard);border-radius:12px;box-shadow:var(--shadow-card)}

/* one day = one row of the journal (Q1=B): the day on the left, its meals as small index cards */
.day{display:grid;grid-template-columns:50px minmax(0,1fr);gap:10px;padding:12px 12px 12px 12px;border-top:1px solid var(--brow);position:relative;transition:background .2s var(--ease)}
.day:first-child{border-top:0;border-radius:12px 12px 0 0}
.day:last-child{border-radius:0 0 12px 12px}
.day.today{background:var(--sage-light)}
.day.past .mealgrid{opacity:.86}
.dl{display:flex;flex-direction:column;align-items:flex-start;padding-top:2px}
.dl .wd{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.dl .dn{font-size:28px;font-weight:600;line-height:32px}
.dl .mo{font-size:12px;color:var(--muted)}
.dl .tt{font-size:12px;font-weight:600;color:var(--sage-text);margin-bottom:2px}
.mealgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px;align-items:start}
/* r7: a wide approved week with Claude closed keeps a calm width instead of long empty rows */
@media (min-width:1101px){.work.closed .board{max-width:920px}.work.closed .mealgrid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}}
/* r9: "+ Add a Meal" always sits in the meal grid, after the cards, as one 44 px text button (no tucked copy under the date) */
/* past days of an approved week fold into one line (tap to open); their cooked / skipped marks stay in the line */
.pastrow{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:6px 12px 6px 12px;border-radius:12px 12px 0 0;text-align:left;color:var(--ink2);font-size:14px;background:var(--panel)}
.pastrow:hover{box-shadow:var(--hover)}
.pastrow b{color:var(--ink);font-weight:600;font-size:15px}
.pastrow .pr-st{display:inline-flex;align-items:center;gap:4px;color:var(--sage-text);font-weight:600}
.pastrow .pr-st svg{width:14px;height:14px}
.pastrow .sp{flex:1}
.pastrow .pr-go{display:inline-flex;align-items:center;gap:4px;color:var(--ink);font-weight:500}
.pastrow .pr-go svg{transition:transform .2s var(--ease)}
.pastrow.open .pr-go svg{transform:rotate(180deg)}
.day.drop{background:#EAF1E7;box-shadow:inset 0 0 0 2px var(--sage-text)}
.day.drop .addm{border-color:var(--sage-text);color:var(--sage-text);background:#F4F8F2}
/* a day with an open slot: the card fills that slot, so the slot is what lights up */
.day.drop .meal.open{border-color:var(--sage-text);border-style:solid;background:#F4F8F2}
.day.drop:has(.meal.open) .addm{border-color:transparent;background:transparent}

/* meal card = a small index card (C-058 look: cream face, red line under the title, faint blue rules) */
.meal{position:relative;border-radius:4px;border:0;padding:6px 12px 8px 12px;text-align:left;display:flex;flex-direction:column;
  background:var(--icard);
  box-shadow:0 1px 2px rgba(40,26,8,.14),0 0 0 1px rgba(60,40,10,.13);transition:box-shadow .2s var(--ease),transform .2s var(--ease),opacity .2s var(--ease);cursor:grab;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.meal:hover{box-shadow:0 4px 10px rgba(40,26,8,.16),0 0 0 1px rgba(60,40,10,.16)}
.meal .mh{display:flex;align-items:center;gap:6px;height:24px;white-space:nowrap;min-width:0}
.meal .mt{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2);flex:none}
.meal .mm{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:3px;min-width:0;overflow:hidden}
.meal .mm svg{width:12px;height:12px}
.meal .mx{margin-left:auto;margin-right:-8px;width:32px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--ink2);position:relative}
.meal .mx::after{content:"";position:absolute;inset:-8px -6px}
.meal .mx:hover{box-shadow:var(--hover)}
.meal .mn{font-size:15px;font-weight:600;line-height:20px;padding:0 12px 5px;border-bottom:1.5px solid var(--ired);margin:0 -12px}
.meal .pt{font-size:13px;line-height:21px;color:var(--ink2);border-bottom:1px solid var(--iblue);margin:0 -12px;padding:0 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--icard)}
.meal .mn:last-child{padding-bottom:5px}
.meal .pend-l{color:var(--amber-text);font-weight:600}
.meal.pend::before{display:none}
.meal.nope{animation:nope .5s var(--ease);box-shadow:0 0 0 2px var(--urgent-border),0 4px 10px rgba(40,26,8,.16)}
@keyframes nope{0%,100%{transform:none}25%{transform:translateX(-4px)}60%{transform:translateX(3px)}}
.meal .addpt{display:flex;align-items:center;gap:4px;font-size:13px;line-height:21px;color:var(--muted);border-bottom:1px solid var(--iblue);margin:0 -12px;padding:0 12px;width:calc(100% + 24px);text-align:left;background:var(--icard);cursor:pointer}
.meal .addpt svg{width:13px;height:13px}
.board.busy .meal .addpt{pointer-events:none;opacity:.45}
.meal .addpt:hover,.meal .addpt:focus-visible{color:var(--sage-text)}
.meal .pt.fx{display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--ink2)}
.meal .pt.fx svg{width:12px;height:12px;flex:none}
.meal .pt.fx .dotsep{color:var(--muted);margin:0 2px}
.meal .pt:last-child{border-bottom-color:transparent}
.meal .pt i{font-style:normal;color:var(--muted);font-size:12px;font-weight:500;margin-right:4px}
.meal .prep{display:flex;align-items:center;gap:8px;font-size:13px;line-height:18px;min-height:44px;color:var(--ink);border-bottom:1px solid var(--iblue);margin:0 -12px;padding:0 12px;cursor:pointer;width:calc(100% + 24px);text-align:left;background:var(--icard)}
.meal .prep .tb{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--ink2);display:grid;place-items:center;flex:none;background:#fff;transition:background .16s var(--ease)}
.meal .prep .tb svg{width:14px;height:14px;opacity:0;color:#fff;stroke-width:3}
.meal .prep.done .tb{background:var(--sage-text);border-color:var(--sage-text)}.meal .prep.done .tb svg{opacity:1}
.meal .prep.done span{color:var(--muted);text-decoration:line-through}
.meal .prep small{color:var(--muted);font-size:12px;margin-left:auto;white-space:nowrap}
.meal .go{margin:0 -12px;padding:8px 12px 0;background:var(--icard)}
.meal .go .btn{width:auto;min-width:180px;font-size:15px}
/* leftovers: the same cream card, a green line instead of the red one, and a small green "from Wed" */
.meal.left .pt{border-bottom-color:transparent;color:var(--ink2)}
.meal.left .mn{font-weight:500;border-bottom-color:var(--sage-line)}
.meal.left .lf{display:flex;align-items:center;gap:4px;color:var(--sage-text);font-weight:600}
.meal.open,.meal.ask{min-height:86px}
.meal.open{background:transparent;box-shadow:none;border:1.5px dashed var(--folder-line);padding:5px 11px 7px;cursor:default}
.meal.open .mn{font-weight:500;color:var(--ink2);border-bottom-color:transparent}
.meal.open .fill{margin-top:auto;display:flex;gap:6px}
/* r7: the whole open slot is the button (no second "add" link beside "+ Add a Meal") */
.meal.open{cursor:pointer;transition:background .2s var(--ease),border-color .2s var(--ease)}
.meal.open:hover{background:rgba(255,255,255,.55);border-color:var(--sage-text)}
.meal.open .slotbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:calc(100% + 22px);margin:0 -11px -7px;padding:0 11px 8px;text-align:left;min-height:52px}
.meal.open .slotbtn .sb1{font-size:15px;font-weight:500;color:var(--ink2);line-height:20px}
.meal.open .slotbtn .sb2{display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:600;color:var(--sage-text);line-height:22px}
.meal.open .slotbtn .sb2 svg{width:15px;height:15px}
.ro .meal.open{cursor:default}.ro .meal.open:hover{background:transparent;border-color:var(--folder-line)}
.linkbtn{height:36px;border-radius:8px;padding:0 8px;margin-left:-8px;display:inline-flex;align-items:center;gap:6px;color:var(--sage-text);font-weight:600;font-size:14px;position:relative}
.linkbtn::after{content:"";position:absolute;inset:-4px 0}
.linkbtn:hover{background:rgba(255,255,255,.55)}
.linkbtn svg{width:16px;height:16px}
.meal.cooked .mn,.meal.skipped .mn{color:var(--ink2)}
.meal.skipped .mn{text-decoration:line-through}
.meal .st{font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:3px}
.meal.cooked .st{color:var(--sage-text)}.meal.skipped .st{color:var(--muted)}
.days .mealgrid .meal.wide{grid-column:span 2}
.meal.arrive{animation:arrive .26s var(--ease) both}
.meal.pend::before{content:"";position:absolute;top:8px;right:40px;width:8px;height:8px;border-radius:50%;background:var(--amber)}
.meal.ghost{opacity:.35}
.meal.lift{box-shadow:0 14px 28px rgba(40,26,8,.28),0 0 0 1px rgba(60,40,10,.16);transform:rotate(-1.5deg) scale(1.02)}
.meal.sel{box-shadow:0 0 0 2px var(--sage-text),0 6px 14px rgba(40,26,8,.16)}
.meal.menuon{box-shadow:0 0 0 2px var(--sage-text),0 4px 10px rgba(40,26,8,.16)}
/* remove asks first, in place, on the card itself (the live confirm landed off screen) */
.meal.ask{background:var(--urgent-bg);box-shadow:0 0 0 1.5px var(--urgent-border);cursor:default;padding:8px 12px 10px}
.meal .askq{font-size:14px;line-height:19px;color:var(--urgent-text);padding:4px 0 8px;font-weight:600}
.meal .askq small{display:block;font-weight:400;color:var(--urgent-text);font-size:13px}
.meal .askb{display:flex;gap:6px;margin-top:auto}
.meal .askb .btn{flex:1;height:36px;font-size:14px;padding:0 8px;background:var(--card);position:relative}.meal .askb .btn::after{content:"";position:absolute;inset:-4px 0}
.meal .askb .btn.danger.fill{background:var(--urgent-border)}
.meal.gone{opacity:0;transform:scale(.96)}
/* "+ Add a Meal" on every day: a quiet text button at the end of the day (a dashed box only on an empty day) */
.addm{min-height:44px;border-radius:8px;border:1.5px solid transparent;display:flex;align-items:center;justify-content:flex-start;gap:6px;color:var(--sage-text);font-size:14px;font-weight:600;padding:0 10px;align-self:start;height:44px;transition:background .2s var(--ease),border-color .2s var(--ease)}
.addm:hover{background:rgba(255,255,255,.55)}
.addm svg{width:16px;height:16px}
.mealgrid .addm:only-child{min-height:84px;border:1.5px dashed var(--folder-line);justify-content:center;color:var(--ink2)}
.ro .meal{cursor:default}
/* skeleton slot while Claude makes the week (reserved space, no pop-in) */
.slot{min-height:64px;border-radius:4px;background:linear-gradient(90deg,var(--panel-alt) 0,#F7F1E6 120px,var(--panel-alt) 240px) 0 0/600px 100%;animation:shimmer 1.6s linear infinite;box-shadow:0 0 0 1px rgba(60,40,10,.06)}

/* To Place row: the picked cards drop in above the week */
.tpwrap{display:grid;grid-template-rows:1fr;animation:growin .22s var(--ease)}
.tpwrap>div{overflow:hidden;min-height:0}
.toplace{background:var(--endpaper);border:1px solid var(--tan-line);border-radius:12px;padding:10px 12px 12px;margin-bottom:12px;
  background-image:radial-gradient(rgba(63,94,59,.16) 1px,transparent 1.4px);background-size:14px 14px}
.toplace .th2{display:flex;align-items:center;gap:8px;min-height:44px;flex-wrap:wrap}
.toplace .th2 b{font-size:15px}
.toplace .th2 small{color:var(--ink2);font-size:13px}
.toplace .th2 .sp{flex:1}
.tpcards{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 4px;scrollbar-width:thin}
.tpc{width:196px;flex:none;border-radius:4px;background:var(--icard);padding:0 10px 6px;text-align:left;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:pan-x;
  box-shadow:0 2px 5px rgba(40,26,8,.16),0 0 0 1px rgba(60,40,10,.12);animation:dropin .28s var(--ease) backwards;transition:transform .2s var(--ease),box-shadow .2s var(--ease),opacity .2s}
.tpc:nth-child(2){animation-delay:.06s}.tpc:nth-child(3){animation-delay:.12s}.tpc:nth-child(4){animation-delay:.18s}
.tpc:nth-child(odd){rotate:-.6deg}.tpc:nth-child(even){rotate:.5deg}
.tpc .h{font-size:14px;font-weight:600;height:34px;line-height:34px;display:block;border-bottom:1.5px solid var(--ired);margin:0 -10px;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* while Claude makes the week the board is locked: no menus, no pulling, one plain line says why */
.busy .meal{cursor:default}.busy .meal .mx,.busy .meal .fill{visibility:hidden}
.busynote{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 14px;margin-bottom:12px;border-radius:12px;background:var(--card);border:1px solid var(--bcard);font-size:14px;color:var(--ink2)}
.tpc .m{font-size:12px;color:var(--ink2);line-height:22px;border-bottom:1px solid var(--iblue);display:flex;gap:8px;margin:0 -10px;padding:0 10px}
.tpc .m>span{display:inline-flex;align-items:center;gap:3px}
.tpc .m svg{width:12px;height:12px}
.toplace .tpclear{color:var(--ink2);font-weight:500;margin:0}
.toplace .btn.tan svg{color:var(--sage-text)}
.tpc .grip{font-size:12px;color:var(--muted);line-height:20px;display:flex;align-items:center;gap:4px}
.tpc .grip svg{width:12px;height:12px}
.tpc.sel{transform:translateY(-6px);box-shadow:0 0 0 2px var(--sage-text),0 10px 20px rgba(40,26,8,.22)}
.tpc.ghost{opacity:.3}
.dragcard{position:fixed;z-index:80;pointer-events:none;width:196px;border-radius:4px;background:var(--icard);padding:0 10px 6px;box-shadow:0 18px 36px rgba(40,26,8,.32),0 0 0 1px rgba(60,40,10,.14);rotate:-2deg;transition:none}
.dragcard .h{font-size:14px;font-weight:600;height:34px;line-height:34px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1.5px solid var(--ired);margin:0 -10px;padding:0 10px}
.dragcard .m{font-size:12px;color:var(--ink2);line-height:22px;border-bottom:1px solid var(--iblue);margin:0 -10px;padding:0 10px}
.droptip{position:absolute;right:16px;top:12px;font-size:13px;font-weight:600;color:var(--sage-text);background:var(--card);border-radius:8px;padding:2px 8px;box-shadow:0 0 0 1px var(--sage-line)}

/* ---------- Claude's panel (360 wide beside the board; a sheet on phone and iPad upright) ---------- */
.chat{display:flex;flex-direction:column;min-height:0;overflow:hidden;background:var(--card);border:1px solid var(--bcard);border-radius:12px;box-shadow:var(--shadow-card);min-width:0;transition:opacity .2s var(--ease)}
.work.closed .chat{opacity:0;pointer-events:none;border-width:0}
.chat .ch{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 16px;border-bottom:1px solid var(--brow);min-height:52px}
.chat .ch b{font-size:15px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat .ch small{display:block;font-size:13px;color:var(--ink2);font-weight:400}
.chat .msgs{flex:1;overflow:auto;padding:14px 12px 18px 16px;display:flex;flex-direction:column;gap:12px;min-height:0}
.chat .msgs>:first-child{margin-top:auto}
.chat .qr.off{opacity:.45;pointer-events:none}
.msg{max-width:92%;font-size:15px;line-height:21px;animation:rise .2s var(--ease) both}
.msg.c{align-self:flex-start}
.msg.c .who{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--sage-text);margin-bottom:4px}
.msg.c .who svg{width:14px;height:14px}
.msg.c .bub{background:var(--panel);border:1px solid var(--bcard);border-radius:4px 12px 12px 12px;padding:10px 12px}
.msg.u{align-self:flex-end}
.msg.u .bub{background:var(--sage-light);border-radius:12px 4px 12px 12px;padding:10px 12px;color:var(--ink)}
.msg.u .who{font-size:12px;font-weight:600;color:var(--ink2);text-align:right;margin-bottom:4px}
.msg ul{margin:6px 0 0;padding-left:18px}.msg li{margin:2px 0}
.msg.fail .bub{box-shadow:0 0 0 1.5px var(--urgent-border);background:var(--card)}
.msg .fl{display:flex;align-items:center;gap:6px;color:var(--urgent-text);font-size:13px;margin-top:6px;justify-content:flex-end;flex-wrap:wrap}
.msg .working{display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:14px;margin-top:6px}
.bar8{height:6px;border-radius:3px;background:var(--track);overflow:hidden;margin-top:8px}
.bar8 i{display:block;height:100%;background:var(--sage-text);border-radius:3px;transition:width .3s var(--ease)}
.chat .qr{display:flex;flex-wrap:wrap;gap:8px;padding:0 12px 8px 16px}
.compose{display:flex;align-items:flex-end;gap:8px;padding:8px 12px 12px;border-top:1px solid var(--brow)}
.compose .fld{flex:1;min-height:48px;border:1px solid var(--ink2);border-radius:8px;background:#fff;display:flex;align-items:center;padding:0 4px 0 12px;gap:4px}
.compose .fld:focus-within{border:2px solid var(--sage-text);padding-left:11px}
.compose textarea{flex:1;border:0;outline:0;background:none;resize:none;font-size:15px;line-height:20px;padding:13px 0;height:46px;min-width:0}
.compose textarea::placeholder{color:var(--muted)}
.compose .send{height:48px}
.compose.off .fld{background:var(--panel);border-color:var(--folder-line)}
.chatdock{display:none}

/* banners (kit E1) */
.banner{display:flex;align-items:center;gap:12px;border-radius:12px;border:1px solid var(--bcard);padding:10px 12px 10px 16px;margin-bottom:12px;font-size:15px;min-height:56px;animation:rise .2s var(--ease) both}
.banner>svg{flex:none}
.banner .tx{flex:1;min-width:0}.banner .tx small{display:block;color:var(--ink2);font-size:13px}
.banner.ok{background:var(--sage-light)}.banner.ok>svg{color:var(--sage-text)}
.banner.off{background:var(--panel-alt)}.banner.off>svg{color:var(--ink2)}
.banner.err{background:var(--urgent-bg);color:var(--urgent-text);border-color:var(--urgent-border)}
.banner.info{background:var(--card)}.banner.info>svg{color:var(--sage-text)}
.banner.offer{background:var(--card);box-shadow:var(--shadow-card);flex-wrap:wrap}
.banner .acts{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- empty, start card, error ---------- */
.center{display:grid;place-items:center;padding:24px 0}
.center .empty{text-align:center;max-width:520px;padding:40px 24px}
.empty .ring{width:88px;height:88px;border-radius:50%;background:var(--card);border:1px solid var(--bcard);display:grid;place-items:center;margin:0 auto 16px;color:var(--sage-text);box-shadow:var(--shadow-card)}
.empty .ring svg{width:40px;height:40px}
.empty h2{font-size:24px;line-height:30px;margin:0 0 8px}
.empty p{color:var(--ink2);margin:0 auto 20px;max-width:440px}
.empty .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.empty .up-hint{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--ink2);font-size:15px;margin:0 auto 8px;padding:0;max-width:100%}
.empty .up-hint svg{color:var(--sage-text);width:18px;height:18px}
.startc{padding:20px 24px 24px}
.startc h2{font-size:20px;margin:0}
.startc .lead{color:var(--ink2);margin:4px 0 0}
.startc .sec{margin-top:20px}
.startc .sec>.eyebrow{display:block;margin-bottom:8px}
.when{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.when .grp{display:flex;flex-direction:column;gap:6px}
.when .grp label{font-size:13px;font-weight:500;color:var(--ink2)}
.datebox{display:flex;align-items:center;height:52px;border:1px solid var(--ink2);border-radius:8px;background:#fff;padding:0 4px;gap:2px}
.datebox b{font-size:16px;font-weight:600;padding:0 8px;min-width:118px;text-align:center}
.datebox .btn.icon{width:44px;height:44px}
.when .note{font-size:13px;color:var(--ink2);padding-bottom:0;align-self:flex-end;line-height:18px;margin-bottom:8px}
.datebox .btn.icon svg{width:20px;height:20px}
/* r7: the four (or three) ways Claude can start are real radio cards with a dot, like the approve pop-up's */
@container (min-width:781px){.startc.q3 .qp{grid-template-columns:repeat(3,minmax(0,1fr))}}
.qp .chip{flex-direction:row!important;align-items:flex-start!important;gap:10px!important}
.qp .chip .rb{width:20px;height:20px;border-radius:50%;border:2px solid var(--ink2);flex:none;margin-top:1px;display:grid;place-items:center;background:#fff}
.qp .chip.on .rb{border-color:var(--sage-text)}.qp .chip.on .rb::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--sage-text)}
.qp .chip .qt{display:flex;flex-direction:column;min-width:0}
.qp .chip.on{font-weight:600!important}
.compose .send.dim{opacity:.45}
/* saved for next plan: small cream tiles with a tick (Claude uses the ticked ones) */
.saved{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.svd{display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 12px;border-radius:4px;background:var(--icard);text-align:left;box-shadow:0 1px 3px rgba(40,26,8,.12),0 0 0 1px rgba(60,40,10,.12);transition:box-shadow .2s var(--ease)}
.svd:hover{box-shadow:0 4px 10px rgba(40,26,8,.14),0 0 0 1px rgba(60,40,10,.16)}
.svd .tb{width:22px;height:22px;border-radius:5px;border:1.5px solid var(--ink2);display:grid;place-items:center;flex:none;background:#fff;transition:background .16s var(--ease)}
.svd .tb svg{width:15px;height:15px;opacity:0;color:#fff;stroke-width:3}
.svd.on .tb{background:var(--sage-text);border-color:var(--sage-text)}.svd.on .tb svg{opacity:1}
.svd b{display:block;font-size:14px;font-weight:600;line-height:18px}
.svd small{display:block;font-size:12.5px;color:var(--ink2);line-height:17px;white-space:nowrap}
.svd .tx{min-width:0;flex:1}
.startc{container-type:inline-size}
.qp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@container (max-width:780px){.qp{grid-template-columns:1fr 1fr}}
.qp .chip{justify-content:flex-start;height:auto;min-height:64px;padding:8px 12px;flex-direction:column;align-items:flex-start;gap:0;text-align:left;font-size:15px;white-space:normal;background:var(--card);border:1px solid var(--folder-line)}
.qp .chip.on{background:var(--sage-light);border:2px solid var(--sage-text);padding:7px 11px;font-weight:700}
.qp .chip small{font-weight:400;font-size:13px;color:var(--ink2);line-height:17px}
.startc .go{display:flex;align-items:center;gap:16px;margin-top:20px;padding-top:16px;border-top:1px solid var(--brow);flex-wrap:wrap}
.startc .go .btn{min-width:200px}
.startc .talk{display:flex;align-items:flex-start;gap:10px;font-size:14px;line-height:20px;color:var(--ink2);flex:1;min-width:220px}
.startc .talk svg{flex:none;color:var(--sage-text);margin-top:1px}
.when .grp.sm .datebox b{min-width:72px}
/* Claude's empty panel before anything is asked: no AI is spent until you start */
.chatempty{margin:auto 8px;text-align:center;color:var(--ink2);font-size:14px;line-height:20px;padding:16px}
.chatempty .ring{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;margin:0 auto 10px;background:var(--panel);color:var(--sage-text)}
.chatempty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
/* "What I used" box inside Claude's first reply */
.knows{margin:8px 0 6px;border-radius:8px;background:var(--card);border:1px solid var(--bcard);padding:8px 10px}
.knows .eyebrow{font-size:11px;display:block;margin-bottom:2px}
.knows ul{margin:0;padding-left:18px;font-size:14px;line-height:20px}
.errc{max-width:520px;margin:40px auto;padding:28px 24px 24px;text-align:center}
.errc>svg{width:28px;height:28px;color:var(--urgent-text);box-sizing:content-box;padding:14px;border-radius:50%;background:var(--urgent-bg);box-shadow:0 0 0 1px var(--urgent-border)}
.errc h2{font-size:20px;margin:8px 0 4px}
.errc p{color:var(--ink2);margin:0 auto 16px;max-width:400px}

/* small index card (saved for next plan, picker, swap) */
.ic{position:relative;display:flex;flex-direction:column;width:100%;padding:0 12px 8px;text-align:left;border-radius:4px;cursor:pointer;color:var(--ink);
  background:repeating-linear-gradient(to bottom,transparent 0 23px,var(--iblue) 23px 24px) 0 72px/100% calc(100% - 80px) no-repeat,var(--icard);
  box-shadow:0 -1px 3px rgba(40,26,8,.08),0 2px 5px rgba(40,26,8,.14),0 0 0 1px rgba(60,40,10,.12);transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.ic:hover{transform:translateY(-3px);box-shadow:0 -1px 3px rgba(40,26,8,.08),0 10px 20px rgba(40,26,8,.18),0 0 0 1px rgba(60,40,10,.14)}
.ic .ich{display:flex;align-items:center;gap:8px;min-height:44px;margin:0 -12px;padding:4px 12px 0;border-bottom:1.5px solid var(--ired)}
.ic .ich b{flex:1;min-width:0;font-size:15px;font-weight:600;line-height:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic .fav{color:#B5482F;flex:none}
.ic .fav svg{width:14px;height:14px;fill:currentColor;stroke:none}
/* C-058 card anatomy: the facts line runs the full width under the red line; photo left, source and tags beside it */
.ic .im{display:flex;align-items:center;gap:4px 12px;height:26px;font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden}
.ic .im>span{display:inline-flex;align-items:center;gap:3px}
.ic .icb{display:flex;gap:12px;padding-top:2px}
.ic .ix{flex:1;min-width:0;font-size:13px;line-height:24px;color:var(--ink2)}
.ic .ix>div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic .ix .src{color:var(--muted);font-size:12.5px}
.ic .hv{font-weight:600;color:#3F6B38}.ic .hv.lo{color:#9A5B12}
.ic .rt{color:#9A6A12;font-weight:600}
.th{width:64px;height:48px;border-radius:4px;flex:none;box-shadow:inset 0 0 0 1px rgba(40,26,8,.2);margin-top:2px;
  background:radial-gradient(circle 3px at 38% 38%,#5F8F4A 0 2.5px,transparent 3px),radial-gradient(circle 3px at 60% 62%,#5F8F4A 0 2.5px,transparent 3px),
  radial-gradient(circle 22px at 50% 52%,var(--food) 0 13px,rgba(0,0,0,.16) 14px,#F4EEE3 15px 19px,#CFC2AA 20px 21px,transparent 22px),repeating-linear-gradient(45deg,#C9B79A 0 6px,#BCA684 6px 12px)}
.flg{flex:none;font-size:11px;font-weight:700;color:#8F2F1C;background:#FBE3DC;border:1px solid #E3A896;border-radius:4px;padding:0 6px;line-height:17px;white-space:nowrap}
.badge{flex:none;border-radius:5px;background:var(--sage-dark);color:#fff;font-size:12px;font-weight:700;padding:1px 8px;display:inline-flex;align-items:center;gap:3px;line-height:18px}
.badge svg{width:12px;height:12px;stroke-width:3}
.badge.on{background:var(--sage-light);color:var(--sage-text);border:1px solid var(--sage-line)}
.ic.picked{transform:translateY(-4px);box-shadow:0 0 0 2px var(--sage-dark),0 10px 20px rgba(40,26,8,.2);border-left:0}
.ic.picked::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--sage-dark);border-radius:4px 0 0 4px}
.ic.dim{opacity:.62}

/* ---------- recipe card picker: slides over the plan like the left page of the Recipe Book ---------- */
.picker{position:absolute;left:0;right:0;top:0;bottom:0;z-index:30;display:flex;flex-direction:column;
  background:radial-gradient(rgba(63,94,59,.13) 1px,transparent 1.4px) 0 0/14px 14px,var(--endpaper);
  transform:translateX(0);transition:transform .28s var(--ease);box-shadow:-12px 0 32px rgba(40,26,8,.18);border-left:1px solid var(--tan-line)}
.picker.out{transform:translateX(104%);visibility:hidden;transition:transform .28s var(--ease),visibility 0s linear .28s}
.picker>.bar{flex:none;height:46px}
.pk-scroll{flex:1;overflow:auto;min-height:0}
.pk-in{max-width:1240px;margin:0 auto;padding:12px 16px 24px}
/* the search card copies C-058 (list buttons on top, red line, search + Filters, count) */
/* r9: the search card sits in a fixed header above the scrolling cards (C-058's .head + .dscroll), so no card edges peek around it */
.pk-head{flex:none;position:relative;z-index:5}
.pk-head .pk-in{padding-bottom:0}
.pk-scroll .pk-in{padding-top:12px}
.scard{background:var(--icard);border:1px solid var(--tan-line);border-radius:8px;padding:10px 12px;box-shadow:0 2px 5px rgba(40,26,8,.08);position:relative;margin-bottom:0}
.mtabs{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:10px;border-bottom:1.5px solid var(--ired);margin:0 -12px;padding-left:12px;padding-right:12px}
.mtabs.ovf{padding-right:32px;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 32px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 32px),transparent)}
.mtabs::-webkit-scrollbar{display:none}
.mtab{border:1px solid var(--tan-line);background:#fff;border-radius:6px;padding:0 12px;height:36px;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;color:var(--ink2);white-space:nowrap;flex:none;position:relative}
.mtab::after{content:"";position:absolute;inset:-4px 0}
.mtab small{color:var(--muted);font-weight:500}
.mtab.on{background:var(--sage-dark);border-color:var(--sage-dark);color:#fff;font-weight:700}.mtab.on small{color:#D9E6D6}
.srow{display:flex;gap:8px;align-items:center;margin-top:10px}
.srch{flex:1;display:flex;align-items:center;gap:8px;border:1px solid var(--tan-line);border-radius:8px;background:#fff;padding:0 12px;height:44px;min-width:0}
.srch input{border:0;outline:0;flex:1;font-size:15px;background:none;min-width:0}
.srch svg{color:var(--muted)}
.fbtn{height:44px;border:1px solid var(--tan-line);background:#fff;border-radius:8px;padding:0 14px;display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:500;color:var(--ink)}
.fbtn .n{background:var(--sage-dark);color:#fff;border-radius:4px;font-size:12px;padding:0 5px;line-height:18px}
.cnt{font-size:13px;color:var(--muted);white-space:nowrap}
.fchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.fchip{border:1px solid var(--sage-dark);background:var(--sage-dark);color:#fff;border-radius:6px;padding:0 10px;height:30px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px 16px}
.pgrid .ic{min-height:132px}
.pk-foot{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--card);border-top:1px solid var(--tan-line);box-shadow:0 -6px 16px rgba(40,26,8,.08)}
.pk-foot .pk-in2{display:flex;align-items:center;gap:12px;max-width:1240px;width:100%;margin:0 auto}
.pk-foot .names{flex:1;min-width:0;font-size:14px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk-foot .names b{color:var(--ink)}
.fpop{position:absolute;right:12px;top:calc(100% + 6px);width:420px;max-width:calc(100% - 24px);max-height:60vh;overflow-y:auto;background:var(--icard);border:1px solid var(--tan-line);border-radius:10px;box-shadow:0 14px 34px rgba(40,26,8,.26),0 2px 6px rgba(40,26,8,.14);z-index:10;animation:pop .16s var(--ease)}
.fpop .fph{display:flex;align-items:center;gap:8px;padding:10px 6px 8px 14px;border-bottom:1.5px solid var(--ired)}
.fpop .fph b{flex:1}
.fpop .fg{padding:10px 14px 4px}
.fpop .fgh{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.fpop .fgc{display:flex;flex-wrap:wrap;gap:6px}
.fpop .fchip{background:#fff;color:var(--ink2);border-color:var(--tan-line);height:36px}
.fpop .fchip.on{background:var(--sage-dark);color:#fff;border-color:var(--sage-dark)}
.fchip{position:relative}.fchip::after{content:"";position:absolute;inset:-6px 0}
.fchip small{font-size:12px;opacity:.75}
.fchips .fchip svg{width:14px;height:14px}
.fpop .fpf{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--tan-line);margin-top:10px;background:#FBF6EA;border-radius:0 0 10px 10px}
.fpop .fpf span{flex:1;font-size:13px;color:var(--muted)}

/* ---------- swap: index cards in Claude's place ---------- */
.swap{display:flex;flex-direction:column;min-height:0;background:var(--endpaper);border:1px solid var(--tan-line);border-radius:12px;overflow:hidden;
  background-image:radial-gradient(rgba(63,94,59,.13) 1px,transparent 1.4px);background-size:14px 14px;animation:fade .2s var(--ease)}
.swap .sh{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 16px;min-height:56px;background:var(--card);border-bottom:1px solid var(--tan-line)}
.swap .sh b{flex:1;font-size:15px}.swap .sh small{display:block;font-weight:400;font-size:13px;color:var(--ink2)}
.swap .list{flex:1;overflow:auto;padding:12px 12px 16px;display:flex;flex-direction:column;gap:12px}
.swap .why{font-size:13px;color:var(--sage-text);line-height:18px;padding:4px 0 2px;border-bottom:1px solid var(--iblue)}
.swap .lab{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:4px 2px -4px}

/* ---------- popover and dialog (kit) ---------- */
.menu{position:fixed;background:var(--card);border:1px solid var(--bcard);border-radius:12px;box-shadow:var(--shadow-pop);z-index:50;min-width:240px;display:none}
.menu.open{display:block;animation:pop .2s var(--ease)}
.menu .mi{padding:8px;overflow:auto;max-height:var(--mh,70vh);border-radius:12px;background:var(--card)}
.menu .mhd{padding:6px 12px 8px;border-bottom:1px solid var(--brow);margin:0 -8px 6px}
.menu .mhd b{display:block;font-size:15px}.menu .mhd small{font-size:13px;color:var(--ink2)}
.menu button.it{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;border-radius:8px;padding:0 12px;font-size:15px;text-align:left}
.menu button.it:hover{background:var(--row-hover)}
.menu button.it svg{color:var(--ink2)}
.menu button.it.go{color:var(--sage-text);font-weight:600}
.menu button.it.go svg{color:var(--sage-text)}
.menu button.it.warn{color:var(--urgent-text)}.menu button.it.warn svg{color:var(--urgent-text)}
.menu button.it small{margin-left:auto;color:var(--muted);font-size:13px}
.menu hr{border:0;border-top:1px solid var(--brow);margin:4px 4px}
.menu .lab{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 4px 6px}
.menu .chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 4px 8px}
.menu .sugg{display:flex;flex-direction:column;gap:2px}
.menu .sugg button{display:flex;align-items:center;gap:10px;min-height:44px;border-radius:8px;padding:0 8px;text-align:left;width:100%;font-size:15px}
.menu .sugg button:hover{background:var(--row-hover)}
.menu .sugg small{color:var(--muted);font-size:13px;margin-left:auto}
.menu .mini{width:28px;height:28px;border-radius:4px;flex:none;box-shadow:inset 0 0 0 1px rgba(40,26,8,.2);background:radial-gradient(circle 12px at 50% 50%,var(--food) 0 7px,#F4EEE3 8px 10px,transparent 11px),repeating-linear-gradient(45deg,#C9B79A 0 4px,#BCA684 4px 8px)}
.scrim{position:fixed;inset:0;background:var(--scrim);display:none;place-items:center;z-index:60}
.scrim.open{display:grid;animation:fade .2s var(--ease)}
.sheet{width:480px;max-width:calc(100vw - 32px);max-height:86vh;overflow:auto;background:var(--card);border-radius:16px;box-shadow:var(--shadow-float);animation:rise .2s var(--ease);display:flex;flex-direction:column}
.sheet.sm{width:420px}.sheet.wide{width:640px}
.sheet .hd{display:flex;align-items:flex-start;gap:12px;padding:20px 12px 8px 24px}
.sheet .hd h2{margin:0;font-size:20px;font-weight:700;line-height:1.3}
.sheet .hd p{margin:4px 0 0;font-size:15px;color:var(--ink2)}
.sheet .x{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;color:var(--ink2);margin-left:auto;flex:none;margin-top:-6px}
.sheet .x:hover{box-shadow:var(--hover)}
.sheet .bd{padding:8px 24px 20px;flex:1}
.sheet .ft{display:flex;align-items:center;gap:8px;padding:12px 24px 16px;border-top:1px solid var(--brow);background:var(--card);position:sticky;bottom:0;flex-wrap:wrap}
.sheet .ft .sp{flex:1}
.sheet .ft .hint{width:100%;font-size:13px;color:var(--ink2);text-align:right}
.wsum{border:1px solid var(--bcard);border-radius:8px;background:var(--icard)}
.wsum div{display:grid;grid-template-columns:72px 1fr;gap:8px;padding:7px 12px;font-size:14px;border-top:1px solid var(--iblue)}
.wsum div:first-child{border-top:0}
.wsum span{color:var(--ink2);font-weight:600;font-size:13px}
.wsum em{font-style:normal;color:var(--muted)}
.daysfold{display:grid;grid-template-rows:0fr;transition:grid-template-rows .2s var(--ease)}
.daysfold.open{grid-template-rows:1fr}
.daysfold>div{overflow:hidden;min-height:0}
.daysfold.open>div{padding-top:6px}
[aria-expanded="true"]>svg{transform:rotate(180deg)}
.linkbtn>svg{transition:transform .2s var(--ease)}
.groc{margin-top:12px;border-radius:12px;background:var(--sage-light);padding:12px 16px;display:flex;gap:12px;align-items:flex-start}
.groc>svg{color:var(--sage-text);margin-top:2px}
.groc b{display:block;font-size:15px}
.groc small{display:block;font-size:13px;color:var(--ink2)}
.landl{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);margin:10px 0 0}
.landl svg{color:var(--sage-text)}
.swx{margin-top:12px;border:1px solid var(--bcard);border-radius:12px;background:var(--card)}
.swx .swh{padding:10px 14px 8px;border-bottom:1px solid var(--brow)}
.swx .swh b{display:block;font-size:15px}.swx .swh small{display:block;font-size:13px;color:var(--ink2)}
.swx .swr{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px;border-top:1px solid var(--brow);flex-wrap:wrap}
.swx .swr:first-of-type{border-top:0}
.swx .swt{flex:1 1 150px;min-width:0}.swx .swt b{display:block;font-size:14px}.swx .swt small{display:block;font-size:12.5px;color:var(--ink2)}
/* r9: Use It / Keep as Planned are two kit chips (gap 6, a check on the chosen one), not a made-up segmented box */
.swc{display:flex;gap:6px;flex:none}
.swc .chip svg{width:14px;height:14px;display:none}.swc .chip.on svg{display:block}
/* r9: groceries are only added by Import. One notice, one Import Groceries button; "on Groceries you'd see" picture */
.gnote{display:flex;gap:10px;align-items:flex-start;margin-top:10px;border:1px dashed var(--folder-line);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--ink2);background:var(--card)}
.gnote>svg{width:16px;height:16px;color:var(--sage-text);flex:none;margin-top:2px}
.gnote .eyebrow{display:block;margin-bottom:2px}
.banner .acts .btn,.banner>.btn{flex:none}
/* r9: servings row in each meal's ⋯ menu */
.menu .svrow{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 8px 0 12px;font-size:15px}
.menu .svrow>svg{width:20px;height:20px;color:var(--ink2)}
.menu .svrow .lbl{flex:1}
.menu .svrow .stp{display:flex;align-items:center;gap:2px;border:1px solid var(--folder-line);border-radius:8px;background:#fff;height:44px;padding:0 2px}
.menu .svrow .stp .btn.icon{width:40px;height:40px;padding:0;position:relative}.menu .svrow .stp .btn.icon::after{content:"";position:absolute;inset:-2px}
.menu .svrow .stp b{min-width:28px;text-align:center;font-size:16px}
/* r9: Claude's suggested change, inside its chat message */
.prop{margin-top:10px;border-radius:8px;background:var(--card);border:1px solid var(--bcard);padding:10px 12px}
.prop .pl{display:flex;align-items:center;gap:6px;font-weight:600;font-size:15px;flex-wrap:wrap}
.prop .pl svg{width:16px;height:16px;color:var(--sage-text)}
.prop small{display:block;font-size:13px;color:var(--ink2);margin-top:4px}
.prop .pa{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.prop.done{opacity:.7}
.unpl{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px 10px 14px;border-radius:12px;background:var(--amber-bg,#FBF1DC);border:1px solid var(--amber-line,#E2C88F);font-size:14px;flex-wrap:wrap}
.unpl>svg{color:var(--amber-text);flex:none}.unpl span{flex:1 1 220px}
.lands{margin-top:8px;background:var(--card);border-radius:8px;border:1px solid var(--bcard);font-size:13px}
.lands div{display:flex;align-items:center;gap:8px;padding:6px 10px;border-top:1px solid var(--brow)}
.lands div:first-child{border-top:0}
.lands div i{font-style:normal;color:var(--ink2);margin-left:auto;font-size:12px}
.lands .eyebrow{font-size:11px}
.radio{display:flex;gap:12px;align-items:flex-start;width:100%;border:1px solid var(--folder-line);border-radius:12px;padding:12px 14px;background:var(--card);text-align:left;margin-top:8px;transition:border-color .2s,background .2s}
.radio .rb{width:20px;height:20px;border-radius:50%;border:2px solid var(--ink2);flex:none;margin-top:1px;display:grid;place-items:center}
.radio.on{border:2px solid var(--sage-text);background:var(--sage-light);padding:11px 13px}
.radio.on .rb{border-color:var(--sage-text)}.radio.on .rb::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--sage-text)}
.radio b{display:block;font-size:15px}.radio small{display:block;font-size:13px;color:var(--ink2)}
/* kit HoldButton: 1.2 s linear fill */
.hold{position:relative;overflow:hidden;min-width:200px}
.hold .fillbar{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(250,244,235,.22);pointer-events:none}
.hold.going .fillbar{width:100%;transition:width 1.2s linear}
.hold span{position:relative}
.daysq{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:8px 0 16px}
.dsq{min-height:56px;border-radius:12px;background:var(--card);border:1px solid var(--bcard);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;color:var(--ink);line-height:16px;position:relative;transition:background .2s,border-color .2s}
.dsq b{font-size:17px;line-height:22px;font-weight:600}
.dsq.on{background:var(--sage-light);border:2px solid var(--sage-text)}
.dsq.emp{background:var(--panel)}
.chiprow{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 16px}

/* toasts (kit Toast) */
.toasts{position:fixed;right:24px;bottom:24px;display:flex;flex-direction:column-reverse;gap:8px;align-items:flex-end;z-index:70;pointer-events:none;max-width:380px}
.toast{background:var(--ink);color:var(--page);border-radius:12px;padding:6px 6px 6px 16px;min-height:48px;font-size:15px;display:flex;gap:8px;align-items:center;pointer-events:auto;animation:rise .2s var(--ease);box-shadow:var(--shadow-pop)}
.toast>span{padding:6px 0}
.toast button{color:var(--page);font-weight:500;font-size:16px;text-decoration:underline;text-underline-offset:3px;border-radius:8px;padding:0 12px;height:44px;flex:none}

/* past plans */
.pastv{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px;padding:16px;min-height:0;grid-row:2/4}
.plist{padding:8px;align-self:start}
.prow{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;border-radius:8px;padding:6px 12px;text-align:left}
.prow:hover{background:var(--row-hover)}
.prow.on{background:var(--sage-light)}
.prow b{display:block;font-size:15px;font-weight:600}.prow small{display:block;font-size:13px;color:var(--ink2)}
.prow .tag{margin-left:auto}

/* loading: the shaped empty page (C-066), then a cross-fade */

// r9: a week's groceries: none (not imported yet) · later (a reminder the day before it starts) · imported · partial (meals added after import) · failed
function weekState(w,i){
  const L='<span class="lg">Approved · </span>';
  const two=(lg,sh)=>`<span class="lgs">${lg}</span><span class="shs">${sh}</span>`;
  if(w.state==='new')return ['',two('Not started','New')];
  if(w.state==='draft'){if(S.making&&i===S.wi)return ['draft',two('Claude is making it','Making')];
    const o=openCount(w);return ['draft',two(`Draft · ${mealCount(w)} meals${o?` · ${o} open`:''}`,'Draft')]}
  if(w.groc==='imported')return ['appr',two(L+'Groceries imported','Imported')];
  if(w.groc==='partial')return ['appr',two(L+'New meals not imported','Import again')];
  if(w.groc==='failed')return ['appr',two(L+'Import didn\'t work','Import failed')];
  if(w.groc==='later')return ['appr',two(L+'Import reminder '+fmt(addD(w.start,-1)),'Remind '+fmt(addD(w.start,-1)))];
  return ['appr',two(L+'Groceries not imported','Not imported')];
}

function mealCard(m,w){
  const today=w.id==='w1'&&m.day===S.today&&w.state==='approved';
  const ro=!canEdit();
  if(S.ask===m.id){return `<div class="meal ask" data-m="${m.id}"><div class="askq">Remove ${esc(nm(m))}?<small>${w.state==='approved'?(w.groc==='imported'||w.groc==='partial'?'Its groceries come off your list.':'It comes off this plan.'):'It comes off this draft.'}</small></div>
    <div class="askb"><button class="btn cancel" data-a="keep">Keep It</button><button class="btn danger fill" data-a="doremove" data-m="${m.id}">Remove</button></div></div>`}
  if(m.open){return `<div class="meal open" data-m="${m.id}" data-day="${m.day}"><div class="mh"><span class="mt">${m.type}</span>${!ro&&!S.making?`<button class="mx" data-a="mmenu" data-m="${m.id}" aria-label="Meal menu">${ic('dots','i sm')}</button>`:''}</div>
    ${ro||S.making?`<div class="mn">Nothing here yet</div>`:`<button class="slotbtn" data-a="fill" data-m="${m.id}"><span class="sb1">Nothing here yet</span><span class="sb2">${ic('plus')}Pick ${m.type}</span></button>`}</div>`}
  const r=R[m.r], cls=['meal'];
  if(m.left)cls.push('left'); if(m.status)cls.push(m.status); if(prepShown(m,w)||today&&!m.status&&m.type==='Dinner')cls.push('wide'); if(S.arriveIds.has(m.id))cls.push('arrive'); if(m.pend)cls.push('pend');
  if(S.menuFor===m.id||S.swapFor===m.id)cls.push('menuon');
  if(S.nope===m.id)cls.push('nope');
  const cooking=S.cooking===m.id;
  const meta=cooking?`<span class="st" style="color:var(--sage-text)">${ic('flame','i sm')}Cooking now</span>`:m.pend?`<span class="mm pend-l">${ic('cloud','i sm')}Waiting</span>`:m.left?`<span class="mm lf">${ic('leftov')}from ${m.left.from}</span>`:m.status==='cooked'?`<span class="st">${ic('check','i sm')}Cooked</span>`:m.status==='skipped'?`<span class="st">Skipped</span>`:'';
  // r7: every recipe card has C-058's facts line under the red line (time · serves), so no card ends at a bare red line
  const facts=m.r?`<div class="pt fx">${ic('clock','i sm')}${mins(r.min)}<span class="dotsep">·</span>Serves ${m.sv||4}</div>`:'';
  const parts=(m.left?`<div class="pt lfn">${m.left.sv||2} servings in the fridge</div>`:facts)+(m.parts||[]).map(([role,n])=>`<div class="pt"><i>${role}</i>${esc(n)}</div>`).join('');
  const prep=prepShown(m,w)?m.prep.map((p,i)=>`<button class="prep ${p.done?'done':''}" data-a="tick" data-m="${m.id}" data-i="${i}" role="checkbox" aria-checked="${!!p.done}"><span class="tb">${ic('check')}</span><span>${esc(p.t)}</span><small>${p.w}</small></button>`).join(''):'';
  // r7: adding a side, dessert or drink lives in the meal's ⋯ menu (no "+ Add to This Meal" line on every card)
  const addpt='';
  const go=today&&!m.status&&!cooking&&m.type==='Dinner'?`<div class="go"><button class="btn pri" data-a="cook">${ic('flame','i sm')}Start Cooking</button></div>`:'';
  const name=m.left?esc(m.left.n):esc(r.n);
  return `<div class="${cls.join(' ')}" data-m="${m.id}" data-day="${m.day}" tabindex="0" aria-label="${m.type}: ${name}"><div class="mh"><span class="mt">${m.type}</span>${meta}
   ${ro&&!m.r?'':`<button class="mx" data-a="mmenu" data-m="${m.id}" aria-label="Meal menu for ${name}">${ic('dots','i sm')}</button>`}</div>
   <div class="mn">${m.left?'Leftovers · ':''}${name}</div>${parts}${addpt}${prep}${go}</div>`;
}

function chatChange(s,text,part){

  const used=new Set(w.meals.map(m=>m.r));
  const pickNew=not=>['salmon','noodle','bowls','shak','lemon'].find(k=>!used.has(k)&&k!==not);

    if(a&&b&&a.day<b.day){const d=a.day;a.day=b.day;b.day=d}

      prop:{state:'part',mid:a&&a.id,k,from:a?R[a.r].n:'',to:R[k].n,where:a?dn(a):'',okLine:b&&a?`${WD[dayDate(w,b.day).getDay()]}: Beef Stew · ${WD[dayDate(w,a.day).getDay()]}: Fish Tacos`:''}}]}

  if(!tg)return [...prev,{c:0,t:text},{c:1,t:'Tell me which day you want to change, and I\'ll suggest something.'}];
  const k=pickNew(tg.r);
  const say=fill?`Here's one for ${dn(tg)}: ${R[k].n}. It takes ${mins(R[k].min)}, and you have ${R[k].have[0]} of its ${R[k].have[1]} things.`
    :`How about ${R[k].n}? It takes ${mins(R[k].min)} (${R[tg.r].n} takes ${mins(R[tg.r].min)}), and you have ${R[k].have[0]} of its ${R[k].have[1]} things. Want me to make the change?`;
  return [...prev,{c:0,t:text},{c:1,t:say,prop:{state:'ask',mid:tg.id,k,from:tg.open?'Open':R[tg.r].n,to:R[k].n,where:dn(tg)}}];
}

/* ---------- menus ---------- */
function placeMenu(anchor,html,opt={}){
  const mn=$('#menu'),inn=$('#menuin');inn.innerHTML=html;mn.className='menu open';
  if(LAY()==='phone'){mn.classList.add('assheet');mn.style.cssText='';showScrimFor('menu');return}
  const r=anchor.getBoundingClientRect();mn.style.left='0px';mn.style.top='0px';mn.style.width=opt.w||'';mn.style.setProperty('--mh','70vh');
  // never over the tan bar: the menu stays between the tan bar's bottom edge and the screen's bottom edge
  const bar=$('#body .bar'),minTop=(bar?bar.getBoundingClientRect().bottom:96)+6,maxBot=innerHeight-8;
  let mw=mn.offsetWidth,mh=mn.offsetHeight,left,top;
  if(opt.side&&r.right+8+mw<innerWidth-8){left=r.right+8;top=r.top-8}           // meal menus open beside the ⋯ so the card stays readable
  else {left=Math.min(Math.max(8,r.right-mw),innerWidth-mw-8);top=r.bottom+6}
  if(top+mh>maxBot){const up=r.top-mh-6;
    if(!opt.side&&up>=minTop)top=up;                      // room above: open upward
    else {top=Math.max(minTop,Math.min(top,maxBot-mh));if(top+mh>maxBot){mn.style.setProperty('--mh',(maxBot-top)+'px')}}}
  mn.style.left=left+'px';mn.style.top=top+'px';
}

   case 'clearplace':S.toPlace=[];S.phonePick=null;render();break;
   case 'claudeplace':if(a.dataset.close)closeDialog();claudePlace();break;
   case 'swch':{S.swapCh=S.swapCh||{};S.swapCh[a.dataset.id]=a.dataset.v;a.parentElement.querySelectorAll('button').forEach(x=>{x.classList.toggle('on',x===a);x.setAttribute('aria-checked',x===a)});break}
   case 'pday':{const i=+a.dataset.i;if(S.phonePick){const k=S.phonePick;S.phonePick=null;placeCard(k,i);S.day=i;render();const sq=$(`.dsq[data-i="${i}"]`);if(sq)sq.classList.add('pulse')}else{S.day=i;render()}break}
   case 'week':S.wi=+a.dataset.i;S.day=S.wi===0?S.today:0;S.chat=W().state==='draft';S.justApproved=false;S.msgs=null;render();break;
   case 'addweek':closeMenu();S.offer=false;{const last=S.weeks[S.weeks.length-1];const st=last?addD(last.start,last.len):new Date(2026,10,24);S.weeks.push({id:'w'+(S.weeks.length+1),start:st,len:7,state:'new',meals:[]});S.wi=S.weeks.length-1;S.chat=true;S.msgs=null;render()}break;
   case 'mmenu':e.stopPropagation();if(S.menuFor===a.dataset.m){closeMenu();break}closeMenu();openMealMenu(a.dataset.m,a);break;
   case 'addmeal':e.stopPropagation();closeMenu();openAddMenu(+a.dataset.day,a);break;
   case 'addpart':{e.stopPropagation();const pm=w.meals.find(x=>x.id===a.dataset.m);const anc=a.closest('.menu')?$(`.meal[data-m="${pm.id}"] .mx`)||a:a;closeMenu();openPartMenu(pm,anc);break}
   case 'partpick':{const pm=w.meals.find(x=>x.id===a.dataset.m);const role=($('#aparts .chip.on')||{}).textContent||'Side';closeMenu();pm.parts=[...(pm.parts||[]),[role,a.dataset.n]];render();
     toast(`${a.dataset.n} added to ${nm(pm)}.`,'Undo',()=>{pm.parts=pm.parts.slice(0,-1);render()});break}
   case 'atype':a.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===a));break;
   case 'addpick':{const t=($('#atypes .chip.on')||{}).textContent||R[a.dataset.k].meal||'Dinner';closeMenu();const day=+a.dataset.day;
     addOne(a.dataset.k,day,t);break}
   case 'pickfor':{const pf=S.pickFor||{day:0,type:null};pf.type=($('#atypes .chip.on')||{}).textContent||pf.type;closeMenu();S.pickOne=pf;S.pickerOpen=true;render();
     const p=$('#picker');if(p){p.classList.add('out');requestAnimationFrame(()=>requestAnimationFrame(()=>p.classList.remove('out')))}break}
   case 'more':e.stopPropagation();openMore(a);break;
   case 'closemenu':closeMenu();break;
   case 'askremove':{closeMenu();S.ask=a.dataset.m;render();showInBoard($('.meal.ask'),false,true);break}
   case 'keep':S.ask=null;render();break;
   case 'doremove':{const id=a.dataset.m;const el=$(`.meal[data-m="${id}"]`);el.classList.add('gone');
     setTimeout(()=>{const m=w.meals.find(x=>x.id===id);const i=w.meals.indexOf(m);w.meals.splice(i,1);S.ask=null;render();
       toast(`${nm(m)} removed.`,'Undo',()=>{w.meals.splice(i,0,m);S.arriveIds.add(m.id);render()})},RM()?0:200);break}
   case 'swapopen':closeMenu();S.swapFor=a.dataset.m;S.chatSheet=false;render();break;
   case 'closeswap':S.swapFor=null;render();break;
   case 'doswap':{const m=w.meals.find(x=>x.id===S.swapFor);const old=m.r;m.r=a.dataset.k;m.parts=[];S.swapFor=null;S.arriveIds.add(m.id);const gm=grocAdd(w);render();
     toast(`Swapped in ${R[m.r].n}.${gm}`,'Undo',()=>{m.r=old;render()});break}
   case 'skip':{closeMenu();const m=w.meals.find(x=>x.id===a.dataset.m);m.status='skipped';render();toast(`Skipped ${R[m.r].n}.${w.groc==='imported'||w.groc==='partial'?' Its groceries come off the list.':''}`,'Undo',()=>{m.status=null;render()});break}
   case 'fill':{e.stopPropagation();const sm=w.meals.find(x=>x.id===a.dataset.m);const anc=a.closest('.menu')?$(`.meal[data-m="${sm.id}"] .mx`)||a:a;closeMenu();openAddMenu(sm.day,anc,sm.type);break}
   case 'moveopen':closeMenu();S.moveId=a.dataset.m;S.dialog='move';openDialog('move');break;
   case 'mday':{a.parentElement.querySelectorAll('.dsq').forEach(c=>c.classList.toggle('on',c===a));
     if(S.dialog==='frombook'){const fw=S.weeks[S.fbWeek??S.weeks.findIndex(x=>x.state==='draft')];const i=[...a.parentElement.children].indexOf(a);const d=dayDate(fw,i);$('#sheet [data-a="dofrombook"]').textContent=`Add to ${WD[d.getDay()]}, ${fmt(d)}`}break}
   case 'domove':{const m=w.meals.find(x=>x.id===S.moveId);const i=+a.dataset.i;const t=($('#mtypes .chip.on')||{}).textContent||m.type;const from=m.day,ft=m.type;closeDialog();
     if(S.cooking===m.id&&i!==from){refuse(m);break}
     if(i===from&&t===ft)break;
     m.day=i;m.type=t;S.arriveIds.add(m.id);if(LAY()==='phone')S.day=i;render();toast(`Moved to ${WD[dayDate(w,i).getDay()]} ${t.toLowerCase()}.`,'Undo',()=>{m.day=from;m.type=ft;if(LAY()==='phone')S.day=from;render()});break}
   case 'dofrombook':{const fi=S.fbWeek??S.weeks.findIndex(x=>x.state==='draft');const fw=S.weeks[fi];const i=[...$$('#sheet .daysq .dsq')].findIndex(x=>x.classList.contains('on'));const t=([...$$('#sheet .chiprow')].pop().querySelector('.chip.on')||{}).textContent||'Dinner';closeDialog();
     const prev=fw.meals.slice();const m=M(i,t,'tikka');fw.meals=fw.meals.filter(x=>!(x.day===i&&x.open&&x.type===t));fw.meals.push(m);S.arriveIds.add(m.id);const gm=grocAdd(fw);
     toast(`Chicken Tikka Masala is on ${isThis(fw)?'this week':'the '+fmt(fw.start)+' week'}, ${WD[dayDate(fw,i).getDay()]} ${fmt(dayDate(fw,i))}.${gm}`,'Undo',()=>{fw.meals=prev;toast('Taken back off the plan.')});break}
   case 'tick':{const m=w.meals.find(x=>x.id===a.dataset.m);const p=m.prep[+a.dataset.i];p.done=!p.done;a.classList.toggle('done',!!p.done);a.setAttribute('aria-checked',!!p.done);break}
   case 'cook':closeMenu();toast('Opening Cook for Fish Tacos.');break;
   case 'seerecipe':closeMenu();toast('Opening the recipe card.');break;
   case 'openchat':S.chat=true;render();break;
   case 'closechat':if(LAY()==='wide'){S.chat=false;render()}else{S.chatSheet=false;render()}break;
   case 'opensheet':S.chatSheet=true;render();break;
   case 'closesheet':S.chatSheet=false;render();break;
   case 'resend':S.msgFail=false;S.msgs=[...claudeMsgs(),{c:0,t:'Can we do pizza Thursday instead of leaving it open?'},{c:1,t:'Sure. I put Homemade Pizza on Thursday. It needs 2 things from the store.'}];render();break;
   case 'openlist':toast('Opening Groceries.');break;
   case 'dismissoffer':S.offer=false;render();break;
   case 'pastopen':closeMenu();S.past=true;render();break;
   case 'pastback':S.past=false;render();break;
   case 'pastsel':S.pastSel=+a.dataset.i;render();break;
   case 'copyweek':S.past=false;S.offer=false;{const last=S.weeks[S.weeks.length-1];const nw=weekNov17();nw.start=last?addD(last.start,last.len):new Date(2026,10,24);S.weeks.push(nw);S.wi=S.weeks.length-1;S.chat=true;S.msgs=[{c:1,t:`Copied Nov 17 – Nov 23 into ${range(nw)}. Change anything you like, then approve it.`}];render()}break;
   case 'retry':S.errLoad=false;S.chat=true;render();break;
   case 'discard':closeMenu();toast('Draft discarded.','Undo');break;
  }
});
document.addEventListener('input',e=>{if(e.target.id==='ta'){const s=e.target.closest('.chat')?.querySelector('.send');if(s&&!S.offline)s.classList.toggle('dim',!e.target.value.trim())}});
document.addEventListener('keydown',e=>{if(e.target.id==='ta'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();e.target.closest('.chat')?.querySelector('.send')?.click()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMenu();if(S.dialog)closeDialog();if(S.pickerOpen){$('[data-a="closepicker"]')?.click()}}});
$('#scrim').addEventListener('click',e=>{if(e.target.id==='scrim')closeDialog()});
function makeWeek(q){
  const w=W();if(w.state==='new'){const fresh=weekThis();fresh.start=w.start;fresh.id=w.id;fresh.len=w.len;fresh.meals=fresh.meals.filter(m=>m.day<w.len);S.weeks[S.wi]=fresh}
  S.making=true;S.arrived=0;S.ask0=q;S.msgs=null;S.st='making';render();
  const tick=()=>{S.arrived++;const all=W().meals;const m=all[S.arrived-1];if(m)S.arriveIds.add(m.id);
    if(S.arrived>=all.length){S.making=false;S.msgs=null;S.ask0=null;S.st='draft';render();return}
    render();setTimeout(tick,RM()?60:380)};
  setTimeout(tick,500);
}

/* ---------- mockup state bar ---------- */
function mockbar(){
  const mb=$('#mock');
  mb.innerHTML=`<span>Mockup only:</span>${STATES.map(([id,l])=>`<button class="${S.st===id?'on':''}" data-s="${id}">${l}</button>`).join('')}<button data-more="1" class="${MORE.some(m=>m[0]===S.st)?'on':''}">${MORE.some(m=>m[0]===S.st)?MORE.find(m=>m[0]===S.st)[1]:'More'} ▾</button>`;
  mb.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.more){const mm=$('#mockmore');mm.classList.toggle('open');const r=b.getBoundingClientRect();mm.style.left=Math.min(r.left,innerWidth-300)+'px';mm.style.top=(r.bottom+4)+'px';
     mm.innerHTML=MORE.map(([id,l])=>`<button data-s="${id}" class="${S.st===id?'on':''}">${l}</button>`).join('');return}
    go(b.dataset.s)};
  $('#mockmore').onclick=e=>{const b=e.target.closest('button');if(b){$('#mockmore').classList.remove('open');go(b.dataset.s)}};
}
function go(id){closeMenu();closeDialog();$$('.dragcard').forEach(e=>e.remove());S=scenario(id);history.replaceState(null,'',location.pathname+'?'+new URLSearchParams({...Object.fromEntries(Q),state:id}));
  render();if(id==='loading'&&!Q.get('hold'))setTimeout(()=>{if(S.st==='loading'){S=scenario('draft');S.st='draft';render();$('.work')?.classList.add('fadein')}},1800)}
let lastLay=LAY();addEventListener('resize',()=>{if(LAY()!==lastLay){lastLay=LAY();render()}else markOverflow()});
go(Q.get('state')||'draft');
</script>
