<title>Prep + Leftovers Desktop</title>
<script>
/* Prep + Leftovers mockup (T-2161). Round 19+: redrawn on Tyler's 2026-11-27 answers. NOT agreed: Tyler has not agreed this mockup.
   Full-screen mode for the review links: window.SC_FULL = desktop | ipad | phone, or ?full=ipad by hand. No bezel.

if(window.FULL)document.documentElement.classList.add('full','full-'+window.FULL);
</script>

<style>
/* Frame, tokens and kit parts copied from Kitchen v3 (T-2154, itself from Groceries v3): header 50, rail 219, tan bar
   46, kit Button / Chip / TagChip / Popover / Dialog / Toast / Stepper / FolderDrawer look D. The index card (cream

:root{--soon-edge:#E5D3AE;--soon-line:rgba(126,92,34,.16);--soon-hover:rgba(255,255,255,.45);--guest:#6B675C;--bar-lift:rgba(45,33,22,.22);--drawer-lift:rgba(0,0,0,.14);
  --page:#EDE5D8; --card:#FAF6EE; --card-hover:#FFFCF5; --panel:#F6F2E9; --panel-alt:#F1E8DA; --alert:#F8F0E0;
  --header:#6B3E14; --subbar:#E4D3B3; --hdr-text:#FAF4EB; --subbar-date:#5C3D0A; --subbar-2:#7A5030;
  --ink:#1E1E1C; --ink2:#54524A; --muted:#605E55;
  --sage:#8FAF8A; --sage-dark:#1F3A1C; --sage-light:#E4EDE2; --sage-text:#4B6947; --sage-hover:#82A37C;
  --amber:#C8943A; --amber-light:#F5ECD8; --amber-text:#7E5C22; --amber-dark:#5C3D0A;
  --urgent-bg:#F5E4E4; --urgent-text:#5C1A1A; --urgent-border:#8E3131;
  --chip:#E4D9C6; --chip-on:#B7D0B0; --chip-warm:#EFE4CC; --chip-warm-edge:#988048;
  --row-hover:#F0EEE3; --track:#DDD5C5;

  --shadow-pop:0 4px 14px rgba(45,33,22,.16); --shadow-float:0 16px 48px rgba(45,33,22,.2);

  --icard:#FFFDF7;--ired:rgba(196,72,60,.55);--ired2:rgba(196,72,60,.42);--iblue:rgba(80,120,170,.16);--r:28px;
  --ishadow:0 1px 2px rgba(40,26,8,.10),0 4px 12px rgba(40,26,8,.09),0 0 0 1px rgba(60,40,10,.12);

*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--page)}
body{color:var(--ink);font:400 15px/1.45 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden;font-variant-numeric:tabular-nums;text-wrap:pretty}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input{font:inherit;color:inherit}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:16px;height:16px}
:focus-visible{outline:2px solid var(--sage-text);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.2s!important;animation-name:fade!important;transition-duration:.01s!important}.btn:active,.chip:active{transform:none!important}.skel{animation:none!important;background:var(--track)!important}.pane.page.slide{animation:fade .2s!important}}
/* ONE themed scroll bar for every scroller (DESIGN 4.10) */
.scroll,.side,.sheet .bd,.menu .mi,.mockmore{scrollbar-width:thin;scrollbar-color:rgb(var(--c-muted) / .35) transparent}
.scroll::-webkit-scrollbar,.side::-webkit-scrollbar,.sheet .bd::-webkit-scrollbar,.menu .mi::-webkit-scrollbar{width:12px;height:12px}
.scroll::-webkit-scrollbar-thumb,.side::-webkit-scrollbar-thumb,.sheet .bd::-webkit-scrollbar-thumb,.menu .mi::-webkit-scrollbar-thumb{background:rgb(var(--c-muted) / .35);border:3px solid transparent;background-clip:padding-box;border-radius:999px}
.scroll::-webkit-scrollbar-track,.side::-webkit-scrollbar-track{background:transparent}

.top::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--wood-sheen-top),var(--wood-sheen-bottom));pointer-events:none}
.wordmark{font-style:italic;font-weight:600;font-size:22px;position:relative}
.top .sp{flex:1}
.av{display:inline-grid;place-items:center;border-radius:50%;font-weight:600;color:var(--hdr-text);flex:none}
.av.hdr{width:28px;height:28px;font-size:12px;background:var(--member-1);box-shadow:0 0 0 2px var(--hdr-text);position:relative}
.av.m0{background:var(--guest)}.av.m4{background:var(--member-4)}
.rail{background:var(--card);border-right:1px solid var(--bcard);padding:12px 8px;display:flex;flex-direction:column;gap:4px;min-height:0}
.rail .cap{height:44px;border-radius:8px;background:var(--sage);color:var(--ink);display:flex;align-items:center;gap:8px;padding:0 12px;font-weight:500;font-size:16px;margin-bottom:8px}
.rail .cap:hover{box-shadow:var(--hover)}
.rail .ri{display:flex;align-items:center;gap:12px;height:44px;border-radius:8px;padding:0 12px;color:var(--ink2);font-weight:500;font-size:16px;text-align:left;flex:none}
.rail .ri svg.i,.rail svg.ni{width:24px;height:24px;flex:none}
svg.ni{display:block;overflow:visible}
.rail .ri:hover{box-shadow:var(--hover)}
.rail .ri.on{background:var(--sage-light);color:var(--sage-text)}
.rail hr{border:0;border-top:1px solid var(--bcard);margin:4px 8px}
.rail .grow{flex:1}
.body{display:grid;grid-template-rows:46px 1fr auto;min-height:0;min-width:0;position:relative}
.bar{background:var(--subbar);border-bottom:1px solid var(--brow);position:relative;display:flex;z-index:5}
.bar .in{display:flex;align-items:center;gap:12px;width:100%;max-width:1212px;margin:0 auto;padding:0 16px;min-width:0}
.bar .ttl{font-weight:600;font-size:16px;color:var(--subbar-date);white-space:nowrap;overflow:hidden;text-overflow:clip;min-width:0}
.bar .meta{font-size:13px;color:var(--subbar-2);padding-left:12px;border-left:1px solid var(--chip-warm-edge);display:flex;align-items:center;gap:8px;white-space:nowrap}
.bar .meta .updm{margin-left:-8px}
/* round 37: the separator kit part (rule E2). 1 px, one letter tall, light grey; the tan bar's own line colour there */
.sep{display:inline-block;width:1px;height:.95em;background:rgb(var(--c-muted) / .42);margin:0 8px;vertical-align:-.14em;position:relative;flex:none}
.bar .sep{background:var(--chip-warm-edge);opacity:.7}
.sep .vh,.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.gh .sep{height:.85em;vertical-align:-.1em}
/* round 37: room under the list while a toast sits at its foot */
@media (min-width:1101px){.tup .wrap>.lst{padding-bottom:96px}}
.bar .sp{flex:1}
.bar .crumb{font-weight:600;font-size:16px;color:var(--subbar-2);border-radius:8px;padding:0 4px;margin:0 -4px;height:36px;display:inline-flex;align-items:center;white-space:nowrap;position:relative}.bar .crumb::after{content:"";position:absolute;inset:-4px 0}
.bar .crumb:hover{box-shadow:var(--hover);color:var(--subbar-date)}
.bar .sepc{color:var(--subbar-2);flex:none}
/* round 37 (STANDARDS "Back in the tan bar is '< Page name'", agreed 16:59; C-091 r4): one text button, arrow + where it goes */
.bar .bk{position:relative;display:inline-flex;align-items:center;gap:2px;height:32px;padding:0 8px 0 6px;margin-left:-10px;border-radius:8px;color:var(--subbar-2);font-weight:500;font-size:16px;white-space:nowrap;flex:0 1 auto;min-width:0;transition:transform .16s var(--ease),box-shadow .2s var(--ease)}
.bar .bk::after{content:"";position:absolute;inset:-6px 0}
.bar .bk svg.i{transition:transform .2s var(--ease)}
.bar .bk .w{overflow:hidden;min-width:0;white-space:nowrap}
.bar .bk:hover{background:rgba(75,105,71,.12);color:var(--subbar-date)}.bar .bk:hover svg.i{transform:translateX(-2px)}
.bar .bk:active{transform:scale(.97);box-shadow:var(--press)}
.touch .bar .bk:hover svg.i{transform:none}
.bar .bk+.itn .sepc{width:14px;height:14px;opacity:.6;margin:0 -4px}
.bar .itemw .itn{gap:8px}.bar .itemw .itn .ttl{font-size:16px;font-weight:600;color:var(--subbar-date)}
.back{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--subbar-date);margin-left:-8px;position:relative;flex:none}
.back:hover{box-shadow:var(--hover)}.back::after{content:"";position:absolute;inset:-4px}
.bar .slot{display:flex;align-items:center;gap:8px}
.bar .back.word{width:auto;padding:0 10px 0 4px;gap:4px;display:inline-flex;align-items:center;font-weight:600;font-size:15px;color:var(--subbar-date);margin-left:-8px}

/* kit Button: 44 tall, four tiers, press = shrink .97 + 16% overlay */
.btn{height:44px;border-radius:8px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:500;font-size:16px;white-space:nowrap;transition:transform .16s var(--ease),box-shadow .2s var(--ease),opacity .2s var(--ease);position:relative;flex:none}
.btn:active{transform:scale(.97);box-shadow:var(--press)}
.btn.pri{background:var(--sage-dark);color:var(--hdr-text)}.btn.pri:hover{box-shadow:inset 0 0 0 100px var(--on-dark-hover)}.btn.pri:active{box-shadow:inset 0 0 0 100px var(--on-dark-press)}
.btn.sec{background:var(--sage);color:var(--ink)}.btn.sec:hover{box-shadow:var(--hover)}
.btn.cancel{background:transparent;border:1px solid var(--ink2);color:var(--ink)}.btn.cancel:hover{box-shadow:var(--hover)}
.btn.tan{background:var(--chip-warm);border:1px solid var(--chip-warm-edge);color:var(--ink)}.btn.tan:hover{box-shadow:var(--hover)}
.btn.wide{width:100%}
.btn.sm{padding:0 12px;font-size:15px}
.bar .btn{height:36px;padding:0 14px;font-size:15px}.bar .btn::after{content:"";position:absolute;inset:-4px 0}
.btn.icon{width:44px;padding:0;background:transparent;color:var(--ink2)}.btn.icon:hover{box-shadow:var(--hover)}
.bar .btn.icon{width:36px;color:var(--subbar-date)}.bar .btn.icon::after{inset:-4px}
.btn.icon[aria-expanded=true]{box-shadow:var(--press)}
.btn.off{opacity:.45;filter:grayscale(1);cursor:default}.btn.off:active,.btn.off:hover{transform:none;box-shadow:none}
.btn[aria-expanded=true].tan{border-color:var(--amber-dark);box-shadow:inset 0 0 0 1px var(--amber-dark)}
.scroll{overflow:auto;min-height:0;overscroll-behavior:contain}
.card{background:var(--card);border-radius:12px;border:1px solid var(--bcard);box-shadow:var(--shadow-card)}
.eyebrow{font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
/* kit Chip (radius 8, never pills) and TagChip */
.chip{height:44px;border-radius:8px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:15px;color:var(--ink);background:var(--chip);border:1px solid transparent;font-weight:600;white-space:nowrap;transition:transform .16s var(--ease),background .2s var(--ease)}
.chip:hover{box-shadow:var(--hover)}.chip:active{transform:scale(.97);box-shadow:var(--press)}
.chip.on{background:var(--chip-on);border-color:var(--sage-text);font-weight:700}
.chip.cmp{padding:0 12px;font-size:13px}
.chip small{font-weight:500;color:var(--ink2);font-size:13px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.tag{font-size:13px;font-weight:600;color:var(--ink);background:var(--chip);border-radius:8px;padding:0 8px;white-space:nowrap;display:inline-block;line-height:22px}
.tag.ahead{background:var(--sage-light);color:var(--sage-text)}
.tag.plan{background:var(--panel-alt);border:1px solid var(--folder-line);color:var(--ink2);line-height:20px;padding:0 7px}
/* C-080 Coming Later tag, exactly (12 px floor, as C-080's #dev .cl) */
.cl{margin-left:auto;font-size:12px;font-weight:600;color:#6B5B40;border:1px dashed #B89F72;border-radius:6px;padding:1px 8px;line-height:17px;white-space:nowrap;background:#FBF6EC}
.menu button.later{color:#9A9184;cursor:default}.menu button.later:hover{background:none}.menu button.later svg{color:#9A9184}

/* folder drawer (kit FolderDrawer look D) */
.drawer{position:relative;padding:0 12px 12px 0}
.ftabs{display:flex;align-items:flex-end;height:44px;padding:0 24px;position:relative;z-index:2}
.ftab{position:relative;height:44px;flex:none;display:block;font-size:15px;font-weight:600;color:var(--folder-ink);line-height:38px;padding-top:6px;text-align:center;white-space:nowrap}
.ftab svg{position:absolute;left:-4px;top:0;overflow:visible;pointer-events:none}
.ftab span{position:relative}
.ftab .n{font-size:13px;font-weight:500;opacity:.8;margin-left:6px}
.ftab.on{color:var(--sage-text)}
.ftab.fmor{margin-left:-8px}.ftab.fmor>span{display:inline-grid;place-items:center;height:38px;vertical-align:top}.ftab.fmor svg.i{position:static;color:var(--folder-ink)}
.ftab:not(.on):hover svg path:first-child{filter:brightness(.96)}
.ftab:focus-visible{outline-offset:-4px;border-radius:8px}
.fcard{position:relative;z-index:1}
.fcard .sh{position:absolute;inset:0;border-radius:12px;border:1px solid var(--folder-line);pointer-events:none}
.fcard .sh2{transform:translate(12px,12px);background:var(--sheet2)}
.fcard .sh1{transform:translate(6px,6px);background:var(--sheet1)}
.fcard>.card{position:relative;border-color:var(--folder-line);overflow:clip}

/* ---------- page layout (Kitchen v3: the list, and a side pane on wide screens) ---------- */
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px 24px;padding:24px 16px 96px;max-width:1212px;margin:0 auto;align-items:start}
@media (max-width:1320px){.wrap{grid-template-columns:minmax(0,1fr) 352px}}
@media (max-width:1240px){.wrap{grid-template-columns:minmax(0,1fr) 372px;gap:16px;padding:20px 12px 96px}}
.wrap>.banner{grid-column:1/-1;margin:0}
.wrap.one{grid-template-columns:minmax(0,760px);justify-content:center}
.lst{min-width:0}
.lhead{display:flex;align-items:center;gap:12px;padding:10px 16px 10px 20px;border-bottom:1px solid var(--brow);font-size:15px;color:var(--ink2);min-height:64px;line-height:1.3}
.lhead b{color:var(--ink);font-weight:600}
.lhead .sp{flex:1}
.lhead .sum{min-width:0;flex:1}
.lhead .updw{color:var(--muted);font-size:13px}
.lrow .sub .seg{white-space:nowrap}
.lhead .sum small{display:flex;align-items:flex-start;gap:6px;font-size:13px;color:var(--muted);margin-top:2px;line-height:20px}
.lhead .sum small svg{width:16px;height:16px;color:var(--muted);flex:none;margin-top:2px}
.lhead .sum small.fresh{color:var(--ink2);font-weight:400}.lhead .sum small.fresh b{color:var(--sage-text);font-weight:600}
.lhead .sum small.fresh svg{color:var(--sage-text)}
.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.side{position:sticky;top:24px;max-height:calc(100dvh - 136px);overflow:auto;overscroll-behavior:contain;padding:2px 8px 8px;margin:-2px -8px 0;display:flex;flex-direction:column;gap:16px}
.side>*{flex:none}
@media (max-width:1240px){.side{top:20px;max-height:calc(100dvh - 132px)}}
/* round 4 (panel 1 visual 4, fit 4): Kitchen v3's side-pane foot fade when more is below, so nothing reads as sliced */
/* round 22 (panel 7, all five): Kitchen v3's whole-line cutoff: fadeCut() moves --fz up to the top of the first line or
   button that would cross the foot, so the fade only ever runs over clear card, never a ghost of a word */
.side.moreb{--fz:linear-gradient(#000 calc(100% - 62px),rgba(0,0,0,.35) calc(100% - 50px),transparent calc(100% - 36px));-webkit-mask-image:var(--fz);mask-image:var(--fz)} /* round 26: no 12 px unfaded column (it drew a pale upright line; this page has no left scroll bar) */
.side .pane .hd.stuck{box-shadow:0 1px 0 var(--bcard);border-radius:0}
/* round 25 (panel 8, all five: a flat block, a pale upright line and lost corners at the pane's foot): the open
   leftover is one rounded card (.sbox) that ends with its own corners; the scroll and its whole-line fade sit inside
   it, so the fade runs into the card's cream, never onto the page. A done/Undo card may sit above it (.scol) */
.scol{position:sticky;top:24px;max-height:calc(100dvh - 136px);display:flex;flex-direction:column;gap:16px;min-height:0;align-self:start}
.scol>.aft{flex:none}
.sbox{flex:0 1 auto;min-height:0;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--bcard);border-radius:12px;box-shadow:var(--shadow-card);overflow:hidden}
.sbox>.side{position:static;max-height:none;flex:0 1 auto;min-height:0;padding:0;margin:0;gap:0}
.sbox>.side.moreb{-webkit-mask-image:var(--fz);mask-image:var(--fz)}
.sbox .pane.ixc{border:0;box-shadow:none;border-radius:0;background:transparent}
@media (max-width:1240px){.scol{top:20px;max-height:calc(100dvh - 132px)}}
/* notices (kit notice: tinted card, plain icon, close X; no edge stripes) */
.banner{border-radius:12px;padding:4px 4px 4px 16px;margin-bottom:16px;display:flex;gap:12px;align-items:center;font-size:15px;min-height:52px;box-shadow:var(--shadow-card);border:1px solid var(--bcard);flex-wrap:wrap}
.banner>svg.i{flex:none}
.banner .tx{flex:1;min-width:220px;padding:8px 0}.banner b{font-weight:600}
.banner .sub{display:block;font-size:13px;margin-top:2px;color:var(--ink2)}
.banner .acts{display:flex;gap:8px;flex:none;align-items:center;flex-wrap:wrap;margin-left:auto}
.banner.ok{background:var(--sage-light)}.banner.ok>svg{color:var(--sage-text)}
.banner.off,.banner.ro,.banner.gst{background:var(--panel-alt)}.banner.off>svg,.banner.ro>svg,.banner.gst>svg{color:var(--ink2)}
.lst>.banner{margin-right:12px}
.lfoot{padding:16px 20px;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.lfoot svg{flex:none;margin-top:1px;width:16px;height:16px}

/* ---------- the index card (C-058): cream, red head line, blue rule every 28 px; words sit on the rules ---------- */
.ixc{background:var(--icard);border-radius:4px;box-shadow:var(--ishadow);position:relative}
.ixc .ih{display:flex;align-items:flex-end;gap:12px;min-height:48px;padding:8px 12px 6px 20px;border-bottom:2px solid var(--ired2);background:linear-gradient(to bottom,rgba(255,255,255,.7),rgba(255,255,255,0) 40px)}
.ixc .ih h3{margin:0;font-size:18px;font-weight:600;line-height:28px;flex:none}
.ixc .ih .dt{font-size:13px;color:var(--muted);line-height:28px;white-space:nowrap}
.ixc .ih .sp{flex:1}
.ixc .ih .cnt{font-size:13px;color:var(--ink2);line-height:28px;white-space:nowrap}
.ixc .ih .cnt.alldone{color:var(--sage-text);font-weight:600;display:inline-flex;align-items:center;gap:4px}
/* round 25-26 (panel 8 visual 3, fit 4, ease 7): the blue rule sits at 25 px of each 28 px line, under the tails of g, p
   and y (16 px text ends at about 24.4), so no rule crosses a word or a tick box */
.ruled{background:repeating-linear-gradient(to bottom,transparent 0 25px,var(--iblue) 25px 26.2px,transparent 26.2px 28px);line-height:28px}
.ixc .ib{padding:0 12px 10px 8px;--pl:8px;--pr:12px}
/* round 17 (panel 5 visual 2): half a rule of air under the red line before the first task; the blue rules move down
   with it, so every word still sits on a rule */
.ixc:not(.lday) .ih+.ib.ruled{margin-top:14px}
.stack{display:flex;flex-direction:column;gap:20px;padding:20px 20px 24px}

/* a prep task: one ruled line for what to do, then by when, for which meal, and how to keep it */
/* round 4 (panel 1 visual 2): the task is one grid. Row 1: the tick, the task, its ⋯. Rows 2+ (by when, for which
   meal, how to keep it, the tick note) run under the ⋯ column too, so the phone gets the width back. Every line is
   28 px, wrapped lines too, so each word sits on a blue rule */
.task{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;column-gap:8px;align-items:start;position:relative;border-radius:4px;transition:background .2s var(--ease)}
.task+.task{margin-top:28px}
.task .tm{display:contents}
.task .tick{grid-column:1;grid-row:1;align-self:start;width:44px;height:44px;margin:-9px 0 -7px;display:grid;place-items:center;border-radius:8px;position:relative}
.task .tick:hover .bx{border-color:var(--ink2)}
/* the checkbox is C-084's (5 px corners, white, sage-text when ticked; never the dark main-button green) */
.bx{width:22px;height:22px;border-radius:5px;border:1.5px solid #A79F8E;background:#fff;display:grid;place-items:center;transition:background .16s var(--ease),border-color .16s var(--ease)}
.bx svg{width:16px;height:16px;stroke:#fff;stroke-width:2.6;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .22s var(--ease)}
.task.done .bx{background:var(--sage-text);border-color:var(--sage-text)}
.task.done .bx svg{stroke-dashoffset:0}
.task.locked .bx{opacity:.45;background:var(--track);border-color:var(--muted)}
.task .tt{grid-column:2;grid-row:1;min-width:0;font-size:16px;font-weight:500;color:var(--ink);line-height:28px;display:flex;flex-wrap:wrap;align-items:flex-start;column-gap:8px}
.task .tt .w{min-width:0}
/* round 7 (panel 2 fit 7c, visual 6): a tag that wraps starts at the text's edge, and its row is still a whole 28 px rule */
.task .tt .tag{display:block;line-height:20px;height:20px;margin:4px 0;font-size:13px}
/* round 11 (my weakest of round 10): a line that has to wrap splits into even halves, never a short tail on its own
   ("Marinate the chicken / in yogurt and spices", "Keep it in a sealed tub / in the fridge, up to 3 days") */
.task .tt .w,.task .tw .ln,.task .tsay>span,.dnote li>span,.hrow .m,.pline>div,.outl .why{text-wrap:balance}
@media (max-width:640px){.task .tt .w,.task .tw .ln,.task .tsay>span,.hrow .m,.pline>div{text-wrap:pretty}}
.task.done .tt .w{text-decoration:line-through;text-decoration-color:rgba(30,30,28,.45);text-decoration-thickness:1.5px;color:var(--ink2)}
.task .tw{grid-column:2/4;grid-row:2;min-width:0;font-size:14px;color:var(--ink2);line-height:28px}
.task .tw .by{font-weight:400;color:var(--ink)}
.task .tw .by.due{color:var(--amber-text);font-weight:600}
/* round 29 (panel 9 visual 3): the task's name leads; its by-when, meal and keep lines are plain and smaller */
.task:not(.mini) .tt .w{font-weight:600}
.task .tw .mlab{display:flex;align-items:center;gap:6px;color:var(--amber-text);font-weight:600;white-space:nowrap}.task .tw .mlab svg{color:var(--amber-text)}
.task .tw .ln .by.miss{font-weight:400;color:var(--ink)}
.task .tw .ln.ndl{color:var(--ink2)}
.task .tw .ln{display:block}
.task .tw .ln.keep{color:var(--ink2)}
.task .tw .ln>svg.i.sm{vertical-align:-3px}
.task .tw .by.donew{color:var(--sage-text)}

/* round 7-8: "For which meal" stays whole: when it can't share the by-when line, it goes down as one piece and drops
   its leading dot (every width; iPad sideways split "For Tue Dinner: / Chicken Tikka Masala") */
.task .tw .fl{display:inline-block;max-width:100%}.task .tw .fl.wr{display:block}.task .tw .fl.wr>.sep:first-child{display:none}
.task .tw .kp{color:var(--ink2)}
.task .tw .kp svg{width:16px;height:16px;vertical-align:-3px;margin-right:6px;color:var(--muted)}
/* round 11: a wrapped keep line's second line starts under its words, not under its fridge mark */
.task .tw .ln.keep:has(>svg){padding-left:22px;text-indent:-22px}
.task .tw .ln.mf{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 4px}.task .tw .ln.mf small{font-size:13px;color:var(--muted);line-height:20px}
.task .tw .moved{color:var(--sage-text);font-weight:600}
.task .tw .one{color:var(--ink2);font-weight:500}.task .tw .one svg{color:var(--muted);vertical-align:-3px}
/* the tick note: on its own solid sage strip (fit 6c), the check beside its first line (visual 2), and its button a
   full 44 (fit 2c). Its height is whole rules: lines of 28, a button row of 56 */
.task .tsay{grid-column:2/4;grid-row:3;display:grid;grid-template-columns:20px minmax(0,1fr);column-gap:6px;align-items:start;margin:4px 0 12px -8px;padding:10px 12px 10px 8px;border-radius:8px;background:var(--sage-light);font-size:14px;line-height:20px;font-weight:400;color:var(--ink);animation:fade .24s var(--ease);scroll-margin:72px 0 96px}
.ixc .ib.ruled .plain{position:relative;z-index:0}
.ixc .ib.ruled .plain::before{content:"";position:absolute;z-index:-2;top:calc(-1 * var(--pt));bottom:calc(-1 * var(--pb));left:calc(-1 * var(--pl));right:calc(-1 * var(--pr));background:var(--icard)}
.task .tsay.plain{background:none}.task .tsay.plain::after{content:"";position:absolute;z-index:-1;inset:0;border-radius:8px;background:var(--sage-light)}
.task .tsay>svg{width:20px;height:20px;margin-top:0;color:var(--sage-text)}.task .tsay b{font-weight:600;color:var(--sage-text)}
.task .tsay .sbtn{grid-column:2;display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:8px 0 0}
.task .tsay .btn{height:44px;font-size:15px;padding:0 14px;margin:0}
.task .kebab{grid-column:3;grid-row:1;align-self:start;width:44px;height:44px;margin:-9px 0 -7px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.task .kebab:hover,.task .kebab[aria-expanded=true]{box-shadow:var(--hover);color:var(--ink)}
.task.flash{animation:flash 2.4s var(--ease)}
@keyframes flash{0%,40%{background:var(--sage-light)}100%{background:transparent}}
/* a done task in the Done fold: one ruled line (B1, panel majority): the task struck, then who did it and when */
.task.mini .tt{line-height:28px}
.task.mini .tt .dw{font-size:14px;font-weight:500;color:var(--sage-text)}
/* the Done fold at the foot of a day card: chevron first (Groceries' .fold), quiet, a full 48 tall */
.dfold{display:flex;align-items:center;gap:8px;width:100%;min-height:48px;padding:0 12px 0 14px;border-top:1px solid rgba(80,120,170,.22);font-size:15px;font-weight:500;color:var(--ink2);text-align:left;border-radius:0 0 4px 4px}
.dfold:hover{box-shadow:var(--hover)}
.dfold .chev{color:var(--muted);transition:transform .2s var(--ease)}
.dfold[aria-expanded=true] .chev{transform:rotate(90deg)}
.dfold .ok{color:var(--sage-text)}
.dfold small{font-size:13px;color:var(--muted);margin-left:4px;min-width:0}
.ixc .ib.dbox{padding-top:0;padding-bottom:12px}
/* round 7 (panel 2 visual 7): the card's last blue rule is the fold's top line, so there is no double line above it */
.ixc .ib:has(+.dfold){padding-bottom:0}
.dfold.latf{flex-wrap:wrap;row-gap:0;padding-top:8px;padding-bottom:8px}.dfold.latf small{flex-basis:100%;margin:0 0 0 24px;line-height:18px;text-wrap:pretty;font-weight:400;color:var(--muted)}.ixc .ib+.dfold{border-top:0}.ixc .ib:has(.tsay)+.dfold{border-top:0}
/* round 8 (B18): a folded later day on the phone: the card's head is its button (chevron first), and one ruled line
   names its first task */
/* round 10 (panel 3 visual 2): a folded day's name sits down on its red line like Today's (bottom-aligned); only the
   chevron is nudged up to the middle of the name's line */
.ixc .ih.ihb{width:100%;text-align:left;align-items:flex-end;padding-left:10px;gap:8px;border-radius:4px 4px 0 0}
.ixc .ih.ihb:hover,.ixc.lday:has(.peek:hover) .ih.ihb{box-shadow:var(--hover)}
.ixc .ih.ihb .chev{color:var(--muted);transition:transform .2s var(--ease);flex:none;margin-bottom:6px}
/* round 10 (panel 3 ease 3, friction 3): the whole folded card opens it, its first-task line too */
.ixc.lday .ib[data-a]{cursor:pointer}.ixc.lday .ib[data-a]:hover{box-shadow:var(--hover)}
.ixc.lday .peek .alld{color:var(--sage-text);font-weight:600}
.ixc.lday .peek .moved{color:var(--sage-text);font-weight:600}
.ixc .ih.ihb[aria-expanded=true] .chev{transform:rotate(90deg)}
.ixc .ih.ihb .dt{margin-left:4px}
.ixc.lday .ib{padding:0 12px 6px 36px}
.ixc.lday .peek{display:block;font-size:14px;color:var(--ink2);line-height:28px}
.ixc.lday .peek .pm{color:var(--muted)}
.ixc.shut .ih{border-bottom-color:transparent}
.ixc.shut .dfold{border-top:2px solid var(--ired2)}
.hidl{display:flex;align-items:center;gap:8px;width:100%;min-height:52px;padding:0 20px;border-top:1px solid var(--brow);font-size:15px;color:var(--ink2);text-align:left}
.hidl:hover{box-shadow:var(--hover)}
.hidl .chev{color:var(--muted);transition:transform .2s var(--ease)}
.hidl[aria-expanded=true] .chev{transform:rotate(90deg)}
/* under 1100 px: the Start by strip at the top of the list (B7, panel majority): one line, tap to see each meal */
.sbstrip{border-bottom:1px solid var(--brow)}
.sbstrip>button{display:flex;align-items:center;gap:8px;width:100%;min-height:52px;padding:8px 16px 8px 14px;text-align:left;font-size:14px;color:var(--ink2);line-height:20px}
.sbstrip>button:hover{box-shadow:var(--hover)}
.sbstrip .chev{color:var(--muted);transition:transform .2s var(--ease);flex:none}
.sbstrip>button[aria-expanded=true] .chev{transform:rotate(90deg)}
.sbstrip .lab{font-weight:600;color:var(--ink);flex:none}
.sbstrip .sum{min-width:0}
.sbstrip .sum b{font-weight:600;color:var(--ink);white-space:nowrap}
.sbstrip .sum b.moved{color:var(--sage-text)}
.sbstrip .sum span{white-space:nowrap}
.sbstrip .rows{padding:0 16px 8px 20px}
.lhead .hidb{flex:none}

.sbstrip .sum .sbmore{color:var(--ink2);font-weight:600;white-space:nowrap}
.pane .lede .md{white-space:nowrap}
/* round 7 (panel 2 fit 2, visual 7): done rows in the fold keep a blank rule between them, like open tasks, so their
   44 px ticks and ⋯ buttons never overlap */
.bar .itn{display:inline-flex;align-items:center;gap:12px;min-width:0}.bar .itn .ttl{min-width:0}
.hidbox{padding:0 20px 12px}
/* round 10 (panel 3 visual 4): a wrapped hidden task keeps air above and below its divider */
.hrow{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 0;border-top:1px solid var(--brow);font-size:15px;color:var(--ink2)}
.hrow:first-child{border-top:0}
.hrow .m{flex:1;min-width:0}.hrow .m small{display:block;font-size:13px;color:var(--muted)}
.hrow .m small.hwho{display:flex;align-items:center;gap:6px;margin-top:2px}.hrow .m small.hwho svg{flex:none}

/* side pane: Start by this week */
.rcard{padding:16px 20px 12px}
.rcard .eyebrow{margin:0 0 4px}
.sbrow{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 8px;margin:0 -8px;border-top:1px solid var(--brow);border-radius:8px;transition:background .2s var(--ease)}
.sbrow:first-of-type{border-top:0}
.sbrow .m{flex:1;min-width:0}
.sbrow .m b{display:block;font-size:15px;font-weight:600}
.sbrow .m small{display:block;font-size:13px;color:var(--muted)}
.sbrow .t{text-align:right;white-space:nowrap}
.sbrow .t b{display:block;font-size:17px;font-weight:600}
.sbrow .t small{display:block;font-size:13px;color:var(--ink2)}
.sbrow.flash{animation:flash 2.4s var(--ease)}
.sbrow .t .moved{color:var(--sage-text)}
.rcard .sbwhy{margin:0 0 6px;font-size:13px;color:var(--ink2);line-height:18px}
.same{display:flex;gap:12px;align-items:flex-start;font-size:14px;color:var(--ink2);padding:16px 20px}
.same svg{flex:none;margin-top:1px;color:var(--sage-text)}
.same b{color:var(--ink);font-weight:600;display:block;font-size:15px;margin-bottom:2px}
.same.q1{padding:12px 20px;font-size:13px;color:var(--muted)}.same.q1 svg{width:16px;height:16px;margin-top:2px;color:var(--muted)}

/* ---------- Leftovers: a box of tub cards ---------- */
.soon{background:var(--amber-light);border-bottom:1px solid var(--soon-edge)}
.gh{display:flex;align-items:center;gap:8px;min-height:44px;padding:12px 16px 4px 20px;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.gh .hint{text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink2);margin-left:auto}
.soon .gh{color:var(--amber-dark)}
.soon .gh svg{color:var(--amber-text)}
.grp+.grp{border-top:1px solid var(--brow)}
.tubs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;padding:8px 20px 20px}
.tub{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;width:100%;text-align:left;background:var(--icard);border-radius:4px;box-shadow:var(--ishadow);transition:transform .16s var(--ease),box-shadow .2s var(--ease);position:relative}
.tub:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(40,26,8,.12),0 10px 20px rgba(40,26,8,.12),0 0 0 1px rgba(60,40,10,.14)}
.tub:active{transform:none;box-shadow:var(--ishadow),var(--press)}
.tub .th{display:flex;align-items:center;gap:8px;min-height:48px;padding:8px 12px 4px 16px;border-bottom:2px solid var(--ired2);background:linear-gradient(to bottom,rgba(255,255,255,.7),rgba(255,255,255,0) 40px)}
.tub .th b{font-size:16px;font-weight:600;flex:1;min-width:0;line-height:22px;white-space:nowrap;overflow:hidden;text-overflow:clip}
/* round 4 (visual 7): the short tag sits in the card head beside the name, so every card is three rules and no tag sits on the bottom rule */
.tub .th .tag{flex:none;font-size:12px;line-height:20px}
.tub .th .tag.plan{line-height:18px}
.tub .th .go{color:var(--muted);flex:none}
.tub .tb{display:block;flex:1;padding:0 12px 8px 16px}
.tub .th{flex:none}
.tub .tl{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:clip;height:28px;line-height:28px}
.tub .tl svg{width:16px;height:16px;color:var(--muted);flex:none}
.tub .tl .w{overflow:hidden;text-overflow:clip}
.tub .tl b{font-weight:600;color:var(--ink)}
.tub .when{font-weight:600;color:var(--ink)}
.tub .when.s1{color:var(--amber-text)}.tub .when.s0{color:var(--urgent-text)}
.tub .tl.tg{gap:6px;flex-wrap:wrap;white-space:normal;padding:0;height:auto}
.tub .tl.tg .tag{line-height:22px}
/* picked: C-058 CH-11 and DESIGN 2.2.3, a 1 px sage-text edge and a sage-text name on a sage-light head */
.tub.picked{box-shadow:0 0 0 1px var(--sage-text),var(--ishadow)}
.tub.picked .th{background:var(--sage-light);border-radius:4px 4px 0 0}
.tub.picked .th b{color:var(--sage-text)}
/* the open tub shows beside the list above 1100 px, so the card has no ">" there (Kitchen v3) */
@media (min-width:1101px){.tub .th .go{display:none}}
.tub.new{animation:tubin .3s var(--ease)}
@keyframes tubin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.nomatch{padding:24px 20px;text-align:center;color:var(--ink2);font-size:15px}.nomatch b{display:block;color:var(--ink);font-weight:600;margin-bottom:4px}
/* round 16 (panel 5 fit 1; B29): Kitchen v3's Leftovers page is the base: one card of plain rows (name and where /
   when made on the left, servings and use-by on the right). This page keeps its extras inside that look: the folder
   tabs, the Eat Soon band, the Made Ahead and Planned tags. The card is index-card paper: the head sits on the red
   line and every row ends on a faint blue rule */
.fcard>.card.lcard{background:var(--icard)}
.lcard>.lhead{border-bottom:2px solid var(--ired2)}
.lrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:64px;padding:8px 16px 8px 20px;border-bottom:1px solid rgba(80,120,170,.22);position:relative;transition:background .2s var(--ease)}
.lrow:last-child{border-bottom:0}
.lrow:hover{background:var(--row-hover)}.lrow:active{box-shadow:var(--press)}
.lrow.picked{background:var(--sage-light)}
.lrow.picked .nm>span{color:var(--sage-text)}
.lrow .m{flex:1;min-width:0}
.lrow .nm{font-size:16px;font-weight:500;display:flex;align-items:center;gap:8px;flex-wrap:wrap;line-height:22px}
.lrow .sub{display:block;font-size:13px;color:var(--muted);margin-top:2px;line-height:18px}
.lrow .r{text-align:right;flex:none;max-width:45%;display:flex;flex-direction:column;align-items:flex-end}
.lrow .amt{font-size:13px;font-weight:400;color:var(--muted);white-space:nowrap;margin-top:2px}
.lrow .st{font-size:15px;font-weight:600;white-space:nowrap;color:var(--ink)}

/* facts: each row ends on a faint blue index-card rule (Kitchen v3's fact rows, in the card's ink) */

   ink: only the box edge and pencil go (panel 4 visual 3, fit 3, ease 2, friction 3) */

   left edge, Tossed It sits straight under the fact buttons */

/* round 6 (panel 1 visual 3): on the iPad item page the two close-out buttons are the fact buttons' width, on the right */

button.fact{width:100%;text-align:left;border-radius:8px 8px 0 0;padding:8px 8px;margin:0 -8px;width:calc(100% + 16px);border-bottom:0;background:linear-gradient(rgba(80,120,170,.22),rgba(80,120,170,.22)) no-repeat 8px 100%/calc(100% - 16px) 1px}

.pline{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:20px;padding:12px;border-radius:8px;margin:12px 0 4px}

.side .mvc{grid-template-columns:1fr}
.pick{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;border-radius:12px;padding:10px 12px;background:var(--card);border:1px solid var(--folder-line);text-align:left;transition:transform .16s var(--ease),background .2s var(--ease)}
.pick:hover{box-shadow:var(--hover)}.pick:active{transform:scale(.99);box-shadow:var(--press)}
.pick svg.i{color:var(--ink2)}
.pick b{display:block;font-size:15px;font-weight:600}.pick small{display:block;font-size:13px;color:var(--ink2)}
.pick.here{background:var(--panel-alt);cursor:default}.pick.here:hover,.pick.here:active{box-shadow:none;transform:none}
.pick.on{background:var(--sage-light);border-color:var(--sage-text)}
.dnote{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.dnote li{display:grid;grid-template-columns:18px 1fr;gap:8px;align-items:start;font-size:13px;color:var(--ink2);line-height:1.4}
.dnote li svg{width:16px;height:16px;margin-top:1px}
.dnote li b{color:var(--ink);font-weight:600}
/* kit Stepper exactly */
.stepw{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.step{display:inline-flex;align-items:stretch;outline:1px solid var(--folder-line);outline-offset:-1px;border-radius:8px;overflow:hidden;background:var(--card);height:44px;flex:none}
.step button{width:44px;height:44px;display:grid;place-items:center;color:var(--muted)}
.step button:hover{box-shadow:var(--hover);color:var(--ink)}.step button:active{box-shadow:var(--press);color:var(--ink)}
.step button.off{opacity:.45;cursor:default}.step button.off:hover{box-shadow:none}
.step input{width:56px;text-align:center;font-weight:500;font-size:16px;border:0;border-left:1px solid var(--brow);border-right:1px solid var(--brow);background:var(--card);outline:none}
.stepw .unit{font-size:15px;color:var(--ink2)}
.stepw .adnb{margin-left:auto}
.nrrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin-top:-6px}.nrrow:empty{display:none}.form>.nrrow{grid-column:2}
@media (max-width:640px){.form>.nrrow{grid-column:auto}}
.lnk{font-size:13px;font-weight:600;color:var(--ink2);text-decoration:underline;text-underline-offset:3px;min-height:32px;padding:0 4px;border-radius:6px;margin-left:2px}.lnk:hover{box-shadow:var(--hover)}
.field{display:flex;align-items:center;gap:8px;height:52px;border:1px solid var(--ink2);border-radius:8px;background:var(--card);padding:0 16px}
.field:focus-within{border:2px solid var(--sage-text);padding:0 15px}
.field input{flex:1;min-width:0;border:0;outline:none;background:none;font-size:16px}
.field input::placeholder{color:var(--muted)}
.more{border-top:1px solid var(--brow);margin-top:0}
.more summary{list-style:none;cursor:pointer;min-height:56px;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:500;color:var(--ink2);border-radius:8px;padding:0 8px;margin:0 -8px}
.more summary::-webkit-details-marker{display:none}
.more summary:hover{box-shadow:var(--hover)}
.more summary .chev{transition:transform .2s var(--ease);color:var(--muted)}
.more[open] summary .chev{transform:rotate(90deg)}
.how{font-size:14px;line-height:1.45;color:var(--ink2);padding:0 8px 16px 28px}
.how p{margin:0 0 8px}
.how b{color:var(--ink);font-weight:600}
.how .g{color:var(--amber-text);font-weight:600}
.ro{font-size:13px;color:var(--ink2);display:flex;gap:8px;align-items:center;min-height:56px;line-height:20px}
.ro svg{flex:none;color:var(--muted)}
/* the calm side card when no tub is open */
.big{font-size:22px;font-weight:600;line-height:1.25;margin:2px 0 8px}
.kv{display:flex;align-items:center;justify-content:space-between;width:calc(100% + 16px);margin:0 -8px;min-height:52px;padding:6px 8px;border-radius:8px;font-size:15px;text-align:left;gap:12px;border-top:1px solid var(--brow)}
.kv:first-of-type{border-top:0}
button.kv:hover{box-shadow:var(--hover)}button.kv:active{box-shadow:var(--press)}
.kv .v{color:var(--ink2);display:inline-flex;align-items:center;gap:4px;white-space:nowrap;font-size:14px}
.kv .v.s0{color:var(--urgent-text);font-weight:600}.kv .v.s1{color:var(--amber-text);font-weight:600}
.kv small{display:block;font-size:13px;color:var(--muted)}
/* after Tossed It: the one optional follow-up (why), Kitchen v3's .aft card word for word in its layout: what happened
   and its Undo share the top row, the question is the quiet line under it, then three reasons on one row */
.aft{border-radius:12px;background:var(--card);border:1px solid var(--bcard);box-shadow:var(--shadow-card);padding:4px 4px 10px 16px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.aft .tp{display:flex;gap:12px;align-items:flex-start;min-height:44px}
.aft .tp>svg.i{color:var(--ink2);margin-top:12px}
.aft .tp .tx{flex:1;min-width:0;padding:11px 0;text-wrap:balance}.aft b{font-weight:600}
.aft .subq{margin:-8px 48px 0 32px;min-height:20px}
.aft .sub{font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.aft .sub.saved{color:var(--sage-text);font-weight:600;align-items:flex-start}.aft .sub.saved svg{margin-top:2px;flex:none}
.aft .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:6px 12px 0 32px}
.aft .chip.cmp{padding:0 10px;font-size:14px}
.aft .chip.cmp.on{font-weight:inherit;text-shadow:.35px 0 0 currentColor,-.35px 0 0 currentColor}
.aft .x{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;color:var(--ink2);flex:none}
.aft .x:hover{box-shadow:var(--hover)}
.aft.mini{padding-bottom:4px}.aft.mini .subq,.aft.mini .acts{display:none}
.aft.dnote2{padding-bottom:4px}.aft.dnote2 .tp>svg.i{color:var(--sage-text)}.aft.dnote2 .tx b{color:var(--sage-text)}
/* round 34 (audit F1; LVK rule 5): Kitchen v3's Undo, word for word: underlined, 44 px, no fill */
.undol{height:44px;padding:0 16px 0 12px;white-space:nowrap;border-radius:8px;font-size:16px;font-weight:500;color:var(--ink);text-decoration:underline;text-underline-offset:3px;flex:none;position:relative;margin-left:auto}
.undol:hover{box-shadow:var(--hover)}
.bbar{background:var(--card);border-top:1px solid var(--bcard);padding:8px 12px;min-width:0}
.bbar.aftbar{position:absolute;left:0;right:0;bottom:0;background:none;border:0;box-shadow:none;padding:10px 12px 12px;pointer-events:none}.bbar.aftbar>*{pointer-events:auto}.bbar.aftbar .aft{box-shadow:var(--shadow-pop)}
/* narrow item page: the big name scrolls with the page; once it is under the tan bar, the bar shows it (Kitchen v3) */
.bar .itn{transition:opacity .2s var(--ease);opacity:0}.bar.named .itn{opacity:1}
.body>.scroll{-webkit-mask-image:linear-gradient(transparent,#000 12px);mask-image:linear-gradient(transparent,#000 12px)}
.body:has(.pane.page)>.scroll{-webkit-mask-image:linear-gradient(transparent,#000 12px);mask-image:linear-gradient(transparent,#000 12px)}
.bbar .aft{max-width:760px;margin:0 auto}
/* round 17 (panel 5 ease 6, visual 7): on a computer the Tossed It card sits where every toast shows, so Undo is always
   in one place; it is wide enough for "Tossed the chicken soup." on one line, with the reasons under it */
.aftfloat{position:fixed;right:24px;bottom:24px;width:400px;z-index:59;animation:rise .2s var(--ease)}
.aftfloat .aft{box-shadow:var(--shadow-pop)}
/* empty and loading */
.empty{padding:40px 32px;text-align:center}
.empty svg.ni{width:120px;height:120px;margin:0 auto 12px}
.empty h2{margin:0 0 8px;font-size:30px;font-weight:600;line-height:1.2}
/* empty pages are a blank index card: the title sits on the red line */
.empty.ixc{border-radius:6px;padding:0;overflow:hidden}
/* round 4 (fit 6b, visual 8): a real blank index card: the name above a red rule that runs edge to edge, then the
   words and the button on the blue rules */
.empty .eh{padding:32px 24px 10px;border-bottom:2px solid var(--ired2);background:linear-gradient(to bottom,rgba(255,255,255,.7),rgba(255,255,255,0) 60px)}
.empty .eh h2{margin:0}
.empty .eb{padding:14px 24px 28px;background-position:0 14px}
.empty .eb p{line-height:28px;margin:0 auto 28px;max-width:460px;color:var(--ink2)}
.empty .eb .acts{min-height:56px;align-items:center}
/* round 7 (panel 2 fit 7d): the main button sits on plain paper, not across the blue rules (C-084) */
.empty .eb .acts{background:var(--icard);margin:0 -24px -28px;padding:6px 24px 24px}
.empty p{color:var(--ink2);margin:0 auto 24px;max-width:440px}
.empty .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.skel{display:block;height:12px;border-radius:4px;background:linear-gradient(90deg,var(--track) 0%,var(--panel) 50%,var(--track) 100%);background-size:200% 100%;animation:shim 1.4s infinite linear}
@keyframes shim{to{background-position:-200% 0}}
/* the loading shape is a task's shape: three 28 px ruled lines and a blank rule between tasks (visual 8) */
.sktask{display:grid;grid-template-columns:44px minmax(0,1fr);column-gap:8px}
.sktask+.sktask{margin-top:28px}
.sktask .bx{background:var(--track);border-color:transparent;margin:3px auto 0}
.sktask .m{display:flex;flex-direction:column}
.sktask .m .skl{height:28px;display:flex;align-items:center}
.sktask .m .skl .skel{height:11px;margin-top:-4px}
.fadein{animation:fade .24s var(--ease)}

/* kit Popover and Dialog */
.menu{position:fixed;background:var(--card);border:1px solid var(--bcard);border-radius:12px;box-shadow:var(--shadow-pop);z-index:50;min-width:260px;max-width:calc(100vw - 16px);display:none}
.menu.open{display:block;animation:pop .2s var(--ease)}
.menu .caret{position:absolute;width:12px;height:12px;background:var(--card);transform:rotate(45deg);top:-7px;left:var(--cx,20px);border:1px solid var(--bcard);border-right:0;border-bottom:0}
.menu.up .caret{top:auto;bottom:-7px;transform:rotate(225deg)}
.menu .mi{padding:12px;overflow:auto;max-height:70vh;position:relative;border-radius:12px;background:var(--card)}
.menu button{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;border-radius:8px;padding:0 12px;font-size:15px;text-align:left}
.menu button:hover{background:var(--row-hover)}.menu button:focus{outline:none}
.menu button:focus-visible{outline:2px solid var(--sage-text);outline-offset:2px;background:var(--row-hover)}
.menu button svg{color:var(--ink2)}
.menu button .ml{display:flex;flex-direction:column;line-height:1.3;padding:6px 0}
.menu button .ml small{font-size:13px;color:var(--muted)}
.menu button.off{opacity:.45;cursor:default}.menu button.off:hover{background:none}
.menu hr{border:0;border-top:1px solid var(--brow);margin:4px 8px}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
.scrim{position:fixed;inset:0;background:var(--scrim);display:none;place-items:center;z-index:40}
.scrim.open{display:grid;animation:fade .2s var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:520px;max-width:calc(100vw - 32px);max-height:86vh;background:var(--card);border-radius:16px;box-shadow:var(--shadow-float);animation:rise .2s var(--ease);display:flex;flex-direction:column;overflow:hidden}
.sheet:focus{outline:none}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.sheet .hd{display:flex;align-items:flex-start;gap:12px;padding:20px 12px 8px 24px}
.sheet .hd h2{margin:0;font-size:20px;font-weight:700;line-height:1.3}
.sheet .hd p{margin:4px 0 0;font-size:15px;color:var(--ink2)}
.sheet .x{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;color:var(--ink2);margin-left:auto;flex:none;margin-top:-6px}
.sheet .x:hover{box-shadow:var(--hover)}
.sheet .bd{padding:8px 24px 16px;flex:1;overflow:auto;min-height:0}
.sheet .ft{display:flex;align-items:center;gap:8px;padding:12px 24px;border-top:1px solid var(--brow)}
.sheet .ft .sp{flex:1}
.form{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px 16px;align-items:center}
.form>.lab,.mrow>.lab{font-size:13px;color:var(--ink2);font-weight:500}
/* round 13: Made and its label are one row (the calendar's bright part), on the form's own two columns */
.form>.mrow{grid-column:1/-1;display:grid;grid-template-columns:subgrid;column-gap:16px;row-gap:6px;align-items:center;margin:-8px;padding:8px;border-radius:12px}
.outl{grid-column:1/-1;border-radius:8px;background:var(--panel);border:1px solid var(--folder-line);padding:12px 16px;font-size:14px;color:var(--ink2);line-height:1.45}
.outl b{color:var(--ink);font-size:16px;font-weight:600;display:block}
.outl .g{color:var(--amber-text);font-weight:600}
.outl .r{color:var(--sage-text);font-weight:600}
/* kit Toast */
.toasts{position:fixed;right:24px;bottom:24px;display:flex;flex-direction:column-reverse;gap:8px;align-items:flex-end;z-index:60;pointer-events:none;max-width:400px}
.toast{background:var(--ink);color:var(--page);border-radius:12px;padding:6px 6px 6px 16px;min-height:48px;font-size:15px;display:flex;gap:8px;align-items:center;pointer-events:auto;animation:rise .2s var(--ease);box-shadow:var(--shadow-pop)}
.toast>span{padding:6px 0}
.toast button{color:var(--page);font-weight:500;font-size:16px;text-decoration:underline;text-underline-offset:3px;border-radius:8px;padding:0 12px;height:44px;flex:none}
.toast button:hover{box-shadow:inset 0 0 0 100px var(--on-dark-hover)}

/* mockup-only state bar (not part of the app) */
.mock{position:fixed;left:50%;transform:translateX(-50%);top:9px;z-index:70;background:var(--ink);color:var(--page);border-radius:12px;padding:3px;display:flex;gap:2px;align-items:center;font-size:12px;box-shadow:var(--shadow-pop);white-space:nowrap;max-width:calc(100vw - 440px)}
.mock span{padding:0 8px;opacity:.7}
.mock span.cur{opacity:1;font-weight:600;overflow:hidden;text-overflow:clip;max-width:260px}
.mock button{height:26px;padding:0 8px;border-radius:8px;color:var(--page);white-space:nowrap;flex:none}
.mock button.on,.mock button:hover{background:rgba(250,244,235,.16)}
.mockmore{position:fixed;z-index:71;background:var(--ink);border-radius:12px;padding:6px;display:none;flex-direction:column;gap:2px;max-height:72vh;overflow:auto;box-shadow:var(--shadow-pop);min-width:240px}
.mockmore.open{display:flex}
.mockmore b{color:var(--page);opacity:.6;font-size:12px;padding:6px 10px 2px;font-weight:600}
.mockmore button{min-height:30px;padding:0 10px;border-radius:8px;color:var(--page);text-align:left;font-size:12px;white-space:nowrap}
.mockmore button.on{background:var(--page);color:var(--ink);font-weight:600}
.mockmore button:hover:not(.on){background:rgba(250,244,235,.12)}
/* full mode: the one "States" button sits in the wood header, left of the avatar, so it never covers the page */
html.full .mock{left:auto;right:56px;top:11px;bottom:auto;transform:none;padding:2px;opacity:.9;max-width:none}
html.full .mock button{height:24px}
html.full .mock>*:not(.stbtn){display:none}

/* ---------- narrower screens ---------- */
.tabbar{display:none}
.drawerm{display:none}
@media (max-width:1100px){
  .app{grid-template-columns:64px 1fr}
  .rail{padding:12px 0;align-items:center;gap:4px}
  .rail .cap,.rail .ri{font-size:0;gap:0;justify-content:center;padding:0;width:44px;height:44px}
  .rail .cap{margin-bottom:8px}
  .rail hr{margin:4px 0;width:44px}
  .wrap{grid-template-columns:minmax(0,1fr);gap:16px}
  .wrap>.side,.wrap>.scol{display:none}
  .gh .hint{margin-right:24px}
  /* DESIGN 3.1.4: one column on iPad upright and the phone (panel 1 fit 7) */
  .tubs{grid-template-columns:minmax(0,1fr)}
  html:not(.full) .mock{top:0;left:0;right:0;transform:none;border-radius:0;max-width:none;padding:4px 8px;height:40px;box-shadow:none}
  html:not(.full) .mock button{height:32px}

  .body:has(>.bbar.nofloat)>.scroll{--fz:linear-gradient(#000 calc(100% - 54px),rgba(0,0,0,.35) calc(100% - 44px),transparent calc(100% - 30px));-webkit-mask-image:var(--fz);mask-image:var(--fz)}
  .wrap.one.item{grid-template-columns:minmax(0,600px)}

}

  .tabbar .tb.on>span{background:var(--sage-light);color:var(--sage-text)}
  .tabbar .tb svg.i,.tabbar .tb svg.ni{width:24px;height:24px}

  .tabbar .capc{width:60px;height:60px;border-radius:50%;background:var(--sage);color:var(--ink);display:grid;place-items:center;margin-top:-18px;box-shadow:var(--shadow-card)}
  .tabbar .capc svg.ni{width:32px;height:32px}
  .bar .in{padding:0 8px 0 12px;gap:8px}.bar .meta{padding-left:8px}.bar.lb .meta{display:none}
  .lrow{padding-left:16px;padding-right:8px}
  .wrap{padding:12px 6px 96px}
  /* round 7 (panel 2 visual 7): the two sheets behind the card step 4 and 8 px, so the folder sits centred */
  .drawer{padding:0 8px 8px 0}.ftabs{padding:0 8px}
  .fcard .sh2{transform:translate(8px,8px)}.fcard .sh1{transform:translate(4px,4px)}
  .lhead{padding-left:16px;padding-right:16px}
  /* round 7 (panel 2 friction 7): the tan bar already says "9 to do this week", so the phone list head is the one
     quiet updated line */
  .lhead.ph{min-height:48px;padding-top:6px;padding-bottom:6px}.lhead.ph .sum small{margin-top:0}
  /* round 10 (panel 3 friction 6): with See What Moved or "2 Hidden", the updated line has the whole width and the
     buttons sit on the row under it */
  .lhead.ph:has(.hidb){flex-wrap:wrap;row-gap:6px;column-gap:8px;padding-bottom:10px}.lhead.ph:has(.hidb) .sum{flex-basis:100%}
  .lst>.banner{margin-right:8px}
  .stack{padding:12px 8px 16px;gap:16px}
  .ixc .ih{padding-left:16px}
  .ixc .ib{padding:0 4px 10px 0;--pl:0px;--pr:4px}
  .ixc .ib.dbox{padding-bottom:10px}
  .task{column-gap:4px}
  .task.mini .tt .dw{flex-basis:100%}
  .dfold{padding-left:10px}
  .sbstrip>button{padding-left:12px;padding-right:12px}.sbstrip .rows{padding:0 12px 8px 16px}
  .task .tw{font-size:13px}
  .task .tw .fl{display:block}.task .tw .fl>.sep:first-child{display:none}
  .tubs{grid-template-columns:minmax(0,1fr);padding:8px 12px 16px;gap:12px}
  .gh{padding-left:16px;padding-right:12px}.gh .hint{margin-right:20px}.lhead .find.wide{display:none}
  .banner{padding:8px 8px 8px 16px}.banner .acts{width:100%;margin-left:0}.banner .acts .btn{flex:1 1 auto}
  .banner{flex-wrap:nowrap}.banner .acts:has(>.btn.icon:only-child){width:auto;margin-left:auto}.banner .acts .btn.icon{flex:none}
  .ipanel .acts{flex-direction:column-reverse;align-items:stretch}.ipanel .acts .btn{width:100%}
  .mvc{grid-template-columns:1fr}
  .fact>.btn{width:128px;padding:0 8px}
  .closeout{grid-template-columns:128px 128px;justify-content:end}
  .pane .pb{padding:0 16px 28px}
  .pane .hd{padding-left:16px}
  .sheet{width:100vw;max-width:100vw;border-radius:16px 16px 0 0;max-height:90dvh}
  .sheet:has([data-a="addsave"]){max-height:calc(100dvh - 48px)}
  .scrim{place-items:end center}
  .sheet::before{content:"";display:block;width:40px;height:4px;border-radius:8px;background:var(--ink);opacity:.35;margin:8px auto 0;flex:none}
  .sheet .hd{padding:12px 8px 8px 16px}.sheet .bd{padding:8px 16px 16px}.sheet .ft{padding:12px 16px calc(16px + env(safe-area-inset-bottom));flex-direction:column-reverse;align-items:stretch}.sheet .ft .sp{display:none}
  .form{grid-template-columns:minmax(0,1fr);gap:6px}
  .form>.lab,.mrow>.lab{margin-top:4px}
  /* round 32 (panel 10 fit 6): Add Leftover over Cancel, as every phone panel and sheet */
  .toasts{left:8px;right:8px;bottom:84px;max-width:none;align-items:stretch}
  .empty{padding:32px 16px}.empty h2{font-size:26px}.empty .acts .btn{flex:1 1 100%}

/* ================= THE DATE PICKER (B4), the ONE shared part =================

/* the three colours this part adds to the kit's tokens (BRIEF "For the app build") */
:root{--dp-off:#8C897F;--dp-strike:rgba(84,82,74,.6);--dp-dim:rgba(45,33,22,.12)}

.dgrp{display:flex;align-items:stretch;width:100%;max-width:308px;height:52px;border:1px solid var(--ink2);border-radius:8px;background:var(--card);position:relative;transition:box-shadow .2s var(--ease),border-color .2s var(--ease)}

.dgrp.dp-bad,.dgrp.dp-bad:has(input:focus){border-color:var(--urgent-text);box-shadow:0 0 0 1px var(--urgent-text)}
.dgrp:has(input:focus) .dpbtn{border-left-color:var(--sage-text)}.dgrp.dp-bad .dpbtn,.dgrp.dp-bad:has(input:focus) .dpbtn{border-left-color:var(--urgent-text)}
.dgrp .dfield{display:flex;align-items:center;flex:1;min-width:0;height:auto;max-width:none;border:0;border-radius:7px 0 0 7px;padding:0 14px;gap:0;background:none;transition:background .2s var(--ease)}

.dgrp .dfield input::placeholder{color:var(--muted)}

.dev-ipad .dgrp .dfield input{font-size:17px}
.dpbtn{flex:none;display:flex;align-items:center;gap:6px;padding:0 14px 0 12px;border-left:1px solid var(--ink2);border-radius:0 7px 7px 0;background:var(--chip-warm);color:var(--subbar-date);font-size:15px;font-weight:600;position:relative;transition:background .2s var(--ease),color .2s var(--ease),border-color .2s var(--ease)}
.dpbtn svg.i{width:20px;height:20px;color:currentColor}

/* 2. Our calendar: a popover on computer and iPad, a bottom sheet on the phone. Same parts in both. */
.dp{--cw:44px;--ch:44px;--gap:2px;--pad:12px;position:fixed;z-index:80;background:var(--card);border:1px solid var(--bcard);border-radius:12px;box-shadow:var(--shadow-float);padding:8px var(--pad) 4px;width:calc(var(--cw)*7 + var(--gap)*6 + var(--pad)*2 + 2px);transform-origin:top left;color:var(--ink);font-size:15px;line-height:1.45}

.menu button svg.railp{width:20px;height:20px;color:var(--ink2)}
/* 9. the ID as one sentence in the number's own font */
.idsent,.sheet .bd>p.idsent{display:flex;flex-wrap:wrap;align-items:center;column-gap:10px;row-gap:6px;margin:0 0 14px;font-size:24px;line-height:36px;font-weight:600;letter-spacing:.02em;color:var(--ink)}
.idsent .tw,h2.cksaved .tw{white-space:nowrap;display:inline-flex;align-items:baseline}
@media (max-width:640px){.idsent,.sheet .bd>p.idsent{font-size:21px}}
/* 10. the calendar floats over Add Leftover: nothing in the dialog hides under it, and the dialog keeps its own light */
@media (min-width:641px){#sheet .dpunder,.pane .dpunder,.lst .dpunder{opacity:1!important;visibility:visible!important}
  body:has(#sheet.calfloat) .dpscrim{background:transparent}}
/* ================= round 40 (panel 13 section 3) ================= */
/* 2. Kitchen v3's row, right side: the amount (15/500, ink2), then the status (13/600); 23 px in above 1100 px, where
   Kitchen has no end column (its .go/.gos shows only where an item opens as its own page) */
.lrow .r{display:flex;flex-direction:column;align-items:flex-end}
.lrow .amt{font-size:15px;font-weight:500;color:var(--ink2);margin-top:0}
.lrow .st{font-size:13px;font-weight:600;margin-top:2px;color:var(--ink)}
.lrow .st.later{font-weight:600;color:var(--ink2)}
.lrow .st.clash{color:var(--amber-text);white-space:normal;max-width:150px}
.dev-ipad .lrow .amt{font-size:17px}.dev-ipad .lrow .st{font-size:14px}
@media (min-width:1101px){.lcard .lgw.kl .lrow{padding-right:23px}.lcard .lgw.kl>section>.gh{padding-right:23px}}
/* 3. Prep's saved card: the ID sentence, then the tape line, the same as the cook-ahead's saved card */
.task .tsay .tpre{flex-direction:column;align-items:stretch;gap:0;font-weight:400}
.task .tsay .tpre .idsent{font-size:21px;line-height:32px;margin:0 0 8px}
.task .tsay .tpre .tapeln.ckt{margin:0 0 6px;background:var(--card);font-size:14px;line-height:20px}
@media (max-width:640px){.task .tsay .tpre .idsent{font-size:19px}}
.sheet .bd>.calsp{flex:none;pointer-events:none}
/* the date's read-out line sits under the hanging calendar: it hides whole, never as a sliver ("Mo") */
.sheet.calhang .dpart .dread{visibility:hidden}
/* upright iPad: the rows under the date panel hide whole while the calendar hangs below it (no half "Used It All") */
.pane.page.calhang #datepanel~*,.pane.page.calhang #datepanel~* *{visibility:hidden!important}
/* the borrowed room is not more form: no "More below" bar while the calendar hangs */
.sheet.calhang .mbelow{visibility:hidden}
/* round 40 resume: the rows under Made (the Use by guess box, Note) hide whole while the calendar hangs over them, so
   no label or guess is left half covered ("Our guess, from t"); round 30's rule, kept for the hanging calendar */
@media (min-width:641px){.sheet.calhang .form .mrow~*{visibility:hidden}}
/* the state bar's note (a mockup-only line) */
.mock .cur .mnote{font-style:normal;opacity:.75;margin-left:8px}
/* 12. the Make Ahead task's Start Cook-Ahead, and the cook-ahead session (a Cook mode stand-in) */
.task .ln.cka{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px}
.task .ln.cka small{font-size:13px;color:var(--muted)}
.task .tw .ln.mf.cka{height:auto;min-height:56px;padding:6px 0}
@media (max-width:640px){.task .tw .ln.mf.cka{flex-wrap:nowrap}.task .tw .ln.mf.cka small{min-width:0;line-height:18px}}
.ckv{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--panel);border:1px dashed var(--folder-line);font-size:14px;line-height:20px;color:var(--ink2);margin-bottom:12px}
.ckv b{display:block;color:var(--ink);font-weight:600}.ckv>svg{margin-top:1px}
.cksteps{list-style:none;margin:0;padding:0}

.cksteps li .n{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--chip-warm,#EFE6D6);font-weight:600;font-size:14px}
.cksteps li.dn{color:var(--muted)}.cksteps li.dn .n{background:var(--sage-light);color:var(--sage-text)}
.cksteps li.now .n{background:var(--ink);color:var(--page)}.cksteps li.now{font-weight:500}
.ckmk{font-size:14px;color:var(--ink2);margin-top:10px}
.sheet h2.cksaved{display:flex;align-items:center;flex-wrap:wrap;column-gap:10px;row-gap:6px;font-size:24px;line-height:36px}

.tapeln.ckt{margin:0 0 12px;display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:10px;background:var(--panel);font-size:15px;line-height:22px;color:var(--ink)}
.ckd{font-size:15px;line-height:22px;color:var(--ink2);margin:12px 0 0}.ckfz{margin-top:12px}

.rpop{position:fixed;inset:0;z-index:95}
.rpop[hidden]{display:none}
.rp-scrim{position:absolute;inset:0;background:rgba(24,16,8,.52)}
.rp-card{position:absolute;left:50%;top:62px;bottom:30px;width:min(760px,calc(100vw - 48px));transform:translateX(-50%);display:flex;flex-direction:column;background:#FFFDF6;border-radius:10px;overflow:hidden;
  box-shadow:0 2px 4px rgba(40,26,8,.10),0 18px 50px rgba(40,26,8,.30),0 0 0 1px rgba(60,40,10,.10);outline:none}
.rp-card .rp-card{transform:none}
.rp-jump{flex:none;display:flex;align-items:center;gap:4px;height:52px;padding:0 10px 0 16px;background:#F7EEDB;border-bottom:1px solid rgba(60,40,10,.12);white-space:nowrap}

.rp-scroll{flex:1;min-height:0;overflow-y:auto;padding:0 34px 56px;background-image:repeating-linear-gradient(to bottom,transparent 0 27px,rgba(80,120,170,.16) 27px 28px);background-attachment:local;background-position:0 0}

.rp-head{display:flex;align-items:flex-start;gap:16px;padding:18px 0 14px;border-bottom:1.5px solid var(--ired2,#E3A79B);background:#FFFDF6;margin:0 -34px;padding-left:24px;padding-right:34px}
.rp-photo{flex:none;width:76px;height:76px;border-radius:6px;overflow:hidden;box-shadow:0 2px 6px rgba(40,26,8,.18);transform:rotate(-3deg);background:#EFE3CF}
.rp-photo svg{width:100%;height:100%;display:block}
.rp-t{flex:1;min-width:0;padding-top:8px}

.rp-t .from{font-size:14px;color:var(--ink2);margin-top:4px}.rp-t .from u{color:var(--sage-text);text-underline-offset:2px}
.rp-acts{flex:none;display:grid;grid-template-columns:auto 36px;gap:8px;justify-items:end;align-items:center;padding-top:4px}
.rp-acts .btn{grid-column:1/3;height:36px;padding:0 14px}
.rp-meal{display:inline-flex;align-items:center;height:32px;padding:0 18px;border-radius:8px;background:var(--sage-light);border:1px solid rgba(75,105,71,.25);font-size:14px;font-weight:600;color:var(--ink)}
.rp-heart{width:32px;height:32px;border-radius:8px;border:1px solid var(--bcard);display:grid;place-items:center;color:#B5462E;background:var(--card)}.rp-heart.on svg{fill:currentColor}
.rp-facts{font-size:14px;line-height:28px;color:var(--ink2);padding-top:0}
.rp-facts b{color:var(--ink);font-weight:600}
.rp-tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-height:28px}.rp-tags span{font-size:13px;line-height:20px;padding:0 6px;border-radius:4px;background:#F3E6CE;border:1px solid #E2CDA7;color:var(--ink)}
.rp-sec{padding-top:28px}
.rp-sec h3{display:flex;align-items:center;margin:0;font-family:Fraunces,Georgia,serif;font-weight:700;font-size:19px;line-height:28px;color:var(--ink)}
.rp-sec h3 .btn{margin-left:auto;height:28px;padding:0 10px;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;font-weight:600}
.rp-sv{margin-left:auto;display:inline-flex;align-items:center;gap:10px;font-family:'IBM Plex Sans',sans-serif;font-weight:400;font-size:13px;color:var(--ink2)}
.rp-step{display:inline-flex;align-items:center;border:1px solid var(--bcard);border-radius:6px;height:26px;background:var(--card)}.rp-step button{width:28px;height:24px;display:grid;place-items:center}.rp-step b{min-width:28px;text-align:center;font-size:14px;border-left:1px solid var(--bcard);border-right:1px solid var(--bcard)}
.rp-note{font-style:italic;font-size:14px;line-height:28px;color:var(--ink2);background:rgba(250,232,160,.45);border-left:3px solid #E2C267;padding:0 12px}
.rp-ready{display:flex;gap:24px;margin-top:28px;align-items:flex-start;border-left:3px solid #E2CDA7;padding:0 12px;font-size:14px;line-height:28px}.rp-ready b{flex:none}
.rp-ready .rp-done{font-style:normal;color:var(--sage-text);font-weight:600;display:inline-flex;align-items:center;gap:4px;margin-left:6px}
.rp-have{display:block;height:28px;line-height:28px;padding:0 10px;margin:0 -10px;border-radius:4px;background:var(--sage-light);font-size:14px;color:var(--ink)}
.rp-ing{display:flex;align-items:center;gap:12px;height:28px;font-size:15px}.rp-ing b{flex:none;width:96px;font-weight:600;display:inline-flex;align-items:center;gap:6px}.rp-ing span{flex:1;min-width:0}
.rp-ing i.ok{color:var(--sage-text)}.rp-ing i.need{font-style:normal;font-size:12px;font-weight:600;color:#fff;background:#9A6A1E;border-radius:3px;padding:0 5px;line-height:18px}
#rp-store .rp-ing b{width:120px}#rp-store .rp-ing svg{color:var(--ink2)}
.rp-sub{font-size:13px;line-height:28px;color:var(--ink2)}
.rp-sec ol{margin:0;padding-left:22px;font-size:15px;line-height:28px}.rp-sec ol li{padding-left:4px}
.dev-ipad .rp-ing,.dev-ipad .rp-sec ol{font-size:16px}
@media (max-width:640px){.rp-card{inset:0;left:0;transform:none;width:auto;border-radius:0}
  .rp-scroll{padding:0 16px 40px}.rp-head{margin:0 -16px;padding:14px 16px 12px;flex-wrap:wrap;gap:12px}
  .rp-photo{width:64px;height:64px}.rp-t h2{font-size:24px}.rp-acts{width:100%;display:flex;justify-content:flex-start;padding:0}
  .rp-acts .btn{order:-1}.rp-jump{padding-left:10px}.rp-jump .rp-exp{display:none}
  .rp-close{margin-left:0;border:0;border-left:1px solid rgba(60,40,10,.14);border-radius:0;background:none;padding:0 4px 0 12px}
  .rp-jl{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 24px),transparent)}}
</style>

<script>
const $=s=>document.querySelector(s);
const ic=(id,c='i')=>`<svg class="${c}" aria-hidden="true"><use href="#${id}"/></svg>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const DEV=(()=>{const q=new URLSearchParams(location.search).get('dev')||window.FULL;if(['phone','ipad','desktop'].includes(q))return q;
  return innerWidth<640?'phone':matchMedia('(hover:none)').matches?'ipad':'desktop'})();
document.documentElement.classList.add('dev-'+DEV);
const TOUCH=DEV!=='desktop';

// column (DESIGN 4.6.2, bottom right) and the column ends above it, so it never covers the list row just changed. A

// until you leave Leftovers (S.lastUndo)
function keepUndo(id,fn,w,gone){S.lastUndo={id,fn,w,gone:!!gone}}
// round 36 (LVK rule 5): Undo is version-checked. If the leftover changed after this change (someone else, or you
// again), Undo puts nothing back and says who changed it; the household's change is never thrown away
function undoBlocked(t){const l=t.last||{},nm=whoW(l.who||'Someone'),w=l.w?lc(l.w):'changed it';

function toast(msg,act,label,keep){const box=$('#toasts');const t=document.createElement('div');t.className='toast';t.innerHTML=`<span>${esc(msg)}</span>`;
  if(act){const kt=keep&&byId(keep.id),ver=kt?JSON.stringify(kt):null;
    const f=()=>{S.lastUndo=null;const now=keep&&byId(keep.id);if(now&&ver&&JSON.stringify(now)!==ver){undoBlocked(now);render();return}act()};if(keep)keepUndo(keep.id,f,keep.w,keep.gone);const b=document.createElement('button');b.textContent=label||'Undo';b.onclick=()=>{f();drop(t)};t.appendChild(b)}
  // the page draws once more so the kept Undo shows; the changed fact keeps its flash (FXL)
  if(act&&keep){FX=FXL||[];render()}

  setTimeout(()=>drop(t),TOUCH?8000:6000)}
function placeToasts(){const bb=document.querySelector('.bbar'),box=$('#toasts');if(!box)return;box.style.right='';box.style.maxWidth='';

  // right-aligned to it, so the open leftover keeps its full height and its buttons stay in reach

  if(sd&&lc){const r=lc.getBoundingClientRect();box.style.right=Math.round(innerWidth-r.right+16)+'px';box.style.maxWidth=Math.round(Math.min(420,r.width-32))+'px';box.style.bottom='';fitCol();clearRow();setTimeout(()=>clearRow(true),500);if(S.open)requestAnimationFrame(keepActs);return}
  if(sd){const r=sd.getBoundingClientRect();box.style.right=Math.round(innerWidth-r.right+(sd.matches('.side')?8:0))+'px';box.style.maxWidth=Math.round(r.width-(sd.matches('.side')?16:0))+'px';box.style.bottom='';fitCol();return}
  box.style.bottom=bb&&PHONE()?(innerHeight-bb.getBoundingClientRect().top+12)+'px':''}
// round 37: after a save, the open leftover's pane scrolls just enough to bring Used It All and Tossed It into reach
// (above its "More below" strip), so a save never leaves the next action hidden
// round 37: while a toast is up beside a side column, the list has room at its foot, and the row just changed (or
// just finished) scrolls up clear of the toast, so the toast never covers it
function clearRow(again){const box=$('#toasts'),tl=box?[...box.children].filter(x=>!x.dataset.out):[];document.body.classList.toggle('tup',!!tl.length);if(!tl.length||NARROW())return;
  const sc=$('#scroll'),rs=[...document.querySelectorAll('.lrow.picked,.lrow.new,.justg,.task.fresh')];const tr=tl.map(x=>x.getBoundingClientRect());let need=0;
  for(const e of rs){const q=e.getBoundingClientRect();for(const r of tr)if(q.bottom>r.top&&q.top<r.bottom&&q.right>r.left&&q.left<r.right)need=Math.max(need,q.bottom-r.top+12)}
  if(need>0&&sc)sc.scrollBy({top:need,behavior:RM()||again?'auto':'smooth'})}
function keepActs(){const sd=document.getElementById('side');if(!sd||NARROW())return;const co=sd.querySelector('.closeout');if(!co)return;

  const r=sd.getBoundingClientRect(),q=co.getBoundingClientRect(),over=q.bottom-(r.bottom-40);if(over<=16)return; // a few px: leave it still
  // land on a whole row: the first fact row whose top is at least "over" below the pane's head
  const hd=sd.querySelector('.pane .hd'),hb=hd?hd.getBoundingClientRect().bottom:r.top;let by=over;

function tabPaths(W,open){const H=44,th=38,s=6,r=7,f=4,T=H-th,L=.5,R=W-.5,top=T+.5,len=Math.hypot(s,H-top),ux=s/len,uy=(H-top)/len,n=v=>+v.toFixed(3);

  if(!open)return{fill:`M${L-.5} ${H} ${tl} L${R+.5} ${H} Z`,stroke:`M${L} ${H+.5} ${tl} L${R} ${H+.5}`};

  $('#mockmore').classList.remove('open');render();if(S.panel)fitPanel(document.querySelector('[data-panel]'),true);if(ST[k].after)ST[k].after();
  const u=new URL(location);u.searchParams.set('state',k);history.replaceState(null,'',u)}
function mockBar(){const m=$('#mock');const cur=ST[STATE];
  m.innerHTML=`<span>Mockup, not the app</span><button class="stbtn" data-mk="all">States ▾</button><span class="cur">${cur?esc(cur.g+': '+cur.l):''}${cur&&cur.n?`<i class="mnote">${esc(cur.n)}</i>`:''}</span><button data-mk="g" data-g="Prep">Prep ▾</button><button data-mk="g" data-g="Leftovers">Leftovers ▾</button>`}
function mockList(g){return ['Prep','Leftovers'].filter(x=>!g||x===g).map(x=>`<b>${x}</b>`+Object.entries(ST).filter(([k,v])=>v.g===x).map(([k,v])=>`<button data-st="${k}" class="${STATE===k?'on':''}">${esc(v.l)}</button>`).join('')).join('')}
document.addEventListener('click',e=>{const b=e.target.closest('#mock button,#mockmore button');if(!b)return;
  if(b.dataset.st){setState(b.dataset.st);return}
  const mm=$('#mockmore');const g=b.dataset.mk==='g'?b.dataset.g:null;mm.innerHTML=mockList(g);const r=b.getBoundingClientRect();
  mm.classList.add('open');const w=mm.offsetWidth,h=mm.offsetHeight;mm.style.left=Math.max(8,Math.min(r.left,innerWidth-w-8))+'px';
  mm.style.top=(r.bottom+6+h>innerHeight?Math.max(8,r.top-h-6):r.bottom+6)+'px'});
