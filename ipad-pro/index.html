<script>
/* full-screen mode for the review links (STANDARDS "Mockup review links and versions"): publish_device_links.py sets
   window.SC_FULL = desktop | ipad | phone; ?full=ipad does the same by hand. No frame or bezel: the real screen is the
   frame. The mockup-only state bar stays (it moves into its own strip on narrow screens). */

if(window.FULL)document.documentElement.classList.add('full','full-'+window.FULL);

/* Groceries v3, computer. Frame measured on staging 11-24 (header 50, rail 219, rail rows 44 + 4 gap r8, tan bar 46px).
   Round 10: kit parts everywhere (src/kit): Button 44 tall in four tiers (primary sage-dark, secondary mid sage, cancel
   outline, destructive red outline; press = scale .97 + 16% overlay), Chip (44 tall, 16 a side, tan, picked = chip-on +
   1px sage-text + bold, caution tone for Drop It), Card (cream, 1px outline, the two-layer soft shadow 2.8.1),
   Popover (surface-raised, radius 12, padding 12, caret pointing at its button, drops under it), field (52 tall,
   radius 8, border-strong), Dialog 420 with the [0,16,48,.2] shadow, Toast bottom right (4.6.2), PinEntry 6 boxes.
   Folder tabs = kit FolderDrawer look D. Stepper = kit Stepper, but with a softer resting edge (see BRIEF open question).
   Type snaps to DESIGN 2.5 (12 / 13 / 15 / 16, eyebrows 13/500). Icons 16 / 20, stroke 2. One ease (2.9.2).
   Every colour is a light.js token; member colours (avatars) are the only exception (2.2.11).
   No keyboard shortcuts (DESIGN 3.4.6): arrow keys only move inside a list, a menu or the folder tabs. */
:root{
  --page:#EDE5D8; --card:#FAF6EE; --card-hover:#FFFCF5; --panel:#F6F2E9; --panel-alt:#F1E8DA; --alert:#F8F0E0;
  --header:#6B3E14; --subbar:#E4D3B3; --hdr-text:#FAF4EB; --subbar-date:#5C3D0A; --subbar-2:#7A5030;
  --ink:#1E1E1C; --ink2:#54524A; --muted:#605E55;
  --sage:#8FAF8A; --sage-dark:#1F3A1C; --sage-light:#E4EDE2; --sage-text:#4B6947; --sage-hover:#82A37C;
  --amber:#C8943A; --amber-light:#F5ECD8; --amber-text:#7E5C22; --amber-dark:#5C3D0A;
  --urgent-bg:#F5E4E4; --urgent-text:#5C1A1A; --urgent-border:#8E3131;
  --chip:#E4D9C6; --chip-on:#B7D0B0; --chip-warm:#EFE4CC; --chip-warm-edge:#988048;
  --row-hover:#F0EEE3; --track:#DDD5C5;
  --folder-line:#D2C6B0; --folder-ink:#4A3A22; --sheet1:#F1E4CB; --sheet2:#E6D3AE;
  --bcard:rgba(0,0,0,.09); --brow:rgba(0,0,0,.06); --scrim:rgba(0,0,0,.4);
  --shadow-card:0 1px 2px rgba(45,33,22,.055),0 6px 16px rgba(45,33,22,.055);
  --shadow-pop:0 4px 14px rgba(45,33,22,.16); --shadow-float:0 16px 48px rgba(45,33,22,.2);
  --hover:inset 0 0 0 100px rgba(30,30,28,.04); --press:inset 0 0 0 100px rgba(30,30,28,.16);
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --ease:cubic-bezier(.25,.46,.45,.94);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--page)}
body{color:var(--ink);font:400 15px/1.45 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input{font:inherit;color:inherit}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:16px;height:16px}
:focus-visible{outline:2px solid var(--sage-text);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.2s!important;animation-name:fade!important;transition-duration:.01s!important}.btn:active,.chip:active,.hb:active,.sel:active,.place:active,.aislechip:active{transform:none!important}}

/* themed scroll bar (DESIGN 4.10: 12px gutter, 6px thumb in ink-muted 35%, hover ink-secondary 70%) */
.scroll,.sheet,.menu .mi{scrollbar-width:thin;scrollbar-color:rgba(96,94,85,.35) transparent}
.scroll::-webkit-scrollbar,.sheet::-webkit-scrollbar,.menu .mi::-webkit-scrollbar{width:12px;height:12px}
.scroll::-webkit-scrollbar-thumb,.sheet::-webkit-scrollbar-thumb,.menu .mi::-webkit-scrollbar-thumb{background:rgba(96,94,85,.35);border:3px solid transparent;background-clip:padding-box;border-radius:999px}
.scroll::-webkit-scrollbar-thumb:hover{background-color:rgba(84,82,74,.7)}
.scroll::-webkit-scrollbar-track,.scroll::-webkit-scrollbar-corner{background:transparent}

.top::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(0,0,0,.10));pointer-events:none}
.wordmark{font-style:italic;font-weight:600;font-size:22px;position:relative}
.top .sp{flex:1}
.av{display:inline-grid;place-items:center;border-radius:50%;font-weight:600;color:#fff;flex:none}
.av.hdr{width:28px;height:28px;font-size:12px;background:#5E7C55;box-shadow:0 0 0 2px var(--hdr-text);position:relative}
.av.md{width:32px;height:32px;font-size:13px}
.av.sm{width:24px;height:24px;font-size:12px;box-shadow:0 0 0 2px var(--subbar)}
.av.link{background:var(--chip);color:var(--ink2)}
.rail{background:var(--card);border-right:1px solid var(--bcard);padding:12px 8px;display:flex;flex-direction:column;gap:4px}
.rail .cap{height:44px;border-radius:8px;background:var(--sage-dark);color:var(--hdr-text);display:flex;align-items:center;gap:10px;padding:0 14px;font-weight:500;font-size:16px;margin-bottom:8px}
.rail .ri{display:flex;align-items:center;gap:14px;height:44px;border-radius:8px;padding:0 14px;color:var(--ink2);font-weight:500;font-size:16px;text-align:left}
.rail .ri:hover{box-shadow:var(--hover)}
.rail .ri.on{background:var(--sage-light);color:var(--sage-text)}
.rail .ri img{width:20px;height:20px}
.rail hr{border:0;border-top:1px solid var(--bcard);margin:4px 8px}
.rail .grow{flex:1}
.body{display:grid;grid-template-rows:46px 1fr;min-height:0;min-width:0}
.bar{background:var(--subbar);border-bottom:1px solid var(--brow);position:relative;display:flex}
.bar .in{display:flex;align-items:center;gap:12px;width:100%;max-width:1212px;margin:0 auto;padding:0 16px}
.bar .ttl{font-style:italic;font-weight:600;font-size:16px;color:var(--subbar-date)}
.bar .meta{font-size:13px;color:var(--subbar-2);padding-left:12px;border-left:1px solid rgba(92,61,10,.3);display:flex;align-items:center;gap:8px;white-space:nowrap}
.bar .sp{flex:1}
.bar .here{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--subbar-2)}
.bar .here .avs{display:flex}.bar .here .avs .av+.av{margin-left:-6px}
.back{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--subbar-date);margin-left:-8px;position:relative}
.back:hover{box-shadow:var(--hover)}.back::after{content:"";position:absolute;inset:-4px}

/* kit Button: 44 tall (D32), four tiers, Title Case, press = shrink .97 + 16% overlay (4.2.4, 6.1) */
.btn{height:44px;border-radius:8px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:500;font-size:16px;white-space:nowrap;transition:transform 50ms var(--ease),box-shadow .2s var(--ease);position:relative;flex:none}
.btn:active{transform:scale(.97);box-shadow:var(--press)}
.btn.pri{background:var(--sage-dark);color:var(--hdr-text)}.btn.pri:hover{box-shadow:inset 0 0 0 100px rgba(250,244,235,.08)}.btn.pri:active{box-shadow:inset 0 0 0 100px rgba(250,244,235,.16)}
.btn.sec{background:var(--sage);color:var(--ink)}.btn.sec:hover{box-shadow:var(--hover)}.btn.sec:active{box-shadow:inset 0 0 0 100px rgba(31,58,28,.16)}
.btn.cancel{background:transparent;border:1px solid var(--ink2);color:var(--ink)}.btn.cancel:hover{box-shadow:var(--hover)}
.btn.danger{background:transparent;border:1px solid var(--urgent-border);color:var(--urgent-text)}.btn.danger:hover{box-shadow:inset 0 0 0 100px rgba(142,49,49,.06)}.btn.danger:active{background:var(--urgent-border);color:var(--hdr-text)}
.btn.tan{background:var(--chip-warm);border:1px solid var(--chip-warm-edge);color:var(--ink)}.btn.tan:hover{box-shadow:var(--hover)}
.btn.wide{width:100%}
/* in the 46px tan bar a button draws 36 and keeps a 44 hit area (kit TanBar) */
.bar .btn{height:36px;padding:0 14px;font-size:15px}.bar .btn::after{content:"";position:absolute;inset:-4px 0}
.btn.icon{width:44px;padding:0;background:transparent;color:var(--ink2)}.btn.icon:hover{box-shadow:var(--hover)}
.bar .btn.icon{width:36px;color:var(--subbar-date)}
.btn[disabled]{cursor:default}.btn.busy{opacity:1}.btn.off{opacity:.45;cursor:default}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:rot .8s linear infinite;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}
.scroll{overflow:auto;min-height:0}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;padding:24px 16px 96px;max-width:1212px;margin:0 auto}
@media (max-width:1320px){.wrap{grid-template-columns:minmax(0,1fr) 300px}.wrap.pa{grid-template-columns:minmax(0,1fr) 256px}}
.wrap.one{grid-template-columns:minmax(0,820px);justify-content:center}
.card{background:var(--card);border-radius:12px;border:1px solid var(--bcard);box-shadow:var(--shadow-card)}
.eyebrow{font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* ---------- smart add: kit field (52 tall, radius 8, border-strong) + an Add button ---------- */
.addwrap{position:relative;margin-bottom:16px;z-index:20}
/* round 13 (fit panel): kit QuickAddBox: the field (52, border-strong, radius 8) and the Add button BESIDE it, 8 apart */
.addrow{display:flex;align-items:center;gap:8px}
.add{flex:1;min-width:0;display:flex;align-items:center;gap:12px;height:52px;padding:0 16px;background:var(--card);border:1px solid var(--ink2);border-radius:8px}
.add>svg{color:var(--muted)}
.add input{flex:1;border:0;background:none;outline:none;font-size:16px;height:100%;min-width:0}
.add input::placeholder{color:var(--muted)}
.add:focus-within{border:2px solid var(--sage-text);padding:0 15px}
.hint{font-size:13px;color:var(--muted);white-space:nowrap}
.sugg{position:absolute;left:0;right:0;top:58px;background:var(--card);border:1px solid var(--bcard);border-radius:12px;box-shadow:var(--shadow-pop);padding:12px;display:none}
.sugg.open{display:block;animation:pop .2s var(--ease)}
.sugg .opt{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;border-radius:8px;padding:4px 12px;text-align:left}
.sugg .opt.on,.sugg .opt:hover{background:var(--row-hover)}
.sugg .opt .nm{flex:1;font-size:16px}.sugg .opt .nm b{font-weight:600}
.sugg .opt .where{font-size:13px;color:var(--muted)}
/* kit TagChip: chip fill, radius 8, 13/600 ink (Chip.tsx TagChip) */
.tag{font-size:13px;font-weight:600;color:var(--ink);background:var(--chip);border-radius:8px;padding:2px 8px;margin-left:8px;white-space:nowrap}
.sugg .note{font-size:13px;font-weight:600;color:var(--amber-dark);background:var(--amber-light);border-radius:8px;padding:2px 8px}
.sugg .foot{display:flex;align-items:center;gap:12px;border-top:1px solid var(--brow);margin-top:8px;padding:12px 4px 0;font-size:13px;color:var(--muted)}
/* ONE dropdown trigger look (round 13, fit panel): the kit Chip at rest (tan fill, radius 8, 16 a side, 15/600,
   trailing 16 chevron). Used by "Buy it at", Put Away's place field and Not Sorted Yet's aisle chip (compact: 13, 12 a side). */
.sel,.place,.aislechip{height:44px;border-radius:8px;background:var(--chip);padding:0 12px 0 16px;display:inline-flex;align-items:center;gap:4px;font-size:15px;font-weight:600;color:var(--ink);border:1px solid transparent;white-space:nowrap;transition:transform 50ms var(--ease);flex:none;text-align:left}
.sel:hover,.place:hover,.aislechip:hover{box-shadow:var(--hover)}.sel:active,.place:active,.aislechip:active{transform:scale(.97);box-shadow:var(--press)}
.sel svg,.place svg,.aislechip svg{color:var(--ink);flex:none}
.sel[aria-expanded=true],.place[aria-expanded=true],.aislechip[aria-expanded=true]{background:var(--chip-on);border-color:var(--sage-text)}

/* ---------- notices (kit notice: tinted card, plain icon, close X; no edge stripes 4.5.2) ---------- */
.banner{border-radius:12px;padding:4px 4px 4px 16px;margin-bottom:16px;display:flex;gap:12px;align-items:center;font-size:15px;min-height:52px;box-shadow:var(--shadow-card);border:1px solid var(--bcard)}
.banner>svg.i{flex:none}
.banner .tx{flex:1;min-width:0;padding:6px 0}.banner b{font-weight:600}
.banner .tx.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner .sub{display:block;font-size:13px;margin-top:2px;color:var(--ink2)}
.banner .acts{display:flex;gap:8px;flex:none}
.banner.home{background:var(--amber-light)}.banner.home>svg{color:var(--amber-text)}
.banner.live{background:var(--sage-light)}.banner.live>svg{color:var(--sage-text)}
.banner.off{background:var(--panel-alt)}.banner.off>svg{color:var(--ink2)}
.banner.err{background:var(--urgent-bg);color:var(--urgent-text);border-color:var(--urgent-border)}
.banner.ok{background:var(--sage-light)}.banner.ok>svg{color:var(--sage-text)}
.banner.skel{background:var(--card)}

/* ---------- kit Chip (soft squares, radius 8, never pills) ---------- */
.chip{height:44px;border-radius:8px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:15px;color:var(--ink);background:var(--chip);border:1px solid transparent;font-weight:600;white-space:nowrap;transition:transform 50ms var(--ease)}
.chip:hover{box-shadow:var(--hover)}.chip:active{transform:scale(.97);box-shadow:var(--press)}
.chip.on{background:var(--chip-on);border-color:var(--sage-text);font-weight:700}
.chip.on.cau{background:var(--amber-light);border-color:transparent;color:var(--amber-text)}
.chip.cmp{padding:0 12px;font-size:13px}
.chip .n{font-weight:500;color:var(--ink2)}

/* ---------- folder drawer (kit FolderDrawer look D) ---------- */
.drawer{position:relative;padding:0 12px 12px 0}
.ftabs{display:flex;align-items:flex-end;height:44px;padding:0 24px;position:relative;z-index:2}
.ftab{position:relative;height:44px;flex:none;display:block;font-size:15px;font-weight:600;color:var(--folder-ink);line-height:38px;padding-top:6px;text-align:center;white-space:nowrap}
.ftab svg{position:absolute;left:-4px;top:0;overflow:visible;pointer-events:none}
.ftab span{position:relative}
.ftab .n{font-size:13px;font-weight:500;opacity:.8;margin-left:6px}
.ftab.on{color:var(--sage-text)}
.ftab:not(.on):hover svg path:first-child{filter:brightness(.96)}
.ftab.drop svg path:first-child{fill:var(--chip-on)}
.ftab:focus-visible{outline-offset:-4px;border-radius:8px}
.fcard{position:relative;z-index:1}
.fcard .sh{position:absolute;inset:0;border-radius:12px;border:1px solid var(--folder-line);pointer-events:none}
.fcard .sh2{transform:translate(12px,12px);background:var(--sheet2)}
.fcard .sh1{transform:translate(6px,6px);background:var(--sheet1)}
.fcard>.card{position:relative;border-color:var(--folder-line);overflow:clip}
.plaincard>.card{border-color:var(--folder-line);overflow:clip}
/* one right inset (round 13): 16 for text buttons and headers; 8 only for a trailing 44 "..." */
.lhead{display:flex;align-items:center;gap:12px;padding:4px 16px 4px 20px;border-bottom:1px solid var(--brow);font-size:15px;color:var(--ink2);min-height:52px;line-height:1.3}
.lhead .sp{flex:1}
.lhead b{color:var(--ink);font-weight:600}
.lhead .split{font-size:13px;color:var(--muted);display:block}
.aisle{position:sticky;top:0;background:var(--card);z-index:2;padding:16px 20px 8px;font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--brow);display:flex;gap:8px;align-items:center;min-height:44px}
.aisle .sp{flex:1}.aisle .nc{text-transform:none;letter-spacing:0;font-weight:400}
/* Not Sorted Yet is one warm card (kit Card tone="warm"): heading and rows inside the same tint */
.warmbox{background:var(--chip-warm);border-top:1px solid var(--chip-warm-edge)}
.aisle.tan{background:var(--chip-warm);color:var(--ink2);padding:8px 16px 8px 20px;border-bottom-color:var(--chip-warm-edge)}
.warmbox .row{border-bottom-color:var(--brow)}
.warmbox .row:hover,.warmbox .row:focus-within{background:var(--alert)}
.aisle.nf{color:var(--amber-text)}
.row{display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 8px 8px 20px;border-bottom:1px solid var(--brow);position:relative;transition:background .2s var(--ease);outline:none}
.row.tb{padding-right:16px}
.row:hover,.row:focus-within{background:var(--row-hover)}
.row:focus-visible{box-shadow:inset 0 0 0 2px var(--sage-text)}
.row.staple{background:var(--panel-alt)}.row.staple:hover,.row.staple:focus-within{background:var(--row-hover)}
.row[draggable=true]{cursor:grab}
.row.dragging{opacity:.5}
.lead{width:20px;display:grid;place-items:center;flex:none;color:var(--sage-text);margin-left:-4px}
.row.got .nm{text-decoration:line-through;color:var(--muted)}
.row .main{flex:1;min-width:0;padding:2px 0}
/* the food name leads; the amount before it is quieter (round 13, visual panel) */
.row .nm{font-size:16px;font-weight:500}.row .nm b{font-weight:400;color:var(--ink2)}
.src{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-top:2px;flex-wrap:wrap}
.src svg.i{width:16px;height:16px}
.src.carry,.src.nf{color:var(--amber-text)}.src.cart{color:var(--sage-text)}.src.who{color:var(--sage-text)}
.src .more{font-size:13px;color:var(--ink);font-weight:600;background:var(--chip);border-radius:8px;padding:0 8px;height:24px;line-height:24px;position:relative}
.src .more::after{content:"";position:absolute;inset:-10px -4px}
.src .more:hover{box-shadow:var(--hover)}
.stl{font-size:13px;color:var(--muted);white-space:nowrap;min-width:56px;text-align:right}
.pend{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:400;color:var(--ink2);margin-left:8px}
/* mouse-only hover actions (round 13, visual + fit panels): quiet 36 tall neutral buttons with a 44 hit area, like the
   tan bar's; Drop It carries the destructive cue (urgent text, red edge on hover). The always-there "..." is the
   keyboard and touch path. */
.row .acts{display:flex;gap:8px;opacity:0;pointer-events:none;transition:opacity .2s var(--ease);position:absolute;right:56px;top:50%;transform:translateY(-50%);padding-left:32px;background:linear-gradient(90deg,transparent,var(--row-hover) 28px)}
.row:hover .acts{opacity:1;pointer-events:auto}
.row .acts .hb{height:36px;border-radius:8px;padding:0 12px;font-size:15px;font-weight:500;color:var(--ink2);background:var(--card);border:1px solid var(--folder-line);display:inline-flex;align-items:center;gap:8px;white-space:nowrap;position:relative;flex:none;transition:transform 50ms var(--ease)}
.row .acts .hb::after{content:"";position:absolute;inset:-4px 0}
.row .acts .hb:hover{box-shadow:var(--hover);color:var(--ink);border-color:var(--ink2)}.row .acts .hb:active{transform:scale(.97);box-shadow:var(--press)}
.row .acts .hb.dz{color:var(--urgent-text)}.row .acts .hb.dz:hover{border-color:var(--urgent-border);background:var(--urgent-bg)}
.kebab{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;color:var(--muted);flex:none}
.kebab:hover,.kebab[aria-expanded=true]{box-shadow:var(--hover);color:var(--ink)}
/* .mini is gone (round 13): in-card buttons are kit Buttons (.btn .sec / .tan), 44 tall, 16 a side */
.aislechip{font-size:13px;padding:0 8px 0 12px}
.aislechip small{font-weight:400;color:var(--ink2);font-size:13px;margin-right:4px}
.finding{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.finding .spin{width:12px;height:12px}
.fold{padding:0}
.fold summary{list-style:none;cursor:pointer;padding:0 20px;min-height:52px;font-size:15px;color:var(--ink2);display:flex;align-items:center;gap:8px;border-top:1px solid var(--brow)}
.fold summary:hover{background:var(--row-hover)}
.fold summary::-webkit-details-marker{display:none}
.fold summary .sp{flex:1}
.fold summary .chev{transition:transform .2s var(--ease)}
.fold[open] summary .chev{transform:rotate(90deg)}
.fold summary .sumhint{font-size:13px;color:var(--muted)}
.new{animation:flash 1.8s var(--ease)}
@keyframes flash{0%,35%{background:var(--sage-light)}100%{background:transparent}}
.emptytab{padding:40px 24px;text-align:center;color:var(--ink2)}
.emptytab b{display:block;color:var(--ink);font-size:16px;font-weight:600;margin-bottom:4px}
.emptytab .acts{display:flex;gap:8px;justify-content:center;margin-top:16px}
.skel{height:12px;border-radius:4px;background:linear-gradient(90deg,var(--track) 0%,var(--panel) 50%,var(--track) 100%);background-size:200% 100%;animation:shim 1.4s infinite linear}
@keyframes shim{to{background-position:-200% 0}}

/* ---------- side column ---------- */
.side{display:flex;flex-direction:column;gap:16px;align-self:start;position:sticky;top:24px}
.side.free{position:sticky}
.side .card{padding:20px}
.side .cap2{font-size:13px;color:var(--muted);margin:4px 0 8px}
.kv{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:44px;padding:8px 0;border-top:1px solid var(--brow);font-size:15px;text-align:left;gap:12px}
.side .card .kv:first-of-type{border-top:0}
.kv .v{color:var(--ink2);white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.kv small{display:block;font-size:13px;color:var(--muted)}
button.kv{border-radius:8px;margin:0 -8px;padding:8px;width:calc(100% + 16px)}
button.kv:hover{box-shadow:var(--hover)}button.kv:active{box-shadow:var(--press)}
.kv .v.go{color:var(--sage-text);font-weight:600}
.note{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--ink2);margin:12px 0 0}
.note svg{color:var(--muted);margin-top:1px}
/* where shopping happens, said outright (round 13, ease panel) */
.shopnote{display:flex;gap:12px;align-items:flex-start;font-size:15px;color:var(--ink);margin:4px 0 8px;padding:12px;border-radius:8px;background:var(--panel-alt)}
.shopnote svg{color:var(--sage-text);margin-top:1px}.shopnote b{font-weight:500;display:block}.shopnote span span{font-size:13px;color:var(--ink2)}
.filt{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.filt button{display:flex;align-items:center;gap:12px;height:44px;border-radius:8px;padding:0 8px 0 12px;font-size:15px;text-align:left;border:1px solid transparent;color:var(--ink)}
.filt button svg{color:var(--muted)}
.filt button .c{margin-left:auto;color:var(--ink2);font-size:15px}
.filt button .go{color:var(--muted);opacity:0;transition:opacity .2s}
.filt button:hover{box-shadow:var(--hover)}.filt button:active{box-shadow:var(--press)}.filt button:hover .go{opacity:1}
/* the selected-row role (DESIGN 2.2.3): sage-light + sage-text + 1px sage-text edge, calmer than a picked chip */
.filt button.on{background:var(--sage-light);color:var(--sage-text);border-color:var(--sage-text);font-weight:600}
.filt button.on svg,.filt button.on .c{color:var(--sage-text)}
.filt button.dim{color:var(--muted)}
.who{display:flex;align-items:center;gap:12px;padding:4px 0}
.who .t{font-size:15px}.who .t span{color:var(--muted)}
.tag-live{margin-left:auto;font-size:13px;font-weight:600;color:var(--sage-text);background:var(--sage-light);border-radius:8px;padding:2px 8px}
.bignum{font-size:30px;font-weight:600;line-height:1}.bignum small{font-size:16px;font-weight:400;color:var(--ink2)}
.meter{height:8px;border-radius:4px;background:var(--track);margin:8px 0 0;overflow:hidden}
.meter i{display:block;height:100%;background:var(--sage-text);border-radius:4px;transition:width .4s var(--ease)}
.aisles button{display:flex;justify-content:space-between;align-items:center;width:calc(100% + 16px);margin:0 -8px;padding:0 8px;border-radius:8px;min-height:44px;font-size:15px;text-align:left}
.aisles button:hover{box-shadow:var(--hover)}.aisles button:active{box-shadow:var(--press)}
.aisles button span:last-child{display:inline-flex;align-items:center;gap:4px;color:var(--ink2);font-size:13px}
/* live side cards stay compact so all of them fit above the fold at 1280x800 (round 13) */
.side.free{gap:12px}.side.free .card{padding:16px}
.feed{display:flex;gap:12px;align-items:flex-start;padding:4px 0;border-top:1px solid var(--brow);font-size:13px;color:var(--ink2)}
.feed:first-of-type{border-top:0}.feed b{color:var(--ink);font-weight:500}.feed .tm{margin-left:auto;color:var(--muted);white-space:nowrap}

/* ---------- kit Popover (menus) and Dialog (floating cards) ---------- */
.menu{position:fixed;background:var(--card);border:1px solid var(--bcard);border-radius:12px;box-shadow:var(--shadow-pop);z-index:50;min-width:240px;display:none}
.menu.open{display:block;animation:pop .2s var(--ease)}
.menu .caret{position:absolute;width:12px;height:12px;background:var(--card);transform:rotate(45deg);top:-7px;left:var(--cx,20px);border:1px solid var(--bcard);border-right:0;border-bottom:0}
.menu.up .caret{top:auto;bottom:-7px;border:1px solid var(--bcard);border-left:0;border-top:0}
.menu .mi{padding:12px;overflow:auto;max-height:var(--mh,70vh);position:relative;border-radius:12px;background:var(--card);scrollbar-gutter:stable}
.menu button{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;border-radius:8px;padding:0 12px;font-size:15px;text-align:left}
.menu button:hover{background:var(--row-hover)}.menu button:focus{outline:none}
.menu button.on{background:var(--sage-light);color:var(--sage-text);font-weight:600}
/* keyboard only, outward like every other ring (DESIGN 6.2); a mouse-opened menu shows no ring */
.menu button:focus-visible{outline:2px solid var(--sage-text);outline-offset:2px;background:var(--row-hover)}
.menu .mi:focus{outline:none}
.menu button .ml{display:flex;flex-direction:column;line-height:1.3;padding:4px 0}
.menu button .ml small{margin:0;padding:0;font-size:13px;color:var(--muted)}.menu button .ck{margin-left:auto;color:var(--sage-text)}
.menu button small{margin-left:auto;color:var(--muted);font-size:13px;font-weight:400;padding-left:12px}
.menu button.on small{margin-left:auto}
.menu button[disabled]{color:var(--muted);cursor:default;background:none}
.menu hr{border:0;border-top:1px solid var(--brow);margin:4px 8px}
.menu .lab{font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:4px 12px 8px}
.menu .tip{font-size:13px;color:var(--muted);padding:4px 12px}
.menu .warn{color:var(--urgent-text)}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
.scrim{position:fixed;inset:0;background:var(--scrim);display:none;place-items:center;z-index:40}
.scrim.open{display:grid;animation:fade .2s var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* DESIGN 2.6.3 widths: 420 dialog (confirms, PIN, swap), 480 form (share, plan changes), 640 reading (check at home).
   Titles follow the kit: Dialog 18 bold, the bigger floating card 20 bold (layer/Dialog.tsx, layer/Sheet.tsx). */
.sheet{width:480px;max-width:calc(100vw - 32px);max-height:86vh;overflow:auto;background:var(--card);border-radius:16px;box-shadow:var(--shadow-float);animation:rise .2s var(--ease);display:flex;flex-direction:column}
.sheet.sm{width:420px}.sheet.wide{width:640px}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.sheet .hd{display:flex;align-items:flex-start;gap:12px;padding:20px 12px 8px 24px}
.sheet .hd:not(:has(+ .bd)){padding-bottom:20px}
.sheet .hd h2{margin:0;font-size:20px;font-weight:700;line-height:1.3}
.sheet.sm .hd h2{font-size:18px;line-height:24px}
.sheet .hd p{margin:4px 0 0;font-size:15px;color:var(--ink2)}
.sheet .hd p+p{margin-top:8px}
.sheet .x{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;color:var(--ink2);margin-left:auto;flex:none;margin-top:-6px}
.sheet .x:hover{box-shadow:var(--hover)}
.sheet .bd{padding:8px 24px 24px;flex:1}
.sheet .ft{display:flex;align-items:center;gap:8px;padding:12px 24px;border-top:1px solid var(--brow);background:var(--card);position:sticky;bottom:0}
.sheet .ft .sp{flex:1}
.seg{display:flex;gap:8px;margin:8px 0 16px;flex-wrap:wrap}
.seg .chip{flex:1 1 auto}
.linkbox{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--folder-line);border-radius:8px;padding:4px 4px 4px 16px;font-size:15px;margin-top:8px}
.linkbox span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2)}
/* kit PinEntry: boxes 52 x 56, 4 apart, the next box outlined 2px in selected-border; it finishes on the 6th digit */
.pins{display:flex;gap:4px;justify-content:center;margin:16px 0 8px}
.pins i{width:52px;height:56px;border-radius:8px;border:1px solid var(--ink2);background:var(--card);display:grid;place-items:center}
.pins i.f::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--ink)}
.pins i.cur{border:2px solid var(--sage-text)}
.pins:focus{outline:none}
.say{font-size:13px;color:var(--ink2)}
.callout{font-size:13px;color:var(--ink);background:var(--amber-light);border-radius:8px;padding:12px;margin:12px 0 0;display:flex;gap:8px;align-items:flex-start}
.callout svg{color:var(--amber-text);margin-top:1px}
.ckrow{border-top:1px solid var(--brow);padding:16px 0}.ckrow:first-of-type{border-top:0}
.ckrow .nm{font-weight:600;font-size:16px}.ckrow .why{font-size:13px;color:var(--muted);margin:2px 0 12px}
.ckrow .opts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ckrow .amt{display:flex;flex-direction:column;gap:12px;margin-top:12px;background:var(--panel);border:1px solid var(--bcard);border-radius:12px;padding:16px}
.ckrow .amt .chips{display:flex;gap:8px;flex-wrap:wrap}
.ckrow .res{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--sage-text);font-weight:500;flex-wrap:wrap}
.ckrow .res.buy{color:var(--amber-text)}.ckrow .res.unsure{color:var(--ink2)}
.ckrow .res .btn{margin-left:auto}
.diff{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--brow);font-size:15px}
.diff:first-of-type{border-top:0}
.diff .sym{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;font-weight:700}
.diff .sym.add{background:var(--sage-light);color:var(--sage-text)}.diff .sym.rm{background:var(--urgent-bg);color:var(--urgent-text)}.diff .sym.ch{background:var(--chip);color:var(--ink2)}
.diff small{display:block;font-size:13px;color:var(--muted)}
.field{display:flex;align-items:center;height:52px;border:1px solid var(--ink2);border-radius:8px;background:var(--card);padding:0 16px}
.field input{flex:1;border:0;outline:none;background:none;font-size:16px}
.field.fl{flex-direction:column;align-items:stretch;justify-content:center}
.field.fl small{font-size:12px;color:var(--muted);line-height:1.2}.field.fl input{flex:none;padding:0}
.field:focus-within{border-color:var(--sage-text);box-shadow:0 0 0 1px var(--sage-text)}

/* ---------- put away ---------- */
.pa .intro{font-size:15px;color:var(--ink2);margin:0 0 16px;max-width:720px}
.wrap.pa{grid-template-columns:minmax(0,1fr) 300px}
.pa .row{gap:12px;min-height:68px;padding-right:4px}
.pa .row .main{min-width:0}
.pa .row .src,.pa .short,.pa .subst,.pa .unknown{white-space:nowrap;flex-wrap:nowrap}
.pa .row .src>span,.pa .short>span,.pa .subst>span,.pa .unknown>span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.pa .row .src svg,.pa .short svg,.pa .unknown svg{flex:none}
.pa h3{margin:0;padding:16px 4px 8px 20px;font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--brow);display:flex;align-items:center;gap:12px}
.pa h3 .sp{flex:1}
.pa h3 .col{text-transform:none;letter-spacing:0;font-weight:400;font-size:13px;flex:none}
.pa .pcard{margin-bottom:16px;overflow:clip}
.pa #missed .row{padding-right:16px}
.pa .subl{padding:12px 20px;font-size:13px;color:var(--ink2);border-bottom:1px solid var(--brow)}
/* kit Stepper exactly (round 13, fit panel): border-strong edge, 44 cells with 20px minus/plus in the quiet tone, a 56
   value field in the item type (16/500) between hairlines; unknown shows an em dash and a minus/plus tap asks
   "Type a number first" (focuses the field) instead of guessing 0 or 1. */
.stepw{display:flex;align-items:center;gap:8px;width:196px;flex:none;position:relative}
.step{display:inline-flex;align-items:stretch;border:1px solid var(--ink2);border-radius:8px;overflow:hidden;background:var(--card);height:44px;flex:none}
.step button{width:44px;display:grid;place-items:center;color:var(--muted)}
.step button svg.i{width:20px;height:20px}
.step button:hover{box-shadow:var(--hover);color:var(--ink)}.step button:active{box-shadow:var(--press);color:var(--ink)}
.step input{width:56px;text-align:center;font-weight:500;font-size:16px;border:0;border-left:1px solid var(--brow);border-right:1px solid var(--brow);background:var(--card);outline:none}
.step input::placeholder{color:var(--muted)}
.step:focus-within{outline:2px solid var(--sage-text);outline-offset:2px}
.stepw .unit{font-size:13px;color:var(--muted);width:44px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stepw .ask{position:absolute;left:0;top:calc(100% + 2px);font-size:13px;color:var(--amber-text);white-space:nowrap}
.was{font-size:13px;font-weight:400;color:var(--amber-text);margin-left:8px;white-space:nowrap}
.short{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--amber-text);margin-top:2px}
.short svg.i,.subst svg.i,.unknown svg.i{width:16px;height:16px}
.subst{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);margin-top:2px}
.unknown{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);margin-top:2px}
.place{width:150px;padding:0 8px 0 12px}
.place .pl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.src .guess{color:var(--amber-text)}
.two{display:inline-flex;gap:8px}
.row.drop .nm{text-decoration:line-through;color:var(--muted)}
.row.late{background:var(--alert)}
.extra{background:var(--panel-alt);border:1px solid var(--bcard);border-radius:12px;padding:20px;margin-bottom:16px}
.extra .eh{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.extra .eh img{width:40px;height:40px}
.extra .eh span{font-size:13px;color:var(--ink2);display:block;margin-top:2px}
.extra .row{background:var(--card);border:1px solid var(--bcard);border-radius:12px;margin-bottom:8px}
.extra .addrow .add{background:var(--card)}
.pa h3 .c1{width:196px}.pa h3 .c2{width:150px}.pa h3 .c3{width:44px}
.pafoot{display:flex;align-items:center;gap:12px;justify-content:flex-end;padding:8px 0 0}
.pafoot .say{margin-right:auto}
.empty{padding:48px 32px;text-align:center}
.empty .ic{width:80px;height:80px;border-radius:16px;background:var(--panel-alt);display:grid;place-items:center;margin:0 auto 16px}
.empty h2{margin:0 0 8px;font-size:30px;font-weight:600;line-height:1.2}
.empty p{color:var(--ink2);margin:0 auto 24px;max-width:460px}
.empty .acts{display:flex;gap:8px;justify-content:center}

/* kit Toast (layer/Toast.tsx): ink, radius 12, 16/12 padding, body type in text-page, a 44 underlined action.
   Capped to the side column's width so it never crosses onto the list. */
.toasts{position:fixed;right:24px;bottom:24px;display:flex;flex-direction:column-reverse;gap:8px;align-items:flex-end;z-index:60;pointer-events:none;max-width:340px}
@media (max-width:1320px){.toasts{max-width:300px}}
.toast{background:var(--ink);color:var(--page);border-radius:12px;padding:6px 6px 6px 16px;min-height:48px;font-size:15px;display:flex;gap:8px;align-items:center;pointer-events:auto;animation:rise .2s var(--ease);box-shadow:var(--shadow-pop)}
.toast>span{padding:6px 0}
.toast button{color:var(--page);font-weight:500;font-size:16px;text-decoration:underline;text-underline-offset:3px;border-radius:8px;padding:0 12px;height:44px;flex:none}
.toast button:hover{box-shadow:inset 0 0 0 100px rgba(237,229,216,.12)}

   moves under the list; under 640 (phone) the rail becomes the bottom tab bar, rows stack, and floating cards fill the

/* ---------- helpers ---------- */
const fmt=v=>{if(v==null)return'';v=+v;if(v===.25)return'¼';if(v===.5)return'½';if(v===.75)return'¾';if(!Number.isInteger(v)&&Math.abs(v%1-.5)<.001)return Math.floor(v)+'½';return Number.isInteger(v)?String(v):String(+v.toFixed(2))};
const qty=i=>i.q==null?'':(i.u?`${fmt(i.q)} ${i.u}`:fmt(i.q));
const nmq=i=>`${i.q==null?'':`<b>${qty(i)}</b> `}${esc(i.n)}`;

const live=()=>S.phase==='shopping'||S.phase==='finished';
const onTab=(i,t)=>t==='All'||i.store===t||(i.store==='Any'&&!(live()&&t!==TRIP));
const listItems=()=>S.items.filter(i=>!i.later&&!i.kind&&!i.bought);

const count=t=>listItems().filter(i=>onTab(i,t)&&!i.got).length;
const inTrip=i=>(i.store===TRIP||i.store==='Any')&&!i.kind&&!i.later;
const two=()=>S.stores.length>1;
// kit Toast: one action at most (Undo by default; "Put Back", "Review", "Pick Aisle" where that is the next step)
function toast(msg,undo,label){const box=$('#toasts');const t=document.createElement('div');t.className='toast';t.innerHTML=`<span>${esc(msg)}</span>`;
  if(undo){const b=document.createElement('button');b.textContent=label||'Undo';b.onclick=()=>{undo();t.remove()};t.appendChild(b)}
  box.appendChild(t);while(box.children.length>3)box.firstChild.remove();
  let left=5000,last=Date.now(),hov=false;t.onmouseenter=()=>{hov=true;left-=Date.now()-last};t.onmouseleave=()=>{hov=false;last=Date.now()};

function morph(a,b){
  if(a.nodeType!==b.nodeType||a.nodeName!==b.nodeName){a.replaceWith(b);return}
  if(a.nodeType===1&&(a.id||b.id)&&a.id!==b.id){a.replaceWith(b);return}
  if(a.id==='sugg')return; // the open suggestion list is drawn by renderSugg, not by the page
  if(a.nodeType===3||a.nodeType===8){if(a.nodeValue!==b.nodeValue)a.nodeValue=b.nodeValue;return}
  if(a.nodeType!==1)return;
  for(const at of [...a.attributes])if(!b.hasAttribute(at.name)&&!(a.tagName==='DETAILS'&&at.name==='open'))a.removeAttribute(at.name);
  for(const at of [...b.attributes])if(a.getAttribute(at.name)!==at.value)a.setAttribute(at.name,at.value);
  if(a.tagName==='INPUT'){if(b.hasAttribute('value')&&a!==document.activeElement&&a.value!==b.getAttribute('value'))a.value=b.getAttribute('value');return}
  const ac=[...a.childNodes],bc=[...b.childNodes];
  for(let k=0;k<Math.max(ac.length,bc.length);k++){if(!ac[k])a.appendChild(bc[k]);else if(!bc[k])ac[k].remove();else morph(ac[k],bc[k])}}

  // someone else drops a row while its menu is open here: the menu closes, the toast says who and offers Put Back (job r12 #5)
  if(m==='arrivemenu'){S=fresh();S.mode='list';render();const r=document.querySelector('.row[data-id="2"]');if(r){r.scrollIntoView({block:'center'});r.querySelector('.kebab').click()}
    window.arriveT=setTimeout(()=>{const k=S.items.findIndex(i=>i.id===2);if(k<0)return;const x=S.items.splice(k,1)[0];S.dropped.unshift(x);closeMenu();render();
      toast(`Sarah dropped ${qty(x)} ${x.n}`,()=>{S.dropped=S.dropped.filter(y=>y!==x);x.isNew=true;S.items.splice(k,0,x);render()},'Put Back')},window.FREEZE?80:1500);return}
  if(m==='palong'){S=fresh();S.long=true;LONG.forEach(([a,ns])=>ns.forEach((nu,k)=>{const [n,u]=nu.split('|');S.items.push({id:S.next++,store:'Kroger',aisle:a,n,q:u.endsWith('s')?2:1,u,src:k%3?'plan':'staple',why:k%3?['Mon · Pasta night','Thu · Salmon bowls','Sun · Roast chicken'][k%3]:'Kitchen staple · running low'})}));setMode('put');return}
  if(m==='dropped'){S=fresh();[5,16].forEach(id=>{const k=S.items.findIndex(i=>i.id===id);S.dropped.push(S.items.splice(k,1)[0])});S.showDropped=true;render();const el=$('#dropped');if(el)el.scrollIntoView({block:'center'});return}
  if(['loading','offline','changed','costco','loadfail','onestore','long','arrive'].includes(m)){S=fresh();S.state=['costco','onestore','long'].includes(m)?null:m;
    if(m==='costco'){S.tab='Costco';S.items=S.items.filter(i=>i.store!=='Costco'&&i.store!=='Any')}
    if(m==='onestore'){S.stores=['Kroger'];S.items.forEach(i=>{if(i.store!=='Kroger')i.store='Kroger';if(i.aisle&&!AISLES.Kroger.includes(i.aisle))AISLES.Kroger.push(i.aisle)})}
    if(m==='long'){LONG.forEach(([a,ns])=>ns.forEach((nu,k)=>{const [n,u]=nu.split('|');S.items.push({id:S.next++,store:a==='Household'&&k?'Costco':'Kroger',aisle:a,n,q:u.endsWith('s')?2:1,u,src:k%3?'plan':'staple',why:k%3?['Mon · Pasta night','Thu · Salmon bowls','Sun · Roast chicken'][k%3]:'Kitchen staple · running low'})}));S.home.forEach(x=>{x.res='You have enough. It stays off the list.';x.resk='have'})}
    if(m==='offline'){S.items.unshift({id:301,store:'Kroger',aisle:'Produce',n:'lemons',q:2,u:'',src:'you',why:'Added by you · just now',pending:true})}
    S.mode='list';render();
    // someone else adds to the list while you look: the row slides in, the counts tick, a toast says who (job r9 #1)
    if(m==='arrive')window.arriveT=setTimeout(()=>{const x={id:402,store:'Kroger',aisle:'Produce',n:'limes',q:2,u:'',src:'you',who:'Sarah',why:'Added by Sarah · just now',isNew:true};S.items.push(x);render();toast('Sarah added 2 limes to Kroger')},window.FREEZE?50:1500);
    return}
  if(m==='live'||m==='finished')liveSetup(m);
  else if(m==='empty'){S=fresh();S.items=[];S.mode='list'}
  else if(m==='list'){if(S.phase!=='ready'||S.state||S.mode!=='list'||!S.items.length||S.note||S.member)S=fresh();S.mode='list'}
  else if(m==='put'){if(!S.items.some(i=>i.got)){S.items.filter(inTrip).forEach(i=>{if(!NOTFOUND.includes(i.id))i.got=true});if(!S.long)addLimes(false)}
    S.phase='ready';S.note=null;S.items.filter(inTrip).forEach(i=>{if(SWAP[i.id]&&i.got)S.sub[i.id]=SWAP[i.id]});
    if(S.pa[8]===undefined&&!S.asis&&S.items.find(i=>i.id===8).got)S.pa[8]=1;S.mode='put'}
  else S.mode=m;
  render();const sc=$('#scroll');if(sc)sc.scrollTop=0}
function mockBar(){const cur=S.member?'member':S.note?'done':S.state||(S.mode==='list'?(S.phase==='shopping'?'live':S.phase==='finished'?'finished':S.items.length?'list':'empty'):S.mode);
  $('#mock').innerHTML='<span>Mockup only:</span>'+[['list','The List'],['live','Someone Shopping'],['finished','Trip Finished'],['put','Put Away'],['done','Done'],['empty','Empty']]
   .map(([k,l])=>`<button data-mode="${k}" class="${cur===k?'on':''}">${l}</button>`).join('')+`<button data-a="mockmore" class="${MORE.some(x=>x[0]===cur)?'on':''}" aria-haspopup="menu">More ▾</button><button data-mode="reset" title="Start over" aria-label="Start over">↺</button>`}
// live demo: Maria taps things off at Kroger while you watch; the side card's "Just now" feed says so
setInterval(()=>{if(S.mode!=='list'||S.phase!=='shopping'||window.FREEZE)return;const n=S.items.find(i=>inTrip(i)&&!i.got);if(n){n.got=true;S.feed.forEach(f=>f.m++);S.feed.push({t:`<b>Maria</b> got ${esc(n.n)}`,m:0});render()}},4000);
const q=new URLSearchParams(location.search);
if(q.get('freeze'))window.FREEZE=true;
setMode(q.get('mode')||'list');
if(q.get('tab'))S.tab=q.get('tab'),render();
if(q.get('filter'))S.filter=q.get('filter'),render();
if(q.get('sheet')==='share'){S.shareStep=q.get('step')||'pick';if(S.shareStep==='show')S.links.push({code:'k7f2qa',len:'trip',store:'Kroger'});if(S.shareStep==='pin')S.pin=2;shareSheet()}
if(q.get('sheet')==='home'){if(q.get('some')){S.home[1].some=true;S.home[1].amt=.5}if(q.get('answered')){S.home[0].res='You have 1 cup. Added 1 bag flour to the list.';S.home[0].resk='buy';S.home[2].res='Sarah already said: you have enough. 2 min ago.';S.home[2].resk='have';S.home[2].by='Sarah'}homeSheet(q.get('some')?'#ck-102 .chip.on':undefined)}
if(q.get('sheet')==='stop'){openMenu($('[data-a="menu"]'),MAINMENU());$('#menu [data-a="stopask"]').click()}
if(q.get('sheet')==='putask'){openMenu($('[data-a="menu"]'),MAINMENU());$('#menu [data-a="putask"]').click()}
if(q.get('sheet')==='review')reviewSheet();
if(q.get('sheet')==='asis')$('[data-a="asis"]').click();
if(q.get('sheet')==='swap')swapSheet(S.items.find(i=>i.id===12));
if(q.get('type')){const i=$('#add');i.value=q.get('type');i.focus();renderSugg()}
if(q.get('menu'))openMenu($('[data-a="menu"]'),MAINMENU());
if(q.get('jumpmenu'))$('[data-a="jump"]').click();
if(q.get('place')){const b=document.querySelectorAll('[data-a="place"]')[+q.get('place')-1];if(b)b.click()}
if(q.get('rowmenu')){const r=document.querySelectorAll('.row[data-id][tabindex="0"]')[+q.get('rowmenu')];if(r){r.focus();r.querySelector('.kebab').click()}}
if(q.get('aislemenu')){const b=document.querySelector('[data-a="aislepick"]');if(b){b.scrollIntoView({block:'center'});b.click()}}
if(q.get('later')){S.items.find(i=>i.id===5).later=true;S.items.find(i=>i.id===16).later=true;S.more=true;render()}
</script>
