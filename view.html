<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desktop View</title>
<style>
html,body{margin:0;background:#2b2a27;color:#f3efe6;font:15px/1.4 system-ui,-apple-system,sans-serif}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 10px}
.bar a,.bar button{color:#f3efe6;background:#45433d;border:0;border-radius:6px;padding:6px 12px;font:inherit;text-decoration:none;cursor:pointer}
.bar span{opacity:.75;font-size:13px}
#box{position:relative;margin:0 8px 12px;overflow:hidden}
#f{position:absolute;left:0;top:0;border:0;background:#fff;transform-origin:0 0}
</style></head><body>
<div class="bar"><a href="javascript:history.back()">‹ Back</a><button id="t">Taller</button><button id="z">Zoom 2×</button><span id="s"></span></div>
<div id="box"><iframe id="f" title="Mockup"></iframe></div>
<script>
// Shows a same-site mockup at a real desktop size, scaled to fit any screen. ?u=<path>&w=1280&h=820
var q=new URLSearchParams(location.search);
var W=Math.max(600,Math.min(2000,parseInt(q.get('w')||'1280',10)||1280));
var H=Math.max(400,Math.min(3000,parseInt(q.get('h')||'820',10)||820));
var u=q.get('u')||'';
if(!/^[A-Za-z0-9._\-\/]+$/.test(u)||u.indexOf('..')>=0){u='';}
var f=document.getElementById('f'),box=document.getElementById('box'),s=document.getElementById('s');
var tall=false,zoom=1;
function size(){
  var h=tall?H*2:H;
  var fit=Math.min(1,(document.documentElement.clientWidth-16)/W)*zoom;
  f.style.width=W+'px';f.style.height=h+'px';f.style.transform='scale('+fit+')';
  box.style.width=Math.ceil(W*fit)+'px';box.style.height=Math.ceil(h*fit)+'px';
  s.textContent=W+'×'+h+' desktop · scroll inside it · pinch to zoom';
  document.getElementById('t').textContent=tall?'Normal':'Taller';
  document.getElementById('z').textContent=zoom>1?'Fit':'Zoom 2×';
}
document.getElementById('t').onclick=function(){tall=!tall;size();};
document.getElementById('z').onclick=function(){zoom=zoom>1?1:2;size();};
addEventListener('resize',size);size();
if(u){f.src=u;}else{s.textContent='No page given';}
</script>
</body></html>
